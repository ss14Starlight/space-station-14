name: Build & Test Debug

on:
  push:
    branches: [ master, staging, stable, Starlight, starlight-dev, upstream-devtest, fix/tests ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable, Starlight, starlight-dev, upstream-devtest ]

jobs:
  build:
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Archive build output
      run: tar czf /tmp/build.tar.gz --exclude='.git' .

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: /tmp/build.tar.gz
        retention-days: 1
        compression-level: 0

  content-tests:
    needs: build
    name: Content Tests
    runs-on: ubuntu-latest
    steps:
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: build-output

    - name: Extract build
      run: tar xzf build.tar.gz && rm build.tar.gz

    - name: Run Content.Tests
      run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj --logger trx -- NUnit.ConsoleOut=0

    - name: Test results
      continue-on-error: true
      if: always()
      run: |
        dotnet tool install -g dotnet-trx 2>/dev/null || true
        trx 2>/dev/null || true

  integration-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    name: "Integration Tests (shard ${{ matrix.shard }})"
    runs-on: ubuntu-latest
    steps:
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: build-output

    - name: Extract build
      run: tar xzf build.tar.gz && rm build.tar.gz

    - name: Discover Content.IntegrationTests
      id: discover-integration
      run: |
        dotnet test --list-tests --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj > /tmp/test_list.txt 2>&1 || true
        echo "::group::Raw test list output"
        head -50 /tmp/test_list.txt
        echo "::endgroup::"
        FILTER=$(python3 Tools/test_shard_filter.py ${{ matrix.shard }} 8 < /tmp/test_list.txt) || true
        echo "filter=$FILTER" >> "$GITHUB_OUTPUT"

    - name: Run Content.IntegrationTests
      if: steps.discover-integration.outputs.filter != ''
      env:
        DOTNET_gcServer: "1"
      run: |
        echo "::group::Test filter"
        echo "${{ steps.discover-integration.outputs.filter }}"
        echo "::endgroup::"
        dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --filter "${{ steps.discover-integration.outputs.filter }}" --logger trx -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed

    - name: Test results
      continue-on-error: true
      if: always()
      run: |
        dotnet tool install -g dotnet-trx 2>/dev/null || true
        trx 2>/dev/null || true

  ci-success:
    name: Build & Test Debug
    needs:
      - build
      - content-tests
      - integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
