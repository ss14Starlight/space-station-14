name: Update Changelog

on:
  push:
    branches:
      - Sol
      - sol-dev


permissions:
  contents: write
  pull-requests: read
  actions: read

env:
 BRANCH_NAME: ${{ github.ref_name	 }}

jobs:
  wait-for-que:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: |
          pip install PyGithub

      - name: Wait for Que to finish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          python ./Tools/_Starlight/wait_for_actions.py
          echo "Script exited with code $?"

  update-changelog:
    runs-on: ubuntu-latest
    needs: wait-for-que
    steps:
      - name: Authenticate as GitHub App for Changelog
        env:
          APP_ID: ${{ vars.CHANGELOG_APP_ID }}
          INSTALLATION_ID: ${{ vars.CHANGELOG_APP_INSTALLATION_ID }}
          PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
        run: |
          python3 -c '
          import os, time, json, base64, urllib.request
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding

          def b64(p): return base64.urlsafe_b64encode(p if isinstance(p, bytes) else p.encode()).decode().replace("=", "")
          
          header = json.dumps({"alg": "RS256", "typ": "JWT"})
          payload = json.dumps({"iat": int(time.time()) - 60, "exp": int(time.time()) + 600, "iss": os.environ["APP_ID"]})
          signing_input = f"{b64(header)}.{b64(payload)}".encode()
          
          signature = serialization.load_pem_private_key(os.environ["PRIVATE_KEY"].encode(), password=None).sign(signing_input, padding.PKCS1v15(), hashes.SHA256())
          jwt = f"{signing_input.decode()}.{b64(signature)}"

          req = urllib.request.Request(f"https://api.github.com/app/installations/{os.environ[\"INSTALLATION_ID\"]}/access_tokens", method="POST")
          req.add_header("Authorization", f"Bearer {jwt}")
          req.add_header("Accept", "application/vnd.github+json")
          
          with urllib.request.urlopen(req) as r:
              token = json.loads(r.read().decode())["token"]
              with open(os.environ["GITHUB_ENV"], "a") as f: f.write(f"GITHUB_TOKEN={token}\n")
          '

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get Pull Request Number via GH
        id: get_pr
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });
            if (pr.data.length === 0) {
              console.log("No PR found for this branch. Skipping changelog update.");
              return "";
            }
            console.log(`PR Number: ${pr.data[0].number}`);
            return pr.data[0].number;

      #re checkout
      - name: Re-checkout repository
        if: steps.get_pr.outputs.result != ''
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        if: steps.get_pr.outputs.result != ''
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install Dependencies
        if: steps.get_pr.outputs.result != ''
        run: |
          pip install pyyaml PyGithub

      - name: Parse PR and Update Changelog
        if: steps.get_pr.outputs.result != ''
        env:
          CHANGELOG_FILE_PATH: 'Resources/Changelog/ChangelogSol.yml'
          PR_NUMBER: ${{ steps.get_pr.outputs.result }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python ./Tools/_Sol/update_changelog.py
          echo "Script exited with code $?"

      - name: Display changelog after update
        if: steps.get_pr.outputs.result != ''
        run: |
          cat "Resources/Changelog/ChangelogSol.yml"

      - name: Git status before commit
        if: steps.get_pr.outputs.result != ''
        run: |
          git status

      - name: Commit and push changes
        if: steps.get_pr.outputs.result != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Resources/Changelog/ChangelogSol.yml"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git pull
            git commit -m "Update changelog for PR #${{ steps.get_pr.outputs.result }} [skip ci]"
            git push
          fi

