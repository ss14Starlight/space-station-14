- author: AprilCatStreams
  changes:
  - message: Added a full Virology department with job, access, lockers, loadouts,
      station staffing, and outbreak mode eligibility.
    type: Add
  - message: Added pathogen infection, transmission, incubation, organ damage, immunity,
      vaccines, and natural recovery.
    type: Add
  - message: Added airborne pathogen simulation with scrubbers, PPE sealing, surface
      contamination, and environmental sampling.
    type: Add
  - message: Added disease swabs, blood panels, centrifuges, diagnosers, and vaccinators
      for diagnosis and vaccine production.
    type: Add
  - message: Added surgical infection risk, sterile tools and gloves, washing/sterilization,
      and contextual surgery flow.
    type: Add
  - message: Added automatic fogging sterilization chambers with quarantine lock controls
      for Virology airlocks.
    type: Add
  - message: Added selectable character allergies with severity, reactions, health
      analyzer reporting, and Allergies SOP.
    type: Add
  - message: Added ceftriaxone, ribavirin, and treatment-specific pathogens including
      bacterial pneumonia, enteric fever, hemorrhagic virus, and neuroviral encephalitis.
    type: Add
  - message: Added Bioterrorists antagonist with clandestine lab tools for engineered
      pathogen strain creation and deployment.
    type: Add
  - message: Added Virology quarantine alarms, outbreak SOPs, Violet Alert updates,
      and expanded medical guidebook coverage.
    type: Add
  - message: Improved health analyzer organ and allergy display, printed reports,
      and diagnostic accuracy.
    type: Tweak
