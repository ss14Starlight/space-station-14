- author: wonderfulnewworld
  changes:
  - message: Medibots only inject 5u of Tricordrazine (Alive) now. Use them to stabilize critical patients with Inaprovaline (unchanged, 15u Critical) instead of relying on them to do your alive treatments.
    type: Tweak
  - message: Tricordrazine now has an OD effect (Slowdown) at 20u, and stops working entirely above 40u. Don't overrely on it!!!
    type: Tweak
  - message: Tricordrazine no longer works on digestion. No more drinking a ton of it to get prolonged healing.
    type: Tweak
  - message: The Doctor's Delight now has an OD effect (Slowdown) at 35u (so you can still drink a full glass), and stops working entirely at 40u.
    type: Tweak
  - message: Real Doctor injects Tricordrazine (Alive) instead of Omnizine (Alive), and Epinephrine (Critical) instead of Omnizine (Critical).
    type: Tweak
  - message: Real Doctor only costs 500 credits now.
    type: Tweak
