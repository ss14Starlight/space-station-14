- author: Conflee
  changes:
  - message: Added Bluespace Fire Extinguishers, a Science unlock under the Bluespace Storage research. It works like a normal extinguisher but can only hold space cleaner, syndicate space cleaner, and water, and it also regenerated water at 2u per second. Self-refilling! Needs 10 steel, 5 plasma, and 1 bluespace crystal to make in the Engie Tech Fab.
    type: Add
  id: 408424
  time: '2026-09-08T11:58:28.000000+00:00'
  url: https://github.com/ss14Starlight/space-station-14/pull/6027
- author: Conflee
  changes:
  - message: Added Halon Gas Grenades. Works like Air Grenades but with a small amount of Halon. One is enough to put out a welder bombing fire in medium sized rooms, and does 95% of the job even in very large rooms. Also works decently on small trit/plasma fires. 1 is in each atmos locker and evac repair locker.
    type: Add
  id: 408425
  time: '2026-09-08T11:58:28.000000+00:00'
  url: https://github.com/ss14Starlight/space-station-14/pull/6027
- author: Conflee
  changes:
  - message: Added a Cargo order for 'Atmos Gas Grenades Box', a box with 2 Halon Grenades, 4 Air Grenades, and 4 Metal Foam Grenades for $4200.
