- author: Rinary
  changes:
  - message: Changed ammo counter for revolvers, now it visualized as revolver drum.
    type: Tweak
  - message: Changed shotgun pellets, now default pellets will lose their damage as distance increases.
    type: Tweak
  - message: Changed shotgun pellets, now default pellets has worse armor penetration(however slug will breach armor).
    type: Tweak
  - message: Changed shotgun deviation, now it won't make big amount of pellets in one place.
    type: Tweak
  - message: "Added 2 new indicators on top of item preview: opened bolt and jammed, so now you can see when your weapon isn't bolted or jammed on sight."
    type: Add
  - message: 'Added ability to disable 2 new indicators, Added ability to disable item preview in combat or show only in combat(4 options: in combat, not in combat, always, never).'
    type: Add
  - message: Changed pistols accuracy options, now they're 100% accurate on first shot, however you anyway can't spam click.
    type: Tweak
  - message: Added heat gauge near ammo counter so now you will know which weapon has heat system and how much it heated, it also shows you when weapon jams or melts.
    type: Add
  - message: Added new heat shader for held sprite, so now you can see how heated weapon is held by your opponent.
    type: Add
  - message: "Changed lockers, now you also can flip them to use as cover(NOTE: only closed lockers, you can't open flipped locker, entity inside flipped locker can go out, but they will unflip locker)."
    type: Tweak
  - message: Changed crates/counters, now you can use them as cover but only when you're laying down.
    type: Tweak
  - message: Changed LR-30 balance, now it's burst weapon with 3 shots per second instead of 10.
    type: Tweak
  - message: Changed NPCs, now they will remember you if you'll try to hide in lockers while they're near you(i.e. they'll try to break or open locker to kill you if they're hostile, this works only if you done that on their eyes, so you anyway can hide from NPCs).
    type: Tweak
  - message: Changed NPCs , now they will see you through lockers/crates/vending machines, they'll break your "cover" first.
    type: Tweak
  - message: Added heat gauge near crosshair(you can disable it in settings).
    type: Add
  - message: Fixed some cases with shotgun/burst weaponry misspredicts.
    type: Fix
  - message: Fixed burst overall, now it will shoot even if you won't keep activated mouse button(i.e. 1 click, all burst), it won't fire 90 degrees up.
    type: Fix
  - message: Added prediction for sounds when shooting.
    type: Add
  - message: Fixed problems when firing pin can be melted from things like burning or explosion while it's in weapon(i.e. gun heat  only now).
    type: Fix
  - message: Added craft for unique pins, requires tier 3 research.
    type: Add
  - message: Added broken laser crystal which works the same as melted pin but for laser weaponry(before it also spawned melted firing pin).
    type: Add
  - message: You can again fast-swap modes for energy pistols by pressing interaction button.
    type: Tweak
  - message: Fixed bug when weapon disappears when trying to wield it, when it don't have any wield sprite.
    type: Fix
  - message: Added prediction for firing modes, so now instead of <whatever> laser you will see correct laser mode when shooting(was reported before that if you're shooting in taser mode you can see a laser from stun mode or kill mode and other such reports).
    type: Add
