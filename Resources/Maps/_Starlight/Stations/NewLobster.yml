      desc: He watched the mask trudge on through the bitter gales and the sweet petrichor, intoxicated by an enthusiasm, by their appetite for more. There came a point where he could no longer march by their side as the roads grew ever more serpentine, ever steeper, a rocky scree that not even he could overcome. When he called out for help, his voice was answered by a glassy-eyed stare until he slipped into the dark below.
      name: the father
