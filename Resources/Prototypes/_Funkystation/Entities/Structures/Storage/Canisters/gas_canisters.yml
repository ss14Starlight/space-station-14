# Funky atmos - /tg/ gases
- type: entity
  parent: GasCanister
  id: BZCanister
  name: баллон BZ
  components:
  - type: Sprite
    sprite: Structures/Storage/canister.rsi
    layers:
    - state: purple
  - type: GasCanister
    gasMixture:
    # Starlight-start: Canister volume
      volume: 1500
      moles:
        BZ: 2769.36
    # Starlight-end
      temperature: 293.15
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          BZCanisterBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:DumpCanisterBehavior
  - type: Lock
    locked: true

