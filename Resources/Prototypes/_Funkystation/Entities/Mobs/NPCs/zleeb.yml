- type: entity
  parent: SimpleMobBase
  id: MobZleeb
  name: zleeb zlorp
  description: A very small creature with a very important mission.
  components:
  - type: Sprite
    drawdepth: SmallMobs
    sprite: _Funkystation/Mobs/XenoArch/zleeb.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: ghost-role-information-zleeb-zlorb-name
    description: ghost-role-information-zleeb-zlorb-description
    rules: ghost-role-information-zleeb-zlorb-rules
  - type: GhostTakeoverAvailable
  - type: ReplacementAccent
    accent: glorpish
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 120
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobState
  - type: Deathgasp
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritFakeDeath
      - ActionCritLastWords
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Critical
      60: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: JuiceGrape
        Quantity: 150
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3
  - type: Extractable
    grindableSolutionName: food
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Blood
          Quantity: 55
        - ReagentId: Fat
          Quantity: 5
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 1
  - type: Tag
    tags:
    - VimPilot

- type: entity
  parent: MechVim
  id: MechZleeb
  name: zoop zib zob
  description: A strange space faring ship. It looks only big enough for a small creature.
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _Funkystation/Mobs/XenoArch/zleeb.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base" ]
      state: ship
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHoverXenoborg
  - type: Mech
    baseState: ship
    openState: ship
    brokenState: ship
    maxEquipmentAmount: 1
  - type: MeleeWeapon
    hidden: true
    attackRate: 0.5
    damage:
      types:
        Blunt: 5 #Bonk
    bluntStaminaDamageFactor: 2.0
  - type: StaminaDamageOnHit
    damage: 20
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.25
    baseSprintSpeed: 3.6
  - type: MovementAlwaysTouching
  - type: CanMoveInAir
  - type: NoSlip
  - type: PointLight
    mask: /Textures/Effects/LightMasks/double_cone.png
    color: "#881A4D"
    energy: 10
    radius: 5
    softness: 5
    offset: "0, 0.35"
  - type: RotatingLight
