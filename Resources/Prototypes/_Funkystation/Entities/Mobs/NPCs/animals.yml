#Weird Mice

- type: entity
  parent: MobMouse
  id: MobMouseBurnt
  description: Flammable. Squeak!
  suffix: FIRE!
  components:
  - type: Sprite
    sprite: _Funkystation/Mobs/Animals/mouse_burnt.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: mouse-burnt
  - type: SpriteMovement
    movementLayers:
      movement:
        state: mouse-moving-burnt
    noMovementLayers:
      movement:
        state: mouse-burnt
  - type: Clothing
    sprite: _Funkystation/Mobs/Animals/mouse_burnt.rsi
    equippedPrefix: burnt
  - type: DamageStateVisuals
    states:
      Alive:
        Base: mouse-burnt
      Critical:
        Base: dead-burnt
      Dead:
        Base: splat-burnt
  - type: Item
    size: Tiny
    heldPrefix: burnt
  - type: AlwaysHot
  - type: IgnitionSource #Todo make this fucker light you on fire if you touch them
    temperature: 800
    ignited: true
  - type: FireProtection
    reduction: 1 #Its on fire constantly
  - type: PointLight
    color: Red
    radius: 3
    energy: 4
    netsync: false

- type: entity
  parent: MobMouse
  id: MobMouseRGB
  suffix: RGB
  components:
  - type: PointLight
    radius: 1.5
    energy: 2
  - type: RgbLightController
    layers: [ 0 ]

- type: entity
  parent: MobMouse1
  id: MobMouseStealth
  suffix: Stealth
  components:
  - type: Stealth
    hadOutline: true
  - type: StealthOnMove
    passiveVisibilityRate: -0.15 # Its a mouse it should still be able to be found decently easy
    movementVisibilityRate: 0.20

- type: entity
  parent: MobMouse
  id: MobMouseSnouse
  name: snouse
  description: Developed by Interdyne as one of their many attempts to stifle the ever-present problem of pests on agri-worlds, the Snouse is a transgenic organism intended to interfere and mingle with existing rodent populations. Populations of these were released into farming communities alongside Snoths in hopes they would pass on the snail genes, making future generations of pests unable to escape from traps and other forms of pest control. Unfortunately, this attempt proved futile as the hardened shells of these organisms made them resistant to commonly available mousetraps. Interdyne then moved onto their next attempt at solving the pest problem, the meowl.
  components:
  - type: Sprite
    sprite: _Funkystation/Mobs/Animals/snouse.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: snouse
  - type: SpriteMovement
    movementLayers:
      movement:
        state: snouse
    noMovementLayers:
      movement:
        state: snouse
  - type: DamageStateVisuals
    states:
      Alive:
        Base: snouse
      Critical:
        Base: crit-snouse
      Dead:
        Base: dead-snouse

