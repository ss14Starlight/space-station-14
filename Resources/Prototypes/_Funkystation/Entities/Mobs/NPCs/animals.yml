    layers:
      - map: ["enum.DamageStateVisualLayers.Base"]
        state: cow
        sprite: _Funkystation/Mobs/Animals/chocolate_cow.rsi
  - type: SolutionManager
    solutions:
    - SolutionUdderChocolate
  - type: Udder
    reagentId: MilkChocolate
