- type: entity
  parent: BaseItem
  id: GassyStoneBase
  name: strange stone
  description: A small stone that is exceptionally dry to the touch. Despite having no pores, it seems to be emitting a small amount of gas.
  suffix: ARTIFACT
  abstract: true
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/XenoArch/atmos_stone.rsi
    state: icon
  - type: Item
    sprite: _Funkystation/Objects/XenoArch/atmos_stone.rsi
    size: Tiny
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/metal_slam4.ogg
      params:
        volume: -2
  - type: Damageable
    damageModifierSet: Rock
  - type: Injurable
    damageContainer: Inorganic

- type: entity
  parent: GassyStoneBase
  id: GassyStoneWaterVapor
  suffix: Water Vapor
  components:
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [ Touch ]
    reactions:
    - reagents: [ Water ]
      methods: [ Touch ]
      effects:
      - !type:CreateGas
        gas: WaterVapor

