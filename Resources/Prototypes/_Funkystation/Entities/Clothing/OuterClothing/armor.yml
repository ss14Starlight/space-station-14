# Funky atmos - metal hydrogen
- type: entity
  parent: ClothingOuterArmorBase
  id: ClothingOuterArmorMetalHydrogen
  name: metal hydrogen armor
  description: Handmade armor made from metal hydrogen. Despite the crude construction, the incredible density gives it great kinetic and thermal absorption.
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/OuterClothing/Armor/metal_hydrogen_armor.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/OuterClothing/Armor/metal_hydrogen_armor.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.55
        Piercing: 0.55
        Heat: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.90
  - type: StaminaResistance
    damageCoefficient: 0.75
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: Construction
    graph: MetalHydrogenArmor
    node: armor
  - type: Tag
    tags:
      - MetalHydrogenArmor

- type: entity
  parent: [ClothingOuterBaseLarge, AllowSuitStorageClothing]
  id: ClothingOuterArmorAtmosian
  name: atmosian armor
  description: An atmos fire suit reinforced with incredibly heav metal hydrogen for the real pipe knights among us.
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/OuterClothing/Armor/atmosian_armor.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/OuterClothing/Armor/atmosian_armor.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.05
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.55
        Piercing: 0.55
        Heat: 0.45
        Cold: 0.80
  - type: ExplosionResistance
    damageCoefficient: 0.60
  - type: FireProtection
    reduction: 0.9
  - type: StaminaResistance
    damageCoefficient: 0.75
  - type: ClothingSpeedModifier
    walkModifier: 0.65
    sprintModifier: 0.65
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetAtmosian
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
  - type: GroupExamine
  - type: ProtectedFromStepTriggers
    slots: WITHOUT_POCKET
  - type: Construction
    graph: AtmosianArmor
    node: armor
