# Funky atmos - metal hydrogen
- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHelmetMetalHydrogen
  name: metal hydrogen helmet
  description: A makeshift helmet made from metal hydrogen. Very heavy but protects your noggin.
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/Head/Helmets/metal_hydrogen_helmet.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/Head/Helmets/metal_hydrogen_helmet.rsi
  - type: IngestionBlocker
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.8
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
  - type: Construction
    graph: MetalHydrogenHelmet
    node: helmet
  - type: Tag
    tags:
      - MetalHydrogenHelmet

#Atmos Fire Helmet
- type: entity
  parent: [ ClothingHeadLightBase, ClothingHeadLightParamsIntermediate, BaseEngineeringContraband ] # Starlight
  id: ClothingHeadHelmetAtmosian
  name: atmosian helmet
  description: An atmos fire helmet reinforced with metal hydrogen.
  components:
  - type: Sprite
    sprite: Clothing/Head/Helmets/atmos_firehelmet.rsi
  - type: Clothing
    sprite: Clothing/Head/Helmets/atmos_firehelmet.rsi
    quickEquip: true
  - type: IngestionBlocker
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.8
  - type: TemperatureProtection
    heatingCoefficient: 0.3
    coolingCoefficient: 0.8
  - type: FireProtection
    reduction: 0.2
  - type: PressureProtection
    highPressureMultiplier: 0.2
    lowPressureMultiplier: 1000
  - type: IdentityBlocker
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
  - type: BreathMask
  - type: PointLight # Starlight
    color: "#a1f7f7" # Starlight
