# Funky atmos - /tg/ gases
- type: reagent
  id: BZ
  name: reagent-name-bz
  desc: reagent-desc-bz
  physicalDesc: reagent-physical-desc-gaseous
  flavor: bitter
  color: "#90560b"
  metabolisms:
    Respiration: # Starlight
      effects:
      - !type:Emote
        conditions:
        - !type:ReagentCondition
          reagent: BZ
          min: 0.2
        - !type:MetabolizerTypeCondition
          type: [Slime]
          inverted: true
        emote: Cough
        showInChat: true
        probability: 0.1

      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: BZ
          min: 1
        - !type:MetabolizerTypeCondition
          type: [Slime]
          inverted: true
        ignoreResistances: true
        damage:
          types:
            Cellular: 0.01


      - !type:ModifyStatusEffect
        minScale: 0.6
        effectProto: StatusEffectSeeingRainbow
        type: Add
        time: 15

      - !type:Emote
        conditions:
        - !type:ReagentCondition
          reagent: BZ
          min: 0.2
        - !type:MetabolizerTypeCondition
          type: [Slime]
        emote: Laugh
        showInChat: true
        probability: 0.1

      - !type:Emote
        conditions:
        - !type:ReagentCondition
          reagent: BZ
          min: 0.2
        - !type:MetabolizerTypeCondition
          type: [Slime]
        emote: Scream
        showInChat: true
        probability: 0.01

      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: BZ
          min: 0.5
        - !type:MetabolizerTypeCondition
          type: [Slime]
        - !type:BloodReagentCondition
          reagent: NitrosylPlasmide
          max: 0.1
        type: Local
        visualType: Medium
        messages: [ "effect-sleepy" ]
        probability: 0.1


      - !type:MovementSpeedModifier
        minScale: 1
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Slime ]
          inverted: true
        - !type:BloodReagentCondition #  Funky atmos - /tg/ gases
          reagent: NitrosylPlasmide
          max: 0.1
        walkSpeedModifier: 0.65
        sprintSpeedModifier: 0.65

      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: BZ
          min: 1
        - !type:MetabolizerTypeCondition
          type: [Slime]
        - !type:BloodReagentCondition
          reagent: NitrosylPlasmide
          max: 0.1
        effectProto: StatusEffectForcedSleeping
        type: Update
        time: 10

      - !type:AdjustReagent
        conditions:
        - !type:ReagentCondition
          reagent: BZ
          min: 0.1
        reagent: BZMetabolites
        amount: 1.8

- type: reagent # Starlight Start: Nitrium basically completely reworked. Nitrosyl plasmide does the actual heavy lifting mechanically.
  id: Nitrium
  name: reagent-name-nitrium
  desc: reagent-desc-nitrium
  physicalDesc: reagent-physical-desc-gaseous
  flavor: sour
  color: "#fa8072"
  metabolisms:
    Respiration:
      effects:
      - !type:AddReagentToBloodstream
        conditions:
        - !type:ReagentCondition
          reagent: Nitrium
          min: 1
          max: 5
        reagent: NitrosylPlasmide
        amount: .5
        maxScale: 2

      - !type:AddReagentToBloodstream
        conditions:
        - !type:ReagentCondition
          reagent: Nitrium
          min: 5
          max: 10
        reagent: NitrosylPlasmide
        amount: 1
        maxScale: 2

      - !type:AddReagentToBloodstream
        conditions:
        - !type:ReagentCondition
          reagent: Nitrium
          min: 10
        reagent: NitrosylPlasmide
        amount: 1.5
        maxScale: 2

      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: Nitrium
          min: 5
        key: Stutter
        component: StutteringAccent
        time: 5 # Starlight End

- type: reagent
  id: Pluoxium
  name: reagent-name-pluoxium
  desc: reagent-desc-pluoxium
  physicalDesc: reagent-physical-desc-gaseous
  flavor: bitter
  color: "#7b68ee"
  metabolisms:
    Respiration: # Starlight
      effects:
      - !type:Oxygenate
        factor: 8
        conditions:
        - !type:MetabolizerTypeCondition
          type: [Human]

      - !type:Oxygenate
        factor: 8
        conditions:
        - !type:MetabolizerTypeCondition
          type: [Animal]

      - !type:Oxygenate
        factor: 8
        conditions:
        - !type:MetabolizerTypeCondition
          type: [Rat]

      - !type:Oxygenate
        factor: 8
        conditions:
        - !type:MetabolizerTypeCondition
          type: [Plant]

      # Starlight start, Neocytes
      - !type:Oxygenate
        factor: 8
        conditions:
        - !type:MetabolizerTypeCondition
          type: [Neocyte]
      # Starlight end

      - !type:ModifyLungGas
        ratios:
          CarbonDioxide: 1.0
          Pluoxium: -1.0

