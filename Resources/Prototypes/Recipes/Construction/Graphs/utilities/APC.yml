- type: constructionGraph
  id: APC
  start: start
  graph:
    - node: start
      edges:
        - to: apcFrame
          steps:
            - material: Steel
              amount: 3

    - node: apcFrame
      entity: APCFrame
      edges:
        - to: apc
          steps:
            - component: ApcElectronics
              name: construction-graph-component-apc-electronics
              icon:
                sprite: "Objects/Misc/module.rsi"
                state: "charger_APC"
              doAfter: 2

        #region Starlight
        - to: apcAdvancedFrame
          steps:
            - material: Plasteel
              amount: 2
              doAfter: 1
        #endregion Starlight
        - to: start
          completed:
            - !type:GivePrototype
              prototype: SheetSteel1
              amount: 3
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 2

    #region Starlight
    - node: apcAdvancedFrame
      entity: APCAdvancedFrame
      edges:
        - to: apcAdvanced
          steps:
            - tag: ApcAdvancedElectronics
              name: construction-graph-component-advanced-apc-electronics
              icon:
                sprite: "Objects/Misc/module.rsi"
                state: "engineering"
              doAfter: 2

        - to: apcFrame
          completed:
            - !type:GivePrototype
              prototype: SheetPlasteel1
              amount: 2
          steps:
            - tool: Welding
              doAfter: 2
      #endregion Starlight

    - node: apc
      entity: APCConstructed
      edges:
        - to: apcFrame
          completed:
            - !type:GivePrototype
              prototype: APCElectronics
              amount: 1
          conditions:
            - !type:WirePanel
              open: true
          steps:
            - tool: Prying
              doAfter: 4

    #region Starlight
    - node: apcAdvanced
      entity: APCAdvancedConstructed
      edges:
        - to: apcAdvancedFrame
          completed:
            - !type:GivePrototype
              prototype: APCAdvancedElectronics
              amount: 1
          conditions:
            - !type:WirePanel
              open: true
          steps:
            - tool: Prying
              doAfter: 4
      #endregion Starlight
