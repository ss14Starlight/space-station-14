- type: plushieCatalog
  id: Default
  limits:
    slots: 4
    maxOffset: 10
    phrases: 4
    phraseLength: 60
    spriteSize: 32

  tints:
  - id: body
    name: Body & fur
    palette:
    - "#e8d5b7"
    - "#c9a37a"
    - "#8d6547"
    - "#5c4433"
    - "#cfd6dd"
    - "#8fb6a2"
    - "#b98ba8"
    - "#6f7fa8"
  - id: hair
    name: Hair & marks
    palette:
    - "#2b2b2f"
    - "#6b4a2f"
    - "#c8a24a"
    - "#d6d6d6"
    - "#8c3b3b"
    - "#3f6b8c"
    - "#5a3b6b"
    - "#3f7a55"
  - id: cloth
    name: Clothes
    palette:
    - "#cfd6dd"
    - "#9aa4b0"
    - "#5b6472"
    - "#2f3742"
    - "#7d5a3c"
    - "#3f6b8c"
    - "#7a3b46"
    - "#4f7a52"

  sounds:
  - id: squeak
    name: Squeak
    note: classic plushie
    sound:
      collection: ToySqueak
  - id: squeeze
    name: Squeeze
    note: soft air
    sound:
      path: /Audio/Effects/squeak1.ogg
  - id: honk
    name: Honk
    note: loud
    sound:
      path: /Audio/Items/Toys/pushHornHonk.ogg
  - id: chirp
    name: Chirp
    note: bright
    sound:
      path: /Audio/Animals/nymph_chirp.ogg
  - id: purr
    name: Purr
    note: low, warm
    sound:
      path: /Audio/_FarHorizons/Voice/Proto/Felionoid/cat_purr1.ogg
  - id: rattle
    name: Rattle
    note: beads inside
    sound:
      path: /Audio/Items/Toys/rattle.ogg
  - id: bell
    name: Bell
    note: single ring
    sound:
      path: /Audio/Items/desk_bell_ring.ogg
  - id: boop
    name: Boop
    note: short blip
    sound:
      path: /Audio/Effects/Diseases/beepboop.ogg

  # bottom to top
  layers:
  - id: base
    name: Body
    rsi: _Starlight/Plushies/bases.rsi
    tint: body
    required: true
    offsettable: false
    sprites:
    - id: base_1
      name: Base 1

  - id: tails
    name: Tail
    rsi: _Starlight/Plushies/tails.rsi
    tint: body
    sprites:
    - id: arachnid
