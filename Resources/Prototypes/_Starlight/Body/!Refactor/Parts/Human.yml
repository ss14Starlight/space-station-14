  id: SLPartHumanArm
  parent: [SLPartHumanBase, SLPartHumanoidArm]
  name: "human arm"
  components:
  - type: SLBodyPart
    partType: HumanoidArm
    sockets:
      Hand: HumanoidHandSocket
  - type: BodyPartVisualizer
    bodyVisualLayers:
      body_lArm:
        sprite:
          sprite: Mobs/Species/Human/parts.rsi
          state: l_arm
      body_rArm:
        sprite:
          sprite: Mobs/Species/Human/parts.rsi
          state: r_arm
    socketLayers:
      LeftArm: [ body_lArm ]
      RightArm: [ body_rArm ]

