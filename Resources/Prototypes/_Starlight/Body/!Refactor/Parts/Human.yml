- type: entity
  id: SLPartHumanBase
  parent: SLPartHumanoidBase #bodyparts are not items, they always live inside a body which MAY be an item!
  name: "human body part"
  abstract: true
  components:
  - type: SLBodyPart
    partType: HumanoidGeneric

- type: entity
  id: SLPartHumanEyes
  parent: SLPartHumanBase
  name: "human eyes"
  components:
  - type: SLBodyPart
    partType: HumanoidEye
  - type: BodyPartVisualizer
    bodyVisualLayers:
      body_eyes:
        sprite:
          sprite: Mobs/Customization/eyes.rsi
          state: eyes
        colorSource: HumanEyeColor
      body_other:
        sprite:
          sprite: Mobs/Species/Human/organs.rsi
          state: eyeball-l
        colorSource: HumanSkinColor
    socketLayers:
      root: [ body_other ]
      Eyes: [ body_eyes ]

- type: entity
  id: SLPartHumanTorso
  parent: [SLPartHumanBase, SLPartHumanoidTorso]
  name: "human torso"
  components:
  - type: SLBodyPart
    partType: HumanoidTorso
    sockets:
      Head: HumanoidHeadSocket
      LeftArm: HumanoidArmSocket
      RightArm: HumanoidArmSocket
      LeftLeg: HumanoidLegSocket
      RightLeg: HumanoidLegSocket
      RightWing: HumanoidWingSocket
      LeftWing: HumanoidWingSocket
      Tail: HumanoidTailSocket
  - type: BodyPartVisualizer
    markingSets:
    - HumanChest
    # - HumanUndergarmentTop
    # - HumanUndergarmentBottom
    - HumanTail
    bodyVisualLayers:
      body_chest:
        sprite:
          sprite: Mobs/Species/Human/parts.rsi
          state: torso_m
        colorSource: HumanSkinColor

- type: entity
  id: SLPartHumanHead
  parent: [SLPartHumanBase, SLPartHumanoidHead]
  name: "human head"
  components:
  - type: SLBodyPart
    partType: HumanoidHead
  - type: BodyPartVisualizer
    markingSets:
    - HumanHair
    - HumanFacialHair
    - HumanHeadTop
    - HumanSnout
    bodyVisualLayers:
      body_head:
        sprite:
          sprite: Mobs/Species/Human/parts.rsi
          state: head_m
        colorSource: HumanSkinColor
      body_hair:
        sprite:
          sprite: Mobs/Customization/human_hair.rsi
          state: bald
        colorSource: HumanHairColor
      body_facialHair:
        sprite:
          sprite: Mobs/Customization/human_facial_hair.rsi
          state: shaved
        colorSource: HumanFacialHairColor

