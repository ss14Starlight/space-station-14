      - right hand
    left arm:
      part: LeftArmArachnid
      connections:
      - left hand
    right hand:
      part: RightHandArachnid
      organs:
        hand_implant: null
    left hand:
      part: LeftHandArachnid
      organs:
        hand_implant: null
    right leg:
