- type: entity
  id: PartDoll
  parent: [BaseItem, BasePart]
  name: "doll body part"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: UncookedAnimalProtein
        Quantity: 10
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoDoll
  name: "doll torso"
  parent: [PartDoll, BaseTorso]
  components:
    - type: Sprite
      sprite: _Starlight/Mobs/Species/Doll/parts.rsi
      state: "torso"
    - type: Icon
      sprite: _Starlight/Mobs/Species/Doll/parts.rsi
      state: "torso"
    - type: Extractable
      juiceSolution:
        reagents:
        - ReagentId: UncookedAnimalProtein
          Quantity: 20
        - ReagentId: Fat
          Quantity: 20
        - ReagentId: Blood
          Quantity: 40

