- type: entity
  id: PartExperiment
  parent: [BaseItem, BasePart]
  name: "experiment body part"
  abstract: true
  components:
  - type: Damageable
    damageContainer: Biological
  - type: SLBodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice
    price: 100
  - type: Tag
    tags:
      - Trash
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 1
      - ReagentId: Blood
        Quantity: 5

- type: entity
  id: TorsoExperiment
  name: "experiment torso"
  parent: [PartExperiment, BaseTorso]
  components:
    - type: Sprite
      sprite: _Starlight/Mobs/Species/Experiment/parts.rsi
      state: "torso"
    - type: Icon
      sprite: _Starlight/Mobs/Species/Experiment/parts.rsi
      state: "torso"
    - type: SLBodyPart
      partType: Torso
    - type: Extractable
      juiceSolution:
        reagents:
        - ReagentId: Fat
          Quantity: 1
        - ReagentId: Blood
          Quantity: 5

- type: entity
