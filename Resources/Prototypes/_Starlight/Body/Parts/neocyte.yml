- type: entity
  id: PartNeocyte
  parent: [BaseItem, BasePart]
  name: protogen body part
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: BatteryAcid
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoNeocyte
  name: neocyte torso
  parent: [PartNeocyte, BaseTorso]
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/Protogen/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: BatteryAcid
        Quantity: 15
      - ReagentId: Blood
        Quantity: 20

- type: entity
  id: HeadNeocyte
  name: neocyte head
  parent: [PartNeocyte, BaseHead]
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/Protogen/parts.rsi
    state: "head_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: BatteryAcid
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10

