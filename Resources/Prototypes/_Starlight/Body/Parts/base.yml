    partType: Head
  - type: BodyPartDamage
    maxHealth: 80
    maxIntegrity: 100
    integrity: 100
    hitWeight: 15
    minDestroyingHit: 25
    armorSlots:
    - HEAD
    - EYES
    - EARS
    - MASK
  - type: Input
    context: "ghost"

