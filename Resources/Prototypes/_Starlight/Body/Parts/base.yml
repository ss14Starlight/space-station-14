- type: entity
  id: BasePart
  parent: BaseItem
  name: "body part"
  abstract: true
  components:
  - type: SurgeryTarget
  - type: BaseLayerId
  - type: Damageable
    damageContainer: Biological
  - type: SLBodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice
    price: 100
  - type: Tag
    tags:
      - Trash
  - type: UserInterface
    interfaces:
      enum.SurgeryUIKey.Key:
        type: SurgeryBui

- type: entity
  id: BaseTorso
  name: "torso"
  parent: BasePart
  abstract: true
  components:
  - type: SLBodyPart
    partType: Torso
  - type: BodyPartDamage
    maxHealth: 150
    maxIntegrity: 200
    integrity: 200
    hitWeight: 40
    minDestroyingHit: 60
    destroyedBy:
    - Blunt
    - Piercing
    armorSlots:
    - OUTERCLOTHING
    - OUTERCLOTHING2
    - INNERCLOTHING
    - NECK
    - BACK
    - BELT

- type: entity
  id: BaseHead
  name: "head"
  parent: BasePart
  abstract: true
  components:
