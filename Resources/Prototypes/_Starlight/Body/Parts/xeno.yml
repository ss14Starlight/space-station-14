- type: entity
  id: PartXeno
  parent: [BaseItem, BasePart]
  name: "xeno body part"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 5
      - ReagentId: FluorosulfuricAcid
        Quantity: 10

- type: entity
  id: TorsoXeno
  name: "xeno torso"
  parent: [PartXeno, BaseTorso]
  components:
    - type: Sprite
      sprite: _Starlight/Mobs/Species/Xeno/parts.rsi
      state: "torso_f"
    - type: Icon
      sprite: _Starlight/Mobs/Species/Xeno/parts.rsi
      state: "torso_f"
    - type: Extractable
      juiceSolution:
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 10
        - ReagentId: FluorosulfuricAcid
          Quantity: 20
    - type: LimbItemStorage
      items:
        - XenoTailSpear
    - type: LimbItemDeployer
      isCybernetic: false
      blockedByCuffs: true
      action: ActionToggleXenoTail
      sound:
        collection: XenoGrowl
      handWhitelist:
        tags:
          - Spear

- type: entity
  id: HeadXeno
  name: "xeno head"
  parent: [PartXeno, BaseHead]
