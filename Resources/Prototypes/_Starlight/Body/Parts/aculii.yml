- type: entity
  id: PartAculii
  parent: [BaseItem, BasePart]
  name: "aculii body part"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoAculii
  name: "aculii torso"
  parent: [PartAculii, BaseTorso]
  components:
  - type: Sprite
    sprite: Mobs/Species/Aculii/parts.rsi
    state: "torso_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20


