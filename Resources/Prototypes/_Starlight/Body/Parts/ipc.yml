# IPC Body Parts
# SOURCE: Far-Horizons-SS14
# https://github.com/Far-Horizons-SS14/Far-Horizons-SS14
# _STARLIGHT: No modifications

- type: entity
  id: PartIPC
  parent: BaseItem
  name: "ipc body part"
  abstract: true
  components:
  - type: Sprite
    netsync: false
    sprite: _Starlight/Mobs/Species/IPC/parts.rsi
  - type: Icon
    sprite: _Starlight/Mobs/Species/IPC/parts.rsi
  - type: Damageable
    damageContainer: Silicon
  - type: BodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []

- type: entity
  id: TorsoIPC
  name: "ipc chassis"
  parent: PartIPC
  components:
  - type: Sprite
    state: "torso_m"
  - type: Icon
    state: "torso_m"
  - type: BodyPart
    partType: Torso

- type: entity
  id: HeadIPC
  name: "ipc head"
  parent: PartIPC
  components:
  - type: Sprite
    state: "head_m"
  - type: Icon
    state: "head_m"
  - type: BodyPart
    partType: Head
    vital: true
  - type: Input
    context: "ghost"
  - type: InputMover
  - type: GhostOnMove

- type: entity
  id: LeftArmIPC
  name: "left ipc arm"
  parent: PartIPC
  components:
  - type: Sprite
    state: "l_arm"
  - type: Icon
    state: "l_arm"
  - type: BodyPart
    partType: Arm
    symmetry: Left

- type: entity
  id: RightArmIPC
  name: "right ipc arm"
  parent: PartIPC
  components:
  - type: Sprite
    state: "r_arm"
  - type: Icon
    state: "r_arm"
  - type: BodyPart
    partType: Arm
    symmetry: Right

- type: entity
  id: LeftHandIPC
  name: "left ipc hand"
  parent: PartIPC
  components:
  - type: Sprite
    state: "l_hand"
  - type: Icon
    state: "l_hand"
  - type: BodyPart
    partType: Hand
    symmetry: Left

- type: entity
  id: RightHandIPC
  name: "right ipc hand"
  parent: PartIPC
  components:
  - type: Sprite
    state: "r_hand"
  - type: Icon
    state: "r_hand"
  - type: BodyPart
    partType: Hand
    symmetry: Right

- type: entity
  id: LeftLegIPC
  name: "left ipc leg"
  parent: [PartIPC, BaseLeftLeg]
  components:
  - type: Sprite
    state: "l_leg"
  - type: Icon
    state: "l_leg"
  - type: BodyPart
    partType: Leg
    symmetry: Left

- type: entity
  id: RightLegIPC
  name: "right ipc leg"
  parent: [PartIPC, BaseRightLeg]
  components:
  - type: Sprite
    state: "r_leg"
  - type: Icon
    state: "r_leg"
  - type: BodyPart
    partType: Leg
    symmetry: Right

- type: entity
  id: LeftFootIPC
  name: "left ipc foot"
  parent: [PartIPC, BaseLeftFoot]
  components:
  - type: Sprite
    state: "l_foot"
  - type: Icon
    state: "l_foot"
  - type: BodyPart
    partType: Foot
    symmetry: Left

- type: entity
  id: RightFootIPC
  name: "right ipc foot"
  parent: [PartIPC, BaseRightFoot]
  components:
  - type: Sprite
    state: "r_foot"
  - type: Icon
    state: "r_foot"
  - type: BodyPart
    partType: Foot
    symmetry: Right
