- type: entity
  id: PartPlasmaman
  parent: [BaseItem, BasePart]
  name: "plasmaman body part"
  abstract: true
  components:
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Plasmaman
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Plasma
        Quantity: 8

- type: entity
  id: TorsoPlasmaman
  name: "plasmaman torso"
  parent: [PartPlasmaman, BaseTorso]
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Plasmaman/parts.rsi
    state: torso
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Plasma
        Quantity: 20

