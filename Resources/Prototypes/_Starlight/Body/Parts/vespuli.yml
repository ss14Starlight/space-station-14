- type: entity
  id: PartVespuli
  parent: [BaseItem, BasePart]
  name: "vespuli body part"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoVespuli
  name: "vespuli torso"
  parent: [PartVespuli, BaseTorso]
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Vespuli/parts.rsi
    state: "torso"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20


