- type: entity
  id: BaseEntityBrainImplant
  abstract: true
  parent: [ BaseItem, BaseImplant ]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/implants.rsi
  - type: Organ
  - type: BrainImplant
  - type: FlavorProfile
    flavors:
      - people

- type: entity
  id: BrainImplantTranslator
  name: translator implant
  description: Translates from your language to galactic common right in your brain!
  parent: BaseEntityBrainImplant
  components:
  - type: Sprite
    state: brain_implant_translator
  - type: FunctionalOrgan
    comps:
    - type: IntrinsicTranslator
      spoken:
      - GalacticCommon
      understood:
      - GalacticCommon

- type: entity
  id: BrainImplantCommsExpedition
  name: expedition radio implant
  description: A handy implant for the salvager of the modern age.
  parent: BaseEntityBrainImplant
  components:
  - type: Sprite
    state: brain_implant_comms_exped
  - type: FunctionalOrgan
    comps:
    - type: TelecomExempt
    - type: ActiveRadio
      channels:
      - Expedition
    - type: IntrinsicRadioReceiver
    - type: IntrinsicRadioTransmitter
      channels:
      - Expedition

- type: entity
  id: BrainImplantComms
  name: integrated radio implant
  description: A headset, right in your brain!
  parent: BaseEntityBrainImplant
  components:
  - type: Sprite
    state: brain_implant_comms
  - type: EncryptionKeyHolder
    keySlots: 4
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: FunctionalOrgan
    comps:
    - type: ActiveRadio
    - type: IntrinsicRadioReceiver
    - type: IntrinsicRadioTransmitter
    - type: EncryptionKeyHolder
      keySlots: 4
      canBeExamined: false


- type: entity
  id: BrainImplantNexus
  name: Nexus uplink
  description: A weird piece of Avali tech... Gives you access to the Nexus!
  parent: BaseEntityBrainImplant
  components:
  - type: Sprite
    state: brain_implant_nexus
  - type: FunctionalOrgan
    comps:
    - type: IntrinsicTranslator
      spoken:
      - Nexus
      understood:
      - Nexus

- type: entity
  id: BrainImplantPacifism
  name: Pacifism implant
  description: A high-tech implant that prevents you from harming others. It will not allow you to attack, even in self-defense.
  parent: BaseEntityBrainImplant
  components:
  - type: Sprite
    state: brain_implant_comms
  - type: FunctionalOrgan
    comps:
    - type: Pacified
