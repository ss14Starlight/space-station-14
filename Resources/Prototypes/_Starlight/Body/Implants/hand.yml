- type: entity
  id: BaseEntityHandImplant
  abstract: true
  parent: [ BaseItem, BaseImplant ]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/implants.rsi
  - type: Organ
  - type: HandImplant
  - type: FlavorProfile
    flavors:
      - people

- type: entity
  id: HandImplantInsulated
  name: insulation implant
  description: A surgically-installed hand implant that insulates against electricity.
  parent: BaseEntityHandImplant
  components:
  - type: Sprite
    state: hand_implant_insulated
  - type: FunctionalOrgan
    comps:
    - type: Insulated

- type: entity
  id: HandImplantForensics
  name: forensics implant
  description: A surgically-installed hand implant that removes your fingerprints, meaning you'll leave no trace at the scene of the crime... as long as you don't mind not being able to open your mail.
  parent: BaseEntityHandImplant
  components:
  - type: Sprite
    state: hand_implant_forensics
  - type: FunctionalOrgan
    comps:
    - type: FingerprintMask

- type: entity
  id: HandImplantClaws
  name: claws implant
  description: A surgically-installed hand implant that provides sharp retractable claws.
  parent: BaseEntityHandImplant
  components:
  - type: Sprite
    state: hand_implant_claws
  - type: FunctionalOrgan
    comps:
    - type: InherentAction
      action: ActionRetractableItemAdvancedClaws

- type: entity
  id: HandImplantThrusters
  name: thruster implant
  description: A surgically-installed hand implant that allows the user to maneuver in space as if they had a jetpack, thanks to wrist-mounted micro-thrusters.
  parent: BaseEntityHandImplant
  components:
  - type: Sprite
    state: hand_implant_thrusters
  - type: FunctionalOrgan
    comps:
    - type: MovementAlwaysTouching
