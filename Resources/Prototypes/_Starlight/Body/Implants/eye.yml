- type: entity
  id: BaseEntityEyeImplant
  abstract: true
  parent: [ BaseItem, BaseImplant ]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/implants.rsi
  - type: Organ
  - type: EyeImplant
  - type: FlavorProfile
    flavors:
      - people

- type: entity
  id: EyeImplantWelding
  name: welding implant
  description: A surgically-installed eye implant that protects your eyes from bright flashes.
  parent: BaseEntityEyeImplant
  components:
  - type: Sprite
    state: eye_implant_welding
  - type: FunctionalOrgan
    comps:
    - type: EyeProtection
    - type: WeldingMask

- type: entity
  id: EyeImplantDiagnostic
  name: diagnostic implant
  description: A surgically-installed eye implant that allows you to see the health of machinery such as cyborgs and IPCs.
  parent: BaseEntityEyeImplant
  components:
  - type: Sprite
    state: eye_implant_diagnostic
  - type: FunctionalOrgan
    comps:
    - type: ShowAccessReaderSettings
    - type: ShowHealthBars
      damageContainers:
      - Inorganic
      - Silicon
      - IPC
      - Hybrid

- type: entity
  id: EyeImplantMedical
  name: medical implant
  description: A surgically-installed eye implant that allows you to see the health of organic beings.
  parent: BaseEntityEyeImplant
  components:
  - type: Sprite
    state: eye_implant_medical
  - type: FunctionalOrgan
    comps:
    - type: ShowHealthBars
      damageContainers:
      - Biological
      - Hybrid # Neocytes
    - type: ShowHealthIcons
      damageContainers:
        - Biological
        - Hybrid

- type: entity
  id: EyeImplantChemistry
  name: chemistry implant
  description: A surgically-installed eye implant that allows you to see the chemical contents of a container in detail.
  parent: BaseEntityEyeImplant
  components:
  - type: Sprite
    state: eye_implant_chemistry
  - type: FunctionalOrgan
    comps:
    - type: SolutionScanner

- type: entity
  id: EyeImplantSecurity
  name: security implant
  description: A surgically-installed eye implant that allows you to see the security information of station crew, including their job, their mindshield status, and their wanted status.
  parent: BaseEntityEyeImplant
  components:
  - type: Sprite
    state: eye_implant_security
  - type: FunctionalOrgan
    comps:
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons

- type: entity
  id: EyeImplantSyndie
  name: syndie implant
  description: A shady surgically-installed eye implant that allows you to see the security information and health of organic crew, as well as highlight syndicate allies.
  parent: [ BaseEntityEyeImplant, BaseSyndicateContraband ]
  components:
  - type: Sprite
    state: eye_implant_syndicate
  - type: FunctionalOrgan
    comps:
    - type: ShowHealthBars
      damageContainers:
      - Biological
      - Hybrid # Neocytes
    - type: ShowHealthIcons
      damageContainers:
        - Biological
        - Hybrid
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons
    - type: ShowSyndicateIcons
