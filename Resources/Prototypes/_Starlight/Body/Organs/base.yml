- type: entity
  id: BaseOrganBrain
  abstract: true
  components:
  - type: Item
    size: Small
    heldPrefix: brain
  - type: Organ
  - type: Input
    context: "ghost"
  - type: Brain
  - type: InputMover
  - type: Examiner
  - type: BlockMovement
  - type: BadFood
  - type: Tag
    tags:
      - Meat
  - type: OrganBrain
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodGreyMatterLarge
  - type: FlavorProfile
    flavors:
      - people
  - type: FoodSequenceElement
    entries:
      Burger: Brain
      Taco: Brain
  - type: ActiveInputMover # Starlight


- type: entity
  id: BaseOrganEyes
  abstract: true
  components:
  - type: OrganEyes
  - type: OrganDamage
    damage:
      types:
        Poison: 10
        Cellular: 10
        Bloodloss: 10
        Radiation: 10
        Caustic: 10
  - type: Damageable
    damageContainer: Biological
  - type: OrganVisualization
    layer: Eyes
    # 🌟Starlight🌟 start
    prototypes:
      Default: MobHumanoidEyes
    # 🌟Starlight🌟 end

