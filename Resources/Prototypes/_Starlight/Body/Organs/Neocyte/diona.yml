- type: entity
  id: OrganNeoDionaStomach
  parent: OrganDionaStomach
  name: augmented stomach
  suffix: Neo-Diona
  description: "The diona's equivalent of a stomach, it reeks of asparagus and vinegar."
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - RamChip
    isSpecialDigestibleExclusive: false
  - type: Metabolizer
    maxReagents: 6
    metabolizerTypes: [ Plant, Neocyte ] # Can't do animal since they would get poisoned by theobromine.
    stages: [ Digestion, Bloodstream, Metabolites ]
  - type: OrganDamage
    damage:
      types:
        Poison: 130
        Cellular: 30 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 20
        Caustic: 20
        Radiation: 10

- type: entity
  id: OrganNeoDionaLungs
  parent: OrganDionaLungs
  name: diona augmented lungs
  suffix: Neo-Diona
  description: "A spongy mess of slimy, leaf-like structures. Capable of breathing both carbon dioxide and oxygen."
  components:
  - type: OrganDamage
    damage:
      types:
        Asphyxiation: 130
        Cellular: 30 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 20
        Radiation: 30

# Organs that turn into nymphs on removal
- type: entity
  id: OrganNeoDionaStomachNymph
  categories: [ HideSpawnMenu ]
  parent: OrganNeoDionaStomach
  name: neo-diona nymph stomach
  suffix: Neo-Diona Nymph
  description: "Gross. This is hard to stomach."
  components:
  - type: Nymph
    entityPrototype: OrganNeoDionaNymphStomach

- type: entity
  id: OrganNeoDionaNymphStomach
  categories: [ HideSpawnMenu ]
  parent: MobDionaNymphAccent
  name: neo-diona nymph stomach
  suffix: Neo-Diona Nymph
  description: Contains the stomach of a formerly fully-formed Neo-Diona. It doesn't taste any better for it.
  components:
  - type: IsDeadIC
  - type: Body
    prototype: AnimalProtoNymphStomach

- type: entity
  id: OrganNeoDionaLungsNymph
  categories: [ HideSpawnMenu ]
  parent: OrganNeoDionaLungs
  name: neo-diona nymph lungs
  suffix: Neo-Diona Nymph
  description: "Filters oxygen from an atmosphere, which is then sent into the bloodstream to be used as an electron carrier."
  components:
  - type: Nymph
    entityPrototype: OrganNeoDionaNymphLungs

- type: entity
  id: OrganNeoDionaNymphLungs
  categories: [ HideSpawnMenu ]
  parent: MobDionaNymphAccent
  name: neo-diona nymph lungs
  suffix: Neo-Diona Nymph
  description: Contains the lungs of a formerly fully-formed Neo-Diona. Breathtaking.
  components:
  - type: IsDeadIC
  - type: Body
    prototype: AnimalProtoNymphLungs
