- type: entity
  id: SentientNeoSlimeCore
  parent: SentientSlimeCore
  name: augmented sentient slime core
  suffix: Neo-Slime
  description: "The source of incredible, unending gooeyness."
  components:
    - type: Stomach
      specialDigestible:
        tags:
        - RamChip
      isSpecialDigestibleExclusive: false
    - type: Metabolizer
      maxReagents: 6
      metabolizerTypes: [ Slime, Animal ]
      stages: [ Digestion, Metabolites ]
    - type: SolutionManager
      solutions:
      - SolutionOrganSlime
      - SolutionOrganFoodGreyMatterLarge
      - SolutionOrganStomach50

- type: entity
  id: OrganNeoSlimeHeart
  parent: OrganSlimeHeart
  name: augmented slime circulator
  suffix: Neo-Slime
  description: "A little circulator what makes the fluid move through the slime body."
  components:
  - type: Metabolizer
    maxReagents: 6
    metabolizerTypes: [ Slime, Neocyte ]
    stages: [ Bloodstream ]
  - type: OrganDamage
    damage:
      types:
        Shock: 130
        Cellular: 30 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 20
        Caustic: 20
        Radiation: 10

- type: entity
  id: OrganNeoSlimeLungs
  parent: OrganSlimeLungs
  name: augmented slime gas sacs
  suffix: Neo-Slime
  description: "Collects nitrogen, which slime cells use for maintenance."
  components:
  - type: OrganDamage
    damage:
      types:
        Asphyxiation: 130
        Cellular: 30 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 20
        Radiation: 30

- type: entity
  id: OrganNeoSlimePeepoids
  parent: OrganSlimePeepoids
  name: augmented peepoids
  suffix: Neo-Slime
  description: "Primitive and goopy, but more or less just as good as the human equivalent."
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Slime/organs.rsi
    state: peepoids
  - type: Item
    size: Small
    heldPrefix: peepoids
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobHumanoidEyes
  - type: OrganDamage
    damage:
      types:
        Poison: 10
        Cellular: 15 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 10
        Radiation: 10
        Caustic: 10

- type: entity
  id: OrganNeoSlimeSlurpoid
  parent: OrganSlimeSlurpoid
  name: augmented slurpoid
  suffix: Neo-Slime
  description: "It has all the consistency of gelatin."
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Slime/organs.rsi
    state: slurpoid
  - type: OrganDamage
    damage:
      types:
        Poison: 10
        Cellular: 15 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 10
        Radiation: 10
        Caustic: 10
