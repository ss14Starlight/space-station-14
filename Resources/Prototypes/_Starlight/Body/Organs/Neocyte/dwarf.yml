- type: entity
  id: OrganNeoDwarfHeart
  parent: OrganNeocyteHeart
  name: dwarf cybernetic heart
  suffix: Neo-Dwarf
  description: Doesn't actually need to beat, simply mimics the movement to provide comfort for the user.
  components:
  - type: Metabolizer
    metabolizerTypes: [Dwarf, Neocyte]

- type: entity
  id: OrganNeoDwarfLiver
  parent: OrganNeocyteLiver
  name: dwarf cybernetic liver
  suffix: Neo-Dwarf
  description: Pairing suggestion, a side of fermented RAM sticks and a nice CPU.
  components:
  - type: Metabolizer
    metabolizerTypes: [Dwarf]

- type: entity
  id: OrganNeoDwarfStomach
  parent: OrganNeocyteStomach
  name: dwarf biological reactor
  suffix: Neo-Dwarf
  description: Some call it over-engineered, but it's vital to the function of a neocyte. Turns organic matter into organic and electrical energy to power the neocyte's cybernetics and flesh.
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/Protogen/organs.rsi
    state: stomach
  - type: Organ
  - type: SolutionManager
    solutions:
    - SolutionOrganFoodMeat
    - SolutionOrganStomach75
  - type: Stomach
    specialDigestible:
      tags:
      - RamChip
    isSpecialDigestibleExclusive: false
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [Dwarf, Animal]
