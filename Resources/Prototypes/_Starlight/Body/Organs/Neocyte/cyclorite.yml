- type: entity
  id: OrganNeoCycloriteLungs
  parent: OrganNeocyteLungs
  name: cyclorite cybernetic lungs
  suffix: Neo-Cyclorite
  description: Filters nitrogen from an atmosphere, which is then sent into the bloodstream to be used as an electron carrier. Entirely cybernetic in nature, working in tandem with the visor's filtration system.
  components:
  - type: Lung
    alert: LowNitrogen
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: Lung
    metabolizerTypes: [ Slime ]
    groups:
    - id: Gas
      rateModifier: 100.0

- type: entity
  id: OrganNeoCycloriteEye
  parent: OrganNeocyteEyes
  name: cyclorite cybernetic eye
  suffix: Neo-Cyclorite
  description: "Cyclorites see the world slightly differently."
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Cyclorite/organs.rsi
    layers:
      - state: eyeball
  - type: FunctionalOrgan
    comps:
    # - type: CycloriteVision
    - type: NightVision
      disabilityBlockable: true
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobCycloriteEyes

- type: entity
  id: OrganNeoCycloriteHeart
  parent: OrganNeocyteHeart
  name: cyclorite cybernetic heart
  suffix: Neo-Cyclorite
  components:
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [Cyclorite, Neocyte]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic
