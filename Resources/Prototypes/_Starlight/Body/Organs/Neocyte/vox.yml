- type: entity
  id: OrganNeoVoxStomach
  parent: OrganNeocyteStomach
  name: vox biological reactor
  suffix: Neo-Vox
  components:
  - type: Metabolizer
    metabolizerTypes: [Vox] # They don't need animal since Vox inherits the same properties anyways.
  - type: Stomach
    specialDigestible:
      tags:
      - RamChip
      - Trash
    isSpecialDigestibleExclusive: false
  - type: SolutionManager
    solutions:
    - SolutionOrganFoodMeat
    - SolutionOrganStomach50

- type: entity
  id: OrganNeoVoxHeart
  parent: [BaseNeocyteOrgan, OrganNeocyteHeart]
  name: vox cybernetic heart
  suffix: Neo-Vox
  components:
  - type: Sprite
    state: heart-on
  - type: Item
    size: Small
    heldPrefix: heart
  - type: Metabolizer
    metabolizerTypes: [ Vox, Neocyte ]

- type: entity
  id: OrganNeoVoxLungs
  parent: OrganNeocyteLungs
  name: vox cybernetic lungs
  suffix: Neo-Vox
  description: Filters nitrogen from an atmosphere, which is then sent into the bloodstream to be used as an electron carrier. Entirely cybernetic in nature, working in tandem with the visor's filtration system. #  Starlight, quotation marks removed
  components:
  - type: Metabolizer
    metabolizerTypes: [ Slime, NeoVox ]
    stages: [ Respiration ]
  - type: Lung
    alert: LowNitrogen
