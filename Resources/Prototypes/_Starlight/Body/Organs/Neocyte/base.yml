- type: entity
  id: BaseNeocyteOrgan
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/Protogen/organs.rsi
  - type: Organ
  - type: Edible
  - type: Extractable
    grindableSolutionName: organ
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodMeat
  - type: FlavorProfile
    flavors:
      - people
  - type: Tag
    tags:
      - Meat



- type: entity
  id: OrganNeocyteBrain
  parent: [BaseOrganBrain, BaseNeocyteOrgan]
  name: cybernetic brain
  suffix: Neocyte
  description: The source of incredible, unending intelligence. 01201020 02102111 01201210 02121012 20121210
  components:
  - type: Sprite
    state: brain

- type: entity
  id: OrganNeocyteEyes
  parent: [BaseNeocyteOrgan, BaseOrganEyes]
  name: cybernetic eyes
  suffix: Neocyte
  description: It's still focusing on you.. Creepy.
  components:
  - type: Sprite
    layers:
    - state: eyeball-l
    - state: eyeball-r
  - type: Item
    size: Small
    heldPrefix: eyeballs
  - type: OrganVisualization
    layer: Eyes
    prototypes:
          Default: MobHumanoidEyes
  - type: OrganDamage
    damage:
      types:
        Poison: 10
        Cellular: 15 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 10
        Radiation: 10
        Caustic: 10

- type: entity
  id: OrganNeocyteTongue
  parent: [BaseNeocyteOrgan, BaseOrganTongue]
  name: cybernetic tongue
  suffix: Neocyte
  description: A completely glowing organ commonly used for lying or self-expression. Sometimes both. #  Starlight, quotation marks removed
  components:
  - type: Sprite
    state: tongue
  - type: OrganDamage
    damage:
      types:
        Poison: 10
        Cellular: 15 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 10
        Radiation: 10
        Caustic: 10

- type: entity
  id: OrganNeocyteTongueForked
  parent: [BaseNeocyteOrgan, BaseOrganTongue]
  name: forked cybernetic tongue
  suffix: Neocyte
  description: A completely glowing organ commonly used for lying or self-expression. Sometimes both. Now split in two. #  Starlight, quotation marks removed
  components:
  - type: Sprite
    state: tongueforked

- type: entity
  id: OrganNeocyteEars
  parent: [BaseNeocyteOrgan, BaseOrganEars]
  name: cybernetic ears
  suffix: Neocyte
  description: Process audio at a higher quality than most humanoids, allowing for greater appreciation of techno music #  Starlight, quotation marks removed
  components:
  - type: Sprite
    state: ears

- type: entity
  id: OrganNeocyteLungs
  parent: [BaseNeocyteOrgan, BaseOrganLungs]
  name: cybernetic lungs
  suffix: Neocyte
  description: Filters oxygen from an atmosphere, which is then sent into the bloodstream to be used as an electron carrier. Entirely cybernetic in nature, working in tandem with the visor's filtration system. #  Starlight, quotation marks removed
  components:
  - type: Sprite
    layers:
    - state: lung-l
    - state: lung-r
  - type: Item
    size: Small
    heldPrefix: lungs
  - type: Lung
  - type: Metabolizer
    metabolizerTypes: [ Neocyte ]
    stages: [ Respiration ]
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodMeat
    - SolutionOrganLung
  - type: OrganDamage
    damage:
      types:
        Asphyxiation: 130
        Cellular: 30 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 20
        Radiation: 30


- type: entity
  id: OrganNeocyteHeart
  parent: [BaseNeocyteOrgan, BaseOrganHeart]
  name: cybernetic heart
  suffix: Neocyte
  description: Doesn't actually need to beat, simply mimics the movement to provide comfort for the user.
  components:
  - type: Sprite
    state: heart-on
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [Neocyte]
    stages: [ Bloodstream ]
  - type: Item
    size: Small
    heldPrefix: heart
  - type: OrganDamage
    damage:
      types:
        Shock: 130
        Cellular: 30 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 20
        Caustic: 20
        Radiation: 10

- type: entity
  id: OrganNeocyteStomach
  parent: [OrganAnimalStomach, BaseOrganStomach]
  name: biological reactor
  suffix: Neocyte
  description: Some call it over-engineered, but it's vital to the function of a neocyte. Turns organic matter into organic and electrical energy to power the neocyte's cybernetics and flesh. #  Starlight, quotation marks removed
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/Protogen/organs.rsi
    state: stomach
  - type: Item
    size: Small
    heldPrefix: stomach
  - type: Stomach
    specialDigestible:
      tags:
      - RamChip
    isSpecialDigestibleExclusive: false
  - type: SolutionManager
    solutions:
    - SolutionOrganFoodMeat
    - SolutionOrganStomach50
  - type: OrganDamage
    damage:
      types:
        Poison: 130
        Cellular: 30 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 20
        Caustic: 20
        Radiation: 10


- type: entity
  id: OrganNeocyteLiver
  parent: [BaseNeocyteOrgan, BaseOrganLiver]
  name: cybernetic liver
  suffix: Neocyte
  description: Pairing suggestion, a side of fermented RAM sticks and a nice CPU.
  components:
  - type: Sprite
    state: liver
  - type: Item
    size: Small
    heldPrefix: liver
  - type: Metabolizer
    maxReagents: 1
    metabolizerTypes: [Neocyte]
    stages: [ Metabolites ]
  - type: OrganDamage
    damage:
      types:
        Poison: 110
        Cellular: 30 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 20
        Caustic: 20
        Radiation: 30

- type: entity
  id: OrganNeocyteKidneys
  parent: [BaseNeocyteOrgan, BaseOrganKidneys]
  name: cybernetic kidneys
  suffix: Neocyte
  description: Pumps toxins out of the bloodstream and serves as a minor biological battery for electrical components #  Starlight, quotation marks removed
  components:
  - type: Sprite
    layers:
    - state: kidney-l
    - state: kidney-r
  - type: Item
    size: Small
    heldPrefix: kidneys
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [Neocyte]
  - type: OrganDamage
    damage:
      types:
        Poison: 10
        Cellular: 30 # 1.5x cellular, since it can make it impossible to revive them with the half healing they get
        Bloodloss: 20
        Caustic: 20
        Radiation: 10
        Cold: 120
