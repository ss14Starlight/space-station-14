- type: entity
  id: OrganDwarfHeart
  parent: OrganHumanHeart
  name: dwarf heart
  suffix: Dwarf
  components:
  - type: Metabolizer
    metabolizerTypes: [Dwarf, Neocyte]

- type: entity
  id: OrganDwarfLiver
  parent: OrganHumanLiver
  name: dwarf liver
  suffix: Dwarf
  components:
  - type: Metabolizer
    metabolizerTypes: [Dwarf]

- type: entity
  id: OrganDwarfStomach
  parent: OrganHumanStomach
  name: dwarf stomach
  suffix: Dwarf
  components:
  - type: Sprite
    state: stomach
  - type: Organ
  - type: SolutionManager
    solutions:
    - SolutionBaseHumanOrganOrgan
    - SolutionOrganDwarfStomachFood
    - SolutionOrganDwarfStomachStomach
  - type: Stomach
  - type: Metabolizer
    # mm very yummy
    maxReagents: 5
    metabolizerTypes: [Dwarf, Animal]

- type: entity
  parent: SolutionOrganHumanStomachStomach
  id: SolutionOrganDwarfStomachStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: stomach
    solution:
      maxVol: 75

- type: entity
  parent: SolutionOrganHumanStomachFood
  id: SolutionOrganDwarfStomachFood
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: food
    solution:
      maxVol: 5
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 5
