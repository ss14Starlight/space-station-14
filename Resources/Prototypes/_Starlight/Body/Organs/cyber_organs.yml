- type: entity
  id: OrganCyber
  parent: BaseItem
  name: "cyber organ"
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
  - type: Organ
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Iron
        Quantity: 30
  - type: HumanoidEMPCompositeElement
    effect:
      damageAmount:
        types:
          Shock: 5

- type: entity
  id: CyberEyeNightVision
  name: night vision cyber eyes
  description: A surgically-installed cybernetic pair of eyeballs that allow you to see in the dark, although with an additional vulnerability to bright flashes.
  parent: [OrganCyber, BaseOrganEyes]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/implants.rsi
    state: eyes_night
  - type: FunctionalOrgan
    comps:
    - type: NightVision
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: CyberEyesNightVision
      Resomi: ResomiCyberEyesNightVision
      Experiment: ExperimentCyberEyesNightVision
  - type: HumanoidEMPCompositeElement
    effect:
      glitchDuration: 10.0
      additionalEffects:
        StatusEffectTemporaryBlindness: 2.0
      damageAmount:
        types:
          Shock: 5

- type: entity
  id: CyberEyeThermal
  name: thermal vision cyber eyes
  description: A surgically-installed cybernetic pair of eyeballs that allow you to see thermal heat signatures, including those of cloaked and invisible entities, although with an additional vulnerability to bright flashes.
  parent: [OrganCyber, BaseOrganEyes]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/implants.rsi
    state: eyes_thermal
  - type: FunctionalOrgan
    comps:
    - type: ThermalVision
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: CyberEyesThermalVision
      Resomi: ResomiCyberEyesThermalVision
      Experiment: ExperimentCyberEyesThermalVision
  - type: HumanoidEMPCompositeElement
    effect:
      glitchDuration: 10.0
      additionalEffects:
        StatusEffectTemporaryBlindness: 2.0
      damageAmount:
        types:
          Shock: 5

- type: entity
  id: BudgetCyberEyes
  name: budget cyber eyes
  description: A surgically-installed cybernetic pair of eyeballs that isn't capable of seeing color. Cold and soulless, just as depressing to look out of as to look into.
  parent: [OrganCyber, BaseOrganEyes]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
    layers:
      - state: eyeball-l
      - state: eyeball-r
  - type: FunctionalOrgan
    comps:
    - type: NoirOverlay
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobHumanoidEyes
      Resomi: MobResomiEyes
      Moth: MobMothEyes
      Felionoid: MobFelionoidEyes
      Thaven: MobThavenEyes
      Avali: MobAvaliEyes
      Shadekin: MobShadekinEyes
      Arachnid: MobArachnidEyes
      Diona: MobDionaEyes
      Vox: MobVoxEyes
      Cyclorite: MobCycloriteEyes
      Abductor: MobAbductorEyes
      Experiment: MobExperimentEyes
  - type: HumanoidEMPCompositeElement
    effect:
      glitchDuration: 10.0
      additionalEffects:
        StatusEffectTemporaryBlindness: 2.0
      damageAmount:
        types:
          Shock: 5

- type: entity
  id: BudgetCyberTongue
  name: budget cyber tongue
  description: A surgically-installed cybernetic tongue that gets the job done, as long as you don't care about being able to taste anything.
  parent: [OrganCyber, BaseOrganTongue]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
    state: tongue
  - type: FunctionalOrgan
    comps:
    - type: UnableToTaste

- type: entity
  id: VocalCyberTongue
  name: vocal cyber tongue
  description: A surgically-installed cybernetic tongue that has full range of movement and some taste receptors to boot. It allows you to replicate the vocal mannerisms of any humanoid species.
  parent: [OrganCyber, BaseOrganTongue]
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
      state: tongue
    - type: OrganTongue
      allowAllVocalEmotes: true
      sounds:
        Male: MaleAllEmotes
        Female: FemaleAllEmotes
        Unsexed: MaleAllEmotes

- type: entity
  id: BudgetCyberLiver
  name: budget cyber liver
  description: A surgically-installed cybernetic liver, for when you want to continue getting drunk after happening to lose your original one. It works but not nearly as well as the real thing.
  parent: [OrganCyber, OrganHumanLiver]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
    state: liver
  - type: Metabolizer # The liver metabolizes certain chemicals only, like alcohol.
    maxReagents: 1
    metabolizerTypes: [BudgetCyber]
    stages: [ Metabolites ]

- type: entity
  id: BudgetCyberStomach
  name: budget cyber stomach
  description: A surgically-installed cybernetic stomach. It replicates the functionality of an organic stomach, but due to lack of elasticity it can't hold as much food or drink at once.
  parent: [OrganCyber, OrganHumanStomach]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
    state: stomach
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodMeat
    - SolutionOrganStomach30
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [BudgetCyber]
    stages: [ Digestion ]

- type: entity
  id: BudgetCyberKidneys
  name: budget cyber kidneys
  description: A surgically-installed pair of cybernetic kidneys. Due to cheap materials used, they waste significantly more water than organic ones, meaning you'll get thirsty more often.
  parent: [OrganCyber, OrganHumanKidneys]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
    layers:
      - state: kidney-l
      - state: kidney-r
  - type: FunctionalOrgan
    comps:
    - type: ThirstRateMultiplier
      multiplier: 1.25

- type: entity
  id: CyberRebreather
  name: cyber rebreather
  description: A surgically-installed pair of lungs with an integrated gas tank system. It can be filled with any breathable gas mixture, serving as a useful emergency supply in case you happen to find yourself gasping for air.
  parent: [OrganCyber, OrganHumanLungs]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/breathable_cyber_lungs.rsi
    layers:
      - state: lung-l
      - state: lung-r
  - type: Metabolizer
    metabolizerTypes: [ Human ]
  - type: Lung
    alert: LowOxygen
  - type: Item
    size: Normal
    heldPrefix: lungs
    sprite: _Starlight/Objects/Specific/Medical/breathable_cyber_lungs.rsi
    shape:
    - 0,0,3,3
  - type: BreathMask
  - type: OrganBreathTool
    startActivated: false
  - type: GasTank
    air:
      volume: 2.5
      temperature: 293.15
    outputPressure: 21.3
  - type: OrganGasTankFillable
    targetPressure: 1000.0
  - type: UseDelay
    delays:
      gasTank:
        length: 1.0
  - type: ActivatableUI
    key: enum.SharedGasTankUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SharedGasTankUiKey.Key:
        type: GasTankBoundUserInterface
      enum.SharedGasTankUiKey.OrganKey:
        type: BreathableOrganBoundUserInterface
  - type: Tag
    tags:
    - GasTank
