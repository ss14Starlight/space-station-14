- type: entity
  id: SentientSlimeCore
  parent: [BaseItem, BaseOrganBrain]
  name: sentient slime core
  suffix: Slime
  description: "The source of incredible, unending gooeyness."
  components:
    - type: Sprite
      sprite: Mobs/Species/Slime/organs.rsi
      state: brain
    - type: Stomach
    - type: Metabolizer
      maxReagents: 6
      metabolizerTypes: [ Slime ]
      stages: [ Digestion, Metabolites ]
    - type: SolutionManager
      solutions:
      - SolutionOrganSlime
      - SolutionOrganFoodGreyMatterLarge
      - SolutionOrganStomach50

- type: entity
  id: OrganSlimeLungs
  parent: [BaseHumanOrgan, BaseOrganLungs]
  name: slime gas sacs
  suffix: Slime
  description: "Collects nitrogen, which slime cells use for maintenance."
  components:
  - type: Sprite
    sprite: Mobs/Species/Slime/organs.rsi
    layers:
      - state: lung-l
      - state: lung-r
  - type: Lung
    alert: LowNitrogen
  - type: Metabolizer
    metabolizerTypes: [ Slime ]
    stages: [ Respiration ]
  - type: SolutionManager
    solutions:
    - SolutionOrganSlime
    - SolutionOrganFoodSlime
    - SolutionOrganLung
  - type: Item
    size: Small
    heldPrefix: lungs


- type: entity
  id: OrganSlimeHeart
  parent: [BaseHumanOrgan, BaseOrganHeart]
  name: slime circulator
  suffix: Slime
  description: "A little circulator what makes the fluid move through the slime body."
  components:
  - type: Sprite
    sprite: Mobs/Species/Slime/organs.rsi
    state: heart-on
  - type: Item
    size: Small
    heldPrefix: heart
  - type: Metabolizer
    maxReagents: 6
    metabolizerTypes: [ Slime ]
    stages: [ Bloodstream ]

# Starlight start
- type: entity
  id: OrganSlimePeepoids
  parent: [BaseHumanOrgan, BaseOrganEyes]
  name: peepoids
  suffix: Slime
  description: "Primitive and goopy, but more or less just as good as the human equivalent."
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Slime/organs.rsi
    state: peepoids
  - type: Item
    size: Small
    heldPrefix: peepoids
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobHumanoidEyes

- type: entity
  id: OrganSlimeSlurpoid
  parent: OrganHumanTongue
  name: slurpoid
  suffix: Slime
  description: "It has all the consistency of gelatin."
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Slime/organs.rsi
    state: slurpoid
# Starlight end
