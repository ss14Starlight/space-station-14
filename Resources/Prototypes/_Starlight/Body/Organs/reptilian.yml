- type: entity
  id: OrganReptilianStomach
  parent: [OrganAnimalStomach, BaseOrganStomach]
  name: reptilian stomach
  suffix: Reptilian
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - Fruit
      - ReptilianFood
      - Meat
      - Pill
      - Crayon
      - Paper
      - IceCream
      - Birthday
  - type: SolutionManager
    solutions:
    - SolutionOrganFoodMeat
    - SolutionOrganStomach50
  - type: Metabolizer
    updateInterval: 0.67 # Reptilians digest about 1.5x faster

- type: entity
  id: OrganReptilianTongue
  parent: OrganHumanTongue
  suffix: Reptilian
  components:
  - type: OrganTongue
    allowedEmotes: ['Liss', 'Lurr', 'Rattle']
    sounds:
      Male: MaleReptilian
      Female: FemaleReptilian
      Unsexed: MaleReptilian

- type: entity
  id: OrganReptilianHeart
  parent: OrganAnimalHeart
  suffix: Reptilian
  components:
  - type: Metabolizer
    metabolizerTypes: [ Animal, Reptilian ] # Digests welding fuel without poisoning
