- type: entity
  id: OrganMothEyes
  parent: OrganHumanEyes
  name: moth eyes
  suffix: Moth
  description: "Large compound eyes used to catch light."
  components:
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobMothEyes

- type: entity
  id: OrganMothStomach
  parent: [OrganAnimalStomach, OrganHumanStomach]
  name: moth stomach
  description: "A stomach specialized for digesting normally inedible cloth."
  suffix: Moth
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - ClothMade
      - Paper
      - Pill
      - IceCream
      - Birthday
  - type: SolutionManager
    solutions:
    - SolutionOrganMothStomachFood
    - SolutionOrganMothStomachStomach
    - SolutionBaseHumanOrganOrgan
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [ Moth ]
    stages: [ Digestion ]

- type: entity
  parent: SolutionOrganHumanStomachStomach
  id: SolutionOrganMothStomachStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: stomach
    solution:
      maxVol: 50

- type: entity
  parent: SolutionOrganHumanStomachFood
  id: SolutionOrganMothStomachFood
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: food
    solution:
      maxVol: 5
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 5
