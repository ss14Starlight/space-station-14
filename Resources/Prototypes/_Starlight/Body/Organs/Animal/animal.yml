- type: entity
  id: BaseAnimalOrgan
  parent: BaseItem
  abstract: true
  components:
  - type: Organ
  - type: Edible
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
  - type: StaticPrice
    price: 50
  - type: SolutionManager
    solutions:
    - SolutionBaseAnimalOrganFood
  - type: FlavorProfile
    flavors:
      - chicken # everything kinda tastes like chicken
  - type: Extractable           # Starlight - let's make some sausage!
    grindableSolutionName: food # Starlight - let's make some sausage!
  - type: Tag
    tags:
      - Meat


- type: entity
  parent: Solution
  id: SolutionBaseAnimalOrganFood
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: food
    solution:
      maxVol: 5
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 5

- type: entity
  id: OrganAnimalLungs
  parent: BaseAnimalOrgan
  name: animal lungs
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: lung-l
    - state: lung-r
  - type: Organ
  - type: Lung
  - type: Metabolizer
    metabolizerTypes: [ Animal ]
    stages: [ Respiration ]
  - type: SolutionManager
    solutions:
    - SolutionOrganAnimalLungsFood
    - SolutionOrganAnimalLungsLung
  - type: Item
    size: Small
    heldPrefix: lungs


- type: entity
  parent: Solution
  id: SolutionOrganAnimalLungsLung
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: Lung
    solution:
      maxVol: 100.0
      canReact: false

- type: entity
  parent: SolutionBaseAnimalOrganFood
  id: SolutionOrganAnimalLungsFood
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: food
    solution:
      maxVol: 5
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 5

- type: entity
  id: OrganAnimalStomach
  parent: BaseAnimalOrgan
  name: animal stomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: stomach
  - type: Organ
  - type: SolutionManager
    solutions:
    - SolutionOrganAnimalStomachFood
    - SolutionOrganAnimalStomachStomach
  - type: Stomach
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [ Animal ]
    stages: [ Digestion ]
  - type: Item
    size: Small
    heldPrefix: stomach


- type: entity
  parent: Solution
  id: SolutionOrganAnimalStomachStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: stomach
    solution:
      maxVol: 40

- type: entity
  parent: SolutionBaseAnimalOrganFood
  id: SolutionOrganAnimalStomachFood
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: food
    solution:
      maxVol: 5
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 5

- type: entity
  id: OrganMouseStomach
  parent: OrganAnimalStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionManager
    solutions:
    - SolutionOrganMouseStomachFood
    - SolutionOrganMouseStomachStomach
  - type: Item
    size: Small
    heldPrefix: stomach


- type: entity
  parent: SolutionOrganAnimalStomachStomach
  id: SolutionOrganMouseStomachStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: stomach
    solution:
      maxVol: 30

- type: entity
  parent: SolutionOrganAnimalStomachFood
  id: SolutionOrganMouseStomachFood
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: food
    solution:
      maxVol: 5
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 5

- type: entity
  id: OrganAnimalLiver
  parent: [ BaseAnimalOrgan, BaseOrganLiver]
  name: animal liver
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: liver
  - type: Organ
  - type: Metabolizer
    maxReagents: 1
    metabolizerTypes: [ Animal ]
    stages: [ Metabolites ]
  - type: Item
    size: Small
    heldPrefix: liver

- type: entity
  id: OrganAnimalHeart
  parent: [ BaseAnimalOrgan, BaseOrganHeart]
  name: animal heart
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: heart-on
  - type: Organ
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ Animal ]
    stages: [ Bloodstream ]
  - type: Item
    size: Small
    heldPrefix: heart

- type: entity
  id: OrganAnimalKidneys
  parent: [ BaseAnimalOrgan, BaseOrganKidneys ]
  name: animal kidneys
  categories: [ HideSpawnMenu ]
