- type: entity
  id: SentientSlimesCore
  parent: [BaseItem, OrganHumanBrain]
  name: sentient slimes core
  description: "The source of incredible, unending gooeyness."
  components:
    - type: Sprite
      sprite: Mobs/Species/Slime/organs.rsi
      state: brain
    - type: Stomach
    - type: Metabolizer
      maxReagents: 3
      metabolizerTypes: [ Slime ]
      stages: [ Digestion, Bloodstream, Metabolites ]
    - type: SolutionManager
      solutions:
      - SolutionOrganHumanBrainOrgan
      - SolutionSentientSlimesCoreFood
      - SolutionSentientSlimesCoreStomach

- type: entity
  parent: Solution
  id: SolutionSentientSlimesCoreStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: stomach
    solution:
        maxVol: 30.0

- type: entity
  parent: SolutionOrganHumanBrainFood
  id: SolutionSentientSlimesCoreFood
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: food
    solution:
        maxVol: 5
        reagents:
        - ReagentId: GreyMatter
          Quantity: 5

- type: entity
  id: OrganSlimesLungs
  parent: BaseHumanOrgan
  name: slimes gas sacs
  suffix: Slimes
  description: "Collects nitrogen, which slime cells use for maintenance."
  components:
    - type: Sprite
      sprite: Mobs/Species/Slime/organs.rsi
      layers:
        - state: lung-l
        - state: lung-r
    - type: Lung
      alert: LowNitrogen
    - type: Metabolizer
      metabolizerTypes: [ Slime ]
      stages: [ Respiration ]
    - type: SolutionManager
      solutions:
      - SolutionOrganSlimesLungsOrgan
      - SolutionOrganSlimesLungsFood
      - SolutionOrganSlimesLungsLung

- type: entity
  parent: SolutionBaseHumanOrganOrgan
  id: SolutionOrganSlimesLungsOrgan
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: organ
    solution:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10

- type: entity
  parent: Solution
  id: SolutionOrganSlimesLungsLung
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: Lung
    solution:
        maxVol: 100.0
        canReact: false

- type: entity
  parent: SolutionBaseHumanOrganFood
  id: SolutionOrganSlimesLungsFood
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: food
    solution:
        maxVol: 5
        reagents:
        - ReagentId: Slime
          Quantity: 5
