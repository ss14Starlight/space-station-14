# IPC Organs
# SOURCE: Far-Horizons-SS14
# https://github.com/Far-Horizons-SS14/Far-Horizons-SS14
# _STARLIGHT: No modifications

- type: entity
  id: OrganIPCPositronicBrain
  parent: PositronicBrain
  name: "positronic brain"
  description: "A complex artificial brain capable of sentience."
  components:
  - type: Sprite
    sprite: Objects/Specific/Robotics/mmi.rsi
    layers:
    - state: posibrain
      map: ["base"]
  - type: Organ
  - type: Input
    context: ghost
  - type: Brain # Use Brain component like human brains, not BorgBrain
  - type: InputMover
  - type: Examiner
  - type: BlockMovement
  - type: Tag
    tags:
    - MindTransferTarget # Required for TransferMindOnGib to work
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
  - type: ActiveRadio
    channels:
    - Binary
    - Common
  - type: DoAfter
  - type: Actions
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechSounds: Pai
  - type: Alerts

- type: entity
  id: OrganIPCEyes
  parent: BaseItem
  name: "optical sensors"
  description: "Advanced optical sensors for synthetic vision."
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/IPC/organs.rsi
    state: eyes
  - type: Organ

- type: entity
  id: OrganIPCPowerCell
  parent: BaseItem
  name: "microbattery"
  description: "An internal power cell that keeps the IPC running."
  components:
  - type: Sprite
    sprite: Objects/Power/power_cells.rsi
    layers:
    - state: small
  - type: Organ

- type: entity
  id: OrganIPCPump
  parent: BaseItem
  name: "hydraulic pump"
  description: "A pump that circulates coolant through the synthetic body."
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/IPC/organs.rsi
    state: heart-on
  - type: Organ
  - type: Metabolizer
    removeEmpty: true
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic
