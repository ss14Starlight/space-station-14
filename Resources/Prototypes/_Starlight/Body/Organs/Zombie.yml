- type: entity
  id: OrganZombieHeart
  parent: OrganHumanHeart
  name: Zombified heart
  description: "The rotten, faintly pulsating heart of a zombie."
  suffix: Zombie
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: heart-on
  - type: Organ
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [Zombie]
    stages: [ Bloodstream ]
  - type: Extractable
    grindableSolutionName: organ
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: ZombieHeartSlurry
          Quantity: 4
  - type: Item
    size: Small
    heldPrefix: heart
