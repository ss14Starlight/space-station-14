- type: entity
  id: OrganExperimentStomach
  parent: [OrganAnimalStomach, BaseOrganStomach]
  name: stomach
  description: "Gross. This is hard to stomach."
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: stomach
  - type: Item
    size: Small
    heldPrefix: stomach
  - type: Stomach
    updateInterval: 1.5
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5

- type: entity
  id: OrganExperimentEyes
  parent: OrganHumanEyes
  name: eyes
  suffix: Experiment
  description: "Couldn't have seen that one coming."
  components:
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobExperimentEyes
  - type: FunctionalOrgan
    comps:
      - type: PointLight
        color: orange
      - type: InventorySlotTogglePointLight
        offSlots: EYES
