- type: entity
  id: OrganExperimentStomach
  parent: [OrganAnimalStomach, BaseOrganStomach]
  name: stomach
  description: "Gross. This is hard to stomach."
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: stomach
  - type: Item
    size: Small
    heldPrefix: stomach
  - type: Stomach
  - type: SolutionManager
    solutions:
    - SolutionOrganNutriment
    - SolutionOrganFoodMeat
    - SolutionOrganStomach50
  - type: Metabolizer
    updateInterval: 0.75

- type: entity
  id: OrganExperimentEyes
  parent: OrganHumanEyes
  name: eyes
  suffix: Experiment
  description: "Couldn't have seen that one coming."
  components:
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobExperimentEyes
  - type: FunctionalOrgan
    comps:
      - type: PointLight
        color: orange
      - type: FlashImmunityTogglePointLight
        invert: true

- type: entity
  id: OrganExperimentTongue
  parent: OrganHumanTongue
  name: tongue
  suffix: Experiment
  description: "A fleshy muscle mostly used for lying."
  components:
  - type: OrganTongue
    sounds:
      Male: Experiment
      Female: Experiment
      Unsexed: Experiment
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobExperimentEyes
