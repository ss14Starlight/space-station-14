- type: entity
  id: OrganExperimentStomach
  parent: [OrganAnimalStomach, BaseOrganStomach]
  name: stomach
  description: "Gross. This is hard to stomach." 
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: stomach
  - type: Item
    size: Small
    heldPrefix: stomach
  - type: Stomach
    updateInterval: 1.5
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5

- type: entity
  id: OrganExperimentHeart
  parent: OrganHumanHeart
  categories: [ HideSpawnMenu ]
  components:
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [Experiment]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic