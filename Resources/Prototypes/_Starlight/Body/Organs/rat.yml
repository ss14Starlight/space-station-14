- type: entity
  id: OrganRatLungs
  parent: OrganHumanLungs
  name: rat lungs
  description: "It ain't easy to stay breathing in these tunnels."
  suffix: Rat
  components:
  - type: Metabolizer
    metabolizerTypes: [ Rat ]

- type: entity
  id: OrganRatStomach
  parent: OrganAnimalStomach
  name: rat stomach
  description: "Yearns for cheese."
  suffix: Rat
  components:
  - type: SolutionManager
    solutions:
    - SolutionOrganRatStomachFood
    - SolutionOrganRatStomachStomach
  - type: Sprite
    state: stomach

- type: entity
  parent: SolutionOrganAnimalStomachStomach
  id: SolutionOrganRatStomachStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: stomach
    solution:
      maxVol: 50

- type: entity
  parent: SolutionOrganAnimalStomachFood
  id: SolutionOrganRatStomachFood
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: food
    solution:
      maxVol: 5
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 5
