- type: entity
  parent: BasePlant
  id: OrganTreePlants
  name: organ tree
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Hydroponics/organtree.rsi
  - type: PlantData
    name: seeds-organ-tree-name
    packetPrototype: OrganTreeSeeds
    productPrototypes: [ FoodOrganTree ]
  - type: Plant
    lifespan: 10 # organs rot fast
    growthStages: 6
    maturation: 12
    production: 15 # organ growing takes a while
    yield: 1
    potency: 10
  - type: PlantGrowth
    waterConsumption: 0.6
    nutrientConsumption: 0.8
  - type: PlantChemicals
    chemicals:
      Nutriment:
        min: 1
        max: 2
        potencyDivisor: 40
      Vitamin:
        min: 1
        max: 2
        potencyDivisor: 40

