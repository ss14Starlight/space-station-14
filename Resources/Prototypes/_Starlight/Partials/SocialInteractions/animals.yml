# Monkeys, Kobolds, Scurrets
- type: !PartialOnly entity
  id: MobBaseAncestor
  components:
  - type: SocialInteractionGiver
    interactionPrototypes:
    - Wave

# Dogs, Corgis, K9s
- type: !PartialOnly entity
  id: MobDogColdResistant
  components:
  - type: SocialInteractionGiver
    interactionPrototypes:
    - Sniff
  - type: SocialInteractionReceiver
    interactionOverrides: # you can pet the dog
    - id: Pat
      interactString: petting-success
      messagePerceivedByOthers: petting-success-others
      emoteMessage: petting-emote

