- type: !PartialOnly constructionGraph
  id: SecretDoor
  graph:
  - !CombineIndex:4 node: solidSecretDoor
    edges:
    - to: reinforcedSecretDoor
      steps:
      - material: Plasteel
        amount: 2
        doAfter: 2
  - node: reinforcedSecretDoor
    entity: ReinforcedSecretDoor
    edges:
    - to: solidSecretDoor
      completed:
      - !type:SpawnPrototype
        prototype: SheetPlasteel1
        amount: 2
      steps:
      - tool: Cutting
        doAfter: 2
