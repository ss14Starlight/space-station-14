- type: !PartialOnly entity
  id: BoxCardboard
  components:
  - type: ToolRefinable
    qualityNeeded: Slicing
    verbText: refined-slice-verb-name
    verbDefaultTooltip: refined-slice-verb-message-default
    toolMissingQualityTooltip: refined-slice-verb-message-tool
    popupType: Small
    popupForUser: refined-butchered-success
    popupForOther: refined-butchered-success-others
    verbIcon: Interface/VerbIcons/cutlery.svg.192dpi.png
    sound: !type:SoundPathSpecifier
      path: /Audio/Items/Culinary/chop.ogg
    refineResult:
    - id: MaterialCardboard1
      amount: 1

