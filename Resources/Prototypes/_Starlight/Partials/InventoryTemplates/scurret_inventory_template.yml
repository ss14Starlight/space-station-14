- type: !PartialOnly inventoryTemplate
  id: scurret
  slots: !Clear
    - name: ears
      slotTexture: ears
      slotFlags: EARS
      stripTime: 3
      uiWindowPos: 0,2
      strippingWindowPos: 1,2
      displayName: Ears
    - name: gloves
      slotTexture: gloves
      slotFlags: GLOVES
      uiWindowPos: 0,1
      strippingWindowPos: 2,2
      displayName: Gloves
    - name: head
      slotTexture: head
      slotFlags: HEAD
      uiWindowPos: 1,3
      strippingWindowPos: 0,0
      displayName: Head
    - name: mask
      slotTexture: mask
      slotFlags: MASK
      uiWindowPos: 1,2
      strippingWindowPos: 1,1
      displayName: Mask
    - name: neck
      slotTexture: neck
      slotFlags: NECK
      uiWindowPos: 1,1
      strippingWindowPos: 0,1
      displayName: Neck
    - name: jumpsuit
      slotTexture: uniform
      slotFlags: INNERCLOTHING
      stripTime: 6
      uiWindowPos: 1,0
      strippingWindowPos: 0,2
      displayName: Jumpsuit
    - name: back
      slotTexture: back
      fullTextureName: template_small
      slotFlags: BACK
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 3,2
      strippingWindowPos: 0,5
      displayName: Back
      whitelist:
        tags:
          - ScurretWearable
    - name: belt
      slotTexture: belt
      fullTextureName: template_small
      slotFlags: BELT
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 3,1
      strippingWindowPos: 1,5
      displayName: Belt
    - name: id
      slotTexture: id
      fullTextureName: template_small
      slotFlags: IDCARD
      slotGroup: SecondHotbar
      stripTime: 6
      uiWindowPos: 2,1
      strippingWindowPos: 2,4
      displayName: ID
    - name: pocket1
      slotTexture: pocket
      fullTextureName: template_small
      slotFlags: POCKET
      slotGroup: MainHotbar
      stripTime: 3
      uiWindowPos: 0,3
      strippingWindowPos: 0,4
      dependsOn: jumpsuit
      displayName: Pocket
      stripHidden: true
    - name: outerClothing
      slotTexture: suit
      slotFlags: OUTERCLOTHING
      stripTime: 6
      uiWindowPos: 0,3
      strippingWindowPos: 1,3
      displayName: Suit
      whitelist:
        tags:
          - ScurretWearable
    - name: eyes
      slotTexture: glasses
      slotFlags: EYES
      stripTime: 3
      uiWindowPos: 2,2
      strippingWindowPos: 1,0
      displayName: Eyes
    - name: misc
      slotTexture: misc
      slotFlags: MISC
      uiWindowPos: 2,0
      strippingWindowPos: 2,1
      displayName: Misc
