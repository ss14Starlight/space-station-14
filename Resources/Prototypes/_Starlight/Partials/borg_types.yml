- type: !PartialOnly borgType
  id: engineering
  addComponents:
  - type: ShowHealthBars
    damageContainers:
    - Inorganic
    - Silicon
    - IPC
    - Hybrid
    - MoffDemonInorganic
  - type: ShowAccessReaderSettings
  - type: Access
    groups:
      - CyborgAllAccess
    tags:
      - Borg
      - BorgEngineering
      - ChiefEngineer

- type: !PartialOnly borgType
  id: medical
  addComponents:
  - type: !Remove ShowHealthBars
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - Hybrid
    - MoffDemonBiological
  - type: !Remove ShowHealthIcons
  - type: ShowHealthIcons
    damageContainers:
    - Biological
    - Hybrid
