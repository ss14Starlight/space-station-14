    - /Audio/_Starlight/Ambience/Music/ambieng1.ogg
    - /Audio/_Starlight/Ambience/Music/ambifailure.ogg

- type: !PartialOnly soundCollection
  id: AmbienceGeneral
  files:
    - /Audio/_Starlight/Ambience/Music/ambigen2.ogg

- type: !PartialOnly soundCollection
  id: AmbienceMaintenance
  files:
    - /Audio/_Starlight/Ambience/Music/ambimaint.ogg
    - /Audio/Ambience/ambimystery.ogg
    - /Audio/Ambience/ambiodd.ogg
