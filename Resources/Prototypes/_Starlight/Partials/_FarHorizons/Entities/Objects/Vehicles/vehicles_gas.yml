- type: !PartialOnly entity
  id: VehicleGasBuckleBase
  components:
  - type: VehicleIgnition
    startupSound:
      path: /Audio/Effects/Vehicle/vehiclestartup.ogg
      params:
        volume: -3
  - type: VehicleHandBlocker
    blockedHands: 2
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      requireAll: true
      tags:
      - VehicleKey
      - ATVKeys
  - type: VehicleRide
    hornSound:
      path: /Audio/_FarHorizons/Vehicles/carhorn.ogg
      params:
        volume: -3
    impactSound:
      collection: MetalThud
    gunSpreadPenalty: 20
    ejectOnCrash: true
    unbuckleDelay: 2
    dismountOnStun: true
    dismountOnKnockdown: true
  - type: StrapVehicle
  - type: Strap
    buckleOffset: "0,-0.15"
  - type: Solution
    id: fueltank
    solution:
      maxVol: 150
  - type: !Remove Vehicle
  - type: !Remove VehicleBuckle
  - type: !Remove SolutionContainerManager
  save: !Remove

- type: !PartialOnly entity
  id: VehicleATV
  components:
  - type: Sprite
    layers: !Clear
    - state: vehicle
      map: ["base"]
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      requireAll: true
      tags:
      - VehicleKey
      - ATVKeys
  - type: VehicleRide
    riderSpeedAffectsVehicle: true
  - type: !Remove VehicleBuckle

- type: !PartialOnly entity
  id: VehicleATVFilled
  components:
  - type: Solution
    id: fueltank
    solution:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 150
      maxVol: 150
  - type: !Remove SolutionContainerManager

