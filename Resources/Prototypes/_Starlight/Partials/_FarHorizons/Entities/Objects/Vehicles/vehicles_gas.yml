- type: !PartialOnly entity
  id: VehicleGasBuckleBase
  components:
  - type: ContainerContainer
    containers:
      actions: !type:Container { showEnts: false }
      status-effects: !type:Container { showEnts: true, occludes: false }
  - type: VehicleIgnition
    startupSound:
      path: /Audio/Effects/Vehicle/vehiclestartup.ogg
      params:
        volume: -3
  - type: VehicleHandBlocker
    blockedHands: 2
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      requireAll: true
      tags:
      - VehicleKey
      - ATVKeys
  - type: VehicleRide
    hornSound:
      path: /Audio/_FarHorizons/Vehicles/carhorn.ogg
      params:
        volume: -3
    impactSound:
      collection: MetalThud
    gunSpreadPenalty: 20
    ejectOnCrash: true
    unbuckleDelay: 2
    dismountOnStun: true
    dismountOnKnockdown: true
  - type: StrapVehicle
  - type: Strap
    modifyBuckleDrawDepth: false
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
  - type: !Remove Vehicle
  save: !Remove

- type: !PartialOnly entity
  id: VehicleATV
  components:
  - type: DirectionalOverride
    offsets:
      North: "0, -0.125"
      South: "0, -0.125"
      East: "0.0625, -0.125"
      West: "-0.0625, -0.125"
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
  - type: Sprite
    layers: !Clear
    - state: vehicle
      map: ["base"]
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      requireAll: true
      tags:
      - VehicleKey
      - ATVKeys
  - type: VehicleRide
    riderSpeedAffectsVehicle: true
  - type: FootprintOwner
    printState: Tire
    alternateStepOffset: 0.2

