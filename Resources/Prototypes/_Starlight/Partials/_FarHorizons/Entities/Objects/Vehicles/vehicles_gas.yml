- type: !PartialOnly entity
  id: VehicleContainerBase
  components:
  - type: VehicleIgnition
    startupSound:
      path: /Audio/Effects/Vehicle/vehiclestartup.ogg
      params:
        volume: -3
  - type: VehicleHandBlocker
    blockedHands: 2
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      tags:
      - VehicleKey
  - type: VehicleRide
    hornSound:
      path: /Audio/_FarHorizons/Vehicles/carhorn.ogg
      params:
        volume: -3
    impactSound:
      collection: MetalThud
    gunSpreadPenalty: 30
    trunkAction: ActionToggleTrunk
  - type: Vehicle
    transferDamage: false
    cellPowered: !Remove
    requireIgnition: !Remove
    allowCrashing: !Remove
    baseState: !Remove
    brokenState: !Remove
    startupTime: !Remove
    startUp: !Remove
    hornSound: !Remove
    riderWhitelist: !Remove
    soundHit: !Remove
  - type: ContainerVehicle
    containerId: passenger_slot
  - type: ContainerVehicleEntry
    entryDelay: 1.5
    exitDelay: 1.5
  - type: VehiclePassengerSeats
    seats: 2
    passengerWhitelist:
      components:
      - Body
  - type: Solution
    id: fueltank
    solution:
      maxVol: 150
  - type: !Remove VehicleContainer
  - type: !Remove SolutionContainerManager
  save: !Remove

- type: !PartialOnly entity
