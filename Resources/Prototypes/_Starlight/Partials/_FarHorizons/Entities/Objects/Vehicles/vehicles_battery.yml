- type: !PartialOnly entity
  id: VehicleBatteryBuckleBase
  components:
  - type: ContainerContainer
    containers:
      actions: !type:Container { showEnts: false }
      status-effects: !type:Container { showEnts: true, occludes: false }
  - type: StrapVehicle
  - type: Strap
    modifyBuckleDrawDepth: false
  - type: DirectionalOverride
    offsets:
      North: "0, -0.0625"
      South: "0, -0.0625"
      East: "0.03125, -0.0625"
      West: "-0.03125, -0.0625"
  - type: VehicleIgnition
  - type: VehicleHandBlocker
    blockedHands: 1
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      tags:
      - VehicleKey
  - type: VehicleRide
    unbuckleDelay: 2
    dismountOnStun: true
    dismountOnKnockdown: true
    disallowWielding: true
    gunStaminaRecoil: true
    gunSpreadPenalty: 20
  - type: !Remove Vehicle
  save: !Remove

- type: !PartialOnly entity
  id: VehicleScooterElectric
  components:
  - type: Sprite
    layers: !Clear
    - state: vehicle
      map: ["base"]
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      requireAll: true
      tags:
      - VehicleKey
      - ScooterElectricKeys
  - type: VehicleRide
    riderSpeedAffectsVehicle: true
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
  - type: FootprintOwner
    printState: Tire
    alternateStepOffset: 0.15

