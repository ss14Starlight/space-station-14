- type: !PartialOnly entity
  id: VehicleBatteryBuckleBase
  components:
  - type: StrapVehicle
  - type: Strap
    buckleOffset: "0,-0.15"
  - type: VehicleIgnition
  - type: VehicleHandBlocker
    blockedHands: 1
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      tags:
      - VehicleKey
  - type: VehicleRide
    unbuckleDelay: 2
    dismountOnStun: true
    dismountOnKnockdown: true
    disallowWielding: true
    gunStaminaRecoil: true
    gunSpreadPenalty: 20
  - type: !Remove Vehicle
  - type: !Remove VehicleBuckle
  save: !Remove

- type: !PartialOnly entity
  id: VehicleSecway
  components:
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      requireAll: true
      tags:
      - VehicleKey
      - SecwayKeys
  - type: Sprite
    layers: !Clear
    - state: vehicle
      map: ["base"]
  - type: VehicleRide
    riderSpeedAffectsVehicle: true
  - type: !Remove VehicleBuckle

- type: !PartialOnly entity
  id: VehicleSecwayTurbo
