    - state: vehicle
      map: ["base"]
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      requireAll: true
      tags:
      - VehicleKey
      - SecwayTurboKeys

- type: !PartialOnly entity
  id: VehicleSecwayTurboFilled
  components:
  - type: ContainerFill
    containers:
      key_slot: !Clear
      - VehicleKeySecwayTurbo

- type: !PartialOnly entity
  id: VehicleSecwayS
  components:
  - type: Sprite
    layers: !Clear
    - state: vehicle
      map: ["base"]

- type: !PartialOnly entity
