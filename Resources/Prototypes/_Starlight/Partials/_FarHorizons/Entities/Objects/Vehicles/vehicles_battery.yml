- type: !PartialOnly entity
  id: VehicleBatteryBuckleBase
  components:
  - type: StrapVehicle
  - type: Strap
    modifyBuckleDrawDepth: false
  - type: DirectionalOverride
    offsets:
      North: "0, -0.0625"
      South: "0, -0.0625"
      East: "0.03125, -0.0625"
      West: "-0.03125, -0.0625"
  - type: VehicleIgnition
  - type: VehicleHandBlocker
    blockedHands: 1
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      tags:
      - VehicleKey
  - type: VehicleRide
    unbuckleDelay: 2
    dismountOnStun: true
    dismountOnKnockdown: true
    disallowWielding: true
    gunStaminaRecoil: true
    gunSpreadPenalty: 20
  - type: !Remove Vehicle
  - type: !Remove VehicleBuckle
  save: !Remove

- type: !PartialOnly entity
  id: VehicleSegway
  components:
  - type: Sprite
    layers: !Clear
    - state: vehicle
      map: ["base"]
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      requireAll: true
      tags:
      - VehicleKey
      - SegwayKeys
  - type: VehicleRide
    riderSpeedAffectsVehicle: true
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
  - type: !Remove VehicleBuckle
  - type: FootprintOwner
    printState: Tire
    alternateStepOffset: 0.15

- type: !PartialOnly entity
  id: VehicleSecway
  components:
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      requireAll: true
      tags:
      - VehicleKey
      - SecwayKeys
  - type: Sprite
    layers: !Clear
    - state: vehicle
      map: ["base"]

- type: !PartialOnly entity
  id: VehicleSecwayTurbo
  components:
  - type: Sprite
    layers: !Clear
    - state: vehicle
      map: ["base"]

- type: !PartialOnly entity
  id: VehicleSecwayS
  components:
  - type: Sprite
    layers: !Clear
    - state: vehicle
      map: ["base"]

- type: !PartialOnly entity
  id: VehicleSegwayNST
  components:
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
  - type: Sprite
    layers: !Clear
    - state: vehicle
      map: ["base"]
  - type: GenericKeyedVehicle
    containerId: key_slot
    keyWhitelist:
      requireAll: true
      tags:
      - VehicleKey
