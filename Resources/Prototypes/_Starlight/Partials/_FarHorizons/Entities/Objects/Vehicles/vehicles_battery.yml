- type: !PartialOnly entity
  id: VehicleJanicartFilled
  components:
  - type: Solution
    id: watertank
    solution:
      maxVol: 100
      reagents:
      - ReagentId: Water
        Quantity: 100
  - type: ContainerFill
    containers:
      cell_slot: !Remove
  - type: !Remove SolutionContainerManager
  - type: !Remove VehicleMods
