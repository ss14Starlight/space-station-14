          reagent: Nitrium
          min: 1
          max: 8
        time: 1.5
      - !type:ReduceSleepiness
        conditions:
        - !type:ReagentCondition
          reagent: Nitrium
          min: 8
          max: 12
        time: 2.5
      - !type:ReduceSleepiness
        conditions:
        - !type:ReagentCondition
          reagent: Nitrium
          min: 12
        time: 4
