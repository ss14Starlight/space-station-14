- type: !PartialOnly entity
  id: ClothingOuterArmorMetalHydrogen
  description: A superb armor made with the toughest and rarest materials available to man, although its innate malleability leaves it slightly more vulnerable to bludgeoning.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.55
        Piercing: 0.50
        Heat: 0.60
  - type: ExplosionResistance
    damageCoefficient: 0.80
  - type: StaminaResistance
    damageCoefficient: 0.75
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: Pierceable
    level: HardenedMetal
  - type: ArmorSparkEffect
    alwaysSparks: true

- type: !PartialOnly entity
  id: ClothingOuterArmorAtmosian
  description: Despite some armour plating needed to be removed in order to retain space worthiness and manoeuvrability, this fire suit bolstered with metal hydrogen can still take some punishment.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.70
        Slash: 0.60
        Piercing: 0.55
        Heat: 0.50
        Cold: 0.80
  - type: ExplosionResistance
    damageCoefficient: 0.85
  - type: FireProtection
    reduction: 0.80
  - type: StaminaResistance
    damageCoefficient: 0.75
  - type: ClothingSpeedModifier
    walkModifier: 0.80
    sprintModifier: 0.80
  - type: Pierceable
    level: HardenedMetal
  - type: ArmorSparkEffect
    alwaysSparks: true
