- type: !PartialOnly antag
  id: HeadRev
  requirements:
  - !CombineIndex:0
    time: 72h
  - !type:DepartmentTimeRequirement
    department: Command
    time: 12h # Have to be a leader. You're essentially making your own chain of command in this role.
  - !type:RoleTimeRequirement
    role: JobSecurityOfficer # Less important than some of the other antags to know
    time: 1h
  playTimeTracker: AntagHeadRev

- type: !PartialOnly antagSpecifier
  id: HeadRev
  allowNonHumans: true
  blacklist:
    components:
    - AntagImmune
    - MindShield
    tags:
    - CantBecomeRevolutionary
  components:
  - !CombineIndex:1
    type: HeadRevolutionary
    blacklist:
      components:
      - Revolutionary
      # - BorgChassis # Borgis are convertible.
      - MindShield
      - Zombie
      tags:
      - CantBecomeRevolutionary
    whitelist:
      components:
      - HumanoidAppearance

- type: !PartialOnly antag
  id: Rev
  playTimeTracker: AntagRev

- type: !PartialOnly startingGear
  id: HeadRevGear
  storage:
    back:
    - USSPUplinkImplanter
