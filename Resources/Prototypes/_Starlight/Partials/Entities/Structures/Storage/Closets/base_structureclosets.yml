- type: !PartialOnly entity
  id: ClosetBase
  description: A standard-issue NanoTrasen storage unit.
  components:
  - type: ChildBlockVision
  - type: FlippableStructure
    delay: 3
    unflipDelay: 4
    coverChance: 0.55
    disablePower: false
    flippedBounds: "-0.48,-0.3,0.48,0.3"
    crushDamage:
      types:
        Blunt: 12

- type: !PartialOnly entity
  id: BaseWallCloset
  description: A standard-issue NanoTrasen storage unit, now on walls.

- type: !PartialOnly entity
  id: BaseWallLocker
  components:
  - type: Lock
    popupMessage: false
    powerNeeded: true
  - type: Sprite
    layers:
    # Maintenance panel (written in reverse: partial list items are appended back to front)
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: panel_open
      sprite: Structures/Storage/closet.rsi
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
  # Wires panel
  - type: PoweredLocker
  - type: StationAiWhitelist
  - type: WiresPanel
  - type: WiresPanelSecurity
    wiresAccessible: True
  - type: WiresVisuals
  - type: Wires
    boardName: wires-board-name-locker
    layoutId: Locker
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: GenericVisualizer
    visuals:
      enum.ElectrifiedVisuals.ShowSparks:
        enum.ElectrifiedLayers.Sparks:
          True: { visible: True }
          False: { visible: False }
