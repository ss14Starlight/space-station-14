- type: !PartialOnly entity
  id: CrateGeneric
  components:
  - type: Sprite
    layers:
    - !Index:3
      state: crate_ribbon_sealed
      sprite: _Starlight/Structures/Storage/tamper_seal32.rsi
      visible: false
      map: [ "enum.TamperSealLayers.Sealed" ]
  - type: ChildBlockVision # Blinding from containers
  - type: TamperSealable
    destroyToolQualities: [ Cutting, Slicing ]
  - type: PaperLabel # Overrides parent
    labelSlot:
      priority: 100 # <-- Only change relative to BasePaperLabelable.
      insertVerbText: comp-paper-label-insert
      ejectVerbText: comp-paper-label-eject
      whitelist:
        components:
          - Paper
      blacklist:
        tags:
          - Book
  - type: ProjectileCover
    proneOnly: true

- type: !PartialOnly entity
  id: CrateBaseSecure
  components:
  - type: Lock
    popupMessage: false
    powerNeeded: true
  - type: Sprite
    layers:
    # Maintenance panel and tamper seal (written in reverse: partial list items are appended back to front)
    - state: crate_ribbon_sealed # Tamper seal
      sprite: _Starlight/Structures/Storage/tamper_seal32.rsi
      visible: false
      map: [ "enum.TamperSealLayers.Sealed" ]
    - state: electrified
      sprite: Effects/electricity.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.Sparks"]
    - state: electrified_ai
      sprite: Interface/Misc/ai_hud.rsi
      shader: unshaded
      visible: false
      map: ["enum.ElectrifiedLayers.HUD"]
    - state: panel_open
      sprite: _Starlight/Structures/Storage/Crates/base.rsi
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
  # Wires panel
  - type: PoweredLocker
  - type: StationAiWhitelist
  - type: WiresPanel
  - type: WiresPanelSecurity
    wiresAccessible: True
  - type: WiresVisuals
  - type: Wires
    boardName: wires-board-name-locker
    layoutId: Locker
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: GenericVisualizer
    visuals:
      enum.ElectrifiedVisuals.ShowSparks:
        enum.ElectrifiedLayers.Sparks:
          True: { visible: True }
          False: { visible: False }
      enum.PaperLabelVisuals.HasLabel:
        enum.PaperLabelVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
      enum.PaperLabelVisuals.LabelType:
        enum.PaperLabelVisuals.Layer:
          Paper: { state: paper }
          Bounty: { state: bounty }
          CaptainsPaper: { state: captains_paper }
          Invoice: { state: invoice }
