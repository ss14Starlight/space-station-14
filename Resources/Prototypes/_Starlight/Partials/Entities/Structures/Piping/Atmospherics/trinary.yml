- type: !PartialOnly entity
  id: !type:CreateVariants
    values: &protos
    - GasFilter
    - GasFilterFlipped
    - GasMixer
    - GasMixerFlipped
    - PressureControlledValve
  components:
    - type: SandboxCopyOverride
      override: !type:CreateVariants
        values: *protos

# Subfloor layers
- type: !PartialOnly entity
  id: GasTrinaryBase
  components:
    - type: SubFloorHide
      subfloorLayer: Pipes

- type: !PartialOnly entity
  id: GasFilter
  components:
    - type: SubFloorHide
      subfloorLayer: Pipes
    - type: ActivatableUI
      key: enum.GasFilterUiKey.Key
    - type: ActivatableUIRequiresAnchor
      popup: comp-gas-filter-ui-needs-anchor
    - type: VentCrawlTube
    - type: VentCrawlJunction
      degrees:
        - 0
        - -90
        - 180
    - type: DeviceNetwork
      deviceNetId: Wireless
      receiveFrequencyId: BasicDevice
      prefix: device-address-prefix-gas-filter
    - type: WirelessNetworkConnection
      range: 200
    - type: DeviceLinkSink
      ports:
        - On
        - Off
        - Toggle
    - type: GasFilterSignal

- type: !PartialOnly entity
  id: GasFilterFlipped
