- type: !PartialOnly entity
  id: !type:CreateVariants
    values: &protos
    - GasVentPump
    - GasPassiveVent
    - GasVentScrubber
    # GasOutletInjector and BaseGasCondenser define this component inline instead.
    # Adding it through a partial would replace their first component, Sprite, due to index-based sequence merging.
    - GasThermoMachineFreezer
    - GasThermoMachineFreezerEnabled
    - GasThermoMachineHeater
    - GasThermoMachineHeaterEnabled
    - GasThermoMachineHellfireFreezer
    - GasThermoMachineHellfireHeater
  components:
    - type: SandboxCopyOverride
      override: !type:CreateVariants
        values: *protos
