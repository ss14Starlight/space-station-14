      - TableFancyGreenFlipped
      - TableFancyOrangeFlipped
      - TableFancyWhiteFlipped

- type: !PartialOnly entity
  id: CounterBase
  components:
  - type: ProjectileCover
    proneOnly: true

- type: !PartialOnly entity
  id: TableWeb
  components:
  - type: Solution
    id: food
    solution:
      maxVol: 40
      reagents:
      - ReagentId: Fiber
        Quantity: 40
  - type: Tag
    tags:
    - ClothMade
  - type: BadFood
  - type: Edible
    delay: 3
    requiresSpecialDigestion: true
    solution: food
  - type: FlavorProfile
    flavors:
      - cobwebs
    ignoreReagents:
      - Fiber
