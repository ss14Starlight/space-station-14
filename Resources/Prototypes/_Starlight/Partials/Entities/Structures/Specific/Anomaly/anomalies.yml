- type: !PartialOnly entity
  id: AnomalyShadow
  suffix: Dark
  components:
  - type: !Remove Portal
  - type: PointLight
    color: "#793a80dd"
  - type: DarkLight
  - type: Shadegen
    range: 5
    destroyLights: true
  - type: Anomaly
    minPulseLength: 30
  - type: EntitySpawnAnomaly
    entries: !Clear
    - settings:
        spawnOnPulse: true
        minAmount: 1
        maxAmount: 2
        maxRange: 2
      spawns:
      - DarkRandom
      - DarkAnomalyLootSpawner
    - settings:
        spawnOnSuperCritical: true
        minAmount: 30
        maxAmount: 50
        maxRange: 50
      spawns:
      - DarkRandom
  - type: Tag
    tags:
      - TheDark
  - type: ParticleEmitter
    effect: ShadowMist
