- type: !PartialOnly entity
  id: !type:CreateVariants
    values: &protos
    - GasVentPumpFreezer
    - GasVentPumpFreezerAlt1
    - GasVentPumpFreezerAlt2
    - GasVentPumpFreezerAlt3
    - GasVentPumpFreezerAlt4
    - GasVentScrubberFreezer
    - GasVentScrubberFreezerAlt1
    - GasVentScrubberFreezerAlt2
    - GasVentScrubberFreezerAlt3
    - GasVentScrubberFreezerAlt4
  components:
    - type: SandboxCopyOverride
      override: !type:CreateVariants
        values: *protos

- type: !PartialOnly entity
  id: GasVentPumpFreezer
  components:
  - type: AtmosPipeLayers
    alternativePrototypes:
      Primary: GasVentPumpFreezer
      Secondary: GasVentPumpFreezerAlt1
      Tertiary: GasVentPumpFreezerAlt2
      Quaternary: GasVentPumpFreezerAlt3
      Quinary: GasVentPumpFreezerAlt4

- type: !PartialOnly entity
  id: GasVentScrubberFreezer
  components:
  - type: AtmosPipeLayers
    alternativePrototypes:
      Primary: GasVentScrubberFreezer
      Secondary: GasVentScrubberFreezerAlt1
      Tertiary: GasVentScrubberFreezerAlt2
      Quaternary: GasVentScrubberFreezerAlt3
      Quinary: GasVentScrubberFreezerAlt4

- type: !PartialOnly entity
  id: AirAlarmFreezer
  name: freezer air alarm
  description: An air alarm set up for use in freezers. It doesn't raise an alarm about the cold.
