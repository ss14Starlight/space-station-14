# it's important these values match the ones in lights.yml - these PointLight values are used in pre-mapinit lighting
# if they don't match, the map's will not be lit as you'd expect it to be from mapping!
- type: !PartialOnly entity
  id: AlwaysPoweredWallLight #uses LightTube
  components:
  - type: PointLight
    color: "#FFE2C8"
    radius: 7
    energy: 0.6
    softness: 1.5
    falloff: 8
    curveFactor: 1

- type: !PartialOnly entity
  id: PoweredSmallLightEmpty #uses LightBulb
  components:
  - type: PointLight
    color: "#FFD1A3"
    radius: 6
    energy: 0.6
    softness: 1.3

- type: !PartialOnly entity
  id: !type:CreateVariants #uses LedLightTube
    values:
    - PoweredlightLED
    - AlwaysPoweredLightLED
  components:
  - type: PointLight
    color: "#F6EFE4"
    radius: 8.5
    energy: 0.65
    softness: 1.3

- type: !PartialOnly entity
  id: PoweredLEDSmallLight #uses LedLightBulb
  components:
  - type: PointLight
    color: "#F6EFE4"
    radius: 6.5
    energy: 0.6
    softness: 1.3

- type: !PartialOnly entity
  id: !type:CreateVariants #uses ExteriorLightTube
    values:
    - PoweredlightExterior
    - AlwaysPoweredLightExterior
  components:
  - type: PointLight
    color: "#B4FCF0FF"
    radius: 12
    energy: 4
    softness: 0.8

- type: !PartialOnly entity
  id: !type:CreateVariants #uses SodiumLightTube
    values:
    - PoweredlightSodium
    - AlwaysPoweredlightSodium
  components:
  - type: PointLight
    color: "#FFAF38"
    radius: 10
    energy: 4
    softness: 0.5

