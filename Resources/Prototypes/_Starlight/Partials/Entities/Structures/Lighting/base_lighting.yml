- type: !PartialOnly entity
  id: AlwaysPoweredWallLight
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Wallmounts/Lighting/light_tube.rsi
  - type: PointLight
    offset: "0, -0.495" # reverts Upstream #44843, which made wall mounted lights look extremely sharp
  # ES START
  - type: ESSparkOnHit
  # ES END

- type: !PartialOnly entity
  id: PoweredlightEmpty
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Wallmounts/Lighting/light_tube.rsi

- type: !PartialOnly entity
  id: AlwaysPoweredLightExterior
  components:
  - type: PointLight
    energy: 4 # 4.5 -> 4
    softness: 0.8 # 0.5 -> 0.8

- type: !PartialOnly entity
  id: SmallLight
  components:
    - type: Sprite
      sprite: _Starlight/Structures/Wallmounts/Lighting/light_small.rsi

- type: !PartialOnly entity
  id: PoweredSmallLightEmpty
  components:
