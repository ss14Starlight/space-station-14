      - PoweredlightEmpty
      - PoweredSmallLightEmpty
      - PoweredLightPostSmallEmpty
      - PoweredStrobeLightEmpty
  components:
    - type: ToggleableDevice
    - type: ToggleableDeviceSignaling
    - type: DeviceLinkSink
      ports:
        - "On"
        - "Off"
        - "Toggle"
        - "ToggleableDeviceState"
        - "ToggleableDeviceStateInverted"
    - type: DeviceLinkSource
      ports:
        - "Status"
        - "ToggleableDeviceStatusInverted"
