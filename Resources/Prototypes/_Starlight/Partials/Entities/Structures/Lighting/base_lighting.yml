    sprite: _Starlight/Structures/Wallmounts/Lighting/light_small.rsi
  - type: PointLight
    offset: "0, -0.495" # reverts Upstream #44843, which made wall mounted lights look extremely sharp

- type: !PartialOnly entity
  id: EmergencyLight
  description: A small light with an internal battery that turns on as soon as it stops receiving any power. NanoTrasen technology allows it to adapt its color to alert crew to the conditions of the station.
  components:
  - type: PointLight
    radius: 7
    energy: 1
  - type: Sprite
    sprite: _Starlight/Structures/Wallmounts/Lighting/emergency_light.rsi

- type: !PartialOnly entity
  id: !type:CreateVariants
    values:
    - PoweredlightCyan
    - AlwaysPoweredlightCyan
  components:
  - type: PointLight
    color: "#5ae8ed"

