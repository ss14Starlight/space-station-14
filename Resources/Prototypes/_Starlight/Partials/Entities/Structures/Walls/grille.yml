- type: !PartialOnly entity
  id: ClockworkGrille
  components:
  - type: Sprite
    layers:
    - state: electrified
      sprite: Effects/electricity.rsi
      map: ["enum.ElectrifiedLayers.Sparks"]
      shader: unshaded
      visible: false

- type: !PartialOnly entity
  id: Grille
  components:
  - type: DamagedOnShock
    damage:
      types:
        Shock: 12
