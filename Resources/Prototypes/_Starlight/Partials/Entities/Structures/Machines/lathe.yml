    staticPacks:
    - !Remove SecurityAmmoStatic
    - NullSpaceDrainer
    - StarlightSecurityAmmoStatic
    - TapeRecorder
    dynamicPacks:
    - !Remove SecurityEquipment
    - !Remove SecurityBoards
    - !Remove SecurityExplosives
    - !Remove SecurityAmmo
    - !Remove SecurityWeapons
    - SecurityScienceBlueSpace
