- type: !PartialOnly entity
  id: OreProcessor
  components:
    - type: Sprite
      layers:
        # Add magnet layer
        - state: magnet_on
          map: ["enum.ToggleableVisuals.Layer"]
          visible: false
    # add magnet pickup to ore processors
    - type: ItemToggle
      onUse: false
      onActivate: false
      verbToggleOn: verb-toggle-magnet-activate
      verbToggleOff: verb-toggle-magnet-deactivate
      soundActivate:
        collection: sparks
        params:
          variation: 0.250
      soundDeactivate:
        collection: sparks
        params:
          variation: 0.250
    - type: AltUseToggle
    - type: ComponentToggler
      components:
      - type: MagnetPickup
        range: 3
        requiresEquipping: false
        slotFlags: 0
    - type: GenericVisualizer
      visuals:
        enum.ToggleableVisuals.Enabled:
          enum.ToggleableVisuals.Layer:
            True: { visible: true }
            False: { visible: false }
