- type: !PartialOnly entity
  id: MachineMaterialSilo
  components:
  # Add toggleable magnet pickup
  - type: ItemToggle
    onUse: false
    onActivate: false
    verbToggleOn: verb-toggle-magnet-activate
    verbToggleOff: verb-toggle-magnet-deactivate
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
  - type: AltUseToggle
  - type: ComponentToggler
    components:
    - type: MagnetPickup
      requiresEquipping: false
      slotFlags: 0
