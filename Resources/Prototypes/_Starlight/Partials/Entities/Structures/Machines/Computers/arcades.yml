- type: !PartialOnly entity
  id: ArcadeBase
  components:
  - type: PointLight
    castShadows: false # lighting optimization
  - type: GenericVisualizer  # Override to prevent edge connection sprites; keep power/wires visuals from BaseComputer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }
      enum.EdgeConnectionVisuals.ConnectionMask:
        computerLayerBody:
          None: { state: arcade }
  - type: EdgeConnection
    connectionKey: other

- type: !PartialOnly entity
  id: SpaceVillainArcade
  components:
  - type: SpaceVillainArcade
    rewardMinAmount: !Remove
    rewardMaxAmount: !Remove
    possibleRewards: !Remove
  - type: ArcadeReward
    rewardMinAmount: 0
    rewardMaxAmount: 0
    possibleRewards: !type:NestedSelector
      tableId: ArcadeRewardsTable

- type: !PartialOnly entity
  id: SpaceVillainArcadeFilled
  components:
  - type: !Remove SpaceVillainArcade
    rewardMinAmount: !Remove
    rewardMaxAmount: !Remove
  - type: ArcadeReward
    rewardMinAmount: 5
    rewardMaxAmount: 8

- type: !PartialOnly entity
  id: BlockGameArcade
  components:
  - type: ArcadeScoreboard
    serverScoreboard: BlockGame
