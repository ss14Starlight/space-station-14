- type: !PartialOnly entity
  id: ComputerComms
  components:
    - type: ActivatableUIRequiresPower
      allowPowerCellFallback: true
    - type: ActivatableUIRequiresPowerCell
    - type: PowerCellFallbackVisuals
    - type: BatteryVisuals
    - type: ContainerContainer
      containers:
        cell_slot: !type:ContainerSlot
          ent: null
          showEnts: false
          occludes: true
        board: !type:Container
          ents: []
          showEnts: false
          occludes: true
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          blacklist:
            tags:
              - MechReactor
    - type: PowerCellDraw
      drawRate: 3
      useCharge: 10
    - type: PowerCellSlot
      cellSlotId: cell_slot
      requiresOpenPanelToEject: true
    - type: Charger
      slotId: cell_slot
      chargeRate: 10
      passiveDraw: 10
    - type: Sprite
      layers:
        - map: ["computerLayerBatteryScreen"]
          sprite: _Starlight/Structures/Machines/computers.rsi
          state: comm
          visible: false
    - type: GenericVisualizer
      visuals:
        # This partial replaces BaseComputer's visualizer, so retain its mappings.
        enum.ComputerVisuals.Powered:
          computerLayerScreen:
            True: { visible: true, shader: unshaded }
            False: { visible: false }
          computerLayerKeys:
            True: { visible: true, shader: unshaded }
            False: { visible: true, shader: shaded }
        enum.WiresVisuals.MaintenancePanelState:
          enum.WiresVisualLayers.MaintenancePanel:
            True: { visible: true }
            False: { visible: false }
        enum.EdgeConnectionVisuals.ConnectionMask:
          computerLayerBody:
            None: { state: computer, sprite: Structures/Machines/computers.rsi }
            West: { state: computer_r, sprite: _Starlight/Structures/Machines/computers.rsi }
            East: { state: computer_l, sprite: _Starlight/Structures/Machines/computers.rsi }
            East, West: { state: computer_l_r, sprite: _Starlight/Structures/Machines/computers.rsi }
        enum.PowerCellFallbackVisuals.VisualState:
          computerLayerBatteryScreen:
            Off: { visible: false }
            OnBatteryIdle: { visible: true, shader: unshaded, color: "#8f7541" }
            OnBatteryInUse: { visible: true, shader: unshaded, color: "#e8c36b" }

# These variants replace the base sprite layers, so add their battery-tinted screen layers back.
