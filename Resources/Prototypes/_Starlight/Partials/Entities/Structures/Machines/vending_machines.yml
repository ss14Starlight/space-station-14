
- type: !PartialOnly entity
  id: VendingMachine
  components:
  - type: FlippableStructure
    delay: 4
    unflipDelay: 6
    coverChance: 0.6
    flippedBounds: "-0.45,-0.32,0.45,0.32"
    crushDamage:
      types:
        Blunt: 15

- type: !PartialOnly entity
  id: VendingMachine
  components:
  - type: UserInterface
    interfaces:
      enum.VendingMachineUiKey.Key:
        type: VendingMachineKeypadBoundUserInterface

- type: !PartialOnly entity
  id: !type:CreateVariants
    values:
    - VendingMachineMedical
    - VendingMachineWallMedical
    - VendingMachineMedicalSecurity
    - VendingMachineMedicalSyndicate
    - VendingMachineWallMedicalSyndicate
    - VendingMachineMedicalDeforest
    - VendingMachineWallMedicalDeforest
    - VendingMachineMedicalGold
    - VendingMachineWallMedicalGold
    - VendingMachineChemicals
    - VendingMachineChemicalsSyndicate
    - VendingMachineRobotics
  components:
  - type: UserInterface
    interfaces:
      enum.VendingMachineUiKey.Key:
        type: VendingMachineBoundUserInterface
