# Nerf the structure-mounted barricade since it's craftable and Literally Just Two Planks

- type: !PartialOnly entity
  id: BarricadeBlock
  components:
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]


- type: Tag
  id: Barricade

- type: !PartialOnly entity
  id: BaseBarricade
  components:
  - type: Tag
    tags:
    - Barricade

- type: !PartialOnly entity
