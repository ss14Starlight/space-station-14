# Krammer - pump action
- type: !PartialOnly entity
  id: WeaponShotgunKammerer
  components:
  - type: BallisticAmmoProvider
    soundRack:
      collection: CockPumpAction

# Enforcer - new gunshot + cocking handle sound
- type: !PartialOnly entity
  id: WeaponShotgunEnforcer
  components:
  - type: Gun
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/gun_shotgun_automatic.ogg
  - type: BallisticAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg

# Hushpup - did you know this is a modified Enforcer in-lore?
- type: !PartialOnly entity
  id: WeaponShotgunHushpup
  components:
  - type: BallisticAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg # surprising enough, this shotgun is a modified version of the Enforcer (renamed to )

# Bulldog - new gunshot
- type: !PartialOnly entity
  id: WeaponShotgunBulldog
  components:
  - type: Gun
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/gun_shotgun_automatic.ogg

