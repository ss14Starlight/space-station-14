- type: !PartialOnly entity
  id: Stunbaton
  components:
  - type: Sprite
    layers:
    - state: stunbaton_on
      visible: true
      map: [ "enum.StunbatonVisualLayers.Stunbaton_on" ]
    - state: stunbaton_off
      visible: false
      map: [ "enum.StunbatonVisualLayers.Stunbaton_off" ]
    - state: stunbaton_nocell
      visible: false
      map: [ "enum.StunbatonVisualLayers.Stunbaton_nocell" ]
  - type: Appearance
  - type: ComponentToggler
    components:
    -   type: ReactionMixer
        reactionTypes:
        - Electrolysis
        timeToMix: 7
        energyPerUse: 36 
        mixerType: Machine #This means that you use the batong on the beaker
        mixingSound: !type:SoundPathSpecifier
          path: /Audio/Machines/buzz_loop.ogg
          params:
            volume: -6
  - type: GenericVisualizer
    visuals:
      enum.StunbatonVisuals.Stunbaton_on:
        enum.StunbatonVisualLayers.Stunbaton_on:
          True: { visible: true }
          False: { visible: false }
      enum.StunbatonVisuals.Stunbaton_off:
        enum.StunbatonVisualLayers.Stunbaton_off:
          True: { visible: true }
          False: { visible: false }
      enum.StunbatonVisuals.Stunbaton_nocell:
        enum.StunbatonVisualLayers.Stunbaton_nocell:
          True: { visible: true }
          False: { visible: false }
  - type: Stunbaton
    energyPerUse: 36 # from 50 to account for medium power cells. (720 charge with 36 per use = 20 hits)
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        blacklist:
          tags:
          - MechReactor
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: PowerCellDraw
    drawRate: 1.5
  - type: ToggleCellDraw
  - type: ItemToggleMeleeWeapon
    deactivatedSoundOnHit: 
      collection: GenericHit 
  - type: MeleeWeapon
    soundHit:
      collection: GenericHit
  # ES START
  - type: ESSparkOnItemToggle
    count: 1
    sparkPrototype: SLEffectSparksBaton # Starlight, smaller sparks
  # ES END
  - type: StaminaDamageOnHit
    damage: 35
    sound: /Audio/Weapons/egloves.ogg
  - type: StaminaDamageOnCollide
    damage: 35
    sound: /Audio/Weapons/egloves.ogg
  - type: LandAtCursor # it deals stamina damage when thrown



