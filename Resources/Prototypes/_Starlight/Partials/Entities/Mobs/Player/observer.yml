# shared parent between aghosts, replay spectators and normal observers
- type: !PartialOnly entity
  id: MobObserverBase
  components:
  - type: LanguageSpeaker # Starlight
  - type: UniversalLanguageSpeaker # Starlight
  - type: DarkLight # Starlight
  - type: ActiveInputMover # Starlight
  - type: Speech # Starlight, only adds speech bubble while typing
  - type: AntagImmune # Starlight

# proto for player ghosts specifically
- type: !PartialOnly entity
  id: MobObserver
  components:
  - type: ComplexInteraction # Starlight-start
  - type: RadarConsole
    followEntity: true
  - type: UserInterface
    interfaces:
        enum.RadarConsoleUiKey.Key:
          type: RadarConsoleBoundUserInterface
  - type: IntrinsicUI
    uis:
      enum.RadarConsoleUiKey.Key:
        toggleAction: ActionObserverShowRadar # Starlight-en
