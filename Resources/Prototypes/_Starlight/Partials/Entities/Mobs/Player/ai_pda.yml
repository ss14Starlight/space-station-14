- type: entity
  parent: IDCardStandard
  id: StationAiIDCard
  name: station AI ID card
  components:
  - type: Sprite
    layers:
    - state: default
  # Store the job prototype on the card so NanoChat and the ejection guard can identify this ID.
  - type: IdCard
    jobPrototype: StationAi
  - type: PresetIdCard
    job: StationAi

- type: !PartialOnly entity
  id: AiHeld
  # These component bundles are applied to an existing AI, not saved as standalone map entities.
  save: false
  components:
  - type: Pda
    id: StationAiIDCard
  - type: CartridgeLoader
    uiKey: enum.PdaUiKey.Key
    preinstalled:
    - CrewManifestCartridge
    - NewsReaderCartridge
    - NanoChatCartridge
    cartridgeSlot:
      locked: true
  - type: UserInterface
    interfaces:
      enum.PdaUiKey.Key:
        type: PdaBoundUserInterface
  - type: IntrinsicUI
    uis:
      enum.PdaUiKey.Key:
        toggleAction: ActionStationAiOpenPDA
