- type: entity
  parent: IDCardStandard
  id: StationAiIDCard
  name: station AI ID card
  components:
  - type: Sprite
    layers:
    - state: default
  - type: IdCard
    jobPrototype: StationAi
  - type: PresetIdCard
    job: StationAi

- type: !PartialOnly entity
  id: AiHeld
  save: false
  components:
  - type: Pda
    id: StationAiIDCard
    idSlot:
      # The AI must retain this ID; it is unlocked briefly in server setup to insert the card.
      locked: true
  - type: CartridgeLoader
    uiKey: enum.PdaUiKey.Key
    preinstalled:
    - CrewManifestCartridge
    - NewsReaderCartridge
    - NanoChatCartridge
    cartridgeSlot:
      locked: true
  - type: UserInterface
    interfaces:
      enum.PdaUiKey.Key:
        type: PdaBoundUserInterface
  - type: IntrinsicUI
    uis:
      enum.PdaUiKey.Key:
        toggleAction: ActionStationAiOpenPDA
