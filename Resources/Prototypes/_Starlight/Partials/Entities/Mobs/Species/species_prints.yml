# Barefoot print shapes per species. PrintState only applies while the shoes slot is empty;
# anything worn there falls back to the generic boot print, so species without an entry here
# simply use the default barefoot shape.
#
# Neocyte variants parent BaseMobNeocyte rather than their namesake species, so each needs its
# own entry; inheriting from a sibling does nothing. Variants not listed match their organic
# counterpart's default barefoot shape.

# --- paw ---
- type: !PartialOnly entity
  id: BaseMobVulpkanin
  components:
  - type: FootprintOwner
    printState: Paw

- type: !PartialOnly entity
  id: BaseMobNeoVulpkanin
  components:
  - type: FootprintOwner
    printState: Paw

- type: !PartialOnly entity
  id: BaseMobRodentia
  components:
  - type: FootprintOwner
    printState: Paw

- type: !PartialOnly entity
  id: BaseMobFelionoid
  components:
  - type: FootprintOwner
    printState: Paw

- type: !PartialOnly entity
  id: BaseMobNeoFelionoid
  components:
  - type: FootprintOwner
    printState: Paw

- type: !PartialOnly entity
  id: BaseMobLagomorph
  components:
  - type: FootprintOwner
    printState: Paw

- type: !PartialOnly entity
  id: BaseMobNeoLagomorph
  components:
  - type: FootprintOwner
    printState: Paw

- type: !PartialOnly entity
  id: BaseMobExperiment
  components:
  - type: FootprintOwner
    printState: Paw

# The generic neocyte. Set here rather than on BaseMobNeocyte, which every variant inherits.
- type: !PartialOnly entity
  id: MobNeocyte
  components:
  - type: FootprintOwner
    printState: Paw

