- type: !PartialOnly entity
  id: FoodEggChickenFertilized
  components:
  - type: TimedSpawner
    allowContainerPlacement: true

- type: !PartialOnly entity
  id: FoodEggDuckFertilized
  components:
  - type: TimedSpawner
    allowContainerPlacement: true

- type: !PartialOnly entity
  id: MobBat
  components:
  - type: FirelockOpener

- type: !PartialOnly entity
  id: MobChicken
  components:
  - type: FirelockOpener

- type: !PartialOnly entity
  id: MobDuckMallard
  components:
  - type: FirelockOpener

- type: !PartialOnly entity
  id: MobPig
  components:
  - type: FirelockOpener

- type: !PartialOnly entity
  id: MobBaseAncestor
  components:
  - type: UserInterface
    interfaces:
      enum.VampireClassUiKey.Key:
        type: VampireClassBui
      enum.VampireLocateUiKey.Key:
        type: VampireLocateBui
      enum.DamnationsMenuUiKey.Key:
        type: DevilDamnationsBoundUserInterface
        requireInputValidation: false

- type: !PartialOnly entity
  id: MobBaseKobold
  components:
  - type: CosmicLapseForm # Kobolds inherit the monkey species ID, so lapse needs an explicit form
    form: CosmicLapseMobKobold
  # Reptilian, so claws rather than the default barefoot shape.
  - type: FootprintOwner
    printState: Claw

- type: !PartialOnly entity
  id: MobCorgiSmart
  components:
  - type: AntagTarget
  - type: CosmicStarMarkOffset
    south: 0.03,-0.1
    north: 0.03,-0.1
    east: 0.2,-0.13
    west: -0.2,-0.13
  - type: CosmicCultConvertible

- type: !PartialOnly entity
  id: MobCatSpace
  components:
  - type: Tag
    tags:
    - DoorBumpOpener
    - VimPilot

# Paw prints instead of the default foot sprite.
- type: !PartialOnly entity
  id: !type:CreateVariants
    values:
    - MobCorgiBaseTemplate
    - MobCat
    - MobFox
    - MobMcGriff
    - MobWalter
    - MobBingus
    - MobCatShadow
    - MobBreadDog
    - MobCatCake
  components:
  - type: FootprintOwner
    printState: Paw
    footstepDistance: 0.25
    minFootprintVolume: 0.25
    maxFootprintVolume: 0.5

- type: !PartialOnly entity
  id: MobMonkeySyndicateAgentNukeops
  components:
  - type: LanguageSpeaker
  - type: LanguageKnowledge
    speaks:
    - Ancestor
    understands:
    - Ancestor
    - GalacticCommon
  - type: !Append Tag
    tags:
    - CantBecomeRevolutionary

- type: !PartialOnly entity
  id: MobKoboldSyndicateAgentNukeops
  components:
  - type: !Append Tag
    tags:
    - CantBecomeRevolutionary
