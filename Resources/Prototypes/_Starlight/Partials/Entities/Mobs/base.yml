# Upstream converted MobCombat's unarmed damage from Brute 5 to Blunt 5 when it removed damage groups.
# Starlight re-added damage groups, so this restores the original Brute split (Blunt/Slash/Piercing).
- type: !PartialOnly entity
  id: MobCombat
  components:
  - type: MeleeWeapon
    damage:
      types: !Remove
      groups:
        Brute: 5

- type: !PartialOnly entity
  id: BaseControllable
  components:
  - type: LanguageSpeaker
  - type: ParentCanBlockVision
  - type: TextToSpeech
  - type: CustomLimbVisualizer
    displacements:
      LHand:
        sizeMaps:
          32:
            sprite: _Starlight/CustomLimb/displacement.rsi
            state: l_hand
      RHand:
        sizeMaps:
          32:
            sprite: _Starlight/CustomLimb/displacement.rsi
            state: r_hand
      LLeg:
        sizeMaps:
          32:
            sprite: _Starlight/CustomLimb/displacement.rsi
            state: l_leg
      RLeg:
        sizeMaps:
          32:
            sprite: _Starlight/CustomLimb/displacement.rsi
            state: r_leg
      LFoot:
        sizeMaps:
          32:
            sprite: _Starlight/CustomLimb/displacement.rsi
            state: l_foot
      RFoot:
        sizeMaps:
          32:
            sprite: _Starlight/CustomLimb/displacement.rsi
            state: r_foot
      LArm:
        sizeMaps:
          32:
            sprite: _Starlight/CustomLimb/displacement.rsi
            state: l_arm
      RArm:
        sizeMaps:
          32:
            sprite: _Starlight/CustomLimb/displacement.rsi
            state: r_arm
