- type: !PartialOnly entity
  id: ClothingHeadBase
  components:
  - type: ExaminableSolution
    solution: stain
  - type: EmitSoundOnPickup
    sound:
      collection: ClothPickup
  - type: EmitSoundOnLand
    sound:
      collection: ClothDrop

- type: !PartialOnly entity
  id: ClothingHeadHardsuitBase
  components:
  - type: ExaminableSolution
    solution: stain

- type: !PartialOnly entity
  id: ClothingHeadHatHoodWinterBase
  components:
  - type: ExaminableSolution
    solution: stain

- type: !PartialOnly entity
  id: ClothingHeadSuitWithLightBase
  components:
  - type: HandheldLight
    turnOnSound:
      path: /Audio/Machines/machine_switch.ogg
      params:
        volume: -4
    turnOffSound:
      path: /Audio/Machines/machine_switch.ogg
      params:
        volume: -4
        pitch: 0.85
