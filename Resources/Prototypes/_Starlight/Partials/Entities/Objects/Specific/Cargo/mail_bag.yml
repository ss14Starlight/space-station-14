- type: !PartialOnly entity
  id: MailBag
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Cargo/mail_bag.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Specific/Cargo/mail_bag.rsi
  - type: Storage
    grid:
    - !Remove 0,0,4,3
    - 0,0,11,3 # makes it larger due to high pop
    whitelist:
      components:
      - !Remove Paper
      tags: !Remove
  # added toggle to activate magnet
  - type: ItemToggle
    onUse: false
    onActivate: false
    verbToggleOn: verb-toggle-magnet-activate
    verbToggleOff: verb-toggle-magnet-deactivate
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
  - type: AltUseToggle
  - type: ComponentToggler
    components:
    - type: MagnetPickup
      requiresEquipping: false # make it work even without being equipped
  # added visual indicator for magnet
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: "magnet" }
          False: { state: "icon" }
