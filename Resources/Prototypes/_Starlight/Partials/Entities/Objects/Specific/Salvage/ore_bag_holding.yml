- type: !PartialOnly entity
  id: OreBagOfHolding
  components:
  - type: !Remove MagnetPickup
    range: !Remove
  - type: ItemToggle # added toggle
    onUse: false
    verbToggleOn: verb-toggle-magnet-activate
    verbToggleOff: verb-toggle-magnet-deactivate
  - type: ComponentToggler
    components:
    - type: MagnetPickup
      range: 2
      requiresEquipping: false # make it work even without being equipped
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Mining/ore_bag_holding.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Specific/Mining/ore_bag_holding.rsi
