- type: !PartialOnly entity
  id: EncryptionKey
  abstract: !Remove # There's an actual reason for a blank encryption key to exist now.
  components:
  - type: Sprite
    layers:
      - state: crypt_gray

- type: !PartialOnly entity
  id: EncryptionKeyCentCom
  components:
  - type: Sprite
    layers:
    - !CombineIndex:0 state: crypt_silver

- type: !PartialOnly entity
  id: EncryptionKeyStationMaster
  components:
  - type: EncryptionKey
    channels:
    - Law
  - type: StealTarget
    stealGroup: EncryptionKeyHybrid
  - type: Contraband
    tier: Tier4
    contrabandType: !Remove
    allowedDepartments:
    - Command
    - CentralCommand
    - Representatives

