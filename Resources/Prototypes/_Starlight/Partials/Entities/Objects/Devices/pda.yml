# PDA glow is dim enough that it shouldn't affect night vision, but we don't want to change the energy
- type: !PartialOnly entity
  id: BasePDA
  components:
  - type: DarkLight

- type: !PartialOnly entity
  parent: ClearPDA
  id: ScurretPDA
  name: "КПК скоррета"
  description: "Временный КПК, выдаваемый скорретам-временщикам. Много не умеет. Вава!"
  components:
    - !Remove
      type: Pda
      id: VisitorIDCard
    - type: Pda
      id: EmotionalSupportScurretIDCard

- type: !PartialOnly entity
  id: ReporterPDA
  components:
  - type: CartridgeLoader
    preinstalled:
    - CrewManifestCartridge
    - NotekeeperCartridge
    - NanoTaskCartridge
    - NewsReaderCartridge
    - NanoChatCartridge
    - PhotoCartridge

- type: !PartialOnly entity
  id: DetectivePDA
  components:
  - type: CartridgeLoader
    preinstalled:
    - CrewManifestCartridge
    - NotekeeperCartridge
    - NanoTaskCartridge
    - NewsReaderCartridge
    - WantedListCartridge
    - LogProbeCartridge
    - NanoChatCartridge
    - PhotoCartridge

- type: !PartialOnly entity
  id: HoPPDA
  components:
  - type: CartridgeLoader
    preinstalled:
    - CrewManifestCartridge
    - NotekeeperCartridge
    - NanoTaskCartridge
    - NewsReaderCartridge
    - NanoChatCartridge
    - PhotoCartridge
