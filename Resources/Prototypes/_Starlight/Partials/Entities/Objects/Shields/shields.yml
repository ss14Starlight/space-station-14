- type: !PartialOnly entity
  id: BaseShield
  components:
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Starlight/Items/Handling/plastic_shield_pick_up.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Starlight/Items/Handling/plastic_shield_drop.ogg
  - type: Clothing
    quickEquip: false
    slots: NONE
    equipSound:
      path: /Audio/_Starlight/Items/Equip/backpack_equip.ogg

- type: !PartialOnly entity
  id: WebShield
  components:
  - type: Solution
    id: food
    solution:
      maxVol: 120
      reagents:
      - ReagentId: Fiber
        Quantity: 120
  - type: Tag
    tags:
    - ClothMade
  - type: Edible
    requiresSpecialDigestion: true
    solution: food
  - type: FlavorProfile
    flavors:
      - cobwebs
    ignoreReagents:
      - Fiber

# Security shields

- type: !PartialOnly entity
  id: RiotShield
  components:
  - type: Clothing
    slots:
      - Back
      - suitStorage
    sprite: _Starlight/Objects/Weapons/Melee/riot_shield.rsi

- type: !PartialOnly entity
  id: RiotLaserShield
  components:
  - type: Clothing
    slots:
      - Back
      - suitStorage
    sprite: _Starlight/Objects/Weapons/Melee/laser_shield.rsi

- type: !PartialOnly entity
  id: RiotBulletShield
  components:
  - type: Clothing
    slots:
      - Back
      - suitStorage
    sprite: _Starlight/Objects/Weapons/Melee/ballistic_shield.rsi
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/ballistic_shield.rsi
  - type: Item
    sprite: _Starlight/Objects/Weapons/Melee/ballistic_shield.rsi
