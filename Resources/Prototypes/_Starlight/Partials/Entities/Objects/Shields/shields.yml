- type: !PartialOnly entity
  id: BaseShield
  components:
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Starlight/Items/Handling/plastic_shield_pick_up.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Starlight/Items/Handling/plastic_shield_drop.ogg

- type: !PartialOnly entity
  id: WebShield
  components:
  - type: Solution
    id: food
    solution:
      maxVol: 120
      reagents:
      - ReagentId: Fiber
        Quantity: 120
  - type: Tag
    tags:
    - ClothMade
  - type: Edible
    requiresSpecialDigestion: true
    solution: food
  - type: FlavorProfile
    flavors:
      - cobwebs
    ignoreReagents:
      - Fiber
