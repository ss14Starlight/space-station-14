- type: !PartialOnly entity
  id: LightTube
  components:
  - type: LightBulb
    color: "#FFE2C8"
    lightEnergy: 0.6
    lightRadius: 7
    lightSoftness: 1.5

- type: !PartialOnly entity
  id: LedLightTube
  components:
  - type: LightBulb
    color: "#F6EFE4"
    lightEnergy: 0.65
    lightRadius: 8.5
    lightSoftness: 1.3

- type: !PartialOnly entity
