# Far Horizons
- type: !PartialOnly entity
  id: VehicleJanicart
  parent: !Clear [BaseContrabandTier2, BaseVehicleStrap, BaseJanitorContraband]
  components:
  - type: Sprite
    drawdepth: OverMobs
  - type: Strap
    buckleOffset: "0, 0"
  - type: DirectionalOverride
    offsets:
      North: "0, -0.15625"
      South: "0, -0.15625"
      East: "0.0625, -0.15625"
      West: "-0.0625, -0.15625"
  - type: FloorBuffer
  - type: Solution
    id: watertank
    solution:
      maxVol: 120
  - type: RefillableSolution
    solution: watertank
  - type: ExaminableSolution
    solution: watertank
    exactVolume: true
  - type: ReagentDraw
    enabled: false
    solutionContainer: watertank
    whitelistedReagents:
    - Water
  - type: AmbientSound
    sound: /Audio/_Starlight/Machines/floor_buffer.ogg
    range: 10
    volume: -5
    enabled: false

- type: !PartialOnly entity
  id: VehicleWheelchair
  components:
  - type: Strap
    position: Stand

- type: !PartialOnly entity
  id: VehicleWheelchairFolded
  suffix: Folded
