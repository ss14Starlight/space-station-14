# Far Horizons
- type: !PartialOnly entity
  id: VehicleJanicart
  components:
  - type: Sprite
    drawdepth: OverMobs
  - type: Strap
    buckleOffset: "0, 0"
  - type: DirectionalOverride
    offsets:
      North: "0, -0.15625"
      South: "0, -0.15625"
      East: "0.0625, -0.15625"
      West: "-0.0625, -0.15625"
  - type: !Remove UnpoweredFlashlight
  - type: !Remove PointLight
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: VehicleIgnition
    startupSound:
      path: /Audio/Effects/Vehicle/vehiclestartup.ogg
      params:
        volume: -3
  - type: ItemSlots
    slots:
      key_slot:
        insertSound: !Remove
  - type: VehicleRide
    impactSound:
      collection: MetalThud
    ejectOnCrash: true
    driverCrashDamage:
      types:
        Blunt: 15
  - type: StatusEffectContainer
  - type: VehicleMods
    vehicleType: Gas
    equipmentSlots: [tires, engine, headlight]
    startingEquipment:
    - BasicTires
    - BasicEngine
    - BasicHeadlight
  - type: ActivatableUI
    key: enum.VehicleEquipmentUiKey.Key
  - type: UserInterface
    interfaces:
      enum.VehicleEquipmentUiKey.Key:
        type: VehicleEquipmentBoundUserInterface
  - type: FloorBuffer
    activeSound:
      path: /Audio/_FarHorizons/Machines/floor_buffer.ogg
      params:
        maxDistance: 10
        volume: -5
  - type: Solution
    id: watertank
    solution:
      maxVol: 180
  - type: RefillableSolution
    solution: watertank
  - type: ExaminableSolution
    solution: watertank
    exactVolume: true
  - type: ReagentDraw
    enabled: false
    solutionContainer: watertank
    whitelistedReagents:
    - Water
  - type: AmbientSound
    sound: /Audio/_FarHorizons/Vehicles/vehicleengineidle.ogg
    range: 10
    volume: -5
    enabled: false

- type: !PartialOnly entity
  id: VehicleWheelchair
  components:
  - type: Strap
    position: Stand
  - type: FootprintOwner
    printState: Tire
    alternateStepOffset: 0.2

- type: !PartialOnly entity
  id: VehicleWheelchairFolded
  suffix: Folded
