# Far Horizons
- type: !PartialOnly entity
  id: VehicleJanicart
  parent: !Clear [BaseContrabandTier2, BaseVehicleStrap, BaseJanitorContraband]
  components:
  - type: Sprite
    drawdepth: OverMobs
    layers:
    - state: destroyed
      map: ["broken"]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.VehicleHullVisuals.Broken:
        movement:
          True: { visible: false }
          False: { visible: true }
        broken:
          True: { visible: true }
          False: { visible: false }
  - type: Strap
    buckleOffset: "0, 0"
  - type: DirectionalOverride
    offsets:
      North: "0, -0.15625"
      South: "0, -0.15625"
      East: "0.0625, -0.15625"
      West: "-0.0625, -0.15625"
  - type: !Remove UnpoweredFlashlight
  - type: !Remove PointLight
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 360
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - TableLayer
        - BulletImpassable
  - type: Pierceable
    level: HardenedMetal
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: VehicleHull
  - type: Repairable
    doAfterDelay: 20
    qualityNeeded: Anchoring
  - type: Destructible
    thresholds: !Clear
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 450
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ExplodeBehavior
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: VehicleIgnition
    startupSound:
      path: /Audio/Effects/Vehicle/vehiclestartup.ogg
      params:
        volume: -3
  - type: ItemSlots
    slots:
      key_slot:
        insertSound: !Remove
  - type: VehicleRide
    impactSound:
      collection: MetalThud
    ejectOnCrash: true
    driverCrashDamage:
      types:
        Blunt: 15
  - type: StatusEffectContainer
  - type: ContainerContainer
    containers:
      status-effects: !type:Container { showEnts: true, occludes: false }
  - type: VehicleMods
    vehicleType: Gas
    equipmentSlots: [tires, engine, headlight, lightbar]
    startingEquipment:
    - BasicTires
    - BasicEngine
    - BasicHeadlight
  - type: ActivatableUI
    key: enum.VehicleEquipmentUiKey.Key
  - type: UserInterface
    interfaces:
      enum.VehicleEquipmentUiKey.Key:
        type: VehicleEquipmentBoundUserInterface
  - type: FloorBuffer
    activeSound:
      path: /Audio/_Starlight/Machines/floor_buffer.ogg
      params:
        maxDistance: 10
        volume: -5
  - type: Solution
    id: watertank
    solution:
      maxVol: 180
  - type: RefillableSolution
    solution: watertank
  - type: ExaminableSolution
    solution: watertank
    exactVolume: true
  - type: ReagentDraw
    enabled: false
    solutionContainer: watertank
    whitelistedReagents:
    - Water
  - type: AmbientSound
    sound: /Audio/_FarHorizons/Vehicles/vehicleengineidle.ogg
    range: 10
    volume: -5
    enabled: false

- type: !PartialOnly entity
  id: VehicleWheelchair
  components:
  - type: Strap
    position: Stand
  - type: FootprintOwner
    printState: Tire
    alternateStepOffset: 0.2

- type: !PartialOnly entity
  id: VehicleWheelchairFolded
  suffix: Folded
