    action: JumpJet
    isEquipment: true
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: HeldSpeedModifier

- type: !PartialOnly entity
  id: JetpackBlack
  components:
