  - type: PhysicalComposition
    materialComposition:
      SheetPrinter: 100
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Starlight/Items/Handling/paper_drop.ogg
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Starlight/Items/Handling/paper_pickup.ogg

