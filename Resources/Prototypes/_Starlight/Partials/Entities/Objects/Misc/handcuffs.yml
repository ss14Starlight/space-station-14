- type: !PartialOnly entity
  id: ClothingOuterStraightjacket
  components:
  - type: Item
    size: Huge # Discourage people from running around with an inventory of these
  - type: Handcuff
    stunBonus: 5 # Make these slightly easier to apply

- type: !PartialOnly entity
  id: Handcuffs
  components:
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Starlight/Items/Handling/handcuffs_pick_up.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Starlight/Items/Handling/handcuffs_drop.ogg
