- type: !PartialOnly entity
  id: Kudzu
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Misc/kudzu.rsi
    state: !Remove
    layers:
    - state: kudzu_11
    - map: [ "enum.EdgeLayer.South" ]
      state: kudzu_south
    - map: [ "enum.EdgeLayer.East" ]
      state: kudzu_east
    - map: [ "enum.EdgeLayer.North" ]
      state: kudzu_north
    - map: [ "enum.EdgeLayer.West" ]
      state: kudzu_west
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: SmoothEdge

