- type: !PartialOnly entity
  id: BedsheetBase
  components:
  - type: Solution
    id: food
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Fiber
        Quantity: 15
      - ReagentId: Flour # Hydrocarbons?
        Quantity: 5
  - type: Tag
    tags:
    - ClothMade
  - type: Edible
    requiresSpecialDigestion: true
    solution: food
  - type: FlavorProfile
    flavors:
    - fiber
  - type: BadFood

