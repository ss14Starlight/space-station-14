# Generic head visuals use humanoid artwork; borg and dog retain their fitted variants.
# Keep the experiment state suffix: it bypasses Experiment displacement via the existing clothing renderer.
- type: !PartialOnly entity
  id: PlushieBorg
  components:
  - type: PointLight
    radius: 1.5
    energy: 2
    netsync: false
  - type: Clothing
    slots: [HEAD]
    clothingVisuals:
      head:
      - sprite: _Starlight/Objects/Fun/Plushies/HumanHeadwear/PlushieBorg.rsi
        state: equipped-HELMET-experiment
        offset: 0, 0.1875
      head-borg: &PlushieBorgBorgHeadwear
      - sprite: _Starlight/Objects/Fun/Plushies/BorgHeadwear/PlushieBorg.rsi
        state: equipped-HELMET
        offset: 0, 0.1875
      head-dog: *PlushieBorgBorgHeadwear

