- type: !PartialOnly entity
  id: PlushieHolocarp
  components:
  - type: PointLight
    radius: 1.5
    energy: 2
    color: "#66BFFF"
    netsync: false
  - type: Sprite
    layers:
    - state: holoplush
      shader: unshaded
  - type: Item
    inhandVisuals:
      left:
      - state: holocarpplush-inhand-left
        shader: unshaded
      right:
      - state: holocarpplush-inhand-right
        shader: unshaded
  - type: Clothing
    slots: [HEAD]
    clothingVisuals:
      head:
      - sprite: _Starlight/Objects/Fun/Plushies/HumanHeadwear/PlushieHolocarp.rsi
        state: equipped-HELMET-experiment
        offset: 0, 0.40625
        shader: unshaded
      head-borg: &PlushieHolocarpBorgHeadwear
      - sprite: _Starlight/Objects/Fun/Plushies/BorgHeadwear/PlushieHolocarp.rsi
        state: equipped-HELMET
        shader: unshaded
        offset: 0, 0.40625
      head-dog: *PlushieHolocarpBorgHeadwear

