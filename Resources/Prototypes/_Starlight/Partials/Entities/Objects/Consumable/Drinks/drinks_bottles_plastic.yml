- type: !PartialOnly entity
  id: DrinkBottlePlasticBaseFull
  components:
  - type: ShakeSpillable
    solutionName: drink
  - type: ReactionMixer
    mixerType: None
    reactionTypes:
    - Shake

# Empty

- type: !PartialOnly entity
  id: CustomDrinkJug
  components:
  - type: Item
    size: Normal #revert container size ballooning
    shape:
    - !Remove 0,0,1,3
    - 0,0,1,1

# Small Plastic Bottles

- type: !PartialOnly entity
  id: DrinkBottlePlasticSmallBaseFull
  components:
  - type: Solution
    solution:
      maxVol: 30 # Return half liter bottles

- type: !PartialOnly entity
  id: DrinkWaterBottleFull
  components:
  - type: Solution
    solution:
      reagents: !Remove
      - ReagentId: Water
        Quantity: 60

- type: !PartialOnly entity
  id: DrinkWaterBottleFull
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 30
