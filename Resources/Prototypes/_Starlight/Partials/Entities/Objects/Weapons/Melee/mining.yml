- type: !PartialOnly entity
  id: Pickaxe
  components:
  - type: SurgeryTool
  - type: SurgicalDrill
    successRate: 0.01 # You can try
    speed: 0.5
    endSound:
      path: "/Audio/Weapons/smash.ogg"

- type: !PartialOnly entity
  id: MiningDrill
  components:
  - type: SurgeryTool
  - type: SurgicalDrill
    successRate: 0.2 # This drill is way too big, really
    speed: 0.8
    startSound:
      path: "/Audio/Items/drill_use.ogg"
    endSound:
      path: "/Audio/Items/drill_use.ogg"

- type: !PartialOnly entity
  id: BaseWeaponCrusher
  components:
  - type: Execution
    doAfterDuration: !Remove

- type: !PartialOnly entity
  id: WeaponCrusher
  components:
  - type: MeleeWeapon
    attackRate: 1.5
    damage:
      types:
        Blunt: 10
        Slash: 5
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 2.5
        Slash: 2.5
  - type: Prying
    useSoundOnDoafter: /Audio/_Starlight/Machines/airlock_pry.ogg
    playSoundOnDoafter: true

- type: !PartialOnly entity
  id: WeaponCrusherGlaive
  description: An early design of the proto-kinetic accelerator, in glaive form.
  components:
  - type: MeleeWeapon
    attackRate: !Remove
    wideAnimationRotation: !Remove
    damage: !Remove
  - type: !Remove BasicEntityAmmoProvider
  - type: !Remove IncreaseDamageOnWield
