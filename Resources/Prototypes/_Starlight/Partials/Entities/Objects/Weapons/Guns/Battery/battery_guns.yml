    angleDecayDivider: 0.6

- type: !PartialOnly entity
  id: WeaponLaserCannon
  components:
  - type: GunHeat
    heatPerShot: 7500 #big laser cannon = more heat
  - type: ContainerContainer
    containers:
      firing_pin: !type:Container
  - type: ContainerFill
    containers:
      firing_pin:
      - FiringPinLaser
  - type: FiringPinHolder
    supportedPins: [ Laser ]

