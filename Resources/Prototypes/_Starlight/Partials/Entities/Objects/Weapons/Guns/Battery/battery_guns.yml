- type: !PartialOnly entity
  id: BaseWeaponBattery
  components:
  - type: GunHeat
    heatPerShot: 5000
    jamTemperature: 553.15 #lasers cant jam, but moving the jam temp makes the HUD element turn red closer at the end to warn the player of an impending overheat
    maxJamChance: 0

- type: !PartialOnly entity
  id: BaseLaserRifle
  components:
  - type: GunHeat
    heatPerShot: 4000 #enough for 35 shots at full auto before melt

- type: !PartialOnly entity
  id: BaseWeaponPowerCell
  components:
  - type: GunHeat
    heatPerShot: 2000
    jamTemperature: 553.15
    maxJamChance: 0

- type: !PartialOnly entity
  id: BaseWeaponBatterySmall
  components:
  # Starlight: energy handguns can be wielded like ballistic ones
  - type: Wieldable
    unwieldOnUse: false
  - type: UseBeforeWield
  - type: Gun
    minAngle: 0
    maxAngle: 22
    angleIncrease: 6
    angleDecay: 20
    movingMinAngle: 6
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
    minAngleDivider: 1.5
    maxAngleDivider: 1.5
    angleIncreaseDivider: 2
    angleDecayDivider: 0.6

- type: !PartialOnly entity
  id: BaseWeaponPowerCellSmall
