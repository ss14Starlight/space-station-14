- type: entity
  id: BaseWeaponSubMachineGun
  components:
  - type: RestrictByUserTag
    doestContain:
    - Abductor
    messages:
    - abductor-gun-restricted-1
  - type: AmmoCounter
  - type: CanDualWield
    dualWieldInaccuracyPenalty: 68
  - type: MeleeWeapon
    wideAnimationRotation: 90
    damage:
      types:
        Blunt: 7
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      collection: MetalThud
  - type: MeleeRequiresWield
  - type: AltFireMelee
  - type: Gun
    minAngle: 10
    maxAngle: 28
    angleIncrease: 2
    angleDecay: 14
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
    minAngleDivider: 3.3
    maxAngleDivider: 2.8
    angleIncreaseDivider: 3.3
  - type: ItemSlots
    slots:
      gun_magazine:
        startingItem: MagazinePistolSubMachineGunSP
        whitelist:
          tags:
            - MagazinePistolSubMachineGunSP
  - type: ContainerContainer
    containers:
      firing_pin: !type:Container # starlight
  - type: ContainerFill
    containers:
      firing_pin:
      - FiringPinPistol
  - type: FiringPinHolder
    supportedPins: [ Pistol, GunUpgrade ]

