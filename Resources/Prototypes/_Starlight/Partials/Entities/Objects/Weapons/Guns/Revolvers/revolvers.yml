    minAngle: 4
    maxAngle: 20
    angleDecay: 16
    angleIncrease: 8
  - type: GunWieldBonus
    angleIncreaseDivider: 1.5
    minAngleDivider: 1.5
    maxAngleDivider: 1.5
    minAngle: 0
    maxAngle: 0
  - type: RevolverAmmoProvider
    proto: CartridgeMagnumSP
  - type: CanDualWield
    dualWieldInaccuracyPenalty: 27
  - type: MeleeWeapon
    wideAnimationRotation: 0
    damage:
      types:
        Blunt: 6
    angle: 0
