- type: !PartialOnly reagent
  id: Ethyloxyephedrine
  metabolisms:
    Bloodstream:
      effects:
      - !type:ReduceSleepiness
        time: 1.5

- type: !PartialOnly reagent
  id: Diphenylmethylamine
  metabolisms:
    Bloodstream:
      effects:
      - !type:ReduceSleepiness
        time: 2

- type: !PartialOnly reagent
  id: Saline
  metabolisms:
    Bloodstream:
      effects:
        - !type:SatiateThirst  # Thirst effect changed from Drink to Medicine
           factor: 6
        - !type:ModifyBloodLevel
          conditions:
          - !type:MetabolizerTypeCondition
            type: [ Avali, Resomi ]
            inverted: true
          amount: 3 # This doesn't replace but adds to what's found in the original prototype.
        - !type:AdjustReagent
          conditions:
          - !type:MetabolizerTypeCondition
            type: [ Cyclorite ]
          reagent: Saline
          amount: -0.5

- type: !PartialOnly reagent
  id: Epinephrine
  metabolisms:
    Bloodstream:
      effects:
      - !type:ReduceSleepiness
        time: 2
      - !type:HealthChange
        conditions:
          # Soft Crit should also work
          - !type:MobStateCondition
            mobstate: SoftCritical
          - !type:ReagentCondition
            reagent: Epinephrine
            max: 20
        damage:
          types:
            Asphyxiation: -3
            Poison: -0.5
          groups:
            Brute: -0.5
            Burn: -0.5

- type: !PartialOnly reagent
  id: Inaprovaline
  metabolisms:
    Bloodstream:
      effects:
        - !type:HealthChange
          conditions:
            # Soft Crit should also work
            - !type:MobStateCondition
              mobstate: SoftCritical
          damage:
            types:
              Asphyxiation: -2

- type: !PartialOnly reagent
  id: Tricordrazine
  metabolisms:
    Bloodstream:
      effects: !Clear
      - !type:HealthChange
        conditions:
        - !type:MobStateCondition
          mobstate: Alive
        - !type:ReagentCondition
          reagent: Tricordrazine
          max: 40
        damage:
          mixmax:
            value: -0.75
            groups:
            - Burn
            - Brute
            types:
            - Poison
      - !type:MovementSpeedModifier
        walkSpeedModifier: 0.75
        sprintSpeedModifier: 0.75
        conditions:
        - !type:ReagentCondition
          reagent: Tricordrazine
          min: 20
      - !type:AdjustReagent
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Cyclorite ]
        reagent: Tricordrazine
        amount: -0.5
    Digestion:
      metabolismRate: 1
      effects: !Clear []
      metabolites: !Clear {}
