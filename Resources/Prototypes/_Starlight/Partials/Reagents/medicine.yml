- type: !PartialOnly reagent
  id: Tricordrazine
  metabolisms:
    Bloodstream:
      effects: !Clear
      - !type:HealthChange
        conditions:
        - !type:MobStateCondition
          mobstate: Alive
        - !type:ReagentCondition
          reagent: Tricordrazine
          max: 40
        damage:
          mixmax:
            value: -0.75
            groups:
            - Burn
            - Brute
            types:
            - Poison
      - !type:MovementSpeedModifier
        walkSpeedModifier: 0.75
        sprintSpeedModifier: 0.75
        conditions:
        - !type:ReagentCondition
          reagent: Tricordrazine
          min: 20
      - !type:AdjustReagent
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Cyclorite ]
        reagent: Tricordrazine
        amount: -0.5
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Tricordrazine
          min: 40
        damage:
          types:
            Poison: 1
    Digestion:
      metabolismRate: 1
      effects: !Clear
      - !type:Vomit
        probability: 0.75
        conditions:
        - !type:ReagentCondition
          reagent: Tricordrazine
          min: 40
      metabolites:
        Tricordrazine: 1

# These replace the whole effects list; keep the unchanged effects in sync with upstream.
- type: !PartialOnly reagent
  id: Dylovene
  metabolisms:
    Bloodstream:
      effects: !Clear
      - !type:HealthChange
        damage:
          types:
            Poison: -1
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Dylovene
          min: 20
        damage:
          groups:
            Brute: 2
      - !type:Jitter
        conditions:
        - !type:ReagentCondition
          reagent: Dylovene
          min: 20
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Dylovene
          min: 20
        type: Local
        visualType: Medium
        messages: [ "generic-reagent-effect-nauseous" ]
        probability: 0.2
      - !type:Vomit
        conditions:
        - !type:ReagentCondition
          reagent: Dylovene
          min: 20
        probability: 0.02
      - !type:Drunk
        conditions:
        - !type:ReagentCondition
          reagent: Dylovene
          min: 15
      - !type:AdjustReagent
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Cyclorite ]
        reagent: Dylovene
        amount: -0.5

