# Skilled Time
- type: loadoutEffectGroup
  id: SkilledRoboticist
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobRoboticist
      time: 54000 # 15 hrs

# Head

- type: loadout
  id: RoboticistCap
  equipment:
    head: ClothingHeadHatCorpsoft

- type: loadout
  id: SkullBandana
  equipment:
    head: ClothingHeadBandSkull

- type: loadout
  id: RoboticistBlackCapFlipped
  equipment:
    head: ClothingHeadHatBlacksoftFlipped

# Neck
- type: loadout
  id: RoboticistScarf
  equipment:
    neck: ClothingNeckScarfRoboticist

# Outer clothing
- type: loadout
  id: RoboticistWintercoatAlt
  effects:
    - !type:GroupLoadoutEffect
        proto: SkilledRoboticist
  equipment:
    outerClothing: ClothingOuterWinterRoboAlt

# Shoes
- type: loadout
  id: RoboticistWinterBoots
  effects:
  - !type:GroupLoadoutEffect
    proto: SkilledRoboticist
  equipment:
    shoes: ClothingShoesBootsWinterRobo

# Back

- type: loadout
  id: RoboticistBackpack
  equipment:
    back: ClothingBackpackRoboticist

- type: loadout
  id: RoboticistSatchel
  equipment:
    back: ClothingBackpackSatchelRoboticist

- type: loadout
  id: RoboticistDuffel
  equipment:
    back: ClothingBackpackDuffelRoboticist
