# Senior Time
- type: loadoutEffectGroup
  id: SeniorChef
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobChef
      time: 216000 # 60 hrs

- type: loadoutEffectGroup
  id: GoldChef
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobChef
      time: 100h

# Senior Outer Clothing
- type: loadout
  id: ChefJacketSenior
  effects:
  - !type:GroupLoadoutEffect
    proto: SeniorChef
  equipment:
    outerClothing: ClothingOuterCoatChefSenior

# Senior Jumpsuit
- type: loadout
  id: ChefJumpsuitSenior
  effects:
    - !type:GroupLoadoutEffect
      proto: SeniorChef
  equipment:
    jumpsuit: ClothingUniformJumpsuitChefSenior

# Senior Trinket
- type: loadout
  id: ChefGoldenButchCleaver
  effects:
  - !type:GroupLoadoutEffect
    proto: GoldChef
  storage:
    back:
    - ButchCleaverGold
