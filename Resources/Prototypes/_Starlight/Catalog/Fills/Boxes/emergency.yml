- type: entity
  parent: BoxSurvival
  id: BoxSurvivalIPC
  description: It's a box with survival supplies for IPCs.
  suffix: IPC
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: EmergencyCoolingUnit
        - id: Flare
        - id: PowerCellSmall
  - type: Sprite
    layers:
    - state: internals

- type: entity
  parent: BoxSurvival
  id: BoxSurvivalNonBreather
  description: It's a box with survival supplies for those with no need to breathe.
  suffix: Nonbreather
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: EmergencyMedipen
        - id: FoodSnackNutribrick
        - id: DrinkWaterBottleFull
  - type: Sprite
    layers:
    - state: internals
    - state: shadekin

- type: entity
  parent: BoxSurvivalNonBreather
  id: BoxSurvivalNonBreatherExtended
  description: It's a box with survival supplies for those with no need to breathe. This one is labelled to contain double rations.
  suffix: Nonbreather, Extended
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: EmergencyMedipen
          amount: 2
        - id: FoodSnackNutribrick
          amount: 2
        - id: DrinkWaterBottleFull

- type: entity
  parent: BoxSurvivalNonBreather
  id: BoxHugNonBreather
  description: A special box for sensitive people who don't need to breathe.
  suffix: Emergency, Nonbreather
  components:
  - type: Sprite
    layers:
    - state: box_hug
    - state: shadekin

- type: entity
  parent: BoxSurvivalNonBreather
  id: BoxMimeNonBreather
  suffix: Mime, Nonbreather
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: EmergencyMedipen
        - id: FoodBreadNutriBatard #Never 4 get. the day wizden took mime's baugettes ## Hey actually why can't we just. Give them back lol ### yeah let's do that
        - id: DrinkWaterBottleFull

- type: entity
  parent: BoxCardboard
  id: BoxSurvivalPlasma
  name: survival box
  description: It's a box with basic survival supplies tailored for plasmamen.
  suffix: Plasma
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: EmergencyPlasmaTankFilled
        - id: EmergencyMedipen
        - id: Flare
        - id: FoodSnackNutribrick
        - id: PlasmamanSuitRecharger # Starlight-edit: added recharge crystal
  - type: Sprite
    sprite: _Starlight/Objects/Storage/plasma_emergencybox.rsi
    layers:
    - state: internals
    - state: plasmatank
  - type: Item
    shape:
      - 0,0,1,3
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,1,3
  - type: Label
    currentLabel: reagent-name-plasma

