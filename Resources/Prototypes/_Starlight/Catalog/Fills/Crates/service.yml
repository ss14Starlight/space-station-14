- type: entity
  id: CrateServiceHydraRefill
  parent: CratePlastic
  name: hydra refill crate
  description: Contains two refills for the Hydra cleanade launcher.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: MagazineGrenadeCleanade
        amount: 2

- type: entity
  id: CrateServiceIceCreamMakerStarter
  parent: CrateFreezer
  name: ice cream maker starter crate
  description: Contains a flatpack of an ice cream maker, a jug of ice cream, cream, cocoa powder, berries, pistachios, and glasses.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: JugIceCream
          amount: 1
        - id: DrinkCreamCarton
          amount: 1
        - id: JugCocoaPowder
          amount: 1
        - id: FoodSnackPistachios
          amount: 5
        - id: FoodBerries
          amount: 9
        - id: IceCreamMakerFlatpack
          amount: 1
        - id: DrinkGlass
          amount: 5

- type: entity
  id: CrateServiceReligious
  parent: CratePlastic
  name: religious supplies crate
  description: Contains holy water, a censer and a bible.
  components:
    - type: StorageFill
      contents:
        - id: Bible
        - id: JugHolywater
          amount: 2
        - id: CosmicCenser

- type: entity
  parent: CrateGenericSteel
  id: CrateServiceDocumentPrinter
  name: document printer crate
  description: A document printer.
  components:
    - type: EntityTableContainerFill
      containers:
        entity_storage: !type:AllSelector
          children:
            - id: PrinterDocFlatpack

# A record crate of eight different records rather than a steel crate of loose sleeves. The id stays for maps.
- type: entity
  parent: RecordMilkCrate
  id: CrateRadioHostVinyls
  suffix: Filled
  components:
  - type: UniqueDiscFill
    table: RandomVinylDisc
    min: 8
    max: 8
    wrapper: VinylSleeve
    container: records

- type: entity
  parent: CrateGenericSteel
  id: CrateRadioHostADs
  name: ads crate
  description: A crate with 6 different advertisement CDs to add to your collection, each in its case.
  components:
  - type: UniqueDiscFill
    table: RandomCDDisc
    min: 6
    max: 6
    wrapper: CDCase
    container: entity_storage
