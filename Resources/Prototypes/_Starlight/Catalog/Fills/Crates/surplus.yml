- type: entity
  parent: CrateSalvageContrabandStorageSecure
  id: CrateITGMedicalSurplus
  name: ITG Medical Surplus Crate
  description: A box containing medical supplies from the back of an ITG warehouse
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: MedicalSurplusMedkitEntityTable
        - !type:NestedSelector
          tableId: MedicalSurplusMedkitEntityTable
        - !type:NestedSelector
          tableId: MedicalSurplusChemsEntityTable
        - !type:NestedSelector
          tableId: MedicalSurplusChemsEntityTable
        - !type:NestedSelector
          tableId: MedicalSurplusGiftsEntityTable
        - !type:NestedSelector
          tableId: MedicalSurplusGiftsEntityTable

- type: entityTable
  id: MedicalSurplusMedkitEntityTable
  table: !type:GroupSelector
    children:
    - id: MedkitAdvancedFilled
      weight: 0.5
    - id: MedkitFilled
      weight: 1
    - id: MedkitCombatFilled
      weight: 0.25
    - id: MedkitToxin
      weight: 0.5
    - id: MedkitRadiation
      weight: .25
