      weight: 0.1

- type: entityTable
  id: MedicalSurplusGiftsEntityTable
  table: !type:GroupSelector
    children:
    - id: CigaretteOmnizine
      amount: 10
      weight: 1
    - id: JetInjector
      weight: 0.5
    - id: ChemistryBottleEpinephrine
      weight: 1
    - id: BruteAutoInjector
      weight: 0.5
