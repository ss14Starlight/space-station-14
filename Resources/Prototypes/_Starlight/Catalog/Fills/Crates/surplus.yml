      weight: 0.5
    - id: JugDylovene
      weight: 1
    - id: JugPuncturase
      weight: 0.01
    - id: JugBicaridine
      weight: 1
    - id: JugDermaline
      weight: 1
    - id: JugDexalinPlus
      weight: 0.5
    - id: JugHyronalin
      weight: 0.25
    - id: JugSaline
