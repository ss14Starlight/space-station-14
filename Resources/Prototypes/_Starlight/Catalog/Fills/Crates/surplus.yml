- type: entityTable
  id: MedicalSurplusGiftsEntityTable
  table: !type:GroupSelector
    children:
    - id: CigaretteOmnizine
      weight: 1
    - id: JetInjector
      weight: 0.5
    - id: ChemistryBottleEpinephrine
      weight: 1
    - id: BruteAutoInjector
      weight: 0.5
    - id: BurnAutoInjector
      weight: .5
    - id: EmergencyMedipen
      weight: 1
    - id: CombatMedipen
      weight: 0.1
    - id: DefibrillatorCompact
