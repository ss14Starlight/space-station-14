- type: entity
  id: XenoArtifactAccessEngineering
  parent: BaseOneTimeXenoArtifactEffect
  description: Gains Engineering and Atmospherics access
  components:
  - type: XAEGainAccess
    accesses:
    - Engineering
    - Atmospherics

- type: entity
  id: XenoArtifactAccessScience
  parent: BaseOneTimeXenoArtifactEffect
  description: Gains Research and Robotics access
  components:
  - type: XAEGainAccess
    accesses:
    - Research
    - Robotics

- type: entity
  id: XenoArtifactAccessCargo
  parent: BaseOneTimeXenoArtifactEffect
  description: Gains Cargo accesses
  components:
