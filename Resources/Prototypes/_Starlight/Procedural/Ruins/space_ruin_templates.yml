    allowAllTiles: true
    threshold: -0.5
    divisions: 1
    noise:
      seed: 1
      frequency: 1
    decals:
    - DirtHeavy
    - DirtHeavy
    - DirtHeavy
    - DirtMedium
    - DirtMedium
    - DirtLight
  - !type:BiomeEntityLayer
    allowAllTiles: true
    threshold: 0.2
    noise:
      seed: 1
      frequency: 1
    entities:
    - SalvageSpawnerScrapValuable
    - SalvageSpawnerScrapCommon
    - SalvageSpawnerScrapCommon
    - SalvageSpawnerScrapCommon
    - SalvageSpawnerScrapCommon75
  - !type:BiomeEntityLayer
    allowAllTiles: true
    threshold: 0.7
    noise:
      seed: 1
      frequency: 1
    entities:
    - SalvageSpawnerTreasure
    - SalvageSpawnerTreasure
    - SalvageSpawnerTreasureValuable
  - !type:BiomeEntityLayer
    allowAllTiles: true
    threshold: 0.925
    noise:
      seed: 1
      frequency: 1
    entities:
    - SalvageSpawnerMobMagnet75
