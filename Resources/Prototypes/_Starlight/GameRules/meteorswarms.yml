# Event Tables

#Slowrod
- type: entity
  id: ImmovableRodSlugSpawn
  parent: BaseGameRule
  components:
  - type: StationEvent
    startAnnouncement: station-event-immovable-slug-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    weight: .25
    reoccurrenceDelay: 1
    duration: 1
    earliestStart: 30
    minimumPlayers: 20
  - type: ImmovableRodRule
    rodPrototypes:
    - id: ImmovableRodSlug
      prob: 0.05
      orGroup: rodProto

- type: entity
  parent: BaseGameRule
  id: RodStormEventScheduler
  components:
  - type: GameRule
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 600 # 10 min
    minMaxEventTiming:
      min: 300 # 5 min
      max: 900 # 15 min
    scheduledGameRules: !type:NestedSelector
      tableId: RodStormEventsTable

- type: entityTable
  id: RodStormEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: ImmovableRodSpawn
      prob: 0.9
    - id: ImmovableRodSlugSpawn # Starlight
      prob: 0.1