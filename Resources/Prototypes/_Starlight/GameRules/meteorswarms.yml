# Event Tables

#Slowrod
- type: entity
  id: ImmovableRodSlugSpawn
  parent: BaseGameRule
  components:
  - type: StationEvent
    startAnnouncement: station-event-immovable-slug-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    weight: .25
    reoccurrenceDelay: 1
    duration: 1
    earliestStart: 30
    minimumPlayers: 25
  - type: ImmovableRodRule
    rodPrototypes:
    - id: ImmovableRodSlug
      prob: 0.05
      orGroup: rodProto

- type: entity
  parent: BaseGameRule
  id: ResonanceCascadeScheduler
  components:
  - type: GameRule
  - type: ResonanceCascadeScheduler
    possibleAnomalyPrototypes:
    - AnomalyClown
    - AnomalyFlesh
    - AnomalyFlora
    initialDelay: 600
    baseInterval: 720
    minimumInterval: 360
    escalationStep: 900
    escalationMultiplier: 0.85
