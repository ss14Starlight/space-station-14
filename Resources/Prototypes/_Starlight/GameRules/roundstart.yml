# Space traffic stuff, like visitors
- type: entityTable
  id: SpaceTrafficControlTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
      - !type:NestedSelector
        tableId: UnknownShuttlesFriendlyTable
      - !type:NestedSelector
        tableId: UnknownShuttlesFreelanceTable
      - !type:NestedSelector
        tableId: UnknownShuttlesHostileTable

- type: entity
  parent: BaseRoundstartAntagRule
  id: CosmicCult
  components:
  - type: CosmicCultRule
  - type: GameRule
    minPlayers: 20
    delay:
      min: 240
      max: 420
  - type: AntagObjectives
    objectives:
    - CosmicFinalityObjective
    - CosmicMonumentObjective
    - CosmicConversionObjective
    - CosmicEntropyObjective
    - CosmicChaplainObjective
  - type: AntagSelection
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: CosmicAntagCultist
      playerRatio: 10
      range:
        min: 2
        max: 6
  - type: DynamicRuleCost
    cost: 200
  - type: DynamicRuleCooldown
    cooldown: 1
    presets:
    - CosmicCult
