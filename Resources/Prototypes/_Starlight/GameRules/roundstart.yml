# event schedulers
- type: entity
  id: ShitStationEventScheduler
  parent: BaseGameRule
  components:
  - type: GameRule
    minPlayers: 0
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: ShitGameRulesTable

- type: entityTable
  id: ShitGameRulesTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
      - !type:NestedSelector
        tableId: ShitEventsTable
      - !type:NestedSelector
        tableId: DerelictBorgEventTable
      - id: IonStormPlus

- type: entity
  id: DynamicRampingEventScheduler # Dynamic Survival!?
  parent: BaseGameRule
  components:
  - type: RampingStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: DynamicGameRulesTable

- type: entity
  parent: BaseGameRule
  id: BaseDynamicEventScheduler
  components:
  - type: GameRule
    minPlayers: 0
  - type: SubGamemodes
    rules:
    - id: DynamicStationEventScheduler
      prob: 1
    - id: MeteorSwarmScheduler
      prob: 1
  - type: DynamicRuleCost
    cost: 0 # Free, since we want this to roll most of the time.

# Dynamic Survival!?
- type: entity
  parent: BaseGameRule
  id: DynamicSurvivalEventScheduler
  components:
  - type: GameRule
    minPlayers: 15
  - type: SubGamemodes
    rules:
    - id: DynamicRampingEventScheduler
      prob: 1
    - id: MeteorSwarmScheduler
      prob: 1
  - type: DynamicRuleCost
    cost: 150 # It can have less since it's not *as* bad as the other two

# Dynamic Kessler Syndrome
- type: entity
  parent: BaseGameRule
  id: DynamicKesslerSyndromeEventScheduler
  components:
  - type: GameRule
    minPlayers: 15
  - type: SubGamemodes
    rules:
    - id: KesslerSyndromeScheduler
      prob: 1
    - id: DynamicRampingEventScheduler
      prob: 1
  - type: DynamicRuleCost
    cost: 200

# It's literally just ShitStation.
- type: entity
  parent: BaseGameRule
  id: DynamicShitStationEventScheduler
  components:
  - type: GameRule
    minPlayers: 0
  - type: SubGamemodes
    rules:
    - id: ShitStationEventScheduler
      prob: 1
    - id: DynamicStationEventScheduler
      prob: 1
    - id: DynamicStationEventScheduler
      prob: 1
    - id: MeteorSwarmScheduler
      prob: 1
    - id: BasicRoundstartVariation
      prob: 1
    - id: BasicRoundstartVariation
      prob: 1
    - id: BasicRoundstartVariation
      prob: 1
    - id: BasicRoundstartVariation
      prob: 1
  - type: DynamicRuleCost
    cost: 150 # Lowering this, since BasicRoundstartVariation doesn't do much in Dynamic due to how Dynamic functions.

- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleNoChangelings
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.48 # Starlight. Adds up to 1.
    - id: VampireLess # Starlight. The rework is here.
      prob: 0.25
    - id: SubWizard
      prob: 0.05 # We can go back down to 0.05, since they scale now.
    - id: Devil
      prob: 0.05 # rare
    #- id: SubXenoborgs # Subgamemode replaced with SubXenoborgs
    #  prob: 0.05
    #- id: SubBrighteye # Brighteye is disabled until more work is put in.
    #  prob: 0.05 # We can go back down to 0.05, since they scale now.
    - id: SiliconLiberation
      prob: 0.17

- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleConversion
  components:
  - type: SubGamemodes
    rules:
    - id: ThiefLess # So that only 3 thieves max spawn in rev games.
      prob: 0.40 # Starlight
    - id: SLChangeling #Starlight lings
      prob: 0.175 # They can honestly just have the same chance as the vampires.
    - id: VampireLess # Starlight reworked
      prob: 0.175
    - id: SubWizard
      prob: 0.05 # We can go back down to 0.05, since they scale now.
    #- id: SubXenoborgs # Subgamemode replaced with SubXenoborgs
    #      prob: 0.05
    #- id: SubBrighteye
    #  prob: 0.05 # We can go back down to 0.05, since they scale now.
    # No SELF Agents in rev games because of the FREEmag.
    # no devil because this is the secret set used for conversion antags i guess? either way dont want revs spamming devil

- type: entity
  parent: BaseGameRule
