# event schedulers
- type: entity
  id: ShitStationEventScheduler
  parent: BaseGameRule
  components:
  - type: GameRule
    minPlayers: 0
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: ShitGameRulesTable

- type: entityTable
  id: ShitGameRulesTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
      - !type:NestedSelector
        tableId: ShitEventsTable
      - !type:NestedSelector
        tableId: DerelictBorgEventTable
      - id: IonStormPlus

# Cosmic Cult

- type: entity
  id: DynamicRampingEventScheduler # Dynamic Survival!?
  parent: BaseGameRule
  components:
  - type: RampingStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: DynamicGameRulesTable

- type: entity
  parent: BaseGameRule
  id: BaseDynamicEventScheduler
  components:
  - type: GameRule
    minPlayers: 0
  - type: SubGamemodes
    rules:
    - id: DynamicStationEventScheduler
      prob: 1
    - id: MeteorSwarmScheduler
      prob: 1
  - type: DynamicRuleCost
    cost: 0 # Free, since we want this to roll most of the time.

# Dynamic Survival!?
- type: entity
  parent: BaseGameRule
  id: DynamicSurvivalEventScheduler
  components:
  - type: GameRule
    minPlayers: 15
  - type: SubGamemodes
    rules:
    - id: DynamicRampingEventScheduler
      prob: 1
    - id: MeteorSwarmScheduler
      prob: 1
  - type: DynamicRuleCost
    cost: 150 # It can have less since it's not *as* bad as the other two
  - type: DynamicRuleCooldown
    cooldown: 1
    presets:
    - Survival

# Dynamic Kessler Syndrome
- type: entity
  parent: BaseGameRule
  id: DynamicKesslerSyndromeEventScheduler
  components:
  - type: GameRule
    minPlayers: 15
  - type: SubGamemodes
    rules:
    - id: KesslerSyndromeScheduler
      prob: 1
    - id: DynamicRampingEventScheduler
      prob: 1
  - type: DynamicRuleCost
    cost: 200
  - type: DynamicRuleCooldown
    cooldown: 1
    presets:
    - KesslerSyndrome
    - Zombieteors
    - Survival

# It's literally just ShitStation.
- type: entity
  parent: BaseGameRule
  id: DynamicShitStationEventScheduler
  components:
  - type: GameRule
    minPlayers: 0
  - type: SubGamemodes
    rules:
    - id: ShitStationEventScheduler
      prob: 1
    - id: DynamicStationEventScheduler
      prob: 1
    - id: DynamicStationEventScheduler
      prob: 1
    - id: MeteorSwarmScheduler
      prob: 1
    - id: BasicRoundstartVariation
      prob: 1
    - id: BasicRoundstartVariation
      prob: 1
    - id: BasicRoundstartVariation
      prob: 1
    - id: BasicRoundstartVariation
      prob: 1
  - type: DynamicRuleCost
    cost: 150 # Lowering this, since BasicRoundstartVariation doesn't do much in Dynamic due to how Dynamic functions.
  - type: DynamicRuleCooldown
    cooldown: 2
    presets:
    - ShitStation

