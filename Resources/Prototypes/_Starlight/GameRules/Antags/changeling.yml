# Changeling
# Full scaling, only shows up in Traitorling and Dynamic.
- type: entity
  parent: [Changeling, BaseRoundstartAntagRule]
  id: SLChangeling
  components:
  - type: SLChangelingRule
  - type: AntagSelection
    agentName: changeling-round-end-agent-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: SLChangeling
      playerRatio: 31.2
      range:
        min: 1
        max: 6
  - type: DynamicRuleCost
    cost: 125

# Subgamemode scaling, shows up in VampTraitorLing and Dynamic.
- type: entity
  parent: SLChangeling
  id: SLChangelingLess
  components:
  - type: GameRule
    minPlayers: 15
    delay:
      min: 240
      max: 420
  - type: AntagSelection
    agentName: changeling-round-end-agent-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: SLChangeling
      playerRatio: 42
      range:
        min: 1
        max: 4
  - type: DynamicRuleCost
    cost: 100


