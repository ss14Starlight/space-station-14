# Devil
- type: entity
  parent: BaseRoundstartAntagRule
  id: Devil
  components:
  - type: GameRule
    minPlayers: 15
    delay:
      min: 240
      max: 420
    cancelPresetOnTooFewPlayers: false
  - type: DevilRule
  - type: AntagObjectives
    objectives:
    - SurviveDevilObjective
    - DamnSoulsDevilObjective
  - type: AntagSelection
    agentName: devil-round-end-agent-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Devil
      playerRatio: 60
      range:
        min: 1
        max: 3
  - type: DynamicRuleCost
    cost: 100
