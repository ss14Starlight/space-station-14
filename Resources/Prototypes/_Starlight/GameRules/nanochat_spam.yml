- type: entity
  id: NanoChatSpamBase
  parent: BaseGameRule
  abstract: true
  components:
  - type: GameRule
  - type: StationEvent
    weight: 6
    earliestStart: 10
    duration: 1

- type: entity
  parent: NanoChatSpamBase
  id: NanoChatSpamTiny
  components:
  - type: StationEvent
    minimumPlayers: 5
  - type: NanoChatSpamRule
    maxRecipientsPerMessage: 1
    recipientChance: 0.3

- type: entity
  parent: NanoChatSpamBase
  id: NanoChatSpamLowPop
  components:
  - type: StationEvent
    minimumPlayers: 20
  - type: NanoChatSpamRule
    maxRecipientsPerMessage: 2
    recipientChance: 0.3

- type: entity
  parent: NanoChatSpamBase
  id: NanoChatSpamMidPop
  components:
  - type: StationEvent
    minimumPlayers: 40
  - type: NanoChatSpamRule
    maxRecipientsPerMessage: 3
    recipientChance: 0.3

- type: entity
  parent: NanoChatSpamBase
  id: NanoChatSpamHighPop
  components:
  - type: StationEvent
    minimumPlayers: 80
  - type: NanoChatSpamRule
    maxRecipientsPerMessage: 5
    recipientChance: 0.3

- type: entity
  parent: NanoChatSpamBase
  id: NanoChatSpamUltraPop
  components:
  - type: StationEvent
    minimumPlayers: 150
  - type: NanoChatSpamRule
    maxRecipientsPerMessage: 8
    recipientChance: 0.3

