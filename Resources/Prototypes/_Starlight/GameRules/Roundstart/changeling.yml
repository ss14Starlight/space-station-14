# Changeling
- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseSLChangelingRule
  components:
  - type: SLChangelingRule
  - type: DynamicRuleCost
    cost: 150
  - type: GameRule # It doesn't really make lore sense that you can "remember" you're a Changeling, but it should give everyone some calm at the start.
    minPlayers: 25
    delay:
      min: 240
      max: 420

# Full scaling, only shows up in Traitorling and Dynamic.
- type: entity
  parent: [Changeling, BaseSLChangelingRule, BaseRoundstartAntagRule]
  id: SLChangeling
  components:
  - type: AntagSelection
    agentName: changeling-round-end-agent-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: SLChangeling
      playerRatio: 26
      range:
        min: 1
        max: 6

# Subgamemode scaling, shows up in VampTraitorLing and Dynamic.
- type: entity
  parent: SLChangeling
  id: SLChangelingLess
  components:
  - type: AntagSelection
    agentName: changeling-round-end-agent-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: SLChangeling
      playerRatio: 35
      range:
        min: 1
        max: 4
  - type: DynamicRuleCost
    cost: 75


