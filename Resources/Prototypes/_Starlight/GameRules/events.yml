- type: entity
  parent: BaseGameRule
  id: AbductorsSpawn
  components:
    - type: StationEvent
      earliestStart: 15
      weight: 3
      minimumPlayers: 10
      duration: null
    - type: RuleGrids
    - type: LoadMapRule
      gridPath: /Maps/_Starlight/Shuttles/ShuttleEvent/abductor_shuttle.yml
    - type: AntagObjectives
      objectives:
        - AbductObjective
    - type: AntagLoadProfileRule
      speciesHardOverride: Abductor
    - type: AntagSelection
      definitions:
        - spawnerPrototype: AbductorScientistSpawner
          min: 1
          playerRatio: 80 # The Scientist is more important than the Agent, but also can't do anything without them, so...
          pickPlayer: false
          startingGear: AbductorScientistGear
          briefing:
            text: abductor-role-greeting
            color: Green
            sound: /Audio/_Starlight/Misc/abductor.ogg
          components:
            - type: Abductor
            - type: Muted
            - type: AbductorScientist
            - type: ActionGrant
              actions:
                - ActionReturnToShip
            - type: Tag
              tags:
                - Abductor
                - AbductorScientist
                - CanPilot
            - type: NpcFactionMember
              factions:
                - Abductor
          mindRoles:
            - MindRoleLoneAbductor
          # Starlight-start
          tags:
            - CantBecomeRevolutionary
          # Starlight-end
        - spawnerPrototype: AbductorAgentSpawner
          min: 1
          playerRatio: 65 # Abductors are so weak man, throw them a bone.
          pickPlayer: false
          startingGear: AbductorAgentGear
          briefing:
            text: abductor-role-greeting
            color: Green
            sound: /Audio/_Starlight/Misc/abductor.ogg
          components:
            - type: Abductor
            - type: Muted
            - type: AbductorAgent
            - type: ActionGrant
              actions:
                - ActionReturnToShip
            - type: Tag
              tags:
                - Abductor
                - CanPilot
            - type: NpcFactionMember
              factions:
                - Abductor
          mindRoles:
            - MindRoleLoneAbductor
          # Starlight-start
          tags:
            - CantBecomeRevolutionary
          # Starlight-end

- type: entity
  parent: BaseGameRule
  id: DerelictBorgiSpawn
  components:
    - type: StationEvent
      globalAnnouncement: false # Starlight
      weight: 5
      earliestStart: 15
      reoccurrenceDelay: 20
      minimumPlayers: 4
      duration: null
    - type: SpaceSpawnRule
      spawnDistance: 0
    - type: AntagSpawner
      prototype: DerelictBorgiChassis
    - type: AntagSelection
      definitions:
        - spawnerPrototype: SpawnPointGhostDerelictBorgi
          min: 1
          max: 2
          playerRatio: 80 # They don't do much, they're just borgs. Doesn't mean we need 5 of them running around.
          pickPlayer: false

