- type: entity
  parent: BaseGameRule
  id: DerelictBorgiSpawn
  components:
  - type: StationEvent
    globalAnnouncement: false
    weight: 5
    earliestStart: 15
    reoccurrenceDelay: 20
    minimumPlayers: 4
    duration: null
  - type: SpaceSpawnRule
    spawnDistance: 0
  - type: AntagSpawner
    prototype: DerelictBorgiChassis
  - type: AntagSelection
    antags:
    - !type:LinearAntagCount
      proto: DerelictBorgi
      playerRatio: 80
      range:
        min: 1
        max: 2

