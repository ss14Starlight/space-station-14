# NoLowerBound - For air alarms where spacing is ok, but should otherwise be equivalent to station atmos

- type: alarmThreshold
  id: stationTemperatureNoLowerBound
  upperBound: !type:AlarmThresholdSetting
    threshold: 393.15
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.8

- type: alarmThreshold
  id: stationPressureNoLowerBound
  upperBound: !type:AlarmThresholdSetting
    threshold: 550
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.7

- type: alarmThreshold
  id: stationOxygenNoLowerBound
  upperBound: !type:AlarmThresholdSetting
    threshold: 0.45
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.8

# Chamber - no lower bounds, and the upper warn multiplier resolves to 75000kPa.
# Both upper checks are >=, so these fire at the stated values.
- type: alarmThreshold
  id: chamberPressure
  upperBound: !type:AlarmThresholdSetting
    threshold: 90000
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.8333333

# Sauna - bounds copy stationTemperature, only the upper warn multiplier differs,
# resolving to 323.15K.
- type: alarmThreshold
  id: saunaTemperature
  upperBound: !type:AlarmThresholdSetting
    threshold: 393.15
  lowerBound: !type:AlarmThresholdSetting
    threshold: 233.15
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.82195
  lowerWarnAround: !type:AlarmThresholdSetting
    threshold: 1.1286

- type: alarmThreshold
  id: stationUlnitranium
  upperBound: !type:AlarmThresholdSetting
    threshold: 1.50
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.5

- type: alarmThreshold
  id: stationZXA
  upperBound: !type:AlarmThresholdSetting
    threshold: 0.1
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.08
