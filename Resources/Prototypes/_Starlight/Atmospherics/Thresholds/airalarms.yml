# NoLowerBound - For air alarms where spacing is ok, but should otherwise be equivalent to station atmos

- type: alarmThreshold
  id: stationTemperatureNoLowerBound
  upperBound: !type:AlarmThresholdSetting
    threshold: 393.15
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.8

- type: alarmThreshold
  id: stationPressureNoLowerBound
  upperBound: !type:AlarmThresholdSetting
    threshold: 550
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.7

- type: alarmThreshold
  id: stationOxygenNoLowerBound
  upperBound: !type:AlarmThresholdSetting
    threshold: 0.45
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.8

# ColdWeather - For air alarms that won't constantly go off due to cold atmospheres, but still trip from fires

- type: alarmThreshold
  id: stationTemperatureColdWeather
  upperBound: !type:AlarmThresholdSetting
    threshold: 353.15 # danger high temp @ +80C
  lowerBound: !type:AlarmThresholdSetting
    threshold: 193.15 # danger low temp @ -80C
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.915 # warn high temp @ +50C
  lowerWarnAround: !type:AlarmThresholdSetting
    threshold: 1.2071 # warn low temp @ -40C

- type: alarmThreshold
  id: stationPressureColdWeather
  upperBound: !type:AlarmThresholdSetting
    threshold: 550 # HazardHighPressure from Atmospherics.cs
  lowerBound: !type:AlarmThresholdSetting
    threshold: 60 # danger @ 60 KPA, cold air is much more breathable (surprisingly)
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.7 # 385 kPa, WarningHighPressure from Atmospherics.cs
  lowerWarnAround: !type:AlarmThresholdSetting
    threshold: 1.3 # 78 kPa

# Chamber - no lower bounds, and the upper warn multiplier resolves to 75000kPa.
# Both upper checks are >=, so these fire at the stated values.
- type: alarmThreshold
  id: chamberPressure
  upperBound: !type:AlarmThresholdSetting
    threshold: 90000
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.8333333

# Sauna - steam dilutes the other gases, so these bounds are fractions of a
# pressurised mix rather than of station air. Breathing breaks even at 8.4%
# oxygen, so danger sits at 10% and warning at 13%, which tolerates steam up to
# about 38% of the mix.
- type: alarmThreshold
  id: saunaOxygen
  lowerBound: !type:AlarmThresholdSetting
    threshold: 0.10
  upperBound: !type:AlarmThresholdSetting
    threshold: 0.45
  lowerWarnAround: !type:AlarmThresholdSetting
    threshold: 1.3
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.8

# Vox, Slimes and Cyclorites breathe nitrogen, so it breaks even at the same 8.4%
# as oxygen does for everyone else and takes the same bounds.
- type: alarmThreshold
  id: saunaNitrogen
  lowerBound: !type:AlarmThresholdSetting
    threshold: 0.10
  lowerWarnAround: !type:AlarmThresholdSetting
    threshold: 1.3

# Sauna - bounds copy stationTemperature, only the upper warn multiplier differs,
# resolving to 323.15K.
- type: alarmThreshold
  id: saunaTemperature
  upperBound: !type:AlarmThresholdSetting
    threshold: 393.15
  lowerBound: !type:AlarmThresholdSetting
    threshold: 233.15
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.82195
  lowerWarnAround: !type:AlarmThresholdSetting
    threshold: 1.1286

# New Gases

- type: alarmThreshold
  id: stationUlnitranium
  upperBound: !type:AlarmThresholdSetting
    threshold: 1.50
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.5

- type: alarmThreshold
  id: stationZXA
  upperBound: !type:AlarmThresholdSetting
    threshold: 0.016 # Danger at 1.6%; warning at 0.8%, just before inhalation effects.
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.5

# Gas thresholds use fractions of the mixture and warn at half the danger limit.
- type: alarmThreshold
  id: stationFrezon
  upperBound: !type:AlarmThresholdSetting
    threshold: 0.02 # Danger at 2%; warning at 1%, before respiratory damage.
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.5

- type: alarmThreshold
  id: stationNitrium
  upperBound: !type:AlarmThresholdSetting
    threshold: 0.08 # Strong effects that are positive and negativ
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.5

- type: alarmThreshold
  id: stationHydrogen
  upperBound: !type:AlarmThresholdSetting
    threshold: 0.04 # Approximate lower flammability limit.
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.5

- type: alarmThreshold
  id: stationProtoNitrate
  upperBound: !type:AlarmThresholdSetting
    threshold: 0.1 # Volatile but has no direct inhalation damage defined.
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.5

- type: alarmThreshold
  id: stationZauker
  upperBound: !type:AlarmThresholdSetting
    threshold: 0.01 # Danger at 1%; warning at 0.5%, before toxic effects.
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.5

- type: alarmThreshold
  id: stationHalon
  upperBound: !type:AlarmThresholdSetting
    threshold: 0.2 # Fire suppressant: oxygen depletion is monitored separately.
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.5

- type: alarmThreshold
  id: stationAntiNoblium
  upperBound: !type:AlarmThresholdSetting
    threshold: 0.1 # No defined dangerous effect: ignore trace concentrations.
  upperWarnAround: !type:AlarmThresholdSetting
    threshold: 0.5
