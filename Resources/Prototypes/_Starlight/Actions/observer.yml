- type: entity
  parent: BaseAGhostAction
  id: ActionObserverShowRadar
  name: Mass Scanner Interface
  description: View a Mass Scanner Interface.
  components:
  - type: Action
    icon: { sprite: Interface/Actions/actions_ai.rsi, state: mass_scanner }
    iconOn: { sprite: Interface/Actions/actions_ai.rsi, state: comms_console }
    keywords: [ "AI", "console", "interface" ]
    checkCanInteract: false
    priority: -20
  - type: InstantAction
    event: !type:ToggleIntrinsicUIEvent { key: enum.RadarConsoleUiKey.Key }

- type: entity
  parent: BaseMentalAction
  id: ActionToggleOwnGhostSprite
  name: Hide My Ghost
  description: Hide your own ghost sprite on your screen. Others still see it.
  components:
  - type: Action
    icon: { sprite: Mobs/Ghosts/ghost_human.rsi, state: icon }
    clientExclusive: true
  - type: InstantAction
    event: !type:ToggleOwnGhostSpriteActionEvent
