# Granted to the ReplayObserver. clientExclusive because replays have no server.

- type: entity
  parent: ActionToggleGhostHearing
  id: ActionReplayToggleGhostHearing
  components:
  - type: Action
    clientExclusive: true

- type: entity
  parent: BaseMentalAction
  id: ActionReplayTogglePlayerOverlay
  name: Toggle Player Overlay
  description: Show usernames and antagonist status above players in this replay.
  components:
  - type: Action
    icon: Interface/VerbIcons/information.svg.192dpi.png
    clientExclusive: true
  - type: InstantAction
    event: !type:ReplayTogglePlayerOverlayActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionReplayToggleStatusIcons
  name: Toggle Status Icons
  description: Show job, mindshield, security status and health icons in this replay.
  components:
  - type: Action
    icon: { sprite: Clothing/Eyes/Hud/med.rsi, state: icon }
    clientExclusive: true
  - type: InstantAction
    event: !type:ReplayToggleStatusIconsActionEvent

- type: entity
  parent: BaseMentalAction
  id: ActionReplayToggleWeather
  name: Toggle Weather
  description: Show or hide weather overlays in this replay.
  components:
  - type: Action
    icon: Interface/VerbIcons/snow.svg.192dpi.png
    clientExclusive: true
  - type: InstantAction
    event: !type:ReplayToggleWeatherActionEvent

# Component set added to the replay observer by the status icons action. Never spawned.
- type: entity
  id: ReplayObserverStatusHud
  categories: [ HideSpawnMenu ]
  components:
  - type: ShowJobIcons
  - type: ShowMindShieldIcons
  - type: ShowCriminalRecordIcons
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - Inorganic
    - Silicon
    - IPC
    - Hybrid
  - type: ShowHealthIcons
    damageContainers:
    - Biological
    - Inorganic
    - Silicon
    - IPC
    - Hybrid

- type: entity
  parent: BaseMentalAction
  id: ActionReplayToggleFactionIcons
  name: Toggle Faction Icons
  description: Show faction icons, such as nuclear operatives and revolutionaries, in this replay.
  components:
  - type: Action
    icon: { sprite: _Starlight/Interface/Radial/Radio/channel_icons.rsi, state: syndicate }
    clientExclusive: true
  - type: InstantAction
    event: !type:ReplayToggleFactionIconsActionEvent

- type: entity
  id: ReplayObserverFactionHud
  categories: [ HideSpawnMenu ]
  components:
  - type: ShowSyndicateIcons
  - type: ShowAntagIcons
