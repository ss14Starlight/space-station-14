- type: entity
  id: ActionFriendship
  name: Summon Friend
  description: Summon for a friend. If used again, instantly evaporates your friend at will.
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: Clothing/OuterClothing/Hardsuits/lingspacesuit.rsi
      state: icon
    useDelay: 180
    raiseOnAction: true
  - type: InstantAction
    event: !type:SummonFriendInstantEvent {}
  - type: FriendshipFamiliar
    mobToSpawn: SpawnPointGhostFamiliarPlayerSpecies