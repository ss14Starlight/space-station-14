- type: entity
  id: ActionChangelingEmag
  name: Organic sequencer
  description: Subvert electronics like an emag. Costs 30 chemicals per successful hack. Evolution reduces the cost to 5 and allows hacking within 7 meters in sight.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: NoItem
    icon: { sprite: _Starlight/Interface/Actions/changeling_adaptations.rsi, state: organic-emag }
  - type: TargetAction
    range: 7
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:ChangelingEmagEvent {}
  - type: ChangelingAction
    chemicalCost: 30
    evolvedChemicalCost: 5
  - type: EorgPreventAction

- type: entity
  id: ActionChangelingRegeneration
  name: Adaptive regeneration
  description: Heal 4 damage of every type per second, stop bleeding and rapidly replenish blood. Evolution heals 8 damage of every type per second and regrows one missing part or organ every 10 seconds for an extra 10 chemicals, replacing prostheses. Upkeep is 5 chemicals/second, or 3 after Evolution, even at full health.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    checkCanInteract: false
    checkConsciousness: false
    itemIconStyle: NoItem
    icon: { sprite: _Starlight/Interface/Actions/actions_changeling.rsi, state: fleshmend }
  - type: InstantAction
    event: !type:ToggleChangelingRegenerationEvent {}
  - type: ChangelingAction
    requireBiomass: false
  - type: ChangelingRegenerationAction
    healingPerSecond: 4
    chemicalCostPerSecond: 5
    evolvedHealingPerSecond: 8
    evolvedChemicalCostPerSecond: 3

- type: entity
  id: ActionChangelingPainSuppression
  name: Suppress pain
  description: Suppress damage slowdown, shock damage, stamina damage and stuns for 2 chemicals/second. Evolution removes the upkeep. Physical injuries still harm you.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    checkCanInteract: false
    checkConsciousness: false
    itemIconStyle: NoItem
    icon: { sprite: _Starlight/Interface/Actions/changeling_adaptations.rsi, state: pain-suppression }
  - type: InstantAction
    event: !type:ToggleChangelingPainSuppressionEvent {}
  - type: ChangelingAction
    requireBiomass: false

- type: entity
  id: ActionChangelingShockHand
  name: Concealed shock hand
  description: Form an invisible organic stun baton. Each hit costs 10 chemicals. Evolution adds an electrical knockdown once every 30 seconds; other hits work normally.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    checkCanInteract: false
    itemIconStyle: NoItem
    icon: { sprite: _Starlight/Interface/Actions/changeling_adaptations.rsi, state: shock-hand }
  - type: InstantAction
    event: !type:ToggleChangelingShockHandEvent {}
  - type: ChangelingAction
    requireBiomass: false
