- type: entity
  id: ActionChangelingEmag
  name: Organic access breaker
  description: Unlock doors and erase access from digital locks with a touch, like an access breaker. Costs 30 chemicals per successful hack.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: NoItem
    icon: { sprite: Objects/Tools/access_breaker.rsi, state: icon }
  - type: TargetAction
    range: 1.5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:ChangelingEmagEvent
      chemicalCost: 30
  - type: EorgPreventAction

- type: entity
  id: ActionChangelingShockHand
  name: Electrified hand
  description: Grow or retract an electrified hand. Each successful strike deals 35 stamina damage and costs 10 chemicals. Your hands emit a faint glow while active.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    checkCanInteract: false
    itemIconStyle: NoItem
    icon: { sprite: Clothing/Hands/Gloves/powerglove.rsi, state: icon-on }
  - type: InstantAction
    event: !type:ToggleChangelingShockHandEvent

- type: entity
  id: ActionToggleChangelingBreathing
  name: Respiratory Control
  description: Choose whether your body needs to breathe. While breathing is stopped, you cannot inhale gases or suffocate. Costs no chemicals or biomass.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 1
    icon: { sprite: _Starlight/Interface/Alerts/holding_breath.rsi, state: holding_breath }
    checkCanInteract: false
    checkConsciousness: false
  - type: InstantAction
    event: !type:ToggleChangelingBreathingEvent {}
