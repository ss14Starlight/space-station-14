- type: entity
  id: ActionToggleXenoTail
  name: Toggle Tail
  description: Ready or Unready your tail for combat
  components:
    - type: Action
      useDelay: 1
      icon:
        sprite: _Starlight/Interface/Actions/actions_xeno.rsi
        state: toggle_tail
      itemIconStyle: NoItem
    - type: InstantAction
      event: !type:ToggleLimbEvent

- type: entity
  id: ActionXenoVote
  name: Vote
  description: Cast your vote for Voice of the Queen
  components:
    - type: Action
      useDelay: 1
      icon:
        sprite: _Starlight/Interface/Actions/actions_xeno.rsi
        state: cast_vote
      itemIconStyle: NoItem
      raiseOnUser: true
    - type: TargetAction
      interactOnMiss: false
      deselectOnMiss: false
    - type: EntityTargetAction
      range: 12
      canTargetSelf: true
      rotateOnUse: false
      event: !type:XenoDemocracyVoteActionEvent
      whitelist:
        components:
        - XenoDemocracy
