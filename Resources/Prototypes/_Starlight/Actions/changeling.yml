  components:
  - type: Action
    useDelay: 1
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: chameleon_skin
    checkCanInteract: false
    checkConsciousness: false
  - type: InstantAction
    event: !type:ActionChameleonSkinEvent {}
  - type: ChangelingAction
    chemicalCost: 15 # Takes energy to disable, so we can make it a little cheaper.

- type: entity
  id: ActionEphedrineOverdose
  name: Ephedrine Overdose
  description: Inject some stimulants into yourself. Costs 20 chemicals.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: epinephrine_overdose
    checkCanInteract: false
  - type: InstantAction
    event: !type:ActionEphedrineOverdoseEvent {}
  - type: ChangelingAction
    chemicalCost: 20 # It's the weakest one of the stimulants, so it can be cheaper.
    useInLesserForm: true

- type: entity
  id: ActionDesoxyephedrineOverdose
  name: Desoxyephedrine Overdose
  description: Inject some stronger stimulants into yourself, poisoning yourself mildly. Costs 30 chemicals.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 20
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Actions/changeling.rsi
      state: desoxyephedrine_overdose
    checkCanInteract: false
  - type: InstantAction
    event: !type:ActionDesoxyephedrineOverdoseEvent {}
  - type: ChangelingAction
    chemicalCost: 30 # It injects enough Desoxy to hurt you, so it doesn't need to be that more expensive.
    requireAbsorbed: 2 # It's not that great... but it's a faster stimulant than Ephedrine, so it requires you to have absorbed a bit more.
    useInLesserForm: true

- type: entity
  id: ActionAmalgamOverdose
