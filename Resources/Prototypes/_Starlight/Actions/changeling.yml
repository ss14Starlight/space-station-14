    checkConsciousness: false
  - type: InstantAction
    event: !type:OpenChangelingChemistryEvent {}
  - type: ChangelingAction
    requireBiomass: false
    useInLesserForm: true

- type: entity
  id: ActionChemicalSting
  name: Chemical Sting
  description: Silently inject a chosen dose of your prepared mixture. Evolution lets you inject yourself. Costs 10 chemicals per sting.
