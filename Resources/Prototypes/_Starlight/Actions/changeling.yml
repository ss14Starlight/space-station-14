# abilities

# starting
- type: entity
  id: ActionEvolutionMenu
  name: Open evolution menu
  description: Opens the evolution menu. Can be used while unconscious.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: evolution_menu
    checkCanInteract: false # Let them shop while cuffed/unconscious. Could be neat.
    checkConsciousness: false
  - type: InstantAction
    event: !type:OpenEvolutionMenuEvent {}
  - type: ChangelingAction
    requireBiomass: false
    useInLesserForm: true

- type: entity
  id: ActionStingExtractDNA
  name: Extract DNA sting
  description: Steal your target's genetic information. Costs 25 chemicals.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: sting_extractdna
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:StingExtractDNAEvent {}
  - type: ChangelingAction
    chemicalCost: 25
    useInLesserForm: true
  - type: EorgPreventAction


- type: entity
  id: ActionEnterStasis
  name: Enter regenerative stasis
  description: Feign death and regenerate your body. Empties your chemical reserves and consumes biomass until you awaken.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: stasis_enter
    checkCanInteract: false
    checkConsciousness: false
  - type: InstantAction
    event: !type:EnterStasisEvent {}
  - type: ChangelingAction
    biomassCost: 1
    useInLesserForm: true

- type: entity
  id: ActionExitStasis
  name: Exit stasis
  description: Rise from the dead with full health. Costs 60 chemicals, or 30 after Evolution.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: stasis_exit
    checkCanInteract: false
    checkConsciousness: false
  - type: InstantAction
    event: !type:ExitStasisEvent {}
  - type: ChangelingAction
    chemicalCost: 60
    evolvedChemicalCost: 30
    useInLesserForm: true

# combat
- type: entity
  parent: BaseAction
  id: ActionRetractableItemArmBladePlus
  name: True Arm Blade
  description: Shed your flesh and reform it into a truly beautiful blade. Costs 30 chemicals to summon, and 30 chemicals to retract.
  components:
  - type: Action
    useDelay: 2
    raiseOnAction: true
    itemIconStyle: BigAction
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: armblade-plus
  - type: InstantAction
    event: !type:OnRetractableItemActionEvent
  - type: RetractableItemAction
    spawnedPrototype: ArmBladePlus
    summonSounds:
      collection: gib # Placeholder
    retractSounds:
      collection: gib # Placeholder
  - type: ChangelingAction
    chemicalCost: 30 # It's *very* strong. This is your *final* upgrade.

- type: entity
  id: ActionCreateBoneShard
  name: Form Bone Shard
  description: Grow a barbed shard to throw at your prey. A hit slows movement by 40% for 6 seconds and deals 60 genetic damage over that time. Evolution raises these to 60% and 90 damage. Costs 15 chemicals.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: bone_shard
  - type: InstantAction
    event: !type:CreateBoneShardEvent {}
  - type: ChangelingAction
    chemicalCost: 15

- type: entity
  id: ActionToggleChitinousArmor
  name: Toggle Armor
  description: Inflate your body into an all-consuming chitinous mass of armor. Costs 25 chemicals.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 2
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: chitinous_armor
  - type: InstantAction
    event: !type:ToggleChitinousArmorEvent {}
  - type: ChangelingAction
    chemicalCost: 25

- type: entity
  parent: BaseAction
  id: ActionToggleOrganicShield
  name: Form Shield
  description: Reform one of your arms into a large, fleshy shield. Costs 20 chemicals.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 2
    raiseOnAction: true
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: organic_shield
  - type: InstantAction
    event: !type:OnRetractableItemActionEvent
  - type: RetractableItemAction
    spawnedPrototype: ChangelingShield
    summonSounds:
      collection: gib # Placeholder
    retractSounds:
      collection: gib # Placeholder
  - type: ChangelingAction
    chemicalCost: 20

- type: entity
  id: ActionShriekDissonant
  name: Dissonant Shriek
  description: Unleash an electromagnetic shriek that disrupts nearby electronics. Evolution also disorients living creatures and shatters lights. Costs 30 chemicals.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: shriek_dissonant
  - type: InstantAction
    event: !type:ShriekDissonantEvent {}
  - type: ChangelingAction
    chemicalCost: 30
    useInLesserForm: true

- type: entity
  id: ActionShriekResonant
  name: Resonant Shriek
  description: Disorient people and break lights, with just your voice. Costs 25 chemicals.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: shriek_resonant
  - type: InstantAction
    event: !type:ShriekResonantEvent {}
  - type: ChangelingAction
    chemicalCost: 25
    useInLesserForm: true

- type: entity
  id: ActionToggleStrainedMuscles
  name: Strain Muscles
  description: Push your muscles past their limits to run faster at the cost of stamina. Costs 30 chemicals to toggle. Evolution further increases speed, boosts melee damage by 25%, and reduces all damage taken by 20% while active.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: strained_muscles
  - type: InstantAction
    event: !type:ToggleStrainedMusclesEvent {}
  - type: ChangelingAction
    chemicalCost: 30
    useInLesserForm: true

# stings
- type: entity
  id: ActionChangelingChemistry
  name: Chemical Synthesis
  description: Mix, heat or cool up to 30u of chemicals for your sting. Replenishing your reagent stocks consumes chemicals.
  categories: [ HideSpawnMenu ]
