# stings
- type: entity
  id: ActionChangelingChemistry
  name: Chemical Synthesis
  description: Prepare and heat a chemical mixture for your sting. Reagent regeneration consumes chemicals.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: sting_cryo
    checkCanInteract: false
    checkConsciousness: false
  - type: InstantAction
    event: !type:OpenChangelingChemistryEvent {}
  - type: ChangelingAction
    requireBiomass: false
    useInLesserForm: true

- type: entity
  id: ActionChemicalSting
  name: Chemical Sting
  description: Silently inject the selected dose of your prepared mixture into a target. Evolution allows self-injection. Costs 10 chemicals on success.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 1
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: sting_lethargic
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:ChemicalStingEvent {}
  - type: ChangelingAction
    useInLesserForm: true

- type: entity
  id: ActionStingFakeArmblade
  name: Fake Armblade Sting
  description: Grow an unremovable dull armblade in your target's hand for 30 seconds. Evolution fills both hands. Costs 50 chemicals.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: sting_armblade
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:StingFakeArmbladeEvent {}
  - type: ChangelingAction
    chemicalCost: 50
  - type: EorgPreventAction

- type: entity
  parent: ActionChangelingDevour
  id: ActionStingInfect
  name: Infection Sting
  description: Transform an organic victim into a changeling through the devour process. Costs 2 evolution points only on success. The victim enters regenerative stasis and starts with half the normal evolution points.
  components:
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:StingInfectEvent {}
  - type: ChangelingAction

