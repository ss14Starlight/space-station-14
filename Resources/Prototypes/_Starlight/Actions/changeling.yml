# abilities

# starting
- type: entity
  id: ActionEvolutionMenu
  name: Open evolution menu
  description: Opens the evolution menu. Can be used while unconscious.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: evolution_menu
    checkCanInteract: false # Let them shop while cuffed/unconscious. Could be neat.
    checkConsciousness: false
  - type: InstantAction
    event: !type:OpenEvolutionMenuEvent {}
  - type: ChangelingAction
    requireBiomass: false
    useInLesserForm: true

- type: entity
  id: ActionStingExtractDNA
  name: Extract DNA sting
  description: Steal your target's genetic information. Costs 25 chemicals.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: sting_extractdna
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:StingExtractDNAEvent {}
  - type: ChangelingAction
    chemicalCost: 25
    useInLesserForm: true
  - type: EorgPreventAction


- type: entity
  id: ActionEnterStasis
  name: Enter regenerative stasis
  description: Fake your death and start regenerating. Drains all your chemicals. Consumes biomass.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: stasis_enter
    checkCanInteract: false
    checkConsciousness: false
  - type: InstantAction
    event: !type:EnterStasisEvent {}
  - type: ChangelingAction
    biomassCost: 1
    useInLesserForm: true

- type: entity
  id: ActionExitStasis
  name: Exit stasis
  description: Rise from the dead with full health. Costs 60 chemicals, or 30 after Evolution.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: stasis_exit
    checkCanInteract: false
    checkConsciousness: false
  - type: InstantAction
    event: !type:ExitStasisEvent {}
  - type: ChangelingAction
    chemicalCost: 60
    evolvedChemicalCost: 30
    useInLesserForm: true

# combat
- type: entity
  parent: BaseAction
  id: ActionRetractableItemArmBladePlus
  name: True Arm Blade
  description: Shed your flesh and reform it into a truly beautiful blade. Costs 30 chemicals to summon, and 30 chemicals to retract.
  components:
  - type: Action
    useDelay: 2
    raiseOnAction: true
    itemIconStyle: BigAction
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: armblade-plus
  - type: InstantAction
    event: !type:OnRetractableItemActionEvent
  - type: RetractableItemAction
    spawnedPrototype: ArmBladePlus
    summonSounds:
      collection: gib # Placeholder
    retractSounds:
      collection: gib # Placeholder
  - type: ChangelingAction
    chemicalCost: 30 # It's *very* strong. This is your *final* upgrade.
    requireAbsorbed: 6

- type: entity
  id: ActionCreateBoneShard
  name: Form Bone Shard
  description: Form a throwing shard that immediately slows its victim by 40% for 6 seconds and injects 60 genetic damage over 6 seconds. Evolution increases this to 60% slowdown and 90 genetic damage. Costs 15 chemicals.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: bone_shard
  - type: InstantAction
    event: !type:CreateBoneShardEvent {}
  - type: ChangelingAction
    chemicalCost: 15

- type: entity
  id: ActionToggleChitinousArmor
  name: Toggle Armor
  description: Inflate your body into an all-consuming chitinous mass of armor. Costs 25 chemicals.
