  - type: ChangelingAction
    chemicalCost: 30
    useInLesserForm: true
    requireAbsorbed: 2

- type: entity
  id: ActionShriekResonant
  name: Resonant Shriek
  description: Disorient people and break lights, with just your voice. Costs 25 chemicals.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: shriek_resonant
  - type: InstantAction
    event: !type:ShriekResonantEvent {}
  - type: ChangelingAction
    chemicalCost: 25
    useInLesserForm: true

- type: entity
  id: ActionToggleStrainedMuscles
  name: Strain Muscles
  description: Move at extremely fast speeds. Deals stamina damage. Evolution increases speed, melee damage by 25%, and adds 20% resistance to every damage type while active.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
