    spawnedPrototype: ChangelingShield
    summonSounds:
      collection: gib # Placeholder
    retractSounds:
      collection: gib # Placeholder
  - type: ChangelingAction
    chemicalCost: 20
    requireAbsorbed: 2

- type: entity
  id: ActionShriekDissonant
  name: Dissonant Shriek
  description: Emit an EMP blast. Evolution adds a disorienting shriek against organic creatures. Costs 30 chemicals.
  categories: [ HideSpawnMenu ]
