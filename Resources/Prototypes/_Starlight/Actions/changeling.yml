- type: entity
  id: ActionChameleonSkin
  name: Chameleon Skin
  description: Blend in with the environment for 15 chemicals and 1.25 chemicals/second. Evolution prevents movement from revealing you and reduces upkeep to 0.5 chemicals/second.
