    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:ChemicalStingEvent {}
  - type: ChangelingAction
    useInLesserForm: true

- type: entity
  id: ActionStingFakeArmblade
  name: Fake Armblade Sting
  description: Grow a dull armblade in your target's hand. It cannot be dropped and lasts 30 seconds. Evolution grows a blade in each hand. Costs 50 chemicals.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Interface/Actions/actions_changeling.rsi
      state: sting_armblade
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:StingFakeArmbladeEvent {}
  - type: ChangelingAction
    chemicalCost: 50
  - type: EorgPreventAction

- type: entity
  parent: ActionChangelingDevour
  id: ActionStingInfect
  name: Infection Sting
  description: Awaken an independent changeling in an organic victim. They retain their mind and enter regenerative stasis with half the usual starting evolution points. Costs 2 evolution points once the transformation is complete.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon: { sprite: _Starlight/Interface/Actions/actions_changeling.rsi, state: sting_transform }
    iconOn: null
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:StingInfectEvent {}
  - type: ChangelingAction

