- type: entity
  id: ActionChangelingColony
  name: Colony
  description: Detach living limbs, rupture your body, switch carriers and possess organic bodies. Includes Assimilation Sting to bring victims into your hive. Evolution unlocks specialized fragment abilities and living blood.
  categories: [HideSpawnMenu]
  components:
  - type: Action
    checkCanInteract: false
    checkConsciousness: false
    itemIconStyle: NoItem
    icon: { sprite: _Starlight/Interface/Actions/changeling_adaptations.rsi, state: collective }
  - type: InstantAction
    event: !type:OpenChangelingColonyEvent {}

- type: entity
  parent: ActionChangelingDevour
  id: ActionStingAssimilate
  name: Assimilation Sting
  description: Draw a victim into your hive in two 10-second stages, or 5 seconds each after Evolution. Their mind joins the hive while their slain body is restored as a vacant carrier. Costs biomass equal to 25% of your body's maximum only on success. Uses no chemicals and grants no evolution points.
  categories: [HideSpawnMenu]
  components:
  - type: Action
    itemIconStyle: NoItem
    icon: { sprite: _Starlight/Interface/Actions/actions_changeling.rsi, state: sting_lethargic }
    iconOn: null
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:StingAssimilateEvent {}
  - type: ChangelingAction
    chemicalCost: 0

- type: entity
  id: ActionChangelingLivingBlood
  name: Living blood
  description: Toggle the animation of shed blood and accidentally severed parts for your hive. Free. Existing creatures remain alive when disabled.
  categories: [HideSpawnMenu]
  components:
  - type: Action
    checkCanInteract: false
    checkConsciousness: false
    itemIconStyle: NoItem
    icon: { sprite: _Starlight/Interface/Actions/actions_vampire.rsi, state: blood_pool }
  - type: InstantAction
    event: !type:ToggleChangelingLivingBloodEvent {}

- type: entity
  id: ActionChangelingRupture
  name: Rupture
  description: Split your body into living parts. Costs 20 biomass. Can be used after death.
  categories: [HideSpawnMenu]
  components:
  - type: Action
    checkCanInteract: false
    checkConsciousness: false
    itemIconStyle: NoItem
    icon: { sprite: _Starlight/Interface/Actions/changeling_adaptations.rsi, state: rupture }
  - type: InstantAction
    event: !type:RuptureChangelingEvent {}
  - type: EorgPreventAction

- type: entity
  parent: ActionChangelingDevour
  id: ActionChangelingPossess
  name: Possess body
  description: Take over an organic body in two ten-second stages, or five seconds each after Evolution. Movement interrupts the process.
  components:
  - type: Action
    itemIconStyle: NoItem
    icon: { sprite: _Starlight/Interface/Actions/changeling_adaptations.rsi, state: possession }
    iconOn: null

- type: entity
  id: ActionChangelingNeurotoxin
  name: Neurotoxic bite
  description: Your next hit slows the victim, then paralyses them after three seconds during possession. Recharges in five minutes.
  categories: [HideSpawnMenu]
  components:
  - type: Action
    itemIconStyle: NoItem
    icon: { sprite: _Starlight/Interface/Actions/changeling_adaptations.rsi, state: neuro-bite }
  - type: InstantAction
    event: !type:ArmChangelingNeurotoxinEvent {}
  - type: EorgPreventAction

- type: entity
  parent: StatusEffectSlowdown
  id: ChangelingCaptureSlowdown
  name: neurotoxic slowdown
  components:
  - type: StatusEffect
    blacklist: null

- type: entity
  parent: ActionRetractableItemArmBlade
  id: ActionChangelingFragmentArmblade
  components:
  - type: ChangelingAction
    chemicalCost: 20
    useInLesserForm: true

- type: entity
  parent: ActionShriekDissonant
  id: ActionChangelingFragmentShriek
  components:
  - type: ChangelingAction
    chemicalCost: 30
    useInLesserForm: true

- type: entity
  parent: ActionChameleonSkin
  id: ActionChangelingFragmentChameleon
  components:
  - type: ChangelingAction
    useInLesserForm: true

- type: entity
  parent: StatusEffectStunned
  id: ChangelingCaptureParalysis
  name: neurotoxic paralysis
  components:
  - type: StatusEffect
    blacklist: null
