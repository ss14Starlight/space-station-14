- type: entity
  id: ActionBloodBoundConvert
  name: Convert
  description: Convert a crewmember to your blood oath.
  components:
  - type: Action
    icon:
      sprite: /Textures/Interface/Alerts/bleed.rsi
      state: bleed10
    itemIconStyle: BigAction
  - type: TargetAction
    repeat: false
    deselectOnMiss: false
  - type: EntityTargetAction
    event: !type:BloodBoundConvertActionEvent
    whitelist:
      components:
      - HumanoidAppearance
    canTargetSelf: false

- type: entity
  id: ActionBloodBoundCheckConvert
  name: Check If Convertible
  description: Check if a crewmember is susceptible to conversion.
  components:
  - type: Action
    icon: Interface/VerbIcons/vv.svg.192dpi.png # eye icon
    itemIconStyle: BigAction
  - type: TargetAction
    repeat: true
    deselectOnMiss: false
  - type: EntityTargetAction
    event: !type:BloodBoundCheckConvertActionEvent
    whitelist:
      components:
      - HumanoidAppearance
    canTargetSelf: false
