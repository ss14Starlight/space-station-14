- type: entity
  parent: BaseAction
  id: ActionToggleDome
  name: Toggle energy dome
  description: Turn the energy barrier on or off.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -10
    icon:
      sprite: Objects/Weapons/Melee/e_shield.rsi
      state: eshield-on
    useDelay: 1
  - type: InstantAction
    event: !type:ToggleActionEvent

- type: entity
  parent: [BaseSuicideAction, BaseImplantAction]
  id: ActionActivatePicoBomb
  name: Activate Picobomb
  description: Activates your internal picobomb, completely destroying you and your equipment
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Interface/Actions/Implants/implants.rsi
      state: explosive