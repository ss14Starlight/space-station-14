- type: particleEffect
  id: DrippingBlood
  sprite:
    sprite: _Starfall/Particles/generic.rsi
    state: soft_dot
  startColor: "#a80000"
  endColor: "#730b0b"
  alphaOverLifetime:
    - time: 0.0
      value: 1.0
    - time: 1.0
      value: 0.0
  emissionRate: 10
  maxCount: 100
  particleSize: 1
  burst: false
  duration: 0
  gravity: 1
  drag: 0.1
  noiseStrength: 0.15
  noiseFrequency: 0.8
  spreadAngle: 60
  emitAngle: 180
  shape:
    type: CircleFill
    radius: 0.3

- type: particleEffect
  id: SnowFall
  sprite:
    sprite: _Starfall/Particles/generic.rsi
    state: cross
  startColor: "#f0f0f0"
  endColor: "#c2f0ff"
  alphaOverLifetime:
    - time: 0.0
      value: 1.0
    - time: 2.5
      value: 0.1
  lifetime: 2.5
  lifetimeVariance: 0.8
  speed: 0.9
  emissionRate: 15
  maxCount: 100
  particleSize: 1
  burst: false
  duration: 0
  gravity: 2.5
  drag: 0.1
  noiseStrength: 0.15
  noiseFrequency: 0.8
  spreadAngle: 60
  emitAngle: 0
  shape:
    type: CircleFill
    radius: 2

