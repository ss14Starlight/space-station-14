# Each red/green channel step represents half a source pixel. This lets the
# directional maps centre odd-width heads under even-width side-view hats.
- type: shader
  id: BorgHeadwearDisplacedDraw
  kind: source
  path: /Textures/Shaders/displacement.swsl
  params:
    displacementSize: 63.5

- type: shader
  id: BorgHeadwearDisplacedDrawUnshaded
  kind: source
  path: /Textures/_Starlight/Shaders/displacement_unshaded.swsl
  params:
    displacementSize: 63.5
