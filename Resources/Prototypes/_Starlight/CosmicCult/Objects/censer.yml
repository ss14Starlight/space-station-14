- type: tool
  id: Censer
  name: tool-quality-censer-name
  toolName: tool-quality-censer-tool-name
  spawn: CosmicCenser
  icon: { sprite: _Starlight/CosmicCult/Objects/censer.rsi, state: icon }

- type: entity
  parent: [SolutionNormal, BaseItem]
  id: CosmicCenser
  name: ardent censer
  description: Cleanses and sanctifies the air around it.
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Sprite
    sprite: _Starlight/CosmicCult/Objects/censer.rsi
    layers:
    - state: icon
    - state: flame
      visible: false
      shader: unshaded
      map: ["enum.ToggleableVisuals.Layer"]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: ItemToggleSize
    activatedSize: Large
  - type: ItemToggle
    predictable: false
  - type: CosmicCenser
  - type: Tool
    qualities: [ Censer ]
  - type: Welder
    fuelSolutionName: Censer
    fuelReagent: Holywater
  - type: RefillableSolution
    solution: Censer
  - type: Solution
    id: Censer
    solution:
      reagents:
      - ReagentId: Holywater
        Quantity: 120
  - type: RefillReagentFilter
    reagents:
    - Holywater
  - type: ItemTogglePointLight
  - type: ToggleableVisuals
    spriteLayer: flame
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded
  - type: Appearance
  - type: PointLight
    enabled: false
    radius: 1.5
    energy: 2
    color: "#7742a8"
    netsync: false
