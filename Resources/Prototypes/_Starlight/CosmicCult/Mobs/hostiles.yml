- type: entity
  parent: [ BaseSimpleMob, FlyingMobBase ]
  id: BaseMobCosmicHostile
  suffix: Hostile
  abstract: true
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
    weightlessModifier: 1
  - type: AntagImmune
  - type: NoSlip
  - type: ProtectedFromStepTriggers
  - type: IgnoreSpiderWeb
  - type: Insulated
  - type: StatusEffects
    allowed:
    - Stunned
    - Stutter
  - type: LanguageKnowledge
    speaks:
    - Cosmic
    understands:
    - Cosmic
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: CosmicCultFaction
  - type: CosmicMinion
  - type: NpcFactionMember
    factions:
    - CosmicCult
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: false
    name: ghost-role-information-cosmic-minion-name
  - type: CosmicCultExamine
    cultistText: cosmic-examine-text-cultentity
    othersText: cosmic-examine-text-entities
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 70
        behaviors:
          - !type:SpawnEntitiesBehavior
            spawn:
              CosmicLapseAbilityVFX:
                min: 1
                max: 1
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              path: /Audio/_Starlight/CosmicCult/ability_lapse.ogg
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Entropy
        Quantity: 100
    maxBleedAmount: 10.75
    bleedReductionAmount: 0.1
    bloodlossDamage:
      types:
        Bloodloss:
          0
    bloodlossHealDamage:
      types:
        Bloodloss:
          0
  - type: CombatMode
  - type: TypingIndicator
    proto: CosmicTyping
  - type: PointLight
    color: "#42a4ae"
    radius: 2
    energy: 2
    softness: 1
    castShadows: false
  - type: ZombieImmune
  - type: GhostTakeoverAvailable
  - type: LightBehaviour
    behaviours:
     - !type:FadeBehaviour
       interpolate: Linear
       minDuration: 5.5
       maxDuration: 5.5
       startValue: 0.5
       endValue: 2
       property: Energy
       enabled: true
       isLooped: true
       reverseWhenFinished: true

- type: entity
  parent: [ BaseMobCosmicHostile, MobCosmicCustodian ]
  id: MobCosmicCustodianHostile #Bruiser/Sword/Lance stats
  components:
  - type: Physics
    bodyStatus: OnGround
  - type: TypingIndicator
    proto: CosmicTyping
  - type: GhostRole
    name: ghost-role-information-cosmic-custodian-name
    description: ghost-role-information-cosmic-custodian-description
    rules: ghost-role-information-cosmic-custodian-rules
    mindRoles:
    - MindRoleCosmicMinion
  - type: MeleeWeapon
    altDisarm: false
    animation: WeaponArcCosmic
    damage:
      types:
        Cold: 5
        Blunt: 5
        Slash: 5
        Structural: 10
    soundHit:
      path: /Audio/_Starlight/CosmicCult/cosmicsword_hit.ogg
      params:
        variation: 0.2
        volume: 1
    soundSwing:
      path: /Audio/_Starlight/CosmicCult/cosmicweapon_swing.ogg
      params:
        variation: 0.125
        volume: -4

- type: entity
  parent: [ BaseMobCosmicHostile, MobCosmicOracle ]
  id: MobCosmicOracleHostile #Disabler
  components:
  - type: Physics
    bodyStatus: OnGround
  - type: TypingIndicator
    proto: CosmicTyping
  - type: GhostRole
    name: ghost-role-information-cosmic-oracle-name
    description: ghost-role-information-cosmic-oracle-description
    rules: ghost-role-information-cosmic-oracle-rules
    mindRoles:
    - MindRoleCosmicMinion
  - type: MeleeWeapon
    altDisarm: false
    animation: WeaponArcCosmic
    damage:
      types:
        Asphyxiation: 10
        Cold: 5
        Blunt: 5
        Structural: 5
    soundHit:
      path: /Audio/_Starlight/CosmicCult/cosmiclance_hit.ogg
      params:
        variation: 0.2
        volume: 1
    soundSwing:
      path: /Audio/_Starlight/CosmicCult/cosmicweapon_swing.ogg
      params:
        variation: 0.125
        volume: -4

- type: entity
  parent: [ BaseMobCosmicHostile, MobCosmicLodestar ]
  id: MobCosmicLodestarHostile #ranged unit 25 damage from razor.
  components:
  - type: Physics
    bodyStatus: OnGround
  - type: GhostRole
    name: ghost-role-information-cosmic-lodestar-name
    description: ghost-role-information-cosmic-lodestar-description
    rules: ghost-role-information-cosmic-lodestar-rules
    mindRoles:
    - MindRoleCosmicMinion
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: Gun
    projectileSpeed: 12
    soundGunshot: /Audio/_Starlight/CosmicCult/projectile_razor.ogg
    soundEmpty: null
    fireRate: 1
    useKey: false
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1.8
    rechargeSound:
      path: /Audio/_Starlight/CosmicCult/projectile_razor_reload.ogg
      params:
        volume: -99
  - type: BasicEntityAmmoProvider
    proto: ProjectileCosmic
    capacity: 1
    count: 1
