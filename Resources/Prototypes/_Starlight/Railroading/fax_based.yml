# Conditions
- type: entity
  id: CrewCondition
  categories: [ HideSpawnMenu ]
  abstract: true
  components:
  - type: Conditions
    conditions:
    - !type:SubjectSpeciesCondition
      blacklist:
      - Abductor
      - Skeleton
      - Terminator
      - IPC
    - !type:SubjectMindAntagCondition
      blacklist:
      - Brighteye

- type: entity
  id: NoSalvCondition
  categories: [ HideSpawnMenu ]
  abstract: true
  components:
  - type: Conditions
    conditions:
    - !type:SubjectMindJobCondition
      blacklist:
      - SalvageLead
      - SalvageSpecialist
      - SalvageMedic
    - !type:SubjectSpeciesCondition
      blacklist:
      - Abductor
      - Skeleton
      - Terminator
      - IPC
    - !type:SubjectMindAntagCondition
      blacklist:
      - Brighteye

# Example(Smokeable) Prototype

- type: entity
  id: RRCardCriminal
  parent: CrewCondition
  categories: [ HideSpawnMenu ]
  components:
  - type: RailroadCard
    title: rr-criminal
    icon: ""
    iconColor: "#fd3f3f" # Antag
    color: "#6c15ae" # Mythical
    image: /Textures/_Starlight/Railroading/antag.png
    description: rr-criminal-desc
  - type: RailroadFaxOnChosen
    delay: 180
    addresses:
    - Captain's Office # PR #4706: Remove once fax protos are used everywhere
    - Captain
    - Security
    - Bridge
    - Conference
    - Conference Room  # PR #4706: Remove once fax protos are used everywhere
    - HoS Office # PR #4706: Remove once fax protos are used everywhere
    - Head of Security
    - Warden's Office # PR #4706: Remove once fax protos are used everywhere
    - Warden
    - Detective
    - Detective's Office # PR #4706: Remove once fax protos are used everywhere
    - Magistrate
    - Central Command
    letters:
    - name: rr-criminal-letter-name
      content: rr-criminal-1-letter-content
      paperPrototype: PaperNTCC
      stampState: paper_stamp-centcom
      stampedBy:
        - stampedColor: "#006666"
          stampedName: rr-nt-isd
  - type: RailroadFaxOnFailed
    addresses:
    - Captain's Office # PR #4706: Remove once fax protos are used everywhere
    - Captain
    - Security
    - Bridge
    - Conference # PR #4706: Remove once fax protos are used everywhere
    - Conference Room
    - HoS Office # PR #4706: Remove once fax protos are used everywhere
    - Head of Security
    - Warden's Office # PR #4706: Remove once fax protos are used everywhere
    - Warden
    - Detective
    - Detective's Office # PR #4706: Remove once fax protos are used everywhere
    - Magistrate
    - Central Command
    letters:
    - name: rr-criminal-failed-name
      content: rr-criminal-failed-content
      paperPrototype: PaperNTCC
      stampState: paper_stamp-centcom
      stampedBy:
        - stampedColor: "#006620"
          stampedName: rr-cc
  - type: RailroadAssignRole
    role: RRMindRoleCriminal
  - type: RailroadModifyIdCard
    title: Criminal
    icon: "JobIconPrisoner"
  - type: RailroadMessageOnChosen
    messages:
    - message: rr-criminal-message
      wrapped: rr-criminal-wrapped-message
      color: "#fd3f3f"
  - type: RailroadTimerTask
    duration: 1200
  - type: RailroadSurviveTask
  - type: RailroadAvoidHandcuffsTask
  - type: RailroadDeliveryReward
    delivery: PackageDeliveryRewardSyndicateLetter
    dataset: railroadingDeliveryMessages
    wrappedDataset: railroadingDeliveryWrappedMessages
  - type: RailroadDonationReward
    amount: # 20 min survival
      min: 200
      max: 300

#ITG Bounty Card

- type: entity
  id: RRCardBounty
  parent: NoSalvCondition
  categories: [ HideSpawnMenu ]
  components:
  - type: RailroadCard
    title: rr-bounty
    icon: ""
    iconColor: "#fd3f3f" # Antag
    color: "#6c15ae" # Mythical
    image: /Textures/_Starlight/Railroading/antag.png
    description: rr-bounty-desc
  - type: RailroadFaxOnChosen
    delay: 60
    addresses:
    - Salvage Lead ATS
    - Salvage ATS
    - Security
    - Bridge
    - Magistrate
    - Central Command
    letters:
    - name: rr-bounty-letter-name
      content: rr-bounty-1-letter-content
      paperPrototype: PaperITG
      stampState: paper_stamp-qm
      stampedBy:
        - stampedColor: "#b3844b"
          stampedName: stamp-component-stamped-name-rubber-stamp-itg
        - stampedColor: "#006620"
          stampedName: rr-cc
  - type: RailroadFaxOnFailed
    addresses:
    - Salvage ATS
    - Central Command
    letters:
    - name: rr-bounty-failed-name
      content: rr-bounty-failed-content
      paperPrototype: PaperITGBounty
      stampState: paper_stamp-qm
      stampedBy:
        - stampedColor: "#b3844b"
          stampedName: stamp-component-stamped-name-rubber-stamp-itg
  - type: RailroadFaxOnCompleted
    addresses:
    - Salvage Lead ATS
    - Salvage ATS
    - Central Command
    letters:
    - name: rr-bounty-completed-name
      content: rr-bounty-completed-content
      paperPrototype: PaperITG
      stampState: paper_stamp-qm
      stampedBy:
        - stampedColor: "#b3844b"
          stampedName: stamp-component-stamped-name-rubber-stamp-itg
  - type: RailroadMessageOnChosen
    messages:
    - message: rr-bounty-message
      wrapped: rr-bounty-wrapped-message
      color: "#fd3f3f"
  - type: RailroadTimerTask
    duration: 1200
  - type: RailroadSurviveTask
  - type: RailroadAvoidHandcuffsTask
  - type: RailroadDonationReward
    amount: # 20 min survival
      min: 1500
      max: 2000
