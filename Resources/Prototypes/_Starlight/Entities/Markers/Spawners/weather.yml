- type: entity
  id: WeatherMarkerBase
  name: Weather Marker
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Marker
  - type: Clickable
  - type: InteractionOutline
  - type: Tag
    tags:
    - ForceFixRotations

# Wet Weather
- type: entity
  id: WeatherMarkerRain
  parent: WeatherMarkerBase
  suffix: Rain
  description: "A little perichor for the soul."
  components:
  - type: Transform
  - type: WeatherMarker
    weather: WeatherRain
    delay: 0
  - type: Sprite
    sprite: /Textures/Effects/weather.rsi
    state: rain

- type: entity
  id: WeatherMarkerStorm
  parent: WeatherMarkerBase
  suffix: Rainstorm
  description: "It was a dark and stormy night..."
  components:
  - type: Transform
  - type: WeatherMarker
    weather: WeatherStorm
  - type: Sprite
    sprite: /Textures/Effects/weather.rsi
    state: storm

- type: entity
  id: WeatherMarkerHail
  parent: WeatherMarkerBase
  suffix: Hail
  description: "Mostly not deadly."
  components:
  - type: Transform
  - type: WeatherMarker
    weather: WeatherHail
  - type: Sprite
    sprite: /Textures/Effects/weather.rsi
    state: hail

- type: entity
  id: WeatherMarkerSnowfallLight
  parent: WeatherMarkerBase
  suffix: "Snowfall, Light"
  description: "A light dusting of snow."
  components:
