- type: entity
  name: centcomm service worker spawner (post-round)
  id: CCServiceWorkerSpawnerPostRound
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - state: red
        - sprite: Structures/Decoration/banner.rsi
          state: banner
    - type: TriggerOnRoundEnd
    - type: AddComponentsOnTrigger
      components:
        - type: RandomSpawner
          prototypes:
          - RandomHumanoidCCServiceWorker

