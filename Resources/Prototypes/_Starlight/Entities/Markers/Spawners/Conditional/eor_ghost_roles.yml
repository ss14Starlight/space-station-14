- type: entity
  id: MobHumanCCServiceWorkerEOR
  name: CentComm service worker
  parent: MobHuman
  components:
    - type: RandomHumanoidAppearance
      randomizeName: true
    - type: IdBind
    - type: Loadout
      prototypes: [ CCServiceWorkerGear ]
      roleLoadout: [ RoleSurvivalStandard ]

