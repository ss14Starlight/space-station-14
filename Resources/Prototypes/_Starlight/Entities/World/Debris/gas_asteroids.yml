- type: entity
  id: BaseGasAsteroid
  parent: BaseDebris
  name: gas asteroid
  abstract: true
  components:
    - type: MapGrid
    - type: BlobFloorPlanBuilder
      floorTileset:
      - FloorAsteroidSand
      blobDrawProb: 0.5
      radius: 6
      floorPlacements: 16
    - type: GasAsteroidFloorPlanPopulator
      entries:
        FloorAsteroidSand:
            # Half the asteroid should be empty
          - prob: 0.5
            orGroup: rock
            # Less rocks and such to make finding gas nodes more easier
          - id: WallRock
            prob: 0.3
            orGroup: rock
          - id: WallRockCoal
            prob: 0.1
            orGroup: rock
          - id: WallRockTin
            prob: 0.1
            orGroup: rock
          - id: WallRockQuartz
            prob: 0.1
            orGroup: rock
            # It is a gas asteroid, makes sense to have more plasma
          - id: WallRockPlasma
            prob: 0.09
            orGroup: rock
          - id: WallRockGold
            prob: 0.05
            orGroup: rock
          - id: WallRockDiamond
            prob: 0.005
            orGroup: rock
          - id: WallRockSilver
            prob: 0.05
            orGroup: rock
          - id: WallRockUranium
            prob: 0.02
            orGroup: rock
          - id: WallRockBananium
            prob: 0.02
            orGroup: rock
          - id: WallRockArtifactFragment
            prob: 0.01
            orGroup: rock
    - type: IFF
      flags: HideLabel
      color: "#e81e22"

- type: entity
  id: GasAsteroidSmall
  parent: BaseGasAsteroid
  name: gas asteroid small
  categories: [ HideSpawnMenu ]
  components:
    - type: MapGrid
