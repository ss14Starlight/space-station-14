# special modifiers and status effects used exclusively by dwarves getting drunk

- type: entity
  parent: MobStatusEffectBase
  id: MobThresholdsTheHighlander
  name: <<TheHighlander Status Effect>>
  components:
  - type: StatusEffect
    whitelist:
      components:
        - MobState
        - StandingState
      requireAll: true
    blacklist:
      tags:
      - KnockdownImmune
    maximumDuration: 3s
  - type: StatusEffectAlert
    alert: DwarfCourage
  - type: MobThresholdsStatusEffect
    thresholds:
      0: Alive
      219: Critical
      220: Dead

- type: entity
  parent: MobStatusEffectBase
  id: MobThresholdsDeathInTheAfternoon
  name: <<DeathInTheAfternoon Status Effect>>
  components:
  - type: StatusEffect
    whitelist:
      components:
        - MobState
        - StandingState
      requireAll: true
    blacklist:
      tags:
      - KnockdownImmune
    maximumDuration: 3s
  - type: StatusEffectAlert
    alert: DwarfCourage
  - type: MobThresholdsStatusEffect
    thresholds:
      0: Alive
      159: Critical
      160: Dead

- type: entity
  abstract: true
  id: ArmorModDwarfGeneric
  name: <<Dwarf Armor Mod Status Effect>>
  components:
  - type: StatusEffect
    whitelist:
      components:
        - MobState
        - StandingState
      requireAll: true
    blacklist:
      tags:
      - KnockdownImmune
  - type: StatusEffectAlert
    alert: DwarfFortitude

# Example of ArmorModStatusEffect and SoundStatusEffect with all parameters set:
- type: entity
  parent: ArmorModDwarfGeneric
  id: ArmorModWhiskey
  name: <<Whiskey Status Effect>>
  components:
  - type: ArmorModStatusEffect
    ignoreKnockdown: false
    staminaDamageModifier: 1.0
    explosionCoefficient: 1.00
    modifiers:
      coefficients:
        Blunt: 0.90
  - type: SoundStatusEffect
    startSound:
      path: /Audio/_Starlight/Magic/dwarf-buff-whiskey.ogg
      params:
        volume: -12.0
    startPositional: false
    #endSound:
    #  path: /Audio/_Starlight/Magic/gust.ogg
    endPositional: false

