- type: entity
  id: DarkTile
  name: Dark
  description: It's a strange, impenetrable darkness.
  placement:
    mode: SnapgridCenter
  components:
    - type: DarkTile
    - type: Physics
      bodyType: Static
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
          layer:
            - SlipLayer
          mask:
            - ItemMask
          density: 1000
          hard: false
    - type: FloorOccluder
    - type: Clickable
    - type: Appearance
    - type: Transform
      anchored: true
    - type: ActiveEdgeSpreader
    - type: EdgeSpreader
      id: DarkTile
    - type: Sprite
      snapCardinals: true
      drawdepth: FloorTiles
      sprite: _Starlight/Tiles/dark.rsi
      layers:
        - state: dark
          shader: unshaded
        - state: overlay-1
          shader: unshaded
          map: ["overlay"]
    - type: GuideHelp
      guides:
        - Brighteye
    - type: Tag
      tags:
        - TheDark
    - type: SpeedModifierContacts
      walkSpeedModifier: 0.3
      sprintSpeedModifier: 0.3
      blacklist:
        components:
          - Shadekin
          - TheDarkImmune
    - type: StepTrigger
      requiredTriggeredSpeed: 0
      intersectRatio: 0.1
      blacklist:
        tags:
          - Catwalk
    - type: TileEntityEffect
      effects:
        - !type:ModifyStatusEffect
          effectProto: StatusEffectTheDark
          type: Add
          time: 10
    - type: OptionsVisualizer
      visuals:
        overlay:
          - options: Default
            data: { visible: true }
          - options: ReducedMotion
            data: { visible: false }
    - type: RandomSprite
      available:
        - overlay:
            overlay-1: ""
            overlay-2: ""
            overlay-3: ""
            overlay-4: ""
            overlay-5: ""
            overlay-6: ""
            overlay-7: ""
            overlay-8: ""
            overlay-9: ""
            overlay-10: ""
            overlay-11: ""
            overlay-12: ""
