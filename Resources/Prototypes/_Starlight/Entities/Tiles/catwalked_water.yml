- type: entity
  id: FloorWaterCatwalkBorderlessEntity
  name: water catwalk
  description: A catwalk for easier water-based maneuvering.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: _Starlight/Tiles/catwalked_water.rsi
    drawdepth: BelowFloor
    layers:
    - state: catwater
  - type: Icon
    sprite: _Starlight/Tiles/catwalked_water.rsi
    state: full
  - type: Transform
    anchored: true
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCatwalk
      params:
        volume: 8
  - type: Construction
    graph: Water
    node: waterCatwalk
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100 # over water, so not as structually sound as a regular catwalk
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal: # like regular catwalks, takes two to construct, so drop less than that
            min: 0
            max: 1
      - !type:ChangeConstructionNodeBehavior
        node: water
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: FloorWaterCatwalkEntity
  parent: FloorWaterCatwalkBorderlessEntity
  name: water catwalk
  components:
  - type: IconSmooth
    key: floor
    base: catwater
