- type: entity
  name: abductor
  parent: BaseMobAbductor
  id: MobAbductor
  components:
  - type: Abductor
  - type: Tag
    tags:
      - Abductor
      - AbductorScientist
      - CanPilot
      - CantBecomeRevolutionary
      - NotLabelable

- type: startingGear
  id: AbductorScientistGear
  equipment:
    ears: ClothingHeadsetAltAbductor
    jumpsuit: ClothingUniformJumpsuitAbductor
    gloves: ClothingHandsGlovesCombat
    shoes: ClothingShoesBootsCombat
    pocket1: AbductorGizmo

- type: startingGear
  id: AbductorAgentGear
  equipment:
    head: ClothingHeadHelmetAbductor
    ears: ClothingHeadsetAltAbductor
    jumpsuit: ClothingUniformJumpsuitAbductor
    gloves: ClothingHandsGlovesCombat
    shoes: ClothingShoesBootsCombat
    pocket1: Silencer
    pocket2: WeaponAlien
    belt: ClothingAbductorBeltFilled
    outerClothing: ClothingOuterArmorAbductor
  inhand:
  - Wonderprod

- type: entity
  name: abductor agent spawner
  id: SpawnPointAbductorAgent
  parent: MarkerBase
  components:
  - type: SpawnPoint
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
      - state: green
      - sprite: Structures/Wallmounts/signs.rsi
        state: radiation

- type: entity
  categories: [ HideSpawnMenu, Spawner ]
  parent: BaseAntagSpawner
  id: AbductorAgentSpawner
  components:
  - type: GhostRole
    name: abductora-ghost-role-name
    description: abductora-ghost-role-desc
    rules: abductors-ghost-role-rules
    important: true # SL
    mindRoles:
    - MindRoleLoneAbductor
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
      - state: green
      - sprite: Structures/Wallmounts/signs.rsi
        state: radiation

- type: entity
  name: abductor scientist spawner
  id: SpawnPointAbductorScientist
  parent: MarkerBase
  components:
  - type: SpawnPoint
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
      - state: green
      - sprite: Structures/Wallmounts/signs.rsi
        state: radiation

- type: entity
  categories: [ HideSpawnMenu, Spawner ]
  parent: BaseAntagSpawner
  id: AbductorScientistSpawner
  components:
  - type: GhostRole
    name: abductors-ghost-role-name
    description: abductors-ghost-role-desc
    rules: abductors-ghost-role-rules
    important: true # SL
    mindRoles:
    - MindRoleLoneAbductor
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
      - state: green
      - sprite: Structures/Wallmounts/signs.rsi
        state: radiation
