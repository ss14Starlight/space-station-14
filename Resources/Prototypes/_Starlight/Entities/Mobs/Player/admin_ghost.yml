- type: entity
  parent: BaseAGhostAction
  id: ActionToggleAGhostHide
  name: Toggle visibility for others
  description: Hides your ghost from all other non-admin ghosts.
  components:
    - type: Action
      icon: { sprite: Mobs/Ghosts/ghost_human.rsi, state: icon }
      priority: 8
    - type: InstantAction
      event: !type:ToggleAGhostHideEvent

- type: entity
  parent: BaseAGhostAction
  id: ActionToggleAGhostAdminOverlay
  name: Toggle Admin Overlay
  description: Toggles the admin overlay.
  components:
    - type: Action
      icon: { sprite: _Starlight/Clothing/Eyes/Hud/centcomm.rsi, state: icon }
      clientExclusive: true # Flickers due to prediction without this
      priority: 8
    - type: InstantAction
      event: !type:ToggleAGhostAdminOverlayEvent
