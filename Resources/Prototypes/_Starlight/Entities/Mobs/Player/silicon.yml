        - CentcommLaserModule
        - CentcommBulwarkModule
        - CentcommModuleSpaceMovement
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
