- type: entity
  parent: BaseMobDragon
  id: MobDragonClown
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Aliens/Carps/clowndragon.rsi
    noRot: true
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: alive-unshaded
      shader: unshaded
  - type: Dragon
    spawnRiftAction: ActionSpawnRift
  - type: GhostRole
    mindRoles:
    - MindRoleDragon
  - type: Butcherable
    spawned:
    - id: FoodCakeClown
      amount: 1
  - type: ActionGun
    action: ActionDragonsBreath
    gunProto: DragonsBreathGun
  - type: GuideHelp
    guides:
    - MinorAntagonists
  - type: Damageable
    damageModifierSet: DragonResistances
