# Shared cold tolerance for dogs (corgis, MobFox, MobMcGriff, MobWalter).
- type: entity
  abstract: true
  id: MobDogColdResistant
  components:
  - type: TemperatureDamage
    coldDamageThreshold: 230
  - type: TemperatureProtection
    coolingCoefficient: 0.8

# Shared identity system for dogs (corgis, MobFox, MobMcGriff, MobWalter).
- type: entity
  abstract: true
  id: MobDogIdentity
  components:
  - type: Identity
  - type: IdExaminable
  - type: AnimalIdentity
