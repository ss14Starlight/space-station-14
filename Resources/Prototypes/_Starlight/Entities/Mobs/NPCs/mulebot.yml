- type: entity
  parent: MobSiliconBase
  id: MobMulebot
  name: MULEbot
  description: A boxy cargo robot that hauls one crate at a time to wherever it's sent, then trundles home.
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Silicon/Bots/mulebot.rsi
    noRot: true
    layers:
    - state: off
      map: [ "enum.MuleVisuals.Flash" ]
    - state: hatch
      map: [ "hatch" ]
      visible: false
    - state: emagged
      map: [ "enum.MuleVisuals.Emagged" ]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MuleVisuals.Flash:
        enum.MuleVisuals.Flash:
          True: { state: on }
          False: { state: off }
      enum.MuleVisuals.Emagged:
        enum.MuleVisuals.Emagged:
          True: { visible: true }
          False: { visible: false }
      enum.WiresVisuals.MaintenancePanelState:
        hatch:
          True: { visible: true }
          False: { visible: false }
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 100
        # Not MidImpassable, so plastic flaps let it through.
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        layer:
        - MobLayer
  - type: Mule
    whitelist:
      tags:
      - Crate
    entranceAccess:
    - Medical
    - Chemistry
    - Research
    - Engineering
    - Atmospherics
    - Bar
    - Kitchen
    - Hydroponics
    - Service
    - Janitor
    - Theatre
    - Chapel
    - Lawyer
    - Salvage
  - type: Access
    tags:
    - Cargo
    - Maintenance
    - Robotics
  - type: AccessReader
    access: [["Cargo"], ["Robotics"]]
  - type: PointLight
    radius: 3
    energy: 0.8
    color: "#ffcc99"
  - type: Repairable
    damageValue: -10
    doAfterDelay: 1
    fuelCost: 0.5
  - type: ActivatableUI
    key: enum.MuleUiKey.Key
    requireActiveHand: false
  - type: ActivatableUIRequiresAccess
  - type: UserInterface
    interfaces:
      enum.MuleUiKey.Key:
        type: MuleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: WiresPanel
  - type: LockedWiresPanel
  - type: Lock
    unlockOnClick: false
  - type: Wires
    boardName: wires-board-name-mulebot
    layoutId: Mulebot
    alwaysRandomize: true
  # Riders, once the load check wire is cut.
  - type: Strap
    enabled: false
    buckleOffset: "0,0.35"
  - type: ContainerContainer
    containers:
      mule_load: !type:ContainerSlot
      cell_slot: !type:ContainerSlot
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
  - type: HTN
    rootTask:
      task: MulebotCompound
    blackboard:
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.2
    baseSprintSpeed: 2.2
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
    stateAlertDict:
      Alive: BorgHealth
      Dead: BorgDead
    showOverlays: false
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Mulebot
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:EmptyContainersBehaviour
        containers:
        - mule_load
      - !type:SpawnEntitiesBehavior
        spawn:
          EffectSparks:
            min: 1
            max: 1
          LeftArmBorg:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
