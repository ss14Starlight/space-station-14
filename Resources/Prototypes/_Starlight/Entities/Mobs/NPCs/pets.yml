- type: entity
  parent: BaseMob
  id: MobAvaliDrone
  components:
  - type: Reactive
    groups:
      Acidic: [Touch]
  - type: Damageable
    damageContainer: Inorganic
  - type: MovedByPressure
  - type: Physics
    bodyType: KinematicController # Same for all inheritors
  - type: MobState
    allowedStates:
      - Alive
      - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Tag
    tags:
    - DoorBumpOpener
    - SiliconEmotes
    - Unimplantable
    - StunImmune
  - type: Body
    prototype: Bot
  - type: LanguageKnowledge
    speaks:
    - GalacticCommon
    - Scratch
    understands:
    - GalacticCommon
    - Scratch
  - type: Pullable
  - type: Emoting
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: TypingIndicator
    proto: robot
  - type: Vocal
    sounds:
      Unsexed: UnisexSilicon
  - type: ZombieImmune
  - type: HTN
    rootTask:
      task: IdleCompound
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Effects/chime.ogg
      params:
        volume: -4

- type: entity
  parent: MobAvaliDrone
  id: MobGDrone
  name: V.E.S.T.A.
  description: Virtual Engineering Specialized Technician Assistant, provides a small amount of light, and recharges power cells.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Starlight/Mobs/Pets/gdrone.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: drone
  - type: Item
    size: Normal
    heldPrefix: 1
  - type: Clothing
    quickEquip: false
    sprite: _Starlight/Mobs/Pets/gdrone.rsi
    equippedPrefix: 0
    slots:
    - NECK
  - type: ProtectedFromStepTriggers
  - type: Charger
    slotId: charger_slot
    portable: true
  - type: ItemSlots
    slots:
      charger_slot:
        ejectOnInteract: true
        whitelist:
          components:
          - PowerCell
          - PowerCellSmall
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: Battery
    maxCharge: 600
    startingCharge: 600
  - type: BatterySelfRecharger
    autoRechargeRate: 2
  - type: ToggleableVisuals
    spriteLayer: light
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    autoRot: true
    netsync: false
    radius: 4
    energy: 2
  - type: HandheldLight
    wattage: 0.50
    addPrefix: true
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        id: radiating
        interpolate: Linear
        maxDuration: 2.0
        startValue: 3.0
        endValue: 2.0
        isLooped: true
        reverseWhenFinished: true
      - !type:PulseBehaviour
        id: blinking
        interpolate: Nearest
        maxDuration: 1.0
        startValue: 0.1
        endValue: 2.0
        isLooped: true

- type: entity
