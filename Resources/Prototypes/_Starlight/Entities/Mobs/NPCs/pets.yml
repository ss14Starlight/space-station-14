  - type: SpriteMovement
    movementLayers:
      movement:
        state: mouse-moving-mentor
    noMovementLayers:
      movement:
        state: mouse-mentor
  - type: DamageStateVisuals
    states:
      Alive:
        Base: mouse-mentor
      Critical:
        Base: dead-mentor
      Dead:
        Base: splat-mentor
  - type: Item
    size: Tiny
    heldPrefix: 2
  - type: Clothing
    quickEquip: false
    sprite: _Starlight/Mobs/Animals/mouse_special.rsi #SL Edit
