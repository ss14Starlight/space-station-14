# Immortal Roach from Funky, moved here since we're tweaking it
- type: entity
  name: hardened roach
  parent: MobCockroach
  id: ImmortalRoach
  description: With an extremely robust carapace this foul creature is considered neigh invulnerable. Spacing is recommended.
  components:
  - type: Sprite
    drawdepth: SmallMobs
    sprite: Mobs/Animals/cockroach.rsi
    color: "#e6e6e6"
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: cockroach
      color: "#e6e6e6"
  - type: Item
    size: Tiny
  - type: HTN
    constantlyReplan: false
    rootTask:
      task: MouseCompound
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: InsectBlood
        Quantity: 40
  - type: Hunger
    baseDecayRate: 0.25
  - type: MobState
  - type: Godmode
  - type: MovementSpeedModifier
    baseWalkSpeed : 0.7
    baseSprintSpeed : 1

