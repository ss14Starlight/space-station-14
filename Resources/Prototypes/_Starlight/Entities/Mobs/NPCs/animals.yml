- type: entity
  parent: MobCorgiSmart
  id: MobCorgiSmartNoGalcom
  suffix: Speech Limited
  components:
  - type: LanguageKnowledge
    speaks:
    - Dog
    understands:
    - Dog
    - Canilunzt
    - GalacticCommon
- type: entity
  parent: MobCorgiSmartNoGalcom
  id: MobCorgiSmartGhostrole
  suffix: Speech Limited, Ghostrole
  components:
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-smartcorgi-name
    description: ghost-role-information-smartcorgi-description
  - type: GhostTakeoverAvailable

- type: entity
  name: advanced genetic ancestor
  id: MobBaseAncestorAdvanced
  parent: MobBaseAncestor # Starlight Edit: Removed BaseMobAnimal
  description: The genetic bipedal ancestor of... Uh... Something. Yeah, there's definitely something on the station that descended from whatever this is.
  abstract: true
  components:
  # Starlight-start: Languages
  - type: LanguageKnowledge
    speaks:
    - Ancestor
    understands:
    - GalacticCommon
    - Ancestor
  # Starlight-end
  - type: CombatMode
    canDisarm: true
  - type: Inventory
    templateId: monkey
    speciesId: monkey
  # Starlight Start
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Animals/displacements.rsi
            state: jumpsuit-monkey
      belt:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Animals/displacements.rsi
            state: belt-monkey
      gloves:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Animals/displacements.rsi
            state: hand-monkey
  # Starlight End
  - type: Deathgasp
    prototype: MonkeyDeathgasp
  - type: Cuffable
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Stripping
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: monkey
      sprite: Mobs/Animals/monkey.rsi
    - map: [ "jumpsuit" ]
    - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
    - map: [ "ears" ]
    - map: [ "id" ]
    - map: [ "outerClothing" ]
    - map: [ "mask" ]
    - map: [ "head" ]
    - map: [ "clownedon" ]
      sprite: "Effects/creampie.rsi"
      state: "creampie_human"
      visible: false
  - type: Hands
    # Starlight edit Start: Reverted NuBody
    # activeHandId: Hand
    # hands:
    #   Hand:
    #     location: Left
    # Starlight edit End: Reverted NuBody
  - type: ComplexInteraction
  - type: GenericVisualizer
    visuals:
      enum.CreamPiedVisuals.Creamed:
        clownedon:
          True: {visible: true}
          False: {visible: false}
  # Starlight - start
  - type: Body
    prototype: Primate
    requiredLegs: 1 # TODO: More than 1 leg
  # Starlight - end
  - type: CreamPied
  - type: FireVisuals
    sprite: Mobs/Effects/onfire.rsi
    normalState: Monkey_burning
  - type: InteractionPopup
    successChance: 0.9
    interactSuccessString: petting-success-monkey
    interactFailureString: petting-failure-monkey
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/ferret_happy.ogg
    interactFailureSound:
      path: /Audio/Items/wirecutter.ogg
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 30
    animation: WeaponArcBite
    damage:
      types:
        Blunt: 3
        Piercing: 3
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeat
      amount: 3
  - type: Puller
    needsHands: false
  - type: CanHostGuardian
  - type: NPCRetaliation
    attackMemoryLength: 10
  - type: FactionException
  - type: NpcFactionMember
    factions:
      - Passive
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: IdExaminable
  - type: Tag
    tags:
    - VimPilot
    - DoorBumpOpener
    - AnomalyHost
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
    reactions:
    - reagents: [ Water, SpaceCleaner ]
      methods: [ Touch ]
      effects:
      - !type:WashCreamPie
  - type: Crawler
  - type: StatusIcon
  - type: CosmicCenserTarget # Stellar - Cosmic Cult
