- type: entity
  id: SimpleDarkMobBase
  parent: [SimpleSpaceMobBaseTemplate, MobAtmosStandard]
  abstract: true
  components:
    - type: TheDarkImmune
    - type: FirelockOpener
    - type: NightVision
    - type: MobPrice
      price: 10000 # Quite rare animals!
    - type: Deathgasp
      damageType: Bloodloss
    - type: TypingIndicator
      proto: alien
    - type: Body
      prototype: DarkAnimal
    - type: Bloodstream
      bloodReferenceSolution:
        reagents:
          - ReagentId: DarkBlood
            Quantity: 50

- type: entity
  name: Jil
  parent: [SimpleDarkMobBase, SolutionVermin, BaseSpeciesPickupable]
  id: MobJil
  description: A fluffy thieving creature that wanders the dark.
  components:
    - type: MessyDrinker
    - type: FootprintOwner
    - type: VentCrawler
    - type: LanguageKnowledge
      speaks:
        - Jil
      understands:
        - GalacticCommon
        - Jil
        - Marish
    - type: Scent
    - type: GhostRole
      makeSentient: true
      allowSpeech: true
      allowMovement: true
      name: ghost-role-information-jil-name
      description: ghost-role-information-jil-description
      rules: ghost-role-information-freeagent-rules
      mindRoles:
        - MindRoleGhostRoleCritterHarmless
    - type: GhostTakeoverAvailable
    - type: Speech
      speechSounds: Merp
      speechVerb: SmallMob
    - type: Sprite
      sprite: _Starlight/Mobs/Animals/jil.rsi
      layers:
        - map: ["enum.DamageStateVisualLayers.Base"]
          state: jil
    - type: Puller
      needsHands: false
    - type: VampireDevourable
    - type: NPCRetaliation
      attackMemoryLength: 10
    - type: QuoremCheck
      packTag: Jil
      quoremThreshold: 10
      quoremSound: /Audio/Effects/chime.ogg
      quoremEffect: "Exclamation"
      quoremFaction: AllHostile
    - type: HTN
      constantlyReplan: false
      rootTask:
        task: SimpleHostileCompound
      blackboard:
        NavClimb: !type:Bool false
        NavInteract: !type:Bool true
    - type: NpcFactionMember
      factions:
        - Passive
    - type: MeleeWeapon
      soundHit:
        path: /Audio/Effects/bite.ogg
      angle: 0
      animation: WeaponArcBite
      damage:
        types:
          Piercing: 3
    - type: Physics
    - type: MobState
    - type: Deathgasp
    - type: MobStateActions
      actions:
        Critical:
          - ActionCritSuccumb
          - ActionCritFakeDeath
          - ActionCritLastWords
    - type: MobThresholds
      thresholds:
        0: Alive
        10: Critical
        20: Dead
    - type: DamageStateVisuals
      states:
        Alive:
          Base: jil
        Critical:
          Base: jil_splat
        Dead:
          Base: jil_dead
    - type: Vocal
      sounds:
        Male: Jil
        Female: Jil
        Unsexed: Jil
      wilhelmProbability: 0.001
    - type: Tag
      tags:
        - VimPilot
        - DoorBumpOpener
        - Jil

- type: entity
  name: Jillioth
  parent: [MobJil, BaseSpeciesPickupableHuge]
  id: MobJilBig
  description: Here to collect.
  components:
    - type: Sprite
      layers:
        - map: ["enum.DamageStateVisualLayers.Base"]
          state: jil_big
    - type: Speech
      speechVerb: LargeMob
    - type: MobThresholds
      thresholds:
        0: Alive
        250: Critical
        300: Dead
    - type: DamageStateVisuals
      states:
        Alive:
          Base: jil_big
        Critical:
          Base: jil_big_splat
        Dead:
          Base: jil_big_dead
    - type: MeleeWeapon
      soundHit:
        path: /Audio/Effects/bite.ogg
      angle: 0
      animation: WeaponArcBite
      damage:
        types:
          Piercing: 10
    - type: Tag
      tags:
        - DoorBumpOpener
        - Jil

- type: entity
  name: Jillilah
  parent: MobJil
  id: MobJilPetCargo
  description: When you stare deep in her beady little eyes, you can feel an intense desire to declare independence...
  components:
    - type: Sprite
      layers:
        - map: ["enum.DamageStateVisualLayers.Base"]
          state: jil_cargo
    - type: DamageStateVisuals
      states:
        Alive:
          Base: jil_cargo
        Critical:
          Base: jil_cargo_splat
        Dead:
          Base: jil_cargo_dead
    - type: NpcFactionMember
      factions:
        - PetsNT
    - type: QuoremCheck
      defaultFaction: PetsNT
    - type: Tag
      tags:
        - VimPilot
        - DoorBumpOpener
        - Jil
        - CannotSuicide

- type: entity
  name: Jilly-bean
  parent: MobJil
