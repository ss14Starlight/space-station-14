# Applied to the real detached part with AddComponents, preserving its sprite and anatomy.
- type: entity
  abstract: true
  id: ChangelingFragmentBase
  parent: [BaseMob, MobDamageable, MobCombat]
  components:
  - type: ChangelingColonyMember
    isFragment: true
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions: [AllHostile]
  - type: MeleeWeapon
    hidden: true
    angle: 0
    animation: WeaponArcBite
    soundHit:
      collection: AlienClaw
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 3.5
  - type: StandingState

- type: entity
  categories: [HideSpawnMenu]
  id: ChangelingFragmentLimb
  parent: [ChangelingFragmentBase, MobBloodstream]
  components:
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: BloodChangeling
        Quantity: 40
  - type: ChangelingDevour
    changelingDevourAction: ActionChangelingPossess
  - type: MeleeWeapon
    damage:
      types:
        Slash: 8

- type: entity
  categories: [HideSpawnMenu]
  id: ChangelingFragmentSmall
  parent: ChangelingFragmentLimb
  components:
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: BloodChangeling
        Quantity: 10
  - type: MobThresholds
    thresholds:
      0: Alive
      20: Dead
  - type: MeleeWeapon
    damage:
      types:
        Slash: 3
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 5
  - type: VentCrawler
  - type: CanEscapeInventory

- type: entity
  categories: [HideSpawnMenu]
  id: ChangelingFragmentHead
  parent: ChangelingFragmentLimb
  components:
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: BloodChangeling
        Quantity: 30
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Dead
  - type: MeleeWeapon
    damage:
      types:
        Slash: 10
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 3

- type: entity
  categories: [HideSpawnMenu]
  id: ChangelingFragmentTorso
  parent: ChangelingFragmentLimb
  components:
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: BloodChangeling
        Quantity: 80
  - type: MobThresholds
    thresholds:
      0: Alive
      90: Dead
  - type: MeleeWeapon
    damage:
      types:
        Slash: 14
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.8
    baseSprintSpeed: 2.5

- type: entity
  id: MobChangelingBlood
  name: living blood
  description: A drop of blood that is moving on its own.
  parent: ChangelingFragmentBase
  components:
  - type: ChangelingColonyMember
    isBlood: true
  - type: Sprite
    sprite: _Starlight/Effects/blood.rsi
    state: splatter1
    scale: 0.4, 0.4
  - type: MobThresholds
    thresholds:
      0: Alive
      4: Dead
  - type: MeleeWeapon
    damage:
      types:
        Slash: 1
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.1
        density: 10
        mask: [SmallMobMask]
        layer: [SmallMobLayer]
  - type: TimedDespawn
    lifetime: 45
