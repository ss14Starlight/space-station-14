- type: entity
  parent: [BaseMobSpeciesOrganic, BaseSpeciesPickupableHuge]
  id: BaseMobDoll
  abstract: true
  components:
  - type: LanguageKnowledge
    speaks:
    - GalacticCommon
    - Darktongue
    understands:
    - GalacticCommon
    - Darktongue
  - type: Absorbable
  - type: Hunger
  - type: Icon
    sprite: _Starlight/Mobs/Species/Doll/parts.rsi
    state: doll
  - type: Thirst
  - type: Butcherable
    spawned:
    - id: FoodMeatAnomaly # Actual anomaly meat, since players probably won't be butchered too often. Yes, that does mean Dolls do not have "people" meat.
      amount: 5
    - id: SheetPlasteel1
      amount: 5
  - type: HumanoidAppearance
    species: Doll
    hideLayersOnEquip:
    - Hair
    - Snout
  - type: Body
    prototype: Doll
    requiredLegs: 2
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Doll
  - type: Vocal
    sounds:
      Male: MaleHuman
      Female: FemaleHuman
      Unsexed: FemaleHuman
  - type: Inventory
    speciesId: Doll
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: Shell
    generateShellPieceAction: ActionGenerateShellPiece

- type: entity
  parent: [BaseMobSpeciesOrganic, BaseSpeciesPickupableHuge]
  id: BaseMobDollFresh
  description: Where did that shell come from? It is all soft and spongy...
  abstract: true
  components:
  - type: LanguageKnowledge
    speaks:
    - GalacticCommon
    - Darktongue
    understands:
    - GalacticCommon
    - Darktongue
  - type: Absorbable
  - type: Hunger
  - type: Icon
    sprite: _Starlight/Mobs/Species/Doll/parts.rsi
    state: doll
  - type: Thirst
  - type: Butcherable
    spawned:
    - id: FoodMeatAnomaly # Actual anomaly meat, since players probably won't be butchered too often. Yes, that does mean Dolls do not have "people" meat.
      amount: 5
    - id: SheetPlasteel1
      amount: 5
  - type: HumanoidAppearance
    species: Doll
    hideLayersOnEquip:
    - Hair
    - Snout
    allowProfileOverride: false
    customSpecieName: "Creature of Flesh"
    sex: Unsexed
    eyeColor: '#FF0000'
    skinColor: '#FFFFFF'
    eyeGlowing: true
    markingSet:
        markings:
          Arms:
            - markingId: DollShellLArmSegmented
              visible: True
              isGlowing: False
              markingColor:
                - '#FFFFFF'
            - markingId: DollShellRArmSegmented
              visible: True
              isGlowing: False
              markingColor:
                - '#FFFFFF'
            - markingId: DollShellLHandSegmented
              visible: True
              isGlowing: False
              markingColor:
                - '#FFFFFF'
            - markingId: DollShellRHandSegmented
              visible: True
              isGlowing: False
              markingColor:
                - '#FFFFFF'
          Legs:
            - markingId: DollShellLLegSegmented
              visible: True
              isGlowing: False
              markingColor:
                - '#FFFFFF'
            - markingId: DollShellRLegSegmented
              visible: True
              isGlowing: False
              markingColor:
                - '#FFFFFF'
            - markingId: DollShellLFootSegmented
              visible: True
              isGlowing: False
              markingColor:
                - '#FFFFFF'
            - markingId: DollShellRFootSegmented
              visible: True
              isGlowing: False
              markingColor:
                - '#FFFFFF'
          Head:
            - markingId: DollShellHeadSegmented
              visible: True
              isGlowing: False
              markingColor:
                - '#FFFFFF'
          Chest:
            - markingId: DollShellChestSegmented
              visible: True
              isGlowing: False
              markingColor:
                - '#FFFFFF'
  - type: Body
    prototype: DollFresh
    requiredLegs: 2
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Doll
  - type: Vocal
    sounds:
      Male: MaleHuman
      Female: FemaleHuman
      Unsexed: FemaleHuman
  - type: Inventory
    speciesId: Doll
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: Shell
    generateShellPieceAction: ActionGenerateShellPiece

- type: entity
