- type: entity
  save: false
  name: Urist McRat
  parent: [BaseMobSpeciesOrganic, BaseSpeciesPickupable]
  id: BaseMobRodentia
  abstract: true
  components:
  - type: LanguageKnowledge
    speaks:
    - GalacticCommon
    - Squeakish
    understands:
    - GalacticCommon
    - Squeakish
    - Mouse
  - type: Absorbable
  - type: Hunger
  - type: Icon
    sprite: _Starlight/Mobs/Species/Rodentia/parts.rsi
    state: rodentia
  - type: Body
    prototype: Rodentia
    requiredLegs: 2
  - type: Thirst
  - type: MouthStorage
    mouthProto: CheekStorage
    openStorageAction: ActionOpenMouthStorage
    spitDamageThreshold: 3
  - type: Butcherable
    butcheringType: Spike
    spawned:
      - id: FoodMeat
        amount: 3
  - type: MobThresholds
    thresholds:
      0: Alive
      85: Critical
      170: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      51: 0.7  #Basicly 60% and 80%
      68: 0.5
  - type: HumanoidAppearance
    species: Rodentia
    hideLayersOnEquip:
    - Hair
    - HeadTop
    - HeadSide
    - Snout
#    markingsDisplacement:
#      Hair:
#        sizeMaps:
#          32:
#            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
#            state: hair
  - type: TypingIndicator
    proto: rodentia
  - type: Speech
    speechVerb: Rodentia
    speechSounds: Squeak
    allowedEmotes: ['Squeak']
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 110
        restitution: 0.0
        mask:
          - MobMask
        layer:
          - MobLayer
#  - type: Sprite
#    netsync: false
#    noRot: true
#    drawdepth: Mobs
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Vocal
    sounds:
      Male: MaleRodentia
      Female: FemaleRodentia
      Unsexed: MaleRodentia
  - type: Hands
    leftHandDisplacement:
      sizeMaps:
        32:
          sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
          state: inHand
    rightHandDisplacement:
      sizeMaps:
        32:
          sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
          state: inHand
  - type: Inventory
    speciesId: rodentia
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: jumpsuit
      eyes:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: eyes
      gloves:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: hands
      head:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: head
      back:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: back
      ears:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: ears
      mask:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: mask
      outerClothing:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
