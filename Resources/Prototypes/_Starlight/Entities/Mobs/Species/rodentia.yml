      - CanPilot
      - FootstepSound
      - DoorBumpOpener
      - AnomalyHost
      - Rodentia
      - NotLabelable
  - type: Item
    size: Huge
    allowDirectHandPickup: false
    shape:
      - 0, 0, 5, 3
  - type: VisualPickupable
    offsetFront: -0.16, -0.12
    offsetBack: -0.16, 0.05
