- type: entity
  parent: BaseAction
  id: ActionOpenStomachStorage
  name: Stomach Storage
  description: Opens your built-in stomach storage.
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -11
    raiseOnUser: true
    icon:
      sprite: _Starlight/Interface/Actions/scurret.rsi
      state: stomach
  - type: InstantAction
    event: !type:OpenStorageImplantEvent

- type: entity
  save: false
  name: Urist McWawa
  parent: [BaseMobSpeciesOrganic, BaseSpeciesPickupableHuge]
  id: BaseMobScurret
  abstract: true
  components:
  - type: LanguageKnowledge
    speaks:
    - ScurretSign
    understands:
    - GalacticCommon
    - ScurretSign
  - type: Absorbable
  - type: Hunger
  - type: Icon
    sprite: _Starlight/Mobs/Species/Scurret/parts.rsi
    state: full
  - type: Storage
    clickInsert: false
    showVerb: false
    openOnActivate: false
    grid:
    - 0,0,1,2
    maxItemSize: Large
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Thirst
  - type: ScurretWater
  - type: MobThresholds
    thresholds:
      0: Alive
      90: Critical
      180: Dead
  - type: StomachStorage
  - type: Body
    prototype: Scurret
    requiredLegs: 2
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: Speech
    speechVerb: Wawa
    speechSounds: Wawa
    allowedEmotes: ["Thump", "LagomorphStomp"]
  - type: Vocal
    sounds:
      Male: Scurret
      Female: Scurret
      Unsexed: Scurret
  - type: TypingIndicator
    proto: moth
  - type: BodyEmotes
    soundsId: ScurretBodyEmotes
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 30
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 10
  - type: MovementSpeedModifier
    baseWalkSpeed: 5
    baseSprintSpeed: 7
  - type: Puller
    ignorePullingSlowdown: true
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - CanPilot
    - AnomalyHost
    - NotLabelable
  - type: Sprite
    layers:
    - map: [ "enum.HumanoidVisualLayers.Chest" ]
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]
    - map: [ "enum.HumanoidVisualLayers.UndergarmentBottom" ]
    - map: [ "enum.HumanoidVisualLayers.UndergarmentTop" ]
    - map: [ "jumpsuit" ]
    - map: [ "enum.HumanoidVisualLayers.LFoot" ]
    - map: [ "enum.HumanoidVisualLayers.RFoot" ]
    - map: [ "enum.HumanoidVisualLayers.LHand" ]
    - map: [ "enum.HumanoidVisualLayers.RHand" ]
    - map: [ "gloves" ]
    - map: [ "shoes" ]
    - map: [ "ears" ]
    - map: [ "eyes" ]
    - map: [ "outerClothing" ]
    - map: [ "belt" ]
    - map: [ "id" ]
    - map: [ "back" ]
    - map: [ "neck" ]
    - map: [ "enum.HumanoidVisualLayers.SnoutCover" ]
    - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
    - map: [ "enum.HumanoidVisualLayers.Hair" ]
    - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
    - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
    - map: [ "enum.HumanoidVisualLayers.Tail" ]
    - map: [ "mask" ]
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]
    - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
  - type: DamageVisuals
    thresholds: [ 10, 30, 50, 70 ]
    targetLayers:
    - "enum.HumanoidVisualLayers.Chest"
    - "enum.HumanoidVisualLayers.Head"
    - "enum.HumanoidVisualLayers.LArm"
    - "enum.HumanoidVisualLayers.LLeg"
    - "enum.HumanoidVisualLayers.RArm"
    - "enum.HumanoidVisualLayers.RLeg"
    damageOverlayGroups:
      Brute:
        sprite: _Starlight/Mobs/Effects/Rodentia/brute_damage.rsi
        color: "#CC0000"
      Burn:
        sprite: _Starlight/Mobs/Effects/Rodentia/burn_damage.rsi
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: HumanoidAppearance
    species: Scurret
    hideLayersOnEquip:
    - Hair
    - HeadTop
    - HeadSide
    - Snout
    allowProfileOverride: false
    customSpecieName: species-custom-name-scurret
    sex: Unsexed
    eyeColor: '#FF0000'
    skinColor: '#FFFFFF'
    eyeGlowing: true

- type: species
