- type: entity
  save: false
  name: Urist McHandster the Neo-Dwarf
  parent: [BaseSpeciesPickupable, BaseMobNeocyte]
  id: BaseMobNeoDwarf
  abstract: true
  components:
  - type: LanguageKnowledge
    speaks:
    - GalacticCommon
    - Machine
    - Grumbakul
    understands:
    - GalacticCommon
    - Machine
    - Grumbakul
  - type: MobThresholds
    thresholds:
      0: Alive
      110: Critical
      220: Dead
  - type: Icon
    sprite: _FarHorizons/Mobs/Species/Proto-Humie/parts.rsi
    state: full
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: Damageable
    damageContainer: Hybrid
    damageModifierSet: NeoDwarf
    displacement: Dwarfism
  - type: Body
    prototype: NeoDwarf
    requiredLegs: 2
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        # they r smaller
        density: 120
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: ReplacementAccent
    accent: dwarf
  - type: HumanoidAppearance
    species: NeoDwarf
    hideLayersOnEquip:
    - Hair
    - Snout
  - type: CreamPied
    displacement: Dwarfism
  - type: Flammable
    displacement: Dwarfism
  - type: InnerBodyAnomalyVisuals
    displacement: Dwarfism
  - type: Inventory
    templateId: neocyte
    femaleDisplacements: { }
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: dwarfism
