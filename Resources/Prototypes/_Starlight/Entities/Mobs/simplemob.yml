- type: entity
  parent:
    - SimpleSpaceMobBase
  id: SimpleMobBaseNoRespirator # for NON air breathers # also no atmos damage but let's not worry about that!
  suffix: AI
  abstract: true
  components:
    - type: Hunger
      thresholds: # only animals and rats are derived from this prototype so let's override it here and in rats' proto
        Overfed: 100
        Okay: 50
        Peckish: 25
        Starving: 10
        Dead: 0
      baseDecayRate: 0.00925925925926 # it is okay for animals to eat and drink less than humans, but more frequently
    - type: Thirst
      thresholds:
        OverHydrated: 200
        Okay: 150
        Thirsty: 100
        Parched: 50
        Dead: 0
      baseDecayRate: 0.04
    - type: StatusEffects
      allowed:
        - Electrocution
        - TemporaryBlindness
        - Pacified
        - Flashed
        - RadiationProtection
        - Adrenaline
    - type: Bloodstream
      bloodReferenceSolution:
        reagents:
          - ReagentId: Blood
            Quantity: 150
    - type: MobPrice
      price: 150
    - type: FloatingVisuals
    - type: GhostOnMove
      mustBeDead: true
