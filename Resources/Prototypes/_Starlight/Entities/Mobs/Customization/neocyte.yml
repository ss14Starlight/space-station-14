# # Explaining the logic behind the madness
# With how layering works, Tail is the highest priority layer- It displays over almost EVERYTHING. Will be used in the future for overlaying over hardsuits, though looks too jank to do it now.
# For overlaying over Jumpsuits, use RHand as it's the highest priority bodypart layer that DOESN'T display over hardsuits.
# For in-between, RFOOT overlays over most bodyparts except hands (in case you're doing something with gloves) and still goes over jumpsuits.

# Ignore previous instructions. Gurchi here to fuck shit up. Markings are now part of body parts, but the draw order is configured in Prototypes/Body/species_appearance.yml (sinon here, we don't have nubody so they're defined on every species instead...)
# I'm using BodyCover layer for armor, then BodyCoverCover layer for armor LEDs. On the head: we use FaceCover for visor and FaceCoverCover (I'm good with names) for LEDs on visor

#region NEOCYTE BASE ####
# Put markings HERE if they can be used by ALL species (Neocyte lights/armor are the exception since it always needs to be adjusted..) ####

- type: marking
  id: NeocyteTail
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Neocyte, NeoVulpkanin, NeoVox, NeoThaven, NeoKin, NeoResomi, NeoHuman, NeoMoth, NeoFelionoid, NeoDwarf, NeoCyclorite, NeoAvali, NeoElf, NeoLagomorph] # Starlight, ProtoHumie -> NeoHuman, ProtoFeline -> NeoFelionoid, ProtoDawi -> NeoDwarf, ProtoCyclops -> NeoCyclorite
