# Gene splicing from early Lagomorph?
- type: marking
  id: HumanLagomorphEarsTall
  bodyPart: HeadTop
  markingCategory: HeadTop
  speciesRestriction: [Human, NeoHuman, Neocyte]
  coloring:
    default:
      type:
        !type:CategoryColoring
          category: Hair
      fallbackTypes:
        - !type:SkinColoring
    layers:
      ears_cat_inner:
        type:
          !type:SimpleColoring
            color: "#FFFFFF"
  sprites:
    body_headTop@0:
      sprite:
        sprite: _Starlight/Mobs/Customization/lagomorph.rsi
        state: tall_ears_outer
      colorSource: UniqueColor
    body_headTop@1:
      sprite:
        sprite: _Starlight/Mobs/Customization/lagomorph.rsi
        state: tall_ears_inner
      colorSource: UniqueColor

