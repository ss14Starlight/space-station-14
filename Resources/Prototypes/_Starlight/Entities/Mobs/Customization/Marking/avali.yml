# Base Markings

- type: marking
  id: AvaliEarsBase
  bodyPart: HeadSide
  markingCategory: HeadSide
  # followSkinColor: true
  forcedColoring: true
  speciesRestriction: [ Avali ]
  # Starlight start
  sprites:
    body_headSide@0:
      sprite:
        sprite: _Starlight/Mobs/Customization/Avali/avali_parts.rsi
        state: ears_avalibase_primary
      colorSource: UniqueColor
    body_headSide@1:
      sprite:
        sprite: _Starlight/Mobs/Customization/Avali/avali_parts.rsi
        state: ears_avalibase_secondary
      colorSource: UniqueColor
  # Starlight end

