# HEAD

## EARS

- type: marking
  id: RodentiaHeadTopEarMouse # Default ear marking.
  markingCategory: HeadTop
  bodyPart: HeadTop
  speciesRestriction: [Rodentia]
  coloring:
    layers:
      mouse:
        type: !type:TattooColoring
  sprites:
    body_headTop@0:
      sprite:
        sprite: _Starlight/Mobs/Customization/Rodentia/ear_markings.rsi
        state: mouse
      colorSource: UniqueColor
    body_headTop@1:
