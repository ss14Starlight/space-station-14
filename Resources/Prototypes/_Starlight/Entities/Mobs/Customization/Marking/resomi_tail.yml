# Tail Markings
- type: marking
  id: ResomiTailFeathered # This is the default tail for Resomi that comes with feathers.
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Resomi, NeoResomi]
  sprites:
    body_tail@0:
      sprite:
        sprite: _Starlight/Mobs/Customization/Resomi/resomi_tail_markings.rsi
        state: tail
      colorSource: ResomiSkinColor
    body_tail@1:
      sprite:
        sprite: _Starlight/Mobs/Customization/Resomi/resomi_tail_markings.rsi
        state: tail_feathers
      colorSource: UniqueColor

