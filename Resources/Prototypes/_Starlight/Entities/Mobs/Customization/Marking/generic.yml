# Head
- type: marking
  id: HeadHeavyTattoos
  bodyPart: Head
  markingCategory: Head
  speciesRestriction: [Human, Dwarf, Arachnid, SlimePerson, Reptilian, Elf]
  coloring:
    default:
      type:
        !type:TattooColoring
      fallbackColor: "#666666"
  # Starlight start
  sprites:
    body_head@0:
      sprite:
        sprite: _Starlight/Mobs/Customization/Generic/head.rsi
        state: head_heavy1
      colorSource: UniqueColor
    body_head@1:
      sprite:
        sprite: _Starlight/Mobs/Customization/Generic/head.rsi
        state: head_heavy2
      colorSource: UniqueColor
  # Starlight end

