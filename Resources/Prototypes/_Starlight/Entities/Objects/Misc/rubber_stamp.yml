# NT stamps
- type: entity
  name: magistrate stamp
  parent: [ RubberStampBase, BaseCommandContraband ]
  id: RubberStampMagistrate
  description: A rubber stamp for stamping important documents. Your word is law. This stamp is order.
  suffix: DO NOT MAP
  components:
  - type: Stamp
    stampedName: Magistrate
    stampedColor: "#FF5297"
    stampState: "paper_stamp-magistrate"
  - type: Sprite
    sprite: _Starlight/Objects/Misc/stamps.rsi
    state: stamp-magistrate

- type: entity
