# Access Chips - Single-use items that grant department-specific accesses to ID cards
# These chips can be used on ID cards to grant access levels related to their department

- type: entity
  parent: BaseItem
  id: AccessChipBase
  name: access chip
  description: A single-use access chip. Use on an ID card to grant access. You shouldn't be able to see this item.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Misc/potatoai_chip.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: AccessChip

# Engineering Access Chip

- type: entity
  parent: AccessChipBase
  id: AccessChipEngineering
  name: engineering access chip
  description: A single-use access chip. Use on an ID card to grant Engineering access. After use, the chip is destroyed.
  components:
  - type: AccessChip
    grantedAccesses:
    - Engineering

