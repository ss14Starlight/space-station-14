# Access Chip Boxes - single use consumable (to leave no empty box item behind to clutter the world)

- type: entity
  parent: BaseItem
  id: AccessChipBoxEngineering
  name: engineering access chip box
  description: A sealed box containing engineering access chips. You can give these out to crewmembers to give them basic access to engineering areas. Once opened, the box will be consumed and leave no empty box behind.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Storage/boxicons.rsi
    state: box
  - type: SpawnItemsOnUse
    items:
    - id: AccessChipEngineering
      amount: 3
    sound:
      path: /Audio/Effects/unwrap.ogg

