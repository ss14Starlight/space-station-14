- type: entity
  name: yellow candle
  parent: Candle
  id: CandleYellow
  components:
  - type: Sprite
    layers:
      - state: candle-big
        color: "#c9a227"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#c9a227"
      right:
      - state: inhand-right
        color: "#c9a227"

