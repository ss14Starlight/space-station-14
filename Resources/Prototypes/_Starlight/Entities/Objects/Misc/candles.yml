- type: entity
  name: department candle box
  parent: BoxCandle
  id: BoxCandleDepartment
  description: This box is specifically moulded to only carry candles. These ones come in department colors.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: CandleYellow
          amount: 2
        - id: CandleOrange
          amount: 2
        - id: CandleLightBlue
          amount: 2
        - id: CandleBrown
          amount: 2
        - id: CandleYellowSmall
        - id: CandleOrangeSmall
        - id: CandleLightBlueSmall
        - id: CandleBrownSmall
