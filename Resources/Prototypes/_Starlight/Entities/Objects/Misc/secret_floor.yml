- type: entity
  id: FloorTileItemSecret
  parent: FloorTileItemSteel
  name: secret dark tile
  description: A dark steel floor tile with an embedded layer that makes it appear as a solid wall on station scanners.
  components:
  - type: Sprite
    sprite: /Textures/_Starlight/Tiles/secret_floors.rsi
    state: secret-floor-dark
  - type: FloorTile
    outputs:
    - Plating
    - FloorSecret
  - type: Stack
    stackType: FloorTileSecret
  - type: Construction
    graph: TileSecret
    node: secretTile
  - type: Contraband
    tier: Tier1

- type: entity
  id: FloorTileItemSecretLight
  parent: FloorTileItemSecret
  name: secret steel tile
  description: A light steel floor tile with an embedded layer that makes it appear as a solid wall on station scanners.
  components:
  - type: Sprite
    sprite: /Textures/_Starlight/Tiles/secret_floors.rsi
    state: secret-floor-light
  - type: FloorTile
    outputs:
    - Plating
    - FloorSecretLight
  - type: Stack
    stackType: FloorTileSecretLight
  - type: Construction
    graph: TileSecretLight
    node: secretTile
