#The random stamp box
- type: entity
  name: fake stamps box
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: BoxStampsFake
  description: A small box containing fake stamps.
  components:
    - type: Storage
      maxItemSize: Small
      grid:
        - 0,0,4,4
      whitelist:
        components:
          - Stamp
    - type: EntityTableContainerFill
      containers:
        storagebase: !type:AllSelector
          children:
            - id: RubberStampAcknowledged
            - id: RubberStampMissingStamps
            - id: RubberStampIncorrectStamps
            - id: RubberStampIncorrectForm
            - id: RubberStampIncompleteForm
            - id: RubberStampSentToATS
            - id: RubberStampDeferToCommand
            - id: RubberStampStandby
            - id: RubberStampApproved
            - id: RubberStampDenied
    - type: Sprite
      layers:
        - state: box
        - state: stamp
