#The random stamp box
- type: entity
  name: fake stamps box
  parent: [BoxCardboard, BaseSyndicateContraband]
  id: BoxStampsFake
  description: A small box containing fake stamps.
  components:
    - type: Storage
      maxItemSize: Small
      grid:
        - 0,0,4,1
      whitelist:
        components:
          - Stamp
    - type: EntityTableContainerFill
      containers:
        storagebase: !type:AllSelector
          children:
            - !type:NestedSelector
              tableId: RandomCaptainStampFakeTable
            - !type:NestedSelector
              tableId: RandomClownStampFakeTable
            - !type:NestedSelector
              tableId: RandomCEStampFakeTable
            - !type:NestedSelector
              tableId: RandomCMOStampFakeTable
            - !type:NestedSelector
              tableId: RandomHopStampFakeTable
            - !type:NestedSelector
              tableId: RandomHosStampFakeTable
            - !type:NestedSelector
              tableId: RandomQmStampFakeTable
            - !type:NestedSelector
              tableId: RandomRdStampFakeTable
            - id: RubberStampApprovedFake
            - id: RubberStampDeniedFake
    - type: Sprite
      layers:
        - state: box
        - state: stamp

