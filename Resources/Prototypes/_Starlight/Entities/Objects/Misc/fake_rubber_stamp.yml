- type: entity
  name: fake generic rubber stamp
  parent: [BaseItem, BaseSyndicateContraband]
  id: RubberStampBaseFake
  description: A rubber stamp for forging important documents. Hopefully they don't look too closely.
  abstract: true
  components:
  - type: Stamp
    stampedName: "Fake"
    stampState: "paper_stamp-generic_fake"
    stampedColor: "#a23e3e"
    sound:
      path: /Audio/Items/Stamp/thick_stamp_sub.ogg
      params:
        volume: -2
        maxDistance: 5
  - type: Sprite
    sprite: Objects/Misc/stamps.rsi
    state: stamp-mime
  - type: Item
    size: Tiny
  - type: Tag
    tags:
      - Stamp

