- type: entity
  parent: Paper
  id: TapeRecorderTranscript
  name: record transcript
  # TODO: could have a unique sprite in the future

- type: entity
  name: MedTak invoice
  parent: Paper
  id: PaperMedTak
  description: A piece of paper headed by the MedTak logo. It looks expensive. For you.
  components:
  - type: Sprite
    layers:
    - state: paper
      color: "#ffffff"
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      color: "#ffffff"
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    headerImagePath: "/Textures/_Starlight/Interface/Paper/paper_heading_medtak_logo.svg.96dpi.png"
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_default.svg.96dpi.png"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 8.0, 16.0, 8.0, 0.0
    maxWritableArea: 400.0, 0.0

- type: entity
  name: nt-cc paper
  parent: Paper
  id: PaperNTCC
  description: A single unit of bureaucracy, branded with the logos of NanoTrasen and Central Command.
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper_ntcc
    - state: paper_ntcc_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 0.0, 0.0, 0.0, 0.0
    headerImagePath: "/Textures/_Starlight/Interface/Paper/paper_heading_nt_cc_logos.svg.96dpi.png"
    headerMargin: 0.0, 0.0, 0.0, 0.0

- type: entity
  parent: NukeCodePaper
  id: NukeCodePaperAllNukes
  suffix: All Nukes
  components:
  - type: NukeCodePaper
    allNukesAvailable: true
    printAll: true

- type: entity
  parent: BaseItem
  id: JailFree
  name: get out of jail free card
  description: Get out of jail free! is written on this card, and a drawing depicting a man with a clown mask and monocle escaping a cage is drawn on the right. Both the text and drawing are in crayon.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Misc/paper.rsi
    layers:
    - state: jailfree
  - type: Edible
    delay: 7
    forceFeedDelay: 7
  - type: FlavorProfile
    flavors:
    - paper
  - type: BadFood
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 1
        reagents:
        - ReagentId: Fiber
          Quantity: 1
  - type: Item
    size: Tiny
