## Cosmic Cult Entropy Mote
- type: entity
  parent: [ MaterialBase, BaseCosmicCultItem ] # Starlight Edit: Contraband
  id: MaterialCosmicCultEntropy
  name: mote of entropy
  description: A solidified mote of entropic essence. Feels numbing to the touch.
  suffix: Full
  components:
  # Starlight start
  - type: UserInterface
    interfaces:
      enum.StackCustomSplitUiKey.Key:
        type: StackCustomSplitBoundUserInterface
  # Starlight end
  - type: Stack
    count: 6
    stackType: Entropy
    baseLayer: base
    layerStates:
    - mote
    - mote_2
    - mote_3
  - type: Sprite
    sprite: _Starlight/Objects/Materials/CosmicCult/entropymote.rsi
    state: mote
    layers:
    - state: mote
      map: ["base"]
  - type: Appearance
  - type: Item
    sprite: _Starlight/Objects/Materials/CosmicCult/entropymote.rsi
    size: Small
  - type: CosmicEntropyMote
  - type: Extractable
    grindableSolutionName: grind
  - type: Solution
    id: grind
    solution:
      reagents:
      - ReagentId: Entropy
        Quantity: 1.5

