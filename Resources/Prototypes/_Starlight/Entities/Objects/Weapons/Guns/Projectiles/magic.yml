- type: entity
  id: ProjectileFirebolt
  name: firebolt
  description: Ignis!
  parent: ProjectileFireball
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: "#E25822"
    radius: 2.0
    energy: 5.0
  - type: Projectile
    damage:
      types:
        Heat: 50
  - type: Sprite
    noRot: false
    sprite: _Starlight/Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: firebolt
      shader: unshaded
  - type: Explosive
    explosionType: Default
    maxIntensity: 1
    intensitySlope: 1
    totalIntensity: 5
    canCreateVacuum: false
  - type: IgnitionSource
    temperature: 10000
    ignited: true
  - type: IgniteOnCollide
    fireStacks: 2

- type: entity
  id: ProjectileFireOrb
  name: fireorb
  description: The air twists and wraps around the orb, staying close would be ill advised.
  parent: ProjectileFireball
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: "#910f0f"
    radius: 10.0
    energy: 20.0
  - type: Projectile
    damage:
      types:
        Heat: 5
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireorb
      shader: unshaded
  - type: Explosive
    explosionType: FireBomb
    maxIntensity: 2
    intensitySlope: 0.1
    totalIntensity: 25
    fireStacks: 80
    canCreateVacuum: false
  - type: IgnitionSource
    temperature: 10000
    ignited: true
