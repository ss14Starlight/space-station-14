- type: entity
  name: forged repeater rifle
  parent: [BaseWeaponSniper, BaseMinorContraband]
  id: WeaponSniperForged
  description: The best a tider can achive, reliable fire-rate and accuracy with a satisfying lever-action system. What more can you ask for? Is fitted to be able to chamber both .35 / .45
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/forged_rifle.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/forged_rifle.rsi
  - type: Item
    size: Huge
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
    minAngleDivider: 5
    maxAngleDivider: 3
    angleIncreaseDivider: 1
  - type: Gun
    minAngle: 12
    maxAngle: 24
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
    fireRate: 1.5 #Should allow for more intuitive cycling while still being balanced, as a lever action's RoF is determined on how fast you can cycle.
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    angleIncrease: 4
    angleDecay: 8
  - type: KnockbackByUserTag
    doestContain:
      Skating:
        knockback: 1.0
        staminaMultiplier: 100
      Rodentia:
        knockback: 1.5
        staminaMultiplier: 20
      Resomi:
        knockback: 1.5
        staminaMultiplier: 20
      Felionoid:
        knockback: 0.75 # half of what resomi take
        staminaMultiplier: 20
  - type: BallisticAmmoProvider
    proto: null
    capacity: 8
    whitelist:
      tags:
      - CartridgeLightRifle
      - CartridgeLightRifleImprovised
      - CartridgeMagnum
      - CartridgeMagnumImprovised
  - type: ContainerFill
    containers:
      firing_pin:
      - FiringPinMakeshift
  - type: FiringPinHolder
    supportedPins: [ Makeshift, GunUpgrade ]

- type: entity
  name: militia rifle
  parent: [ BaseContrabandTier3, BaseWeaponSniper, BaseSecurityContraband ] # Blimpuf
  id: WeaponRifleMilitia
  description: "An extremely old rifle, fires .30 with a 10 round internal magazine. Ineffective, but extremely cheap. Loaded manually or with .30 speedloaders."
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Rifles/militia_rifle.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Rifles/militia_rifle.rsi
  - type: Gun
    pump: false
    fireRate: 2
    angleIncrease: 5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    minAngle: 12
    maxAngle: 30
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ltrifle.ogg
    angleDecay: 10
  - type: KnockbackByUserTag
    doestContain:
      Skating:
        knockback: 1.0
        staminaMultiplier: 100
      Rodentia:
        knockback: 0.1
        staminaMultiplier: 20
      Resomi:
        knockback: 0.1
        staminaMultiplier: 20
      Felionoid:
        knockback: 0.05 #half of what resomi take
        staminaMultiplier: 20
  - type: Item
    size: Huge
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    angleIncreaseDivider: 2
    minAngleDivider: 8
    maxAngleDivider: 3.75
    minAngle: 0
    maxAngle: 0
  - type: BallisticAmmoProvider
    capacity: 10
    proto: null
    whitelist:
      tags:
      - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
      firing_pin: !type:Container
  - type: StaticPrice
    price: 25
  - type: ContainerFill
    containers:
      firing_pin:
      - FiringPin
  - type: FiringPinHolder
    supportedPins: [ Rifle, GunUpgrade ]
