- type: entity
  name: forged repeater rifle
  parent: [BaseWeaponSniper, BaseMinorContraband]
  id: WeaponSniperForged
  description: The best a tider can achive, reliable fire-rate and accuracy with a satisfying lever-action system. What more can you ask for? Is fitted to be able to chamber both .35 / .45
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/forged_rifle.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/forged_rifle.rsi
  - type: Item
    size: Huge
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
    minAngleDivider: 5
    maxAngleDivider: 3
    angleIncreaseDivider: 1
  - type: Gun
    minAngle: 12
    maxAngle: 24
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
    fireRate: 1.5 #Should allow for more intuitive cycling while still being balanced, as a lever action's RoF is determined on how fast you can cycle.
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    angleIncrease: 4
    angleDecay: 8
  - type: KnockbackByUserTag
    doestContain:
      Skating:
        knockback: 1.0
        staminaMultiplier: 100
      Rodentia:
        knockback: 1.5
        staminaMultiplier: 20
      Resomi:
        knockback: 1.5
        staminaMultiplier: 20
      Felionoid:
        knockback: 0.75 # half of what resomi take
        staminaMultiplier: 20
  - type: BallisticAmmoProvider
    proto: null
    capacity: 8
    whitelist:
      tags:
      - CartridgeLightRifle
      - CartridgeLightRifleImprovised
      - CartridgeMagnum
      - CartridgeMagnumImprovised
  - type: ContainerFill
    containers:
      firing_pin:
      - FiringPinMakeshift
  - type: FiringPinHolder
    supportedPins: [ Makeshift, GunUpgrade ]
