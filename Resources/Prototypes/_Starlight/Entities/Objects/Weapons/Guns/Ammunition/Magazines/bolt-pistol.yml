- type: entity
  parent:
  - BaseItem
  - BaseMajorContraband
  id: MagazineBoltPistol
  name: bolt pistol magazine (standard)
  description: A 10-round magazine for impact bolts.
  components:
  - type: Tag
    tags:
    - MagazineBoltPistol
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CartridgeImpactBolt
    proto: CartridgeImpactBolt
    capacity: 10
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Ammunition/Magazine/Pistol/impact_bolt_pistol.rsi
    layers:
    - state: icon
      map:
      - enum.GunVisualLayers.icon
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: MagazineBoltPistol
  id: MagazineBoltPistolEmpty
  name: bolt pistol magazine (any)
  suffix: empty
  components:
  - type: BallisticAmmoProvider
    proto: null
