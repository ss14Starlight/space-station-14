- type: entity
  parent: [ BaseItem, BaseMajorContraband ]
  id: BaseMagazineBoxBoltRifle
  name: impact bolt ammunition box
  abstract: true
  components:
  - type: Tag
    tags:
    - MagazineBoxBoltRifle
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CartridgeImpactBolt
    proto: CartridgeImpactBolt
    capacity: 42
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/rifle.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BaseMagazineBoxBoltRifle
  id: MagazineBoxBoltRifle
  name: impact bolt ammunition box
  description: A box containing 42 impact bolts.
