  - type: Appearance


# Magazines
- type: entity
  id: MagazineRifleSP
  name: "Rifle Magazine (.20 rifle SP)"
  parent: BaseMagazineRifle
  description: "A magazine designed for .20 Rifles, holds soft point ammunition."
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeRifleSP
  - type: Sprite
    layers:
    - state: sp
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#575EF5"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#575EF5"

