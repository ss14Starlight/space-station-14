- type: entity
  parent: [BaseItem, BaseSecurityContraband]
  id: FiringPin
  name: firing pin
  description: Somebody probably really needs this right now...
  components:
  - type: Item
    size: Small
  - type: Appearance
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: rifle
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Weapons/Guns/Casings/casing_fall_2.ogg
      params:
        volume: -1
  - type: StaticPrice
    price: 500
  - type: FiringPin
    pinType: Rifle
  - type: StealTarget
    stealGroup: FiringPin

- type: entity
  parent: FiringPin
  id: FiringPinPistol
  name: pistol firing pin
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: pistol
  - type: FiringPin
    pinType: Pistol

- type: entity
  parent: FiringPin
  id: FiringPinMakeshift
  name: makeshift firing pin
  description: It's a nail. Welded to a bottle cap.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: makeshift
  - type: FiringPin
    pinType: Makeshift
  - type: StaticPrice
    price: 10

- type: entity
  parent: FiringPin
  id: FiringPinSmartLMG
  name: smartgun bolt assembly
  description: One of a kind, unreplaceable. Includes a round counter.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: lmg
  - type: FiringPin
    pinType: SmartLMG
  - type: FiringPinShotCounter

- type: entity
  parent: FiringPin
  id: FiringPinLaser
  name: laser crystal
  description: Fragile, not unlike the assistants killed by it.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: laser
  - type: FiringPin
    pinType: Laser
    meltedPrototype: FiringPinLaserCracked
    meltedPopup: gun-heat-crystal-cracked
    meltedSound:
      collection: GlassBreak
  - type: StaticPrice
    price: 50
  - type: Damageable
    damageContainer: Inorganic
  - type: DamageOnLand
    damage:
      types:
        Blunt: 5
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -8
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -8
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: FiringPinLaser
  id: FiringPinAdvancedLaser
  name: prototype laser crystal
  description: DO NOT DROP is inscribed on the side. whatever.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: adv-laser
  - type: FiringPin
    pinType: AdvancedLaser
    meltedPrototype: FiringPinAdvancedLaserCracked
    meltedPopup: gun-heat-crystal-cracked
    meltedSound:
      collection: GlassBreak
  - type: StealTarget
    stealGroup: FiringPinAdvancedLaser
  - type: Explosive
    explosionType: Default
    totalIntensity: 100 # slightly more impressive than a welding tank explosion
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:ExplodeBehavior
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -8
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -8
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassPlasma:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:ExplodeBehavior

# cool functionality ish pins
- type: entity
  parent: FiringPin
  id: FiringPinExpedition
  name: expedition firing pin
  description: This universal pin prevents the gun from firing when on station, useful for managing weaponry used on offstation exploration.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: exped
  - type: FiringPin
    pinType: GunUpgrade
  - type: FiringPinExpedition

- type: entity
  parent: BaseItem
  id: FiringPinMelted
  name: melted firing pin
  description: A lump of metal that used to be a firing pin, before someone kept shooting.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: rifle
    color: "#8a5a3c"
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Weapons/Guns/Casings/casing_fall_2.ogg
      params:
        volume: -1
  - type: Tag
    tags:
    - Trash
  - type: StaticPrice
    price: 0

- type: entity
  parent: FiringPinMelted
  id: FiringPinLaserCracked
  name: cracked laser crystal
  description: The lens crystal of an energy weapon, cracked by heat. It won't focus a beam ever again.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: laser-cracked
    color: "#ffffff"
  - type: EmitSoundOnLand
    sound:
      collection: GlassBreak
      params:
        volume: -8

- type: entity
  parent: FiringPinLaserCracked
  id: FiringPinAdvancedLaserCracked
  name: cracked prototype laser crystal
  description: What is left of a prototype laser crystal after someone kept firing. At least it didn't explode.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Pins/firing_pins.rsi
    state: adv-laser-cracked
    color: "#ffffff"

- type: entity
  parent: FiringPinAdvancedLaser
  id: FiringPinAdvancedLaserReplacement
  name: lab-grown prototype laser crystal
  description: A lab-grown copy of a prototype laser crystal. Just as fragile as the original.
  components:
  - type: StealTarget
    stealGroup: FiringPin
  - type: StaticPrice
    price: 300

- type: entity
  parent: FiringPinSmartLMG
  id: FiringPinSmartLMGReplacement
  name: replacement smartgun bolt assembly
  description: A machined copy of a smartgun bolt assembly. Includes a round counter.
  components:
  - type: StealTarget
    stealGroup: FiringPin
