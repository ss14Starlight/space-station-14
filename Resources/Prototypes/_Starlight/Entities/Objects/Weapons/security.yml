# PDW9 taser pistol — built-in security borg variant, slowly self-recharges
- type: entity
  name: PDW-9 taser pistol
  parent: [ WeaponTaser, BaseSecurityContraband ]
  id: WeaponPDW9TaserBorg
  description: A PDW-9 pattern taser pistol integrated into security cyborg chassis. Slowly self-recharges over time and cannot be dropped.
  components:
  - type: Tag
    tags:
    - Taser
    - Sidearm
  - type: Battery
    maxCharge: 800
    startingCharge: 800
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 20 # ~40s per shot, slow but steady
  - type: Gun
    fireRate: 0.7
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser.ogg
    projectileSpeed: 25
  - type: BatteryAmmoProvider
    proto: BulletTaser
    fireCost: 200
  - type: Unremoveable

# Security borg stun baton — built-in, self-recharging over time
- type: entity
  name: integrated stun baton
  parent: [ Stunbaton, BaseSecurityContraband ]
  id: BorgStunbatonRechargeable
  description: A stun baton integrated into a security cyborg's chassis. Slowly self-recharges between uses and cannot be dropped.
  components:
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 25 # ~2s per use recovery
  - type: Unremoveable

# Security borg holocuffs — holo-projection restraints, integrated, cannot be dropped
- type: entity
  name: holocuffs
  parent: [ Handcuffs, BaseSecurityContraband ]
  id: BorgHolocuffs
  description: Holographic restraining cuffs emitted directly from a security cyborg's chassis. Lightweight and impossible for them to lose.
  components:
  - type: Handcuff
    cuffTime: 2.5
    uncuffTime: 5
    breakoutTime: 60
    cuffedRSI: Objects/Misc/handcuffs.rsi
    bodyIconState: body-overlay
  - type: Sprite
    sprite: Objects/Misc/handcuffs.rsi
    state: handcuff
    color: "#00aaff"
  - type: Unremoveable

- type: entity
  name: double stun baton
  parent: [ Stunbaton, BaseSecurityContraband ]
  id: DoubleStunbaton
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/doublestunbaton.rsi
    layers:
    - state: stunbaton_off
      map: [ "enum.ToggleableVisuals.Layer" ]

- type: entity
  name: purple stun baton
  parent: [ Stunbaton, BaseSecurityContraband ]
  id: PurpleStunbaton
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/purplestunbaton.rsi
    layers:
    - state: stunbaton_off
      map: [ "enum.ToggleableVisuals.Layer" ]
