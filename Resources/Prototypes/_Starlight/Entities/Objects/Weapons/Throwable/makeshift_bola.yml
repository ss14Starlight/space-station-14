- type: entity
  name: makeshift bola
  parent: Bola
  id: MakeshiftBola
  description: An improvised bola fashioned together with wires and weights.
  components:
    - type: Item
      size: Normal
    - type: Sprite
      sprite: _Starlight/Objects/Weapons/Throwable/makeshift_bola.rsi
      state: icon
    - type: Construction
      graph: MakeshiftBola
      node: bola
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 20 # makeshift bola should break easily
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 15
          behaviors:
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: Ensnaring
      freeTime: 2.0
      breakoutTime: 2.5 #lowered from 3.5 makeshift bola should be little quicker to remove
      walkSpeed: 0.5 #makeshift bola shouldn't slow too much
      sprintSpeed: 0.5
      staminaDamage: 0 # anything but this is gamebreaking
      canThrowTrigger: true
      canMoveBreakout: true
      maxEnsnares: 1
