- type: entity
  parent: ThrowingStar
  id: ThrowingStarChangeling
  name: bone shard
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Throwable/bone_shard.rsi
    layers:
    - state: icon
      map: ["base"]
  - type: TimedDespawn
    lifetime: 30
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 7
        Piercing: 8
  - type: StaminaDamageOnCollide # More of a stunning weapon, since it's pretty bad at dealing actual damage.
    damage: 35
  - type: StaminaDamageOnEmbed
    damage: 10
  - type: SolutionContainerManager
    solutions:
      toxin:
        maxVol: 6
        reagents:
        - ReagentId: ChangelingCytotoxin
          Quantity: 6
  - type: SolutionInjectOnEmbed
    solution: toxin
    transferAmount: 6
  - type: TriggerOnEmbed
    userIsEmbeddedInto: true
  - type: EntityEffectOnTrigger
    targetUser: true
    effects:
    - !type:MovementSpeedModifier
      effectProto: ChangelingBoneShardSlowdown
      time: 6
      walkSpeedModifier: 0.6
      sprintSpeedModifier: 0.6

- type: entity
  parent: ThrowingStarChangeling
  id: ThrowingStarChangelingEvolved
  suffix: Evolved
  components:
  - type: SolutionContainerManager
    solutions:
      toxin:
        maxVol: 6
        reagents:
        - ReagentId: ChangelingCytotoxinEvolved
          Quantity: 6
  - type: EntityEffectOnTrigger
    targetUser: true
    effects:
    - !type:MovementSpeedModifier
      effectProto: ChangelingBoneShardSlowdown
      time: 6
      walkSpeedModifier: 0.4
      sprintSpeedModifier: 0.4
