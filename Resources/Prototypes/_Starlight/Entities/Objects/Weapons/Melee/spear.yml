- type: entity
  name: steel spear
  parent: Spear
  id: SpearSteel
  description: A solid steel spear.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/steel_spear.rsi
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Piercing: 15
        Slash: 5
        Structural: 5
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 25

- type: entity
  name: athena
  parent: Spear
  id: SpearAthena
  description: Impressed by a crewmember managing to kill their bodyguard with a spear, a CentComm official commissioned the “Athena” tactical spear for their security forces.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/athena.rsi
  - type: MeleeWeapon
    attackRate: 1.5
    wideAnimationRotation: -135
    damage:
      types:
        Piercing: 16
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 15
        Slash: 15
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 2
        Slash: 2
  - type: DamageOnLand
    damage:
      types:
        Blunt: 1
  - type: DisarmMalus
    malus: 0.6
  - type: StaticPrice
    price: 1000
  - type: Contraband
    allowedDepartments: [ Security ]
    tier: Tier1


- type: entity
  name: xeno tail
  parent: [BaseItem, SolutionDart]
  id: XenoTailSpear
  description: Your trusty tail. Sharp, and good for stabbing things with!
  components:
  - type: Tool
    qualities:
    - Slicing
  - type: Tag
    tags:
    - Spear
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/xeno_tail.rsi
    layers:
    - state: tail
    - state: tail1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: MeleeWeapon
    wideAnimationRotation: -135
    range: 2.0
    damage:
      types:
        Piercing: 12
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    size: Ginormous
  - type: MeleeChemicalInjector
    solution: melee
  - type: RefillableSolution
    solution: melee
  - type: InjectableSolution
    solution: melee
  - type: SolutionTransfer
    maxTransferAmount: 2
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: tail
