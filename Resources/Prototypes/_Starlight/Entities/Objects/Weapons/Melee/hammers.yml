- type: entity
  name: Breaching Hammer
  parent: [BaseItem, BaseSecurityContraband]
  id: HammerBreachingNT
  description: A robust heavy hammer made for breaching through walls and doors. Its reinforced head and sturdy handle make it ideal for demolition tasks.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/BreachingHammer.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.6
    damage:
      types:
        Blunt: 5
        Structural: 25
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 35
        Structural: 110
  - type: Item
    size: Ginormous
    shape:
    - 0,0,4,3
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 400
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Tool
    qualities:
    - Prying
    useSound: /Audio/Items/jaws_pry.ogg
  - type: Prying
    speedModifier: 1.5
    pryPowered: true
    useSound: /Audio/Items/jaws_pry.ogg
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: TileFrictionModifier
    modifier: 40
  - type: ClothingSpeedModifier
    walkModifier: 0.6
    sprintModifier: 0.6
    requireActivated: false
  - type: HeldSpeedModifier
  - type: UseDelay
    delay: 2
  - type: Tag
    tags:
    - BreachingHammer
  - type: BreachingHammer
  - type: PhysicalComposition
    materialComposition:
      Steel: 500
