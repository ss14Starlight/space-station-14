- type: entity
  name: X-09 Headsman
  parent: [BaseItem, BaseNanoTrasenContraband]
  id: WeaponAdmemeX09Headsman
  description: They say the art of execution has evolved a lot over the years. For some people. Not for me.
  components:
  - type: EnergyColor
    color: '#6ae5e9'
    hackingLocked: true
    hackingUnlockQuality: Cutting
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/x09_headsman.rsi
    layers:
      - state: icon
      - state: icon-blade
        visible: false
        color: '#FFFFFF'
        shader: unshaded
        map: [ "blade" ]
  - type: Sharp
  - type: DisarmMalus
    malus: 0.6
  - type: ItemToggleHot
  - type: ItemTogglePointLight
    toggleableVisualsColorModulatesLights: true
  - type: MeleeWeapon
    wideAnimationRotation: 135
    attackRate: 0.8
    autoAttack: true
    damage:
      types:
        Blunt: 4.5
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/_Starlight/Weapons/marriage_swing.ogg
      params:
        variation: 0.250
    activatedSoundOnHitNoDamage:
      path: /Audio/_Starlight/Weapons/marriage_swing.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnSwing:
      path: /Audio/_Starlight/Weapons/marriage_swing.ogg
      params:
        variation: 0.125
    activatedDamage:
      types:
        Slash: 12.5
        Heat: 12.5
        Structural: 120
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 12.5
        Heat: 12.5
        Structural: 120
    respectActiveState: true
  - type: Item
    sprite: _Starlight/Objects/Weapons/Melee/x09_headsman.rsi
    size: Ginormous
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Melee/x09_headsman.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: HeldSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: ItemToggle
    predictable: true
    soundActivate:
      path: /Audio/Weapons/ebladeon.ogg
      params:
        pitch: 0.8
    soundDeactivate:
      path: /Audio/Weapons/ebladeoff.ogg
      params:
        pitch: 0.8
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/_Starlight/Weapons/marriage_hum.ogg
      params:
        pitch: 0.6
  - type: ToggleableVisuals
    spriteLayer: blade
    inhandVisuals:
      left:
        - state: inhand-left-blade
          shader: unshaded
      right:
        - state: inhand-right-blade
          shader: unshaded
    wieldingVisuals:
      left:
        - state: wielded-inhand-left-blade
          shader: unshaded
      right:
        - state: wielded-inhand-right-blade
          shader: unshaded
    clothingVisuals:
      back:
        - state: equipped-BACKPACK-blade
          shader: unshaded
      suitstorage:
        - state: equipped-SUITSTORAGE-blade
          shader: unshaded
  - type: Appearance
  - type: Reflect
    reflectProb: 0.5
    spread: 45
  - type: PointLight
    enabled: false
    radius: 3
    energy: 3
    color: "#00CCFF"
    netsync: false
  - type: UseDelay
    delay: 1
