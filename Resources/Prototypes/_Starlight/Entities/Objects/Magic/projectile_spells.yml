- type: entity
  parent: ActionFireball
  id: ActionFirebolt
  name: Firebolt
  description: Fires a fast but weaker bolt of fire toward the aimed location. (Cooldown of 20 seconds)
  components:
  - type: Action
    useDelay: 5
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/fireball.ogg
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: fireball
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ProjectileFirebolt
  - type: SpeakOnAction
    sentence: action-speech-spell-firebolt
    tts: action-speech-spell-firebolt-tts
    modifier: Spell
  - type: EorgPreventAction # Starlight
