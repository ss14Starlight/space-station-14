- type: entity
  parent: ActionFireball
  id: ActionFirebolt
  name: Firebolt
  description: Fires a fast but weaker bolt of fire toward the aimed location. (Cooldown of 5 seconds)
  components:
  - type: Action
    useDelay: 5
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/fireball.ogg
    icon:
      sprite: _Starlight/Objects/Magic/magicactions.rsi
      state: firebolt
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ProjectileFirebolt
  - type: SpeakOnAction
    sentence: action-speech-spell-firebolt
    tts: action-speech-spell-firebolt-tts
    modifier: Spell

- type: entity
  parent: ActionFireball
  id: ActionFireOrb
  name: Fire Orb
  description: Fires a slow moving Orb of fire that will ignite everyone in a big radius in a glorious inferno. (Cooldown of 4 minutes)
  components:
  - type: Action
    useDelay: 240
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/fireball.ogg
    icon:
      sprite: _Starlight/Objects/Magic/magicactions.rsi
      state: fireorb
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ProjectileFireOrb
      projectileSpeed: 1
  - type: SpeakOnAction
    sentence: action-speech-spell-fireorb
    tts: action-speech-spell-fireorb-tts
    modifier: Spell

- type: entity
  parent: ActionFireball
  id: ActionFireArrow
  name: Fire arrow
  description: Fires a solid flame in the form of an arrow. (Cooldown of 5 seconds)
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: BigAction
    raiseOnUser: true
    icon:
      sprite: _Starlight/Objects/Magic/magicactions.rsi
      state: firearrows
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:MultiProjectileSpellEvent
      prototype: ProjectileFireArrow
      projectileCount: 3
      spreadDegrees: 16
  - type: SpeakOnAction
    sentence: action-speech-spell-firearrow
    tts: action-speech-spell-firearrow-tts
    modifier: Spell

- type: entity
  parent: BaseAction
  id: ActionArticGlare
  name: Artic Glare
  description: Glare at your enemies with the fury of the artic, freezing anyone close (short range spell, 2 min cooldown).
  components:
  - type: Magic
  - type: Action
    useDelay: 120 #2 minutes
    itemIconStyle: BigAction
    raiseOnUser: true
    icon:
      sprite: _Starlight/Objects/Magic/magicactions.rsi
      state: articglare
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:MultiProjectileSpellEvent
      prototype: ProjectileIceGlare
      projectileCount: 15
      spreadDegrees: 120
  - type: SpeakOnAction
    sentence: action-speech-spell-articglare
    tts: action-speech-spell-articglare-tts
    modifier: Spell
  - type: EorgPreventAction

- type: entity
  parent: BaseAction
  id: ActionIceShard
  name: Ice Shard
  description: Throw a sharp shard of ice that will slice and freeze the first person it touches. (30 seconds cooldown)
  components:
  - type: Magic
  - type: Action
    useDelay: 20
    itemIconStyle: BigAction
    icon:
      sprite: _Starlight/Objects/Magic/magicactions.rsi
      state: iceshard
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ProjectileIceShard
  - type: SpeakOnAction
    sentence: action-speech-spell-iceshard
    tts: action-speech-spell-iceshard-tts
    modifier: Spell
  - type: EorgPreventAction

- type: entity
  parent: ActionFireball
  id: ActionIceOrb
  name: Heart of Winter
  description: Unleash a slow moving orb of ice, the orb throws icy shards every seconds. Also destroys anything non living on impact. (3 min cooldown)
  components:
  - type: Action
    useDelay: 180
    itemIconStyle: BigAction
    icon:
      sprite: _Starlight/Objects/Magic/magicactions.rsi
      state: iceorb
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ProjectileIceOrb
      projectileSpeed: 2
  - type: SpeakOnAction
    sentence: action-speech-spell-iceorb
    tts: action-speech-spell-iceorb-tts
    modifier: Spell
