- type: entity
  parent: BaseStructure
  id: TotemSlowCurse
  name: Hex of slowness
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Magic/magicactions.rsi
    state: totemweb
  - type: Appearance
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/gib1.ogg
  - type: CustomSpawner
    enabled: true
    spawnOnInterval: true
    spawnInterval: 5
    oneShot: false
    strategy: All
    spawnData:
    - protoId: SpiderWebSoul
      spawnOffsets:
      - 0, 2
    - protoId: SpiderWebSoul
      spawnOffsets:
      - -1, 1
    - protoId: SpiderWebSoul
      spawnOffsets:
      - 0, 1
    - protoId: SpiderWebSoul
      spawnOffsets:
      - 1, 1
    - protoId: SpiderWebSoul
      spawnOffsets:
      - -2, 0
    - protoId: SpiderWebSoul
      spawnOffsets:
      - -1, 0
    - protoId: SpiderWebSoul
      spawnOffsets:
      - 1, 0
    - protoId: SpiderWebSoul
      spawnOffsets:
      - 2, 0
    - protoId: SpiderWebSoul
      spawnOffsets:
      - -1, -1
    - protoId: SpiderWebSoul
      spawnOffsets:
      - 0, -1
    - protoId: SpiderWebSoul
      spawnOffsets:
      - 1, -1
    - protoId: SpiderWebSoul
      spawnOffsets:
      - 0, -2
    - protoId: SpiderWebSoul
      spawnOffsets:
      - -2, 2
    - protoId: SpiderWebSoul
      spawnOffsets:
      - -1, 2
    - protoId: SpiderWebSoul
      spawnOffsets:
      - 1, 2
    - protoId: SpiderWebSoul
      spawnOffsets:
      - 2, 2
    - protoId: SpiderWebSoul
      spawnOffsets:
      - -2, 1
    - protoId: SpiderWebSoul
      spawnOffsets:
      - 2, 1
    - protoId: SpiderWebSoul
      spawnOffsets:
      - -2, -1
    - protoId: SpiderWebSoul
      spawnOffsets:
      - 2, -1
    - protoId: SpiderWebSoul
      spawnOffsets:
      - -2, -2
    - protoId: SpiderWebSoul
      spawnOffsets:
      - -1, -2
    - protoId: SpiderWebSoul
      spawnOffsets:
      - 1, -2
    - protoId: SpiderWebSoul
      spawnOffsets:
      - 2, -2
