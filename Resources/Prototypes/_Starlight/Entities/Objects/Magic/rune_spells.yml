- type: entity
  id: RuneAnnihilation
  parent: BaseRune
  name: great rune of annihilation
  description: Your instincts scream at you, you do not want to get close.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Magic/annihilation.rsi
      layers:
        - state: annihilation
    - type: TriggerOnSpawn
    - type: TimerTrigger
      delay: 4
    - type: TimedDespawn
      lifetime: 14
    - type: SpawnOnTrigger
      keysIn:
      - timer
      proto: annihilationsmite
    - type: EmitSoundOnSpawn
      sound:
        path: /Audio/_Starlight/Magic/annihilationrune.ogg


- type: entity
  id: annihilationsmite
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Magic/annihilation.rsi
    layers:
      - state: annihilationsmite
  - type: Clickable
  - type: Fixtures
    fixtures:
       rune:
        shape:
          !type:PhysShapeAabb
          bounds: "-2,-2,2,2"
        hard: false
        mask:
          - ItemMask
        layer:
          - SlipLayer
  - type: Physics
  - type: DamageContacts
    ignoreWhitelist:
        tags:
          - DarkWizard
    damageDead: false
    damage:
      types:
        Slash: 50
        Asphyxiation: 200
        Structural: 50
  - type: TimedDespawn
    lifetime: 10

