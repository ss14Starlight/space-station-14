        sprite: _Starlight/Objects/Magic/magicactions.rsi
        state: annihilation
  - type: TargetAction
    range: 16
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:WorldSpawnSpellEvent
      prototypes:
      - id: RuneAnnihilation
        amount: 1
  - type: SpeakOnAction
    sentence: action-speech-spell-annihilationrune
    tts: action-speech-spell-annihilationrune-tts
