        state: gravity
  - type: TargetAction
    range: 16
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:WorldSpawnSpellEvent
      prototypes:
      - id: RuneGravity
        amount: 1
  - type: SpeakOnAction
    sentence: action-speech-spell-runegravity
