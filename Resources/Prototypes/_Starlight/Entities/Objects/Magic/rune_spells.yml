- type: entity
  parent: BaseRuneAction
  id: ActionExplosionRuneWiz
  name: Explosion Rune
  description: Summons a rune that explodes if walked on.
  components:
  - type: Action
    useDelay: 40
    icon:
        sprite: _Starlight/Objects/Magic/magicactions.rsi
        state: explosionrune
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: ExplosionRuneWiz
  - type: SpeakOnAction
    sentence: action-speech-spell-explosionrune
    tts: action-speech-spell-explosionrune-tts
    modifier: Spell
  - type: EorgPreventAction

- type: entity
  parent: BaseRuneAction
  id: ActionIgniteRuneWiz
  name: incendiary rune
  description: Summons a rune that ignites anyone stepping on it.
  components:
  - type: SpeakOnAction
    sentence: action-speech-spell-iginiterune
    tts: action-speech-spell-iginiterune-tts
    modifier: Spell
  - type: Action
    useDelay: 40
    icon:
        sprite: _Starlight/Objects/Magic/magicactions.rsi
        state: ignitionrune
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: IgniteRuneWiz

- type: entity
  parent: CollideRune
  id: IgniteRuneWiz
  name: ignition rune
  components:
    - type: TriggerOnCollide
      fixtureID: ignition
      maxTriggers: 1
    - type: Fixtures
      fixtures:
        ignition:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.4,-0.4,0.4,0.4"
          hard: false
          mask:
          - ItemMask
          layer:
          - SlipLayer
    - type: DeleteOnTrigger
    - type: IgniteOnCollide
      fireStacks: 5
    - type: Sprite
      sprite: _Starlight/Objects/Magic/magicactions.rsi
      layers:
        - state: ignitionrune

- type: entity
  parent: ExplosionRune
  id: ExplosionRuneWiz
  name: explosion rune
  components:
    - type: Explosive
      explosionType: DefaultnoSpace
      totalIntensity: 20
      intensitySlope: 5
      maxIntensity: 4
    - type: Sprite
      sprite: _Starlight/Objects/Magic/magicactions.rsi
      layers:
        - state: explosionrune

- type: entity
  parent: BaseRuneAction
  id: ActionFreezeRune
  name: Freeze Rune
  description: Summons a rune that will freeze in place anyone who walks on it.
  components:
  - type: Action
    useDelay: 25
    icon:
        sprite: _Starlight/Objects/Magic/magicactions.rsi
        state: icerune
  - type: TargetAction
    range: 10
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:WorldSpawnSpellEvent
      prototypes:
      - id: FreezeRuneWiz
        amount: 1
      - id: FreezeRune2Wiz
        amount: 1
  - type: SpeakOnAction
    sentence: action-speech-spell-freezerune
    tts: action-speech-spell-freezerune-tts
    modifier: Spell
  - type: EorgPreventAction

- type: entity
  parent: StunRune
  id: FreezeRuneWiz
  name: freeze rune
  components:
    - type: TriggerOnCollide
      fixtureID: rune
      maxTriggers: 1
    - type: StunOnCollide
      stunAmount: 10
      knockdownAmount: 10
      fixture: rune
    - type: Sprite
      sprite: _Starlight/Objects/Magic/magicactions.rsi
      layers:
      - state: icerune

- type: entity
  parent: CollideRune
  id: FreezeRune2Wiz
  name: freeze rune
  components:
    - type: TriggerOnCollide
      fixtureID: rune
      maxTriggers: 1
    - type: ExplodeOnTrigger
    - type: Explosive
      explosionType: Cryo
      totalIntensity: 1
      intensitySlope: 0.1
      maxIntensity: 7
    - type: Sprite
      sprite: _Starlight/Objects/Magic/magicactions.rsi
      layers:
      - state: icerune


- type: entity
  parent: ActionFreezeRune
  id: ActionEruption
  name: Eruption
  description: Summon a rune that after 2 seconds will start sending fiery shrapnels in a wide area (40 seconds cooldown).
  components:
  - type: Action
    useDelay: 40
    icon:
        sprite: _Starlight/Objects/Magic/magicactions.rsi
        state: eruption
  - type: TargetAction
    range: 16
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:WorldSpawnSpellEvent
      prototypes:
      - id: EruptionRuneWiz
        amount: 1
  - type: SpeakOnAction
    sentence: action-speech-spell-eruption
    tts: action-speech-spell-eruption-tts
    modifier: Spell
  - type: EorgPreventAction

- type: entity
  parent: BaseRune
  id: EruptionRuneWiz
  name: eruption rune
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Magic/magicactions.rsi
    layers:
    - state: eruptionrune
  - type: PointLight
    color: "#F5E12C"
    radius: 1.0
    energy: 6.0
  - type: TimedDespawn
    lifetime: 6
  - type: RepeatingTrigger
    delay: 1.5
  - type: SpawnOnTrigger
    proto: EruptionBomb

- type: entity
  parent: ActionFreezeRune
  id: ActionSoulKnives
  name: Rune of soul cutting
  description: Summons a magical rune that will place several immobile soul knives, hurting anyone who comes in contact with them.
  components:
  - type: Action
    useDelay: 30
    icon:
        sprite: _Starlight/Objects/Magic/magicactions.rsi
        state: soulknives
  - type: TargetAction
    range: 16
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:WorldSpawnSpellEvent
      prototypes:
      - id: KnivesRune
        amount: 1
  - type: SpeakOnAction
    sentence: action-speech-spell-soulknives
    tts: action-speech-spell-soulknives-tts
    modifier: Spell
  - type: EorgPreventAction

- type: entity
  id: KnivesRune
  name: rune of soul cutting
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Magic/magicactions.rsi
    layers:
    - state: kniverune
  - type: CustomSpawner
    enabled: true
    spawnOnInterval: true
    spawnInterval: 0.1
    oneShot: true
    spawnStrategy: All
    spawnData:
    - protoId: Runeknifespawn
      spawnOffsets:
      - -2, 2
    - protoId: Runeknifespawn
      spawnOffsets:
      - 0, 2
    - protoId: Runeknifespawn
      spawnOffsets:
      - 2, 2
    - protoId: Runeknifespawn
      spawnOffsets:
      - -1, 1
    - protoId: Runeknifespawn
      spawnOffsets:
      - 1, 1
    - protoId: Runeknifespawn
      spawnOffsets:
      - 0, 1
    - protoId: Runeknifespawn
      spawnOffsets:
      - -2, 0
    - protoId: Runeknifespawn
      spawnOffsets:
      - 2, 0
    - protoId: Runeknifespawn
      spawnOffsets:
      - 0, -1
    - protoId: Runeknifespawn
      spawnOffsets:
      - -1, -1
    - protoId: Runeknifespawn
      spawnOffsets:
      - 1, -1
    - protoId: Runeknifespawn
      spawnOffsets:
      - -2, -2
    - protoId: Runeknifespawn
      spawnOffsets:
      - 0, -2
    - protoId: Runeknifespawn
      spawnOffsets:
      - 2, -2
  - type: TimedDespawn
    lifetime: 2

- type: entity
  parent: BaseRune
  id: Runeknifespawn
  name: orb
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: orbknives
  - type: TriggerOnSpawn
  - type: TimerTrigger
    examinable: false
    popup: null
    delay: 2
  - type: SpawnOnTrigger
    keysIn:
    - timer
    proto: ProjectileSoulKnife
  - type: TimedDespawn
    lifetime: 2.1
