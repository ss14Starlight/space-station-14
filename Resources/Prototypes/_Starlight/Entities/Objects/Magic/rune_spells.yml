- type: entity
  parent: BaseRuneAction
  id: ActionExplosionRuneWiz
  name: Explosion Rune
  description: Summons a rune that explodes if used.
  components:
  - type: Action
    useDelay: 40
    icon:
        sprite: Structures/Magic/Cult/rune.rsi
        state: cult6
        color: '#FF770055'
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: ExplosionRuneWiz
  - type: SpeakOnAction
    sentence: action-speech-spell-explosionrune
    tts: action-speech-spell-explosionrune-tts
    modifier: Spell
  - type: EorgPreventAction

- type: entity
  parent: ActionIgniteRune
  id: ActionIgniteRuneWiz
  name: incendiary rune
  description: Summons a rune that ignites if used.
  components:
  - type: SpeakOnAction
    sentence: action-speech-spell-iginiterune
    tts: action-speech-spell-iginiterune-tts
    modifier: Spell
  - type: Action
    useDelay: 40
    icon:
        sprite: Structures/Magic/Cult/trap.rsi
        state: trap
  - type: EorgPreventAction

- type: entity
  parent: ExplosionRune
  id: ExplosionRuneWiz
  name: explosion rune
  components:
    - type: Explosive
      explosionType: Default
      totalIntensity: 20
      intensitySlope: 5
      maxIntensity: 4
    - type: Sprite
      sprite: Structures/Magic/Cult/trap.rsi
      layers:
        - state: trap

- type: entity
  parent: BaseRuneAction
  id: ActionFreezeRune
  name: Freeze Rune
  description: Summons a rune that will freeze in place anyone who walks on it.
  components:
  - type: Action
    useDelay: 30
    icon:
        sprite: Structures/Magic/Cult/rune.rsi
        state: cult6
        color: '#FF770055'
  - type: TargetAction
    range: 10
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:WorldSpawnSpellEvent
      prototypes:
      - id: FreezeRuneWiz
        amount: 1
  - type: SpeakOnAction
    sentence: action-speech-spell-explosionrune
    tts: action-speech-spell-explosionrune-tts
    modifier: Spell
  - type: EorgPreventAction

- type: entity
  parent: CollideRune
  id: FreezeRuneWiz
  name: freeze rune
  components:
    - type: Ensnaring
      freeTime: 3
      walkSpeed: 0
      breakoutTime: 9
      sprintSpeed: 0
      staminaDamage: 0
      ensnareSound: /Audio/_Starlight/Effects/Shadekin/nullphase.ogg
    - type: Sprite
      sprite: Structures/Magic/Cult/rune.rsi
      layers:
        - state: cult4
        - color: '#00AEFF'
