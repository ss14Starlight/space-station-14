- type: entity
  id: RuneGravity
  parent: BaseRune
  name: rune of gravity
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Magic/magicactions.rsi
      layers:
        - state: gravityrune
    - type: TriggerOnSpawn
    - type: TimerTrigger
      delay: 1.2
    - type: TimedDespawn
      lifetime: 7
    - type: SpawnOnTrigger
      keysIn:
      - timer
      proto: RuneGravityEffect

- type: entity
  id: RuneGravityEffect
  suffix: Gravity
  parent: GlandEffectBase
  components:
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Effects/Grenades/Supermatter/supermatter_start.ogg
      params:
        volume: 5
  - type: AmbientSound
    enabled: true
    volume: -5
    range: 14
    sound:
      path: /Audio/Effects/Grenades/Supermatter/supermatter_loop.ogg
  - type: GravityWell
    maxRange: 4
    minRange: 0
    baseRadialAcceleration: 6
    baseTangentialAcceleration: 6
    gravPulsePeriod: 0.01
  - type: SingularityDistortion
    intensity: 10
    falloffPower: 1.5
  - type: TimedDespawn
    lifetime: 6
