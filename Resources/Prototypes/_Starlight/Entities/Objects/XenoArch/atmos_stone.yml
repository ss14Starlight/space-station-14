- type: entity
  parent: GassyStoneBase
  id: GassyStonePluoxium
  suffix: Pluoxium
  components:
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [ Touch ]
    reactions:
    - reagents: [ Water ]
      methods: [ Touch ]
      effects:
      - !type:CreateGas
        gas: Pluoxium

