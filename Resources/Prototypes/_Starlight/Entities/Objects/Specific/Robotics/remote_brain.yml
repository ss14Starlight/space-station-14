- type: entity
  parent: [BaseOrganBrain, BaseHumanOrgan]
  id: RemoteControlBrain
  name: remote control interface
  description: A synthetic interface installed in place of a positronic brain, allowing a compatible robotic body to be controlled remotely.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Robotics/remotecontrolbrain.rsi
    layers:
    - state: remotebrain
      map: ["base"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RemoteControlBrainVisuals.Connected:
        base:
          True: { state: remotebrain-occupied }
          False: { state: remotebrain }
  - type: Eye
  - type: ContentEye
  - type: RemoteControlBrain
  - type: DeviceLinkSink
    ports: [ RemoteControlControllable ]
  - type: BorgBrain
