- type: entity
  parent: NukeCodePaper
  id: NukeCodePaperStationDAGD
  suffix: DAGD, Sends Message, Station Only
  description: Die, Gloriously.
  components:
  - type: NukeCodePaper

- type: entity
  parent: BaseItem
  id: TraitorNuclearCodes
  name: the red folder
  suffix: Station Nuke Codes
  description: Alerts the station to your presence. Disintegrates without using after 60 seconds, don't waste your chance. Good luck.
  components:
  - type: Sprite
    sprite: Objects/Misc/folders.rsi
    layers:
    - state: folder-colormap
      color: "#cc2323"
    - state: folder-base
    - state: folder-stamp-inverse
      color: "#1dff00"
  - type: PhysicalComposition
    materialComposition:
      Paper: 50
  - type: TriggerOnUse
  - type: RattleOnTrigger
    radioChannel: Common
    targetUser: true
    global: true
    sound: /Audio/Announcements/war.ogg
    color: Red
    messages:
      Alive: rattle-on-trigger-nuke-message
  - type: SpawnOnTrigger
    proto: NukeCodePaperStationDAGD
    targetUser: true
  - type: Appearance
  - type: EmitSoundOnUse
    sound:
        collection: TriggerActivate
  - type: DeleteOnTrigger
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Effects/Lightning/lightningbolt.ogg
  - type: EmitSoundOnTrigger
    sound:
        collection: WarMusic
    global: true
  - type: PointLight
    color: Red
    radius: 6
    energy: 3
  - type: TimedDespawn
    lifetime: 60
