# Guard Boxes - contain a department pauldron, access chip, and encryption key

- type: entity
  parent: BaseItem
  id: GuardBoxEngineering
  name: engineering guard box
  description: A sealed box containing equipment for Engineering guards. You can give these to a Security officer to equip them with the appropriate access and uniform.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Storage/boxicons.rsi
    state: box
  - type: SpawnItemsOnUse
    items:
    - id: AccessChipEngineering
    - id: ClothingNeckPauldronEngineeringGuard
    sound:
      path: /Audio/Effects/unwrap.ogg

