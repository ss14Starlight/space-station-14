- type: entity
  id: CrateSovietArmaments
  parent: [CrateGeneric, BaseSovietContraband]
  name: SKB armaments crate
  description: The red tide is here.
  components:
  - type: Contraband # Blimpuf
    tier: Tier3
  - type: Icon
    sprite: _Starlight/Structures/Storage/USSP/revolutionary.rsi
  - type: Sprite
    sprite: _Starlight/Structures/Storage/USSP/revolutionary.rsi
  - type: Fixtures
    fixtures:
      fix1:
        layer:
          - SovietLayer
  - type: TimedDespawn
    lifetime: 600
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Effects/teleport_arrival.ogg
  - type: EntityStorage
    showContents: false
    occludesLight: true
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: SKBArmamentsRiftLoot

- type: entityTable
  id: SKBArmamentsRiftLoot
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: SKBClothingTable
      prob: 1
    - !type:NestedSelector
      tableId: SKBEquipmentTable
      prob: 1
    - !type:NestedSelector
      tableId: SKBWeaponsTable
      prob: 1

- type: entityTable
  id: SKBClothingTable
