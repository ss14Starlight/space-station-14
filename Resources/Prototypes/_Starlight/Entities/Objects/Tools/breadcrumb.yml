- type: entity
  parent: BaseItem
  id: GlowstoneDropper
  name: glowstone dropper
  description: A bag that drops glowstones as you walk. Going back has never been so easy!
  components:
    - type: Transform
      noRot: true
    - type: Item
      size: Small
      shape:
        - 0,0,0,1
    - type: Sprite
      sprite: _Starlight/Objects/Tools/Breadcrumb/bag.rsi
      layers:
        - state: bag
      noRot: true
    - type: BreadcrumbDropper
      dropRange: 4.5
      color: "#ffffff"
      colorOptions:
        white: "#ffffff"
        red: "#ff0000"
        orange: "#ff8000"
        yellow: "#ffff00"
        green: "#3dff3d"
        cyan: "#00ffff"
        blue: "#0560fc"
        magenta: "#ff00ff"
    - type: LimitedCharges
      maxCharges: 999999999
      lastCharges: 50
    - type: UserInterface
      interfaces:
        enum.GlowstoneDropperUiKey.Key:
          type: GlowstoneDropperBoundUserInterface

- type: entity
  parent: BaseItem
  id: Glowstone
  name: glowstone
  description: A stone that glows for a while. Useful for tracking where you've been.
  components:
    - type: Item
      size: Tiny
      shape:
        - 0,0,0,0
    - type: Sprite
      sprite: _Starlight/Objects/Tools/Breadcrumb/dropping.rsi
      noRot: true
      layers:
        - state: base
          map: [ "enum.ExpendableLightVisualLayers.Base" ]
#        - state: light
#          map: [  ]
        - state: light
          map: [ "enum.BreadcrumbVisualLayers.UnlitColor", "enum.ExpendableLightVisualLayers.Overlay" ]
          visible: true
        - state: light
          map: [ "enum.BreadcrumbVisualLayers.LitColor", "enum.ExpendableLightVisualLayers.Glow" ]
          visible: false
          shader: unshaded
    - type: Breadcrumb
    - type: Damageable
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 1
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: Appearance
    - type: PointLight
      enabled: false
      color: "#ffffff"
      radius: 1.7
      energy: 2.5
    - type: ExpendableLight
      glowDuration: 300
      fadeOutDuration: 900
      turnOnBehaviourID: turn_on
      fadeOutBehaviourID: fade_out
      fadeGlowWithEnergy: true
      glowReferenceEnergy: 3.5 # intentionally higher to dim it a little
    - type: LightBehaviour
      behaviours:
        - !type:FadeBehaviour # fade in radius
          id: turn_on
          maxDuration: 5
          startValue: 1.1
          endValue: 1.7
        - !type:FadeBehaviour # fade in energy
          id: turn_on
          maxDuration: 5
          property: Energy
          startValue: 0.2
          endValue: 2.5
        - !type:FadeBehaviour # fade out radius
          id: fade_out
          maxDuration: 900
          startValue: 1.7
          endValue: 1.2
        - !type:FadeBehaviour # fade out energy
          id: fade_out
          maxDuration: 900
          property: Energy
          startValue: 2.5
          endValue: 0.7
    - type: Tag
    - type: SpaceGarbage
    - type: TimedDespawn
      lifetime: 1500 # 25mins
