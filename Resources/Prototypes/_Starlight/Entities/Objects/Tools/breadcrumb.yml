- type: entity
  id: GlowstoneDropper
  name: glowstone dropper
  description: A bag that drops glowstones as you walk. Going back has never been so easy!
  components:
    - type: Transform
      noRot: true
    - type: Item
      size: Small
      shape:
        - 0,0,0,1
    - type: Sprite
      sprite: _Starlight/Objects/Tools/Breadcrumb/bag.rsi
      layers:
        - state: bag
      noRot: true
    - type: BreadcrumbDropper
      color: "#ff0000"
    - type: LimitedCharges
      maxCharges: 999999999
      lastCharges: 50

- type: entity
  parent: BaseItem
  id: Glowstone
  name: glowstone
  description: A stone that glows for a while. Useful for tracking where you've been.
  components:
    - type: Item
      size: Tiny
      shape:
        - 0,0,0,0
    - type: Sprite
      sprite: _Starlight/Objects/Tools/Breadcrumb/dropping.rsi
      noRot: true
      layers:
        - state: base
          map: [ "enum.ExpendableLightVisualLayers.Base" ]
#        - state: light
#          map: [  ]
        - state: light
          map: [ "enum.BreadcrumbVisualLayers.UnlitColor", "enum.ExpendableLightVisualLayers.Overlay" ]
          visible: true
        - state: light
          map: [ "enum.BreadcrumbVisualLayers.LitColor", "enum.ExpendableLightVisualLayers.Glow" ]
          visible: false
          shader: unshaded
    - type: Breadcrumb
    - type: Damageable
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 1
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: Appearance
    - type: PointLight
      enabled: false
      color: "#ffffff"
      radius: 3
      intensity: 0.8
    - type: ExpendableLight
      glowDuration: 5 # 240 # 4 minutes full power
      fadeOutDuration: 10 # 1020 # 16 minutes declining power
      turnOnBehaviourID: turn_on
      fadeOutBehaviourID: fade_out
    - type: LightBehaviour
      behaviours:
        - !type:FadeBehaviour # have the radius start small and get larger as it starts to burn
          id: turn_on
          maxDuration: 5 # 240 # 4 minutes full power
          property: Energy
          startValue: 1.3
          endValue: 1.3
        - !type:FadeBehaviour # fade out radius as it burns out
          id: fade_out
          maxDuration: 10 # 1020 # 16 minutes declining power
          property: Energy
          startValue: 1.3
          endValue: 0
    - type: Tag
    - type: SpaceGarbage
    - type: TimedDespawn
      lifetime: 1500 # 25mins
