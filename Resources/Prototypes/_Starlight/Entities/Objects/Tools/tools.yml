- type: entity
  name: самодельный ломик-ключ
  parent: BaseItem
  id: CrowbarWrenchMakeshift
  description: Всё ещё довольно плохо.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
  - type: Sprite
    sprite: _Starlight/Objects/Tools/makeshift_omnitool.rsi
    state: wrench
  - type: Item
    sprite: _Starlight/Objects/Tools/makeshift_omnitool.rsi
  - type: Prying
    enabled: false
    speedModifier: 0.25
  - type: ToolTileCompatible
    delay: 4
  - type: Tool
    qualities:
      - Screwing
    speedModifier: 0.25
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 9
  - type: MultipleTool
    statusShowBehavior: true
    entries:
      - behavior: [ Prying ]
        sprite:
          sprite: _Starlight/Objects/Tools/makeshift_omnitool.rsi
          state: wrench
        useSound:
          path: /Audio/Items/crowbar.ogg
      - behavior: [ Anchoring ]
        sprite:
          sprite: _Starlight/Objects/Tools/makeshift_omnitool.rsi
          state: wrenchflipped
        useSound:
          path: /Audio/Items/ratchet.ogg
  - type: ToolRefinable
    refineResult:
    - id: CrowbarWrenchScrewdriverMakeshift
  - type: Tag
    tags:
      - Crowbar
      - Wrench

