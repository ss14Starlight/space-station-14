- type: entity
  name: импровизированный омнитул
  parent: BaseItem
  id: OmnitoolImprovised
  description: Нечестивая мерзость, уступающая лишь великому Тронклеру.
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
  - type: Sprite
    sprite: _Starlight/Objects/Tools/improvised_omnitool.rsi
    layers:
    - state: icon
    - state: welder_flame
      visible: false
      shader: unshaded
      map: ["enum.ToggleableVisuals.Layer"]
  - type: RefillableSolution
    solution: Welder
  - type: Tool
    useSound:
      collection: Welder
    qualities: [ Welding ]
  - type: Solution
    id: Welder
    solution:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 50
      maxVol: 50
  - type: Welder
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    sprite: _Starlight/Objects/Tools/improvised_omnitool.rsi
    size: Normal
  - type: ItemSwitch
    state: Prying
    states:
      prying: !type:ItemSwitchState
        verb: Prying
        sprite:
          sprite: _Starlight/Objects/Tools/improvised_omnitool.rsi
          state: icon
        components:
        - type: ToolTileCompatible
          delay: 1
        - type: Tool
          speedModifier: 0.75
          qualities:
            - Prying
          useSound:
            path: /Audio/Items/crowbar.ogg
        - type: Prying
        - type: MeleeWeapon
          wideAnimationRotation: -135
          soundHit:
            collection: MetalThud
            params:
              variation: 0.250
              volume: -10
          damage:
            types:
              Blunt: 5
              Slash: 5

      screwing: !type:ItemSwitchState
        verb: Screwing
        sprite:
          sprite: _Starlight/Objects/Tools/improvised_omnitool.rsi
          state: icon
        components:
        - type: Tool
          qualities:
            - Screwing
          useSound:
            collection: Screwdriver
          speedModifier: 0.75
        - type: MeleeWeapon
          wideAnimationRotation: -135
          soundHit:
            collection: MetalThud
            params:
              variation: 0.250
              volume: -10
          damage:
            types:
              Blunt: 5
              Slash: 5

      cutting: !type:ItemSwitchState
        verb: Cutting
        sprite:
          sprite: _Starlight/Objects/Tools/improvised_omnitool.rsi
          state: icon
        components:
        - type: ToolTileCompatible
        - type: Tool
          qualities:
            - Cutting
          useSound:
            path: /Audio/Items/wirecutter.ogg
          speedModifier: 0.75
        - type: MeleeWeapon
          wideAnimationRotation: -135
          soundHit:
            collection: MetalThud
            params:
              variation: 0.250
              volume: -10
          damage:
            types:
              Blunt: 5
              Slash: 5

      anchoring: !type:ItemSwitchState
        verb: Anchoring
        sprite:
          sprite: _Starlight/Objects/Tools/improvised_omnitool.rsi
          state: icon
        components:
        - type: Tool
          qualities:
            - Anchoring
          useSound:
            path: /Audio/Items/ratchet.ogg
          speedModifier: 0.75
        - type: MeleeWeapon
          wideAnimationRotation: -135
          soundHit:
            collection: MetalThud
            params:
              variation: 0.250
              volume: -10
          damage:
            types:
              Blunt: 5
              Slash: 5

      pulsing: !type:ItemSwitchState
        verb: Pulsing
        sprite:
          sprite: _Starlight/Objects/Tools/improvised_omnitool.rsi
          state: icon
        components:
        - type: Tool
          qualities:
            - Pulsing
        - type: NetworkConfigurator
        - type: ActivatableUI
          key: enum.NetworkConfiguratorUiKey.List
          inHandsOnly: true
        - type: UserInterface
          interfaces:
            enum.NetworkConfiguratorUiKey.List:
              type: NetworkConfiguratorBoundUserInterface
            enum.NetworkConfiguratorUiKey.Configure:
              type: NetworkConfiguratorBoundUserInterface
            enum.NetworkConfiguratorUiKey.Link:
              type: NetworkConfiguratorBoundUserInterface
        - type: MeleeWeapon
          wideAnimationRotation: -135
          soundHit:
            collection: MetalThud
            params:
              variation: 0.250
              volume: -10
          damage:
            types:
              Blunt: 5
              Slash: 5

      welding: !type:ItemSwitchState
        verb: Welding
        sprite:
          sprite: _Starlight/Objects/Tools/improvised_omnitool.rsi
          state: icon
        components:
        - type: ItemToggle
          predictable: false
          soundActivate:
            collection: WelderOn
            params:
              variation: 0.125
              volume: -5
          soundDeactivate:
            collection: WelderOff
            params:
              variation: 0.125
              volume: -5
        - type: ItemToggleSize
          activatedSize: Large
        - type: ItemToggleHot
        - type: ComponentToggler
          components:
          - type: DisarmMalus
            malus: 0.6
        - type: ToggleableVisuals
          spriteLayer: flame
        - type: RefillableSolution
          solution: Welder
        - type: Tool
          useSound:
            collection: Welder
          qualities: [ Welding ]
          speedModifier: 0.75
        - type: PointLight
          enabled: false
          radius: 1.5
          color: orange
          netsync: false
        - type: ItemTogglePointLight
        - type: Appearance
        - type: RequiresEyeProtection
        - type: BotanySampleTaker
        - type: IgnitionSource
          temperature: 700
        - type: ItemToggleMeleeWeapon
          activatedSoundOnHit:
            path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
            params:
              variation: 0.250
              volume: -10
          activatedSoundOnHitNoDamage:
            path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
            params:
              variation: 0.250
              volume: -12
          deactivatedSoundOnHitNoDamage:
            collection: MetalThud
          activatedDamage:
            types: # Have you ever been attacked by a lit welder, a sharp object, and a blunt crowbar all at the same time? That hurts.
              Blunt: 4
              Slash: 4
              Heat: 5
        - type: MeleeWeapon
          wideAnimationRotation: -135
          soundHit:
            collection: MetalThud
          damage:
            types:
              Blunt: 5
              Slash: 5
  - type: Tag
    tags:
      - Multitool
      - DoorElectronicsConfigurator
      - Wrench
      - Wirecutter
      - Screwdriver

