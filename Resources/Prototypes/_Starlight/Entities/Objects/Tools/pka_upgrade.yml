  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#e9ffb1"
    - state: overlay-2
      color: "#e9ffb1"
    - state: overlay-3
      color: "#e9ffb1"
  - type: GunUpgrade
    tags:
      - GunUpgradeSpeed
      - GunUpgradeSpeedExp
    examineText: gun-upgrade-examine-text-reload
  - type: GunUpgradeFireRate
    coefficient: 2
