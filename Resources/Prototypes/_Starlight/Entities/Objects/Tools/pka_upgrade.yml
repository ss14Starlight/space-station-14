  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay-1
      color: "#7dd415"
    - state: overlay-2
      color: "#7dd415"
    - state: overlay-3
      color: "#7dd415"
  - type: GunUpgrade
    tags: [ GunUpgradeReloadSpeedExp ]
    examineText: gun-upgrade-examine-text-reload
  - type: GunUpgradeFireRate
    coefficient: 3
  - type: GunUpgradeSpeed
    coefficient: .9
  - type: GunUpgradeDamage
    damageMultiplier:
      types:
        Blunt: 0.9
        Structural: .9

- type: entity
  id: PKAUpgradeFireRateAdv
