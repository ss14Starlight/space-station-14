- type: entity
  abstract: true
  id: DogCollarMixin
  components:
  - type: SuitSensor
    controlsLocked: false
    randomMode: false
    mode: SensorCords
  - type: DeviceNetwork
    deviceNetId: Wireless
    transmitFrequencyId: SuitSensor
    savableAddress: false
  - type: StationLimitedNetwork
