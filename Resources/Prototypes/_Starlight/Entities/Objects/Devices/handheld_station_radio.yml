- type: entity
  name: handheld station radio
  description: Listen to those sweet tunes, on the go!
  parent: BaseItem # Can't inherit RadioHandheld because this needs to not inherit the microphone
  id: RadioHandheldStation
  components:
    - type: TelecomExempt
    - type: Tag
      tags:
        - Radio
    - type: Sprite
      sprite: _Starlight/Objects/Devices/handheld_station_radio.rsi
      layers:
        - state: handradio-off
          map: ["enum.ToggleableVisuals.Layer"]
        - state: unlit
          shader: unshaded
          visible: false
          map: ["enum.LightLayers.Unshaded"]
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.ToggleableVisuals.Enabled:
          enum.ToggleableVisuals.Layer:
            True: { state: handradio-on }
            False: { state: handradio-off }
          enum.LightLayers.Unshaded:
            True: { visible: true }
            False: { visible: false }
    - type: Item
      sprite: _Starlight/Objects/Devices/handheld_station_radio.rsi
      heldPrefix: handradio
      size: Small
    - type: RadioSpeaker
      enabled: false
      channels:
        - RadioShow
    - type: Speech
      speechVerb: Radio
    - type: ActiveRadio
      channels:
        - RadioShow
    - type: StationRadioReceiver
      active: false
      defaultParams: !type:AudioParams
        maxDistance: 2
      boostedParams: !type:AudioParams
        maxDistance: 3
    - type: Construction
      graph: HandheldStationRadio
      node: done
