- type: entity
  id: HandheldRemoteControl
  parent: [ PowerCellSlotMediumItem, BaseHandheldComputer ] # Starlight
  name: портативный пульт управления
  description: Планшетный компьютер, способный дистанционно управлять другим подключённым устройством.
  components:
  - type: Item
    sprite: Objects/Devices/tablets.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Sprite
    sprite: Objects/Devices/tablets.rsi
    state: tabletsol
    layers:
    - state: tabletsol
    - sprite: Objects/Specific/Engineering/handheldengineeringmonitor.rsi
      state: power
      shader: unshaded
      visible: false
      map: [ "screen" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        screen:
          True: { visible: true }
          False: { visible: false }
  - type: PowerCellDraw
    drawRate: 1.5
  - type: ActivatableUI
    key: enum.RemoteControlUIKey.Key
    inHandsOnly: true
    singleUser: true
  - type: RemoteControlConsole
  - type: DeviceLinkSource
    ports:
    - RemoteControl
  - type: UserInterface
    interfaces:
      enum.RemoteControlUIKey.Key:
        type: RemoteControlConsoleBoundUserInterface
  - type: StaticPrice
    price: 500

- type: entity
  id: HandheldRemoteControlExpedition
  parent: [ PowerCellSlotSmallItem, BaseHandheldComputer ] # Starlight
  name: игрушечный пульт управления
  description: Компактный пульт управления без экрана, предназначенный для радиоуправляемых игрушек.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Devices/toy_remote_control.rsi
    layers:
    - state: toyremote_off
    - map: [ "enum.ToggleableVisuals.Layer" ]
      state: toyremote_on
      visible: false
  - type: Item
    sprite: _Starlight/Objects/Devices/toy_remote_control.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: PowerCellDraw
    drawRate: 0.5
  - type: ItemToggle
    onUse: true
    onActivate: false
  - type: RemoteControlConsole
    enableRemoteView: false
  - type: DeviceLinkSource
    ports:
    - RemoteControl
  - type: StaticPrice
    price: 500
