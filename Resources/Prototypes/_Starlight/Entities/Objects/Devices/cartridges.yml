- type: entity
  parent: BaseAction
  id: ActionMedTek
  name: Analyze Patient
  components:
  - type: Action
    icon:
      sprite: Objects/Specific/Medical/healthanalyzer.rsi
      state: icon
    itemIconStyle: BigAction
    checkCanInteract: false
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:MedTekActionEvent

- type: entity
  parent: [ BasePDACartridge, BaseCommandContraband ]
  id: PhotoCartridge
  name: photo cartridge
  description: Lets you take pictures with your PDA! Blank Photographs not included.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Devices/cartridge.rsi
    state: cart-camera
  - type: Icon
    sprite: _Starlight/Objects/Devices/cartridge.rsi
    state: cart-camera
  - type: Cartridge
    programName: photo-program-name
    icon:
      sprite: _Starlight/Interface/Misc/program_icons.rsi
      state: camera
  - type: PhotoCartridge
    grantedComponents:
    - type: SnapshotCapture
      snapshot: SnapshotPhotograph
      zoomLevels:
      - 9,7
      - 7,5
      - 5,3
      - 3,3
      - 1,1
    - type: LimitedCharges
      maxCharges: 4
    - type: UseDelay
      delay: 1
