- type: entity
  parent: BaseAction
  id: ActionMedTek
  name: Analyze Patient
  components:
  - type: Action
    icon:
      sprite: Objects/Specific/Medical/healthanalyzer.rsi
      state: icon
    itemIconStyle: BigAction
    checkCanInteract: false
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:MedTekActionEvent

- type: entity
  parent: BasePDACartridge
  id: MapCartridge
  name: Map Cartridge
  description: A program for navigation that shows station map.
  components:
    - type: Sprite
      state: cart-nav
    - type: Icon
      sprite: Objects/Devices/cartridge.rsi
      state: cart-nav
    - type: Cartridge
      programName: map-program-name
      icon:
        sprite: Objects/Devices/tablets.rsi
        state: tablet
    - type: MapCartridge
    - type: UIFragment
      ui: !type:MapUi

