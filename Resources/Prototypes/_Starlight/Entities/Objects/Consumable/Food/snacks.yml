- type: entity
  parent: BaseItem
  id: FoodSnackHardCandy
  name: hard candy
  description: So many flavors of sugar!
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Consumable/Food/hardcandy.rsi
    state: candy_wrapped
    color: "#ff63be"
  - type: Item
    size: Tiny
    storedOffset: -1,-1
  - type: Tag
    tags:
      - FoodSnack
  - type: SpawnItemsOnUse
    items:
      - id: FoodPacketHardCandyTrash
      - id: FoodSnackHardCandyOpen
    sound:
      path: /Audio/Effects/unwrap.ogg
    requireHands: false # 🌟Starlight🌟

- type: entity
  parent: FoodSnackBase
  id: FoodSnackHardCandyOpen
  name: hard candy
  description: So many flavors of sugar! Tastes even better with the skin off.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Consumable/Food/hardcandy.rsi
    state: candy
    color: "#ff7dc9"
  - type: Item
    storedOffset: -1,-1
  - type: Tag
    tags:
    - FoodSnack
    - ReptilianFood
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20 # Room for extra condiments
        reagents:
        - ReagentId: Sugar
          Quantity: 15
  - type: FlavorProfile
    flavors:
    - sweet

- type: entity
  categories: [ HideSpawnMenu ]
  parent: FoodPacketTrash
  id: FoodPacketHardCandyTrash
  name: candy wrapper
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Consumable/Food/hardcandy.rsi
    state: wrapper
    color: "#ff63be"
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Trash

- type: entity
  parent: BaseItem
  id: FoodSnackBloodBrick
  name: haemobrick
  description: A carefully synthesized brick of condensed blood. Tastes like you would expect.
  components:
  - type: Item
    size: Small
    storedOffset: -1,0
    heldPrefix: nutribrick
  - type: Tag
    tags:
      - FoodSnack
  - type: Sprite
    sprite: Objects/Consumable/Food/snacks.rsi
    state: nutribrick
  - type: SpawnItemsOnUse
    items:
      - id: FoodPacketMRETrash
      - id: FoodSnackBloodBrickOpen
    sound:
      path: /Audio/Effects/unwrap.ogg
    requireHands: false
  - type: ItemPrice
    priceCategory: food_medium

- type: entity
  parent: FoodSnackBase
  id: FoodSnackBloodBrickOpen
  name: haemobrick
  description: A carefully synthesized brick of condensed blood. Tastes like you would expect.
  components:
  - type: FlavorProfile
    flavors:
      - blood
  - type: Item
    size: Small
    storedOffset: -1,0
    heldPrefix: nutribrick-open
  - type: Tag
    tags:
      - Blood
  - type: Sprite
    state: nutribrick-open
    color: '#880000'
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Blood
          Quantity: 20
  # Starlight-start: Vending Machines Prices
  - type: ItemPrice
    priceCategory: food_medium
  # Starlight-end