    #sprite: _Starlight/Consumable/Food/Nutricheese.rsi # TODO: Custom sprites for cheese.
    sprite: Objects/Consumable/Food/ingredients.rsi
    state: cheesewedge
  - type: FlavorProfile
    flavors:
      - nutribrick # TODO: 

