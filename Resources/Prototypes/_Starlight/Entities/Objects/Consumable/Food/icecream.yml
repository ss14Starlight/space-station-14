- type: entity
  abstract: true
  parent: FoodMealBase
  id: FoodIceCreamBase
  components:
  - type: Appearance
  - type: Edible
    transferAmount: 4
    trash:
    - DrinkGlass
  - type: Sprite
    layers:
    - state: icon_empty
      map: [ "enum.SolutionContainerLayers.Base" ]
    - state: fill-1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: SolutionContainerVisuals
    changeColor: false
    solutionName: food
    maxFillLevels: 5
    fillBaseName: fill-

- type: entity
  name: vanilla ice cream
  parent: FoodIceCreamBase
  id: FoodVanillaIceCream
