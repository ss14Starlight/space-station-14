    - state: icon_empty
      map: [ "enum.SolutionContainerLayers.Base" ]
    - state: fill-1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: SolutionContainerVisuals
    changeColor: false
    solutionName: food
    maxFillLevels: 5
    fillBaseName: fill-

