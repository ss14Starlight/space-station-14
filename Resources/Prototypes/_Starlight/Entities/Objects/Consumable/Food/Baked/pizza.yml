- type: entity
  name: nutribrick pizza
  parent: [FoodPizzaBase, BaseSlicingRefinableFood]
  id: FoodPizzaNutribrick
  description: Topped with chunky, dense nuggets of nutribrick.
  components:
  - type: FlavorProfile
    flavors:
      - nutribrick
      - sweet
      - wrong
  - type: Sprite
    sprite: _Starlight/Objects/Consumable/Food/pizza.rsi
    layers:
    - state: nutri-pizza
  - type: Solution
    id: food
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 80 # Flat dough and two nutribricks.
      - ReagentId: BbqSauce
        Quantity: 10
  - type: ToolRefinable
    refineResult:
    - id: FoodPizzaNutriSlice
      amount: 8

- type: entity
  name: slice of nutribrick pizza
  parent: FoodPizzaSliceBase
  id: FoodPizzaNutriSlice
  description: A nutribrickious slice of pizza.
  components:
  - type: FlavorProfile
    flavors:
      - nutribrick
      - sweet
      - wrong
  - type: Sprite
    sprite: _Starlight/Objects/Consumable/Food/pizza.rsi
    layers:
    - state: nutri-slice
  - type: Solution
    id: food
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 6.6667 # isn't division fun?
      - ReagentId: BbqSauce
        Quantity: 0.8333
  - type: Item
    heldPrefix: nutri-slice

- type: entity
  name: wrapper pizza
  parent: FoodPizzaCotton
  id: FoodPizzaWrapper
  description: The phrase 'tastes like cardboard' taken too literally.
  components:
  - type: FlavorProfile
    flavors:
      - trashy
      - sadness
      - struggle
  - type: Sprite
    sprite: _Starlight/Objects/Consumable/Food/pizza.rsi
    layers:
    - state: wrapper-pizza
  - type: Solution
    id: food
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 20
      - ReagentId: Fiber
        Quantity: 60 # Cotton dough and two wrappers.
      - ReagentId: Astrotame
        Quantity: 10
  - type: ToolRefinable
    refineResult:
    - id: FoodPizzaWrapperSlice
      amount: 8
  - type: Edible
    requiresSpecialDigestion: true

- type: entity
  name: slice of wrapper pizza
  parent: FoodPizzaCottonSlice
  id: FoodPizzaWrapperSlice
  description: Just one slice of sadness.
  components:
  - type: FlavorProfile
    flavors:
      - trashy
      - sadness
      - struggle
  - type: Sprite
    sprite: _Starlight/Objects/Consumable/Food/pizza.rsi
    layers:
    - state: wrapper-slice
  - type: Solution
    id: food
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 1.6667
      - ReagentId: Fiber
        Quantity: 5
      - ReagentId: Astrotame
        Quantity: 0.8333
  - type: Item
    heldPrefix: wrapper-slice
  - type: Edible
    requiresSpecialDigestion: true
