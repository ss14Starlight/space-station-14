    - type: FlavorProfile
      flavors:
        - Fiber
        - Sweetness
    - type: Solution
      id: food
      solution:
        reagents:
          - ReagentId: Nutriment
            Quantity: 7.5
          - ReagentId: Vitamin
            Quantity: 1.25
          - ReagentId: Sugar
            Quantity: 1.25
          - ReagentId: Fiber
            Quantity: 1.25
    - type: Tag
      tags:
        - Cake
        - Slice
        - ClothMade
    - type: Edible
      requiresSpecialDigestion: true


- type: entity
  name: A Slice of dreaming
  parent: FoodCakeSliceBase
