      layers:
        - state: ResomiKartSlice
    - type: FlavorProfile
      flavors:
        - hope
        - sadness
        - pilk
    - type: Solution
      id: food
      solution:
        reagents:
          - ReagentId: Nutriment
            Quantity: 7.5
          - ReagentId: Vitamin
            Quantity: 1.25
          - ReagentId: Sugar
            Quantity: 1.875
    - type: Tag
