- type: entity
  name: Dreaming cake
  parent: FoodCakeBase
  id: FoodResomiCake
  description: The poor Resomi can no longer chase their dreams
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Consumable/Food/Custcake.rsi
      layers:
        - state: ResomiKart
    - type: FlavorProfile
      flavors:
        - hope
        - sadness
        - pilk
    - type: SliceableFood
      count: 8
      slice: FoodCakeResomiSlice
    - type: Solution
      id: food
      solution:
        reagents:
          - ReagentId: Nutriment
            Quantity: 60
          - ReagentId: Vitamin
            Quantity: 10
          - ReagentId: Sugar
            Quantity: 15
    - type: Tag
      tags:
        - Cake


- type: entity
  name: Cotton Cake
  parent: FoodCakeBase
  id: FoodCottonCake
  description: A sweet treat for the moth to eat
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Consumable/Food/Custcake.rsi
      layers:
        - state: mothcake
    - type: FlavorProfile
      flavors:
        - Fiber
        - Sweetness
    - type: SliceableFood
      count: 8
      slice: FoodCottonCakeSlice
    - type: Solution
      id: food
      solution:
        reagents:
          - ReagentId: Nutriment
            Quantity: 60
          - ReagentId: Vitamin
            Quantity: 10
          - ReagentId: Sugar
            Quantity: 10
          - ReagentId: Fiber
            Quantity: 10
    - type: Tag
      tags:
        - Cake
        - ClothMade
    - type: Edible
      requiresSpecialDigestion: true

- type: entity
  name: A Slice of Cotton Cake
