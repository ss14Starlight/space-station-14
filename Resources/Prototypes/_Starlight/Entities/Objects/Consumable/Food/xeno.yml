- type: entity
  parent: FoodInjectableBase
  id: FoodXenoEgg
  components:
  - type: FlavorProfile
    flavors:
      - xenoEgg
  - type: Sprite
    sprite: Objects/Consumable/Food/meat.rsi
  - type: Extractable
    grindableSolutionName: food
  - type: Solution
    solution:
      reagents:
      - ReagentId: XenoEgg
        Quantity: 30
  - type: Item
    shape:
    - 0,0,1,0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        # less mass so it can cook faster, a single strip of bacon isnt 5kg
        density: 1
        mask:
        - ItemMask
        restitution: 0.3  # fite me
        friction: 0.2
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Meaterial: 300
