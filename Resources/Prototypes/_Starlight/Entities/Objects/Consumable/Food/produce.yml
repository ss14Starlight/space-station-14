- type: entity
  name: cinnaflare stick
  parent: Flare
  id: CinnaflareStick
  description: Dried bark rolled into a stick, ready to ignite and light the way.
  components:
    - type: PotencyVisuals
    - type: Extractable
      grindableSolutionName: food
    - type: Solution
      id: flare
      solution:
        maxVol: 5
        reagents:
          - ReagentId: Oil
            Quantity: 5
    - type: ExpendableLight
      glowDuration: 145
      fadeOutDuration: 15
      plantBurnTimeModifier: 3
      iconStateSpent: flare_spent
      turnOnBehaviourID: turn_on
      fadeOutBehaviourID: fade_out
      litSound:
        path: /Audio/Items/Flare/flare_on.ogg
      loopedSound:
        path: /Audio/Items/Flare/flare_burn.ogg
        params:
          loop: true
          volume: -10
          maxDistance: 5
    - type: Sprite
      sprite: _Starlight/Objects/Tools/cinnaflare.rsi
    - type: Item
      heldPrefix: unlit
    - type: Produce
      plantId: CinnaflarePlants

- type: entity
  parent: FoodMushroom
  id: FoodBrownMushroom
  name: brown mushrooms
  description: Plump brown button mushrooms with a mild, earthy flavor.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Hydroponics/brown_mushroom.rsi
  - type: Item
    # Use the existing mushroom in-hands; the world and inventory icons are custom.
    sprite: Objects/Specific/Hydroponics/chanterelle.rsi
    heldPrefix: produce
  - type: FlavorProfile
    flavors:
    - mushroom
  - type: Produce
    plantId: BrownMushroomPlants
  - type: EmitPollen
