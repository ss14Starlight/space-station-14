# Character Plushies - Keep alphabetical, please!
- type: entity
  parent: BaseShadekinPlushie
  id: PlushieBrightheart # rtasva
  name: brightheart plushie
  description: A plushie of a small, elusive, and odd looking security officer. Seems familiar somehow.
  components:
  - type: Item
    size: Small
    sprite: _Starlight/Objects/Fun/Plushies/brightheart_plushie.rsi
  - type: Sprite
    sprite: _Starlight/Objects/Fun/Plushies/brightheart_plushie.rsi
    state: icon
  - type: Edible
    requiresSpecialDigestion: true
    useSound:
      path: /Audio/Items/Toys/toysqueak3.ogg
  - type: Clothing
    quickEquip: false
    sprite: _Starlight/Objects/Fun/Plushies/brightheart_plushie.rsi
    slots:
      - HEAD
    clothingVisuals:
      head:
        - state: equipped-HELMET

- type: entity
  parent: BaseLizardPlushie
  id: PlushieDoxes # SanityGecko
  name: doxes-the-captain plushie
  description: An adorable stuffed toy that resembles Doxes-the-Captain. "Captain's IP is 189.47.108.519!"
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Fun/Plushies/doxes_plushie.rsi
    state: icon
  - type: Item
    sprite: _Starlight/Objects/Fun/Plushies/doxes_plushie.rsi
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/Items/Toys/weh.ogg
  - type: Edible
    requiresSpecialDigestion: true
    useSound:
      path: /Audio/Items/Toys/weh.ogg
  - type: MeleeWeapon
    wideAnimationRotation: 180
    soundHit:
      path: /Audio/Items/Toys/weh.ogg
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuiceThatMakesYouWeh
        Quantity: 30
  - type: Solution
    id: food
    solution:
      maxVol: 20
      reagents:
      - ReagentId: Fiber
        Quantity: 10
      - ReagentId: JuiceThatMakesYouWeh
        Quantity: 10
  - type: Clothing
    quickEquip: false
    sprite: _Starlight/Objects/Fun/Plushies/doxes_plushie.rsi
    slots:
    - HEAD
  - type: Speech
    speechVerb: Reptilian # for pais (In the secret stash)
  - type: Tag
    tags:
    - Payload
    - ClothMade
    - PlushieLizard

