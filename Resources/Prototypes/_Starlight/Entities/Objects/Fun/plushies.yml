- type: entity
  parent: BaseMothPlushie
  id: PlushieMozan
  name: Mozan plushie
  description: Just like the real thing, it squeaks if you poke it.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Fun/Plushies/mozan_plushie.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _Starlight/Objects/Fun/Plushies/mozan_plushie.rsi

- type: entity
  parent: BaseMothPlushie
  id: PlushieKoni
  name: koni plushie
  description: Some sort of moth-cat hybrid. You can't help but find it really cute. Can squeak and meow!
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Fun/Plushies/koni_plushie.rsi
      state: icon
    - type: Item
      size: Small
      sprite: _Starlight/Objects/Fun/Plushies/koni_plushie.rsi
    - type: EmitSoundOnUse
      sound:
        collection: CatMothSounds
    - type: EmitSoundOnActivate
      sound:
        collection: CatMothSounds
    - type: EmitSoundOnCollide
      sound:
        collection: CatMothSounds
    - type: EmitSoundOnLand
      sound:
        collection: CatMothScreams
    - type: EmitSoundOnTrigger
      sound:
        collection: CatMothSounds
    - type: MeleeWeapon
      soundHit:
        collection: CatMothSounds
    - type: Edible
      useSound:
        collection: CatMothScreams
    - type: Clothing
      quickEquip: false
      sprite: _Starlight/Objects/Fun/Plushies/koni_plushie.rsi
      slots:
        - HEAD
      clothingVisuals:
        head:
          - state: equipped-HELMET

# General Plushies
- type: entity
  parent: BasePlushie
  id: PandaPlushie
  name: panda plushie
  description: Large and in charge! Its paws and body are weighted with poly pellets. Holding it eases your stress and anxieties.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Fun/Plushies/panda_plushie.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: _Starlight/Objects/Fun/Plushies/panda_plushie.rsi
  - type: EmitSoundOnUse
    sound:
      path: /Audio/_Starlight/Items/Toys/panda_noise1.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Starlight/Items/Toys/panda_noise2.ogg
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/_Starlight/Items/Toys/panda_noise1.ogg
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/_Starlight/Items/Toys/panda_noise1.ogg
  - type: MeleeWeapon
    wideAnimationRotation: 180
    soundHit:
      path: /Audio/_Starlight/Items/Toys/panda_noise1.ogg
  - type: Edible
    requiresSpecialDigestion: true
    useSound:
      path: /Audio/_Starlight/Items/Toys/panda_noise2.ogg
  - type: FoodSequenceElement
    entries:
      CottonBurger: PandaPlushie

- type: entity
  parent: BaseBorgPlushie
  id: PlushieBorg
  name: borg plushie
  description: A tiny plushie of an engineering cyborg, complete with tiny plastic tools.
  components:
    - type: Item
      size: Small
      sprite: _Starlight/Objects/Fun/Plushies/borg_plushie.rsi
    - type: Sprite
      sprite: _Starlight/Objects/Fun/Plushies/borg_plushie.rsi
      state: icon

- type: entity
  parent: BaseShadekinPlushie
  id: PlushieVirus
  name: virus plushie
  description: BEST SALESWOMAN, resgistered 2525, now in a pocket version! # spamton ass character :sob:
  components:
    - type: Item
      size: Small
      sprite: _Starlight/Objects/Fun/Plushies/virus_plushie.rsi
    - type: Sprite
      sprite: _Starlight/Objects/Fun/Plushies/virus_plushie.rsi
      layers:
        - state: icon
    - type: Clothing
      sprite: _Starlight/Objects/Fun/Plushies/virus_plushie.rsi
      slots:
      - HEAD
      clothingVisuals:
        head:
        - state: equipped-HELMET
    - type: ItemToggle
      onUse: false
      verbToggleOn: plushie-voicebox-activate
      verbToggleOff: plushie-voicebox-deactivate
    - type: ComponentToggler
      components:
        - type: DatasetVocalizer
          dataset: PlushiesVirus
        - type: TextToSpeech
          voice: mozillaAu15

- type: entity
  parent: BasePlushie
  id: PlushieLargeSoftShark
  name: large blue shark soft plushie
  description: A large, soft, and cuddly shark plushie. Perfect for hugging!
  components:
    - type: Item
      size: Normal
      sprite: _Starlight/Objects/Fun/Plushies/large_soft_shark_plushie.rsi
    - type: Sprite
      sprite: _Starlight/Objects/Fun/Plushies/large_soft_shark_plushie.rsi
      state: icon
    # Shows cuddle message when used in hand
    - type: CuddleMessage
      localizedMessageKey: plushie-large-soft-shark-cuddle
    - type: EmitSoundOnUse
      sound:
        path: /Audio/Effects/thudswoosh.ogg
        params:
          volume: -5
      handle: false
    - type: EmitSoundOnLand
      sound:
        path: /Audio/Items/Toys/rawr.ogg
    - type: EmitSoundOnTrigger
      sound:
        path: /Audio/Items/Toys/rawr.ogg
    - type: EmitSoundOnActivate
      sound:
        path: /Audio/Items/Toys/rawr.ogg
    - type: EmitSoundOnCollide
      sound:
        path: /Audio/Items/Toys/rawr.ogg
    - type: MeleeWeapon
      wideAnimationRotation: 90
      soundHit:
        path: /Audio/Items/Toys/rawr.ogg
      animation: WeaponArcBite
    - type: UseDelay
      delay: 1.0
    - type: Tag
      tags:
        - Payload
        - ClothMade

