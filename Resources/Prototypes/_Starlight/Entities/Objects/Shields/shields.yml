- type: entity
  name: energy shield
  parent: [BaseItem, BaseXenoborgContraband]
  id: EnergyShieldUnbreakable
  suffix: Unbreakable, Less Reflect, Weaker
  description: Exotic energy shield, when folded, can even fit in your pocket.
  components:
    - type: ItemToggle
      soundActivate:
        path: /Audio/Weapons/ebladeon.ogg
      soundDeactivate:
        path: /Audio/Weapons/ebladeoff.ogg
    - type: ItemToggleActiveSound
      activeSound:
        path: /Audio/Weapons/ebladehum.ogg
    - type: ItemToggleSize
      activatedSize: Huge
    - type: ComponentToggler
      components:
      - type: DisarmMalus
        malus: 0.6
    - type: Sprite
      sprite: _Starlight/Objects/Weapons/Melee/e_shield.rsi
      layers:
        - state: eshield-icon
        - state: eshield-on-base
          color: "#FFFFFF"
          visible: false
          shader: unshaded
          map: [ "shield" ]
        - state: eshield-on-overlay
          color: '#FFFFFF'
          visible: false
          shader: unshaded
          map: [ "overlay" ]
    - type: Item
      size: Small
      sprite: _Starlight/Objects/Weapons/Melee/e_shield.rsi
      heldPrefix: eshield
    - type: UseDelay
      delay: 0.5
    - type: ToggleableVisuals
      spriteLayer: shield
      inhandVisuals:
        left:
          - state: inhand-left-shield-base
            shader: unshaded
          - state: inhand-left-shield-overlay
            shader: unshaded
            map: [ "overlay" ]
        right:
          - state: inhand-right-shield-base
            shader: unshaded
          - state: inhand-right-shield-overlay
            shader: unshaded
            map: [ "overlay" ]
      modulateIgnoreLayers: [ "overlay" ]
      additionalLayers: [ "overlay" ]
    - type: PointLight
      netsync: false
      enabled: false
      radius: 2
      energy: 2
      color: blue
      castShadows: false #SL lighting optimization
    - type: ItemTogglePointLight
    - type: Reflect
      reflectProb: 0.30
      reflects:
        - Energy
    - type: Blocking
      passiveBlockModifier:
        coefficients:
          Blunt: 0.25
          Slash: 0.15
          Piercing: 0.10
          Heat: 0.15
          Structural: 0.0 # it's energy, it doesn't have structural integrity
      activeBlockModifier: # You shouldn't be able to wield it, but if for some reason you end up doing it, no more immortality.
        coefficients:
          Blunt: 0.4
          Slash: 0.35
          Piercing: 0.25
          Heat: 0.35
          Structural: 0.0
      passiveBlockFraction: 0.2
      activeBlockFraction: 0.3
    - type: Appearance
    - type: Damageable
      damageContainer: Shield
    - type: ExaminableDamage
      messages: EnergyShieldMessages
    - type: MeleeWeapon
      damage:
        types:
          Blunt: 7
          Heat: 7
    - type: StaticPrice
      price: 350
    - type: Tag
      tags:
        - Shield
    - type: Pierceable
      level: HardenedMetal
    - type: EnergyColor
      color: '#66b4fd'

- type: entity
  name: X-03 green phase shield
  parent: [BaseItem, BaseCentcommContraband ]
  id: GreenLightShield
  categories: [ DoNotMap ]
  description: Reverse engineered from a prototype that NT loaned CentComm, the wavelength has been tweaked to the glorious CentComm Green. While active, the micro-reactor cannot vent excess heat and needs to be shut off for a while to re-charge.
  components:
    - type: ItemToggle
      soundActivate:
        path: /Audio/Weapons/ebladeon.ogg
      soundDeactivate:
        path: /Audio/Weapons/ebladeoff.ogg
    - type: ItemToggleActiveSound
      activeSound:
        path: /Audio/Weapons/ebladehum.ogg
    - type: ItemToggleSize
      activatedSize: Huge
    - type: ComponentToggler
      components:
        - type: DisarmMalus
          malus: 0.6
    - type: Clothing
      quickEquip: false
      slots:
      - Belt
      - suitStorage
    - type: Sprite
      sprite: _Starlight/Objects/Weapons/Melee/nt_energy_shield.rsi
      layers:
        - state: off-icon
        - state: on-icon-base
          visible: false
          map: [ "base" ]
        - state: on-icon
          color: "#FFFFFF"
          visible: false
          shader: unshaded
          map: [ "shield" ]
        - state: on-icon-overlay
          color: "#FFFFFF"
          visible: false
          shader: unshaded
          map: [ "overlay" ]
    - type: Item
      size: Small
      sprite: _Starlight/Objects/Weapons/Melee/nt_energy_shield.rsi
      heldPrefix: off
    - type: EnergyColor
      color: "#9dfe9b"
      hackingLocked: true
      hackingUnlockQuality: Cutting
    - type: UseDelay
      delay: 0.5
    - type: ToggleableVisuals
      spriteLayer: shield
      additionalLayers:
        - base
        - overlay
      inhandVisuals:
        left:
          - state: on-inhand-left-base
            map: [ "ntshield-base" ]
          - state: on-inhand-left
            map: [ "ntshield-shield" ]
            shader: unshaded
          - state: on-inhand-left-overlay
            map: [ "ntshield-overlay" ]
            shader: unshaded
        right:
          - state: on-inhand-right-base
            map: [ "ntshield-base" ]
          - state: on-inhand-right
            map: [ "ntshield-shield" ]
            shader: unshaded
          - state: on-inhand-right-overlay
            map: [ "ntshield-overlay" ]
            shader: unshaded
      modulateIgnoreLayers:
        - base
        - overlay
    - type: ItemTogglePointLight
    - type: Reflect
      reflectProb: 0.10
      reflects:
        - Energy
      reflectEnergyDraw: 80
    - type: Appearance
    - type: PointLight
      netsync: false
      enabled: false
      radius: 2
      energy: 3
      color: "#439909"
      castShadows: false
    - type: PowerCellSlot
      cellSlotId: cell_slot
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellSmallNuclear
          locked: true
    - type: ForceQuickDraw
    - type: ToggleCellDraw
    - type: PowerCellDraw
      drawRate: 2  # watts while active
    - type: Blocking
      passiveBlockModifier:
        coefficients:
          Blunt: 1.0
          Slash: 0.8
          Piercing: 0.85
          Heat: 0.6
          Structural: 0.0 # it's energy, it doesn't have structural integrity
      activeBlockModifier:
        coefficients:
          Blunt: 0.95
          Slash: 0.75
          Piercing: 0.5
          Heat: 0.4
          Structural: 0.0
        flatReductions:
          Heat: 1
          Piercing: 1
      damageEnergyDraw: 4
    - type: Damageable
      damageContainer: Shield
    - type: ContainerContainer
      containers:
        cell_slot: !type:ContainerSlot
    - type: Tag
      tags:
        - Shield
    - type: Pierceable
      level: HardenedMetal

