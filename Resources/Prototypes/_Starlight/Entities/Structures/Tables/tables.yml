  parent: CounterBase
  name: retro wood counter
  description: Looks like a good place to put a drink down.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Tables/wood_counter.rsi
  - type: Icon
    sprite: _Starlight/Structures/Tables/wood_counter.rsi
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: counterretrowood
    base: state_
  - type: Construction
    graph: CounterRetroWood
    node: CounterRetroWood
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWood

