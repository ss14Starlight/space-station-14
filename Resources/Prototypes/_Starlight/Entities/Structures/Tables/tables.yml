- type: entity
  id: TableAbductor
  parent: TableBase
  name: alien table
  description: Literally the sturdiest thing you have ever seen.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Tables/abductor_table.rsi
  - type: Icon
    sprite: _Starlight/Structures/Tables/abductor_table.rsi
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepFloor

- type: entity
  id: TableCounterRetroSteel
  parent: CounterBase
  name: retro steel counter
  description: Looks like a good place to put a drink down.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Tables/steel_counter.rsi
  - type: Icon
    sprite: _Starlight/Structures/Tables/steel_counter.rsi
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: counterretrosteel
    base: state_
  - type: Construction
    graph: CounterRetroSteel
    node: CounterRetroSteel

- type: entity
