- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: MedipenRefiller
  name: medipen refiller
  description: Refills used medical medipens from the jugs stored in it. It needs everything the pen came with, and only takes empty pens.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Machines/medipen_refiller.rsi
    layers:
    - state: icon
    - state: panel
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      visible: false
    - state: active
      map: [ "enum.MedipenRefillerVisuals.Refilling" ]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MedipenRefillerVisuals.Refilling:
        enum.MedipenRefillerVisuals.Refilling:
          True: { visible: true }
          False: { visible: false }
  - type: WiresPanel
  - type: WiresVisuals
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: MedipenRefiller
    pens:
    - EmergencyMedipen
    - AntiPoisonMedipen
    - BruteAutoInjector
    - BurnAutoInjector
    - RadAutoInjector
    - PunctAutoInjector
    - PyraAutoInjector
    - AirlossAutoInjector
    - SpaceMedipen
    - AdvancedMedipen
    freeReagents:
    - Nothing # the puncture auto-injector carries some only for its sprite
  # Each listed pen needs at most two reagents, so room for four jugs holds what two different pens need.
  - type: Storage
    openOnActivate: false
    maxItemSize: Large
    grid:
    - 0,0,7,1 # four jugs in a row
    whitelist:
      tags:
      - ChemDispensable
  - type: EmptyOnMachineDeconstruct
    containers:
    - storagebase
  - type: ActivatableUI
    key: enum.MedipenRefillerUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.MedipenRefillerUiKey.Key:
        type: MedipenRefillerBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Machine
    board: MedipenRefillerMachineCircuitboard
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: GuideHelp
    guides:
    - Chemicals
    - Chemist
