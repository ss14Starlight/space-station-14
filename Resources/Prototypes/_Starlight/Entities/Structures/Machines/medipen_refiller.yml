- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: MedipenRefiller
  name: medipen refiller
  description: Refills used medical medipens from its tank. It needs everything the pen came with, and only takes empty pens.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Machines/medipen_refiller.rsi
    layers:
    - state: icon
    - state: active
      map: [ "enum.MedipenRefillerVisuals.Refilling" ]
      visible: false
      shader: unshaded
    - state: panel
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MedipenRefillerVisuals.Refilling:
        enum.MedipenRefillerVisuals.Refilling:
          True: { visible: true }
          False: { visible: false }
  - type: WiresPanel
  - type: WiresVisuals
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: MedipenRefiller
    pens:
    - EmergencyMedipen
    - AntiPoisonMedipen
    - BruteAutoInjector
    - BurnAutoInjector
    - RadAutoInjector
    - PunctAutoInjector
    - PyraAutoInjector
    - AirlossAutoInjector
    - SpaceMedipen
    - AdvancedMedipen
    freeReagents:
    - Nothing # the puncture auto-injector carries some only for its sprite
  - type: SolutionManager
    solutions:
    - SolutionMedipenRefillerTank
  - type: RefillableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
  - type: Plungeable
  - type: PlumbingConnectorAppearance
    offset: 0.09375
  - type: AtmosPipeColor
  - type: PlumbingDevice
    updateInterval: 1
  - type: PlumbingInlet
    solutionName: tank
    inletNames:
    - inletNorth
    - inletEast
    - inletSouth
    - inletWest
    transferAmount: 10
  - type: NodeContainer
    nodes:
      inletNorth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      inletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      inletSouth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
      inletWest:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
  - type: Machine
    board: MedipenRefillerMachineCircuitboard
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: tank
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: GuideHelp
    guides:
    - Chemicals
    - Chemist

- type: entity
  parent: Solution
  id: SolutionMedipenRefillerTank
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    id: tank
    solution:
      maxVol: 200
