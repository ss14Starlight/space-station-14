- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: MedipenRefiller
  name: medipen refiller
  description: Refills used medical medipens from the containers loaded into it. It needs everything the pen came with, and only takes empty pens.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Machines/medipen_refiller.rsi
    layers:
    - state: icon
    - state: panel
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      visible: false
    - state: active
      map: [ "enum.MedipenRefillerVisuals.Refilling" ]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MedipenRefillerVisuals.Refilling:
        enum.MedipenRefillerVisuals.Refilling:
          True: { visible: true }
          False: { visible: false }
  - type: WiresPanel
  - type: WiresVisuals
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: MedipenRefiller
    slots:
    - container1
    - container2
    - container3
    - container4
    pens:
    - EmergencyMedipen
    - AntiPoisonMedipen
    - BruteAutoInjector
    - BurnAutoInjector
    - RadAutoInjector
    - PunctAutoInjector
    - PyraAutoInjector
    - AirlossAutoInjector
    - SpaceMedipen
    - AdvancedMedipen
    freeReagents:
    - Nothing # the puncture auto-injector carries some only for its sprite
  # Each listed pen needs at most two reagents, so four slots hold what two different pens need at once.
  - type: ItemSlots
    slots:
      container1:
        ejectOnBreak: true
        whitelist:
          components:
          - FitsInDispenser
      container2:
        ejectOnBreak: true
        whitelist:
          components:
          - FitsInDispenser
      container3:
        ejectOnBreak: true
        whitelist:
          components:
          - FitsInDispenser
      container4:
        ejectOnBreak: true
        whitelist:
          components:
          - FitsInDispenser
  - type: Machine
    board: MedipenRefillerMachineCircuitboard
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: GuideHelp
    guides:
    - Chemicals
    - Chemist
