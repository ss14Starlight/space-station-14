# Central Command BEGIN

# Group
- type: faxGrouping
  id: FaxGroupingCentralCommand
  name: fax-grouping-centcomm
  order: 1000
  color: "#00b700"

# Base
- type: entity
  abstract: true
  parent: FaxMachineBase
  id: FaxMachineCentralCommand
  components:
    - type: Sprite
      layers:
        - state: icon
          map: [ "base" ]
          color: "#00b700"

# Fax machines
## Primary CC fax machine is from upstream, so it's missing here, it has order: 100.

# Central Command END
