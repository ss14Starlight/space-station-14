
#test
- type: entity
  abstract: true
  parent: BaseLathe
  id: BaseLatheFuel
  components:
  - type: ReagentSpeed
    solution: fuel
    modifiers:
      WeldingFuel: 0.2
  - type: SolutionContainerManager
    solutions:
      fuel:
        maxVol: 500
  - type: Spillable
    solution: fuel
  - type: RefillableSolution
    solution: fuel
  - type: ExaminableSolution
    solution: fuel

- type: entity
  id: TiderLathe
  parent: BaseLatheFuel
  name: makeshift anvil
  description: Every maints blacksmith's dream, a forge for producing gear in bulk.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Machines/tider_anvil.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: AssortedForgeParts
  - type: MaterialStorage
    whitelist:
      tags:
        - TiderAnvilMats
        - TiderAnvilParts
  - type: OreSiloClient
  - type: Lathe
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - TiderAnvilStatic
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container

# Departmental Techfabs

# Cargo
- type: entity
  id: CargoTechFab
#  categories: [ ShouldMapStation ] # Commented out for now, but once it's mapped on every station, un-comment
  parent: BaseLatheLube
  name: cargo techfab
  description: Prints equipment for use by the station's supply department.
  components:
  - type: Sprite
    sprite: Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: cargo
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: CargoTechFabCircuitboard
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    # Static stuff that Cargo could reasonable use
    - ToolsStatic
    - PartsStatic
    - CablesStatic
    - PaperworkStatic
    - CargoStatic
    - MaterialsStatic
    - BasicChemistryStatic
    - LightsStatic
    - PowerCellsStatic
    - ElectronicsStatic
    - ServiceStatic
    dynamicPacks:
    - StarlightAutolatheLootable
    - StarlightProtolatheLootable
    - Mining
    - SalvageSecurityWeapons # It's just the pkas + firing pin
  - type: EmagLatheRecipes
    emagStaticPacks:
    # Cargo can get the basic emag interactions
    - StarlightSecurityEmagWeaponsStatic
    - StarlightSecurityAmmoStatic
    - StarlightSyndicateAmmoStatic
  - type: MaterialStorage
    whitelist: &StandardMaterialWhitelist
      tags:
        - Sheet
        - RawMaterial
        - Ingot
  - type: OreSiloClient

