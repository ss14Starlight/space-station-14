- type: entity
  id: ScienceTechFab
#  categories: [ ShouldMapStation ] # Commented out for now, but once it's mapped on every station, un-comment
  parent: BaseLatheLube
  name: science techfab
  description: Prints equipment for use by the station's research department.
  components:
  - type: Sprite
    sprite: Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: sci
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: ScienceTechFabCircuitboard
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    # Science, being the universal "give me tool" place, can get most things in their lathe's static packs
    - ToolsStatic
    - PartsStatic
    - AtmosStatic
    - CablesStatic
    - PaperworkStatic
    - MaterialsStatic
    - StarlightContainersStatic
    - PowerCellsStatic
    - NullSpaceDrainer
    - ScienceBlueSpaceStatic
    - ChemistryStatic
    dynamicPacks:
    - StarlightAutolatheLootable
    - StarlightProtolatheLootable
    # We do want to encourage delivery to other departments though, so they'll lose quite a few dynamic packs; they can keep the service gear though, since the service fab will doubtless be looted constantly
    - ScienceBlueSpace
    - ScienceEquipment
    - ScienceExplosives
    - ScienceClothing
    - PowerCells
    - AtmosTools # Science will inevitably space themselves
    - ScienceWeapons
    - Chemistry
    - Janitor
    - Instruments
    - Equipment
    - StarlightScienceWeapons
    - WirelessCameraHandheld
  - type: EmagLatheRecipes
    emagDynamicPacks:
    # They can keep the "best thing to emag" trait
    - StarlightSurgeryDynamic
    - StarlightCyberlimbDynamic
    - StarlightCyberOrgansDynamic
    - StarlightImplantDynamic
    - StarlightBudgetCyberOrgansDynamic
    - StarlightSecurityAmmoDynamic
    - StarlightSecurityExplosives
    - StarlightSecurityEquipment
    - StarlightSecurityWeapons
    - StarlightDefenseStatic
    emagStaticPacks:
    - StarlightSecurityEmagWeaponsStatic
    - StarlightSecurityAmmoStatic
    - StarlightSyndicateAmmoStatic
  - type: MaterialStorage
    whitelist: *StandardMaterialWhitelist
  - type: StealTarget
    stealGroup: DepartmentalTechFabCircuitboard
  - type: OreSiloClient

