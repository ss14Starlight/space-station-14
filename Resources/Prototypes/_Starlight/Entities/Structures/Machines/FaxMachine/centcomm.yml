# Group
- type: faxGroup
  id: FaxGroupCentralCommand
  name: fax-group-centcomm
  order: 1000
  color: "#00b700"
  selectable: false
  selectableEmagged: true

# Base
- type: entity
  parent: FaxMachineBase
  id: FaxMachineCentralCommand
  suffix: "CC, DO NOT MAP"
  components:
    - type: Sprite
      layers:
        - state: icon
          map: [ "base" ]
          color: "#00b700"
    - type: FaxMachine
      group: FaxGroupCentralCommand
      intrinsicGroup: FaxGroupCentralCommand
      name: "CC: CentComm" # Intentionally different from the "normal" version's "Central Command".
      order: 500

# Fax machines
## Primary CC fax machine is from upstream, so it's missing here, it has order: 100.
