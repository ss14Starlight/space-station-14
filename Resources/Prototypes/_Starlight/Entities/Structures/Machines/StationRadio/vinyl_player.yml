- type: entity
  id: VinylPlayer
  name: record player
  parent: [ BaseMachinePowered, SmallConstructibleMachine ]
  description: An old school record player sat on a set of drawers. Plays out loud for whoever is nearby; the radio rig's record shelf goes on air.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Machines/StationRadio/vinylplayer.rsi
    snapCardinals: true
    granularLayersRendering: true
    layers:
    - state: icon
    - state: disk_installed
      visible: false
      map: [ "enum.VinylPlayerVisualLayers.Disc" ]
    - state: disk_label
      visible: false
      map: [ "enum.VinylPlayerVisualLayers.Label" ]
    - state: unlit
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    drawdepth: SmallObjects
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.10,-0.10,0.10,0.10"
        density: 500
        mask:
        - TabletopMachineMask
        layer:
        - BulletImpassable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Appearance
  - type: WiresPanel
  - type: WiresVisuals
  - type: VinylPlayer
    standalone: true
  - type: Machine
    board: VinylPlayerCircuitboard
  - type: ApcPowerReceiver
    powerLoad: 300 # This is a simple machine
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      vinyl: !type:ContainerSlot
  - type: ItemSlots
    slots:
      vinyl:
        name: item-slot-component-slot-name-vinyl
        whitelist:
          tags:
          - VinylSleeveFit # Records only, CDs go in the radio CD player.
  - type: GenericVisualizer
    visuals:
      enum.WiresVisualLayers.MaintenancePanel:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
