- type: entity
  parent: BaseWallmountMachine
  id: AirlockCycler
  name: airlock controller
  description: Cycles the airlock chamber. Shows the pressure behind every door and which way it is pumping.
  components:
  - type: StationAiWhitelist
  - type: WallMount
  - type: AirlockCycler
  - type: DeviceLinkSource
    ports:
    - AirlockCyclerSideA
    - AirlockCyclerSideB
    - AirlockCyclerSideC
    - AirlockCyclerSideD
    - AirlockCyclerVents
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: ActivatableUI
    key: enum.AirlockCyclerUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.AirlockCyclerUiKey.Key:
        type: AirlockCyclerBoundUserInterface
  - type: Appearance
  - type: Sprite
    sprite: _Starlight/Structures/Wallmounts/airlock_cycler.rsi
    layers:
    - state: off
      map: [ "enum.AirlockCyclerVisuals.State" ]
  - type: GenericVisualizer
    visuals:
      enum.AirlockCyclerVisuals.State:
        enum.AirlockCyclerVisuals.State:
          Off: { state: off }
          Idle: { state: standby }
          Closing: { state: process }
          Pressurizing: { state: process }
          Depressurizing: { state: process }
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
          params:
            volume: -4

- type: entity
  parent: BaseWallmountMetallic
  id: AirlockCyclerButton
  name: airlock cycle button
  description: Asks the airlock controller to cycle towards this side. Green means ready, red means it is cycling here.
  components:
  - type: StationAiWhitelist
  - type: WallMount
  - type: AirlockCyclerButton
  - type: UseDelay
    delay: 0.5
  - type: DeviceLinkSink
    ports:
    - AirlockCyclerButton
  - type: Appearance
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _Starlight/Structures/Wallmounts/airlock_cycler_button.rsi
    layers:
    - state: off
      map: [ "enum.AirlockCyclerButtonVisuals.State" ]
  - type: GenericVisualizer
    visuals:
      enum.AirlockCyclerButtonVisuals.State:
        enum.AirlockCyclerButtonVisuals.State:
          Off: { state: off }
          Standby: { state: standby }
          Cycling: { state: cycle }
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -8
