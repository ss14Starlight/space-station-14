- type: entity
  parent: WeaponEnergyTurretStationControlPanelBase
  id: WeaponEnergyTurretStatusPanel
  name: sentry turret status panel
  description: A read-only wall-mounted interface for monitoring linked sentry turrets and control panel settings.
  suffix: Status
  categories: [ ShouldMapStation ]
  components:
  - type: DeployableTurretController
    readOnly: true
  - type: TurretTargetSettings
  - type: ContainerFill
    containers:
      board:
      - WeaponEnergyTurretStatusPanelElectronics
  - type: Lock
    locked: true
    unlockOnClick: false
    showLockVerbs: false
    breakOnAccessBreaker: false

- type: entity
  parent: WeaponEnergyTurretStationControlPanelBase
  id: WeaponEnergyTurretSiliconControlPanel
  suffix: Silicon
  components:
  - type: AccessReader
    access: [["StationAi"], ["ResearchDirector"]]
  - type: ContainerFill
    containers:
      board:
      - WeaponEnergyTurretSiliconControlPanelElectronics
  - type: DeviceNetwork
    receiveFrequencyId: TurretControlSilicon
    transmitFrequencyId: TurretSilicon
  - type: TurretTargetSettings
    exemptAccessLevels:
    - BasicSilicon
    - Borg
  - type: DeployableTurretController
    accessGroups:
    - Silicon
    accessLevels:
    - BasicSilicon
    - Borg

- type: entity
  parent: WeaponEnergyTurretStationControlPanelBase
  id: WeaponEnergyTurretSolgovControlPanel
  suffix: Solgov
  components:
  - type: AccessReader
    access: [["Solgov"]]
  - type: ContainerFill
    containers:
      board:
      - ScrapGlass
  - type: TurretTargetSettings
    exemptAccessLevels:
    - Solgov
  - type: StationAiWhitelist
    enabled: false

- type: entity
  parent: WeaponEnergyTurretStationControlPanelBase
  id: WeaponEnergyTurretITGControlPanel
  suffix: ITG
  components:
  - type: AccessReader
    access: [["Salvage"], ["SalvageLead"]]
  - type: ContainerFill
    containers:
      board:
      - ScrapGlass
  - type: TurretTargetSettings
    exemptAccessLevels:
    - Salvage
    - SalvageLead
  - type: StationAiWhitelist
    enabled: false
