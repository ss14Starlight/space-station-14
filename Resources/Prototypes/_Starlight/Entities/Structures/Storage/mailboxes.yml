- type: entity
  id: BaseMailBox
  name: Base Mail Box
  description: A mail box for storing and retrieving mail.
  parent: [BaseMachinePowered, ConstructibleMachine]
  abstract: true
  components:
  - type: MailBox
  - type: InteractionOutline
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 190
        mask:
          - MachineMask
        layer:
          - MachineLayer
  - type: ContainerContainer
    containers:
      mail_storage: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Transform
  - type: Sprite
    noRot: true
    sprite: _Starlight/Structures/Storage/mailboxes.rsi
    layers:
      - state: civilian
  - type: EmptyOnMachineDeconstruct
    containers:
      - mail_storage
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 200
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:EmptyAllContainersBehaviour
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak

- type: entity
  id: CargoMailBox
  name: Cargo Mail Box
  description: A mail box for storing and retrieving mail. Allows for Cargo to store and retrieve their mail.
  parent: BaseMailBox
  components:
      - type: MailBox
        department: Cargo
      - type: Sprite
        layers:
          - state: cargo
      - type: Machine
        board: CargoMailBoxMachineCircuitboard

