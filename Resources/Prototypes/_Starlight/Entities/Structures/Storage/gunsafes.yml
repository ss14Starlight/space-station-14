## BASE SAFES

- type: entity
  id: GunSafeSL
  parent: GunSafe
  components:
  - type: Appearance
  - type: Sprite
    sprite: _Starlight/Structures/Storage/gunsafe.rsi
    noRot: true
    layers:
    - state: gunsafe
      map: ["enum.StorageVisualLayers.Base"]
    - state: gunsafe_doors
      map: ["enum.StorageVisualLayers.Door"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
  - type: EntityStorageVisuals
    stateBaseClosed: gunsafe
    stateDoorOpen: gunsafe_open
    stateDoorClosed: gunsafe_doors

- type: entity
  id: GunSafeBaseArmorySL
