- type: entity
  id: BaseShippingContainer
  name: shipping container
  description: Reinforced steel frames meant to survive being thrown around by lazy Cargo Technicians who forged their crane licenses.
  placement:
    mode: SnapgridCenter
  components:
  - type: SpriteFade
  - type: Sprite
    sprite: _Starlight/Structures/Storage/shipping_container.rsi
    drawdepth: Overdoors
    state: shipping_container
  - type: Transform
    anchored: true
  - type: Clickable
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.45,-0.6,1.45,0.6"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,9,6
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Effects/metal_slam4.ogg
        params:
          variation: 0.05
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -5
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 5
            max: 8
  - type: Tag
    tags:
      - Structure

