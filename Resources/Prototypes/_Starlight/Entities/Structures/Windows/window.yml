- type: entity
  parent: TintedWindow
  id: TintedWindowTransparent
  suffix: Transparent
  components:
  - type: Occluder
    enabled: false

# Honeypots BEGIN
# I tried inheritance on these guys, but ran into various things not inheriting, so YAML anchors it is.

# Reinforced window

## Full size

### Normal
- type: entity
  parent: [MarkerBase, ReinforcedWindow]
  id: ReinforcedWindowHoneypot
  description: &honeypotDesc Notifies admins when it gets damaged. Can be destroyed as normal.
  suffix: &honeypotSuffix Honeypot
  components:
    - type: ReplaceOnInit
      proto: ReinforcedWindow
      overrides: &honeypotOverrides
        - type: AdminNotifyOnDamage
          subject: "honeypot"
    - &glassReinforcedWindowSprite
      type: Sprite
      sprite: Structures/Windows/reinforced_window.rsi
      layers:
        - sprite: _Starlight/Markers/cross.rsi
          state: orange
          scale: &scale 1.25,1.25
        - state: full

### Indestructible
- type: entity
  parent: [MarkerBase, ReinforcedWindow]
  id: ReinforcedWindowHoneypotIndestructible
  description: &honeypotDescIndestructible Notifies admins when it gets damaged and is secretly indestructible.
  suffix: &honeypotSuffixIndestructible Honeypot, Indestructible
  components:
    - type: ReplaceOnInit
      proto: ReinforcedWindow
      overrides: &honeypotOverridesIndestructible
        - type: AdminNotifyOnDamage
          subject: "honeypot"
        - type: Destructible
          thresholds: []
    - *glassReinforcedWindowSprite

