- type: entity
  parent: TintedWindow
  id: TintedWindowTransparent
  suffix: Transparent
  components:
  - type: Occluder
    enabled: false

- type: entity
  id: IcePillars
  parent: BaseStructure
  name: ice pillar
  description: A sturdy and see-through pillar of ice.
  components:
  - type: InteractionOutline
  - type: Sprite
    noRot: true
    sprite: _Starlight/Objects/Magic/magicactions.rsi
    layers:
    - state: icepillars
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 190
        mask:
        - MachineMask
        layer:
        - GlassLayer
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
