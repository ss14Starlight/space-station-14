- type: entity
  parent: TintedWindow
  id: TintedWindowTransparent
  suffix: Transparent
  components:
  - type: Occluder
    enabled: false

# Honeypots BEGIN
# I tried inheritance on these guys, but they really didn't want to, so copy-paste it is :(

# Solid wall
- type: entity
  parent: WallSolid
  id: WallSolidHoneypot
  description: &honeypotDesc Notifies admins when it gets damaged and is secretly indestructible.
  suffix: &honeypotSuffix Honeypot, Do Not Map
  components:
    - type: ReplaceOnInit
      proto: WallSolid
      overrides: &honeypotOverrides
        - type: AdminNotifyOnDamage
          subject: "honeypot"
        - type: Destructible
          thresholds: []
    - &honeypotSprite
      type: Sprite
      color: "#ffa033"

# Reinforced wall
- type: entity
  parent: WallReinforced
  id: WallReinforcedHoneypot
  description: *honeypotDesc
  suffix: *honeypotSuffix
  components:
    - type: ReplaceOnInit
      proto: WallReinforced
      overrides: *honeypotOverrides
    - *honeypotSprite

