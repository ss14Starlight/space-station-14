- type: entity
  parent: TintedWindow
  id: TintedWindowTransparent
  suffix: Transparent
  components:
  - type: Occluder
    enabled: false

# Honeypots BEGIN
# I tried inheritance on these guys, but ran into various things not inheriting, so YAML anchors it is.

# Solid wall

## Normal
- type: entity
  parent: WallSolid
  id: WallSolidHoneypot
  description: &honeypotDesc Notifies admins when it gets damaged. Can be destroyed as normal.
  suffix: &honeypotSuffix Honeypot, Do Not Map
  components:
    - type: ReplaceOnInit
      proto: WallSolid
      overrides: &honeypotOverrides
        - type: AdminNotifyOnDamage
          subject: "honeypot"
    - &honeypotSprite
      type: Sprite
      color: "#999999"

## Indestructible
- type: entity
  parent: WallSolid
  id: WallSolidHoneypotIndestructible
  description: &honeypotDescIndestructible Notifies admins when it gets damaged and is secretly indestructible.
  suffix: &honeypotSuffixIndestructible Honeypot, Indestructible, Do Not Map
  components:
    - type: ReplaceOnInit
      proto: WallSolid
      overrides: &honeypotOverridesIndestructible
        - type: AdminNotifyOnDamage
          subject: "honeypot"
        - type: Destructible
          thresholds: []
    - *honeypotSprite

