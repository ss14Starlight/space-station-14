- type: entity
  id: HolosignEngineeringWarning
  name: engineering warning barrier
  description: A barrier of non-solid light, warning everyone of danger around it.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _Starlight/Structures/Holo/engineering.rsi
    state: icon
  - type: TimedDespawn
    lifetime: 180
  - type: PointLight
    enabled: true
    radius: 3
    color: orange
    castShadows: false
  - type: Clickable

- type: entity
  id: HolosignFalseShutter
  parent: HolosignWetFloor
  name: shutter?
  description: A shutter, you think?
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Holo/shutter.rsi
    state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
  - type: TimedDespawn
    lifetime: 180
  - type: Occluder
