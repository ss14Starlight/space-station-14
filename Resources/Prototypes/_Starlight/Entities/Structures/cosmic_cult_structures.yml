##################### SHUTTLE CORE CONTROL

##################### CHAIR
- type: entity
  name: malign settee
  id: CosmicChair
  parent: SeatBase
  placement:
    mode: SnapgridCenter
  components:
  - type: CosmicCultExamine
    cultistText: cosmic-examine-text-forthecult
  - type: Sprite
    sprite: _Starlight/Structures/CosmicCult/cosmicchair.rsi
    state: chair
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic

##################### PILLAR
- type: entity
  parent: BaseStructure
  id: CosmicObelisk
  name: malign obelisk
  description: A mysterious-yet-inert sturcture. Unsettling.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/CosmicCult/cosmicpillar.rsi
    offset: 0, 0.5
    layers:
      - state: icon
    drawdepth: Mobs
    noRot: true
  - type: CosmicCultExamine
    cultistText: cosmic-examine-text-forthecult
  - type: SpriteFade
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.1,0.2,0.375"
        mask:
        - LargeMobMask
        layer:
        - WallLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic

##################### THRUSTER

##################### LAMP
- type: entity
  id: CosmicLamp
  description: A mote of un-light shimmers within.
  suffix: Always Powered
  name: malign light
  placement:
    mode: SnapgridCenter
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: Transform
  - type: CosmicCultExamine
    cultistText: cosmic-examine-text-forthecult
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: _Starlight/Structures/CosmicCult/cosmiclight.rsi
    drawdepth: Mobs
    layers:
      - state: base
      - state: glow
        shader: unshaded
  - type: PointLight
    color: "#42a4ae" # 5000K color temp
    energy: 2
    radius: 8
    softness: 1
    offset: "0, -0.5"
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: RCDDeconstructable
    deconstructable: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors: #excess damage, don't spawn entities.
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak

##################### SPIRE
- type: entity
  id: CosmicVacuousSpire
  parent: BaseStructure
  name: vacuous spire
  description: Also known as the "chuuni fork".
  components:
  - type: Pullable
  - type: Anchorable
  - type: Physics
    bodyType: Dynamic
  - type: Transform
    anchored: false
  - type: AtmosDevice
    joinSystem: true
  - type: CosmicSpire
  - type: CosmicCultExamine
    cultistText: cosmic-examine-text-forthecult
  - type: SpriteFade
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.375,0.25,0.4"
        density: 200
        mask:
        - LargeMobMask
        layer:
        - WallLayer
  - type: Sprite
    sprite: _Starlight/Structures/CosmicCult/cosmicspire.rsi
    offset: 0, 0.5
    layers:
      - state: base-disabled
        map: ["base"]
      - state: overlay
        map: ["vfx"]
        shader: unshaded
        visible: false
    drawdepth: Mobs
    noRot: true
  - type: GenericVisualizer
    visuals:
      enum.SpireVisuals.Status:
        base:
          On: {state: base-enabled}
          Off: {state: base-disabled}
        vfx:
          On: {visible: True}
          Off: {visible: False}
  - type: Appearance
  - type: AmbientSound
    enabled: false
    volume: -5
    range: 15
    sound:
      path: /Audio/_Starlight/Effects/CosmicCult/spire_draining.ogg
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: RCDDeconstructable
    deconstructable: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors: #excess damage, don't spawn entities.
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
  - type: PointLight
    radius: 2
    energy: 1.6
    enabled: false
    castShadows: false
    color: "#42a4ae"

- type: entity
  id: AltarCosmic
  parent: AltarNanotrasen
  name: cosmic altar
  description: Altar of.. Something.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/CosmicCult/altar.rsi
    layers:
    - state: cosmic
    - state: cosmic_light
      shader: unshaded
  - type: Icon
    sprite: _Starlight/Structures/CosmicCult/altar.rsi
    state: cosmic
  - type: PointLight
    radius: 1.5
    energy: 2.5
    color: "#42a4ae"

- type: entity
  id: CosmicTable
  parent: CounterBase
  name: malign table
  description: Unfathomably, cosmically.. Square.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/CosmicCult/cosmictable.rsi
  - type: Icon
    sprite: _Starlight/Structures/CosmicCult/cosmictable.rsi
    state: full
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: CosmicCultExamine
    cultistText: cosmic-examine-text-forthecult
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: cosmictable
    base: state_
