- type: entity
  id: EaselBase
  parent: BaseStructure
  name: easel
  description: an easel, sturdy enough to hold a large canvas.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Furniture/easel.rsi
    layers:
    - state: easel_base
  - type: ItemSlots
    slots:
      item:
        name: item-slot-component-slot-name-easel-canvas
        whitelist:
          tags:
          - CanvasBlank
          - CanvasPaintedRK
          - CanvasPaintedSpooky
          - CanvasPaintedCheesePizza
          - CanvasPaintedPepperoniPizza
          - CanvasPaintedWave
          - CanvasPaintedSaturn
          - CanvasPaintedSkullCig
          - CanvasPaintedStarry
          - CanvasPaintedGodo
          - CanvasPaintedVengefulWeh
          - CanvasPaintedLiminal
          - CanvasPaintedFelinoidJudgement
  - type: ItemMapper
    mapLayers:
      easel_canvas:
        whitelist:
          tags:
            - CanvasBlank
      canvas_ratking:
        whitelist:
          tags:
            - CanvasPaintedRK
      canvas_spooky:
        whitelist:
          tags:
            - CanvasPaintedSpooky
      canvas_cheesepizza:
        whitelist:
          tags:
            - CanvasPaintedCheesePizza
      canvas_pepperonipizza:
        whitelist:
          tags:
            - CanvasPaintedPepperoniPizza
      canvas_wave:
        whitelist:
          tags:
            - CanvasPaintedWave
      canvas_saturn:
        whitelist:
          tags:
            - CanvasPaintedSaturn
      canvas_skullcig:
        whitelist:
          tags:
            - CanvasPaintedSkullCig
      canvas_starry:
        whitelist:
          tags:
            - CanvasPaintedStarry
      canvas_godo:
        whitelist:
          tags:
            - CanvasPaintedGodo
      canvas_vengeful_weh:
        whitelist:
          tags:
            - CanvasPaintedVengefulWeh
      canvas_liminal:
        whitelist:
          tags:
           - CanvasPaintedLiminal
      canvas_felinoid_judgement:
        whitelist:
          tags:
           - CanvasPaintedFelinoidJudgement
  - type: Appearance
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Pullable
  - type: Anchorable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
        showEnts: False
        occludes: True
      item: !type:ContainerSlot
        ent: null
        showEnts: False
        occludes: True
  - type: Transform
    noRot: true
  - type: Construction
    graph: EaselSL
    node: easelBase

- type: entity
  id: BlankCanvas
  parent: BaseItem
  name: blank canvas
  description: a blank canvas, waiting to be made into a masterpiece. 
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Furniture/easel.rsi
    layers:
    - state: canvas_base
  - type: Item
    size: Large
  - type: MultiHandedItem
  - type: Tag
    tags:
    - CanvasBlank
  - type: Construction
    graph: EaselSL
    node: canvasBlank

