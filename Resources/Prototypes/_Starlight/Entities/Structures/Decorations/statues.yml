- type: entity
  id: StatueStoneCUP
  parent: BaseStructure
  name: stone tea statue
  description: A stone statue depicting a tea-drinking revolutionary. It stands as a symbol of unity and shared purpose among comrades.
  components:
    - type: Sprite
      noRot: true
      sprite: _Starlight/Structures/Decorations/Statues.rsi
      state: stone_tea
      drawdepth: Mobs
      offset: "0.0,0.5"

- type: entity
  id: StatueOneYearAnniversary
  parent: BaseStructure
  name: monument to the first year
  description: |
    A marble statue of an idealized employee, made to commemorate the first anniversary of NanoTrasen control over the Starlight Sector.
    While ostensibly celebratory, it seems oddly mournful. Many died to make this possible.
  components:
    - type: Sprite
      sprite: _Starlight/Structures/Decorations/Statues.rsi
      state: one_year_anniversary
      drawdepth: Mobs
      offset: "0.0,0.5"

- type: entity
  id: Phoronic
  parent: BaseStructure
  name: phoronic cascade
  description: A huge structure made of pure plasma. Dark energy roils and bursts within it.
  components:
    - type: StationAnchor
    - type: Transform
      anchored: true
    - type: Sprite
      noRot: true
      drawdepth: Mobs
      offset: "0.0,0.5"
      sprite: _Starlight/Structures/Decorations/Phoronic.rsi
      state: phoronic
    - type: SpriteFade
    - type: TheDarkImmune
      ranged: true
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeAabb
            bounds: "-0.45,-0.45,0.45,0.45"
          density: 60
          mask:
            - MachineMask
          layer:
            - MidImpassable
            - LowImpassable
        fix2:
          shape: !type:PhysShapeCircle
            radius: 5
          density: 0
          hard: false
          mask:
            - None
          layer:
            - MidImpassable

- type: entity
  id: EndymionMemorial
  parent: BaseStructure
  name: Endymion Memorial
  description: |
    A memorial commissioned in 2143 to commemorate the lives lost aboard the Endymion and Selene, carved from a recovered fragment of the ships' hull and shaped into their likeness. The names of the lost crew are carved on it.
    "In reaching to the future, we must never forget those who came before us."
    - TSF representative Kennedy Sunderland
  components:
    - type: Openable
      openOnActivate: true
      closeable: false
      sound:
        path: /Audio/Effects/curtain_openclose.ogg
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.OpenableVisuals.Opened:
          enum.OpenableVisuals.Layer:
            True: { state: open }
            False: { state: closed }
    - type: Sprite
      snapCardinals: true
      noRot: true
      sprite: _Starlight/Structures/Decorations/Statues(3x2).rsi
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-1.0,-1.0,0.49,0.49"
          density: 60
          mask:
            - MachineMask
          layer:
            - MidImpassable
            - LowImpassable
    - type: Pullable
    - type: Tag
      tags:
        - Structure
