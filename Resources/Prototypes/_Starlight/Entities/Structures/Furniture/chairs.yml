#Regal Chair
- type: entity
  name: regal chair
  id: ChairRegal
  parent: UnanchoredChairBase
  description: A gilded chair. You think this might be paint actually.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Furniture/Chairs/regal_chair.rsi
    state: base
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 1
            max: 1
  - type: Tag
    tags:
    - Wooden
  - type: StaticPrice
    price: 250
  - type: Construction
    graph: ChairSL
    node: chairRegal

