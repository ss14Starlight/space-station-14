- type: entity
  id: BaseTableFlipped
  abstract: true
  description: Shoved onto its side and pressed into service as cover. Shots crossing it sometimes don't make it.
  components:
  - type: ProjectileCover
    blockChance: 0.45
    pointBlankRange: 1.5
  - type: Sprite
    noRot: false
    layers:
    - state: flipped_0
  - type: Icon
    state: flipped_0
  - type: IconSmooth
    mode: Linear
    base: flipped_
  - type: PlaceableSurface
    isPlaceable: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask:
        - TableMask
        layer:
        - TableLayer
        - BulletImpassable
  - type: Tag
    tags:
    - ForceNoFixRotations

- type: entity
  id: TableFlipped
  parent: [BaseTableFlipped, Table]
  suffix: Flipped
  name: flipped table
  components:
  - type: FlippedStructure
    uprightPrototype: Table
  - type: IconSmooth
    key: TableFlipped

