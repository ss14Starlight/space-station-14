- type: entity
  id: FloorLight
  name: floor light
  description: "An always powered floor light."
  suffix: Always Powered
  parent: BaseStructure
  components:
    - type: Sprite
      sprite: _Paradise/Structures/Lighting/floorlights.rsi
      snapCardinals: false
      drawdepth: FloorObjects
      noRot: true
      layers:
        - map: ["enum.PoweredLightLayers.Base"]
          state: base
        - map: ["enum.PoweredLightLayers.Glow"]
          state: glow
          shader: unshaded
      state: base
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeCircle
            radius: 0.1
          density: 100
          mask:
            - None
          layer:
            - TabletopMachineLayer
    - type: PointLight
      radius: 10
      energy: 2.5
      softness: 0.9
      color: "#FFE4CE"
    - type: InteractionOutline
    - type: Damageable
      damageModifierSet: Metallic
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetSteel1:
                  min: 1
                  max: 1
            - !type:EmptyAllContainersBehaviour
            - !type:PlaySoundBehavior
              sound:
                collection: MetalGlassBreak
    - type: StaticPrice
      price: 75
    - type: RequireProjectileTarget
    - type: ESSparkOnHit

- type: entity
  id: PoweredFloorLightEmpty
  name: floor light
  description: "A lightbulb you can walk on without breaking it, amazing."
  suffix: Empty
  parent: FloorLight
  components:
    - type: Sprite
      state: empty
    - type: PointLight
      enabled: false
    - type: PoweredLight
      bulb: Bulb
    - type: ContainerContainer
      containers:
        light_bulb: !type:ContainerSlot
    - type: ApcPowerReceiver
    - type: ExtensionCableReceiver
    - type: DeviceNetwork
      deviceNetId: Wireless
      receiveFrequencyId: SmartLight
    - type: WirelessNetworkConnection
      range: 200
    - type: DeviceLinkSink
      ports:
        - On
        - Off
        - Toggle
    - type: Construction
      graph: FloorLightFixture
      node: floorLight
    - type: Appearance
    - type: PoweredLightVisuals
      blinkingSound:
        path: "/Audio/Machines/light_tube_on.ogg"
      spriteStateMap:
        empty: empty
        off: base
        on: base
        broken: broken
        burned: burned
    - type: DamageOnInteract
      damage:
        types:
          Heat: 2
      popupText: powered-light-component-burn-hand

- type: entity
  id: PoweredFloorLight
  name: floor light
  suffix: ""
  parent: PoweredFloorLightEmpty
  components:
    - type: Sprite
      state: base
    - type: PointLight
      enabled: true
    - type: PoweredLight
      hasLampOnSpawn: LightBulb
    - type: AmbientOnPowered
    - type: AmbientSound
      volume: -15
      range: 3
      sound:
        path: /Audio/Ambience/Objects/light_hum.ogg

- type: entity
  id: PoweredFloorLightLed
  name: floor light
  suffix: LED
  parent: PoweredFloorLight
  components:
    - type: PointLight
      enabled: true
      radius: 8
      energy: 1
      softness: 1
      color: "#EEEEFF"
    - type: PoweredLight
      hasLampOnSpawn: LedLightBulb
    - type: DamageOnInteract
