- type: entity
  id: LightFloorEmpty
  name: light floor
  description: "A walking surface that doubles as area lighting. Unscrew the cover to change the bulb."
  suffix: Empty
  parent: PoweredFloorLightEmpty
  components:
    - type: Sprite
      sprite: _Paradise/Tiles/light_floor.rsi
      drawdepth: FloorTiles
      layers:
        - map: ["enum.PoweredLightLayers.Base"]
          state: light_open
        - map: ["enum.PoweredLightLayers.Glow"]
          state: light_open_bulb_glow
          shader: unshaded
          visible: false
        - map: ["enum.LightFloorLayers.Cover"]
          state: light_off
          visible: false
        - map: ["enum.LightFloorLayers.CoverGlow"]
          state: light_on
          shader: unshaded
          visible: false
      state: light_open
    - type: Construction
      graph: LightFloor
      node: lightFloor
    - type: PoweredLightVisuals
      spriteStateMap:
        empty: light_open
        off: light_open_bulb
        on: light_open_bulb
        broken: light_open_bulb_broken
        burned: light_open_bulb_burned
    - type: WiresPanel
      open: true
    - type: LightFloor
    - type: Physics
      canCollide: false

- type: entity
  id: LightFloor
  suffix: ""
  parent: LightFloorEmpty
  components:
    - type: Sprite
      layers:
        - map: ["enum.PoweredLightLayers.Base"]
          state: light_open_bulb
        - map: ["enum.PoweredLightLayers.Glow"]
          state: light_open_bulb_glow
          shader: unshaded
          visible: false
        - map: ["enum.LightFloorLayers.Cover"]
          state: light_off
        - map: ["enum.LightFloorLayers.CoverGlow"]
          state: light_on
          shader: unshaded
          visible: false
    - type: PointLight
      enabled: true
    - type: PoweredLight
      hasLampOnSpawn: LightBulb
    - type: WiresPanel
      open: false

- type: entity
  id: FloorTileItemLight
  name: light floor tile
  description: "A wired glass tile. Lay it on a floor, fit a light bulb, then screw the cover shut."
  parent: FloorTileItemBase
  components:
    - type: Sprite
      sprite: _Paradise/Tiles/light_floor.rsi
      state: tile
    - type: Item
      heldPrefix: white
    - type: FloorTile
      outputs:
        - Plating
    - type: Stack
      stackType: FloorTileLight
    - type: Construction
      graph: LightFloor
      node: lightTile
    - type: SpawnAfterInteract
      prototype: LightFloorEmpty
      doAfter: 0.5
      removeOnInteract: true

- type: stack
  parent: BaseTileStack
  id: FloorTileLight
  name: stack-light-tile
  icon: { sprite: /Textures/_Paradise/Tiles/light_floor.rsi, state: tile }
  spawn: FloorTileItemLight

- type: entity
  id: LightFloorAlwaysPowered
  name: light floor
  description: "A walking surface that doubles as area lighting. This one is sealed and never goes out."
  suffix: Always Powered
  parent: FloorLight
  components:
    - type: Sprite
      sprite: _Paradise/Tiles/light_floor.rsi
      drawdepth: FloorTiles
      layers:
        - map: ["enum.LightFloorLayers.Cover"]
          state: light_off
        - map: ["enum.LightFloorLayers.CoverGlow"]
          state: light_on
          shader: unshaded
      state: light_off
    - type: Appearance
    - type: LightFloor
    - type: PointLight
      radius: 4
      energy: 1.5
    - type: Physics
      canCollide: false

