# Chamber atmosphere - every threshold is ignored, so linking these to an air
# alarm never raises an alert whatever the chamber is filled with. Readings still
# report to the alarm UI.

# Air Sensor

- type: entity
  abstract: true
  parent: AirSensorBase
  id: AirSensorChamberBase
  suffix: Chamber Atmosphere
  components:
  - type: AtmosMonitor
    temperatureThresholdId: ignore
    pressureThresholdId: ignore
    gasThresholdPrototypes:
      Oxygen: ignore
      Nitrogen: ignore
      CarbonDioxide: ignore
      Plasma: ignore
      Tritium: ignore
      WaterVapor: ignore
      Ammonia: ignore
      NitrousOxide: ignore
      Frezon: ignore
      BZ: ignore
      Healium: ignore
      Nitrium: ignore
      Pluoxium: ignore
      Hydrogen: ignore
      HyperNoblium: ignore
      ProtoNitrate: ignore
      Zauker: ignore
      Halon: ignore
      Helium: ignore
      AntiNoblium: ignore
      Ulnitranium: ignore
      ZXA: ignore

- type: entity
  parent: [AirSensorChamberBase, AirSensor]
  id: AirSensorChamber
  description: An air sensor set up for use in chambers. It reports readings without raising alarms.

# Gas Vent

- type: entity
  parent: [AirSensorChamberBase, GasVentPump]
  id: GasVentPumpChamber
  description: An air vent set up for use in chambers. It reports readings without raising alarms.
  components:
  - type: AtmosPipeLayers
    alternativePrototypes:
      Primary: GasVentPumpChamber
      Secondary: GasVentPumpChamberAlt1
      Tertiary: GasVentPumpChamberAlt2
      Quaternary: GasVentPumpChamberAlt3
      Quinary: GasVentPumpChamberAlt4

- type: entity
  parent: [AirSensorChamberBase, GasVentPumpChamber, GasVentPumpAlt1]
