# Sauna atmosphere - water vapour is ignored and left unscrubbed, temperature uses
# saunaTemperature. Every other gas keeps its station threshold.

# Air Sensor

- type: entity
  abstract: true
  parent: AirSensorBase
  id: AirSensorSaunaBase
  suffix: Sauna Atmosphere
  components:
  - type: AtmosMonitor
    temperatureThresholdId: saunaTemperature
    gasThresholdPrototypes:
      Oxygen: stationOxygen
      Nitrogen: stationNitrogen
      CarbonDioxide: stationCO2
      Plasma: stationPlasma
      Tritium: stationTritium
      WaterVapor: ignore
      Ammonia: stationAmmonia
      NitrousOxide: stationNO
      Frezon: danger
      BZ: stationBZ
      Healium: stationHealium
      Nitrium: danger
      Pluoxium: stationPluoxium
      Hydrogen: danger
      HyperNoblium: stationHyperNoblium
      ProtoNitrate: danger
      Zauker: danger
      Halon: danger
      Helium: stationHelium
      AntiNoblium: danger
      Ulnitranium: stationUlnitranium
      ZXA: stationZXA

- type: entity
  parent: [AirSensorSaunaBase, AirSensor]
  id: AirSensorSauna
  description: An air sensor set up for use in saunas. It ignores humidity, and heat until it turns harmful.

# Gas Vent

- type: entity
  parent: [AirSensorSaunaBase, GasVentPump]
  id: GasVentPumpSauna
  description: An air vent set up for use in saunas. It ignores humidity, and heat until it turns harmful.
  components:
  - type: AtmosPipeLayers
    alternativePrototypes:
      Primary: GasVentPumpSauna
      Secondary: GasVentPumpSaunaAlt1
      Tertiary: GasVentPumpSaunaAlt2
      Quaternary: GasVentPumpSaunaAlt3
      Quinary: GasVentPumpSaunaAlt4

