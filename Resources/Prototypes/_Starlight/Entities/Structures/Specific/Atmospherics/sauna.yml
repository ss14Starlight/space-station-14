# Gas Scrubber

# filterGases replaces the inherited list wholesale, so this is the default set
# with WaterVapor dropped.
- type: entity
  parent: [AirSensorSaunaBase, GasVentScrubber]
  id: GasVentScrubberSauna
  description: An air scrubber set up for use in saunas. It leaves water vapour where it is.
  components:
  - type: AtmosPipeLayers
    alternativePrototypes:
      Primary: GasVentScrubberSauna
      Secondary: GasVentScrubberSaunaAlt1
      Tertiary: GasVentScrubberSaunaAlt2
      Quaternary: GasVentScrubberSaunaAlt3
      Quinary: GasVentScrubberSaunaAlt4
  - type: GasVentScrubber
    filterGases:
    - CarbonDioxide
    - Plasma
    - Tritium
    - Ammonia
    - NitrousOxide
    - Frezon
    - BZ
    - Healium
    - Nitrium
    - Hydrogen
    - HyperNoblium
    - ProtoNitrate
    - Zauker
    - Halon
    - Helium
    - AntiNoblium
    - ZXA

- type: entity
  parent: [AirSensorSaunaBase, GasVentScrubberSauna, GasVentScrubberAlt1]
  id: GasVentScrubberSaunaAlt1
  categories: [ HideSpawnMenu ]
  description: An air scrubber set up for use in saunas. It leaves water vapour where it is.

- type: entity
  parent: [AirSensorSaunaBase, GasVentScrubberSauna, GasVentScrubberAlt2]
  id: GasVentScrubberSaunaAlt2
  categories: [ HideSpawnMenu ]
  description: An air scrubber set up for use in saunas. It leaves water vapour where it is.

- type: entity
  parent: [AirSensorSaunaBase, GasVentScrubberSauna, GasVentScrubberAlt3]
  id: GasVentScrubberSaunaAlt3
  categories: [ HideSpawnMenu ]
  description: An air scrubber set up for use in saunas. It leaves water vapour where it is.

- type: entity
  parent: [AirSensorSaunaBase, GasVentScrubberSauna, GasVentScrubberAlt4]
  id: GasVentScrubberSaunaAlt4
  categories: [ HideSpawnMenu ]
  description: An air scrubber set up for use in saunas. It leaves water vapour where it is.

# Air Alarm

# Auto mode off, otherwise an alarm state change reapplies the hardcoded filter
# defaults and the sauna scrubs its own steam. Same reason as AirAlarmFreezer.
# Group Invalid drops it from the alerts console queries.
- type: entity
  parent: AirAlarmUnlocked
  id: AirAlarmSauna
  suffix: Sauna Atmosphere, unlocked, auto mode disabled
  description: An air alarm set up for use in saunas. It doesn't report to the station's alert console.
  components:
  - type: AirAlarm
    autoMode: false
  - type: AtmosAlertsDevice
    group: Invalid
