# Air Sensor

- type: entity
  abstract: true
  parent: AirSensorBase
  id: AirSensorColdWeatherBase
  suffix: ColdWeather
  components:
  - type: AtmosMonitor
    temperatureThresholdId: stationTemperatureColdWeather # tuned for cold atmospheres / winter clothing
    pressureThresholdId: stationPressureColdWeather # cold air is surprisingly breathable (dense)
    gasThresholdPrototypes:
      Oxygen: stationOxygen
      Nitrogen: stationNitrogen
      CarbonDioxide: stationCO2
      Plasma: stationPlasma
      Tritium: stationTritium
      WaterVapor: stationWaterVapor
      Ammonia: stationAmmonia
      NitrousOxide: stationNO
      Frezon: danger
      # Funkystation Start: Funky atmos - /tg/ gases
      BZ: stationBZ
      Healium: stationHealium
      Nitrium: voxNitrium
      Pluoxium: stationPluoxium
      Hydrogen: danger
      HyperNoblium: stationHyperNoblium
      ProtoNitrate: danger
      Zauker: danger
      Halon: voxHalon
      Helium: stationHelium
      AntiNoblium: danger
      # Funkystation End: Funky atmos - /tg/ gases
      # Starlight start, Starlight gases
      Ulnitranium: stationUlnitranium
      ZXA: stationZXA
      # Starlight end

- type: entity
  parent: [AirSensorColdWeatherBase, AirSensor]
  id: AirSensorColdWeather

# Air Alarm

- type: entity
  parent: AirAlarm
  id: AirAlarmColdWeather
  name: air alarm
  description: An air alarm set up for use in cold weather. It tolerates freezing temperatures and low pressure.
  suffix: ColdWeather
  components:
  - type: AirAlarm

# Gas Vent

- type: entity
  abstract: true
  id: GasVentPumpColdWeatherBase
  suffix: ColdWeather
  components:
