    alternativePrototypes:
      Primary: GasVentPumpColdWeather
      Secondary: GasVentPumpColdWeatherAlt1
      Tertiary: GasVentPumpColdWeatherAlt2
      Quaternary: GasVentPumpColdWeatherAlt3
      Quinary: GasVentPumpColdWeatherAlt4

- type: entity
  parent: [AirSensorColdWeatherBase, GasVentPumpColdWeatherBase, GasVentPumpAlt1]
  id: GasVentPumpColdWeatherAlt1
  categories: [ HideSpawnMenu ]

- type: entity
