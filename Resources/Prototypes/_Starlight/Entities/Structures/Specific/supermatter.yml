- type: entity
  id: CascadChunk
  parent: BaseItem
  name: Cascad Chunk
  description: A chunk of degenerate supermatter. The remains are still dangerously radioactive.
  components:
    - type: Sprite
      sprite: Objects/Consumable/Food/Baked/cake.rsi
      layers:
        - state: suppermatter-shard
    - type: Item
      size: Normal
    - type: RadiationSource
      intensity: .25
      slope: 0.25
    - type: Extractable
      juiceSolution:
        reagents:
        - ReagentId: Tritium
          Quantity: 6
        - ReagentId: Plasma
          Quantity: 2
    - type: PointLight
      color: "#FFFF00"
      radius: 2
      energy: 2.5
    - type: StaticPrice
      price: 150
    - type: Damageable
      damageContainer: Inorganic
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 1
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            path: /Audio/_Starlight/Effects/supermatter/emitter2.ogg
        - !type:ExplodeBehavior
        - !type:DoActsBehavior
          acts: ["Destruction"]
    - type: DamageOnLand
      damage:
        types:
          Blunt: 3
    - type: Explosive
      explosionType: Radioactive
      totalIntensity: 5
      tileBreakScale: 0.00001
