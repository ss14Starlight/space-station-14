# Why another one? because Suffix is not showed in construction its will only show "anomaly core", this gives more details, however your not needed to use it.
- type: entity
  parent: AnomalyCoreShadow
  id: CraftingAnomalyCoreShadow
  name: shadow anomaly core

# Acts like a lost property bag for items left behind by budget bluespace teleportation
- type: entity
  parent: BaseStorageItem
  id: AnomalyCoreBluespaceBelongings
  name: bluespace storage core
  suffix: Bluespace, Belongings
  components:
  - type: Sprite
    sprite: Structures/Specific/Anomalies/Cores/bluespace_core.rsi
    noRot: true
    layers:
    - state: core
  - type: Item
    size: Tiny
  - type: PointLight
    radius: 1.5
    energy: 3.5
    color: "#00ccff"
    castShadows: false
  - type: Storage
    maxItemSize: Ginormous
    storageOpenSound:
      collection: RadiationPulse
    grid:
    - 0,0,19,19
  - type: ReadOnlyStorage
