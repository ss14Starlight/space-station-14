- type: entity
  parent: BaseSMES
  id: SMESBlue
  suffix: Hyper Advanced, 64MJ
  name: hyper advanced SMES
  description: An even-higher-capacity superconducting magnetic energy storage (SMES) unit.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Power/smes.rsi #SL Edit
    snapCardinals: true
    layers:
    - state: smes-blue
    - state: smes-blue-fan
    - map: [ "enum.SmesVisualLayers.Charge" ]
      state: "smes-og1" # -og0 does not exist
      shader: unshaded
      visible: false
    - map: [ "enum.SmesVisualLayers.Input" ]
      state: "smes-oc0"
      shader: unshaded
    - map: [ "enum.SmesVisualLayers.Output" ]
      state: "smes-op1"
      shader: unshaded
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: smes-blue-open
  - type: Machine
    board: SMESHyperAdvancedMachineCircuitboard
  - type: Battery
    maxCharge: 64000000
    startingCharge: 64000000
  - type: PowerMonitoringDevice
    group: SMES
    sourceNode: input
    loadNode: output
    collectionName: smes
    sprite: _Starlight/Structures/Power/smes.rsi #SL Edit
    state: smes-blue-static

- type: entity
  parent: SMESBlue
  id: SMESBlueEmpty
  suffix: Empty
  components:
  - type: Battery
    startingCharge: 0

- type: entity
  parent: SMESBasic
  id: SMESBasicBackup
  suffix: Basic, 8MJ, Backup
  name: backup SMES
  description: A SMES unit that only discharges power when the primary supply on its network can't keep up with demand.
  components:
    - type: PowerNetworkBatteryPriority
      priority: 1
      engageThreshold: 0.98          # engage once demand hits 98% of combined lower-tier max supply (rate-capped)
      disengageThreshold: 0.90       # disengage (rate signal) once demand drops back below 90% of lower-tier max supply
      chargeEngageThreshold: 0.20    # engage once lower tiers' combined charge drops to 20% or below (running dry)
      chargeDisengageThreshold: 0.40 # disengage (charge signal) once lower tiers climb back above 40% charge
      # Engages if EITHER signal trips; only disengages once BOTH clear.
    - type: PowerNetworkBattery
      canDischarge: false            # starts disengaged; PowerNetworkBatteryPrioritySystem manages this at runtime

