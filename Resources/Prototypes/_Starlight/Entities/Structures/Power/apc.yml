- type: entity
  parent: APCBasic
  id: APCShadekin
  suffix: Shadekin, 50kJ
  components:
  - type: StationAiWhitelist
    enabled: false
  - type: AccessReader
    access: []
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Power/apc.rsi
    layers:
    - state: base
      color: "#795382"
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
    - state: display-charging
      shader: unshaded
      map: ["enum.ApcVisualLayers.ChargeState"]
    - state: lock0-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.InterfaceLock"]
      visible: false
    - state: lock1-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.PanelLock"]
      visible: false
    - state: lock1-locked #when these are implemented get actual sprites.
      shader: unshaded
      map: ["enum.ApcVisualLayers.Equipment"]
      visible: false
    - state: lock1-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.Lighting"]
      visible: false
    - state: lock1-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.Environment"]
      visible: false

# advanced APC
- type: entity
  parent: BaseAPC
  categories: [ HideSpawnMenu ]
  id: BaseAPCAdvanced
  name: advanced APC
  description: An advanced control terminal for the area's electrical systems, capable of handling a much higher network load.
  components:
  - type: Apc
    voltage: Apc
    maxLoad: 90000 # significantly more than a basic APC handles
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _Starlight/Structures/Power/apc.rsi
    layers:
    - state: advanced-base
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
    - state: display-charging
      shader: unshaded
      map: ["enum.ApcVisualLayers.ChargeState"]
    - state: lock0-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.InterfaceLock"]
      visible: false
    - state: lock1-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.PanelLock"]
      visible: false
    - state: lock1-locked #when these are implemented get actual sprites.
      shader: unshaded
      map: ["enum.ApcVisualLayers.Equipment"]
      visible: false
    - state: lock1-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.Lighting"]
      visible: false
    - state: lock1-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.Environment"]
      visible: false
  - type: PowerMonitoringDevice
    group: APC
    sourceNode: input
    loadNode: output
    collectionName: apc
    sprite: _Starlight/Structures/Power/apc.rsi
    state: advanced-static
  - type: Battery
    netsync: false
    maxCharge: 200000
    startingCharge: 0
  - type: Construction
    graph: APC
    node: apcAdvanced
  - type: PowerNetworkBattery
    maxSupply: 45000
    maxChargeRate: 20000
    supplyRampTolerance: 4000
    supplyRampRate: 2000

# advanced APC under construction
- type: entity
  parent: APCFrame
  categories: [ HideSpawnMenu ]
  id: APCAdvancedFrame
  name: advanced APC frame
  description: An advanced control terminal for the area's electrical systems, lacking the electronics.
  components:
  - type: Construction
    graph: APC
    node: apcAdvancedFrame
  - type: Sprite
    sprite: _Starlight/Structures/Power/apc.rsi
    state: advanced-frame

# Constructed advanced APC
- type: entity
  parent: BaseAPCAdvanced
  id: APCAdvancedConstructed
  suffix: Advanced, Open
  components:
  - type: WiresPanel
    open: true

# APCs in use
- type: entity
  parent: BaseAPCAdvanced
  id: APCAdvanced
  suffix: Advanced, 200kJ
  components:
  - type: Battery
    maxCharge: 200000
    startingCharge: 200000
