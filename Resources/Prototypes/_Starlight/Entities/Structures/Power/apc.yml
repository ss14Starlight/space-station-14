- type: entity
  parent: APCBasic
  id: APCShadekin
  suffix: Shadekin, 50kJ
  components:
  - type: StationAiWhitelist
    enabled: false
  - type: AccessReader
    access: []
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Power/apc.rsi
    layers:
    - state: base
      color: "#795382"
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
    - state: display-charging
      shader: unshaded
      map: ["enum.ApcVisualLayers.ChargeState"]
    - state: lock0-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.InterfaceLock"]
      visible: false
    - state: lock1-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.PanelLock"]
      visible: false
    - state: lock1-locked #when these are implemented get actual sprites.
      shader: unshaded
      map: ["enum.ApcVisualLayers.Equipment"]
      visible: false
    - state: lock1-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.Lighting"]
      visible: false
    - state: lock1-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.Environment"]
      visible: false

# advanced APC
- type: entity
  parent: BaseAPC
  categories: [ HideSpawnMenu ]
  id: BaseAPCAdvanced
  name: advanced APC
  description: An advanced control terminal for the area's electrical systems, capable of handling a much higher network load.
  components:
  - type: Apc
    maxLoad: 60000 # triple the amount a basic APC handles
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _Starlight/Structures/Power/apc.rsi
    layers:
    - state: advanced-base
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
    - state: display-charging
      shader: unshaded
      map: ["enum.ApcVisualLayers.ChargeState"]
    - state: lock0-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.InterfaceLock"]
      visible: false
    - state: lock1-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.PanelLock"]
      visible: false
    - state: lock1-locked #when these are implemented get actual sprites.
      shader: unshaded
      map: ["enum.ApcVisualLayers.Equipment"]
      visible: false
    - state: lock1-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.Lighting"]
      visible: false
    - state: lock1-locked
      shader: unshaded
      map: ["enum.ApcVisualLayers.Environment"]
      visible: false
  - type: PowerMonitoringDevice
    group: APC
    sourceNode: input
    loadNode: output
    collectionName: apc
    sprite: _Starlight/Structures/Power/apc.rsi
    state: advanced-static

# advanced APC under construction
- type: entity
  parent: APCFrame
  #categories: [ HideSpawnMenu ] #testing, unhide me on PR
  id: AdvancedAPCFrame
  name: advanced APC frame
  description: An advanced control terminal for the area's electrical systems, lacking the electronics.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Power/apc.rsi
    state: advanced-frame
  - type: Construction
    graph: advancedAPC
    node: advancedApcFrame

# Constructed advanced APC
- type: entity
  parent: BaseAPCAdvanced
  id: AdvancedAPCConstructed
  suffix: Advanced, Open
  components:
  - type: WiresPanel
    open: true

# APCs in use
- type: entity
  parent: BaseAPCAdvanced
  id: AdvancedAPC
  suffix: Advanced, 100kJ
  components:
  - type: Battery
    maxCharge: 100000
    startingCharge: 100000
