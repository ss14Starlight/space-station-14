# Parts

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseCombustionTurbinePart
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Power/Generation/combustion_turbine.rsi
  - type: Item
    size: Normal
  - type: PhysicalComposition
    materialComposition:
      Steel: 500
  - type: GuideHelp
    guides:
    - CombustionTurbine

- type: entity
  parent: BaseCombustionTurbinePart
  id: CombustionTurbineCompressorPart
  name: compressor part
  suffix: Tier 1
  description: Install in a turbine inlet compressor. Better tiers draw more gas and handle more speed and heat.
  components:
  - type: Sprite
    state: compressor_part
  - type: CombustionTurbinePart
    stage: Compressor
    efficiency: [ 1, 1.2, 1.4, 1.6 ]
    upgrades:
    - stack: Plasteel
      amount: 10
    - stack: Uranium
      amount: 10
    - stack: Diamond
      amount: 5

- type: entity
  parent: BaseCombustionTurbinePart
  id: CombustionTurbineRotorPart
  name: rotor part
  suffix: Tier 1
  description: Install in a turbine core rotor. Better tiers lose less power to friction and handle more speed and heat.
  components:
  - type: Sprite
    state: rotor_part
  - type: CombustionTurbinePart
    stage: Rotor
    efficiency: [ 1, 0.8, 0.6, 0.4 ]
    upgrades:
    - stack: Plasteel
      amount: 10
    - stack: Uranium
      amount: 10
    - stack: Diamond
      amount: 5

- type: entity
  parent: BaseCombustionTurbinePart
  id: CombustionTurbineStatorPart
  name: stator part
  suffix: Tier 1
  description: Install in a turbine outlet. Better tiers catch more of the expanding gas's energy and handle more speed and heat.
  components:
  - type: Sprite
    state: stator_part
  - type: CombustionTurbinePart
    stage: Outlet
    efficiency: [ 0.4, 0.48, 0.56, 0.65 ]
    upgrades:
    - stack: Plasteel
      amount: 15
    - stack: Uranium
      amount: 15
    - stack: Diamond
      amount: 8

- type: entity
  parent: CombustionTurbineCompressorPart
  id: CombustionTurbineCompressorPartTier2
  suffix: Tier 2
  components:
  - type: CombustionTurbinePart
    tier: 2

- type: entity
  parent: CombustionTurbineCompressorPart
  id: CombustionTurbineCompressorPartTier3
  suffix: Tier 3
  components:
  - type: CombustionTurbinePart
    tier: 3

- type: entity
  parent: CombustionTurbineCompressorPart
  id: CombustionTurbineCompressorPartTier4
  suffix: Tier 4
  components:
  - type: CombustionTurbinePart
    tier: 4

- type: entity
  parent: CombustionTurbineRotorPart
  id: CombustionTurbineRotorPartTier2
  suffix: Tier 2
  components:
  - type: CombustionTurbinePart
    tier: 2

- type: entity
  parent: CombustionTurbineRotorPart
  id: CombustionTurbineRotorPartTier3
  suffix: Tier 3
  components:
  - type: CombustionTurbinePart
    tier: 3

- type: entity
  parent: CombustionTurbineRotorPart
  id: CombustionTurbineRotorPartTier4
  suffix: Tier 4
  components:
  - type: CombustionTurbinePart
    tier: 4

- type: entity
  parent: CombustionTurbineStatorPart
  id: CombustionTurbineStatorPartTier2
  suffix: Tier 2
  components:
  - type: CombustionTurbinePart
