- type: entity
  abstract: true
  parent: BaseMachine
  id: BaseCombustionTurbineSection
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    noRot: false
  - type: Rotatable
  - type: Sprite
    sprite: _Starlight/Structures/Power/Generation/combustion_turbine.rsi
  - type: Appearance
  - type: Airtight
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 4
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: DeviceLinkSink
    ports:
    - CombustionTurbineConsoleReceiver
  - type: WiresPanel
  - type: ItemSlots
    slots:
      turbine_part:
        name: combustion-turbine-slot-part
        locked: true
        whitelist:
          components:
          - CombustionTurbinePart
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      turbine_part: !type:ContainerSlot
  - type: EmptyOnMachineDeconstruct
    containers:
    - turbine_part
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_board
    - machine_parts
  - type: GuideHelp
    guides:
    - CombustionTurbine
    - Power

- type: entity
  parent: BaseCombustionTurbineSection
  id: CombustionTurbineCompressor
  name: inlet compressor
  description: The intake section of a combustion turbine. Draws hot gas from the tile behind it into the core rotor.
  components:
  - type: Sprite
    layers:
    - state: inlet_compressor
    - state: inlet_off
      map: [ "enum.CombustionTurbineVisualLayers.Running" ]
    - state: inlet_open
      visible: false
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: GenericVisualizer
    visuals:
      enum.CombustionTurbineVisuals.Running:
        enum.CombustionTurbineVisualLayers.Running:
          True: { state: inlet_on }
          False: { state: inlet_off }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }
  - type: CombustionTurbineStage
    stage: Compressor
  - type: Machine
    board: CombustionTurbineCompressorMachineCircuitboard

- type: entity
  parent: BaseCombustionTurbineSection
  id: CombustionTurbineRotor
  name: core rotor
  description: The middle section of a combustion turbine, holding the rotor and the generator. Assemble it with an inlet compressor behind it and a turbine outlet in front, all facing the same way.
  components:
  - type: Sprite
    layers:
    - state: core_rotor
    - state: core_on
      shader: unshaded
      visible: false
      map: [ "enum.CombustionTurbineVisualLayers.Running" ]
    - state: core_open
      visible: false
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: GenericVisualizer
    visuals:
      enum.CombustionTurbineVisuals.Running:
        enum.CombustionTurbineVisualLayers.Running:
          True: { visible: true }
          False: { visible: false }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }
  - type: CombustionTurbineStage
    stage: Rotor
  - type: CombustionTurbineRotor
  - type: AtmosDevice
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: LightningTarget
    priority: 1
  - type: NodeContainer
    examinable: true
    nodes:
      output:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerSupplier
    supplyRampRate: 100000000
    supplyRampTolerance: 10000000000
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output
    sprite: _Starlight/Structures/Power/Generation/combustion_turbine.rsi
    state: core_rotor
  - type: AmbientSound
    enabled: false
    volume: -6
    range: 6
    sound:
      path: /Audio/_FarHorizons/Ambience/Objects/turbine_room.ogg
  - type: Machine
    board: CombustionTurbineRotorMachineCircuitboard

- type: entity
  parent: BaseCombustionTurbineSection
  id: CombustionTurbineOutlet
  name: turbine outlet
  description: The exhaust section of a combustion turbine, holding the turbine blades and the stator. Spent gas vents onto the tile in front of it.
  components:
  - type: Sprite
    layers:
    - state: turbine_outlet
    - state: outlet_off
      map: [ "enum.CombustionTurbineVisualLayers.Running" ]
    - state: outlet_open
      visible: false
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: GenericVisualizer
    visuals:
      enum.CombustionTurbineVisuals.Running:
        enum.CombustionTurbineVisualLayers.Running:
          True: { state: outlet_on }
          False: { state: outlet_off }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }
  - type: CombustionTurbineStage
    stage: Outlet
  - type: Machine
    board: CombustionTurbineOutletMachineCircuitboard

- type: entity
  parent: CombustionTurbineCompressor
  id: CombustionTurbineCompressorFilled
  suffix: Filled, Tier 1
  components:
  - type: ItemSlots
