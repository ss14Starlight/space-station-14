- type: entity
  id: ShadekinDoor
  parent: HospitalCurtains
  name: shadekin door
  description: A door, where will it lead?
  suffix: ""
  components:
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeAabb
            bounds: "-0.49,-0.49,0.49,0.49"
          density: 100
          mask:
            - FullTileMask
          layer:
            - AirlockLayer
    - type: Sprite
      snapCardinals: true
      sprite: Structures/Decoration/Curtains/hospital.rsi
      color: "#795382"
      layers:
        - state: closed
          map: ["enum.DoorVisualLayers.Base"]
    - type: Door
      performCollisionCheck: true
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 300
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
    - type: BlockWeather

#Xeno
- type: entity
  parent: BaseMaterialDoorNavMap
  id: AirlockXenoDoorBump
  components:
  - type: Door
    bumpOpen: true
    clickOpen: true
    closeTimeOne: 0.8
    closeTimeTwo: 1.2
    openTimeOne: 0.8
    openTimeTwo: 1.2
    openingAnimationTime: 1.2
    closingAnimationTime: 1.2
    openSound:
      path: /Audio/_RMC/Voice/Xeno/alien_growl1.ogg
    closeSound:
      path: /Audio/_RMC/Voice/Xeno/alien_growl1.ogg
  - type: TimedDoorClosing
    autoCloseDelay: 5
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Standard/xeno.rsi
  - type: Paintable
    group: null
  - type: RCDDeconstructable
    deconstructable: true
    cost: 4
    delay: 6
    fx: EffectRCDDeconstruct6
  - type: Damageable
    damageContainer: MalignStructure
    damageModifierSet: StructuralMalignStone
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
