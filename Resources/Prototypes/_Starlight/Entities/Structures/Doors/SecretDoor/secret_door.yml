- type: entity
  id: ReinforcedSecretDoor
  name: reinforced wall
  parent: BaseSecretDoor
  components:
  - type: ReinforcedSecretDoorVisual
  - type: Sprite
    sprite: Structures/Walls/solid.rsi
    noRot: false
    layers:
    - sprite: Structures/Doors/secret_door.rsi
      state: closed
      map: ["enum.DoorVisualLayers.Base"]
      visible: false
  - type: IconSmooth
    key: walls
    mode: Corners
    base: reinf_over
  - type: Construction
    graph: SecretDoor
    node: reinforcedSecretDoor
    containers:
    - battery-container
