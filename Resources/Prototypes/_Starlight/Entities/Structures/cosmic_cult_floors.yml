- type: entity
  id: FloorCosmicDecay
  name: entropic decay
  description: Just one look at this sends a chill running down your spine.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: FloorOccluder
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWater
      params:
        volume: 8
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    intersectRatio: 0.1
    blacklist:
      tags:
        - Catwalk
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: /Textures/_Starlight/Structures/CosmicCult/cosmicdecay.rsi
    drawdepth: BelowFloor
    layers:
      - state: decay
        shader: unshaded
  - type: Icon
    sprite: /Textures/_Starlight/Structures/CosmicCult/cosmicdecay.rsi
    state: full
  - type: IconSmooth
    key: decay
    base: decay
  - type: TileEmission
    color: "#42a4ae"

- type: entity
  id: FloorCosmicDecayAlt
  suffix: DO NOT MAP
  name: "???"
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: FloorOccluder
  - type: Physics
    bodyType: Static
    canCollide: False
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Sprite
    sprite: /Textures/_Starlight/Structures/CosmicCult/cosmicdecayalt.rsi
  - type: Icon
    sprite: /Textures/_Starlight/Structures/CosmicCult/cosmicdecayalt.rsi
    state: full
  - type: IconSmooth
    key: floor
    base: void
  - type: Tag
    tags:
      - HideContextMenu
