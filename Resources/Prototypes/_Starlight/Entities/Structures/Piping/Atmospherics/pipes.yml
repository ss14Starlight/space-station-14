# Subfloor gas tank END
# Above-floor 1x1 gas tank BEGIN

- type: entity
  parent: GasPipeSansLayers
  id: GasPipeTankSmall
  name: gas tank
  description: A gas tank. Gets in your way, but can store more than those silly subfloor ones.
  placement:
    mode: AlignAtmosPipeLayers
  components:
    - type: Sprite
      sprite: _Carpmosia/Structures/Piping/Atmospherics/pipe.rsi
      drawdepth: Mobs
      offset: 0,0.55
      noRot: true
      layers:
        - state: pipeFourway # The four pipes coming out at the base
          offset: 0,-0.55
          map: [ "enum.PipeVisualLayers.Pipe" ]
        - sprite: _Starlight/Structures/Piping/Atmospherics/gastank1x1.rsi
          state: gas_tank # The tank, recolored with spray painter
          map: [ "enum.SubfloorLayers.FirstLayer" ]
        - sprite: _Starlight/Structures/Piping/Atmospherics/gastank1x1.rsi
          state: gas_tank_overlay # The hazard stripes + warning triangle, not recolored
          map: [ "enum.SubfloorLayers.SecondLayer" ]
    - type: SpriteFade
    - type: Transform
      noRot: true
    - type: Item
      allowDirectHandPickup: false
    - type: Physics
      canCollide: true
      bodyType: static
    - type: CollideOnAnchor
      enable: true
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.27
            position: 0,0.25
          density: 500
          mask:
            - MachineMask
          layer:
            - MachineLayer
    - type: AtmosPipeLayers
      spriteLayersRsiPaths:
        enum.PipeVisualLayers.Pipe:
          Primary: _Carpmosia/Structures/Piping/Atmospherics/pipe.rsi
          Secondary: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt1.rsi
          Tertiary: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt2.rsi
          Quaternary: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt3.rsi
          Quinary: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt4.rsi
      alternativePrototypes:
        Primary: GasPipeTankSmall
        Secondary: GasPipeTankSmallAlt1
        Tertiary: GasPipeTankSmallAlt2
        Quaternary: GasPipeTankSmallAlt3
        Quinary: GasPipeTankSmallAlt4
    - type: SubFloorHide
      blockInteractions: false
      blockAmbience: false
      visibleLayers:
        - enum.SubfloorLayers.FirstLayer
        - enum.SubfloorLayers.SecondLayer
    - type: StaticPrice
      price: 75
    - type: PipeAppearance
      extraColoredLayers:
        - enum.SubfloorLayers.FirstLayer
    - type: Tag
      tags:
        - Pipe
        - Unstackable
    - type: NodeContainer
      nodes:
        pipe:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: Fourway
          volume: 2000
    - type: Construction
      graph: GasPipeTankSmall
      node: tank
    - type: VentCrawlTube
    - type: VentCrawlJunction
      degrees:
        - 0
        - 90
        - -90
        - 180
    - type: GuideHelp
      guides:
        - Pipes
        - PipeNetworks

- type: entity
  parent: [GasPipeLayerAlt1, GasPipeTankSmall]
  id: GasPipeTankSmallAlt1
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt1.rsi
    - type: Construction
      graph: GasPipeTankSmall
      node: tankAlt1

