# Subfloor gas tank BEGIN

- type: entity
  parent: GasPipeSansLayers
  id: GasPipeTankSubfloor
  name: subfloor gas tank
  description: A 750L gas tank built into the subfloor. Perfect when space is at a premium.
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: AtmosUnsafeUnanchor
    enabled: false # Retains gas when unanchored.
  - type: Item
    allowDirectHandPickup: false # No pickup allowed because it can retain gas.
  - type: Sprite
    sprite: _Carpmosia/Structures/Piping/Atmospherics/pipe.rsi
    drawdepth: ThinPipe
    layers:
      - state: pipeHalf
        map: [ "enum.PipeVisualLayers.Pipe" ]
      - sprite: _Starlight/Structures/Piping/Atmospherics/subfloortank.rsi
        state: subFloorTank
        map: [ "enum.SubfloorLayers.FirstLayer" ]
  - type: Physics
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1: # Fixture, non-colliding, just for setting mass.
        shape:
          !type:PhysShapeCircle
          radius: 0.27 # Matching tall gas tank for comparison convenience.
          position: 0,0
        density: 700
        hard: false
        mask: [ ]
        layer: [ ]
  - type: AtmosPipeLayers
    spriteLayersRsiPaths:
      enum.PipeVisualLayers.Pipe:
        Primary: _Carpmosia/Structures/Piping/Atmospherics/pipe.rsi
        Secondary: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt1.rsi
        Tertiary: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt2.rsi
        Quaternary: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt3.rsi
        Quinary: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt4.rsi
    alternativePrototypes:
      Primary: GasPipeTankSubfloor
      Secondary: GasPipeTankSubfloorAlt1
      Tertiary: GasPipeTankSubfloorAlt2
      Quaternary: GasPipeTankSubfloorAlt3
      Quinary: GasPipeTankSubfloorAlt4
  - type: StaticPrice
    price: 75
  - type: PipeAppearance
    extraColoredLayers:
    - enum.SubfloorLayers.FirstLayer
  - type: Tag
    tags:
    - Pipe
    - Unstackable
    - NoMechGrab
  - type: NodeContainer
    nodes:
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
        volume: 750
  - type: Construction
    graph: GasPipeTankSubfloor
    node: tank
  - type: VentCrawlTube
  - type: VentCrawlJunction
    degrees:
      - 0
  - type: GuideHelp
    guides:
    - Pipes
    - PipeNetworks

- type: entity
  parent: [GasPipeLayerAlt1, GasPipeTankSubfloor]
  id: GasPipeTankSubfloorAlt1
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: ThinPipeAlt1
    sprite: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt1.rsi
  - type: Construction
    graph: GasPipeTankSubfloor
    node: tankAlt1

- type: entity
  parent: [GasPipeLayerAlt2, GasPipeTankSubfloor]
  id: GasPipeTankSubfloorAlt2
