# Tall gas tank BEGIN

- type: entity
  parent: GasPipeSansLayers
  id: GasPipeTankTall
  name: tall gas tank
  description: A tank that stores 2000L of gas. It's very big. Bigger than you. The warning label reads, "If you can read this, you are standing too close!".
  placement:
    mode: AlignAtmosPipeLayers
  components:
    - type: AtmosUnsafeUnanchor
      enabled: false # Retains gas when unanchored.
    - type: Sprite
      sprite: _Carpmosia/Structures/Piping/Atmospherics/pipe.rsi
      drawdepth: Overdoors
      offset: 0,0.55
      noRot: true
      layers:
        - state: pipeUnaryConnectors # The pipe(s) coming out at the base
          offset: 0,-0.55
          map: [ "enum.PipeVisualLayers.Pipe" ]
        - sprite: _Starlight/Structures/Piping/Atmospherics/gastank1x1.rsi
          state: gas_tank # The tank body, recolored with spray painter
          map: [ "enum.SubfloorLayers.FirstLayer" ]
        - sprite: _Starlight/Structures/Piping/Atmospherics/gastank1x1.rsi
          state: gas_tank_overlay # The hazard stripes + warning triangle, not recolored
          map: [ "enum.SubfloorLayers.SecondLayer" ]
    - type: SpriteFade
    - type: Item
      allowDirectHandPickup: false
    - type: Physics
      canCollide: true
      bodyType: static
    - type: CollideOnAnchor
      enable: true
    - type: Fixtures
      fixtures:
        fix1: # Collidable circle following the sprite
          shape:
            !type:PhysShapeCircle
            radius: 0.27
          density: 1700 # Quite heavy; it's not meant to be a superior canister. Heavy enough that you won't want to bring it outside your department.
          mask:
            - MachineMask
          layer:
            - MachineLayer
        fix2: # Non-collidable rectangle that makes the entire bottom half clickable.
          shape:
            !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5" # Only the bottom tile
          hard: true
          mask: [ ]
          layer: [ Opaque ]
    - type: AtmosPipeLayers
      spriteLayersRsiPaths:
        enum.PipeVisualLayers.Pipe:
          Primary: _Carpmosia/Structures/Piping/Atmospherics/pipe.rsi
          Secondary: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt1.rsi
          Tertiary: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt2.rsi
          Quaternary: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt3.rsi
          Quinary: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt4.rsi
      alternativePrototypes:
        Primary: GasPipeTankTall
        Secondary: GasPipeTankTallAlt1
        Tertiary: GasPipeTankTallAlt2
        Quaternary: GasPipeTankTallAlt3
        Quinary: GasPipeTankTallAlt4
    - type: SubFloorHide
      blockInteractions: false
      blockAmbience: false
      visibleLayers:
        - enum.SubfloorLayers.FirstLayer
        - enum.SubfloorLayers.SecondLayer
    - type: StaticPrice
      price: 290
    - type: PipeAppearance
      extraColoredLayers:
        - enum.SubfloorLayers.FirstLayer
    - type: Tag
      tags:
        - Pipe
        - Unstackable
        - NoMechGrab
    - type: NodeContainer
      nodes:
        pipe:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: South
          volume: 2000
    - type: Construction
      graph: GasPipeTankTall
      node: tank
    - type: VentCrawlTube
    - type: VentCrawlJunction
      degrees:
        - 0
    - type: GuideHelp
      guides:
        - Pipes
        - PipeNetworks

- type: entity
  parent: [GasPipeLayerAlt1, GasPipeTankTall]
  id: GasPipeTankTallAlt1
  categories: [ HideSpawnMenu ]
