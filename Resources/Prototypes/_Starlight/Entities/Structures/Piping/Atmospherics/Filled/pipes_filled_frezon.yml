# Bases types BEGIN

- type: entity
  parent: GasPipeTankSubfloor
  abstract: true
  id: GasPipeTankSubfloorFilledFrezon
  suffix: Frezon
  components:
    - type: Sprite
      sprite: _Carpmosia/Structures/Piping/Atmospherics/pipe.rsi
      drawdepth: ThinPipe
      layers:
        - state: pipeHalf
          map: [ "enum.PipeVisualLayers.Pipe" ]
          color: "#05B2DCFF"
        - sprite: _Starlight/Structures/Piping/Atmospherics/subfloortank.rsi
          state: subFloorTank
          map: [ "enum.SubfloorLayers.FirstLayer" ]
          color: "#05B2DCFF"
    - type: PipePrefill
      temperature: 72.0
      mixture:
        Frezon: 100
    - type: AtmosPipeColor
      color: "#05B2DCFF"

- type: entity
  parent: GasPipeTankTall
  abstract: true
  id: GasPipeTankTallFilledFrezon
  suffix: Frezon
  components:
    - type: Sprite
      layers:
        - state: pipeUnaryConnectors # The pipe(s) coming out at the base
          offset: 0,-0.55
          map: [ "enum.PipeVisualLayers.Pipe" ]
          color: "#05B2DCFF"
        - sprite: _Starlight/Structures/Piping/Atmospherics/gastank1x1.rsi
          state: gas_tank # The tank body, recolored with spray painter
          map: [ "enum.SubfloorLayers.FirstLayer" ]
          color: "#05B2DCFF"
        - sprite: _Starlight/Structures/Piping/Atmospherics/gastank1x1.rsi
          state: gas_tank_overlay # The hazard stripes + warning triangle, not recolored
          map: [ "enum.SubfloorLayers.SecondLayer" ]
    - type: PipePrefill
      temperature: 72.0
      mixture:
        Frezon: 100
    - type: AtmosPipeColor
      color: "#05B2DCFF"

# Base types END
