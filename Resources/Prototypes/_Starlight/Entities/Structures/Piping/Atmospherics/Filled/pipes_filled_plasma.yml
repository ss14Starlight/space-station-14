# Bases types BEGIN

- type: entity
  parent: GasPipeTankSubfloor
  abstract: true
  id: GasPipeTankSubfloorFilledPlasma
  suffix: Plasma
  components:
    - type: Sprite
      layers:
        - state: pipeHalf
          map: [ "enum.PipeVisualLayers.Pipe" ]
          color: "#AA7DCEFF"
        - sprite: _Starlight/Structures/Piping/Atmospherics/subfloortank.rsi
          state: subFloorTank
          map: [ "enum.SubfloorLayers.FirstLayer" ]
          color: "#AA7DCEFF"
    - type: PipePrefill
      mixture:
        Plasma: 100
    - type: AtmosPipeColor
      color: "#AA7DCEFF"

- type: entity
  parent: GasPipeTankTall
  abstract: true
  id: GasPipeTankTallFilledPlasma
  suffix: Plasma
  components:
    - type: Sprite
      layers:
        - state: pipeUnaryConnectors # The pipe(s) coming out at the base
          offset: 0,-0.55
          map: [ "enum.PipeVisualLayers.Pipe" ]
          color: "#AA7DCEFF"
        - sprite: _Starlight/Structures/Piping/Atmospherics/gastank1x1.rsi
          state: gas_tank # The tank body, recolored with spray painter
          map: [ "enum.SubfloorLayers.FirstLayer" ]
          color: "#AA7DCEFF"
        - sprite: _Starlight/Structures/Piping/Atmospherics/gastank1x1.rsi
          state: gas_tank_overlay # The hazard stripes + warning triangle, not recolored
          map: [ "enum.SubfloorLayers.SecondLayer" ]
    - type: PipePrefill
      mixture:
        Plasma: 100
    - type: AtmosPipeColor
      color: "#AA7DCEFF"

# Base types END
# Subfloor gas tank (1500kPa) BEGIN

