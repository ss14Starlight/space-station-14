- type: entity
  parent: GasThermoMachineFreezerEnabled
  id: GasThermoMachineFreezerEnabledCold
  suffix: Enabled, 235K
  components:
  - type: GasThermoMachine
    targetTemperature: 235 # Atmospherics.FreezerTemp
  - type: ApcPowerReceiver
    powerDisabled: false

- type: entity
  parent: GasUnaryBase
  id: GasInletSiphon
  name: air siphon
  description: Siphons air from adjacent tiles.
  placement:
    mode: AlignAtmosPipeLayers
  components:
    - type: Sprite
      drawdepth: FloorObjects
      sprite: _Starlight/Structures/Piping/Atmospherics/gasinletsiphon.rsi
      layers:
        - state: pipeUnaryConnectors
          sprite: _Carpmosia/Structures/Piping/Atmospherics/pipe.rsi
          map: [ "enum.PipeVisualLayers.Pipe" ]
        - state: siphon
          map: [ "enum.SubfloorLayers.FirstLayer" ]
        - state: siphon-unshaded
          shader: unshaded
          map: [ "enum.LightLayers.Unshaded" ]
          color: "#430000"
    - type: AtmosPipeLayers
      alternativePrototypes:
        Primary: GasInletSiphon
        Secondary: GasInletSiphonAlt1
        Tertiary: GasInletSiphonAlt2
        Quaternary: GasInletSiphonAlt3
        Quinary: GasInletSiphonAlt4
      spriteLayersRsiPaths:
        enum.PipeVisualLayers.Pipe:
          Primary: _Carpmosia/Structures/Piping/Atmospherics/pipe.rsi
          Secondary: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt1.rsi
          Tertiary: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt2.rsi
          Quaternary: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt3.rsi
          Quinary: _Carpmosia/Structures/Piping/Atmospherics/pipe_alt4.rsi
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.GasInletSiphonVisuals.State:
          enum.LightLayers.Unshaded:
            Off: { color: "#990000" }
            UnpoweredOff: { color: "#430000" }
            On: { color: "#5eff5e" }
            UnpoweredOn: { color: "#022102" }
    - type: PipeColorVisuals
    - type: AtmosDevice
    - type: GasInletSiphon
    - type: Construction
      graph: GasUnaryStarlight
      node: gasinletsiphon
    - type: SubFloorHide
      visibleLayers:
      - enum.SubfloorLayers.FirstLayer
      - enum.LightLayers.Unshaded
    - type: AtmosMonitoringConsoleDevice
      navMapBlip: GasVentOpening
    - type: VentCrawlTube
    - type: VentCrawlJunction
      degrees:
        - 0
    - type: ApcPowerReceiver
    - type: ExtensionCableReceiver
    - type: DeviceNetwork
      deviceNetId: Wireless
      receiveFrequencyId: BasicDevice
      prefix: device-address-prefix-air-siphon
    - type: WirelessNetworkConnection
      range: 200
    - type: ToggleableDevice
    - type: ToggleableDeviceSignaling
    - type: DeviceLinkSink
      ports:
        - "On"
        - "Off"
        - "Toggle"
        - "ToggleableDeviceState"
        - "ToggleableDeviceStateInverted"
    - type: DeviceLinkSource
      ports:
        - "Status"
        - "ToggleableDeviceStatusInverted"
    - type: AmbientSound
      enabled: true
      volume: -12
      range: 5
      sound:
        path: /Audio/Ambience/Objects/gas_vent.ogg

- type: entity
  parent: GasUnaryBase
  id: InlineHeatExchanger
  name: inline radiator
  description: Transfers heat between the pipe and its surroundings.
  placement:
    mode: SnapgridCenter
  components:
    - type: Tag
      tags:
        - Unstackable
    - type: Rotatable
    - type: Transform
      noRot: false
    - type: Sprite
      sprite: _Starlight/Structures/Piping/Atmospherics/inline_radiator.rsi
      layers:
        - sprite: _Carpmosia/Structures/Piping/Atmospherics/pipe.rsi
          state: pipeStraight
          map: ["enum.PipeVisualLayers.Pipe"]
        - state: iheStraight
          map: ["enum.SubfloorLayers.FirstLayer"]
    - type: AtmosPipeLayers
      spriteRsiPaths: {}
      numberOfPipeLayers: 1
    - type: SubFloorHide
      visibleLayers:
        - enum.SubfloorLayers.FirstLayer
    - type: Appearance
    - type: PipeColorVisuals
    - type: AtmosDevice
    - type: InlineHeatExchanger
    - type: NodeContainer
      nodes:
        pipe: !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: Longitudinal
    - type: Construction
      graph: GasUnaryStarlight
      node: inlineradiator
    - type: AtmosMonitoringConsoleDevice
      navMapBlip: Thermoregulator
    - type: VentCrawlTube
    - type: VentCrawlTransit
    - type: GuideHelp
      guides:
        - Radiators

- type: entity
  parent: InlineHeatExchanger
  id: InlineHeatExchangerBend
  suffix: Bend
  components:
    - type: SubFloorHide
      visibleLayers:
        - enum.SubfloorLayers.FirstLayer
    - type: Sprite
      layers:
        - sprite: _Carpmosia/Structures/Piping/Atmospherics/pipe.rsi
          state: pipeBend
          map: ["enum.PipeVisualLayers.Pipe"]
        - state: iheBend
          map: ["enum.SubfloorLayers.FirstLayer"]
    - type: NodeContainer
      nodes:
        pipe: !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: SWBend
    - type: Construction
      graph: GasUnaryStarlight
      node: inlinebendradiator
    - type: VentCrawlTube
    - type: VentCrawlBend
