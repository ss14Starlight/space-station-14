- type: entity
  parent: TransitTubeOver
  id: TransitTubeOverSupport
  name: raised transit tube support
  description: A raised tube standing on a pair of legs. It holds up the tubes within a few tubes of it, and blocks the way under it.
  components:
  - type: Sprite
    layers:
    - state: straight
      map: [ "glass" ]
    - state: support
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 100
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Climbable
  - type: TransitTube
    level: Over
    support: true
