# Funky footprints
- type: entity
  parent: SolutionPrint
  id: Footprint
  name: footprint
  save: false
  description: Huh? Whose footprints are these?
  placement:
    mode: SnapgridCenter
  components:
  - type: Appearance
  - type: Clickable
  - type: Transform
    noRot: false
    anchored: true
  - type: Sprite
    drawdepth: FloorObjects
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      slipFixture:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        mask:
        - ItemMask
        layer:
        - SlipLayer
        hard: false
  - type: Footprint
  - type: Puddle
    solution: print
    affectsMovement: false
    affectsSound: false
    causesStains: false # Moff - Its weird trust me, basically puddles with nothing in them.
  - type: ExaminableSolution
    solution: print
  - type: MixableSolution
    solution: print
  - type: DrawableSolution
    solution: print
  - type: BadDrink
  - type: IgnoresFingerprints
  - type: Tag
    tags:
    - DNASolutionScannable
