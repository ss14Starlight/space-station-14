# Funky footprints
- type: entity
  parent: SolutionPrint
  name: footprint
  id: Footprint
  save: false
  description: Huh? Whose footprints are these?
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Transform
    noRot: false
    anchored: true
  - type: Sprite
    drawdepth: FloorObjects
  - type: Footprint
  - type: ExaminableSolution
    solution: print
  - type: MixableSolution
    solution: print
  - type: DrawableSolution
    solution: print
  - type: BadDrink
  - type: IgnoresFingerprints
  - type: Tag
    tags:
    - DNASolutionScannable
    - HideContextMenu
