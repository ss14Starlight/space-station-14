- type: entity
  parent: ClothingMiscBase
  id: ClothingSovietMedals
  name: soviet sets of medals
  description: A collection of medals meant to be replicas of the ones decorated. Wait, I think these actually might be real.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Neck/Medals/SovietMedals.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/Neck/Medals/SovietMedals.rsi
  - type: Tag
    tags:
      - Medal
  - type: StaticPrice
    price: 250

- type: entity
  parent: ClothingNeckGoldmedal
  id: ClothingNeckDeathmatchMedal
  name: bold medal
  suffix: Deathmatch, Unremoveable
  description: Given to bold fighters.
  components:
  - type: Unremoveable
  # create toolbox
  - type: GeneralItemCreator
    action: ActionCreateRobustToolbox
    charge: 250
    spawnedPrototype: WeaponMeleeToolboxRobustDeathmatch
    noPowerPopup: deathmatch-no-power
  - type: EmpResistance
    strengthMultiplier: 0
  - type: PowerCellSlot
    cellSlotId: cell_slot
    # you can't unequip it anyways
    fitsInCharger: false
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactorPrintedUnremoveable
        disableEject: true
        whitelist:
          tags:
            - PowerCell
