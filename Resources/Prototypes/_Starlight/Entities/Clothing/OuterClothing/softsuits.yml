#CBURN Softsuit
- type: entity
  parent: [ BaseCentcommContraband, ClothingOuterEVASuitBase ]
  id: ClothingOuterSoftsuitCBURN
  name: утеплённый ВКД-костюм ЦБХОР
  description: Тяжёлый прочный утеплённый биокостюм ВКД для специальных уборочных операций.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/OuterClothing/Hardsuits/cburn.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/OuterClothing/Hardsuits/cburn.rsi
    equipSound: /Audio/Mecha/mechmove03.ogg #starlight
    unequipSound: /Audio/Mecha/mechmove03.ogg #starlight
    equipDelay: 3 #starlight
    unequipDelay: 3 #starlight
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.3
        Piercing: 0.5
        Heat: 0.1
        Cold: 0.1
        Shock: 0.1
        Radiation: 0.1
        Caustic: 0.1
    staminaModifier: 0.2
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.1
  - type: HardsuitChemicalImmunity
  - type: ClothingSpeedModifier
    walkModifier: 0.75
    sprintModifier: 0.75
  - type: HeldSpeedModifier
  - type: Tag
    tags:
    - SuitEVA

- type: entity
  parent: [ClothingOuterEVASuitBase, BaseTSFContraband]
  id: ClothingOuterArmorTSF
  name: боевая броня морпеха Федерации
  description: Полный комплект полуусиленной штурмовой брони Корпуса морпехов Транс-Солнечной Федерации. Отлично защищает со всех сторон, не сковывая движения.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/OuterClothing/Armor/tsf.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/OuterClothing/Armor/tsf.rsi
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    equipDelay: 3
    unequipDelay: 3
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.5
        Caustic: 0
    staminaModifier: 0.3
  - type: StaminaResistance
    damageCoefficient: 0.75
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.8
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HeldSpeedModifier
  - type: FootstepLayer
    sound:
      collection: FootstepLayerHeavy
      params:
        volume: -2
        variation: 0.08
  - type: Tag
    tags:
    - SuitEVA

- type: entity
  parent: ClothingOuterArmorTSF
  id: ClothingOuterArmorTSFLeader
  name: боевая броня офицера морпехоты Федерации
  description: Полный комплект полуусиленной штурмовой брони Корпуса морпехов. Отлично защищает, не сковывая движения. Этот с золотыми полосами вместо белых.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/OuterClothing/Armor/tsfleader.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/OuterClothing/Armor/tsfleader.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.4
        Slash: 0.4
        Piercing: 0.3
        Heat: 0.2
        Caustic: 0
  - type: ExplosionResistance
    damageCoefficient: 0.2

#Wizard "Robes"
- type: entity
