  id: ClothingOuterSoftsuitWizard
  name: робы пустоты волшебника
  description: Громоздкая мантия в самоцветах, магически устойчивая к пустоте космоса.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/OuterClothing/Suits/wizard.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/OuterClothing/Suits/wizard.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Heat: 0.95
  - type: ClothingSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetsoftsuitWizard
