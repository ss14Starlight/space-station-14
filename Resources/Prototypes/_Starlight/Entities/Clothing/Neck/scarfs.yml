- type: entity
  parent: ClothingScarfBase
  id: ClothingNeckScarfRoboticist
  name: roboticist scarf
  description: A stylish scarf favored by roboticists. The perfect winter accessory for those with a keen fashion sense, and those who just can't handle a cold breeze on their necks.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Neck/Scarfs/robo.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/Neck/Scarfs/robo.rsi

