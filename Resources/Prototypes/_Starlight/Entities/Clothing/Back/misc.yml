- type: entity
  parent: [ Clothing, BaseSecurityContraband, BaseScienceContraband, BaseCommandContraband ]
  id: ClothingNullSpaceDrainer
  name: осушитель нуль-пространства
  suffix: SelfUnremovable
  description: Совмещённое устройство, занимающее физическое пространство и нуль-пространство. Поглощает внешнюю энергию в данные. Устройство сдерживает и блокирует сущности от входа и выхода из нуль-пространства.
  components:
    - type: Tag
      tags:
        - WhitelistChameleon
    - type: Sprite
      sprite: _Starlight/Clothing/Back/nullspaceteleporter.rsi
      state: icon
    - type: Item
      size: Huge
    - type: Clothing
      slots: BACK
      sprite: _Starlight/Clothing/Back/nullspaceteleporter.rsi
      stripDelay: 10
      equipDelay: 5 # to avoid accidentally falling into the trap associated with SelfUnremovableClothing
    - type: SelfUnremovableClothing
    - type: NullSpaceDrainer
    - type: TheDarkImmune
    - type: ResearchClient
    - type: ActivatableUI
      inHandsOnly: true
      key: enum.ResearchClientUiKey.Key
    - type: UserInterface
      interfaces:
        enum.ResearchClientUiKey.Key:
          type: ResearchClientBoundUserInterface
    - type: GuideHelp
      guides:
        - Brighteye

# Greenshield Officer
- type: entity
  parent: [ ClothingBackpack, BaseCentcommContraband ]
  categories: [ DoNotMap ]
  id: ClothingBackpackGreenshield
  name: плащ гриншилда
  description: Вместительный плащ с множеством карманов, который носят офицеры зелёного щита.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Back/thermalcloak.rsi
    - type: Clothing
      sprite: _Starlight/Clothing/Back/thermalcloak.rsi
    - type: Storage
      grid:
        - 0,0,2,5
        - 6,0,8,5
    - type: ExplosionResistance
      damageCoefficient: 0.1
