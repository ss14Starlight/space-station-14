- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackTrunk
  name: trunk
  description: A large and heavy trunk for holding even more things.
  abstract: true
  components:
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,11,3
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 0.85
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 9
    soundHit:
      collection: MetalThud
  - type: HeldSpeedModifier

- type: entity
  parent: ClothingBackpackTrunk
  id: ClothingBackpackTrunkMail
  name: mail technician trunk
  description: A huge trunk made of every aspiring mail technician's dreams.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Back/Trunks/mailtrunk.rsi

- type: entity
  parent: ClothingBackpackTrunk
  id: ClothingBackpackTrunkMailSenior
  name: senior mail technician trunk
  description: A huge trunk for the station's strongest mail technicians.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Back/Trunks/mailseniortrunk.rsi

# Fashion-O-Mat
- type: entity
  parent: ClothingBackpackTrunk
  id: ClothingBackpackTrunkSpaceCourier
  name: space courier trunk
  description: A huge trunk themed after a legendary space courier.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Back/Trunks/space_courier_trunk.rsi

- type: entity
  parent: ClothingBackpackTrunkSpaceCourier
  id: ClothingBackpackTrunkSpaceCourierPAI
  name: space courier trunk
  suffix: Ghost Role
  description: A huge trunk themed after a legendary space courier.
  components:
  - type: GhostRole
    makeSentient: true
    name: ghost-role-information-space-courier-trunk-name
    description: ghost-role-information-space-courier-trunk-description
    rules: ghost-role-information-space-courier-trunk-rules
    mindRoles:
    - MindRoleGhostRoleTrunkPAI
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: Instrument
    allowPercussion: false
    handheld: false
    program: 2
    bank: 100 # Defined in space-station-14.sf2
  - type: BlockMovement
  - type: LanguageSpeaker
  - type: TextToSpeech
    voice: karma
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
        requireInputValidation: false
      # available in pai shop
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
        requireInputValidation: false
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
        requireInputValidation: false
      enum.StationMapUiKey.Key:
        type: StationMapBoundUserInterface
        requireInputValidation: false
  - type: Examiner
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter #Starlight pAI comms rework, see PR #3299
  - type: ActiveRadio
  - type: ContainerContainer #Starlight pAI comms rework, see PR #3299
    containers:
      key_slots: !type:Container
  - type: EncryptionKeyHolder #Starlight pAI comms rework, see PR #3299
    keySlots: 1
  - type: DoAfter
  - type: Actions
  - type: ActionGrant
    actions:
    - ActionPAIOpenShop
  - type: Store
    name: store-preset-name-pai #Starlight name change for data purity
    categories:
    - PAIAbilities
    - Languages #Starlight
    currencyWhitelist:
    - SiliconMemory
    balance:
      SiliconMemory: 30
  - type: RadarConsole
    maxRange: 256
    followEntity: true
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: MobState
    allowedStates:
      - Alive
  - type: StationMap
  - type: Blindable
  - type: ParentCanBlockVision
  - type: ContentEye

# Fashion-O-Mat END