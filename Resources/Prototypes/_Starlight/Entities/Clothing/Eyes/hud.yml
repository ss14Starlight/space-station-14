- type: entity
  parent: [ClothingEyesModularHudVisor, BaseBlueShieldContraband]
  id: ClothingEyesHudBlueShield
  name: blue shield hud
  description: An innovative heads-up display that scans the humanoids in view and provides accurate data about their ID status, security records, and medical information.
  components:
  - type: ModularHudVisuals
    innateVisuals:
      lens:
        color: '#00003C'
        priority: 1000
        preventsOtherColors: true
      accent:
        color: '#00003C'
        priority: 1000
      specular:
        color: '#FFFFFF10'
        priority: 1000
  - type: ModularHud
    maximumContainedModules: 4
  - type: EntityTableContainerFill
    containers:
      modular-hud-modules: !type:AllSelector
        children:
        - id: HudModuleShowMindShieldIcons
        - id: HudModuleShowCriminalRecordIcons
        - id: HudModuleShowMedicalIcons
        - id: HudModuleShowInorganicHealthBars
  - type: Tag
    tags:
    - ModularHudSingleEye
    - WhitelistChameleon
    - HudMedical
  - type: EyeProtection
    protectionTime: 5
  - type: Contraband
    tier: Tier2

