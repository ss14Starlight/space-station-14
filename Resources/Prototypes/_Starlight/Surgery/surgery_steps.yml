- type: entity
  id: SurgeryStepBase
  categories:
  - HideSpawnMenu
  components:
  - type: SurgeryStep

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepOpenIncisionScalpel
  name: to open an incision
  components:
  - type: SurgeryStep
    tools:
    - type: Scalpel
    add:
    - type: IncisionOpen
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryStepBleedEffect
    damage:
      types:
        Slash: 10
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampBleeders
  name: to clamp the bleeding veins
  components:
  - type: SurgeryStep
    tools:
    - type: Hemostat
    add:
    - type: BleedersClamped
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: hemostat
  - type: SurgeryClampBleedEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSawBones
  name: to saw through the bones
  components:
  - type: SurgeryStep
    duration: 5
    tools:
    - type: BoneSaw
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/saw.rsi
    state: saw
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepPriseOpenBones
  name: to pry the bones open
  components:
  - type: SurgeryStep
    tools:
    - type: BoneSetter
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: setter

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseBones
  name: to close the bones
  components:
  - type: SurgeryStep
    tools:
    - type: BoneSetter
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: setter

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepMendRibcage
  name: to mend the ribs
  components:
  - type: SurgeryStep
    tools:
    - type: BoneGel
    reagentId: BoneGel
    reagentQuantity: 5
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/bone_gel.rsi
    state: bone-gel

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepMendSlime
  name: to reform the slime mass
  components:
  - type: SurgeryStep
    tools:
    - type: BoneGel
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/bone_gel.rsi
    state: bone-gel

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepMendSkull
  name: to mend the skull
  components:
  - type: SurgeryStep
    tools:
    - type: BoneGel
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/bone_gel.rsi
    state: bone-gel

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseIncision
  name: to close the incision
  components:
  - type: SurgeryStep
    tools:
    - type: Cautery
    remove:
    - type: SkinRetracted
    - type: BleedersClamped
    - type: IncisionOpen
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: SurgeryStepEmoteEffect
  - type: SurgeryClearProgress

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseIncisionDoll
  name: to close the incision
  components:
  - type: SurgeryStep
    tools:
    - type: Cautery
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepMendShellDoll
  name: to mend the shell
  components:
  - type: SurgeryStep
    tools:
    - type: BoneGel
    remove:
    - type: SkinRetracted
    - type: BleedersClamped
    - type: IncisionOpen
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/bone_gel.rsi
    state: bone-gel
  - type: SurgeryStepEmoteEffect
    emote: Sigh
  - type: SurgeryClearProgress

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepOpenShell
  name: to break open the shell
  components:
  - type: SurgeryStep
    duration: 10
    add:
    - type: IncisionOpen
    tools:
    - type: BoneSetter
  - type: SurgeryStepBleedEffect
    damage:
      types:
        Slash: 3
  - type: SurgeryStepEmoteEffect
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: setter

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampTendrils
  name: to remove the tendrils
  components:
  - type: SurgeryStep
    add:
    - type: BleedersClamped
    tools:
    - type: Hemostat
  - type: SurgeryClampBleedEffect
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: hemostat

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCutAbdominalMuscles
  name: to cut through the abdominal muscles
  components:
  - type: SurgeryStep
    duration: 5
    tools:
    - type: Scalpel
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRetractAbdominalWalls
  name: to retract the abdominal walls
  components:
  - type: SurgeryStep
    tools:
    - type: Retractor
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: retractor

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSutureMuscles
  name: to suture the abdominal muscles
  components:
  - type: SurgeryStep
    duration: 4
    tools:
    - type: Cautery
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRestoreAbdominalWalls
  name: to restore the abdominal walls
  components:
  - type: SurgeryStep
    duration: 3
    tools:
    - type: Retractor
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: retractor
  - type: SurgeryStepEmoteEffect
