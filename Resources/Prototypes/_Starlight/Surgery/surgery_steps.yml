- type: entity
  id: SurgeryStepBase
  categories:
  - HideSpawnMenu
  components:
  - type: SurgeryStep

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepOpenIncisionScalpel
  name: Opening an incision
  components:
  - type: SurgeryStep
    tools:
    - type: Scalpel
    add:
    - type: IncisionOpen
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryStepBleedEffect
    damage:
      types:
        Slash: 10
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampBleeders
  name: Clamping the bleeders
  components:
  - type: SurgeryStep
    tools:
    - type: Hemostat
    add:
    - type: BleedersClamped
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: hemostat
  - type: SurgeryClampBleedEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSawBones
  name: Sawing through the bones
  components:
  - type: SurgeryStep
    duration: 5
    tools:
    - type: BoneSaw
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/saw.rsi
    state: saw
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepPriseOpenBones
  name: Prying the bones open
  components:
  - type: SurgeryStep
    tools:
    - type: BoneSetter
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: setter

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseBones
  name: Closing the bones
  components:
  - type: SurgeryStep
    tools:
    - type: BoneSetter
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: setter

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepMendRibcage
  name: Mending the ribs
  components:
  - type: SurgeryStep
    tools:
    - type: BoneGel
    reagentId: BoneGel
    reagentQuantity: 5
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/bone_gel.rsi
    state: bone-gel

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepMendSlime
  name: Reforming the slime mass
  components:
  - type: SurgeryStep
    tools:
    - type: BoneGel
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/bone_gel.rsi
    state: bone-gel

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepMendSkull
  name: Mending the skull
  components:
  - type: SurgeryStep
    tools:
    - type: BoneGel
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/bone_gel.rsi
    state: bone-gel

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseIncision
  name: Closing the incision
  components:
  - type: SurgeryStep
    tools:
    - type: Cautery
    remove:
    - type: SkinRetracted
    - type: BleedersClamped
    - type: IncisionOpen
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: SurgeryStepEmoteEffect
  - type: SurgeryClearProgress

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCloseIncisionDoll
  name: Closing the incision
  components:
  - type: SurgeryStep
    tools:
    - type: Cautery
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepMendShellDoll
  name: Mending the shell
  components:
  - type: SurgeryStep
    tools:
    - type: BoneGel
    remove:
    - type: SkinRetracted
    - type: BleedersClamped
    - type: IncisionOpen
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/bone_gel.rsi
    state: bone-gel
  - type: SurgeryStepEmoteEffect
    emote: Sigh
  - type: SurgeryClearProgress

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepOpenShell
  name: Breaking open the shell
  components:
  - type: SurgeryStep
    duration: 10
    add:
    - type: IncisionOpen
    tools:
    - type: BoneSetter
  - type: SurgeryStepBleedEffect
    damage:
      types:
        Slash: 3
  - type: SurgeryStepEmoteEffect
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: setter

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampTendrils
  name: Removing the tendrils
  components:
  - type: SurgeryStep
    add:
    - type: BleedersClamped
    tools:
    - type: Hemostat
  - type: SurgeryClampBleedEffect
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: hemostat

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepCutAbdominalMuscles
  name: Cutting through the abdominal muscles
  components:
  - type: SurgeryStep
    duration: 5
    tools:
    - type: Scalpel
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: SurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRetractAbdominalWalls
  name: Retracting the abdominal walls
  components:
  - type: SurgeryStep
    tools:
    - type: Retractor
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: retractor

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSutureMuscles
  name: Suturing the abdominal muscles
  components:
  - type: SurgeryStep
    duration: 4
    tools:
    - type: Cautery
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRestoreAbdominalWalls
  name: Restoring the abdominal walls
  components:
  - type: SurgeryStep
    duration: 3
    tools:
    - type: Retractor
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/scissors.rsi
    state: retractor
  - type: SurgeryStepEmoteEffect
