- type: constructionGraph
  id: Water
  start: start
  graph:
    - node: start
      actions:
        - !type:DeleteEntity

    - node: water
      entity: FloorWaterDestructibleEntity
      edges:
        - to: start
          completed:
          - !type:EmptyAllContainers {}
          - !type:PlaySound
            sound: /Audio/Effects/Fluids/watersplash.ogg
          - !type:DeleteEntity {}
          steps:
            - tool: Digging
              doAfter: 5
        - to: waterCatwalk
          completed:
            - !type:SnapToGrid
              southRotation: true
          steps:
            - material: MetalRod
              amount: 2

    - node: waterCatwalk
      entity: FloorWaterCatwalkEntity
      edges:
        - to: water
          completed:
          - !type:SpawnPrototype
                prototype: PartRodMetal1
                amount: 2
          steps:
            - tool: Cutting
