- type: constructionGraph
  id: CounterRetroSteel
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: CounterRetroSteel
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Steel
              amount: 3
            - material: MetalRod
              amount: 2
              doAfter: 2
    - node: CounterRetroSteel
      entity: TableCounterRetroSteel
      edges:
        - to: start
          completed:
            - !type:EmptyAllContainers
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 3
            - !type:SpawnPrototype
              prototype: PartRodMetal
              amount: 2
          steps:
            - tool: Prying
              doAfter: 3

