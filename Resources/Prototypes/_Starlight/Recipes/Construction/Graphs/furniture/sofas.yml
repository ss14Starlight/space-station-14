- type: constructionGraph
  id: SofaSL
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
#region Fancy
        - to: fancyLeft
          steps:
            - material: WoodPlank
              amount: 2
              doAfter: 2
            - material: Cloth
              amount: 2
        - to: fancyRight
          steps:
            - material: WoodPlank
              amount: 2
              doAfter: 2
            - material: Cloth
              amount: 2
        - to: fancyMid
          steps:
            - material: WoodPlank
              amount: 2
              doAfter: 2
            - material: Cloth
              amount: 2

#region Booths
        - to: boothLeft
          steps:
            - material: Steel
              amount: 2
              doAfter: 2
            - material: Plastic
              amount: 2
        - to: boothRight
          steps:
            - material: Steel
              amount: 2
              doAfter: 2
            - material: Plastic
              amount: 2
        - to: boothMid
          steps:
            - material: Steel
              amount: 2
              doAfter: 2
            - material: Plastic
              amount: 2

#region Node-Booths
    - node: boothLeft
      entity: DinerEndLeft
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 2
            - !type:SpawnPrototype
              prototype: SheetPlastic1
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 2

    - node: boothRight
      entity: DinerEndRight
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 2
            - !type:SpawnPrototype
              prototype: SheetPlastic1
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 2

    - node: boothMid
      entity: DinerMiddle
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 2
            - !type:SpawnPrototype
              prototype: SheetPlastic1
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 2

#region Node-Fancy

    - node: fancyLeft
      entity: SofaFancyEndLeft
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 2
            - !type:SpawnPrototype
              prototype: MaterialCloth1
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 2

    - node: fancyRight
      entity: SofaFancyEndRight
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 2
            - !type:SpawnPrototype
              prototype: MaterialCloth1
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 2

    - node: fancyMid
      entity: SofaFancyMiddle
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: MaterialWoodPlank1
              amount: 2
            - !type:SpawnPrototype
              prototype: MaterialCloth1
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 2