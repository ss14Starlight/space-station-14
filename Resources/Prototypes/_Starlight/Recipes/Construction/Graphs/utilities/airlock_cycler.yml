- type: constructionGraph
  id: AirlockCycler
  start: start
  graph:
  - node: start
    edges:
    - to: assembly
      steps:
      - material: Steel
        amount: 2
        doAfter: 2

  - node: assembly
    entity: AirlockCyclerAssembly
    actions:
    - !type:AppearanceChange
    edges:
    - to: wired
      steps:
      - material: Cable
        amount: 2
        doAfter: 1
    - to: start
      completed:
      - !type:GivePrototype
        prototype: SheetSteel1
        amount: 2
      - !type:DeleteEntity {}
      steps:
      - tool: Welding
        doAfter: 2

  - node: wired
    entity: AirlockCyclerAssembly
    actions:
    - !type:AppearanceChange
    edges:
    - to: electronics
      steps:
      - tag: AirlockCyclerElectronics
        store: board
        name: construction-graph-tag-airlock-cycler-electronics
        icon:
          sprite: Objects/Misc/module.rsi
          state: airalarm_electronics
        doAfter: 1
    - to: assembly
      completed:
      - !type:GivePrototype
        prototype: CableApcStack1
        amount: 2
      steps:
      - tool: Cutting
        doAfter: 1

  - node: electronics
    entity: AirlockCyclerAssembly
    actions:
    - !type:AppearanceChange
    edges:
    - to: airlock_cycler
      steps:
      - tool: Screwing
        doAfter: 2
    - to: wired
      completed:
      - !type:EmptyAllContainers
        pickup: true
        emptyAtUser: true
      steps:
      - tool: Prying
        doAfter: 1

  - node: airlock_cycler
    entity: AirlockCycler
    actions:
    - !type:AddContainer
      container: board
    edges:
    - to: electronics
      conditions:
      - !type:ContainerNotEmpty
        container: board
      steps:
      - tool: Screwing
        doAfter: 2

- type: constructionGraph
  id: AirlockCyclerButton
  start: start
  graph:
  - node: start
    edges:
    - to: frame
      steps:
      - material: Steel
        amount: 1
        doAfter: 2

  - node: frame
    entity: AirlockCyclerButtonFrame
    actions:
    - !type:AppearanceChange
    edges:
    - to: wired
      steps:
      - material: Cable
        amount: 1
        doAfter: 1
    - to: start
      completed:
      - !type:GivePrototype
        prototype: SheetSteel1
        amount: 1
      - !type:DeleteEntity {}
      steps:
      - tool: Welding
        doAfter: 2

  - node: wired
    entity: AirlockCyclerButtonFrame
    actions:
    - !type:AppearanceChange
    edges:
    - to: button
      steps:
      - tool: Screwing
        doAfter: 1
    - to: frame
      completed:
      - !type:GivePrototype
        prototype: CableApcStack1
        amount: 1
      steps:
      - tool: Cutting
        doAfter: 1

  - node: button
    entity: AirlockCyclerButton
    edges:
    - to: wired
      steps:
      - tool: Screwing
        doAfter: 2
