- type: constructionGraph
  id: DrinkWaterBottleEmpty
  start: start
  graph:
  - node: start
    edges:
    - to: waterbottle
      steps:
      - material: Plastic
        amount: 1
        doAfter: 20
  - node: waterbottle
    entity: DrinkWaterBottleEmpty

- type: constructionGraph
  id: ClothingMaskMimeSecurity
  start: start
  graph:
