      steps:
      - tag: MimeMask
        name: construction-graph-tag-mime-mask
        icon:
          sprite: /Textures/Clothing/Mask/mime.rsi
          state: icon
        doAfter: 2
      - tag: CheapSunglasses
        name: construction-graph-tag-cheap-sunglasses
        icon:
          sprite: /Textures/Clothing/Eyes/Glasses/sunglasses.rsi
          state: icon
        doAfter: 2
  - node: mask
    entity: ClothingMaskMimeSecurity

