- type: reagent
  id: ConcentratedCorgiJuice
  name: reagent-name-concentratedcorgijuice
  group: Toxins
  desc: reagent-desc-corgiessence
  physicalDesc: reagent-physical-desc-fluffy
  flavor: dogfood
  color: "#ed9715"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.2
      effects:
        - !type:HealthChange
          conditions:
            - !type:ReagentCondition
              reagent: ConcentratedCorgiJuice
              min: 15
          damage:
            types:
              Cellular: 0.5
        - !type:PopupMessage
          type: Local
          visualType: MediumCaution
          messages: [ "generic-reagent-effect-stuffy-throat" ]
          probability: 0.15
        - !type:Polymorph
          prototype: PermanentCorgiMorph
          conditions:
            - !type:ReagentCondition
              reagent: ConcentratedCorgiJuice
              min: 40
        - !type:GenericStatusEffect
          key: RatvarianLanguage
          component: BarkAccent
        - !type:AdjustReagent
          reagent: ConcentratedCorgiJuice
          amount: -20
          conditions:
            - !type:ReagentCondition
              reagent: ConcentratedCorgiJuice
              min: 50
        - !type:AdjustReagent
          conditions:
            - !type:MetabolizerTypeCondition
              type: [ Cyclorite ]
          reagent: ConcentratedCorgiJuice
          amount: 0.1
        # Medicine
        - !type:HealthChange
          damage:
            groups:
              Airloss: -2
              Brute: -2
              Burn: -2
              Toxin: -2
        - !type:SatiateThirst
          factor: 2
        - !type:SatiateHunger
          factor: 2

- type: reagent
  id: JuiceThatMakesYouGlub
  name: reagent-name-glubjuice
  group: Toxins
  desc: reagent-desc-glubjuice
  physicalDesc: reagent-physical-desc-salty
  flavor: JuiceThatMakesYouGlub
  color: "#09ffe2"
  metabolisms:
    Bloodstream:
      metabolismRate: 0.25
      effects:
      - !type:Emote
        emote: ThavenGlub
        showInChat: true
        showInGuidebook: true
        force: true
        probability: 0.5
      - !type:Polymorph
        prototype: SpaceKoiMorph
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Animal ]
          inverted: true
        - !type:ReagentCondition
          reagent: JuiceThatMakesYouGlub
          min: 50
      - !type:AdjustReagent
        reagent: JuiceThatMakesYouGlub
        amount: -20
        conditions:
        - !type:ReagentCondition
          reagent: JuiceThatMakesYouGlub
          min: 50
      - !type:AdjustReagent
        conditions:
          - !type:ReagentCondition
            reagent: JuiceThatMakesYouGlub
            min: 0.11
          - !type:MetabolizerTypeCondition
            type: [ Cyclorite ]
        reagent: JuiceThatMakesYouGlub
        amount: 0.1
