    department: Command
    time: 30h
  - !type:RoleTimeRequirement
    role: JobAssistant # How can you lead the masses if you've never been one of them?
    time: 30h
  - !type:RolesRequirement
    proto: ExtRolesReq
  weight: 15
  startingGear: AssistantManagerGear
  icon: "JobIconAssistantManager"
