- type: job
  id: CentCommServiceWorker
  name: job-name-cc-serviceworker
  description: job-description-cc-serviceworker
  playTimeTracker: JobCentCommServiceWorker
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 5h # Anti shitter/raider protection. Working on CentComm should require having a basic understanding of game mechanics.
  setPreference: false
  icon: "JobIconCCServiceWorker"
  supervisors: job-supervisors-centcom
  canBeAntag: false
  bypassEorPacification: false
  access:
  - Service
  - Maintenance
  - Bar
  - Kitchen
  - Hydroponics
  - Janitor

