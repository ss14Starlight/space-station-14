- type: job
  id: GreenShield
  name: job-name-greenshield
  description: job-description-greenshield
  playTimeTracker: JobCCGreenShield
  requirements:
  - !type:OverallPlaytimeRequirement
    role: JobBlueShield
    time: 3h # You are a bodyguard of the highest ranking people in the sector, you have to have some experience in the closest related role
  - !type:RolesRequirement
    proto: ExtRolesReq
  setPreference: false
  startingGear: GSOGear
  icon: JobIconNTNCBlueShield # The icon works fine, no need to change it imo
  rules: job-rules-CC-aligned
  supervisors: job-supervisors-centcom
  canBeAntag: false
  bypassEorPacification: true
  accessGroups:
  - AllAccess
  #access: # Removing Centcomm access as we anticipate wanting to be able to spawn these with minimal or no staff intervention. Can be re-added with a smite if needed
  #- CentralCommand
  special:
    - !type:AddImplantSpecial
      implants: [ MindShieldImplant, DeathRattleImplantCentcomm, RadioImplantCentComm ]

- type: startingGear
  id: GSOGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitERTLeader
    back: ClothingBackpackERTLeader
    shoes: ClothingShoesBootsMagERT
    outerClothing: ClothingOuterHardsuitERTLeader
    neck: ClothingNeckMantleERTLeader
    id: NTNCCSPDA
    eyes: ClothingEyesGlassesCentComm
    ears: ClothingHeadsetCentCom
    mask: ClothingMaskGasERT
    belt: ClothingBeltBlueShieldMedicalBelt
    gloves: ClothingHandsGlovesCombat
    suitstorage: WeaponSubMachineGunWt550
    pocket1: WeaponEnergyMagnumGun
    pocket2: GreenEnergyShield
