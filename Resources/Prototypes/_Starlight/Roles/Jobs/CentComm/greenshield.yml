- type: job
  id: CentralCommandGreenShield
  name: job-name-greenshield
  description: job-description-greenshield
  playTimeTracker: JobCCGreenShield
  requirements:
  - !type:RoleTimeRequirement
    role: JobBlueShield
    time: 3h # You are a bodyguard of the highest ranking people in the sector, you have to have some experience in the closest related role
  - !type:RolesRequirement
    proto: ExtRolesReq
  setPreference: false
  startingGear: GSOGear
  icon: JobIconNTNCBlueShield # The icon works fine, no need to change it imo
  rules: job-rules-CC-aligned
  supervisors: job-supervisors-centcom
  canBeAntag: false
  bypassEorPacification: true
  accessGroups:
  - AllAccess
  access:
  - CentralCommand
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant, DeathRattleImplantCentcomm ] #, RadioImplantCentComm ]

- type: startingGear
  id: GSOGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitGreenshield
    back: ClothingBackpackGreenshieldFilled
    shoes: ClothingShoesBootsMagGreenshield
    outerClothing: ClothingOuterHardsuitGreenshield
    neck: ClothingNeckGreenshield
    id: CentCommGreenShieldPDA
    eyes: ClothingEyesGlassesCentComm
    ears: ClothingHeadsetCentCom
    mask: ClothingMaskGasERT
    belt: ClothingBeltGreenshieldFilled
    gloves: ClothingHandsGlovesCombat
    suitstorage: WeaponSubMachineGunWt550
    pocket1: WeaponEnergyMagnumGunGreensheild
    pocket2: GreenEnergyShield

- type: entity
  parent: [ BaseCentcommContraband, ClothingUniformBase ]
  id: ClothingUniformJumpsuitGreenshield
  name: Greenshield uniform
  description: A special suit made for the best of the elites under CentComm.
  components:
    - type: Sprite
      sprite: Clothing/Uniforms/Jumpsuit/ert_leader.rsi
    - type: Clothing
      sprite: Clothing/Uniforms/Jumpsuit/ert_leader.rsi

- type: entity
  parent: [ ClothingBackpack, BaseCentcommContraband ]
  id: ClothingBackpackGreenshield
  name: greenshield Cloak
  description: A spacious cloak with lots of pockets, worn by Greenshield officers.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Back/thermalcloak.rsi
    - type: Storage
      grid:
        - 0,0,8,3
    - type: ExplosionResistance
      damageCoefficient: 0.1

- type: entity
  parent: [ BaseCentcommContraband, ClothingOuterHardsuitSyndieCommander ]
  id: ClothingOuterHardsuitGreenshield
  name: greenshield hardsuit
  description: A protective hardsuit worn by the leader of an emergency response team.
  components:
    - type: Sprite
      sprite: Clothing/OuterClothing/Hardsuits/ERTSuits/ertleader.rsi
    - type: Clothing
      sprite: Clothing/OuterClothing/Hardsuits/ERTSuits/ertleader.rsi
    - type: ExplosionResistance
      damageCoefficient: 0.2
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.4
          Slash: 0.4
          Piercing: 0.3
          Heat: 0.2
          Radiation: 0.01
          Caustic: 0.4
    - type: ToggleableClothing
      clothingPrototype: ClothingHeadHelmetHardsuitERTLeader
    - type: Tag
      tags:
        - Hardsuit
        - WhitelistChameleon
        - CorgiWearable
    - type: ClothingSpeedModifier
      walkModifier: 1 #Got to be able to keep up with the nice walk of the officials
      sprintModifier: 0.95

- type: entity
  parent: [BaseCentcommContraband, ClothingShoesBootsMagSyndie]
  id: ClothingShoesBootsMagGreenshield
  name: greenshield magboots
  description: Upgraded magnetic boots utilized by NanoTrasen's Emergency Response Teams, they have a heavy magnetic pull and integrated thrusters. It can hold 0.75 L of gas. # SL
  components:
    - type: Sprite
      sprite: Clothing/Shoes/Boots/magboots-ert.rsi
    - type: Clothing
      sprite: Clothing/Shoes/Boots/magboots-ert.rsi
    - type: ClothingSpeedModifier
      walkModifier: 1 #Got to be able to keep up with the nice walk of the officials
      sprintModifier: 0.9

- type: entity
  parent: [ ClothingNeckBase ]
  id: ClothingNeckGreenshield
  name: greenshield mantle
  description: Extraordinary decorative drape over the shoulders.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Neck/Mantles/ERTmantle.rsi
    - type: Clothing
      sprite: _Starlight/Clothing/Neck/Mantles/ERTmantle.rsi

- type: entity
  parent: [BaseCentcommContraband, ClothingBeltBlueShieldMedicalBelt]
  id: ClothingBeltGreenshield
  name: greenshield medical belt
  description: A tactical belt that can hold many items to save the lives of CentComm.
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Belt/retro_officer_belt.rsi
    - type: Clothing
      sprite: _Starlight/Clothing/Belt/retro_officer_belt.rsi
    - type: Appearance

- type: entity
  id: ClothingBeltGreenshieldFilled
  parent: ClothingBeltGreenshield
  suffix: Filled
  components:
    - type: EntityTableContainerFill
      containers:
        storagebase: !type:AllSelector
          children:
            - id: Truncheon
            - id: Handcuffs
            - id: PinpointerUniversal
            - id: CombatMedipen
            - id: CombatMedipen
            - id: MedkitCombatFilled
            - id: CombatMedipen
            - id: CombatMedipen
            - id: FlashlightSeclite
            - id: BodyBagCCFolded

- type: entity
  id: ClothingBackpackGreenshieldFilled
  parent: ClothingBackpackGreenshield
  suffix: Filled
  components:
    - type: EntityTableContainerFill
      containers:
        storagebase: !type:AllSelector
          children:
            - id: MagazinePistolSubMachineGunTopMounted
            - id: MagazinePistolSubMachineGunTopMounted
            - id: MagazinePistolSubMachineGunTopMounted
            - id: JawsOfLifeMed
            - id: DefibrillatorCompact
            - id: TearGasGrenade
            - id: SmokeGrenade
            - id: GrenadeFlashBang
            - id: DrinkMREFlask

- type: entity
  id: BodyBagCC
  parent: [ BodyBagLockable, BaseCentcommContraband ]
  name: CentComm Lockable body bag
  components:
    - type: Sprite
      sprite: _Starlight/Admeme/Objects/MedTak/bodybag.rsi
    - type: Icon
      sprite: _Starlight/Admeme/Objects/MedTak/bodybag.rsi
      state: bag
    - type: AccessReader
      access: [["CentralCommand"]]
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 60
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]

- type: entity
  id: BodyBagCCFolded
  parent: BodyBagCC
  suffix: folded
  components:
    - type: Foldable
      folded: true

- type: entity
  name: MT-7G Magnum
  parent: [ BaseWeaponBatterySmall, BaseCentcommContraband, BaseGrandTheftContraband ]
  id: WeaponEnergyMagnumGunGreensheild
  description: This is an expensive, modern recreation of the Mateba revolver with a minor overclock. CED assures a 96% reliability with regular maintenance.
  components:
    - type: Gun
      fireRate: 2
      soundGunshot:
        path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
    - type: Appearance
    - type: Sprite
      sprite: _Starlight/Objects/Weapons/Guns/Battery/Energy_Magnum.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
    - type: Lock
      mindShieldLock: true
      autoUnlock: true
      autoLock: true
    - type: AccessReader
      access: [ [ "CentralCommand" ] ]
    - type: Item
      size: Small
      shape:
        - 0, 0, 1, 1
      sprite: _Starlight/Objects/Weapons/Guns/Battery/Energy_Magnum.rsi
    - type: BatteryAmmoProvider
      proto: DisablerBolt
      fireCost: 80
    - type: BatteryWeaponFireModes
      fireModes:
        - proto: DisablerBolt # same as X-01
          fireCost: 40
          magState: disable
          visualState: disable-unshaded
        - proto: RedHeavyLaser # Does more damage but costs more energy. 8 shots per full charge
          fireCost: 200
          magState: kill
          visualState: kill-unshaded
        - proto: DestructionBeam # structural damage, same as X-01
          fireCost: 100
          magState: destroy
          visualState: destroy-unshaded
    - type: Battery
      maxCharge: 1600
      startingCharge: 1500
    - type: BatterySelfRecharger
      autoRechargeRate: 150 # much faster charging...
      autoRechargePauseTime: 10 # but 10 second delay beteen shooting and it starting to recharge
