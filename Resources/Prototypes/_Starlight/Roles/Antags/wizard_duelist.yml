# Moved from Moff Station since we've made significant changes to it.

# Wizard role preference
- type: antag
  id: WizardDuelist
  name: roles-solo-antagonist-wizard-duelist-name
  antagonist: true
  setPreference: true
  objective: roles-solo-antagonist-wizard-duelist-objective
  roleLoadout: [ AntagWizardDuelist ]
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 48h # You've got the potential to mass grief.
  - !type:DepartmentTimeRequirement
    department: Security
    time: 6h
  guides: [ WizardDuel ]

# Wizard duelist starting gear
- type: startingGear
  id: WizardDuelistBaseGear
  equipment:
    shoes: ClothingShoesWizard
    id: WizardPDA
    back: ClothingBackpackWizard
    ears: ClothingHeadsetAltWizard
    belt: ClothingBeltWand
    pocket1: WizardTeleportScroll
    pocket2: WizardsGrimoire
  inhand:
    - WizardPersonalAI
  storage:
    back:
    - EncryptionKeyWinds # Reward for killing a wizard, or something they can use to "assign" an apprentice. Non-duelists don't get this, it spawns on their shuttle instead. (It's not mapped in wizard's court to stop 1 wizard from taking all 6 of them.)

- type: startingGear
  parent: WizardDuelistBaseGear
  id: WizardDuelistRedGear
  equipment:
