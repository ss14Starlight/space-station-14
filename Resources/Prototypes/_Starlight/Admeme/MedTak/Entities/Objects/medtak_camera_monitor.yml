- type: entity
  id: MedtakPortableCameraMonitor
  parent: [ BaseItem, BaseMedTakContraband ]
  name: MedTak portable camera monitor
  description: A wireless MedTak camera monitor. You're watching them. Maybe.
  components:
  - type: Sprite
    sprite: Objects/Devices/camera_bug.rsi
    layers:
    - state: camera_bug
  - type: Item
    sprite: Objects/Devices/camera_bug.rsi
  - type: ActivatableUI
    requireActiveHand: false
    inHandsOnly: true
    key: enum.SurveillanceCameraMonitorUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SurveillanceCameraMonitorUiKey.Key:
        type: SurveillanceCameraMonitorBoundUserInterface
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: MedTak
    transmitFrequencyId: MedTak
  - type: WirelessNetworkConnection
    range: 4000
  - type: SurveillanceCameraMonitor

- type: entity
  parent: ComputerSurveillanceWirelessCameraMonitor
  id: ComputerSurveillanceWirelessMedTakCameraMonitor
  name: MedTak camera monitor
  description: A wireless MedTak camera monitor. You're watching them. Maybe.
  components:
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: MedTak
    transmitFrequencyId: MedTak
  - type: WirelessNetworkConnection
    range: 4000
