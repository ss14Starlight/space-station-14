- type: entity
  id: BaseBorgModuleMedTak
  parent: BaseBorgModule
  abstract: true
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Robotics/borgmodule.rsi
  - type: BorgModule
    borgFitTypes:
    - borg-type-medtak
  - type: Tag
    tags:
    - BorgModuleMedTak
  - type: Item
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#ffffff"
      - state: base-module-inhand-left
        color: "#660505"
      - state: base-part-inhand-left
      - state: base-stripes-inhand-left
        color: "#ffffff"
      right:
      - state: base-icon-inhand-right
        color: "#ffffff"
      - state: base-module-inhand-right
        color: "#660505"
      - state: base-part-inhand-right
      - state: base-stripes-inhand-right
        color: "#ffffff"

- type: entity
  id: BorgModuleMedTakMedical
  parent: [ BaseBorgModuleMedTak, BaseProviderBorgModule ]
  name: медицинский модуль киборга MedTak
  description: Модуль киборга MedTak для медподдержки.
  components:
  - type: Sprite
    layers:
    - state: medtak
    - state: icon-medtak-med
  - type: ItemBorgModule
    hands:
    - item: MedTakHypo
    - hand:
        emptyLabel: borg-slot-topicals-empty
        emptyRepresentative: MedicatedSuture
        whitelist:
          components:
          - Healing
          - FitsInDispenser
          tags:
          - ChemDispensable
          - Bottle
    - item: Syringe
    - item: MedTakHoverBedSpawnFolded
      hand:
        emptyLabel: borg-slot-rollerbeds-empty
        emptyRepresentative: MedTakHoverBed
        whitelist:
          tags:
          - BodyBag
          - RollerBed
    - item: MedkitCombatMedTakFilledBorg
    - item: BottleCaseMedTakFilled
  - type: BorgModuleIcon
    icon: { sprite: _Starlight/Admeme/MedTak/Interface/actions_borg.rsi, state: medtak-aid-module }

- type: entity
  id: BorgModuleMedTakRifle
  parent: [ BaseBorgModuleMedTak, BaseProviderBorgModule ]
  name: стрелковый модуль киборга MedTak
  description: Модуль киборга MedTak с укороченным КОД-9 и штурмовым молотом.
  components:
  - type: Sprite
    layers:
    - state: medtak
    - state: icon-medtak-sec
  - type: ItemBorgModule
    hands:
    - item: WeaponMedTakRifleROW
    - item: HammerMedTakOneHanded
  - type: BorgModuleIcon
    icon: { sprite: _Starlight/Admeme/MedTak/Interface/actions_borg.rsi, state: medtak-combat-module }

- type: entity
  id: BorgModuleMedTakDocuments
  parent: [ BaseBorgModuleMedTak, BaseProviderBorgModule ]
  name: MedTak documents cyborg module
  description: A MedTak cyborg module for handling payments and documents.
  components:
  - type: Sprite
    layers:
    - state: medtak
    - state: icon-paperwork
  - type: ItemBorgModule
    hands:
    - item: Pen
    - hand:
        emptyLabel: borg-slot-documents-medtak-empty
        emptyRepresentative: PaperMedTak
        whitelist:
          tags:
          - Document
    - hand:
        emptyRepresentative: SpaceCash
        emptyLabel: borg-slot-credits-empty
        whitelist:
          tags:
          - PlayingCardDeckBox
          components:
          - Cash
          - PlayingCard
          - PlayingCardDeck
          - PlayingCardHand
  - type: BorgModuleIcon
    icon: { sprite: _Starlight/Admeme/MedTak/Interface/actions_borg.rsi, state: medtak-documents-module }
