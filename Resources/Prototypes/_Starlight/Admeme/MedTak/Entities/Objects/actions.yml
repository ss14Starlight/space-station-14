- type: entity
  parent: BaseAction
  id: ActionDefib
  name: Defibrillate
  components:
  - type: Action
    icon:
      sprite: Objects/Specific/Medical/defib.rsi
      state: icon
    itemIconStyle: BigAction
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:DefibActionEvent

- type: entity
  parent: BaseAction
  id: MedTakActionToggleAmmo
  name: Toggle Ammo Type
  description: Switch the ammo type fired by this gun.
  components:
  - type: Action
    icon:
      sprite: _Starlight/Interface/Actions/actions_borg.rsi
      state: medtak-aid-module
    useDelay: 0.25
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:GunToggleAmmoActionEvent
