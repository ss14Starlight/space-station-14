# MedTak
- type: entity
  abstract: true
  parent: BaseBorgTransponder
  id: BaseMedTakTransponder
  components:
  - type: DeviceNetwork
    receiveFrequencyId: MedTakOperators
    transmitFrequencyId: MedTak
  - type: SurveillanceCamera
    networkSet: true
    nameSet: True
    id: MedTakOperators
    useEntityNameAsCameraId: true

- type: entity
  id: BorgChassisMedTak
  parent: [BaseBorgChassisNotIonStormable, BaseMedTakTransponder]
  name: силикон MedTak
  description: Многоцелевой тяжёлый силиконовый корпус для поддержки отрядов MedTak.
  abstract: true
  components:
    - type: TextToSpeech
    - type: Sprite
      sprite: _Starlight/Admeme/MedTak/Mobs/Silicon/Chassis/medtak.rsi
      layers:
      - state: borg
      - state: borg_e
        map: [ "enum.BorgVisualLayers.Light" ]
        shader: unshaded
        visible: false
      - state: borg_l
        shader: unshaded
        map: [ "light" ]
        visible: false
    - type: BorgChassis
      jobIconOverride: JobIconMedTakBorg
      jobTitleOverride: chat-radio-medtak-borg
      maxModules: 8
      moduleWhitelist:
        tags:
        - BorgModuleGeneric
        - BorgModuleMedTak
      hasMindState: borg_e
      noMindState: borg_e_r
    - type: Repairable
      allowSelfRepair: true
    - type: BypassLock
      bypassDelay: 15
    - type: Access
      tags:
      - MedTak
      - Medical
      - Maintenance
    - type: AccessReader
      access: [["MedTak"]]
    - type: ShowImplantedIcons
      shownIcons:
      - MedTak
    - type: ShowHealthBars
      damageContainers:
      - Biological
      - IPC
      - Hybrid
      - MoffDemonBiological
    - type: SolutionScanner
    - type: FlashImmunity
      showInExamine: false
    - type: HealthAnalyzer
      damageContainers:
      - Biological
      - Hybrid
      - MoffDemonBiological
    - type: ActionGrant
      actions:
      - ActionMedTek # MedTek With an E my beloathed
    - type: UserInterface
      interfaces:
        enum.HealthAnalyzerUiKey.Key:
          type: HealthAnalyzerBoundUserInterface
    - type: IntrinsicRadioTransmitter
      channels:
      - Binary
      - MedTak
      - Common
      - Medical
    - type: ActiveRadio
      channels:
      - Binary
      - MedTak
      - Common
      - Medical
    - type: MovementAlwaysTouching
    - type: Speech
      speechSounds: SyndieBorg
      allowedEmotes: ['Beep', 'Ping', 'Buzz', 'Buzz-Two', 'Chime', 'Laugh']
    - type: Vocal
      sounds:
        Unsexed: UnisexSiliconSyndicate
    - type: ShowJobIcons
    - type: ShowMindShieldIcons
    - type: SiliconLawProvider
      laws: MedTakLawset
    - type: Tag
      tags:
      - DoorBumpOpener
      - FootstepSound
      - CanPilot
      - SiliconEmotes
      - Unimplantable
    - type: PointLight
      color: "#d55858"
      radius: 5
      energy: 3
    - type: Damageable
      damageModifierSet: ArmoredSilicon
    - type: BorgTransponder
      name: MedTak sillicon
      sprite:
        sprite: _Starlight/Admeme/MedTak/Mobs/Silicon/Chassis/medtak.rsi
        state: borg
    - type: InteractionPopup
      interactSuccessString: petting-success-medtak-cyborg
      interactFailureString: petting-failure-medtak-cyborg
