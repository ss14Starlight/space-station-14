- type: entity
  abstract: true
  id: BaseVariableHeavySettings
  components:
  - type: UserInterface
    interfaces:
      enum.GunSelectableAmmoUiKey.Key:
        type: GunSelectableAmmoBoundUserInterface
  - type: GunSelectableAmmo
    settings:
    - damage: # SP
        types:
          Piercing: 19
      armorPiercing: -0.13
      ricochetChance: 0.30
      pierceChance: 0.40
      pierceDeviation: 0.05
      pierceLevel: "Metal"
      name: setting-standard-kinetic
      icon:
        sprite: _Starlight/Admeme/MedTak/Weapons/ammo-selection.rsi
        state: standard-kinetic
    - damage: # HP
        types:
          Piercing: 25
      armorPiercing: -1.00
      ricochetChance: 0.15
      pierceChance: 0.03
      pierceDeviation: 0.05
      pierceLevel: "Wood"
      name: setting-hollow-point
      icon:
        sprite: _Starlight/Admeme/MedTak/Weapons/ammo-selection.rsi
        state: hollow-point
    - damage: # FMJ
        types:
          Piercing: 13
      armorPiercing: 0.25
      ricochetChance: 0.30
      pierceChance: 0.69
      pierceDeviation: 0.05
      pierceLevel: "Metal"
      name: setting-armour-piercing
      icon:
        sprite: _Starlight/Admeme/MedTak/Weapons/ammo-selection.rsi
        state: armour-piercing

