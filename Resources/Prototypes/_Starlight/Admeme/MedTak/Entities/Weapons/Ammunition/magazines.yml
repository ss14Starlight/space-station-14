# Magazines

- type: entity
  id: MagazineVariableBoxHeavy
  name: "HVA Box Magazine"
  parent: [ BaseItem, BaseMedTakContraband ]
  components:
  - type: Tag
    tags:
      - BoxHVA
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - RoundHVA
    proto: RoundVariableHeavy
    capacity: 75
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Starlight/Admeme/MedTak/Weapons/Magazines/HVAbox.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: light
      shader: unshaded
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false
  - type: Appearance

