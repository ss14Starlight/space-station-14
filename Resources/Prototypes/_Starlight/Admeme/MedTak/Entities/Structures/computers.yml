- type: entity
  parent: ComputerComms
  id: MedTakCommsConsole
  name: MedTak communications computer
  description: Use this to communicate with the station for announcements and advertisements.
  components:
    - type: AccessReader
      access: [[ "MedTak" ]]
    - type: Sprite
      layers:
      - map: ["computerLayerBody"]
        state: computer
      - map: ["computerLayerKeyboard"]
        state: generic_keyboard
      - map: ["computerLayerScreen"]
        state: comm-medtak
        sprite: _Starlight/Admeme/MedTak/Structures/computers.rsi
      - map: ["computerLayerKeys"]
        state: generic_keys
      - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
        state: generic_panel_open
    - type: CommunicationsConsole
      sound: /Audio/_Starlight/Announcements/medtakjump.ogg
      title: comms-console-announcement-title-medtak
      color: "#FAFAFA"
      canShuttle: false
      global: true
      settableAlertLevels: []
      canBroadcast: false
    - type: SecureCommandTerminalConsole
      enabled: false
    - type: PointLight
      enabled: true
      radius: 1.5
      energy: 1.6
      color: "#57b8f0"
