- type: entity
  name: casino chip
  parent: BaseItem
  id: CasinoChip
  description: A casino chip. Only worth what the house says it is.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Casino/Objects/casino_chips.rsi
    state: chips-0
    layers:
    - state: chips-0
      map: ["base"]
  - type: Item
    sprite: _Starlight/Admeme/Casino/Objects/casino_chips.rsi
    size: Tiny
  - type: Appearance
  - type: UserInterface
    interfaces:
      enum.StackCustomSplitUiKey.Key:
        type: StackCustomSplitBoundUserInterface
  - type: Stack
    count: 1
    stackType: CasinoChip
    baseLayer: base
    layerStates:
    - chips-0
    - chips-1
    - chips-2
    - chips-3
    - chips-4
    - chips-5
    - chips-6
    - chips-7
    - chips-8
    - chips-9
    - chips-10
    layerFunction: Threshold
  - type: StackLayerThreshold
    thresholds: [2, 10, 50, 100, 250, 500, 1000, 1500, 2500, 10000]
  - type: StaticPrice
    price: 0

- type: entity
  parent: CasinoChip
  id: CasinoChip10
