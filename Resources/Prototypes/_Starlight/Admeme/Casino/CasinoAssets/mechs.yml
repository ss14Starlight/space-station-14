- type: entity
  name: House Spawner
  suffix: Filled
  id: SpawnMechHouseFilled
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - state: green
        - sprite: _Starlight/Admeme/Casino/Objects/mechs/house.rsi
          state: base
        - state: mechicon
    - type: ConditionalSpawner
      prototypes:
        - MechHouseFilled

