- type: entity
  parent:  [ BasePDA, BaseCasinoContraband ]
  id: CasinoPDA
  abstract: true
  components:
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-casino
  - type: PdaBorderColor
    accentVColor: "#FFA213"
    borderColor: "#600000"
  - type: Sprite
    sprite: Objects/Devices/pda.rsi
    layers:
    - sprite: _Starlight/Admeme/Casino/Objects/pda.rsi
      map: [ "enum.PdaVisualLayers.Base" ]
      state: "pda-casino"
    - state: "light_overlay"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - state: "id_overlay"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false
  - type: Icon
    sprite: _Starlight/Admeme/Casino/Objects/pda.rsi
    state: pda-casino
  - type: CartridgeLoader
    uiKey: enum.PdaUiKey.Key
    preinstalled:
      - CrewManifestCartridge
      - NotekeeperCartridge
      - NanoTaskCartridge
      - NewsReaderCartridge
      - AstroNavCartridge
      - NanoChatCartridge
  - type: Tag
    tags:
    - DoorBumpOpener

- type: entity
  parent: CasinoPDA
  id: CasinoPDASecurity
  name: Gamorrah security PDA
  description:  I don't enjoy killing, but when done righteously, it's just a chore, like any other. The house always wins.
  components:
  - type: Pda
    id: CasinoIDCardSecurity

- type: entity
  parent: CasinoPDA
  id: CasinoPDAOwner
  name: Gamorrah owner PDA
  description: The house always wins.
  components:
    - type: Pda
      id: CasinoIDCardOwner


- type: entity
  parent: CasinoPDA
  id: CasinoPDAManager
  name: Gamorrah manager PDA
  description: The house always wins.
  components:
    - type: Pda
      id: CasinoIDCardManager

- type: entity
  parent: CasinoPDA
  id: CasinoPDADealer
  name: Gamorrah dealer PDA
  description: Success depends on forethought, dispassionate calculation of probabilities, accounting for every stray variable.The house always wins.
  components:
    - type: Pda
      id: CasinoIDCardDealer

- type: entity
  parent: CasinoPDA
  id: CasinoPDABrigmed
  name: Gamorrah brigmedic PDA
  description: Patch them up, send them back to the tables. The house always wins.
  components:
    - type: Pda
      id: CasinoIDCardBrigmed
    - type: CartridgeLoader
      preinstalled:
        - CrewManifestCartridge
        - NotekeeperCartridge
        - NanoTaskCartridge
        - NewsReaderCartridge
        - AstroNavCartridge
        - NanoChatCartridge
        - MedTekCartridge

- type: entity
  parent: CasinoPDA
  id: CasinoPDATreasurer
  name: Gamorrah treasurer PDA
  description: Every chip counted, every credit accounted for. The house always wins.
  components:
    - type: Pda
      id: CasinoIDCardTreasurer
