# modified body so that it uses feline hands and feet. paws!!!
- type: body
  id: CatMoth
  name: "catmoth"
  root: torso
  slots:
    head:
      part: HeadMoth
      connections:
        - torso
      organs:
        brain: OrganHumanBrain
        eyes: OrganMothEyes
        tongue: OrganHumanTongue
        eye_implant: null
        brain_implant: null
    torso:
      part: TorsoMoth
      connections:
        - right arm
        - left arm
        - right leg
        - left leg
      organs:
        heart: OrganAnimalHeart
        lungs: OrganHumanLungs
        stomach: OrganCatMothStomach
        liver: OrganAnimalLiver
        kidneys: OrganHumanKidneys
        cavity: null
    right arm:
      part: RightArmFelionoid
      connections:
        - right hand
    left arm:
      part: LeftArmFelionoid
      connections:
        - left hand
    right hand:
      part: RightHandFelionoid
      organs:
        hand_implant: null
    left hand:
      part: LeftHandFelionoid
      organs:
        hand_implant: null
    right leg:
      part: RightLegMoth
      connections:
        - right foot
    left leg:
      part: LeftLegMoth
      connections:
        - left foot
    right foot:
      part: RightFootFelionoid
    left foot:
      part: LeftFootFelionoid
