- type: entity
  id: PlayerBorgSyndicateAssaultGhostRole
  parent: PlayerBorgSyndicateAssaultBattery
  suffix: Ghost role
  components:
    - type: GhostRole
      name: ghost-role-information-syndicate-cyborg-assault-name
      description: ghost-role-information-syndicate-cyborg-description
      rules: ghost-role-information-silicon-rules
      mindRoles: [MindRoleGhostRoleSiliconAntagonist] # Starlight
      important: true # SL
      raffle:
        settings: default
      job: Borg
    - type: GhostTakeoverAvailable

- type: entity
  id: PlayerBorgSyndicateSaboteurGhostRole
  parent: PlayerBorgSyndicateSaboteurBattery
  suffix: Ghost role
  components:
    - type: GhostRole
      name: ghost-role-information-syndicate-cyborg-saboteur-name
      description: ghost-role-information-syndicate-cyborg-description
      rules: ghost-role-information-silicon-rules
      mindRoles: [MindRoleGhostRoleSiliconAntagonist] # Starlight
      important: true # SL
      raffle:
        settings: default
      job: Borg
    - type: GhostTakeoverAvailable

- type: entity
  parent: MarkerBase
  id: PlayerBorgSyndicateInvasionGhostRoleSpawner
  name: syndicate invasion borg spawner
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: Structures/Decoration/banner.rsi
        state: banner_syndicate
  - type: EntityTableSpawner
    table: !type:GroupSelector
      children:
      - id: PlayerBorgSyndicateAssaultGhostRole
      - id: PlayerBorgSyndicateSaboteurGhostRole
        weight: 0.5 # Saboteurs are kinda like cyborg medics, we want less.

- type: entity
  id: PlayerBorgSyndicateStealthGhostRole
  parent: PlayerBorgSyndicateStealthBattery
  suffix: Ghost role
  components:
    - type: GhostRole
      name: ghost-role-information-syndicate-cyborg-stealth-name
      description: ghost-role-information-syndicate-cyborg-description
      rules: ghost-role-information-silicon-rules
      mindRoles: [MindRoleGhostRoleSiliconAntagonist]
      important: true # SL
      raffle:
        settings: default
    - type: GhostTakeoverAvailable

- type: entity
  id: PlayerBorgSyndicateMedicalGhostRole
  parent: PlayerBorgSyndicateMedicalBattery
  suffix: Ghost role
  components:
    - type: GhostRole
      name: ghost-role-information-syndicate-cyborg-medical-name
      description: ghost-role-information-syndicate-cyborg-description
      rules: ghost-role-information-silicon-rules
      mindRoles: [MindRoleGhostRoleSiliconAntagonist]
      important: true
      raffle:
        settings: default
    - type: GhostTakeoverAvailable

- type: entity
  id: PlayerBorgChassisTSFBattery
  parent: BorgChassisTSF
  suffix: Battery, Module
  components:
  - type: ContainerFill
    containers:
      borg_brain:
        - PositronicBrain
  - type: DefaultBorgModules
    modules:
      - BorgModulePrying
      - BorgModuleTool
      - BorgModuleFireExtinguisher
      - BorgModuleTSF
      - BorgModuleTSFCombat
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHyper
        blacklist:
          tags:
          - MechReactor

- type: entity
  parent: PlayerBorgChassisTSFBattery
  id: PlayerBorgChassisTSFGhostRole
  suffix: Ghost role
  components:
  - type: GhostRole
    name: ghost-role-information-tsf-borg-name
    description: ghost-role-information-tsf-borg-desc
    rules: ghost-role-information-silicon-rules
    important: true # SL
    raffle:
      settings: default
    reregister: false
    job: Borg
  - type: GhostTakeoverAvailable
