- type: entity
  id: RandomHumanoidSpawnerETOOperativeRifle
  name: ETO Rifle Operative
  suffix: Admeme
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Mobs/etomaskgrunt.rsi
    state: icon
  - type: RandomMetadata
    nameSegments:
    - NamesETOLast
    nameFormat: name-format-eto-operative
  - type: RandomHumanoidSpawner
    settings: ETOOperativeRifle

- type: randomHumanoidSettings
  id: ETOOperativeRifle
  parent: EventHumanoid
  components:
  - type: GhostRole
    name: ghost-role-information-eto-operative-name
    description: ghost-role-information-eto-operative-description
    rules: ghost-role-information-antagonist-rules
    raffle:
      settings: default
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
  - type: AntagImmune
  - type: NoObjectiveTarget
  - type: Loadout
    prototypes: [ ETOOperativeGearRifle ]
  - type: RandomMetadata
    nameSegments:
    - NamesETOLast
    nameFormat: name-format-eto-operative

