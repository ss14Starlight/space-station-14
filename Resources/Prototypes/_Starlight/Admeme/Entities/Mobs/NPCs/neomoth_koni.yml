# Combination of cat + moth with unique colored alts of some markings
- type: entity
  id: MobKoni
  parent: MobMoth # more moth-like than cat-like, makes sense to inherit this and not felionoid
  categories: [HideSpawnMenu] # not supposed to be spawnable, designed for characterforceprototype.
  name: Koni Clothsbane
  save: false # player entity, don't save this to maps
  components:
    - type: Speech
      allowedEmotes: [ 'Mew', 'Hisses', 'Meow', 'Thump', 'Marr', 'Growl', 'Purr', 'Trill', 'Chitter', 'Squeak', 'Flap' ] # combine felionoid and moth emotes
    - type: Vocal
      sounds:
        Male: UnisexCatMoth
        Female: UnisexCatMoth
        Unsexed: UnisexCatMoth
    - type: BodyEmotes
      soundsId: CatMothBodyEmotes
    - type: TextToSpeech
      voice: ICASSP48
    - type: Body
      prototype: CatMoth
    - type: Loadout
      postSpawnGear: [ KoniTrinkets ]
    - type: Icon
      sprite: Mobs/Species/Moth/parts.rsi
      state: full
    - type: HumanoidAppearance
      species: CatMoth
      # Set all of this shit up manually because CatMoth is not roundstart so it can't just be saved to a character yml.
      allowProfileOverride: false
      gender: Female
      eyeColor: '#000000FF'
      skinColor: '#5D4AC7FF'
      markingSet:
        markings:
          Tail:
            - markingId: KoniFluff
              visible: True
              isGlowing: False
              markingColor:
                - '#7569C6FF'
            - markingId: KoniWings
              visible: True
              isGlowing: False
              markingColor:
                - '#4E886DFF'
            - markingId: ExtraFluffyTail
              visible: True
              isGlowing: False
              markingColor:
                - '#1C2F7FFF'
          Hair:
            - markingId: HumanHairCoolSpikes
              visible: True
              isGlowing: False
              markingColor:
                - '#5D4AC7FF'
          HeadTop:
            - markingId: KoniEars
              visible: True
              isGlowing: False
              markingColor:
                - '#FFFFFFFF'
            - markingId: MothAntennaeEnlarged
              visible: True
              isGlowing: False
              markingColor:
                - '#7569C6FF'
          Snout:
            - markingId: KoniCheeks
              visible: True
              isGlowing: False
              markingColor:
                - '#5D4AC7FF'
    - type: Inventory
      femaleDisplacements:
        jumpsuit:
          sizeMaps:
            32:
              sprite: Mobs/Species/Moth/displacement.rsi
              state: jumpsuit-female
        back:
          sizeMaps:
            32:
              sprite: Mobs/Species/Moth/displacement.rsi
              state: back
        outerClothing:
          sizeMaps:
            32:
              sprite: Mobs/Species/Moth/displacement.rsi
              state: outerclothing
        gloves:
          sizeMaps:
            32:
              sprite: _Starlight/Mobs/Species/Felionoid/displacement.rsi
              state: hand
        shoes:
          sizeMaps:
            32:
              sprite: _Starlight/Admeme/Mobs/bodyparts_displacements.rsi
              state: catmoth_shoes
        head:
          sizeMaps:
            32:
              sprite: _Starlight/Mobs/Species/Felionoid/displacement.rsi
              state: head
      displacements:
        jumpsuit:
          sizeMaps:
            32:
              sprite: Mobs/Species/Moth/displacement.rsi
              state: jumpsuit-male
        back:
          sizeMaps:
            32:
              sprite: Mobs/Species/Moth/displacement.rsi
              state: back
        outerClothing:
          sizeMaps:
            32:
              sprite: Mobs/Species/Moth/displacement.rsi
              state: outerclothing
        gloves:
          sizeMaps:
            32:
              sprite: _Starlight/Mobs/Species/Felionoid/displacement.rsi
              state: hand
        shoes:
          sizeMaps:
            32:
              sprite: _Starlight/Admeme/Mobs/bodyparts_displacements.rsi
              state: catmoth_shoes
        head:
          sizeMaps:
            32:
              sprite: _Starlight/Mobs/Species/Felionoid/displacement.rsi
              state: head

# Maybe this is a bit much but this would be more accurate to koni's diet. Fatass moth.
- type: entity
  id: OrganCatMothStomach
  parent: OrganMothStomach
  categories: [HideSpawnMenu]
  components:
    - type: Stomach
      isSpecialDigestibleExclusive: false
