- type: entity
  id: BorgChassisTSF
  parent: BaseBorgChassisNotIonStormable
  name: TSMC assault cyborg
  description: A purpose built assault silicon used by the TSMC.
  abstract: true
  components:
  - type: TextToSpeech
  - type: Sprite
    sprite: _Starlight/Admeme/Mobs/Silicon/Chassis/tsmc.rsi
    layers:
    - state: assault
      map: ["enum.BorgVisualLayers.Body", "movement"]
    - state: assault_l
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: assault_l
      shader: unshaded
      map: ["light","enum.BorgVisualLayers.LightStatus"]
  - type: BorgChassis
    jobIconOverride: JobIconTSF
    jobTitleOverride: chat-radio-tsf-borg
    maxModules: 8
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
      - BorgModuleSecurity
    hasMindState: assault_l
    noMindState: assault_l
  - type: BypassLock
    bypassDelay: 15
  - type: Access
    tags:
    - Solgov
  - type: AccessReader
    access: [["Solgov"]]
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
    - TSF
    - Common
  - type: ActiveRadio
    channels:
    - Binary
    - TSF
    - Common
  - type: MovementAlwaysTouching
  - type: Speech
    speechSounds: SyndieBorg
    allowedEmotes:
    - Laugh
  - type: Vocal
    sounds:
      Unsexed: UnisexSiliconSyndicate
  - type: ShowJobIcons
  - type: ShowMindShieldIcons
  - type: SiliconLawProvider
    laws: SolgovLawset
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Mecha/sound_mecha_powerloader_step.ogg
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
    - CanPilot
    - SiliconEmotes
    - Unimplantable
    - EmagImmune
