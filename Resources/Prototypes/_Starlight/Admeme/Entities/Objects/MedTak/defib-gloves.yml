- type: entity
  abstract: true
  parent: Clothing
  id: ClothingHandsGlovesDefibBase
  components:
  - type: Sprite
    state: icon
  - type: Clothing
    slots: [gloves]
  - type: Item
    size: Small
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Tag
    tags:
    - ClothMade
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 5
  - type: Insulated
  - type: Fiber
    fiberMaterial: fibers-insulative
  - type: FingerprintMask
  - type: Defibrillator
    zapHeal:
      types:
        Asphyxiation: -40
  - type: WearableDefibrillator
  - type: UseDelay

- type: entity
  parent: [ ClothingHandsGlovesDefibBase, BaseMedTakContraband ]
  id: ClothingHandsGlovesDefibMedTak
  name: MedTak charged gloves
  description: These gloves are equipped with specialised electrical contacts to send a 250 joule shock at 2000 volts through your client's heart.
  components:
  - type: Sprite
    sprite: Clothing/Hands/Gloves/powerglove.rsi
  - type: Clothing
    sprite: Clothing/Hands/Gloves/powerglove.rsi

- type: entity
  parent: BaseAction
  id: ActionDefib
  name: Defibrillate
  components:
  - type: Action
    icon:
      sprite: Objects/Specific/Medical/defib.rsi
      state: icon
    itemIconStyle: BigAction
    checkCanInteract: false
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:DefibActionEvent
