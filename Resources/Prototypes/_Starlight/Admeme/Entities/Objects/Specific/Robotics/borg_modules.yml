- type: entity
  id: BorgModuleTSF
  parent: [ BaseBorgModuleSecurity, BaseProviderBorgModule ]
  name: TSF Security cyborg module
  description: A Security TSF cyborg module which allows the unit to use unlethal equipment.
  components:
  - type: Sprite
    layers:
    - state: security
  - type: ItemBorgModule
    hands:
    - item: Flash
      hand:
        emptyRepresentative: Flash
        emptyLabel: borg-slot-flash-empty
        whitelist:
          components:
          - Flash
    - item: Crowbar
    - item: Zipties
      hand:
        emptyRepresentative: Zipties
        emptyLabel: borg-slot-zipties-empty
        whitelist:
          tags:
          - Handcuffs # Can be replaced by handcuffs or zipties
    - item: TSFBatonModel5
    - item: WeaponDisabler
      hand:
        emptyRepresentative: WeaponDisabler
        emptyLabel: borg-slot-disabler-empty
        whitelist:
          tags:
          - Disabler
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: security-unlethal-module }

- type: entity
  id: BorgModuleTSFCombat
  parent: [ BaseBorgModuleSecurity, BaseProviderBorgModule ]
  name: TSMC Combat cyborg module
  description: A TSMC cyborg module which allows the unit to use combat equipment.
  components:
  - type: Sprite
    layers:
    - state: security
  - type: ItemBorgModule
    hands:
    - item: AccessOveriderRecharging
    - item: TSFBatonModel5
    - item: WeaponPistolTSFBorg
    - item: WeaponAdvancedLaser
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: syndicate-weapon-module }
