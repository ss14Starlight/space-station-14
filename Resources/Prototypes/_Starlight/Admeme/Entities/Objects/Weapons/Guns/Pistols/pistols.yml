- type: entity
  name: TSF-Model17
  parent: [BaseTSFContraband, BaseWeaponPistol]
  id: WeaponPistolTSFBorg
  description: A cyborg-mounted weapon system based on the Model 17 pistol. Creates ammunition on the fly from an internal fabricator, which slowly self-charges.
  suffix: Cyborg
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Objects/Weapons/Guns/Pistols/tsf_model17.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Starlight/Admeme/Objects/Weapons/Guns/Pistols/tsf_model17.rsi
  - type: Item
    storedOffset: 0,-2
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mk58.ogg
    fireRate: 5
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
      - FullAuto
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgePistol
    capacity: 10
    proto: CartridgePistolSP
    cycleable: false # No synthesizing ammo.
  - type: BallisticAmmoSelfRefiller
    autoRefillRate: 4s
    affectedByEmp: true
  - type: AmmoCounter
