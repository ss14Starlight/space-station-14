#CCNT Consortium BSOs
- type: entity
  parent: [BaseNanoTrasenContraband, ClothingOuterHardsuitSyndieElite] #sl Change
  id: ClothingOuterHardsuitNTNCConsortium
  name: NanoTrasen navy marine hardsuit
  description: A protective hardsuit worn by NanoTrasen Navy Marines.
  components:
    - type: Sprite
      sprite: _Starlight/Admeme/Clothing/OuterClothing/Hardsuits/ntnc_hardsuit.rsi
    - type: Clothing
      sprite: _Starlight/Admeme/Clothing/OuterClothing/Hardsuits/ntnc_hardsuit.rsi
    - type: ToggleableClothing
      clothingPrototype: ClothingHeadHelmetHardsuitNTNCConsortium

- type: entity
  parent: [BaseNanoTrasenContraband, ClothingOuterHardsuitSyndieMedic] #sl Change
  id: ClothingOuterHardsuitNTNCConsortiumMedic
  name: NanoTrasen navy marine medic hardsuit
  description: A protective hardsuit worn by NanoTrasen Navy Marine medical personnel.
  components:
    - type: Sprite
      sprite: _Starlight/Admeme/Clothing/OuterClothing/Hardsuits/ntnc_med_hardsuit.rsi
    - type: Clothing
      sprite: _Starlight/Admeme/Clothing/OuterClothing/Hardsuits/ntnc_med_hardsuit.rsi
    - type: ToggleableClothing
      clothingPrototype: ClothingHeadHelmetHardsuitNTNCConsortiumMedic
    - type: Tag
      tags:
        - Hardsuit
        - WhitelistChameleon

- type: entity
  parent: [BaseCentcommContraband, ClothingOuterHardsuitBase]
  id: ClothingOuterHardsuitThanatos
  name: Thanatos
  description: An advanced hardsuit favored by commandos for use in special operations.
  components:
    - type: Sprite
      sprite: Clothing/OuterClothing/Hardsuits/deathsquad.rsi
    - type: Clothing
      sprite: Clothing/OuterClothing/Hardsuits/deathsquad.rsi
    - type: PressureProtection
      highPressureMultiplier: 0.02
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      heatingCoefficient: 0.001
      coolingCoefficient: 0.001
    - type: ExplosionResistance
      damageCoefficient: 0.2
    - type: FireProtection
      reduction: 0.8
    - type: StaminaResistance # do not add these to other equipment or mobs, we don't want to microbalance these everywhere
      damageCoefficient: 0.0 # 100% stamina resistance
    - type: Pierceable
      level: Rock
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.05 # 95% resistance
          Slash: 0.05
          Piercing: 0.01 # 99% pierce resistance
          Heat: 0.05
          Radiation: 0.05
          Caustic: 0.05
      staminaModifier: 0.0
    - type: ClothingSpeedModifier
      walkModifier: 1.0
      sprintModifier: 1.0
    - type: HeldSpeedModifier
    - type: ToggleableClothing
      clothingPrototype: ClothingHeadHelmetHardsuitThanatos
    - type: Tag
      tags:
        - CorgiWearable
        - Hardsuit
