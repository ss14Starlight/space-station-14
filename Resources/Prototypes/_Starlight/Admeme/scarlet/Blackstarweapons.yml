# Prometheus Battle Rifle
- type: entity
  name: Prometheus battle rifle
  parent: [WeaponRifleLecter, BaseMajorContraband]
  id: WeaponRiflePrometheus
  suffix: Admeme
  description: "A heavily modified Lecter battle rifle issued to Blackstar Dreadwalker operatives. A 3-round burst mechanism has been machined into the action, making it lethal at any range. Feeds from .20 rifle magazines."
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Scarlet/Prometheus.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Starlight/Admeme/Scarlet/Prometheus.rsi
  - type: Gun
    fireRate: 5
    burstFireRate: 8
    shotsPerBurst: 3
    burstCooldown: 0.6
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - Burst
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ltrifle.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: SpeedModifiedOnWield
    walkModifier: 0.80

# Blackstar MG42-inspired L6 variant. Weapon handling and .30 belt boxes are inherited.
- type: entity
  name: Blackstar MG-42
  parent: WeaponLightMachineGunL6
  id: WeaponLightMachineGunBlackstarMG42
  suffix: Admeme
  description: A Blackstar belt-fed machine gun with a long ventilated barrel jacket, a folded bipod, and dark wooden furniture. Feeds from standard .30 rifle belt boxes.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/Scarlet/blackstar_mg42.rsi
  - type: Item
    sprite: _Starlight/Admeme/Scarlet/blackstar_mg42.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/Scarlet/blackstar_mg42.rsi
  - type: Contraband
    severity: Major

