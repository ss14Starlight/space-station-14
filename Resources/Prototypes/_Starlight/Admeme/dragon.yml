- type: entity
  parent: BaseMobDragon
  id: MobDragonClown
  name: clown dragon
  description: A perfect life form created by the honk mother.
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Aliens/Carps/clowndragon.rsi
    noRot: true
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: alive-unshaded
      shader: unshaded
  - type: GhostRole
    mindRoles:
    - MindRoleDragon
  - type: Butcherable
    spawned:
    - id: FoodCakeClown
      amount: 1
  - type: ActionGun
    action: ActionDragonsBreath
    gunProto: ClownsBreathGun
  - type: GuideHelp
    guides:
    - MinorAntagonists
  - type: Slippery
  - type: Damageable
    damageModifierSet: DragonResistances

- type: entity
  categories: [ HideSpawnMenu ]
  id: ClownsBreathGun
  name: clown's lung
  description: For funny breathing.
  components:
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 10
    rechargeSound:
      path: /Audio/Animals/space_dragon_roar.ogg
  - type: BasicEntityAmmoProvider
    proto: ClusterBananaPeel
    capacity: 1
    count: 1
  - type: Gun
    soundGunshot:
      path: /Audio/Animals/space_dragon_roar.ogg
    soundEmpty: null
    projectileSpeed: 5
