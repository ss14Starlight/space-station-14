- type: entity
  name: PS Z46
  parent: [BaseSecurityContraband, BaseWeaponRifle]
  id: WeaponRifleZ46
  suffix: ETO
  categories: [ DoNotMap ]
  description: A rifle designed by Private Servitude to make heavier rifles more commonly available. Chambers in .30 rifle rounds.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/weapons/g36/g36.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    sprite: _Starlight/Admeme/ETO/weapons/g36/g36hands.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/weapons/g36/g36.rsi
  - type: GunWieldBonus
    minAngle: -13
    maxAngle: -10
  - type: Gun
    minAngle: 13
    maxAngle: 17
    fireRate: 5
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/m90.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifleFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineLightRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeLightRifleFMJ
        priority: 1
        whitelist:
          tags:
          - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot ""
      gun_chamber: !type:ContainerSlot ""
      firing_pin: !type:Container
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: ContainerFill
    containers:
      firing_pin:
      - FiringPin
  - type: FiringPinHolder
    supportedPins: [ Rifle, GunUpgrade ]

- type: entity
  name: PS Z77 T1
  parent: [BaseWeaponRifle, BaseSecurityContraband]
  id: WeaponRifleZ77T1
  description: A rifle designed by Private Servitude, cheaper than the commonly used Lecter. Takes .20 rifle rounds.
  suffix: ETO
  categories: [ DoNotMap ]
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/weapons/m77b1/m77.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    shape:
    - 0,0,4,2
    sprite: _Starlight/Admeme/ETO/weapons/m77b1/m77hands.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/weapons/m77b1/m77.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/estocshot.ogg
    minAngle: 30
    maxAngle: 43
    shotsPerBurst: 3
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - Burst
    - SemiAuto
    burstFireRate: 14
  - type: GunWieldBonus
    minAngle: -28
    maxAngle: -25
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineRifleFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
          - CartridgeRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
      firing_pin: !type:Container
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

