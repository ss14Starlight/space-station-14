
# ETO
- type: entity
  parent: IDCardStandard
  id: ETOIDCard
  abstract: true
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/id.rsi
  - type: IdCard
  - type: Access
    tags:
      - ETO
      - Maintenance
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: NanoChatCard
    listNumber: false

- type: entity
  parent: ETOIDCard
  id: ETOIDCardTeamLead
  name: ETO Team Lead ID card
  components:
  - type: Sprite
    layers:
      - state: ETO_Lead
      - sprite: &starlight-icon-rsi _Starlight/Admeme/ETO/etojobicons.rsi
        offset: &icon-offset -0.09375, 0.0625
        state: ETO_Leader
  - type: IdCard
    jobTitle: job-name-eto-lead
    jobIcon: JobIconETOLead

- type: entity
  parent: ETOIDCard
  id: ETOIDCardCorpsman
  name: ETO Corpsman ID card
  components:
