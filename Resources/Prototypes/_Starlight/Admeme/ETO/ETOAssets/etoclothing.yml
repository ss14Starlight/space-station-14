  description: A Useful belt to carry all of the CT's gear, including some ammo if need be.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/clothing/etobelt.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/clothing/etobelt.rsi
