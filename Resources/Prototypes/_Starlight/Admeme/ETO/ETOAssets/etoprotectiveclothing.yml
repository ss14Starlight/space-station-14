# ETO Gear

- type: entity
  parent: [ClothingOuterArmorBase, ClothingOuterStorageBase, BaseETOContraband]
  id: ClothingOuterVestWebETOBase
  name: ETO web vest
  description: A protective vest built for ETO Members, allows you to stay light on your feet.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/clothing/armour/etovest.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/clothing/armour/etovest.rsi
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.9
      staminaModifier: 0.55
  - type: ExplosionResistance
    damageCoefficient: 0.9

- type: entity
  parent: [ClothingOuterVestWebETOBase, BaseETOContraband]
  id: ClothingOuterVestWebETOCorpsman
  name: ETO medical vest
  description: A protective vest built for ETO Corpsmen, allows you to stay light on your feet and get to those in need.
  components:
    - type: Sprite
      sprite: _Starlight/Admeme/ETO/clothing/armour/etomedicvest.rsi
    - type: Clothing
      sprite: _Starlight/Admeme/ETO/clothing/armour/etomedicvest.rsi
    - type: Pierceable
      level: Metal
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.7
          Slash: 0.7
          Piercing: 0.6
          Heat: 0.9
      staminaModifier: 0.85
    - type: ExplosionResistance
      damageCoefficient: 0.9

- type: entity
  parent: [ClothingOuterVestWebETOBase, BaseETOContraband]
  id: ClothingOuterVestWebETOLead
  name: ETO lead web vest
  description: A highly protective Web Vest designed for the Team Leader, Death to our enemy, freedom to their slaves.
  components:
    - type: Sprite
      sprite: _Starlight/Admeme/ETO/clothing/armour/etoleadvest.rsi
    - type: Clothing
      sprite: _Starlight/Admeme/ETO/clothing/armour/etoleadvest.rsi
    - type: Pierceable
      level: Metal
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.7
          Slash: 0.6
          Piercing: 0.3
          Heat: 0.9
      staminaModifier: 0.85
    - type: ExplosionResistance
      damageCoefficient: 0.9

- type: entity
  parent: [ClothingOuterVestWebETOBase, BaseETOContraband]
  id: ClothingOuterVestWebETOCombatTech
  name: ETO combat technician vest
  description: A sturdy vest ripped off of an advanced Engineers hardsuit, protects the body but weighs down the user.
  components:
    - type: Sprite
      sprite: _Starlight/Admeme/ETO/clothing/armour/etoctvest.rsi
    - type: Clothing
      sprite: _Starlight/Admeme/ETO/clothing/armour/etoctvest.rsi
    - type: Pierceable
      level: Metal
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.55
          Slash: 0.55
          Piercing: 0.5
          Heat: 0.9
          Radiation: 0.75
      staminaModifier: 0.85
    - type: ExplosionResistance
      damageCoefficient: 0.9
    - type: ClothingSpeedModifier
      sprintModifier: 0.9

- type: entity
  parent: [ClothingHeadHelmetBase, BaseETOContraband]
  id: ClothingHeadHelmetETO
  name: ETO operative helmet
  description: A helmet designed for ETO Operatives, providing good skull protection and a good way to tell who your pals are.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.90
        Piercing: 0.9
        Heat: 0.9
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/clothing/armour/etohelmet.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/clothing/armour/etohelmet.rsi

- type: entity
  parent: [ClothingHeadBase, BaseETOContraband]
  id: ClothingHeadETOEvaHelmet
  name: ETO space hazard helmet
  description: A space certified helmet designed to work with most space certified softsuits, has some added ballistic protection to keep you alive.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/clothing/armour/etoevahelmet.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/clothing/armour/etoevahelmet.rsi
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    equipDelay: 1
    unequipDelay: 1
  - type: BreathMask
  - type: Item
    size: Normal
  - type: PressureProtection
    highPressureMultiplier: 0.1
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.01
  - type: IngestionBlocker
  - type: Tag
    tags:
    - HelmetEVA
  - type: StaticPrice
    price: 1000
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.90
        Piercing: 0.85
        Heat: 0.9
        Radiation: 0.95

- type: entity
  parent: [ BaseETOContraband, ClothingOuterEVASuitBase ]
  id: ClothingOuterSoftsuitETO
  name: ETO space hazard suit
  description: A Lightweight EVA Suit padded with ballistic protection, slows you down but keeps you alive.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/clothing/armour/etoevasuit.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/clothing/armour/etoevasuit.rsi
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    equipDelay: 1
    unequipDelay: 1
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.5
        Heat: 0.6
        Cold: 0.7
    staminaModifier: 0.2
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: HeldSpeedModifier
  - type: Tag
    tags:
    - SuitEVA
