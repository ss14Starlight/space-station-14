# ETO Gear

- type: entity
  parent: [ClothingOuterArmorBase, ClothingOuterStorageBase, BaseETOContraband]
  id: ClothingOuterVestWebETOBase
  name: E.T.O Web Vest
  description: A Protective vest built for E.T.O Members, allows you to stay light on your feet.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/clothing/armour/etovest.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/clothing/armour/etovest.rsi
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6 #ballistic plates = better protection
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.9
    # Starlight-start
    staminaModifier: 0.55
    # Starlight-end
  - type: ExplosionResistance
    damageCoefficient: 0.9

- type: entity
  parent: [ClothingOuterVestWebETOBase, BaseETOContraband] #web vest so it should have some pockets for ammo
  id: ClothingOuterVestWebETOCorpsman
  name: E.T.O Medical Vest
  description: A Protective vest built for E.T.O Corpsmen, allows you to stay light on your feet and get to those in need.
  components:
    - type: Sprite
      sprite: _Starlight/Admeme/ETO/clothing/armour/etomedicvest.rsi
    - type: Clothing
      sprite: _Starlight/Admeme/ETO/clothing/armour/etomedicvest.rsi
    - type: Pierceable
      level: Metal
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.7 #slightly better overall protection but slightly worse than bulletproof armor against bullets seems sensible
          Slash: 0.7
          Piercing: 0.6
          Heat: 0.9
      staminaModifier: 0.85
    - type: ExplosionResistance
      damageCoefficient: 0.9

- type: entity
  parent: [ClothingOuterVestWebETOBase, BaseETOContraband] #web vest so it should have some pockets for ammo
  id: ClothingOuterVestWebETOLead
  name: E.T.O Lead Web Vest
  description: A highly protective Web Vest designed for the Team Leader, Death to our enemy, freedom to their slaves.
  components:
    - type: Sprite
      sprite: _Starlight/Admeme/ETO/clothing/armour/etoleadvest.rsi
    - type: Clothing
      sprite: _Starlight/Admeme/ETO/clothing/armour/etoleadvest.rsi
    - type: Pierceable
      level: Metal
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.7 #slightly better overall protection but slightly worse than bulletproof armor against bullets seems sensible
          Slash: 0.6
          Piercing: 0.3
          Heat: 0.9
      staminaModifier: 0.85
    - type: ExplosionResistance
      damageCoefficient: 0.9

- type: entity
  parent: [ClothingOuterVestWebETOBase, BaseETOContraband] #web vest so it should have some pockets for ammo
  id: ClothingOuterVestWebETOCombatTech
  name: E.T.O Combat Technician Vest
  description: A sturdy vest ripped off of an advanced Engineers hardsuit, protects the body but weighs down the user.
  components:
    - type: Sprite
      sprite: _Starlight/Admeme/ETO/clothing/armour/etoctvest.rsi
    - type: Clothing
      sprite: _Starlight/Admeme/ETO/clothing/armour/etoctvest.rsi
    - type: Pierceable
      level: Metal
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.55 #slightly better overall protection but slightly worse than bulletproof armor against bullets seems sensible
          Slash: 0.55
          Piercing: 0.5
          Heat: 0.9
          Radiation: 0.75
      staminaModifier: 0.85
    - type: ExplosionResistance
      damageCoefficient: 0.9
    - type: ClothingSpeedModifier
      sprintModifier: 0.9

- type: entity
  parent: [ClothingHeadHelmetBase, BaseETOContraband]
  id: ClothingHeadHelmetETO
  name: E.T.O Operative Helmet
  description: A helmet designed for E.T.O Operatives, providing good skull protection and a good way to tell who your pals are.
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.90
        Piercing: 0.9
        Heat: 0.9
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/clothing/armour/etohelmet.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/clothing/armour/etohelmet.rsi

- type: entity
  parent: [ClothingHeadBase, BaseETOContraband]
  id: ClothingHeadETOEvaHelmet
  name: E.T.O Space Hazard Helmet
  description: A Space certified helmet designed to work with most space certified softsuits, has some added ballistic protection to keep you alive.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/clothing/armour/etoevahelmet.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/clothing/armour/etoevahelmet.rsi
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    equipDelay: 1
    unequipDelay: 1
  - type: BreathMask
  - type: Item
    size: Normal
  - type: PressureProtection
    highPressureMultiplier: 0.1
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.01
    coolingCoefficient: 0.01
  - type: IngestionBlocker
  - type: Tag
    tags:
    - WhitelistChameleon
    - HelmetEVA
  - type: StaticPrice
    price: 1000
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.90
        Piercing: 0.85
        Heat: 0.9
        Radiation: 0.95

- type: entity
  parent: [ BaseETOContraband, ClothingOuterEVASuitBase ]
  id: ClothingOuterSoftsuitETO
  name: E.T.O Space Hazard suit
  description: A Lightweight EVA Suit padded with ballistic protection, slows you down but keeps you alive.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/clothing/armour/etoevasuit.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/clothing/armour/etoevasuit.rsi
    equipSound: /Audio/Mecha/mechmove03.ogg #starlight
    unequipSound: /Audio/Mecha/mechmove03.ogg #starlight
    equipDelay: 1 #starlight
    unequipDelay: 1 #starlight
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.5
        Heat: 0.6
        Cold: 0.7
        Shock: 0.9
        Radiation: 0.7
        Caustic: 0.5
    staminaModifier: 0.2
  - type: HardsuitChemicalImmunity
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HeldSpeedModifier
  - type: Tag
    tags:
    - SuitEVA
