  id: ETOCorpsmanPDA
  name: ETO corpsman PDA
  description: Nobody dies on your watch, atleast not your team.
  components:
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-ETOCorpsman
  - type: Pda
    id: ETOIDCardCorpsman
  - type: PdaBorderColor
    accentVColor: "#b19f21"
    borderColor: "#3b2905"
