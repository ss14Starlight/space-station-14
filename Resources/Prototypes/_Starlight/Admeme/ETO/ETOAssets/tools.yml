- type: entity
  name: E.T.O Jaws of Freedom
  parent: [BaseItem, BaseETOContraband]
  id: JawsOfLifeETO
  description: A modified jaws of life, designed for use by Combat Technicians. Works just like a normal Jaws, but it has our colours on it, so it's cooler!
  components:
  - type: Tag
    tags:
    - JawsOfLife
  - type: Sprite
    sprite: Objects/Tools/jaws_of_life.rsi
    state: jaws_pry
  - type: Item
    size: Normal
  - type: Clothing
    sprite: Objects/Tools/jaws_of_life.rsi
    quickEquip: false
    slots:
      - Belt
  - type: ToolTileCompatible
    delay: 0.5
  - type: Tool
    qualities:
      - Prying
    useSound: /Audio/Items/jaws_pry.ogg
  - type: Prying
    speedModifier: 1.5
    useSound: /Audio/Items/jaws_pry.ogg
    pryPowered: true #SL
    useSoundOnDoafter: /Audio/_Starlight/Machines/airlock_pry.ogg #SL
    playSoundOnDoafter: true #SL
  - type: MultipleTool
    statusShowBehavior: true
    entries:
      - behavior: Prying
        sprite:
          sprite: Objects/Tools/jaws_of_life.rsi
          state: jaws_pry
        useSound: /Audio/Items/jaws_pry.ogg
        changeSound: /Audio/Items/change_jaws.ogg
      - behavior: Cutting
        sprite:
          sprite: Objects/Tools/jaws_of_life.rsi
          state: jaws_cutter
        useSound: /Audio/Items/jaws_cut.ogg
        changeSound: /Audio/Items/change_jaws.ogg
  - type: MeleeWeapon
    wideAnimationRotation: 90
    damage:
      types:
        Blunt: 10
    soundHit:
      collection: MetalThud
  # 🌟Starlight-start🌟
  - type: SurgeryTool
  - type: BoneSaw
    successRate: 0.8
    speed: 0.8
    startSound:
      path: /Audio/Items/jaws_cut.ogg
    endSound:
      path: /Audio/Items/change_jaws.ogg
  - type: WirecutterSurgery
    speed: 0.6
    startSound:
      path: /Audio/Items/jaws_cut.ogg
    endSound:
      path: /Audio/Items/change_jaws.ogg
  - type: CrowbarSurgery
    speed: 0.6
    startSound:
      path: /Audio/Items/jaws_cut.ogg
    endSound:
      path: /Audio/Items/change_jaws.ogg
  # 🌟Starlight-end🌟
