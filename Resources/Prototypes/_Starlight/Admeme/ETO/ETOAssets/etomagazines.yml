- type: entity
  id: MagazinePistolSubMachineGunBottomMountedDDBase
  name: DD-22 magazine (.35 auto bottom-mounted)
  parent: [ BaseItem, BaseSecurityContraband ]
  description: A unique 64-round magazine that loads into the DD22, holds .35 auto.
  components:
  - type: Tag
    tags:
      - MagazinePistolSubMachineGunBottomMountedDD
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: null
    whitelist:
      tags:
      - CartridgePistol
    capacity: 64
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/weapons/ammo/bizonmag.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: false
  - type: Appearance
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container

- type: entity
  id: MagazinePistolSubMachineGunBottomMountedDDSP
  name: PS DD-22 magazine (.35 SP bottom-mounted)
  parent: [ MagazinePistolSubMachineGunBottomMountedDDBase, BaseSecurityContraband ]
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: CartridgePistolSP
    whitelist:
      tags:
      - CartridgePistol
  - type: Sprite
    layers:
      - state: sp
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]

