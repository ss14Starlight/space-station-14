- type: entity
  parent: [ClothingEyesBase, BaseETOContraband]
  id: ClothingEyesSunGlassesETO
  name: ETO operative glasses
  description: Sunglasses modified with the ability to see who's who.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/etoglasses.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/etoglasses.rsi
  - type: FlashImmunity
  - type: ShowJobIcons
  - type: EyeProtection
    protectionTime: 5

- type: entity
  parent: [ClothingHeadset, BaseETOContraband]
  id: ClothingHeadsetETO
  name: ETO operative headset
  description: A headset supplied to ETO Operatives to maintain communication through battle.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyETO
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/etoheadset.rsi
    state: icon
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/etoheadset.rsi
    equippedState: equipped-EARS

- type: entity
  parent: [ClothingHeadset, BaseETOContraband]
  id: ClothingHeadsetETOSpecialist
  name: ETO specialist headset
  description: A headset supplied to ETO Specialists to do what they do best.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyETO
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/etoheadset.rsi
    state: icon_alt
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/etoheadset.rsi
    equippedState: alt-equipped-EARS

- type: entity
  parent: [ ClothingMaskGas, BaseETOContraband ]
  id: ClothingMaskGasETOLead
  name: ETO leader gas mask
  description: A mask best fit for a leading terrorist. Protects the wearer from pot shots, but won't keep you alive alone. Modified with an Administration and Health HUD to show you health and the allegiance of those around you.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/clothing/etomask.rsi
  - type: Clothing
    sprite: _Starlight/Admeme/ETO/clothing/etomask.rsi
  - type: ShowJobIcons
  - type: ShowHealthBars
    damageContainers:
      - Biological
      - IPC
      - Hybrid
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    hideOnToggle: true
  - type: FlashImmunity
    blocksSpecialVision: false
  - type: EyeProtection
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.95
        Heat: 0.95

