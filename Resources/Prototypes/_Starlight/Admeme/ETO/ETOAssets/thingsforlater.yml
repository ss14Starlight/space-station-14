
- type: entity
  name: PS RPD
  id: WeaponLightMachineGunRPD
  parent: [BaseWeaponLightMachineGun, BaseSecurityContraband]
  description: A relic of the past, a weapon previously designed by the Soviet union during the glory days of the Old World, feeds from both .20 and .30 rifle drum magazines.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/LMGs/l6.rsi # Starlight-edit
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-3
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 10000
  # Starlight-start
  - type: Item
    sprite: _Starlight/Objects/Weapons/Guns/LMGs/l6.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/LMGs/l6.rsi
    quickEquip: false
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/m41_cock.ogg
    soundBoltClosed:
      path: /Audio/Weapons/Guns/Bolt/lmg_bolt_closed.ogg
    soundBoltOpened:
      path: /Audio/Weapons/Guns/Cock/shotgun_open.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifleHeavyDrumFMJ
        insertSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        ejectSound: /Audio/Weapons/Guns/MagIn/rifle_load.ogg
        whitelist:
          tags:
            - MagazineLightRifleHeavyDrum
            - MagazineLightRifleDrum
      gun_chamber:
        name: Chamber
        startingItem: CartridgeLightRifleSP
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
  - type: HeldSpeedModifier
  - type: GunWieldBonus
    minAngle: -11
    maxAngle: -8
  - type: Gun
    minAngle: 21
    maxAngle: 32
    fireRate: 6.5
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/l6.ogg
      params:
        volume: -5

- type: entity
  name: Triple Action Thunder
  parent: [BaseWeaponSniper, BaseETOContraband]
  id: WeaponPistolTripleThunder
  description: A Heavily modified Jungle Hawk that feeds from an internal magazine, holds .60 Antimaterial rounds and rips apart anything that stands in your way.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Weapons/Guns/Pistols/deagle.rsi
      layers:
        - state: base
          map: ["enum.GunVisualLayers.Base"]
    - type: Clothing
      sprite: _Starlight/Objects/Weapons/Guns/Pistols/deagle.rsi
    - type: Gun
      fireRate: 3
      availableModes:
        - SemiAuto
      soundGunshot:
        path: /Audio/_Starlight/Weapons/Guns/Gunshots/deagle.ogg
      minAngle: 0
      maxAngle: 10
      angleIncrease: 2
      angleDecay: 4
    - type: BallisticAmmoProvider
      capacity: 1
      proto: CartridgeAntiMateriel
      whitelist:
        tags:
          - CartridgeAntiMateriel
    - type: Item
      size: Small #Magazine location makes it bigger but should still fit in a pocket. (This basically serves to keep people from putting it in a boot/stacking them as easily)
      shape:
        - 0,0,1,0
        - 0,1,1,1

- type: entity
  name: PS G36 "Freedom Fighter"
  parent: [BaseETOContraband, BaseWeaponRifle]
  id: WeaponRifleG36ETO
  description: An old world rifle designed for the old wars, chambers in .30 rifle rounds and hits like a car. This one has been adorned in E.T.O colours, becoming a symbol of freedom. Death to our enemy, freedom to their slaves.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Rifles/arg.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Item
    sprite: _Starlight/Objects/Weapons/Guns/Rifles/arg.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Rifles/arg.rsi
  - type: GunWieldBonus
    minAngle: -13
    maxAngle: -10
  - type: Gun
    minAngle: 13
    maxAngle: 17
    fireRate: 5
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/m90.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifleFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineLightRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeLightRifleFMJ
        priority: 1
        whitelist:
          tags:
          - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot ""
      gun_chamber: !type:ContainerSlot ""
      firing_pin: !type:Container
  - type: Appearance
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true

