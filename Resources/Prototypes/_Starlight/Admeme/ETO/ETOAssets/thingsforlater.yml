- type: entity
  parent: [BaseHypospray, BaseETOContraband]
  id: HyposprayETO
  name: E.T.O Modified Hypospray
  description: A jury-rigged Hypospray modified to work with even the most minimal of medical training.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    layers:
    - state: hypo
      map: ["enum.SolutionContainerLayers.Base"]
    - state: hypo_fill1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/hypospray.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 30
  - type: RefillableSolution
    solution: hypospray
  - type: UseDelay
    delay: 0.5
  - type: StaticPrice
    price: 750
  - type: Tag
    tags:
    - HighRiskItem
  - type: StealTarget
    stealGroup: Hypospray
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: hypo_fill
    solutionName: hypospray

- type: entity
  parent: [ AdvancedJetInjector, BaseETOContraband ]
  id: AdmemeCombatStimInjector
  name: Perfect Combat Stimulant Injector
  description: A Combat Stim that allows you to hit hard, and die slow.
  components:
  - type: Sprite
    sprite: _Starlight/Admeme/ETO/crackheadjetinjector.rsi
    layers:
    - state: jetinjector_base
      map: [ "enum.SolutionContainerLayers.Base" ]
    - state: jetinjector_filled1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Item
    sprite: _Starlight/Admeme/ETO/crackheadjetinjector.rsi
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 30
        reagents:
        - ReagentId: Omnizine
          Quantity: 10
        - ReagentId: Ichor
          Quantity: 10
        - ReagentId: Stimulants
          Quantity: 10
  - type: SolutionContainerVisuals
    maxFillLevels: 3
  - type: SolutionRegeneration
    solution: hypospray
    generated:
      reagents:
      - ReagentId: Stimulants
        Quantity: 2
      - ReagentId: Omnizine
        Quantity: 2
      - ReagentId: Ichor
        Quantity: 2


