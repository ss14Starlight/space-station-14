- type: species
  id: Neocyte
  name: species-name-neocyte
  roundStart: true
  prototype: MobNeocyte
  sprites: MobNeocyteSprites
  defaultSkinTone: "#ffda93"
  markingLimits: MobNeocyteMarkingLimits
  dollPrototype: AppearanceNeocyte
  skinColoration: Hues
  customName: true
  roundstartCyberwareCapacity: 6
  hasSubspecies: true # This is the "parent" species that will be displayed in species list as well as subspecies list
  subspeciesName: subspecies-name-trueneocyte # This name is dispayed when you're picking subspecies
  loadout: NeocyteLoadout

- type: speciesBaseSprites
  id: MobNeocyteSprites
  sprites:
    Hair: MobHumanoidAnyMarking
    Head: MobNeocyteHead
    Eyes: MobNeocyteEyes
    Snout: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobNeocyteTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    LArm: MobNeocyteLArm
    RArm: MobNeocyteRArm
    LHand: MobNeocyteLHand
    RHand: MobNeocyteRHand
    LLeg: MobNeocyteLLeg
    RLeg: MobNeocyteRLeg
    LFoot: MobNeocyteLFoot
    RFoot: MobNeocyteRFoot
    FaceCover: MobHumanoidAnyMarking
    FaceCoverCover: MobHumanoidAnyMarking
    BodyCover: MobHumanoidAnyMarking
    BodyCoverCover: MobHumanoidAnyMarking

- type: markingPoints
  id: MobNeocyteMarkingLimits
  points:
    FaceCover:
      points: 1
      required: true
      defaultMarkings: [ NeocyteVisor ]
    FaceCoverCover:
      points: 1
      required: true
      defaultMarkings: [ NeocyteLEDFace ]
    BodyCover:
      points: 1
      required: true
      defaultMarkings: [ NeocyteMediumArmor ]
    BodyCoverCover:
      points: 1
      required: true
      defaultMarkings: [ NeocyteLights ]
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 0
      required: false
    Snout:
      points: 1
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ NeocyteTail ]
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ NeocyteEars ]
    Head:
      points: 2
      required: false
    Chest:
      points: 4
      required: false
    Legs:
      points: 4
      required: false
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Arms:
      points: 4
      required: false

