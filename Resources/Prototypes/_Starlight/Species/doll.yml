- type: species
  id: Doll
  name: species-name-doll
  roundStart: true
  prototype: MobDoll
  sprites: MobDollSprites
  markingLimits: MobDollMarkingLimits
  dollPrototype: AppearanceDoll
  skinColoration: Hues
  defaultSkinTone: "#FFFFFF"
  maleFirstNames: NamesFirstDollMale
  femaleFirstNames: NamesFirstDollFemale
  lastNames: NamesLastDoll
  naming: FirstLast
  customName: true
  roundstartCyberwareCapacity: 0
  minAge: 20
  youngAge: 30
  oldAge: 50
  maxAge: 70

- type: speciesBaseSprites
  id: MobDollSprites
  sprites:
    Head: MobDollHead
    HeadTop: MobHumanoidAnyMarking
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobDollTorso
    Eyes: MobHumanoidEyes
    LArm: MobDollLArm
    RArm: MobDollRArm
    LHand: MobDollLHand
    RHand: MobDollRHand
    LLeg: MobDollLLeg
    RLeg: MobDollRLeg
    LFoot: MobDollLFoot
    RFoot: MobDollRFoot

- type: markingPoints
  id: MobDollMarkingLimits
  onlyWhitelisted: false
  points:
    Head:
      points: 1
      required: true
      defaultMarkings: [ DollShellHeadFemale ]
    Chest:
      points: 1
      required: true
      defaultMarkings: [ DollShellChestFemale ]
    Legs:
      points: 4
      required: true
      defaultMarkings: [ DollShellLLeg, DollShellLFoot, DollShellRLeg, DollShellRFoot ]
    Arms:
      points: 4
      required: true
      defaultMarkings: [ DollShellLArm, DollShellLHand, DollShellRArm, DollShellRHand ]
    Special:
      points: 0
      required: false
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Snout:
      points: 1
      required: false
    Tail:
      points: 0
      required: false
    HeadTop:
      points: 1
      required: false
    HeadSide:
      points: 1
      required: false
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false

