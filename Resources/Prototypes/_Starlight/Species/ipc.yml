# IPC (Integrated Positronic Chassis) Species
# Based on human.yml - sprites replaced with IPC parts
# SOURCE: Far-Horizons-SS14 textures
# https://github.com/Far-Horizons-SS14/Far-Horizons-SS14

- type: species
  id: IPC
  name: species-name-ipc
  roundStart: true
  prototype: MobIPC
  sprites: MobIPCSprites
  markingLimits: MobHumanMarkingLimits
  dollPrototype: MobIPCDummy
  skinColoration: TintedHues
  defaultSkinTone: "#C0C0C0"
  customName: false

- type: speciesBaseSprites
  id: MobIPCSprites
  sprites:
    Head: MobIPCHead
    HeadTop: MobHumanoidAnyMarking
    Chest: MobIPCTorso
    Eyes: MobIPCEyes
    LArm: MobIPCLArm
    RArm: MobIPCRArm
    LHand: MobIPCLHand
    RHand: MobIPCRHand
    LLeg: MobIPCLLeg
    RLeg: MobIPCRLeg
    LFoot: MobIPCLFoot
    RFoot: MobIPCRFoot

- type: humanoidBaseSprite
  id: MobIPCEyes
  baseSprite:
    sprite: Mobs/Customization/eyes.rsi
    state: no_eyes

