  defaultSkinTone: "#ffda93"
  markingLimits: MobNeoVulpkaninMarkingLimits
  dollPrototype: AppearanceNeoVulpkanin
  skinColoration: Hues
  customName: true
  roundstartCyberwareCapacity: 6
  subspeciesOf: Neocyte # This is alternative version of other species. It will only be displayed in subspecies list
  subspeciesName: subspecies-name-neovulpkanin
  loadout: NeocyteLoadout
  minHeight: 0.9
  defaultHeight: 1
  maxHeight: 1.2
  standardSize: 170
  standardWeight: 75
  standardDensity: 110
  profileMigration:
    oldSpecies:
    - ProtoVulp

- type: speciesBaseSprites
  id: MobNeoVulpkaninSprites
  sprites:
    Hair: MobHumanoidAnyMarking
    Head: MobNeoVulpkaninHead
    Eyes: MobNeocyteEyes #looks odd, but this just removes eyes since they're replaced by the LEDs.
    Snout: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobNeoVulpkaninTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    LArm: MobNeoVulpkaninLArm
    RArm: MobNeoVulpkaninRArm
    LHand: MobNeoVulpkaninLHand
    RHand: MobNeoVulpkaninRHand
    LLeg: MobVulpkaninLLeg
    RLeg: MobVulpkaninRLeg
    LFoot: MobVulpkaninLFoot
    RFoot: MobVulpkaninRFoot
    FaceCover: MobHumanoidAnyMarking
    FaceCoverCover: MobHumanoidAnyMarking
    BodyCover: MobHumanoidAnyMarking
    BodyCoverCover: MobHumanoidAnyMarking

- type: markingPoints
  id: MobNeoVulpkaninMarkingLimits
  points:
    FaceCover:
      points: 1
      required: true
      defaultMarkings: [ NeoVulpkaninVisor ]
    FaceCoverCover:
      points: 1
      required: true
      defaultMarkings: [ NeoVulpkaninLEDFace ]
    BodyCover:
      points: 1
      required: true
      defaultMarkings: [ NeoVulpkaninMediumArmor ]
    BodyCoverCover:
      points: 1
      required: true
      defaultMarkings: [ NeoVulpkaninLights ]
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 0
      required: false
    Snout:
      points: 1
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ NeocyteTail ]
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ FoxEar ]
    Head:
      points: 3
      required: false
    Legs:
      points: 6
      required: false
    Arms:
      points: 6
      required: false
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false

