- type: species
  id: Experiment
  name: species-name-experiment
  roundStart: true
  prototype: MobExperiment
  sprites: MobExperimentSprites
  markingLimits: MobExperimentMarkingLimits
  dollPrototype: AppearanceExperiment
  skinColoration: ExperimentColors
