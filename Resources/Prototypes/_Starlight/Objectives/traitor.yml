# Teach a Lesson
- type: entity
  parent: [BaseTraitorObjective, BaseTeachALessonObjective]
  id: TeachRandomPersonObjective
  description: Ensure they die at least once this shift. They know what they did.
  components:
    - type: Objective
      hidden: true
      hiddenTitle: objective-picker-hidden-lesson
      difficulty: 1.5
      unique: false
    - type: TargetObjective
      title: objective-condition-teach-lesson-title
    - type: PickRandomPerson
      pool: !type:WeightedAlivePool
        weightHighValue: true
      filters:
      # Can't have multiple objectives to teach the same person.
      - !type:TargetObjectiveMindFilter
        blacklist:
          components:
          - TeachALessonCondition

- type: entity
  parent: [BaseTraitorObjective, BaseTeachALessonObjective]
  id: TeachRandomHeadObjective
  description: Ensure this high value person dies at least once this shift. They know what they did.
  components:
    - type: Objective
      hidden: true
      hiddenTitle: objective-picker-hidden-lesson-head
      # technically it's still possible for TeachRandomPersonObjective to roll a head but this is guaranteed, so higher difficulty
      difficulty: 2 #Starlight edit
      # killing 1 head is enough
      unique: true
    - type: TargetObjective
      title: objective-condition-teach-lesson-title
    - type: PickRandomPerson
      pool: !type:HighValueTargetsPool
        includeCommand: true
      filters:
      - !type:TargetObjectiveMindFilter
        blacklist:
          components:
          - TeachALessonCondition # Don't assign multiple lessons for the same person.

