# From Moff Station, moved here since we're making so many changes to them that it's not really viable to pull from Moff anymore.
# Traitor story objectives
- type: entity
  parent: BaseDepartmentStoryObjective
  id: SabotageObjective
  name: Sabotage Department
  description: We need you to sabotage this department's activities.
  components:
  - type: DepartmentObjective
    title: objective-condition-sabotage-department

- type: entity
  parent: BaseRoomStoryObjective
  id: TrashRoomObjective
  name: Trash Room
  description: We need you to trash this room. Make sure it doesn't pass a health inspection.
  components:
  - type: LocationObjective
    title: objective-condition-trash-room

- type: entity
  parent: BaseRoomStoryObjective
  id: ClaimLocationObjective
  name: Claim Location
  description: Establish this room as a base for the Syndicate.
  components:
  - type: LocationObjective
    title: objective-condition-claim-room

- type: entity
  parent: BaseStoryObjective
  id: GatherIntelObjective
  name: Gather Intel
  description: Gather intelligence on this person. Collect any information you can find about them.
  components:
  - type: TargetObjective
    title: objective-condition-gather-intel
  - type: PickRandomPerson

- type: entity
  parent: BaseStoryObjective
  id: JailbreakObjective
  name: Jailbreak prisoners
  description: It doesn't matter who was locked up or why, we just need you to keep the jails empty.

- type: entity
  parent: BaseStoryObjective
  id: LeaveCallingCardOnPersonObjective
  name: Leave a Warning
  description: This person has stepped out of line, give them a reminder.
  components:
  - type: TargetObjective
    title: objective-condition-leave-card-on-person
  - type: PickRandomPerson

# Thief story objectives
- type: entity
  parent: [BaseThiefObjective, BaseDepartmentStoryObjective]
  id: RobDepartmentObjective
  description: This department has some nice goodies, its time to make them your own.
  components:
  - type: DepartmentObjective
    title: objective-condition-rob-department
