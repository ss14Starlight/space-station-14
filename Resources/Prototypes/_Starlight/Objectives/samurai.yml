# Samurai
- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseSamuraiObjective
  components:
    - type: Objective
      # required but not used
      difficulty: 1
      issuer: objective-issuer-self
    - type: RoleRequirement
      roles:
        - SamuraiRole

- type: entity
  parent: [BaseSamuraiObjective, BaseFreeObjective]
  id: HonorObjective
  name: Retain your Honor
  description: Do not break your code of Honor.
  components:
    - type: Objective
      difficulty: 1
      unique: false
      icon:
        sprite: _Starlight/Interface/Misc/rp_icon.rsi
        state: icon

- type: entity
  parent: [BaseSamuraiObjective, BaseFreeObjective]
  id: WisdomObjective
  name: Spread your wisdom across the station
  description: Bring honor and wisdom to the station.
  components:
    - type: Objective
      difficulty: 1
      unique: false
      icon:
        sprite: _Starlight/Interface/Misc/rp_icon.rsi
        state: icon

- type: entity
  parent: [BaseSamuraiObjective, BaseFreeObjective]
  id: PunishObjective
  name: Punish the dishonorable
  description: Do not allow dishonorable behaviour to go unpunished.
  components:
    - type: Objective
      difficulty: 1
      unique: false
      icon:
        sprite: _Starlight/Interface/Misc/rp_icon.rsi
        state: icon

- type: entity
  parent: [BaseSamuraiObjective, BaseSurviveObjective]
  id: SamuraiSurviveObjective
  name: Survive
  description: The Daimyo does not wish for you to throw your life away. As long as you have your honor, you must survive.
  components:
    - type: Objective
      difficulty: 1
      unique: false
      icon:
        sprite: Objects/Magic/magicactions.rsi
        state: fireball
