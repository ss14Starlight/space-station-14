    ClaimLocationObjective: 1
    GatherIntelObjective: 1
    JailbreakObjective: 1
    LeaveCallingCardOnPersonObjective: 1

# Vampire
- type: weightedRandom
  id: VampireObjectiveGroups
  weights:
    VampireObjectiveGroupSteal: 1
    VampireObjectiveGroupKill: 1
    VampireObjectiveGroupDrain: 1
    VampireObjectiveGroupState: 1

- type: weightedRandom
  id: VampireObjectiveGroupsStealOnly
  weights:
    VampireObjectiveGroupSteal: 1

- type: weightedRandom
  id: VampireObjectiveGroupsStateOnly
  weights:
    VampireObjectiveGroupState: 1

- type: weightedRandom
  id: VampireObjectiveGroupSteal
  weights:
    CMOHyposprayVampireStealObjective: 1
    RDHardsuitVampireStealObjective: 1
    SecurityRareGunsVampireStealObjective: 1
    MagbootsVampireStealObjective: 1
    ClipboardVampireStealObjective: 1
    CaptainIDVampireStealObjective: 1
    CaptainJetpackVampireStealObjective: 1
    CaptainGunVampireStealObjective: 1
    # Temp targets beyond this point, until proper vamp ones are made, so vamps don't roll the same 8 targets every shift. Tried to only pick things of value, so just command/nt + wardgun.
    HOSWeaponVampireStealObjective: 1 #Starlight
    VampireCMOHardsuitStealObjective: 1 # I'm so sorry CMO
    VampireCEHardsuitStealObjective: 1 # Where are you going to hide it?
    VampireHOSHardsuitStealObjective: 1 # Quite defensive.
    VampireQMHardsuitStealObjective: 1 # Would you believe it was never an objective before?
    VampireCaptainHardsuitStealObjective: 0.75 # Good luck.
    VampireNTRepHardsuitStealObjective: 0.75 # Usually in the bridge... hard to get to.
    VampireBSOHardsuitStealObjective: 0.75 # Same as the above...
    VampireBSOWeaponStealObjective: 1

- type: weightedRandom
  id: VampireObjectiveGroupKill
  weights:
    VampirePickerKillObjective: 1
    VampireKillRandomHeadObjective: 0.25

- type: weightedRandom
  id: VampireObjectiveGroupDrain
  weights:
    VampireDrainObjective: 1

- type: weightedRandom
  id: VampireObjectiveGroupState
  weights:
    ReputationObjective: 0.5
    FalseOutbreakObjective: 0.75

# Random picker excludes the already forced drain goal and can offer an additional kill.
- type: weightedRandom
  id: VampireObjectiveGroupsSelector
  weights:
    VampireObjectiveGroupSteal: 1
    VampireObjectiveGroupState: 1
    VampireObjectiveGroupKill: 0.35

- type: weightedRandom
  id: VampireObjectiveGroupFate
  weights:
    VampireSurviveObjective: 1
    VampireEscapeObjective: 1

# Thieves
- type: weightedRandom
  id: ThiefObjectiveOpenEnded
  weights:
    RobDepartmentObjective: 1

- type: weightedRandom
  id: ThiefObjectiveGroupOuter # We use this to roll for thief objectives, similar to how traitors do it. Technically, we lose some control over it doing it this way (maxPicks), but I think the long term benefits of being able to add more variants to objectives without having to make 2 whole layers of objectives is worth the tradeoff.
  weights:
    ThiefObjectiveGroupCollection: 1
    ThiefObjectiveGroupItem: 1
    ThiefObjectiveGroupStructure: 0.7 # Inheriting from the old "big" group.
    ThiefObjectiveGroupAnimal: 0.7 # Inheriting from the old "big" group.

- type: weightedRandom
  id: ThiefObjectiveGroupFate
  weights:
    EscapeThiefShuttleObjective: 1
    EscapeMasterThiefObjective: 0.33

