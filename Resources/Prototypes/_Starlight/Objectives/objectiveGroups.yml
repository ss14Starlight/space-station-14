# Thieves
- type: weightedRandom
  id: ThiefObjectiveGroupOuter # We use this to roll for thief objectives, similar to how traitors do it. Technically, we lose some control over it doing it this way (maxPicks), but I think the long term benefits of being able to add more variants to objectives without having to make 2 whole layers of objectives is worth the tradeoff.
  weights:
    ThiefObjectiveGroupCollection: 75
    ThiefObjectiveGroupItem: 75
    ThiefObjectiveGroupStructure: 52 # Inheriting from the old "big" group.
    ThiefObjectiveGroupAnimal: 52 # Inheriting from the old "big" group.
    ThiefObjectiveGroupEscapeForced: 746 # High weight to basically force you to get it.

- type: weightedRandom
  id: ThiefObjectiveGroupEscapeForced
  weights:
    EscapeThiefShuttleObjective: 75
    EscapeMasterThiefObjective: 25
