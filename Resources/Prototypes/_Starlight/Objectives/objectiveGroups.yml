    ManifestoObjective: 1
    CallingCardObjective: 1
    SELFObjective: 1
    StalkingObjective: 1
    DisgraceObjective: 1
    HarassObjective: 1
    ImpersonateObjective: 1
    FeudObjective: 1
    WasteObjective: 1
    MaintsBarObjective: 1
    PanicObjective: 1
