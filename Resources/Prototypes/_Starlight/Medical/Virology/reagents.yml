# Antipathogen serum.
#
# Deliberately has no metabolism block. The cure is not applied by drinking or injecting it
# into the bloodstream - the treatment system consumes a fixed 5u straight from the vial when
# administered. Metabolism processes continuously in tiny amounts, which would have meant
# partial cures bleeding in over several ticks instead of a clean result.
#
# The serum is also inert on its own: which strain it treats lives on the vial, not in the
# liquid. Pouring it into an unlabelled container wastes it, which is the intended
# behaviour rather than an oversight.

- type: reagent
  id: Antipathogen
  name: reagent-name-antipathogen
  group: Medicine
  desc: reagent-desc-antipathogen
  physicalDesc: reagent-physical-desc-cloudy
  flavor: bitter
  color: "#9ad9c4"
