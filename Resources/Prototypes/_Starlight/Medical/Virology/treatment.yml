# One reusable injector carries every virology payload. The vaccinator assigns a runtime
# strain, purpose, and integer dose count; chemistry volume and metabolism are not involved.
- type: entity
  parent: BaseItem
  id: PathogenInjector
  name: empty pathogen injector
  description: A reusable injector awaiting configuration by a vaccinator.
  components:
  - type: Item
    size: Tiny
    sprite: Objects/Specific/Medical/medipen.rsi
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    state: stimpen
  - type: PathogenInjector
  - type: Tag
    tags:
    - Recyclable
