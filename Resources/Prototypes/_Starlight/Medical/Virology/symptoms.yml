    effectProto: StatusEffectStutter
    time: 5
    type: Update
  - !type:PopupMessage
    type: Local
    messages:
    - pathogen-symptom-hoarseness-popup

- type: pathogenSymptom
  id: BlurredVision
  name: pathogen-symptom-blurred-vision
  minStage: 3
  interval: 120
  effects:
  - !type:GenericStatusEffect
    key: TemporaryBlindness
    component: TemporaryBlindness
    time: 1
    type: Update
  - !type:PopupMessage
    type: Local
    messages:
    - pathogen-symptom-blurred-vision-popup

- type: pathogenSymptom
  id: Clumsiness
  name: pathogen-symptom-clumsiness
  minStage: 2
  interval: 115
  effects:
  - !type:ModifyStatusEffect
    effectProto: StatusEffectFriction
    time: 2
    type: Update
  - !type:PopupMessage
    type: Local
    messages:
    - pathogen-symptom-clumsiness-popup

- type: pathogenSymptom
  id: Vomiting
  name: pathogen-symptom-vomiting
  minStage: 3
  interval: 130
  effects:
  - !type:Vomit
    probability: 0.35
  - !type:PopupMessage
    type: Local
    messages:
    - pathogen-symptom-vomiting-popup

- type: pathogenSymptom
  id: Nosebleed
  name: pathogen-symptom-nosebleed
  minStage: 3
  interval: 135
  effects:
  - !type:ModifyBloodLevel
    amount: -1
  - !type:PopupMessage
    type: Local
    messages:
    - pathogen-symptom-nosebleed-popup

- type: pathogenSymptom
  id: Drowsiness
  name: pathogen-symptom-drowsiness
  minStage: 2
  interval: 120
  effects:
  - !type:ModifyStatusEffect
    effectProto: StatusEffectDrowsiness
    time: 4
    type: Update
  - !type:PopupMessage
    type: Local
    messages:
    - pathogen-symptom-drowsiness-popup

# --- Beneficial ---
# Kept alongside the ambient set so the difference in scale stays obvious at a glance.

- type: pathogenSymptom
  id: MinorRegeneration
  name: pathogen-symptom-minor-regeneration
  minStage: 1
  interval: 20
  effects:
  - !type:HealthChange
    damage:
      groups:
        Brute: -1
