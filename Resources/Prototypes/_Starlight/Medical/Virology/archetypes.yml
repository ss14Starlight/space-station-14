# --- Engineered ---
# Reference implementation of a targeted beneficial strain. seedWeight 0 keeps it out of
# ambient seeding, transmissibility 0 means it cannot spread on its own and has to be
# administered deliberately, and immunityOnRecovery is off so the crew can be re-dosed.
# Every range is fixed, because a product should come out the same every time.

- type: pathogenArchetype
  id: Vigor
  name: pathogen-name-vigor
  description: pathogen-desc-vigor
  pathogenType: Virus
  beneficial: true
  seedWeight: 0
  respawnOnExtinction: false
  immunityOnRecovery: false
  maxPrevalence: 1.0
  coreSymptoms:
  - MinorRegeneration
  minExtraSymptoms: 0
  maxExtraSymptoms: 0
  minTransmissibility: 0
  maxTransmissibility: 0
  minSpreadRange: 0
  maxSpreadRange: 0
  minIncubation: 20
  maxIncubation: 20
  minStages: 1
  maxStages: 1
  minStageDelay: 60
  maxStageDelay: 60
  minDuration: 300
  maxDuration: 300
