# Archetypes, not strains. Each of these is a template used to roll a concrete strain at
# a contamination milestone; the character stays fixed, the specifics do not.
#
# The point is that a strain has to be unknown until someone diagnoses it. A fixed strain
# gets memorised in three or four shifts, after which nobody runs the diagnoser and
# cataloguing rewards knowledge the player already had.
#
# Balance intent for the ambient set: irritating, visible, self-clearing. If any of these
# ever ruin someone's shift, the numbers to change are the duration and prevalence ranges,
# not the symptom pool. Nothing ambient may bypass protective equipment.

- type: pathogenArchetype
  id: SpaceCold
  name: pathogen-name-space-cold
  description: pathogen-desc-space-cold
  pathogenType: Virus
  seedWeight: 1.5
  respawnOnExtinction: true
  tier: Ambient
  maxPrevalence: 0.10
  stageOneSymptomPool:
  - Sneezing
  - ViralSniffling
  - ViralWateryEyes
  coreSymptoms:
  - AmbientViralShivering
  symptomPool:
  - AmbientViralFatigue
  - AmbientViralBlockedNose
  - AmbientViralMildHeadache
  - AmbientViralColdSensation
  - AmbientViralDryCough
  - AmbientViralSinusPressure
  minExtraSymptoms: 2
  maxExtraSymptoms: 2
  minTransmissibility: 0.04
  maxTransmissibility: 0.06
  minSpreadRange: 1.5
  maxSpreadRange: 2.0
  minIncubation: 60
  maxIncubation: 150
  minStages: 3
  maxStages: 3
  minStageDelay: 90
  maxStageDelay: 180
  minDuration: 480
  maxDuration: 900

