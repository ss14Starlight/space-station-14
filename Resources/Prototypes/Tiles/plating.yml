- type: tile
  id: BasePlating
  abstract: true
  friction: 1.5
  heatCapacity: 10000
  isSubfloor: true
  deconstructTools: [ Tearing ] # Starlight
  footstepSounds:
    collection: FootstepPlating
  baseTurf: Lattice
  baseWhitelist:
    - TrainLattice

- type: tile
  id: Plating
  parent: BasePlating
  name: tiles-plating
  sprite: /Textures/Tiles/plating.png

- type: tile
  id: PlatingRCD
  parent: Plating
  name: tiles-rcd-plating
  baseWhitelist:
    - TrainLattice
    - FloorPlanetDirt
    - FloorDesert
    - FloorLowDesert
    - FloorPlanetGrass
    - FloorSnow
    - FloorDirt
    - FloorAsteroidIronsand
    - FloorAsteroidSand
    - FloorAsteroidSandBorderless
    - FloorAsteroidIronsandBorderless
    - FloorAsteroidSandRedBorderless

- type: tile
  id: FloorHullReinforced
  parent: BasePlating
  name: tiles-hull-reinforced
  sprite: /Textures/Tiles/hull_reinforced.png
  footstepSounds:
    collection: FootstepHull
  itemDrop: FloorTileItemSteel
  heatCapacity: 100000 #/tg/ has this set as "INFINITY." I don't know if that exists here so I've just added an extra 0
  indestructible: true

- type: tile
  id: PlatingDamaged
  parent: BasePlating
  name: tiles-plating
  sprite: /Textures/Tiles/plating_damaged.png
  variants: 3
  placementVariants:
  - 1.0
  - 1.0
  - 1.0
  baseTurf: Plating # Starlight-edit - swap baseTurf to Plating, so when we weld it, we revert to that.
  deconstructTools: [ Welding, Tearing ] # Starlight - add welding as a deconstruct interaction, so we have an easy way to mend it.
  itemDrop: NothingEntity # Starlight - remove drop
  isSubfloor: true
  footstepSounds:
    collection: FootstepPlating
  friction: 1.5
  heatCapacity: 10000

- type: tile
  id: PlatingAsteroid
  parent: BasePlating
