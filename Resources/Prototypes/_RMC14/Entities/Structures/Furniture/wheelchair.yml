- type: entity
  abstract: true
  id: RMCWheelchairBase
  components:
  - type: RMCAllowStrapMovement
  - type: Sprite
    drawdepth: Objects
    noRot: true
    sprite: _RMC14/Structures/Furniture/wheelchair.rsi
    layers:
    - state: wheelchair
  - type: MobMover
  - type: Puller
    needsHands: false
  - type: Pullable
  - type: InputMover
  - type: InteractionOutline
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.0
    baseSprintSpeed: 3.5
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: Physics
    bodyType: KinematicController
  - type: Clickable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Appearance
  - type: ContainerContainer
    containers:
      rmc-vehicle-pilot: !type:ContainerSlot
  - type: Damageable
    damageContainer: Inorganic
  - type: Strap
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: RMCWheelchairBase
  id: RMCWheelchair
  name: wheelchair
  description: Helps those with injuries related to immobility to move freely
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/wheelchair.rsi
    layers:
    - state: wheelchair
  - type: Item
    size: Normal
  - type: Appearance
  - type: Wheelchair
    speedMultiplier: 1
  - type: RMCAllowStrapMovement
  - type: ChildEntities
    childPrototypes:
      - prototype: WheelchairOverlay

- type: entity
  parent: RMCWheelchairBase
  id: RMCWheelchairBell
  name: wheelchair with bell
  description: Helps those with injuries related to immobility to move freely. Has a bell attached.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/wheelchair.rsi
    layers:
    - state: wheelchair
  - type: Appearance
  - type: Item
    size: Normal
  - type: Wheelchair
    speedMultiplier: 1
    bellAction: ActionWheelchairBell
  - type: ContainerContainer
    containers:
      rmc-vehicle-pilot: !type:ContainerSlot
      actions: !type:Container
  - type: ActionsContainer
  - type: RMCAllowStrapMovement
  - type: ChildEntities
    childPrototypes:
      - prototype: WheelchairOverlay

- type: entity
  id: WheelchairOverlay
  name: wheelchair
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Structures/Furniture/wheelchair.rsi
    layers:
    - state: overlay
    noRot: false
  - type: Tag
    tags:
      - HideContextMenu

