- type: marking
  id: VulpTailVulp
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [ Vulpkanin, NeoVulpkanin , Neocyte] # Starlight
  # Starlight start
  sprites:
    body_tail@0:
        sprite:
          sprite: Mobs/Customization/Vulpkanin/tail_markings.rsi
          state: vulp
        colorSource: HumanSkinColor
    body_tail@1:
        sprite:
          sprite: Mobs/Customization/Vulpkanin/tail_markings.rsi
          state: vulp-tip
        colorSource: HumanSkinColor
  # Starlight end

