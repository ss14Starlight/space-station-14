- type: marking
  id: HumanLongEars
  bodyPart: HeadTop
  markingCategory: HeadTop
  forcedColoring: true
  # followSkinColor: true
  speciesRestriction: [Dwarf] # Starlight: remove elf ears from humans (and give them to elves)
  # Starlight start
  sprites:
    body_headTop:
      sprite:
        sprite: Mobs/Customization/ears.rsi
        state: long_ears_standard
      colorSource: HumanSkinColor
  # Starlight end

