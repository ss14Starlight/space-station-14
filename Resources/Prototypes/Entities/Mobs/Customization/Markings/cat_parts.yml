- type: marking
  id: CatEars
  bodyPart: Special
  markingCategory: Special
  speciesRestriction: [Human]
  coloring:
    default:
      type:
        !type:CategoryColoring
          category: Hair
      fallbackTypes:
        - !type:SkinColoring
    layers:
      ears_cat_inner:
        type:
          !type:SimpleColoring
            color: "#FFFFFF"
  # Starlight start
  sprites:
    body_special@0:
      sprite:
        sprite: Mobs/Customization/cat_parts.rsi
        state: ears_cat_outer
      colorSource: UniqueColor
    body_special@1:
      sprite:
        sprite: Mobs/Customization/cat_parts.rsi
        state: ears_cat_inner
      colorSource: UniqueColor
  # Starlight end

- type: marking
  id: CatTail
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Human]
  coloring:
    default:
      type:
        !type:CategoryColoring
          category: Hair
      fallbackTypes:
        - !type:CategoryColoring
          category: FacialHair
        - !type:SkinColoring
  # Starlight start
  sprites:
    body_tail:
      sprite:
        sprite: Mobs/Customization/cat_parts.rsi
        state: tail_cat
      colorSource: HumanSkinColor
  # Starlight end
  #region Starlight
  emotes:
    - emotePrototype: Mew
      requiredMarkings:
        - CatEars
    - emotePrototype: Meow
      requiredMarkings:
        - CatEars
    - emotePrototype: Trill
      requiredMarkings:
        - CatEars
  #endregion Starlight
