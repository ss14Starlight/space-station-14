- type: marking
  id: VoxBeak
  bodyPart: Snout
  markingCategory: Snout
  forcedColoring: true
  speciesRestriction: [Vox]
  # Starlight start
  sprites:
    body_snout:
      sprite:
        sprite: Mobs/Customization/vox_parts.rsi
        state: beak
      colorSource: HumanSkinColor
  # Starlight end
  coloring:
    default:
      type:
        !type:SimpleColoring
        color: "#937e3d"

