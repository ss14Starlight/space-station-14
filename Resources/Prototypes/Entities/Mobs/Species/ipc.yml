# IPC (Integrated Positronic Chassis) Mob Entity
# SPRITES: Far-Horizons-SS14 (used with permission - sprites only)
# https://github.com/Far-Horizons-SS14/Far-Horizons-SS14
# CODE: Original implementation by Starlight Chimes

- type: entity
  parent:
  - BaseMobSpecies
  - MobFlammable
  id: BaseMobIPC
  name: IPC
  abstract: true
  components:
  - type: IPC # _STARLIGHT: Marker component for IPC mechanics (sleep prevention, etc.)
  - type: HumanoidAppearance
    species: IPC
  - type: Body
    prototype: IPC
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: PowerCellDraw
    drawRate: 0.5
    enabled: true
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: WiresPanel
  - type: ActivatableUIRequiresPanel
  - type: LockedWiresPanel
  - type: Lock
    locked: true
    unlockOnClick: false
    unlockTime: 10 # 10 second do-after for panel unlocking
    lockTime: 10 # 10 second do-after for panel locking
  - type: UseDelay
    delay: 10 # 10 second cooldown between lock/unlock actions
  - type: BorgChassis # _STARLIGHT: Enables borg UI for health and power display
  - type: CyborgSparkEffect # _STARLIGHT: Spark effects when hit by hitscan bullets (like borgs)
  - type: MeleeSound # _STARLIGHT: Metal clang sound when hit in melee (like borgs)
    soundTypes:
      Blunt:
        collection: MetalSlam
      Slash:
        collection: MetalSlam
      Piercing:
        collection: MetalSlam
  - type: Tag
    tags:
    - SiliconEmotes
    - DoorBumpOpener
  - type: Emoting
  - type: Vocal
    sounds:
      Male: UnisexSilicon
      Female: UnisexSilicon
      Unsexed: UnisexSilicon
    wilhelmProbability: 0
  - type: Damageable
    damageContainer: Silicon
    damageModifierSet: Silicon # Balanced resistances: immune to bio damage, 3.5x shock vulnerability
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
  - type: IPCBattery
    numWarnings: 3
    warningSound:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
    drainAllowedTargets:
    - APCBasic
    - APCHighCapacity
    - APCSuperCapacity
    - APCHyperCapacity
    - Substation
    - SubstationWallBasic
    - SMES
  - type: BatteryDrainer # _STARLIGHT: Allow IPCs to drain power from APCs/machines/substations
    disableHandInteraction: true # Use alt+click verbs instead of direct hand interaction
  - type: HumanoidEMP # _STARLIGHT: EMP effects on IPCs
    stunTime: 3
    damage:
      types:
        Shock: 15
        Heat: 10
    knockdownTime: 2
    dropHeldItems: true
  - type: IPCRevive
    rebootButton: true
    rebootTime: 3
  - type: ZombieImmune # _STARLIGHT: IPCs can't be infected by zombies (no biology)
  - type: Absorbable # _STARLIGHT: Remove inherited Absorbable - IPCs can't be absorbed by changelings
    remove: true
  - type: Hunger
    baseDecayRate: 0
  - type: Thirst
    baseThirstThreshold: 0
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechSounds: Borg
    speechVerb: Robotic
  - type: Deathgasp # _STARLIGHT: Custom death message for IPCs
    prototype: IPCDeathgasp
  - type: AtmosExposed # Allows IPCs to be affected by atmospheric temperature
  - type: Temperature
    heatDamageThreshold: 350 # Better heat tolerance than humans (325K) but can't survive fires (373K+)
    coldDamageThreshold: 50  # Extreme cold tolerance - can survive space cold (2.7K) for extended periods
    currentTemperature: 150 # Spawn very cold - far below station temperature
    specificHeat: 280 # High thermal mass - takes 7-8 seconds in space before fully freezing
    coldDamage:
      types:
        Cold: 0.3 # Reduced cold damage
    heatDamage:
      types:
        Heat: 2.5 # Takes more heat damage than baseline due to sensitive electronics
  - type: TemperatureSpeed # Cold slows down movement (like other species)
    thresholds:
      293: 0.9
      280: 0.8
      260: 0.7
  - type: KillOnOverheat # _STARLIGHT: Knockout IPC when circuits overheat
    overheatThreshold: 403.2 # Knockout at 130°C (30% above normal 37°C)
  - type: EyeProtection # _STARLIGHT: IPCs immune to welding flashes - protective optical filters
    protectionTime: 120 # 2 minutes protection (welders apply 10s blind = full immunity)
  - type: LanguageKnowledge
    speaks:
    - GalacticCommon
    - RobotTalk
    understands:
    - GalacticCommon
    - RobotTalk

- type: entity
  parent: BaseSpeciesDummy
  id: MobIPCDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: HumanoidAppearance
    species: IPC
