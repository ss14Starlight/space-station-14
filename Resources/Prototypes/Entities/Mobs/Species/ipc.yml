# IPC (Integrated Positronic Chassis) Mob Entity
# SPRITES: Far-Horizons-SS14 (used with permission - sprites only)
# https://github.com/Far-Horizons-SS14/Far-Horizons-SS14
# CODE: Original implementation by Starlight Chimes

- type: entity
  parent: BaseMobSpecies
  id: BaseMobIPC
  name: IPC
  abstract: true
  components:
  - type: HumanoidAppearance
    species: IPC
  - type: Body
    prototype: IPC
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: PowerCellDraw
    drawRate: 0.5
    enabled: true
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: WiresPanel
  - type: ActivatableUIRequiresPanel
  - type: LockedWiresPanel
  - type: Lock
    locked: true
    unlockOnClick: false
    unlockTime: 10 # 10 second do-after for panel unlocking
    lockTime: 10 # 10 second do-after for panel locking
  - type: UseDelay
    delay: 10 # 10 second cooldown between lock/unlock actions
  - type: BorgChassis # _STARLIGHT: Enables borg UI for health and power display
  - type: CyborgSparkEffect # _STARLIGHT: Spark effects when hit by hitscan bullets (like borgs)
  - type: MeleeSound # _STARLIGHT: Metal clang sound when hit in melee (like borgs)
    soundTypes:
      Blunt:
        collection: MetalSlam
      Slash:
        collection: MetalSlam
      Piercing:
        collection: MetalSlam
  - type: Tag
    tags:
    - SiliconEmotes
  - type: Emoting
  - type: Vocal
    sounds:
      Male: UnisexSilicon
      Female: UnisexSilicon
      Unsexed: UnisexSilicon
    wilhelmProbability: 0
  - type: Damageable
    damageContainer: Silicon
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
  - type: IPCBattery
    numWarnings: 3
    warningSound:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
  - type: IPCRevive
    rebootButton: true
    rebootTime: 3
  - type: Hunger
    baseDecayRate: 0
  - type: Thirst
    baseThirstThreshold: 0
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechSounds: Borg
    speechVerb: Robotic
  - type: AtmosExposed # Allows IPCs to be affected by atmospheric temperature
  - type: Temperature
    heatDamageThreshold: 330 # Slightly higher than humans (325)
    coldDamageThreshold: 260 # Same as humans - freezing point
    currentTemperature: 310.15
    specificHeat: 46
    coldDamage:
      types:
        Cold: 0.5 # Slow cold damage when exposed to extreme cold
    heatDamage:
      types:
        Heat: 3 # Moderate heat damage, shutdown happens before death
  - type: TemperatureSpeed # Become very slow when cold
    thresholds:
      280: 0.7  # 20% slower at 280K
      270: 0.4  # 60% slower at 270K 
      260: 0.2  # 80% slower at freezing point
  - type: LanguageKnowledge
    speaks:
    - GalacticCommon
    - RobotTalk
    understands:
    - GalacticCommon
    - RobotTalk

- type: entity
  parent: BaseSpeciesDummy
  id: MobIPCDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: HumanoidAppearance
    species: IPC
