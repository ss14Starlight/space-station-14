# _STARLIGHT: IPC (Integrated Positronic Chassis) Mob Entity
# SPRITES: Far-Horizons-SS14 (used with permission - sprites only)
# https://github.com/Far-Horizons-SS14/Far-Horizons-SS14
# CODE: Original implementation by Starlight Chimes
# EDITED: 
#   - Added WelderHealing component for welding repairs
#   - Adjusted Temperature thresholds/damage (specificHeat=600, heatDamageThreshold=400K, heatDamage=1.0)
#   - Reduced Shock damage from 3.5x to 2x in Silicon modifier set
#   - Removed BorgChassis to use IPCBattery system instead (avoids duplicate battery indicators)
#   - Removed DamageVisuals (Silicon container has different damage types than Biological)

- type: entity
  parent:
  - BaseMobSpecies
  - MobFlammable
  id: BaseMobIPC
  name: IPC
  abstract: true
  components:
  - type: IPC # _STARLIGHT: Marker component for IPC mechanics (sleep prevention, etc.)
  - type: HumanoidAppearance
    species: IPC
  - type: Body
    prototype: IPC
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: PowerCellDraw
    drawRate: 0.5
    enabled: true
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: WiresPanel
  - type: ActivatableUIRequiresPanel
  - type: LockedWiresPanel
  - type: Lock
    locked: true
    unlockOnClick: false
    unlockTime: 10 # 10 second do-after for panel unlocking
    lockTime: 10 # 10 second do-after for panel locking
  - type: UseDelay
    delay: 10 # 10 second cooldown between lock/unlock actions
  # _STARLIGHT: Removed BorgChassis component - IPCs use IPCBattery system instead to avoid duplicate battery indicators
  # _STARLIGHT: DamageVisuals removed - IPCs use Silicon damage container which has different damage types than organic mobs
  - type: DamageVisuals
  - type: CyborgSparkEffect # _STARLIGHT: Spark effects when hit by hitscan bullets (like borgs)
  - type: MeleeSound # _STARLIGHT: Metal clang sound when hit in melee (like borgs)
    soundTypes:
      Blunt:
        collection: MetalSlam
      Slash:
        collection: MetalSlam
      Piercing:
        collection: MetalSlam
  - type: Tag
    tags:
    - SiliconEmotes
    - DoorBumpOpener
  - type: Emoting
  - type: Vocal
    sounds:
      Male: UnisexSilicon
      Female: UnisexSilicon
      Unsexed: UnisexSilicon
    wilhelmProbability: 0
  - type: TransferMindOnGib # _STARLIGHT: Transfer mind to brain when IPC gibs
  - type: Damageable
    damageContainer: Silicon
    damageModifierSet: Silicon # Balanced resistances: immune to bio damage, 2x shock vulnerability
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
  - type: IPCBattery
    numWarnings: 3
    warningSound:
      path: /Audio/Weapons/Guns/EmptyAlarm/smg_empty_alarm.ogg
    drainAllowedTargets:
    - APCBasic
    - APCHighCapacity
    - APCSuperCapacity
    - APCHyperCapacity
  - type: BatteryDrainer # _STARLIGHT: Allow IPCs to drain power from APCs/machines/substations
    disableHandInteraction: false # _STARLIGHT: Allow left-click with empty hand to drain power
  - type: HumanoidEMP # _STARLIGHT: EMP effects on IPCs
    stunTime: 3
    damage:
      types:
        Shock: 15
        Heat: 10
    knockdownTime: 2
    dropHeldItems: true
  - type: IPCRevive
    rebootButton: true
    rebootTime: 3
  - type: WelderHealing # _STARLIGHT: Allow welders to repair IPC damage
  - type: ZombieImmune # _STARLIGHT: IPCs can't be infected by zombies (no biology)
  - type: Hunger
    baseDecayRate: 0
  - type: Thirst
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechSounds: Borg
    speechVerb: Robotic
  - type: Deathgasp # _STARLIGHT: Custom death message for IPCs
    prototype: IPCDeathgasp
  - type: AtmosExposed # Allows IPCs to be affected by atmospheric temperature
  - type: Temperature
    heatDamageThreshold: 400 # 127°C - electronics can handle high temps before damage starts
    coldDamageThreshold: 173 # -100°C - extreme cold damages circuits and batteries
    currentTemperature: 293 # Room temperature (20°C / 68°F) - normal operating temperature
    specificHeat: 600 # Higher thermal mass - metal chassis resists temperature changes
    atmosTemperatureTransferEfficiency: 0.05 # _STARLIGHT: Much slower temp changes - metal chassis insulates well (gets cold ~50% slower, hot ~25% slower than humans)
    coldDamage:
      types:
        Cold: 0.3 # Reduced cold damage
    heatDamage:
      types:
        Heat: 1.0 # Reduced from 2.5 to prevent crit spam from heat damage
  - type: TemperatureSpeed # Cold slows down movement (like other species)
    thresholds:
      293: 0.9
      280: 0.8
      260: 0.7
  - type: EyeProtection # _STARLIGHT: IPCs immune to welding flashes - protective optical filters
    protectionTime: 120 # 2 minutes protection (welders apply 10s blind = full immunity)
  - type: LanguageKnowledge
    speaks:
    - GalacticCommon
    understands:
    - GalacticCommon

- type: entity
  parent: BaseSpeciesDummy
  id: MobIPCDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: HumanoidAppearance
    species: IPC
