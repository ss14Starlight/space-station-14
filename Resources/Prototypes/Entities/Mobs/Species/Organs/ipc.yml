# IPC Organ Prototypes
# These are the internal organs that IPCs use instead of biological organs

- type: entity
  id: BaseIPCOrgan
  parent: BaseItem
  abstract: true
  components:
  - type: Organ
  - type: Sprite
    sprite: Mobs/Species/IPC/organs.rsi
  - type: Item
    size: Tiny

- type: entity
  id: OrganIPCPositronicBrain
  parent: BaseIPCOrgan
  name: positronic brain
  description: A cube of shining metal, four inches to a side and covered in delicate circuitry.
  components:
  - type: Sprite
    state: heart-on
  - type: Organ
  - type: Brain

- type: entity
  id: OrganIPCEyes
  parent: BaseIPCOrgan
  name: robotic eyes
  description: A pair of advanced optical sensors.
  components:
  - type: Sprite
    state: eyes
  - type: Organ

- type: entity
  id: OrganIPCPowerCell
  parent: BaseIPCOrgan
  name: power cell
  description: A compact high-capacity power cell designed for synthetic life.
  components:
  - type: Sprite
    state: microcell
  - type: Organ

- type: entity
  id: OrganIPCPump
  parent: BaseIPCOrgan
  name: fluid pump
  description: A mechanical pump for circulating coolant and hydraulic fluids.
  components:
  - type: Sprite
    state: heart-off
  - type: Organ
