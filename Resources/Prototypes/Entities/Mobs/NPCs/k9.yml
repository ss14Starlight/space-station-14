- type: entity
  parent: MobCorgiBase
  id: MobK9
  name: security K9
  description: A dog trained for station security work.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Starlight/Mobs/Pets/k9.rsi
    layers:
    - map: ["enum.SpriteVariantLayers.Base"]
      state: k9-brown
  - type: LanguageKnowledge
    speaks:
    - Dog
    understands:
    - GalacticCommon
    - Dog
    - Canilunzt
  - type: LanguageGrantImmune
  - type: Inventory
    forceDisplacements: true
    speciesId: dog
    templateId: K9
  - type: Stripping
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 180
  - type: SpriteVariant
    availableVariants:
    - k9-brown
    - k9-black
    - k9-tan
    - k9-grey
    variantAlerts:
      k9-brown:
        alive: K9BrownHealth
        critical: K9BrownCrit
        dead: K9BrownDead
      k9-tan:
        alive: K9TanHealth
        critical: K9TanCrit
        dead: K9TanDead
      # k9-black/grey have no art yet - keep the default corgi alerts.
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: Zoomies
    action: K9Sprint
    speedModifier: 1.8
    thirstDrain: null
    hungerDrain: null
    duration: 3
    zoomiesAlert: K9Sprint
  - type: Latch
    damagePerTick:
      types:
        Piercing: 1.5
