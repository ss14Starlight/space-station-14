- type: entity
  id: Vaccinator
  parent: BaseMachinePowered
  name: vaccinator
  description: A machine that creates vaccines.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Structures/Machines/vaccinator.rsi
    layers:
    - state: icon
      map: ["enum.DiseaseMachineVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.DiseaseMachineVisualLayers.IsOn"]
  - type: Appearance
  - type: Machine
    board: VaccinatorMachineCircuitboard
  # Starlight - produces treatment doses from a loaded culture. The culture is a template
  # that stays in the machine, so doses are unlimited; the work was getting the culture.
  - type: PathogenVaccinator
  - type: UserInterface
    interfaces:
      enum.PathogenVaccinatorUiKey.Key:
        type: PathogenVaccinatorBoundUserInterface
  - type: ActivatableUI
    key: enum.PathogenVaccinatorUiKey.Key
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      pathogen-culture: !type:ContainerSlot
      pathogen-catalyst: !type:ContainerSlot
      pathogen-injector: !type:ContainerSlot
  - type: RequireProjectileTarget
