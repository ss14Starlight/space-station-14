- type: entity
  parent: BaseComputer
  id: ComputerTechnologyDiskTerminal
  name: tech disk terminal
  description: A terminal used to print out technology disks.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Machines/tech_disk_printer.rsi
    layers:
    - map: ["computerLayerBody"]
      state: icon
    - map: ["computerLayerScreen"]
      state: unshaded
  # Starlight Start
  - type: GenericVisualizer  # Override to prevent edge connection sprites
    visuals:
      enum.EdgeConnectionVisuals.ConnectionMask:
        computerLayerBody:
          None: { state: icon, sprite: Structures/Machines/tech_disk_printer.rsi }
  - type: EdgeConnection
    connectionKey: other
  # Starlight End
  - type: DiskConsole
  - type: ResearchClient
  - type: ActivatableUI
    key: enum.DiskConsoleUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.DiskConsoleUiKey.Key:
        type: DiskConsoleBoundUserInterface
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
  - type: ExtensionCableReceiver
  - type: Computer
    board: TechDiskComputerCircuitboard
  - type: PointLight
    radius: 0.8
    energy: 0.5
    color: "#b53ca1"

- type: weightedRandom
  id: TechDiskTierWeights
  # Starlight-start: 1000
  weights:
    1: 694
    2: 278
    3: 28
  # Starlight-end

- type: weightedRandom
  id: RareTechDiskTierWeights
  # Starlight-start: 100
  weights:
    2: 95
    3: 5
  # Starlight-end
