- type: entity
  parent: GasPipeBase
  abstract: true
  id: GasTrinaryBase
  placement:
    mode: AlignAtmosPipeLayers # starlight
  components:
    - type: AtmosDevice
    - type: Tag
      tags:
        - Unstackable
    - type: SubFloorHide
      blockInteractions: false
      blockAmbience: false
    - type: NodeContainer
      nodes:
        inlet:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: North
        filter:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: West
        outlet:
          !type:PipeNode
          nodeGroupID: Pipe
          pipeDirection: South

- type: entity
  parent: GasTrinaryBase
  id: GasFilter
  name: gas filter
  description: Very useful for filtering gases.
  placement:
    mode: AlignAtmosPipeLayers # starlight
  components:
    - type: SubFloorHide
      visibleLayers:
      - enum.SubfloorLayers.FirstLayer
    - type: Sprite
      sprite: Structures/Piping/Atmospherics/gasfilter.rsi
      layers:
        - sprite: _Carpmosia/Structures/Piping/Atmospherics/pipe.rsi # Carpmosia-edit - 5 pipe layers
          state: pipeTrinaryConnectors
          map: [ "enum.PipeVisualLayers.Pipe" ]
        - state: gasFilter
          map: [ "enum.SubfloorLayers.FirstLayer", "enabled" ]
    # Carpmosia-start - Atmos Alt Prototypes
    - type: AtmosPipeLayers
      alternativePrototypes:
        Primary: GasFilter
        Secondary: GasFilterAlt1
        Tertiary: GasFilterAlt2
        Quaternary: GasFilterAlt3
        Quinary: GasFilterAlt4
    # Carpmosia-end - Atmos Alt Prototypes
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.FilterVisuals.Enabled:
          enabled:
            True: { state: gasFilterOn }
            False: { state: gasFilter }
    - type: PipeColorVisuals
    - type: UserInterface
      interfaces:
        enum.GasFilterUiKey.Key:
          type: GasFilterBoundUserInterface
    - type: GasFilter
      enabled: false
      transferRate: 1000
      maxTransferRate: 1000
    - type: Flippable
      mirrorEntity: GasFilterFlipped
    - type: Construction
      graph: GasTrinary
      node: filter
    - type: AmbientSound
      enabled: false
      volume: -9
      range: 5
      sound:
        path: /Audio/Ambience/Objects/gas_hiss.ogg
    - type: AtmosMonitoringConsoleDevice
      navMapBlip: GasFlowRegulator
    # Starlight start
    - type: VentCrawlTube
    - type: VentCrawlJunction
      degrees:
        - 0
        - -90
        - 180
    # Starlight end
    - type: GuideHelp
      guides:
      - MixingAndFiltering

- type: entity
  parent: GasFilter
  id: GasFilterFlipped
  name: gas filter
  suffix: Flipped
  placement:
    mode: AlignAtmosPipeLayers # starlight
  components:
  - type: SubFloorHide
    visibleLayers:
    - enum.SubfloorLayers.FirstLayer
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/gasfilter.rsi
    layers:
    - sprite: _Carpmosia/Structures/Piping/Atmospherics/pipe.rsi # Carpmosia-edit - 5 pipe layers
      state: pipeTrinaryConnectors
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: gasFilterF
      map: [ "enum.SubfloorLayers.FirstLayer", "enabled" ]
  # Carpmosia-start - Atmos Alt Prototypes
  - type: AtmosPipeLayers
    alternativePrototypes:
      Primary: GasFilterFlipped
      Secondary: GasFilterFlippedAlt1
      Tertiary: GasFilterFlippedAlt2
      Quaternary: GasFilterFlippedAlt3
      Quinary: GasFilterFlippedAlt4
  # Carpmosia-end - Atmos Alt Prototypes
  - type: Flippable
    mirrorEntity: GasFilter
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FilterVisuals.Enabled:
        enabled:
          True: { state: gasFilterFOn }
          False: { state: gasFilterF }
  - type: Construction
    node: filterflipped

  - type: PipeColorVisuals
  - type: NodeContainer
    nodes:
      inlet:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
      filter:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: West
      outlet:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: North
  # Starlight start
  - type: VentCrawlTube
  - type: VentCrawlJunction
    degrees:
      - 0
      - -90
      - 180
  # Starlight end

- type: entity
  parent: GasTrinaryBase
  id: GasMixer
  name: gas mixer
  description: Very useful for mixing gases.
  placement:
    mode: AlignAtmosPipeLayers # starlight
  components:
    - type: SubFloorHide
      visibleLayers:
      - enum.SubfloorLayers.FirstLayer
    - type: Sprite
      sprite: _Starlight/Structures/Piping/Atmospherics/gasmixer.rsi # Starlight: Advanced visuals!
      layers:
        - sprite: _Carpmosia/Structures/Piping/Atmospherics/pipe.rsi # Carpmosia-edit - 5 pipe layers
          state: pipeTrinaryConnectors
          map: [ "enum.PipeVisualLayers.Pipe" ]
        - state: gasMixer
          map: [ "enum.SubfloorLayers.FirstLayer", "enabled" ]
        - state: inletSolid
          map: [ "inlet" ]
          shader: unshaded
          color: '#00000000'
        - state: sideSolid
          map: [ "side" ]
          shader: unshaded
          color: '#00000000'
        - state: outletSolid
          map: [ "outlet" ]
          shader: unshaded
          color: '#00000000'
        - state: coreSolid
          map: [ "core" ]
          shader: unshaded
          color: '#00000000'
    # Carpmosia-start - Atmos Alt Prototypes
    - type: AtmosPipeLayers
      alternativePrototypes:
        Primary: GasMixer
        Secondary: GasMixerAlt1
        Tertiary: GasMixerAlt2
        Quaternary: GasMixerAlt3
        Quinary: GasMixerAlt4
    # Carpmosia-end - Atmos Alt Prototypes
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        # Starlight BEGIN
        enum.FilterVisuals.Inlet:
          inlet:
            Off: { color: '#00000000' }
            SolidGreen: { color: '#00FF00', state: inletSolid }
            SolidYellow: { color: '#FFFF00', state: inletSolid }
            BlinkingYellow: { color: '#FFFF00', state: inletBlink }
            SolidRed: { color: '#FF0000', state: inletSolid }
            BlinkingRed: { color: '#FF0000', state: inletBlink }
        enum.FilterVisuals.Outlet:
          outlet:
            Off: { color: '#00000000' }
            SolidGreen: { color: '#00FF00', state: outletSolid }
            SolidYellow: { color: '#FFFF00', state: outletSolid }
            BlinkingYellow: { color: '#FFFF00', state: outletBlink }
            SolidRed: { color: '#FF0000', state: outletSolid }
            BlinkingRed: { color: '#FF0000', state: outletBlink }
        enum.FilterVisuals.Side:
          side:
            Off: { color: '#00000000' }
            SolidGreen: { color: '#00FF00', state: sideSolid }
            SolidYellow: {  color: '#FFFF00', state: sideSolid }
            BlinkingYellow: { color: '#FFFF00', state: sideBlink }
            SolidRed: { color: '#FF0000', state: sideSolid }
            BlinkingRed: { color: '#FF0000', state: sideBlink }
        enum.FilterVisuals.Core:
          core:
            Off: { color: '#00000000' }
            SolidOrange: { color: '#FF8800', state: coreSolid }
            SolidGreen: { color: '#00FF00', state: coreSolid }
            SolidYellow: { color: '#FFFF00', state: coreSolid }
            BlinkingYellow: { color: '#FFFF00', state: coreBlink }
            SolidRed: { color: '#FF0000', state: coreSolid }
            BlinkingRed: { color: '#FF0000', state: coreBlink }
        # Starlight END
    - type: PipeColorVisuals
    - type: UserInterface
      interfaces:
        enum.GasMixerUiKey.Key:
          type: GasMixerBoundUserInterface
    - type: GasMixer
      enabled: false
      inletOne: inlet
      inletTwo: filter
    - type: Flippable
      mirrorEntity: GasMixerFlipped
    - type: Construction
      graph: GasTrinary
      node: mixer
    - type: AmbientSound
      enabled: false
      volume: -9
      range: 5
      sound:
        path: /Audio/Ambience/Objects/gas_hiss.ogg
    - type: AtmosMonitoringConsoleDevice
      navMapBlip: GasFlowRegulator
    # Starlight start
    - type: VentCrawlTube
    - type: VentCrawlJunction
      degrees:
        - 0
        - -90
        - 180
    # Starlight end
    - type: GuideHelp
      guides:
      - MixingAndFiltering

