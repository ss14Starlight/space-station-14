    #Starlight
  - type: LegendaryItem
    chance: 0.03
    story: Tool #placeholder
    legendarySprites: 
      - _Starlight/Objects/Specific/legendary_items/briefcase_cybersun.rsi
      - _Starlight/Objects/Specific/legendary_items/briefcase_nt.rsi

- type: entity
