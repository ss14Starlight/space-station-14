- type: entity
  id: CigCartonGreen
  parent: [ BoxCardboard, BaseBagOpenClose ]
  name: Spessman's Smokes carton
  description: "A carton containing 10 packets of Spessman's Smokes." #STARLIGHT
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/Cartons/green.rsi
    state: icon
  - type: Item
    sprite: Objects/Consumable/Smokeables/Cigarettes/Cartons/green.rsi
    size: Normal
  - type: Storage
    grid:
    - 0,0,4,3 #STARLIGHT
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: CigPackGreen
        amount: 10 #STARLIGHT
  - type: Tag
    tags:
    - Trash
  - type: PhysicalComposition
    materialComposition:
      Plastic: 50
  - type: SpaceGarbage
  - type: ItemPrice
    priceCategory: cigarete_carton #STARLIGHT

