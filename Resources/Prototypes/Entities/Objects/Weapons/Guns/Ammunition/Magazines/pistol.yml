- type: entity
  id: CartridgePistolSP
  name: cartridge (.35 auto SP)
  parent: BaseCartridgePistol
  components:
  - type: HitScanCartridgeAmmo
    hitscan: BulletPistolTraceSP
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#3F47DB"

