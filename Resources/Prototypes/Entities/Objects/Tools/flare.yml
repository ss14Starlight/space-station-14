- type: entity
  name: emergency flare
  parent: [SolutionComposite, SolutionTiny, BaseItem]
  id: Flare
  description: A flare that produces a very bright light for a short while. Point the flame away from yourself.
  components:
  - type: Tag
    tags:
    - Flare
    - Trash
  - type: SpaceGarbage
  - type: ExpendableLight
    glowDuration: 225
    fadeOutDuration: 15
    iconStateOn: flare_unlit
    iconStateSpent: flare_spent
    turnOnBehaviourID: turn_on
    fadeOutBehaviourID: fade_out
    litSound:
      path: /Audio/Items/Flare/flare_on.ogg
    loopedSound:
      path: /Audio/Items/Flare/flare_burn.ogg
      params:
        loop: true
        volume: -10
        maxDistance: 5
  - type: Sprite
    sprite: Objects/Misc/flare.rsi
    layers:
      - map: [ enum.ExpendableLightVisualLayers.Base ]
        state: flare_base
      - map: [ enum.ExpendableLightVisualLayers.Glow ]
        state: flare_burn
        color: "#FFFFFF"
        visible: false
        shader: unshaded
      - map: [ enum.ExpendableLightVisualLayers.Overlay ]
        state: flare_unlit
        color: "#FF0000"
  - type: Icon
    sprite: Objects/Misc/flare.rsi
    state: icon
  - type: Item
    sprite: Objects/Misc/flare.rsi
    heldPrefix: unlit
    size: Tiny
  - type: Appearance
  - type: PointLight
    enabled: false
    color: "#FF8080"
    radius: 3.0 #SL Edit 1.0 -> 3.0
    energy: 2.0 #SL Edit 9.0 -> 2.0
    netsync: false
  - type: IgnitionSource
    temperature: 1000
  # 🌟Starlight-start🌟
  - type: SurgeryTool
  - type: Cautery
    successRate: 0.1
    startSound:
      path: /Audio/_Starlight/Medical/Surgery/cautery1.ogg
    endSound:
      path: /Audio/_Starlight/Medical/Surgery/cautery2.ogg
  # 🌟Starlight-end🌟
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour # have the radius start small and get larger as it starts to burn
        id: turn_on
        maxDuration: 45.0
        startValue: 2.5
        endValue: 10.0
      - !type:RandomizeBehaviour # weaker flicker as it fades out
        id: fade_out
        interpolate: Nearest
        minDuration: 0.001
        maxDuration: 0.001
        startValue: 1.0 #SL
        endValue: 2.0 #SL
        property: Energy
        isLooped: true
      - !type:FadeBehaviour # fade out radius as it burns out
        id: fade_out
        maxDuration: 15.0
        startValue: 10.0
        endValue: 1.0
  - type: Extractable
    grindableSolutionName: composite
  - type: Solution
    solution:
      reagents:
      # flare casing
      - ReagentId: Iron
        Quantity: 10
      # red phosphorus = red flare trust
      - ReagentId: Phosphorus
        Quantity: 6
      - ReagentId: Carbon
        Quantity: 2
      - ReagentId: Oxygen
        Quantity: 4
      # fuel or something
      - ReagentId: Charcoal
        Quantity: 4
      - ReagentId: Sulfur
        Quantity: 4
