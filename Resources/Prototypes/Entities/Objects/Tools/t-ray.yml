- type: entity
  name: t-ray scanner
  parent: BaseItem
  id: trayScanner
  description: A high-tech scanning device that uses Terahertz Radiation to detect subfloor infrastructure.
  components:
  - type: Sprite
    sprite: Objects/Tools/t-ray.rsi
    layers:
    - state: tray-off
      map: ["base"]
  - type: TrayScanner
  - type: Item
    sprite: Objects/Tools/t-ray.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TrayScannerVisual.Visual:
        base:
          On: { state: tray-on }
          Off: { state: tray-off }
  - type: PhysicalComposition
    materialComposition:
      Steel: 400
      Glass: 150
  - type: StaticPrice
    price: 85
  - type: UseDelay
    delay: 1
  - type: EmitSoundOnPickup # Inferus
    sound:
      path: /Audio/_EE/Items/Handling/multitool_pickup.ogg
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_EE/Items/Handling/multitool_drop.ogg
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/multitool_drop.ogg
      params:
        volume: -4
