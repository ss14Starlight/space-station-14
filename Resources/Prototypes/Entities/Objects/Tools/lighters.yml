    - SolutionFoodDonkpocketWarm
  - type: FlavorProfile
    flavors:
      - bread
      - meaty
      - cheap
  - type: ComponentToggler
    components:
    - type: Edible # This shouldn't be component toggler, but doesn't work when it's not
  - type: PointLight
    enabled: false
    netsync: false
    radius: 2
    color: orange
