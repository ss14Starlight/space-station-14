- type: entity
  id: InternalMechChainSword
  parent: [ BaseMechWeaponMelee, CombatMechEquipment, BaseSecurityContraband ]
  name: exosuit chainsword
  suffix: Mech Weapon, Melee, Combat
  description: Equipment for combat exosuits. This is the mechanical chainsword that'll pierce the heavens!
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    state: mecha_chainsword
  - type: MeleeWeapon
    autoAttack: true
    angle: 0
    wideAnimationRotation: -90
    soundHit:
      path: "/Audio/Weapons/chainsaw.ogg"
    attackRate: 3.5
    damage:
      types:
        Structural: 35
        Piercing: 15

- type: entity
  id: WeaponMechChainSword
  parent: [ InternalMechChainSword, MechHeavyEquipmentItem]
  components:
  - type: MechActiveEquipment
    items:
      - InternalMechChainSword
  - type: MechEquipmentAction
    actionId: ActionMechCycleEquipment
