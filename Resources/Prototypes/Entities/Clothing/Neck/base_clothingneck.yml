- type: entity
  abstract: true
  parent: [SolutionFood, SolutionToolSmall, Clothing, BaseSlicingRefinable]
  id: ClothingNeckBase
  components:
  - type: Item
    size: Small
  - type: Clothing
    quickEquip: true
    slots:
    - neck
  - type: Sprite
    state: icon
  - type: ToolRefinable
    refineResult:
    - id: MaterialCloth1
      amount: 2
  - type: PhysicalComposition # 50% of the amount of cloth you'd obtain upon butchering
    materialComposition:
      Cloth: 100
  - type: Edible
    requiresSpecialDigestion: true
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 15
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon

- type: entity
  abstract: true
  parent: ClothingNeckBase
  id: ClothingScarfBase
  components:
  #region Starlight
  - type: TemperatureProtection # same as winter boots
    heatingCoefficient: 1.025
    coolingCoefficient: 0.6
  - type: Armor
    modifiers:
      coefficients:
        Cold: 0.9 # I mean, that's literally what they're for...
  #endregion Starlight
  - type: Tag
    tags:
    - Scarf
    - ClothMade
    - Recyclable
    - WhitelistChameleon
