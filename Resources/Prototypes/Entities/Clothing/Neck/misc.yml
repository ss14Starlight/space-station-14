- type: entity
  parent: Clothing
  id: ClothingNeckStethoscope
  name: stethoscope
  description: An outdated medical apparatus for listening to the sounds of the human body. It also makes you look like you know what you're doing.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Clothing/Neck/Misc/stethoscope.rsi
    state: icon
  - type: Clothing
    sprite: Clothing/Neck/Misc/stethoscope.rsi
    quickEquip: true
    slots:
    - neck
  - type: Stethoscope

- type: entity
  parent: BaseAction
  id: ActionStethoscope
  name: Listen with stethoscope
  components:
  - type: Action
    icon:
      sprite: Clothing/Neck/Misc/stethoscope.rsi
      state: icon
    priority: -1
    itemIconStyle: BigAction
    checkCanInteract: false
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:StethoscopeActionEvent

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckBling
  name: bling
  description: Damn, it feels good to be a gangster.
  components:
  - type: Sprite
    sprite: Clothing/Neck/Misc/bling.rsi
  - type: Clothing
    sprite: Clothing/Neck/Misc/bling.rsi
  - type: Item
    sprite: Clothing/Neck/Misc/bling.rsi

- type: entity
  parent: ClothingMiscBase # TODO Starlight partial once space-wizards/RobustToolbox/pull/7084 gets fixed
  id: ClothingNeckLawyerbadge
  name: lawyer badge
  description: A badge to show that the owner is a 'legitimate' lawyer who passed the NT bar exam required to practice law.
  components:
  - type: Sprite
    sprite: Clothing/Neck/Misc/lawyerbadge.rsi
  - type: Clothing
    sprite: Clothing/Neck/Misc/lawyerbadge.rsi
  - type: TypingIndicatorClothing
    proto: lawyer

# Blimpuf - Emagged Legal Drobe
- type: entity
  parent: ClothingNeckLawyerbadge
  id: ClothingNeckBrassLawyerbadge
  name: brass lawyer badge
  description: You're sure you could change the judge's mind by throwing this at their head during a trial. You wouldn't though... would you?
  components:
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeCircle
            radius: 0.2
          density: 5
          mask:
            - ItemMask
          restitution: 0.3
          friction: 0.2
    - type: EmbeddableProjectile
      sound: /Audio/Weapons/star_hit.ogg
    - type: LandAtCursor
    - type: DamageOtherOnHit
      damage:
        types:
          Blunt: 10

- type: entity
  parent: ClothingMiscBase # TODO Starlight partial once space-wizards/RobustToolbox/pull/7084 gets fixed
  id: Dinkystar
  name: star sticker
  description: A dinky lil star for only the hardest working security officers! It's not even sticky anymore.
  components:
  - type: Sprite
    sprite: Clothing/Neck/Misc/dinkystar.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Trash
    - WhitelistChameleon
