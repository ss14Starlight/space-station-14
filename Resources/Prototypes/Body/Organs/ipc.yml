# IPC Organs
# SOURCE: Far-Horizons-SS14
# https://github.com/Far-Horizons-SS14/Far-Horizons-SS14
# _STARLIGHT: No modifications

- type: entity
  id: OrganIPCPositronicBrain
  parent: BaseItem
  name: "positronic brain"
  description: "A complex artificial brain capable of sentience."
  components:
  - type: Sprite
    sprite: Mobs/Species/IPC/organs.rsi
    state: microcell
  - type: Organ
  - type: Input
    context: "ghost"
  - type: InputMover
  - type: GhostOnMove
  - type: Brain

- type: entity
  id: OrganIPCEyes
  parent: BaseItem
  name: "optical sensors"
  description: "Advanced optical sensors for synthetic vision."
  components:
  - type: Sprite
    sprite: Mobs/Species/IPC/organs.rsi
    state: eyes
  - type: Organ

- type: entity
  id: OrganIPCPowerCell
  parent: BaseItem
  name: "microbattery"
  description: "An internal power cell that keeps the IPC running."
  components:
  - type: Sprite
    sprite: Objects/Power/power_cells.rsi
    layers:
    - state: small
  - type: Organ

- type: entity
  id: OrganIPCPump
  parent: BaseItem
  name: "hydraulic pump"
  description: "A pump that circulates coolant through the synthetic body."
  components:
  - type: Sprite
    sprite: Mobs/Species/IPC/organs.rsi
    state: heart-on
  - type: Organ
  - type: Metabolizer
    removeEmpty: true
    metabolizerTypes: [ Silicon ]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic
