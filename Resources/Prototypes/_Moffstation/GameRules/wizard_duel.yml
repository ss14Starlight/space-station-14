- type: entity
  parent: BaseRoundstartAntagRule # Starlight
  id: WizardDuel
  components:
  - type: LoadMapRule
    mapPath: /Maps/_Starlight/Nonstations/wizards-court.yml # Starlight map
  - type: RuleGrids
  - type: AntagLoadProfileRule
  - type: GameRule
    minPlayers: 35
  - type: AntagObjectives
    objectives:
    - WizardDuelistMeetObjective
    - WizardDuelistRelocateObjective
    - WizardDuelistDemonstrateObjective
  - type: AntagSelection
    agentName: wizard-round-end-name
    selectionTime: PrePlayerSpawn
    antags:
    - !type:FixedAntagCount
      proto: WizardDuelistRed
    - !type:FixedAntagCount
      proto: WizardDuelistBlue
    - !type:LinearAntagCount # Starlight start
      proto: WizardDuelistPurple
      playerRatio: 90 # Only spawn above 90 players.
      range:
        min: 0
        max: 1
    - !type:FixedAntagCount
      proto: WizardDuelistYellow
    - !type:LinearAntagCount
      proto: WizardDuelistGreen
      playerRatio: 70 # Only spawn above 70 players.
      range:
        min: 0
        max: 1
    - !type:LinearAntagCount
      proto: WizardDuelistOrange
      playerRatio: 110 # Only spawn above 110 players.
      range:
        min: 0
        max: 1 # Starlight end
  - type: DynamicRuleCost
    cost: 150
    cooldown: 1 # Starlight

- type: antagSpecifier
  parent: RestrictedAntag
  id: BaseWizardDuelist
  abstract: true
  prefRoles:
  - WizardDuelist
  roleLoadout:
  - AntagWizardDuelist # Starlight antag loadout
  briefing:
    color: Turquoise
  allowNonHumans: true # Starlight start
  tags:
    - Wizard
    - CantBecomeRevolutionary # Starlight end
  components:
  - type: NpcFactionMember
    factions:
    - Wizard
  - type: RandomMetadata
    nameSegments:
    - NamesWizardFirst
    - NamesWizardLast
    nameFormat: name-format-wizard

- type: antagSpecifier
  parent: BaseWizardDuelist
  id: WizardDuelistRed
  spawnerPrototype: SpawnPointGhostWizardDuelistRed
  briefing:
    text: wizard-duelist-red-role-greeting
    color: Turquoise
    sound: "/Audio/_Starlight/Ambience/Antag/wizard.ogg" # Starlight
  startingGear: WizardDuelistRedGear
  mindRoles:
  - MindRoleWizardDuelistRed

- type: antagSpecifier
