- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseArchMageBattleObjective
  components:
  - type: Objective
    # required but not used
    difficulty: 1
    issuer: objective-issuer-swf
  - type: RoleRequirement
    roles:
    - ArchMageRole

- type: entity
  parent: [BaseArchMageBattleObjective, BaseSurviveObjective]
  id: ArchMageSurviveObjective
  name: Survive
  description: The Space Wizards Federation want you to live!
  components:
  - type: Objective
    icon:
      sprite: Clothing/Head/Hats/wizardhat.rsi
      state: icon

- type: entity
  parent: [BaseArchMageBattleObjective, BaseFreeObjective]
  id: WizardBattleWinObjective
  name: Win the Wizard Battle
  description: Complete the arcane ritual to win the battle against the other archmage!
  components:
  - type: Objective
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: fireball