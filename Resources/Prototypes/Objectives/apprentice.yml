- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseWizardApprenticeObjective
  components:
  - type: Objective
    # required but not used
    difficulty: 1
    issuer: objective-issuer-swf
  - type: RoleRequirement
    roles:
    - ApprenticeRole

- type: entity
  parent: [BaseWizardApprenticeObjective, BaseSurviveObjective]
  id: WizardApprenticeSurviveObjective
  name: Survive
  description: The Space Wizards Federation want you to live!
  components:
  - type: Objective
    icon:
      sprite: Clothing/Head/Hats/wizardhat.rsi
      state: icon

- type: entity
  parent: [BaseWizardApprenticeObjective, BaseFreeObjective]
  id: WizardApprenticeBattleWinObjective
  name: Help your archmage win the Wizard Battle
  description: Recruit followers and help your archmage complete the arcane ritual to win the battle against the other archmage!
  components:
  - type: Objective
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: fireball
