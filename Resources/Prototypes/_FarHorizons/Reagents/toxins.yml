- type: reagent
  id: BatteryAcid
  name: reagent-name-batteryacid
  group: Toxins
  desc: reagent-desc-batteryacid
  physicalDesc: reagent-physical-desc-metallic
  contrabandSeverity: Minor
  flavor: shocking
  color: "#ffe270"
  metabolisms:
    Bloodstream: # Starlight
      effects:
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Neocyte, Xeno ] # Harmless to Neocytes # Starlight - and Xenos
          inverted: true
        damage:
          types: # Drinking battery acid is bad for you? Woh.
            Shock: 0.5
            Caustic: 0.5
      - !type:SatiateThirst
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Neocyte ]
        factor: 1 #yummy
        #Starlight Start
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Xeno ]
        damage:
          types:
            Bloodloss: -0.2 #Budget blood
        #Starlight End
      # Acts like vitamin but for Neocytes. Keep in mind the -50% healing debuff they get, hence buffed numbers.
      - !type:EvenHealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Neocyte ]
        damage:
          Brute: -1
          Burn: -1
      - !type:ModifyBleed #smth smth burns you from the inside so it stops internal bleeding, clearly.
        conditions:
        #Starlight Start
        - !type:MetabolizerTypeCondition
          type: [ Xeno ]
          inverted: true
        #Starlight End
        amount: -0.5
      - !type:SatiateHunger
        factor: 1 # yummy
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Neocyte ]
        #Starlight Start
        - !type:MetabolizerTypeCondition
          type: [ Xeno ]
          inverted: true
        #Starlight End
