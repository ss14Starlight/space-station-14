- type: reagent
  id: BatteryAcid
  name: reagent-name-batteryacid
  group: Toxins
  desc: reagent-desc-batteryacid
  physicalDesc: reagent-physical-desc-metallic
  contrabandSeverity: Minor
  flavor: shocking
  color: "#ffe270"
  metabolisms:
    Bloodstream: # Starlight
      effects:
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Neocyte ] # Harmless to Neocytes
          inverted: true
        damage:
          types: # Drinking battery acid is bad for you? Woh.
            Shock: 0.5
            Caustic: 0.5
      - !type:SatiateThirst
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Neocyte ]
        factor: 1 #yummy
      # Acts like vitamin but for Neocytes. Keep in mind the -50% healing debuff they get, hence buffed numbers.
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Neocyte ]
        damage:
          groups:
            Brute: -1
            Burn: -1
      - !type:ModifyBleed #smth smth burns you from the inside so it stops internal bleeding, clearly.
        amount: -0.5
      - !type:SatiateHunger
        factor: 1 # yummy
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Neocyte ]
