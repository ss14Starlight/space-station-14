# IPC Body Prototype
# SOURCE: Far-Horizons-SS14
# https://github.com/Far-Horizons-SS14/Far-Horizons-SS14
# _STARLIGHT: No modifications

- type: body
  id: IPC
  name: "ipc"
  root: torso
  slots:
    head:
      part: HeadIPC
      connections:
      - torso
      organs:
        brain: OrganIPCPositronicBrain
        eyes: OrganIPCEyes
        eye_implant: null
    torso:
      part: TorsoIPC
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      organs:
        cell: OrganIPCPowerCell
        pump: OrganIPCPump
        cavity: null
    right arm:
      part: RightArmIPC
      connections:
      - right hand
    left arm:
      part: LeftArmIPC
      connections:
      - left hand
    right hand:
      part: RightHandIPC
    left hand:
      part: LeftHandIPC
    right leg:
      part: RightLegIPC
      connections:
      - right foot
    left leg:
      part: LeftLegIPC
      connections:
      - left foot
    right foot:
      part: RightFootIPC
    left foot:
      part: LeftFootIPC
