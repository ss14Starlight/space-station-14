# TODO - Sprite Avali Protogen organs. Basically the same as the blue ones but darker and yellow- 100% a cosmetic thing.

- type: entity
  id: BaseProtogenUnGibbable
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/Protogen/organs.rsi
  - type: Organ
  - type: Food
  - type: Extractable
    grindableSolutionName: organ
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: FlavorProfile
    flavors:
      - people
  - type: Tag
    tags:
      - Meat

- type: entity
  id: BaseProtogenOrgan
  parent: BaseProtogenUnGibbable
  abstract: true
  components:
  - type: Gibbable

- type: entity
  id: OrganProtogenBrain
  parent: [BaseOrganBrain, BaseProtogenUnGibbable]
  name: Cybernetic Brain
  description: The source of incredible, unending intelligence. 01201020 02102111 01201210 02121012 20121210 #  Starlight, quotation marks removed
  components:
  - type: Sprite
    state: brain

- type: entity
  id: OrganProtogenEyes
  parent: [BaseProtogenOrgan, BaseOrganEyes]
  name: Cybernetic Eyes
  description: It's still focusing on you.. Creepy. #  Starlight, quotation marks removed
  components:
  - type: Sprite
    layers:
      - state: eyeball-l
      - state: eyeball-r
  - type: Item
    size: Small
    heldPrefix: eyeballs
  - type: OrganVisualization
    layer: Eyes
    prototype: MobHumanoidEyes

- type: entity
  id: OrganProtogenTongue
  parent: [BaseProtogenOrgan, BaseOrganTongue]
  name: Cybernetic Tongue
  description: A completely glowing organ commonly used for lying or self-expression. Sometimes both. #  Starlight, quotation marks removed
  components:
  - type: Sprite
    state: tongue

- type: entity
  id: OrganProtogenTongueForked
  parent: [BaseProtogenOrgan, BaseOrganTongue]
  name: Forked Cybernetic Tongue
  description: A completely glowing organ commonly used for lying or self-expression. Sometimes both. Now split in two. #  Starlight, quotation marks removed
  components:
  - type: Sprite
    state: tongueforked

- type: entity
  id: OrganProtogenEars
  parent: [BaseProtogenOrgan, BaseOrganEars]
  name: Cybernetic Ears
  description: Process audio at a higher quality than most humanoids, allowing for greater appreciation of techno music #  Starlight, quotation marks removed
  components:
  - type: Sprite
    state: ears

- type: entity
  id: OrganProtogenLungs
  parent: [BaseProtogenOrgan, BaseOrganLungs]
  name: Cybernetic Lungs
  description: Filters oxygen from an atmosphere, which is then sent into the bloodstream to be used as an electron carrier. Entirely cybernetic in nature, working in tandem with the visor's filtration system. #  Starlight, quotation marks removed
  components:
  - type: Sprite
    layers:
      - state: lung-l
      - state: lung-r
  - type: Item
    size: Small
    heldPrefix: lungs
  - type: Lung
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: Lung
    metabolizerTypes: [ Protogen ]
    groups:
    - id: Gas
      rateModifier: 100.0
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
      Lung:
        maxVol: 100.0
        canReact: false
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5

- type: entity
  id: OrganProtogenHeart
  parent: [BaseProtogenOrgan, BaseOrganHeart]
  name: Cybernetic Heart
  description: Doesn't actually need to beat, simply mimics the movement to provide comfort for the user. #  Starlight, quotation marks removed
  components:
  - type: Sprite
    state: heart-on
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [Protogen]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic
  - type: Item
    size: Small
    heldPrefix: heart

- type: entity
  id: OrganProtoKinCore
  parent: BaseProtogenOrgan
  name: Cybernetic Shadekin Core
  description: The result of a one-time operation to restore a shadekin's core, it is bright once more- but not as bright as it could've been. #  Starlight, quotation marks removed
  components:
  - type: Organ
  - type: Sprite
    state: core

- type: entity
  id: OrganProtogenStomach
  parent: [OrganAnimalStomach, BaseOrganStomach]
  name: Biological Reactor
  description: Some call it over-engineered, but it's vital to the function of a protogen. Turns organic matter into organic and electrical energy to power the protogen's cybernetics and flesh. #  Starlight, quotation marks removed
  components:
  - type: Sprite
    sprite: _FarHorizons/Mobs/Species/Protogen/organs.rsi
    state: stomach
  - type: Item
    size: Small
    heldPrefix: stomach
  - type: Stomach
    specialDigestible: # all this for the ram chip meme.
      tags:
      - Paper
      - Pill
      - Pizza
      - Meat
      - Fruit
      - Donut
      - Vegetable
      - Cake
      - FoodSnack
      - Soup
      - Crayon
      - Pancake
      - RamChip
      - ReptilianFood
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5

- type: entity
  id: OrganProtogenLiver
  parent: [BaseProtogenOrgan, BaseOrganLiver]
  name: Cybernetic Liver
  description: Pairing suggestion: fermented RAM sticks and CPU drives. #  Starlight, quotation marks removed
  components:
  - type: Sprite
    state: liver
  - type: Item
    size: Small
    heldPrefix: liver
  - type: Metabolizer
    maxReagents: 1
    metabolizerTypes: [Protogen]
    groups:
    - id: Alcohol
      rateModifier: 0.1

- type: entity
  id: OrganProtogenKidneys
  parent: [BaseProtogenOrgan, BaseOrganKidneys]
  name: Cybernetic Kidneys
  description: Pumps toxins out of the bloodstream and serves as a minor biological battery for electrical components #  Starlight, quotation marks removed
  components:
  - type: Sprite
    layers:
      - state: kidney-l
      - state: kidney-r
  - type: Item
    size: Small
    heldPrefix: kidneys
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [Protogen]
    removeEmpty: true

