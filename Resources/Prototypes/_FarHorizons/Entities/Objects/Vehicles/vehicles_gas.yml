#region Buckled Vehicles
- type: entity
  id: VehicleGasBuckleBase
  abstract: true
  save: false
  parent: BaseVehicleRideableDamageable
  components:
  - type: Vehicle
    cellPowered: false
    requireIgnition: true
    allowCrashing: true
    baseState: vehicle
    brokenState: vehicle_broken
    startupTime: 2
    startUp:
      path: /Audio/Effects/Vehicle/vehiclestartup.ogg
      params:
        volume: -3
    hornSound:
      path: /Audio/Effects/Vehicle/carhorn.ogg
      params:
        volume: -3
    riderWhitelist:
      tags:
        - CanPilot
    soundHit:
      collection: MetalThud
  - type: DirectionalOverride
    offsets:
      North: "0, -0.12"
      South: "0, -0.12"
      East: "0, -0.2"
      West: "0, -0.2"
    drawDepths:
      North: OverMobs
      South: OverMobs
      East: BelowMobs
      West: BelowMobs
  - type: Strap
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 360
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: ItemSlots
    slots:
      key_slot:
        name: Keys
        whitelist:
          requireAll: true
          tags:
          - VehicleKey
          - ATVKeys
  - type: ContainerContainer
    containers:
      key_slot: !type:ContainerSlot
      vehicle_mods_container: !type:Container
  - type: Solution
    id: fueltank
    solution:
      maxVol: 150
  - type: RefillableSolution
    solution: fueltank
  - type: ExaminableSolution
    solution: fueltank
    exactVolume: true
  - type: ReagentDraw
    enabled: false
    solutionContainer: fueltank
    whitelistedReagents:
    - WeldingFuel
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/_FarHorizons/Vehicles/atvwalk.ogg
      params:
        volume: -11
        pitch: 1.15
        variation: 0.10
  - type: VehicleMods
    vehicleType: Gas
    equipmentSlots: [tires, engine, armor, headlight]

- type: entity
  id: VehicleATV
  parent: VehicleGasBuckleBase
  name: atv
  description: All-Tile Vehicle.
  components:
  - type: RandomMetadata
    descriptionSegments: [DescriptionsATV]
  - type: Sprite
    drawdepth: OverMobs
    sprite: _FarHorizons/Objects/Vehicles/atv.rsi
    layers:
    - state: vehicle
      map: ["enum.VehicleVisualLayers.Base"]
    noRot: true
  - type: ItemSlots
    slots:
      key_slot:
        name: Keys
        whitelist:
          requireAll: true
          tags:
          - VehicleKey
          - ATVKeys
  - type: Hitch
  - type: VehicleMods
    vehicleType: Gas
    equipmentSlots: [tires, engine, armor, headlight]

- type: entity
  id: VehicleATVFilled
  parent: VehicleATV
  suffix: Filled
  components:
    - type: Solution
      solution:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 150
    - type: ContainerFill
      containers:
        key_slot:
        - VehicleKeyATV
    - type: VehicleMods
      startingEquipment:
        - BasicTires
        - BasicEngine
        - BasicHeadlight

- type: entity
  id: VehicleATVNanoTrasen
  parent: VehicleGasBuckleBase
  name: ntv
  description: A luxurious variant of the ATV.
  components:
    - type: Sprite
      drawdepth: OverMobs
      sprite: _FarHorizons/Objects/Vehicles/sectv.rsi
      layers:
      - state: vehicle
        map: ["enum.VehicleVisualLayers.Base"]
      noRot: true
    - type: ContainerContainer
      containers:
        key_slot: !type:ContainerSlot
        storagebase: !type:Container
        vehicle_mods_container: !type:Container
    - type: Storage
      grid:
      - 0,0,10,9
      maxItemSize: Huge
      openOnActivate: false
      clickInsert: false
    - type: UseDelay
      delay: 0.5
    - type: LockedStorage
    - type: Lock
      locked: true
      showLockVerbs: false
      unlockOnClick: false
      popupMessage: false
      showExamine: false
    - type: ItemSlots
      slots:
        key_slot:
          name: Keys
          whitelist:
            requireAll: true
            tags:
            - VehicleKey
            - NTVKeys
    - type: Hitch
    - type: VehicleMods
      vehicleType: Gas
      equipmentSlots: [tires, engine, armor, headlight, lightbar]

- type: entity
  id: VehicleATVNanoTrasenFilled
  parent: VehicleATVNanoTrasen
  suffix: Filled
  components:
    - type: Solution
      solution:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 150
    - type: ContainerFill
      containers:
        key_slot:
        - VehicleKeyNTV
    - type: VehicleMods
      startingEquipment:
        - BasicTires
        - BasicEngine
        - BasicArmorKit
        - BasicHeadlight

