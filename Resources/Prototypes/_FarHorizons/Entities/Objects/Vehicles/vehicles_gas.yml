  - type: ContainerContainer
    containers:
      key_slot: !type:ContainerSlot
      storagebase: !type:Container
      vehicle_mods_container: !type:Container
  - type: Hitch
  - type: Storage
    grid:
    - 0,0,1,5
    - 3,0,6,5
    - 8,0,9,5
    maxItemSize: Huge
    openOnActivate: false
    clickInsert: false
  - type: VehicleMods
    vehicleType: Gas

- type: entity
  id: VehicleMotorcycleFilled
  parent: VehicleMotorcycle
  suffix: Filled
  components:
    - type: Solution
      solution:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 150
    - type: ContainerFill
      containers:
        key_slot:
