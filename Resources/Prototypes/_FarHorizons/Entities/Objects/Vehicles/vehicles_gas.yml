#region Container Vehicles
- type: entity
  id: VehicleContainerBase
  abstract: true
  save: false
  parent: BaseVehicleRideableDamageable
  components:
  - type: Vehicle
    cellPowered: false
    requireIgnition: true
    allowCrashing: true
    baseState: vehicle
    brokenState: vehicle_broken
    startupTime: 2
    startUp:
      path: /Audio/Effects/Vehicle/vehiclestartup.ogg
      params:
        volume: -3
    hornSound:
      path: /Audio/Items/Toys/pushHornHonk.ogg
      params:
        volume: -3
    riderWhitelist:
      tags:
        - CanPilot
    soundHit:
      collection: MetalThud
  - type: ContainerContainer
    containers:
      key_slot: !type:ContainerSlot
      passenger_slot: !type:Container
      storagebase: !type:Container
      vehicle_mods_container: !type:Container
  - type: Solution
    id: fueltank
    solution:
      maxVol: 150
  - type: RefillableSolution
    solution: fueltank
  - type: ExaminableSolution
    solution: fueltank
    exactVolume: true
  - type: ReagentDraw
    enabled: false
    solutionContainer: fueltank
    whitelistedReagents:
    - WeldingFuel
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/_FarHorizons/Vehicles/atvwalk.ogg
      params:
        volume: -11
        pitch: 1.15
        variation: 0.10
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 1000
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Explosive
    explosionType: Default
    totalIntensity: 300
    intensitySlope: 5
    maxIntensity: 8
    canCreateVacuum: false
    deleteAfterExplosion: false
  - type: Storage
    grid:
    - 0,0,9,4
    maxItemSize: Huge
    openOnActivate: false
    clickInsert: false
  - type: UseDelay
    delay: 0.5
  - type: LockedStorage
  - type: Lock
    locked: true
    showLockVerbs: false
    unlockOnClick: false
    popupMessage: false
    showExamine: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Breakage"]
      - !type:SolutionExplosionBehavior
        solution: fueltank
      - !type:EmptyContainersBehaviour
        containers:
        - passenger_slot
        - storagebase
  - type: VehicleMods
    vehicleType: Gas
    equipmentSlots: [tires, engine, armor, headlight]

- type: entity
  id: VehicleClownCar
  parent: VehicleContainerBase
  name: clown car
  description: What sort of horrors lie within...
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _FarHorizons/Objects/Vehicles/clowncar.rsi
    scale: 0.75, 0.75
    layers:
    - state: vehicle
      map: ["enum.VehicleVisualLayers.Base"]
    noRot: true
  - type: ItemSlots
    slots:
      key_slot:
        name: Keys
        whitelist:
          requireAll: true
          tags:
          - VehicleKey
          - ClowncarKeys

- type: entity
  id: VehicleClownCarFilled
  parent: VehicleClownCar
  suffix: Filled
  components:
    - type: Solution
      solution:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 150
    - type: ContainerFill
      containers:
        key_slot:
        - VehicleKeyClowncar
    - type: VehicleMods
      startingEquipment:
        - BasicTires
        - BasicEngine
        - BasicArmorKit
        - BasicHeadlight
