- type: entity
  id: VehicleBatteryBuckleBase
  abstract: true
  save: false
  parent: BaseVehicleRideableDamageable
  components:
    - type: Strap
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.4
          density: 100
          restitution: 0.0
          mask:
          - MobMask
          layer:
          - MobLayer
    - type: ContainerContainer
      containers:
        key_slot: !type:ContainerSlot
        cell_slot: !type:ContainerSlot
        vehicle_mods_container: !type:Container
    - type: PowerCellSlot
      cellSlotId: cell_slot
      fitsInCharger: false
    - type: PowerCellDraw
      enabled: false
    - type: FootstepModifier
      footstepSoundCollection:
        path: /Audio/Effects/Footsteps/borgwalk4.ogg
        params:
          pitch: 1.15
          variation: 0.05
    - type: Vehicle
      requireIgnition: true
      baseState: vehicle
      brokenState: vehicle_broken
      startupTime: 2
      handsNeeded: 1
      riderWhitelist:
        tags:
          - CanPilot
      disallowWielding: true
      allowGunKnockback: true
      soundHit:
        collection: MetalThud
    - type: DirectionalOverride
      offsets:
        North: "0, -0.12"
        South: "0, -0.12"
        East: "0, -0.2"
        West: "0, -0.2"
      drawDepths:
        North: BelowMobs
        South: OverMobs
        East: OverMobs
        West: OverMobs
    - type: VehicleMods
      vehicleType: Electric
      equipmentSlots: [tires, engine, armor, headlight]

- type: entity
  id: VehicleScooterElectric
  parent: VehicleBatteryBuckleBase
  name: electric scooter
  components:
    - type: Sprite
      drawdepth: OverMobs
      sprite: _FarHorizons/Objects/Vehicles/electric_scooter.rsi
      layers:
      - state: vehicle
        map: ["enum.VehicleVisualLayers.Base"]
      noRot: true
    - type: ItemSlots
      slots:
        key_slot:
          name: Keys
          whitelist:
            requireAll: true
            tags:
            - VehicleKey
            - ScooterElectricKeys
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          disableEject: true
          swap: true
    - type: VehicleMods
      vehicleType: Electric
      equipmentSlots: [tires, engine, armor, headlight, lightbar]
    - type: ItemMapper
      mapLayers:
        lightarmor:
          whitelist:
            tags:
              - VehicleLightArmor

- type: entity
  id: VehicleScooterElectricFilled
  parent: VehicleScooterElectric
  suffix: Filled
  components:
    - type: ContainerFill
      containers:
        cell_slot:
        - PowerCellMedium
        key_slot:
        - VehicleKeyScooterElectric
    - type: VehicleMods
      startingEquipment:
        - BasicTires
        - ElectricEngine
        - BasicHeadlight

- type: entity
