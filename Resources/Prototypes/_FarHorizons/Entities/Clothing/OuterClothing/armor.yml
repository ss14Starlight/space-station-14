#### Proto-Armor ####
- type: entity
  parent: ClothingOuterArmorBaseFH
  id: ClothingOuterArmorProtogenBase
  components:
  - type: Item
    size: Huge
  - type: Unremoveable
  - type: Tag
    tags:
    - ProtogenCybernetics
    - SurgeryCompatibleArmor

- type: entity
  parent: ClothingOuterArmorProtogenBase
  id: ClothingOuterArmorProtogenLight
  name: Light Protogen Cybernetics
  description: Removal of this would require killing you. Comes in-built with light armor plating to shield the cybernetics within.
  components:
  - type: Sprite
    sprite: _FarHorizons/Clothing/OuterClothing/Armor/protogen.rsi
    state: light
#  - type: Armor # Starlight start, no armor
#    modifiers:
#      coefficients:
#        Slash: 0.9
#        Piercing: 0.9
#  - type: ClothingSpeedModifier #Ligher armor gives room for cybernetics to give speedbuff is my logic.
#    walkModifier: 1
#    sprintModifier: 1.05 #same speed as cyberlegs # Starlight end
  - type: ExplosionResistance # This is acceptable.
    damageCoefficient: 0.95

- type: entity
  parent: ClothingOuterArmorProtogenBase
  id: ClothingOuterArmorProtogenMedium
  name: Standard Protogen Cybernetics
  description: Removal of this would require killing you. Comes in-built with moderate armor plating to shield the cybernetics within and protect the user.
  components:
  - type: Sprite
    sprite: _FarHorizons/Clothing/OuterClothing/Armor/protogen.rsi
    state: medium
  - type: Armor
    modifiers: # Not true body armor, so no flat reductions. Could end up stacking undesirably if it had any.
      coefficients:
        Slash: 0.95 # Starlight, it's 5%, not the most egregious
        Blunt: 0.95 # Starlight, not getting pierce armor natively

- type: entity
  parent: ClothingOuterArmorProtogenBase
  id: ClothingOuterArmorProtogenHeavy
  name: Heavy Protogen Cybernetics
  description: Removal of this would require killing you. Comes in-built with heavy armor plating for active combat scenarios. A bit weighty.
  components:
  - type: Sprite
    sprite: _FarHorizons/Clothing/OuterClothing/Armor/protogen.rsi
    state: heavy
  - type: Armor
    modifiers:
      coefficients:
        Slash: 0.90 # Starlight. 40%'s too much for 10% slowdown.
        Blunt: 0.90 # Starlight, no free pierce armor. They're weak to blunt, so it evens out somewhat.
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 0.90 #Seems low, but a secvest has 30% w/no reduction or a better example would be plate carrier for 45% reduction. 10% reduction for bit better secvest seems fine to me - Keep in mind that they take increased blunt as well.
  - type: ExplosionResistance
    damageCoefficient: 0.80
