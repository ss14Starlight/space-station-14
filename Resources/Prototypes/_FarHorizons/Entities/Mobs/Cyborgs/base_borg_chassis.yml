- type: entity
  abstract: true
  parent: BaseBorgTransponder
  id: BaseSecBorgTransponder
  components:
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: SecborgControl
    transmitFrequencyId: SecurityRoboticsConsole
    savableAddress: false


- type: entity # TODO implement sirens
  parent: [BaseBorgChassis, BaseSecBorgTransponder]
  id: BorgChassisSelectableSecurity # Starlight
  name: security cyborg
  description: A special chassis produced by Nanotrasen to aid station side security forces in their duties.
  components:
  - type: BorgTransponder
    name: security cyborg
    sprite:
      sprite: _Starlight/Mobs/Silicon/Chassis/security.rsi # starlight
      state: borg
  - type: TextToSpeech
  # region starlight
  - type: Sprite
    sprite: _Starlight/Mobs/Silicon/Chassis/security.rsi
    layers:
    - state: borg
      map: [ "movement", "enum.BorgVisualLayers.Body" ]
    - state: borg_e_r
      map: [ "enum.BorgVisualLayers.Light" ]
      shader: unshaded
      visible: false
    - state: borg_l
      shader: unshaded
      map: [ "light", "enum.BorgVisualLayers.LightStatus" ]
      visible: false
  # end region
      # - state: secborg_siren_on
      #   map: [ "enum.BorgVisualLayers.Siren" ]
      #   shader: unshaded
  - type: RandomMetadata
    nameSegments:
    - NamesBorg
  - type: NpcFactionMember
    factions:
    - NanoTrasenSilicon
  - type: Access
    enabled: false
    groups:
    - Security # Ensure it can go anywhere inside of sec.
  - type: AccessReader
    access: [["Command"], ["Security"]]
  - type: ShowJobIcons
  - type: ShowMindShieldIcons
  - type: ShowCriminalRecordIcons
  - type: InteractionPopup
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg
  - type: FlashImmunity
  # - type: ActionGrant
  #   actions:
  #   - ActionBorgToggleSirens
  - type: EmagSiliconLaw
    stunTime: 5
  - type: SiliconLawProvider
    laws: RobocopLawset
  - type: BorgChassis
    maxModules: 0 # starlight
    hasMindState: borg_e
    noMindState: borg_e_r
  # region starlight
  - type: BorgSwitchableType
    inherentRadioChannels:
    - Binary
    - Common
    availableTypes:
    - security
  # end region
    

- type: entity
  parent: BorgChassisSecurity
  id: BorgChassisSecurityModule
  suffix: Module
  components:
  - type: ContainerFill
    containers:
      borg_module:
      - BorgModuleTool
      - BorgModuleBaton
      - BorgModuleDominator
