# Teach a Lesson
- type: entity
  parent: [BaseTraitorObjective, BaseTeachALessonObjective]
  id: TeachRandomPersonObjective
  description: Ensure they die at least once this shift. They know what they did.
  components:
    - type: Objective
      difficulty: 1.5
      unique: false
    - type: TargetObjective
      title: objective-condition-teach-lesson-title
    - type: PickRandomPerson

- type: entity
  parent: [BaseTraitorObjective, BaseTeachALessonObjective]
  id: TeachRandomHeadObjective
  description: Ensure this head dies at least once this shift. They know what they did.
  components:
    - type: Objective
      # technically it's still possible for TeachRandomPersonObjective to roll a head but this is guaranteed, so higher difficulty
      difficulty: 2.5
      # killing 1 head is enough
      unique: true
    - type: TargetObjective
      title: objective-condition-teach-lesson-title
    - type: PickRandomHead

- type: entity
  parent: BaseRDStealObjective
  id: RDDiplomaStealObjective
  components:
  - type: StealCondition
    stealGroup: RDDiplomaSteal
    
- type: entity
  parent: BaseCMOStealObjective
  id: CMOLicenseStealObjective
  components:
  - type: StealCondition
    stealGroup: CMOLicenseSteal

## brigmedic

- type: entity
  abstract: true
  parent: BaseTraitorStealObjective
  id: BaseBrigmedicStealObjective
  components:
  - type: NotJobRequirement
    job: Brigmedic
  - type: StealCondition
    owner: job-name-brigmedic

- type: entity
  parent: BaseBrigmedicStealObjective
  id: BrigmedicHyposprayStealObjective
  components:
  - type: StealCondition
    stealGroup: BrigmedicHypoSteal
  - type: Objective
    # You'll have to snatch this from the brigmedic's cold, dead hands. Also they're always in sec.
    difficulty: 2