# SGS-GUNNERY — Starlight Gunnery Console
# A targeting-radar station that lets crew aim and remotely fire shuttle-mounted
# cannons, and guide EMP rockets via LMB-drag.

- type: entity
  parent: BaseComputer
  id: ComputerGunneryConsole
  name: SGS-gunnery console
  description: Manufactured by Striskov-Galactic Systems (SGS), the SGS-GC1 Gunnery Console is a dedicated fire-control station for shuttle-mounted artillery. Integrated with SGS cannon systems, it displays a live tactical radar overlay, draws targeting lines for all mounted weapons, and provides guided control for EMP rockets. SGS — 'Precision at any range.'
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: solar_screen
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: GunneryConsole
    maxRange: 512
  - type: ActivatableUI
    key: enum.GunneryConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.GunneryConsoleUiKey.Key:
        type: GunneryConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: PointLight
    radius: 1.5
    energy: 3.0
    enabled: false
    color: "#ff6010"
  - type: StaticPrice
    price: 3500
