# Energy dome for SVS Vanguard Pressure Suit
- type: entity
  id: VanguardEnergyDome
  parent: BaseStructure
  name: personal energy dome
  description: A small red protective energy barrier.
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        density: 100
        mask:
        - MachineMask
        layer:
        - MobLayer
  - type: Sprite
    sprite: Structures/Power/Generation/Singularity/emitter.rsi
    drawdepth: Walls
    state: shield
    shader: unshaded
    color: "#FF0000"
    scale: 0.5, 0.5
  - type: PointLight
    enabled: true
    radius: 2
    energy: 1.5
    color: "#FF0000"
  - type: EnergyDome
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
