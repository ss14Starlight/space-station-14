- type: entity
  id: PowerTransmissionLaser
  parent: BaseMachine
  name: PTL
  description: todo
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Power/ptl.rsi
    noRot: true
    layers:
      - state: trapdoor
        map: ["trapdoorLayer"]
      - state: ptl_off
        map: ["mainLayer"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PtlVisuals.Active:
        mainLayer:
          True: { state: ptl_on }
          False: { state: ptl_off }
        trapdoorLayer:
          True: { visible: false }
          False: { visible: true }
  - type: ActivatableUI
    key: enum.PtlUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PtlUiKey.Key:
        type: PtlBoundUserInterface
  - type: Ptl
    targetPowerMw: 1
    maxPowerMw: 5
    cycleTimeSeconds: 2
    spesosPerMwPerCycle: 50
  - type: Battery
    startingCharge: 0
    maxCharge: 24000000
  - type: ExaminableBattery
  - type: PowerNetworkBattery
    canDischarge: false
    maxSupply: 0
    maxChargeRate: 5000
  - type: BatteryCharger
    voltage: Medium
    node: input
  - type: PowerConsumer
    voltage: Medium
    node: input
    drawRate: 0
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: MVPower