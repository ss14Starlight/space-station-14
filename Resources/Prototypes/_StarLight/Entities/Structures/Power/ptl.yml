- type: entity
  id: PowerTransmissionLaser
  parent: [BaseMachine, ConstructibleMachine]
  name: Power Transmission Laser
  description: A Power Transmission Laser that converts excess station power into station funds by beaming the energy away.
  placement:
    mode: SnapgridCenter
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,-1.5,1.5,1.5"
        density: 50
        mask:
        - LargeMobMask
        layer:
        - WallLayer
  - type: Sprite
    sprite: _Starlight/Structures/Power/ptl.rsi
    noRot: true
    layers:
      - state: trapdoor
        map: ["trapdoorLayer"]
      - state: ptl_off
        map: ["mainLayer"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PtlVisuals.Active:
        mainLayer:
          True: { state: ptl_on }
          False: { state: ptl_off }
        trapdoorLayer:
          True: { visible: false }
          False: { visible: true }
  - type: ActivatableUI
    key: enum.PtlUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PtlUiKey.Key:
        type: PtlBoundUserInterface
  - type: Machine
    board: PowerTransmissionLaserMachineCircuitboard
  - type: Ptl
    cycleTimeSeconds: 2
    spesosPerMwPerCycle: 60
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower
  - type: Battery
    startingCharge: 0
    maxCharge: 60000000 # 60 MW
  - type: ExaminableBattery
  - type: PowerNetworkBattery
    canDischarge: false
    maxSupply: 0
    maxChargeRate: 1000000 # 1 MW charge rate
  - type: BatteryCharger
    voltage: High
    node: input
  - type: PowerConsumer
    voltage: High
    node: input
    drawRate: 0
  - type: PowerMonitoringDevice
    group: Substation
    sourceNode: input
    sprite: _Starlight/Structures/Power/ptl.rsi
    state: monitoring_unit
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: HVPower