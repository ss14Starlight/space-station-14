- type: entity
  id: ShadowBorgiFabricator
  parent: Biofabricator
  name: shadow borgi cube fabricator
  description: Produces creatures of evil.
  components:
  - type: Lathe
    idleState: icon
    runningState: building
    staticPacks:
    - ShadowBorgiCubeRecipePack
  - type: MaterialStorage
    ignoreColor: true
    whitelist:
      tags:
      - Sheet
      - Ingot
      - RawMaterial

- type: entity
  abstract: true
  parent: BaseLathe
  id: BaseLatheFuel
  components:
  - type: ReagentSpeed
    solution: fuel
    modifiers:
      WeldingFuel: 0.05
  - type: SolutionContainerManager
    solutions:
      fuel:
        maxVol: 500
  - type: Spillable
    solution: fuel
  - type: RefillableSolution
    solution: fuel
  - type: ExaminableSolution
    solution: fuel

- type: entity
  id: TideLathe
  parent: BaseLatheFuel
  name: tider's anvil
  description: It produces basic items using metal and glass. Has the ability to process blueprints to print new recipes.
  components:
  - type: Sprite
    sprite: Structures/Machines/autolathe.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: AssortedForgeParts
  - type: MaterialStorage
    whitelist:
      tags:
        - TiderAnvilMats
  - type: OreSiloClient
  - type: Lathe
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - TiderAnvilStatic
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container