# For Elves

- type: entity
  parent: [ BaseItem, StorePresetCantrips ]
  id: BookOfCantrips
  name: abridged grimoire
  suffix: Elf
  description: A thin manuscript containing just some of the lesser secrets of the Aielithii.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Misc/books.rsi
      layers:
      - state: cantrips
    - type: UserInterface
      interfaces:
        enum.StoreUiKey.Key:
          type: StoreBoundUserInterface
    - type: ActivatableUI
      key: enum.StoreUiKey.Key
    - type: Store
      refundAllowed: false # get it right the first time
      ownerOnly: true # your life isn't long enough to study these secrets, mortal
      balance:
        WizCoin: 2

- type: entity
  parent: BookOfCantrips
  id: BookOfCantripsDebug
  suffix: Elf, DEBUG
  description: A thin manuscript containing just some of the lesser secrets of Elvenkind. Someone wrote "PROPERTY OF M.A.G.E." on the inside cover.
  components:
    - type: Store
      refundAllowed: true
      ownerOnly: false # For ease of debugging.
      balance:
        WizCoin: 99999

- type: entity
  parent: [ BaseItem, StorePresetMageChromatic, BaseMagicalContraband ]
  id: BookOfChromaticMagic
  name: chromatic grimoire
  suffix: MAGE
  description: This ancient codex shudders slightly with the awesome power its letters contain. How many spells can you memorize before your mind collapses under their weight?
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Misc/books.rsi
      layers:
      - state: chromatic
    - type: UserInterface
      interfaces:
        enum.StoreUiKey.Key:
          type: StoreBoundUserInterface
    - type: ActivatableUI
      key: enum.StoreUiKey.Key
    - type: Store
      refundAllowed: true
      ownerOnly: true
      balance:
        WizCoin: 12

- type: entity
  parent: [ BaseItem, StorePresetMageHigh, BaseMagicalContraband ]
  id: BookOfHighMagic
  suffix: Admeme
  name: codex of high magic
  description: The absolute pinnacle of arcane wisdom. The spells within are so magnificent that anyone could learn them. Even the foulest secrets are among its arsenal. It must never fall into the hands of outsiders.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Misc/books.rsi
      layers:
      - state: high
    - type: Store
      refundAllowed: false
      ownerOnly: false
      balance:
        WizCoin: 99999

- type: entity
  parent: [ BaseItem, StorePresetMageDark, BaseMagicalContraband ]
  id: BookOfDarkMagic
  suffix: Admeme
  name: tome of darkness
  description: Its inky black pages are penned in silver, and bound in the flesh of things of nightmare. To even the most callous and ambitious, it is an unpleasant but necessary evil.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Misc/books.rsi
      layers:
      - state: dark-base
      - state: dark-glow
        shader: unshaded
    - type: Store
      refundAllowed: true
      ownerOnly: true
      balance:
        WizCoin: 12
