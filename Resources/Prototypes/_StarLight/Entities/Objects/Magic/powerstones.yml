# Mages and Sorcerers need either a Rift or a Powerstone to cast magic.
# If using a powerstone, it must be carried on one's person.

- type: entity
  name: portable magic focus
  abstract: true
  parent: [BaseItem, BaseMagicalContraband]
  id: BaseMagicFocus
  components:
  - type: Item
    sprite: _Starlight/Objects/Magic/powerstone.rsi
    size: Small
    layers:
    - state: all
      shader: unshaded
    inhandVisuals:
      left:
      - state: inhand-left
        shader: unshaded
      right:
      - state: inhand-right
        shader: unshaded
  - type: Sprite
    sprite: _Starlight/Objects/Magic/powerstone.rsi
    layers:
    - state: all
      shader: unshaded

- type: entity
  name: aethyric powerstone
  abstract: true
  parent: BaseMagicFocus
  id: BasePowerstone
  description: A bizarre fragment of frozen magic
  components:
  - type: PointLight
    radius: 4
    energy: 3
    color: "#44FF00"
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
  - type: EmitSoundOnSpawn
    sound: 
      path: /Audio/_Starlight/Magic/cantrip.ogg

- type: entity
  name: warpstone crystal
  parent: BasePowerstone
  id: Powerstone
  description: A bizarre fragment of frozen magic - extremely dangerous!
  components:
  - type: PointLight
    radius: 8 # light is brighter when case is broken
    energy: 3
    color: "#44FF00" # exclusively in slime green
  - type: AmbientSound
    range: 5
    volume: -5
    sound:
      path: /Audio/_Starlight/Magic/power_rift.ogg
  - type: StaticPrice
    price: 10000 # NanoTrasen REALLY wants this
  - type: RadiationSource
    intensity: 7 # as hot as a broken nuclear reactor

- type: entity
  name: arcane focus
  parent: BasePowerstone
  id: PowerstoneCase
  description: A bizarre fragment of frozen magic in a fragile case
  components:
  - type: Item
    sprite: _Starlight/Objects/Magic/powerstone.rsi
    size: Small
    layers:
    - state: all-benign
      shader: unshaded
    inhandVisuals:
      left:
      - state: inhand-left
        shader: unshaded
      right:
      - state: inhand-right
        shader: unshaded
  - type: Sprite
    sprite: _Starlight/Objects/Magic/powerstone.rsi
    layers:
    - state: all-benign
      shader: unshaded
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          Powerstone:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    damage:
      types:
        Blunt: 5
  - type: Damageable
    damageContainer: Inorganic
  - type: PhysicalComposition
    materialComposition:
      Glass: 0
  - type: StaticPrice
    price: 12000 # NanoTrasen wants this even more

# Bad guys get a different case, for cheaper:

