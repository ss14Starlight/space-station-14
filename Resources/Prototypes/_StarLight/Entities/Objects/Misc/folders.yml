- type: entity
  id: BoxFolderNanoTrasenClipboard
  parent: BoxFolderClipboard
  name: NanoTrasen clipboard
  description: A stylish clipboard in NanoTrasen colors.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Misc/nt-clipboard.rsi
      layers:
        - state: clipboard
        - state: clipboard_paper
          map: ["clipboard_paper"]
          visible: false
        - state: clipboard_pen
          map: ["clipboard_pen"]
          visible: false
        - state: clipboard_over
    - type: Item
      sprite: _Starlight/Objects/Misc/nt-clipboard.rsi
    - type: Clothing
      sprite: _Starlight/Objects/Misc/nt-clipboard.rsi
    - type: StorageFill
      contents:
        - id: Paper
          amount: 20

- type: entity
  id: BoxFolderHoPClipboard
  parent: [BoxFolderClipboard, BaseGrandTheftContraband]
  name: Bureaucratic Digi-Board
  description: A bulky electric clipboard, filled with bureaucracy. Contains a portable ID card computer. Vulnerable to assistants.
  components:
  - type: Sprite
    sprite: _Starlight\Objects\Misc\HOP_Clipboard.rsi
    layers:
    - state: hop_clipboard
    - state: qm_clipboard_paper
      map: ["qm_clipboard_paper"]
      visible: false
    - state: qm_clipboard_pen
      map: ["qm_clipboard_pen"]
      visible: false
    - state: qm_clipboard_over
  - type: ItemSlots
    slots:
      pen_slot:
        name: clipboard-slot-component-slot-name-pen
        whitelist:
          tags:
          - Write
        insertOnInteract: true
  - type: Item
    sprite: _Starlight\Objects\Misc\HOP_Clipboard.rsi
    size: Normal
  - type: Clothing
    sprite: _Starlight\Objects\Misc\HOP_Clipboard.rsi
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,4,3
    quickInsert: true
  - type: StorageFill
    contents:
      - id: Paper
        prob: 1
      - id: Paper
        prob: 1
      - id: Paper
        prob: 1
      - id: Paper
        prob: 1
      - id: Paper
        prob: 1
      - id: Paper
        prob: 1
      - id: Paper
        prob: 1
      - id: Paper
        prob: 1
  - type: IdCardConsole
    privilegedIdSlot:
      name: id-card-clipboard-priviliged-id
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - IdCard
    targetIdSlot:
      name: id-card-clipboard-target-id
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - IdCard
  - type: ActivatableUI
    key: enum.IdCardConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.IdCardConsoleUiKey.Key:
        type: IdCardConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ItemMapper
    mapLayers:
      qm_clipboard_paper:
        whitelist:
          tags:
          - Document
      qm_clipboard_pen:
        whitelist:
          tags:
          - Write
  - type: MeleeWeapon
    damage:
      types:
        Slash: 10
  - type: Tag
    tags:
    - Folder
    - HighRiskItem
  - type: StealTarget
    stealGroup: HoPBoardSteal
