- type: entity
  id: UxnChip
  name: UXN programming chip
  parent: BaseItem
  description: This little bundle of chips is able to run UXN assembly by scanning papers.
  components:
    - type: Sprite
      sprite: Objects/Misc/potatoai_chip.rsi
      state: icon
    - type: Item
      size: Tiny
    - type: Construction
      graph: UxnChip
      node: uxnchip
    - type: Uxn
    - type: GuideHelp
      guides:
      - Uxn
    - type: DeviceNetwork
      transmitFrequencyId: UxnChipNetwork
      receiveFrequencyId: UxnChipNetwork
      examinableAddress: true # so you can hard-code IDs into rom for networking.
    - type: WirelessNetworkConnection #WHY is this a seperate NAME GRAH I WANNA SHOOT SOMEONE
      range: 16 #tile radius they can communicate.

- type: entity
  id: UxnChipIncomplete
  name: Incomplete UXN programming chip
  parent: BaseItem
  description: Some assembly required
  components:
    - type: Sprite
      sprite: Objects/Misc/potatoai_chip.rsi
      state: icon
    - type: Item
      size: Tiny
    - type: Construction
      graph: UxnChip
      node: uxnchippartial