- type: entity
  parent: [ BoxCardboard, BaseBagOpenClose ]
  id: CardBoxBase
  abstract: true
  name: Card Box
  categories: [HideSpawnMenu]
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _Starlight/Objects/Fun/cards.rsi
    state: box
    layers:
    - state: black_box
    - state: black_box_open
      map: [ "openLayer" ]
      visible: false
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,1,1
    whitelist:
      components:
      - PlayingCardDeck
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
          - id: CardDeckBase
  - type: Appearance

- type: entity
  parent: BaseItem
  id: CardHandBase
  name: Card hand
  categories: [HideSpawnMenu]
  components:
  - type: Item
    size: Small
  - type: PlayingCardHand
  - type: PlayingCardStack
  - type: Sprite
    sprite: _Starlight/Objects/Fun/cards.rsi
    state: singlecard_down_black
  - type: UserInterface
    interfaces:
      enum.CardUiKey.Key:
        type: PlayingCardHandMenuBoundUserInterface
  - type: ActivatableUI
    key: enum.CardUiKey.Key

- type: entity
  parent: BaseItem
  id: CardDeckBase
  name: deck of cards
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Fun/cards.rsi
    state: deck_black_full
  - type: Item
    size: Normal
  - type: PlayingCardDeck
  - type: PlayingCardStack

- type: entity
  parent: CardBoxBase
  id: CardBoxBlack
  name: black deck case
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _Starlight/Objects/Fun/cards.rsi
    state: box
    layers:
    - state: black_box
    - state: black_box_open
      map: [ "openLayer" ]
      visible: false
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
          - id: CardDeckBlack

- type: entity
  parent: CardBoxBase
  id: CardBoxSyndicate
  name: syndicate deck case
  components:
    - type: Item
      size: Small
    - type: Sprite
      sprite: _Starlight/Objects/Fun/cards.rsi
      state: box
      layers:
        - state: syndicate_box
        - state: syndicate_box_open
          map: [ "openLayer" ]
          visible: false
    - type: EntityTableContainerFill
      containers:
        storagebase: !type:AllSelector
          children:
            - id: CardDeckSyndicate

- type: entity
  parent: CardBoxBase
  id: CardBoxNanotrasen
  name: nanotrasen deck case
  components:
    - type: Item
      size: Small
    - type: Sprite
      sprite: _Starlight/Objects/Fun/cards.rsi
      state: box
      layers:
        - state: nanotrasen_box
        - state: nanotrasen_box_open
          map: [ "openLayer" ]
          visible: false
    - type: EntityTableContainerFill
      containers:
        storagebase: !type:AllSelector
          children:
            - id: CardDeckNanotrasen

