- type: entity
  parent: BaseItem
  id: CardBase
  name: Card
  categories: [ HideSpawnMenu ]
  components:
  - type: EmitSoundOnLand
    sound:
      collection: cardShove
  - type: Sprite
    sprite: _Starlight/Objects/Fun/cards.rsi
    state: singlecard_down_black
  - type: Rotatable
  - type: Item
    size: Small
  - type: UseDelay
    delay: 0.5
  - type: PlayingCard
    backSpriteLayers:
    - sprite: _Starlight/Objects/Fun/cards.rsi
      state: singlecard_down_black
    flipped: true

