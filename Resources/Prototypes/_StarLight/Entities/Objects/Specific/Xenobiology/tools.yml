- type: entity
  name: slime extract bag
  id: SlimeExtractBag
  parent: BaseStorageItem
  description: A bag for greedy xenobiologists to store unreasonable amounts of extracts.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Specific/Hydroponics/Equipment/plant_bag.rsi # TODO: Replace with unique sprite
      state: icon
    - type: Item
      storedRotation: -90
    - type: Clothing
      quickEquip: false
      slots:
        - belt
    - type: Storage
      grid:
        - 0,0,10,10
      maxItemSize: Tiny
      quickInsert: true
      areaInsert: true
      whitelist:
        components:
          - SlimeExtract
    - type: Dumpable

- type: entity
  name: handheld slime scanner
  id: HandheldSlimeScanner
  parent: BaseItem
  description: A hand-held scanner for collecting information on slimes.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Specific/Xenobiology/test_slime_analyzer.rsi
      state: icon
    - type: SlimeScanner

- type: entity
  name: Xenobiology Console Camera Tagger
  id: XenobiologyConsoleCameraTagger
  parent: BaseItem
  description: Can tag any camera to register it to the xenobiology network. Spy on slimes further away, or even your neighbors!
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Specific/Xenobiology/test_camera_tagger.rsi
      state: icon
    - type: XenobiologyConsoleCameraTagger

- type: entity
  parent: [Clothing, ContentsExplosionResistanceBase]
  id: ClothingXenobiologyClawpack
  name: xenobiology clawpack
  description: A backpack with a claw. Revolutionary! The claw has been designed to manipulate slimes and monkeys. Unfortunately, the claw leaves no room for other items.
  components:
    - type: Sprite
      sprite: Clothing/Back/Backpacks/backpack.rsi
      state: icon
    - type: Item
      size: Huge
    - type: Clothing
      quickEquip: false
      slots:
        - back
    - type: SwitchableEquipMode # Starlight
    - type: ExplosionResistance
      damageCoefficient: 0.9
    - type: Tag
      tags:
        - WhitelistChameleon
        - Backpack
    - type: Clawpack
      itemPrototype: XenobiologyClaw
      action: ClawpackActivateClaw

- type: entity
  parent: BaseItem
  id: XenobiologyClaw
  name: xenobiology claw
  description: It's just a claw.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Specific/Xenobiology/clawpack.rsi
      state: icon
    - type: Claw
      clawInteractionRange: 5.0
      allowedEntities:
        tags:
          - XenobiologyClawGrabbable

- type: Tag
  id: XenobiologyClawGrabbable