- type: entity
  name: golden beaker
  parent: BaseBeaker
  description: Used to contain a moderate amount of chemicals and solutions.
  id: GoldenBeaker
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Chemistry/beaker.rsi
    layers:
      - state: beaker
      - state: beaker1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: Item
    sprite: _Starlight/Objects/Specific/Chemistry/beaker.rsi
  - type: Spillable
    solution: beaker
  - type: StaticPrice
    price: 10
  - type: PhysicalComposition
    materialComposition:
      Glass: 50
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: beaker
    inHandsMaxFillLevels: 3
    inHandsFillBaseName: -fill-
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 200

- type: entity
  id: VialCase
  parent: [ BaseStorageItem, BaseBagOpenClose ]
  name: vial case
  description: A convenient, compact box with 6 empty vials.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Chemistry/vial_case.rsi
    layers:
    - state: closed
      map: ["closeLayer"]
    - state: open
      map: ["openLayer"]
    - state: vial1
      map: ["vial1"]
      visible: false
    - state: vial2
      map: ["vial2"]
      visible: false
    - state: vial3
      map: ["vial3"]
      visible: false
    - state: vial4
      map: ["vial4"]
      visible: false
    - state: vial5
      map: ["vial5"]
      visible: false
    - state: vial6
      map: ["vial6"]
      visible: false
  - type: Storage
    grid:
    - 0,0,2,1
  - type: Item
    sprite: Objects/Consumable/Smokeables/vials/case.rsi
    size: Small
    shape:
    - 0,0,1,1
    storedRotation: 90
  - type: StorageFill
    contents:
    - id: BaseChemistryEmptyVial
      amount: 6
  - type: ItemCounter
    count:
      tags: [Vial]
    composite: true
    layerStates:
    - vial1
    - vial2
    - vial3
    - vial4
    - vial5
    - vial6
  - type: Appearance

- type: entity
  id: BorgRegenerativeSyringeBase
  name: regenerative syringe
  parent: BaseItem # Inherits from BaseItem to avoid Spillable/TrashOnSolutionEmpty from BaseSyringe
  abstract: true
  description: An integrated syringe for a cyborg that automatically regenerates its contents.
  components:
    - type: Sprite
      sprite: Objects/Specific/Chemistry/syringe.rsi
      layers:
        - state: syringe1
          map: ["enum.SolutionContainerLayers.Fill"]
          visible: false
        - state: syringe_base0
          map: ["enum.SolutionContainerLayers.Base"]
    - type: Icon
      sprite: Objects/Specific/Chemistry/syringe.rsi
      state: "syringe_base0"
    - type: Item
      size: Tiny
      sprite: Objects/Specific/Chemistry/syringe.rsi
    - type: SolutionContainerManager
      solutions:
        injector:
          maxVol: 50
    - type: Injector
      transferAmount: 15
      injectOnly: true
      onlyAffectsMobs: true
      autoToggle: false
      toggleState: Inject
      delay: 2.0
    - type: ExaminableSolution
      solution: injector
    - type: Appearance
    - type: SolutionContainerVisuals
      maxFillLevels: 2
      fillBaseName: syringe
      inHandsMaxFillLevels: 3
      inHandsFillBaseName: -fill-
    - type: Tag
      tags:
        - Syringe

- type: entity
  id: BorgSyringeTricordrazineRegenerative
  name: regenerative tricordrazine syringe
  parent: BorgRegenerativeSyringeBase
  description: An integrated syringe for a cyborg that automatically regenerates Tricordrazine.
  components:
    - type: SolutionRegeneration
      solution: injector
      generated:
        reagents:
          - ReagentId: Tricordrazine
            Quantity: 0.5 # 30u per minute

- type: entity
  id: BorgSyringeInaprovalineRegenerative
  name: regenerative inaprovaline syringe
  parent: BorgRegenerativeSyringeBase
  description: An integrated syringe for a cyborg that automatically regenerates Inaprovaline.
  components:
    - type: SolutionRegeneration
      solution: injector
      generated:
        reagents:
          - ReagentId: Inaprovaline
            Quantity: 0.25 # 15u per minute