- type: entity
  id: BaseBorgModuleSecurity
  parent: BaseBorgModule
  abstract: true
  components:
  - type: Tag
    tags:
    - BorgModuleSecurity
  - type: Item
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#FF0000"
      - state: base-module-inhand-left
        color: "#753186"
      - state: base-part-inhand-left
      - state: base-stripes-inhand-left
        color: "#404040"
      right:
      - state: base-icon-inhand-right
        color: "#FF0000"
      - state: base-module-inhand-right
        color: "#753186"
      - state: base-part-inhand-right
      - state: base-stripes-inhand-right
        color: "#404040"

- type: entity
  id: BorgModulePursuit
  parent: [ BaseBorgModuleSecurity, BaseProviderBorgModule ]
  name: pursuit cyborg module
  components:
  - type: Sprite
    layers:
    - state: security
    - state: icon-pen
  - type: ItemBorgModule
    items:
    - StunBite
    - BorgFlash
    - HoloprojectorSecBorg
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: cleaning-module }

- type: entity
  id: BorgModuleAdvancedForensics
  parent: [ BaseBorgModuleSecurity, BaseProviderBorgModule ]
  name: advanced forensics cyborg module
  components:
  - type: Sprite
    layers:
    - state: security
    - state: icon-pen
  - type: ItemBorgModule
    items:
    - ForensicScanner
    - GasAnalyzer
    - HandLabeler
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: cleaning-module }

- type: entity
  id: BorgModuleSearchAndRescue
  parent: [ BaseBorgModuleMedical, BaseProviderBorgModule ]
  name: search and rescue cyborg module
  components:
  - type: Sprite
    layers:
    - state: medical
    - state: icon-treatment
  - type: ItemBorgModule
    items:
    - BorgMedipen
    - BorgBottleMedipen
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: cleaning-module }