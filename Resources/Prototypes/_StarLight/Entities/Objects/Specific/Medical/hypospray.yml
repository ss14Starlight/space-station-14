- type: entity
  name: miniature hypospray # Get Happy or Faush to have this thing take vials.
  parent: [BaseItem, BaseSecurityContraband]
  description: A compact sterile spray for rapid chemical injection in combat situations. Accepts miniature vials.
  id: BrigHypo
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/hypospray.rsi
    state: hypo
  - type: Item
    sprite: _Starlight/Objects/Specific/Medical/hypospray.rsi
    size: Tiny
  - type: UseDelay
    delay: 0.5
  - type: StaticPrice
    price: 750
  - type: ItemSlots
    slots:
      vial_slot:
        name: miniature-hypospray-vial-slot-name
        whitelist:
          tags:
            - Vial
          components:
            - SolutionContainerManager
          requireAll: true
  - type: ContainerContainer
    containers:
      vial_slot: !type:ContainerSlot
  - type: ExternalContainerInjector
    onlyAffectsMobs: false
    vialSlotId: vial_slot
    vialSolutionName: beaker

- type: entity #Of fucking course speed is hardcoded. You know the drill.
  name: hypoinjector
  parent: [BaseSyringe, BaseMedicalContraband]
  description: A sterile discount hypospray for rapid chemical injection.
  id: FastSyringe
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/hypospray.rsi
    state: hypo
  - type: Item
    sprite: _Starlight/Objects/Specific/Medical/hypospray.rsi
    size: Tiny
  - type: Injector
    transferAmount: 15
    toggleState: Draw
    delay: 30.0
    delayPerVolume: 0.05
  - type: Tag
    tags:
    - Syringe
    - Trash