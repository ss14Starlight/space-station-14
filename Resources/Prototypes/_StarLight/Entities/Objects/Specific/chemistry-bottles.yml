- type: entity
  name: reinforced bottle
  parent: BaseChemistryEmptyBottle
  id: EmptyBottleReinforced
  description: A round, explosion proof bottle.
  components:
  - type: PhysicalComposition
    materialComposition:
      ReinforcedGlass: 25
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Chemistry/reinforced_bottle.rsi
    layers:
    - state: bottle-1
    - state: bottle-1-1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Appearance
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 60
  - type: SolutionTransfer
    maxTransferAmount: 60
    canChangeTransferAmount: true
  - type: Item
    size: Tiny
    sprite: _Starlight/Objects/Specific/Chemistry/reinforced_bottle.rsi
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:SpillBehavior { }
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 5
        transferForensics: true
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 10
  - type: DnaSubstanceTrace