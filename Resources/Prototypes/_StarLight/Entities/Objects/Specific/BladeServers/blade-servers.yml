- type: entity
  abstract: true
  parent: BaseItem
  id: BaseConstructibleBladeServer
  components:
  - type: BladeServer
  - type: Sprite
    sprite: _Starlight/Structures/Machines/blade_server.rsi
    layers:
    - state: frame
    - state: stripe
      visible: false
      map: [ "enum.BladeServerVisuals.StripeLayer" ]
    - state: cover
    - state: powered
      visible: false
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - state: maintenance-panel
      visible: false
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: InnerCableReceiver
  - type: Construction
    graph: BladeServer
    node: bladeServer
    containers:
    - machine_parts
    - machine_board
  - type: Item
    size: Large
    sprite: _Starlight/Structures/Machines/blade_server.rsi
    inhandVisuals:
      left:
      - state: inhand
      - state: inhand-stripe
        visible: false
        map: [ "enum.BladeServerVisuals.StripeLayer" ]
      right:
      - state: inhand
      - state: inhand-stripe
        visible: false
        map: [ "enum.BladeServerVisuals.StripeLayer" ]
  - type: Speech
    speechVerb: Robotic
  - type: TypingIndicator
    proto: robot
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2

- type: entity
  parent: BaseConstructibleBladeServer
  id: HologramBladeServer
  name: hologram blade server
  description: A blade server for storing holographic projection data. Requires both a brain chip and body chip to function.
  components:
  - type: BladeServer
    stripeColor: "#4cc9f0"
  - type: InnerCableReceiver
  - type: ExtensionCableReceiver
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: Machine
    board: HologramServerMachineCircuitboard
  - type: ItemSlots
    slots:
      hologram_brain_chip:
        name: Brain Chip
        whitelist:
          tags:
            - HologramBrainChip
      hologram_body_chip:
        name: Body Chip
        whitelist:
          tags:
            - HologramBodyChip
  - type: ContainerContainer
    containers:
      hologram_brain_chip: !type:ContainerSlot
      hologram_body_chip: !type:ContainerSlot
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: HologramBladeServer
    brainChipSlot: hologram_brain_chip
    bodyChipSlot: hologram_body_chip
    isPowered: true
  - type: MindContainer
  - type: Tag
    tags:
      - HologramDisk

- type: entity
  parent: HologramBladeServer
  id: HologramBladeHoloCorgi
  name: hologram blade server (holo corgi)
  description: A blade server for storing holographic projection data. Requires both a brain chip and body chip to function. Contains a Holo Corgi.
  components:
  - type: ItemSlots
    slots:
      hologram_brain_chip:
        name: Brain Chip
        whitelist:
          tags:
            - HologramBrainChip
        startingItem: HologramBrainChip  # Empty brain chip
      hologram_body_chip:
        name: Body Chip
        whitelist:
          tags:
            - HologramBodyChip
        startingItem: HologramBodyChipCorgi  # Pre-programmed corgi chip

