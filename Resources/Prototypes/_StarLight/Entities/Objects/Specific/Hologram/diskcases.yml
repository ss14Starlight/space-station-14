- type: entity
  parent: BriefcaseBaseSecure
  id: HolographicBriefcase
  name: holographic briefcase
  description: A portable hologram projection system in a secure briefcase. Requires power to project holograms.
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Devices/holographic_breifcase.rsi
      noRot: true
      layers:
        - state: closed
          map: ["base"]
        - state: screen
          visible: false
          map: ["screen"]
        - sprite: _Starlight/Structures/Machines/blade_server.rsi
          state: inhand
          visible: false
          map: ["blade"]
    - type: GenericVisualizer
      visuals:
        enum.HologramBriefcaseVisuals.State:
          base:
            Closed: { state: closed }
            Open: { state: open }
            Active: { state: open }
          screen:
            Closed: { visible: false }
            Open: { visible: true }
            Active: { visible: true }
        enum.HologramBriefcaseVisuals.HasBlade:
          blade:
            True: { visible: true }
            False: { visible: false }
    - type: Appearance
    - type: Item
      sprite: _Starlight/Objects/Storage/Briefcases/briefcase_secure.rsi
      size: Huge
    - type: AccessReader
      access: [["ResearchDirector"]]
    - type: ActivatableUI
      key: enum.HologramConsoleUiKey.Key 
      # I gotta split this into a second UI, making both work with if statements is killing me
      inHandsOnly: false
    - type: ActivatableUIRequiresAccess
    - type: HologramConsole
      maxActiveHolograms: 2
      allowHologramCarry: false
      powerDrawPerHologram: 50
      searchRange: 0 # Don't search for servers in portable mode
      bladeServerScanRange: 15 # Scan for blade servers
      showMap: false
    - type: HologramProjector
      projectorRange: 5.0
    - type: ContainerContainer
      containers:
        cell_slot: !type:ContainerSlot
        blade_server_slot: !type:ContainerSlot
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellMedium
        blade_server_slot:
          name: Blade Server
          whitelist:
            components:
              - BladeServer
          insertOnInteract: true
          ejectOnInteract: false
          ejectOnBreak: true
    - type: PowerCellSlot
      cellSlotId: cell_slot
    - type: UserInterface
      interfaces:
        enum.DigitalLockUiKey.Key:
          type: DigitalLockBoundUserInterface
        enum.HologramConsoleUiKey.Key:
          type: HologramConsoleBoundUserInterface
    - type: AmbientSound
      enabled: false
      volume: -8
      range: 8
      sound:
        path: /Audio/Ambience/Objects/server_fans.ogg
