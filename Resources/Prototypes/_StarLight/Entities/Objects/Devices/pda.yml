- type: entity
  parent: BasePDA
  id: RoboticistPDA
  name: roboticist PDA
  description: Covered in dirt and oil. The screen is covered in something sticky.
  components:
  - type: Pda
    id: RoboticistIDCard
  - type: Appearance
    appearanceDataInit:
     enum.PdaVisuals.PdaType:
       !type:String
       pda-roboticist
  - type: PdaBorderColor
    borderColor: "#363636"
    accentVColor: "#d33725"
  - type: Icon
    state: pda-roboticist
  - type: HealthAnalyzer
    scanningEndSound:
      path: "/Audio/Items/Medical/healthscanner.ogg"
    damageContainers:
    - Silicon

