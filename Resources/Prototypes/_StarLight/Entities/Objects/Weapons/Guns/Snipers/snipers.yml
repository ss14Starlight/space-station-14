- type: entity
  name: Makeshift Repeater Rifle
  parent: [BaseWeaponSniper, BaseMinorContraband]
  id: WeaponSniperMakeshift
  description: It'll blow a hole in the guy you point this at, if it doesn't snap your wrist first.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/makeshift_rifle.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/makeshift_rifle.rsi
  - type: Item
    size: Normal # Small, but can't fit in your pocket.
  - type: Gun
    fireRate: 1
    minAngle: 10
    maxAngle: 20
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
  - type: KnockbackByUserTag
    doestContain:
      Resomi:
        knockback: 1.5
      Felionoid:
        knockback: 0.5
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgeLightRifle
      - CartridgeLightRifleImprovised
    capacity: 2
    proto: null
  - type: WeaponDismantleOnShoot
    dismantleChance: 0.40
    selfDamage:
      types:
        Blunt: 10
        Heat: 10
    items:
      - id: ModularBarrel
        launchAngle: 0
        prob: 1
      - id: ModularReceiver
        launchAngle: 90
        prob: 0.10
      - id: RifleStock
        launchAngle: 180
        prob: 0.80
  - type: Construction
    graph: MakeshiftSniperGraph
    node: shotgun

- type: entity
  name: Improvised Repeater Rifle
  parent: WeaponSniperMakeshift
  id: WeaponSniperImprovised
  description: Can ALMOST reliably hit a target!
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/improvised_rifle.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/improvised_rifle.rsi
  - type: Item
    size: Large
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -5
    maxAngle: -10
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: BallisticAmmoProvider
    capacity: 4
  - type: WeaponDismantleOnShoot
    dismantleChance: 0.20
    items:
      - id: ModularBarrel
        launchAngle: 0
        prob: 1
      - id: ModularReceiver
        launchAngle: 90
        prob: 0.10
      - id: SheetSteel1
        launchAngle: 67
        prob: 0.20
      - id: SheetSteel1
        launchAngle: 87
        prob: 0.20
      - id: SheetSteel1
        launchAngle: 270
        prob: 0.20
      - id: RifleStock
        launchAngle: 180
        prob: 0.80
  - type: Construction
    graph: ImprovisedSniperGraph
    node: shotgun


- type: entity
  name: Forged Repeater Rifle
  parent: WeaponSniperMakeshift
  id: WeaponSniperForged
  description: The best a tider can achive, reliable fire-rate and accuracy with a satisfying lever-action system. What more can you ask for?
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/forged_rifle.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/forged_rifle.rsi
  - type: Item
    size: Huge
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -8
    maxAngle: -15
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: BallisticAmmoProvider
    capacity: 8
  - type: WeaponDismantleOnShoot
    dismantleChance: 0

- type: entity
  name: Lenord Enfield
  parent: [BaseWeaponSniper, BaseGunWieldable, BaseMajorContraband] # Starlight
  id: WeaponSniperEnfield
  description: A weapon of the masses, a true relic. Lenord Enfliekd has served in nearly every armed conflict since its creation 733 years ago. The bolt-action design of the rifle remains virtually identical to its original design, whether used for hunting, sniping, or endless trench warfare. Uses .45 magnum ammo.
  components:
  - type: KnockbackByUserTag
    doestContain:
      Resomi:
        knockback: 2
      Felionoid:
        knockback: 1 #half of what resomi take
  - type: BallisticAmmoProvider # Starlight
    capacity: 8
    proto: CartridgeMagnumSP
    whitelist:
      tags:
        - CartridgeMagnum
    soundRack:
      path: /Audio/_Starlight/Weapons/Guns/Cock/cycle_bolt.ogg
      params:
        variation: 0.146
  - type: Gun
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/mosin.ogg # Starlight
      params:
        variation: 0.246
    pump: true
    fireRate: 1.5
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/historic/enfield.rsi
  - type: GunRequiresWield

- type: entity
  name: Lenord Enfield Mark II
  parent: [BaseWeaponSniper, BaseGunWieldable, BaseMajorContraband] # Starlight
  id: WeaponSniperEnfieldUpgraded
  description: A direct upgrade from the base Lenord Enfield, fitted with semi-auto capabilities, higher capacity, and an improved firerate.
  components:
  - type: KnockbackByUserTag
    doestContain:
      Resomi:
        knockback: 2
      Felionoid:
        knockback: 1 #half of what resomi take
  - type: BallisticAmmoProvider # Starlight
    capacity: 12
    proto: CartridgeMagnumSP
    whitelist:
      tags:
        - CartridgeMagnum
    soundRack:
      path: /Audio/_Starlight/Weapons/Guns/Cock/cycle_bolt.ogg
      params:
        variation: 0.146
  - type: Gun
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/mosin.ogg # Starlight
      params:
        variation: 0.246
    fireRate: 2
    pump: false
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/historic/enfield.rsi
  - type: GunRequiresWield