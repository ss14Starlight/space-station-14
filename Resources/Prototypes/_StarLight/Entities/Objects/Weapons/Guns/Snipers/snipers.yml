- type: entity
  name: Makeshift Repeater Rifle
  parent: [BaseWeaponSniper, BaseMinorContraband]
  id: WeaponSniperMakeshift
  description: It'll blow a hole in the guy you point this at, if it doesn't snap your wrist first.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/makeshift_rifle.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/makeshift_rifle.rsi
  - type: Item
    size: Normal # Small, but can't fit in your pocket.
  - type: Gun
    fireRate: 1
    minAngle: 10
    maxAngle: 20
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
  - type: KnockbackByUserTag
    doestContain:
      Resomi:
        knockback: 1.5
      Felionoid:
        knockback: 0.5
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgeLightRifle
      - CartridgeLightRifleImprovised
    capacity: 2
    proto: null
  - type: WeaponDismantleOnShoot
    dismantleChance: 0.40
    selfDamage:
      types:
        Blunt: 10
        Heat: 10
    items:
      - id: ModularBarrel
        launchAngle: 0
        prob: 1
      - id: ModularReceiver
        launchAngle: 90
        prob: 0.10
      - id: RifleStock
        launchAngle: 180
        prob: 0.80
  - type: Construction
    graph: MakeshiftSniperGraph
    node: shotgun

- type: entity
  name: Improvised Repeater Rifle
  parent: WeaponSniperMakeshift
  id: WeaponSniperImprovised
  description: Can ALMOST reliably hit a target!
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/improvised_rifle.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/improvised_rifle.rsi
  - type: Item
    size: Large
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -5
    maxAngle: -10
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: BallisticAmmoProvider
    capacity: 4
  - type: WeaponDismantleOnShoot
    dismantleChance: 0.20
    items:
      - id: ModularBarrel
        launchAngle: 0
        prob: 1
      - id: ModularReceiver
        launchAngle: 90
        prob: 0.10
      - id: SheetSteel1
        launchAngle: 67
        prob: 0.20
      - id: SheetSteel1
        launchAngle: 87
        prob: 0.20
      - id: SheetSteel1
        launchAngle: 270
        prob: 0.20
      - id: RifleStock
        launchAngle: 180
        prob: 0.80
  - type: Construction
    graph: ImprovisedSniperGraph
    node: shotgun


- type: entity
  name: Forged Repeater Rifle
  parent: WeaponSniperMakeshift
  id: WeaponSniperForged
  description: The best a tider can achive, reliable fire-rate and accuracy with a satisfying lever-action system. What more can you ask for? Is fitted to be able to chamber both .35 / .45
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/forged_rifle.rsi
  - type: Clothing
    sprite: _Starlight/Objects/Weapons/Guns/Snipers/forged_rifle.rsi
  - type: Item
    size: Huge
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -8
    maxAngle: -15
  - type: Gun
    fireRate: 1.5 #Should allow for more intuitive cycling while still being balanced, as a lever action's RoF is determined on how fast you can cycle.
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: BallisticAmmoProvider
    capacity: 8
    whitelist:
      tags:
      - CartridgeLightRifle
      - CartridgeLightRifleImprovised
      - CartridgeMagnum
      - CartridgeMagnumImprovised
  - type: WeaponDismantleOnShoot
    dismantleChance: 0

- type: entity
  name: Mark 1 Rifle
  parent: [BaseWeaponSniper, BaseGunWieldable, BaseSecuritySalvageContraband]
  id: WeaponRifleMark1
  description: A very old Mark 1 Rifle used in many old wars. Someone managed to find one out of a museum or something, with the date of production scratched out from usage... but the NT logo is very new.
  components:
  - type: KnockbackByUserTag
    doestContain:
      Resomi:
        knockback: 2
      Felionoid:
        knockback: 1
  - type: BallisticAmmoProvider
    capacity: 10
    proto: CartridgeMagnumSP
    whitelist:
      tags:
        - CartridgeMagnum
        - CartridgeLightRifle
    soundRack:
      path: /Audio/_Starlight/Weapons/Guns/Cock/mark1_cycle_bolt.ogg
      params:
        variation: 0.05
  - type: Gun
    minAngle: 10
    maxAngle: 40
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/mark1.ogg
      params:
        variation: 0.246
    pump: true
    fireRate: .75
  - type: Sprite
    sprite: /Textures/_Starlight/Objects/Weapons/Guns/Snipers/mark1_rifle.rsi
  - type: Clothing
    sprite: /Textures/_Starlight/Objects/Weapons/Guns/Snipers/mark1_rifle.rsi
    slots:
      - Back
      - suitStorage
  - type: Item
    size: Large
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -5
    maxAngle: -10
  - type: GunRequiresWield
  - type: StaticPrice
    price: 500

