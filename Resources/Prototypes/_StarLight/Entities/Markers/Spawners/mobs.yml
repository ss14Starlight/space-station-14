- type: entity
  name: Clown Corgi Spawner
  id: SpawnMobClownCorgi
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - state: green
        - sprite: _Starlight/Mobs/Pets/corgi.rsi
          state: clown_ian_dead
        - state: ai
    - type: ConditionalSpawner
      prototypes:
        - MobCorgiClownIan

- type: entity
  name: smart subwoofer borgi spawner
  id: SpawnSmartSubwoofer
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - state: green
        - state: ai
    - type: ConditionalSpawner
      prototypes:
        - SmartSubwooferBorgiChassis

- type: entity
  name: Cargorilla Spawner
  id: SpawnMobCargorilla
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - state: green
        - sprite: Mobs/Animals/gorilla.rsi
          state: cargo_crawling
        - state: ai
    - type: ConditionalSpawner
      prototypes:
        - MobCargorilla

- type: entity
  name: Eeeplet Spawner
  id: SpawnMobEeeplet
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: green
    - state: eeeplet
      sprite: _Starlight/Mobs/Aliens/eeeplet.rsi
    - state: eeeplet_glow
      sprite: _Starlight/Mobs/Aliens/eeeplet.rsi
  - type: ConditionalSpawner
    prototypes:
    - MobEeeplet

- type: entity
  id: SpawnPointGhostEeeplet
  name: ghost role spawn point
  suffix: eeeplet
  categories: [ HideSpawnMenu, Spawner ]
  parent: MarkerBase
  components:
  - type: GhostRole
    name: ghost-role-information-eeeplet-name
    description: ghost-role-information-eeeplet-desc
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: MobEeeplet
  - type: Sprite
    layers:
    - state: green
    - state: eeeplet
      sprite: _Starlight/Mobs/Aliens/eeeplet.rsi
    - state: eeeplet_glow
      sprite: _Starlight/Mobs/Aliens/eeeplet.rsi

- type: entity
  name: Gray Xenobiology Slime Spawner
  id: SpawnGrayXenobiologySlime
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - state: green
        - sprite: _Starlight/Mobs/XenoSlimes/test_sprite.rsi
          state: test_slime
        - state: ai
    - type: ConditionalSpawner
      prototypes:
        - XenobiologySlimeGray
