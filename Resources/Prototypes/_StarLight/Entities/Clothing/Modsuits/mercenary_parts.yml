# SVS Vanguard MKI Prototype - Chestplate
- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterVanguardPressureSuit
  name: SVS 'vanguard' MKI prototype chestplate
  suffix: prototype
  description: An experimental military-grade combat suit prototype featuring integrated energy dome technology. The first of its kind, combining advanced defensive systems with cutting-edge shield projection.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/OuterClothing/Modsuits/MODSUITMercenary.rsi
    state: chestplate-sealed
  - type: Clothing
    sprite: _Starlight/Clothing/OuterClothing/Modsuits/MODSUITMercenary.rsi
    equipDelay: 5
    unequipDelay: 5
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
  - type: Tag
    tags:
    - ClothMade
    - WhitelistChameleon
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.60
        Slash: 0.60
        Piercing: 0.60
        Heat: 0.75
        Caustic: 0.45
        Radiation: 0.75
      flatReductions:
        Stamina: 3
  - type: FireProtection
    reduction: 0.50
  - type: ExplosionResistance
    damageCoefficient: 0.80
  - type: PressureProtection
    highPressureMultiplier: 0.525
    lowPressureMultiplier: 1000
  - type: HideLayerClothing
    layers:
      Chest: OUTERCLOTHING
      RArm: OUTERCLOTHING
      LArm: OUTERCLOTHING
      RLeg: OUTERCLOTHING
      LLeg: OUTERCLOTHING
  - type: EnergyDomeGenerator
    domePrototype: VanguardEnergyDome
    canInteractUse: false
    toggleAction: ActionToggleVanguardDome
    damageEnergyDraw: 5
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: false
    slotFlags: BELT
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
        whitelist:
          tags:
            - PowerCell
            - PowerCellSmall
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot

# SVS Vanguard MKI Prototype - Gloves
- type: entity
  parent: ClothingHandsGlovesCombat
  id: ClothingHandsGlovesVanguardPressureSuit
  name: SVS 'vanguard' MKI prototype gloves
  suffix: prototype
  description: Prototype tactical gauntlets featuring an experimental concealed handcannon deployment system. A marvel of miniaturized weaponry engineering, though still in field testing.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Hands/Modsuits/MODSUITMercenary.rsi
    state: gauntlets-sealed
  - type: Clothing
    sprite: _Starlight/Clothing/Hands/Modsuits/MODSUITMercenary.rsi
    equipDelay: 5
    unequipDelay: 5
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
  - type: Item
    inhandVisuals:
      left: []
      right: []
  - type: Tag
    tags:
    - ClothMade
    - WhitelistChameleon
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.90
        Piercing: 0.90
        Heat: 0.90
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: HideLayerClothing
    layers:
      RHand: GLOVES
      LHand: GLOVES
  - type: HandcannonDeployment
    handcannonPrototype: WeaponPistolCHIMP
    deployDelay: 5
    deployAction: ActionDeployVanguardHandcannon

