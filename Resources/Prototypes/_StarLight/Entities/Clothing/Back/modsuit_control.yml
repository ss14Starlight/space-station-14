# SVS Vanguard Suit Storage - A storage backpack for the armor set
- type: entity
  id: ClothingBackpackVanguardSuitStorage
  parent: [ ClothingBackpackDuffel, BaseSalvageContraband ]
  name: SVS vanguard suit storage
  suffix: vanguard
  description: A rugged storage container designed to hold a full set of SVS Vanguard suit components.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Back/Modsuits/MODSUITMercenary.rsi
    state: control
  - type: Clothing
    sprite: _Starlight/Clothing/Back/Modsuits/MODSUITMercenary.rsi
  - type: Storage
    grid:
    - 0,0,7,3
    maxItemSize: Huge

# Complete set - spawns with all pieces inside
- type: entity
  id: ClothingBackpackVanguardSuitStorageComplete
  parent: ClothingBackpackVanguardSuitStorage
  name: SVS vanguard suit storage
  suffix: complete, vanguard
  description: A storage container with a complete set of SVS Vanguard suit armor.
  components:
  - type: StorageFill
    contents:
    - id: ClothingOuterVanguardSuit
    - id: ClothingHandsGlovesVanguardSuit
    - id: ClothingShoesBootsVanguardSuit
