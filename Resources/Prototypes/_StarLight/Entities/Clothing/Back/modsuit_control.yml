# SVS Vanguard Pressure Suit Storage - A storage backpack for the armor set
- type: entity
  id: ClothingBackpackVanguardPressureSuitStorage
  parent: [ ClothingBackpackDuffel, BaseSalvageContraband ]
  name: SVS vanguard pressure suit storage
  suffix: vanguard
  description: A rugged storage container designed to hold a full set of SVS Vanguard pressure suit components.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Back/Modsuits/MODSUITMercenary.rsi
    state: control
  - type: Clothing
    sprite: _Starlight/Clothing/Back/Modsuits/MODSUITMercenary.rsi
  - type: Storage
    grid:
    - 0,0,7,3
    maxItemSize: Huge

# Complete set - spawns with all pieces inside
- type: entity
  id: ClothingBackpackVanguardPressureSuitStorageComplete
  parent: ClothingBackpackVanguardPressureSuitStorage
  name: SVS vanguard pressure suit storage
  suffix: complete, vanguard
  description: A storage container with a complete sealed set of SVS Vanguard pressure suit armor.
  components:
  - type: StorageFill
    contents:
    - id: ClothingOuterVanguardPressureSuitSealed
    - id: ClothingHeadHelmetVanguardPressureSuitSealed
    - id: ClothingHandsGlovesVanguardPressureSuitSealed
    - id: ClothingShoesBootsVanguardPressureSuitSealed
