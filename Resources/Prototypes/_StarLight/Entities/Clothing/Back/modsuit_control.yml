# Mercenary Modsuit Control - A compact back-mounted container that holds a full modular combat suit
- type: entity
  parent: [ ClothingBackpackDuffel, BaseSalvageContraband ]
  id: ClothingBackpackMercenaryModsuitControl
  name: Gallóglach modsuit control
  suffix: mercenary
  description: A compact back-mounted control unit containing a full set of Gallóglach mercenary modular combat suit components. Designed for rapid deployment in hostile environments.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Back/Modsuits/MODSUITMercenary.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/Back/Modsuits/MODSUITMercenary.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,3
    whitelist:
      tags:
      - MercenaryModsuit
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: FillMercenaryModsuitControl
  - type: UseDelay
    delay: 2

- type: entityTable
  id: FillMercenaryModsuitControl
  table: !type:AllSelector
    children:
    - id: ClothingOuterModsuitMercenary
    - id: ClothingHeadHelmetModsuitMercenary
    - id: ClothingHandsGlovesMercenaryModsuit
    - id: ClothingShoesBootsMercenaryModsuit

# Sealed variant - contains all pieces in a compact form
- type: entity
  parent: ClothingBackpackMercenaryModsuitControl
  id: ClothingBackpackMercenaryModsuitControlSealed
  name: sealed Gallóglach modsuit control
  suffix: sealed, mercenary
  description: A sealed control unit for the Gallóglach mercenary modsuit system. Deploy to access all components.
