# Combat Power Cell - High capacity EMP-immune self-recharging cell
- type: entity
  parent: BasePowerCell
  id: PowerCellCombat
  name: combat power cell
  description: A military-grade self-recharging power cell with EMP shielding. Higher capacity and faster recharge than standard microreactors.
  components:
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: microreactor
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
  - type: PredictedBattery
    maxCharge: 1500
    startingCharge: 1500
  - type: PredictedBatterySelfRecharger
    autoRechargeRate: 25
  - type: EmpImmune

# SVS Vanguard MKI Prototype - Chestplate
- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterVanguardSuit
  name: SVS 'vanguard' MKI chestplate
  description: An experimental military-grade combat suit prototype featuring integrated energy dome technology. The first of its kind, combining advanced defensive systems with cutting-edge shield projection.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/OuterClothing/Modsuits/MODSUITMercenary.rsi
    state: chestplate-sealed
  - type: Clothing
    sprite: _Starlight/Clothing/OuterClothing/Modsuits/MODSUITMercenary.rsi
    equipDelay: 5
    unequipDelay: 5
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
  - type: Tag
    tags:
    - ClothMade
    - WhitelistChameleon
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.60
        Slash: 0.60
        Piercing: 0.60
        Heat: 0.75
        Caustic: 0.45
        Radiation: 0.75
      flatReductions:
        Stamina: 3
  - type: FireProtection
    reduction: 0.50
  - type: ExplosionResistance
    damageCoefficient: 0.80
  - type: PressureProtection
    highPressureMultiplier: 0.525
    lowPressureMultiplier: 1000
  - type: HideLayerClothing
    layers:
      Chest: OUTERCLOTHING
      RArm: OUTERCLOTHING
      LArm: OUTERCLOTHING
      RLeg: OUTERCLOTHING
      LLeg: OUTERCLOTHING
  - type: EnergyDomeGenerator
    domePrototype: EnergyDomeSmallRed
    canInteractUse: true
    toggleAction: ActionToggleVanguardDome
    damageEnergyDraw: 5
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: false
    slotFlags: BELT
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellCombat
        whitelist:
          tags:
            - PowerCell
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: EmpImmune

# SVS Vanguard MKI Prototype - Gloves
- type: entity
  parent: ClothingHandsGlovesCombat
  id: ClothingHandsGlovesVanguardSuit
  name: SVS 'vanguard' MKI gloves
  description: Prototype tactical gauntlets featuring an experimental concealed handcannon deployment system. A marvel of miniaturized weaponry engineering, though still in field testing.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Hands/Modsuits/MODSUITMercenary.rsi
    state: gauntlets-sealed
  - type: Clothing
    sprite: _Starlight/Clothing/Hands/Modsuits/MODSUITMercenary.rsi
    equipDelay: 5
    unequipDelay: 5
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
  - type: Item
    inhandVisuals:
      left: []
      right: []
  - type: Tag
    tags:
    - ClothMade
    - WhitelistChameleon
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.90
        Piercing: 0.90
        Heat: 0.90
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: HideLayerClothing
    layers:
      RHand: GLOVES
      LHand: GLOVES
  - type: HandcannonDeployment
    handcannonPrototype: WeaponPistolCHIMP
    deployDelay: 5
    deployAction: ActionDeployVanguardHandcannon

# SVS Vanguard MKI Prototype - Boots
- type: entity
  parent: [ClothingShoesBootsCombat, BaseToggleClothing]
  id: ClothingShoesBootsVanguardSuit
  name: SVS 'vanguard' MKI boots
  description: Prototype reinforced combat boots with integrated mag-lock stabilizers. Part of the experimental MKI combat system, designed for extreme environmental operations.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/Shoes/Modsuits/MODSUITMercenary.rsi
    state: boots-sealed
  - type: Clothing
    sprite: _Starlight/Clothing/Shoes/Modsuits/MODSUITMercenary.rsi
    equipDelay: 3
    unequipDelay: 3
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
  - type: Tag
    tags:
    - ClothMade
    - WhitelistChameleon
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.80
        Slash: 0.80
        Piercing: 0.85
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: HideLayerClothing
    layers:
      RFoot: FEET
      LFoot: FEET
  - type: ToggleClothing
    action: ActionToggleMagboots
  - type: ComponentToggler
    components:
    - type: NoSlip
  - type: Magboots
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 1.0
