# Radiation EVA
- type: entity
  parent: [ClothingOuterEVASuitBase, GeigerCounterClothing, AllowSuitStorageClothing]
  id: ClothingOuterEVASuitRad
  name: radiation EVA suit
  description: "A suit that protects against radiation. The label reads, 'Made with lead. Please do not consume insulation.'"
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/rad.rsi
  - type: Pierceable
    level: Metal
  - type: Armor
    modifiers:
      coefficients:
        Heat: 0.90
        Radiation: 0.01
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/rad.rsi
  - type: GroupExamine
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetEVARad
    slot: head
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
  - type: ProtectedFromStepTriggers
    slots: WITHOUT_POCKET
  - type: HideLayerClothing
    slots:
    - Tail



# Fire EVA
- type: entity
  parent: [ClothingOuterEVASuitBase, AllowSuitStorageClothing]
  id: ClothingOuterEVASuitFire
  name: fire EVA suit
  description: A suit that helps protect against hazardous temperatures.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/fire.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/fire.rsi
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.05
  - type: FireProtection
    reduction: 0.9 # only good at fire, so actually better than a hardsuit
  - type: Pierceable
    level: Wood
  - type: Armor
    modifiers:
      coefficients:
        Slash: 0.85
        Heat: 0.7
        Cold: 0.75
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: HeldSpeedModifier
  - type: GroupExamine
  - type: ProtectedFromStepTriggers
    slots: WITHOUT_POCKET
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetEVAFire
  - type: HideLayerClothing
    slots:
    - Tail


# Bio EVA
- type: entity
  parent: [ClothingOuterEVASuitBase, AllowSuitStorageClothingGasTanks]
