              state: ears
        eyes:
          sizeMaps:
            32:
              sprite: _Starlight/Mobs/Species/Rivareli/displacement.rsi
              state: eyes
        head:
          sizeMaps:
            32:
              sprite: _Starlight/Mobs/Species/Rivareli/displacement.rsi
              state: head
        mask:
          sizeMaps:
            32:
