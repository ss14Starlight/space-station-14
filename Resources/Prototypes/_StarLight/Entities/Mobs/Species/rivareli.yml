- type: entity
  save: false
  parent: [BaseMobSpeciesOrganic, BaseSpeciesPickupable]
  id: BaseMobRivareli
  abstract: true
  components:
    - type: VentCrawler # TODO: Add Variables so Rivareli can only crawl in vents if not wearing anything.
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeCircle
            radius: 0.2
          density: 120
          restitution: 0.0
          mask:
            - MobMask
          layer:
            - MobLayer
    - type: Butcherable
      butcheringType: Spike
      spawned:
      - id: FoodMeatHuman
        amount: 3
    - type: MobThresholds
      thresholds:
        0: Alive
        75: Critical
        150: Dead
    - type: HumanoidAppearance
      species: Rivareli
    - type: Icon
      sprite: _Starlight/Mobs/Species/Rivareli/parts.rsi
      state: full
    - type: Body
      prototype: Rivareli
      requiredLegs: 1
    - type: Absorbable
    - type: Hunger
    - type: Thirst
    - type: Speech
      speechSounds: Rivareli
      speechVerb: Rivareli
      allowedEmotes: ["Hisses", "Growl", "Purr", "Trill", "Wah"]
    - type: Vocal
      sounds:
        Male: MaleRivareli
        Female: FemaleRivareli
        Unsexed: MaleRivareli
    - type: Tag
      tags:
        - CanPilot
        - FootstepSound
        - DoorBumpOpener
        - AnomalyHost
    - type: Inventory
      templateId: rivareli
      speciesId: rivareli
      displacements:
        jumpsuit:
          sizeMaps:
            32:
              sprite: _Starlight/Mobs/Species/Rivareli/displacement.rsi
              state: jumpsuit
