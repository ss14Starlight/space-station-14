    netsync: false
    noRot: true
    drawdepth: Mobs
    # scale: 1, 0.8        # same as RMC dwarves (please reconsider allowing dwarf-sized rodentia)
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
