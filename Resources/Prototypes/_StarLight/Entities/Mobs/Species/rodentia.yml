- type: entity
  save: false
  name: Urist McRat # MIKEY - compare to resomi. lookup 'Urist McRaptor'
  parent: [BaseMobSpeciesOrganic, BaseSpeciesPickupable]
  id: BaseMobRodentia
  abstract: true
  components:
  - type: LanguageKnowledge
    speaks:
    - GalacticCommon
    - Crittish # MIKEY - is "crittish" the right word for it
    understands:
    - GalacticCommon
    - Crittish
    - Mouse
  - type: Absorbable
  - type: Hunger
  - type: Icon
    sprite: _Starlight/Mobs/Species/Rodentia/parts.rsi
    state: full
  - type: Body
    prototype: Rodentia
    requiredLegs: 2
  - type: Thirst
  - type: Butcherable
    butcheringType: Spike
    spawned:
      - id: FoodMeat
        amount: 3
  - type: MobThresholds
    thresholds:
      0: Alive
      85: Critical
      170: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      51: 0.7  #Basicly 60% and 80% 
      68: 0.5
  - type: HumanoidAppearance
    species: Rodentia
    hideLayersOnEquip:
    - Hair
    - HeadTop
    - HeadSide
    - Snout
  - type: TypingIndicator
    proto: rodentia
  - type: Speech
    speechVerb: Rodentia
    speechSounds: Squeak
    allowedEmotes: ['Squeak'] # MIKEY - add more emotes. Look at MobMouse for inspo?
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 110
        restitution: 0.0
        mask:
          - MobMask
        layer:
          - MobLayer
#  - type: Sprite
#    netsync: false
#    noRot: true
#    drawdepth: Mobs
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Vocal
    sounds:
      Male: MaleRodentia
      Female: FemaleRodentia
      Unsexed: MaleRodentia
  - type: Inventory
    speciesId: rodentia
    displacements: # MIKEY - verify all work
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: jumpsuit
      eyes:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: eyes
      gloves:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: gloves
      head:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: head
      back:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: back
      ears:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: ears
      mask:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: mask
      outerclothing:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: outerclothing
      shoes:
        sizeMaps:
          32:
            sprite: _Starlight/Mobs/Species/Rodentia/displacement.rsi
            state: shoes
  - type: AlwaysTriggerMousetrap
  - type: CrawlUnderObjects
    actionProto: ActionToggleSneakMode

