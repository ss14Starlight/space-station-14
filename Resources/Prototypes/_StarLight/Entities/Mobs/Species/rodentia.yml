- type: entity
  save: false
  name: Urist McRat
  parent: [BaseMobSpeciesOrganic, BaseSpeciesPickupable]
  id: BaseMobRodentia
  abstract: true
  components:
  - type: LanguageKnowledge
    speaks:
    - GalacticCommon
    - Mouse # MIKEY - replace "Mouse" with new language?
