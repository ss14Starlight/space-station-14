- type: entity
  save: false
  name: Urist McRat # MIKEY - compare to resomi. lookup 'Urist McRaptor'
  parent: [BaseMobSpeciesOrganic, BaseSpeciesPickupable]
  id: BaseMobRodentia
  abstract: true
  components:
  - type: LanguageKnowledge
    speaks:
    - GalacticCommon
    - Crittish # MIKEY - is "crittish" the right word for it
    understands:
    - GalacticCommon
    - Crittish
    - Mouse
  - type: Absorbable
  - type: Hunger
  - type: Icon
    sprite: _Starlight/Mobs/Species/Rodentia/parts.rsi
    state: full
  - type: Body
    prototype: Rodentia
    requiredLegs: 2
  - type: Thirst
  - type: Butcherable
    butcheringType: Spike
    spawned:
      - id: FoodMeat
        amount: 5
  - type: MobThresholds
    thresholds:
      0: Alive
      85: Critical
      170: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      51: 0.7  #Basicly 60% and 80% 
      68: 0.5
  - type: HumanoidAppearance
    species: Rodentia
    hideLayersOnEquip:
    - Hair
    - HeadTop
    - HeadSide
    - Snout
  - type: TypingIndicator
    proto: default # MIKEY - replace with rodent one?
  - type: Speech
    speechVerb: Rodentia
    speechSounds: Squeak
    allowedEmotes: ['Squeak'] # MIKEY - add more emotes. Look at MobMouse for inspo?
  - type: Sprite
    netsync: false
    noRot: true
    drawdepth: Mobs
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Vocal
    sounds:
      Male: MaleRodentia
      Female: FemaleRodentia
      Unsexed: MaleRodentia
  - type: Inventory
    speciesId: rodentia
#    displacements: # MIKEY - add displacements when Zeyria finishes them

- type: entity
  save: false
  name: Rodentia Dummy
  parent: BaseSpeciesDummy
  id: MobRodentiaDummy
  categories: [ HideSpawnMenu ]
  description: A dummy rodentia meant to be used in character setup.
  components:
  - type: HumanoidAppearance
    species: Rodentia
