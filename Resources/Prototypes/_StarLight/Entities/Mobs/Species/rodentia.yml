  - type: HumanoidAppearance # MIKEY - waht is this???
    species: Rodentia
    hideLayersOnEquip:
    - Hair
    - HeadTop
    - HeadSide
    - Snout
  - type: TypingIndicator
    proto: spider # MIKEY - replace with rodent one
