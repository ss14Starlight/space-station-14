- type: entity
  name: flockbit
  parent: SimpleMobBase
  id: MobFlockBit
  description: Teal radio glass spreader supreme!
  components:
  - type: Body
    prototype: Mouse
  - type: Sprite
    drawdepth: SmallMobs
    sprite: _Starlight/Mobs/Animals/flockbit.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: flockbit
  - type: SpriteMovement
    movementLayers:
      movement:
        state: flockbit
    noMovementLayers:
      movement:
        state: bit-dormant
  - type: NpcFactionMember
    factions:
      - Flockmind
  - type: HTN
    constantlyReplan: false
    rootTask:
      task: FlockBitCompound
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobState
  - type: Deathgasp
  - type: MobThresholds
    thresholds:
      0: Alive
      10: Critical
      20: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 5
  - type: Tag
    tags:
    - Trash
    - VimPilot
    - ChefPilot
    - DoorBumpOpener # so it can open flock doors
  - type: Bloodstream
    bloodMaxVolume: 50
  - type: MobPrice
    price: 500 #if you can somehow get this thing to the ATS sell it I guess
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 60
      behaviors:
      - !type:GibBehavior
        recursive: false
  - type: FlockmindConverter
