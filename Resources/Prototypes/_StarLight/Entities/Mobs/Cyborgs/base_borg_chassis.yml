#Most of this is effectively duplicate code
#TODO: Find out if the base values can just be overwritten somehow

- type: entity
  parent: [BaseBorgChassis, StripableInventoryBase]
  id: BaseBorgChassisCustomQuadruped
  name: cybork
  description: A man-machine hybrid that assists in station activity. They love being asked to state their laws over and over.
  save: false
  abstract: true
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.5
    baseSprintSpeed : 6.0
  - type: Sprite
    sprite: _Starlight/Mobs/Silicon/cybork.rsi
  - type: RotationVisuals
    horizontalRotation: 180
  - type: MobThresholds
    thresholds:
      0: Alive
      85: Critical
      170: Dead
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
    showOverlays: false
    allowRevives: true
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Slash: 5
        Piercing: 5
  - type: PowerCellDraw
    drawRate: 0.7
  # no ToggleCellDraw since dont want to lose access when power is gone
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHull
      #Hull Catwalk Plating
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 55
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:EmptyContainersBehaviour
        containers:
        - borg_brain
        - borg_module
        - cell_slot
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Strap
    position: Down
    rotation: -90
    buckleOffset: "0,-0.15"

- type: entity
  id: BaseBorgChassisCustomQuadrupedNT
  parent: [BaseBorgChassisCustomQuadruped, BaseBorgTransponder]
  abstract: true
  components:
  - type: TextToSpeech
  - type: RandomMetadata
    nameSegments:
    - NamesBorg
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: Access
    enabled: false
    groups:
    - AllAccess
    tags:
    - Borg
  - type: AccessReader
    access: [["Command"], ["Research"]]
  - type: ShowJobIcons
  - type: InteractionPopup
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg

- type: entity
  id: BaseBorgChassisCustomQuadrupedSyndicate
  parent: BaseBorgChassisCustomQuadruped
  abstract: true
  components:
  - type: TextToSpeech
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: Access
    tags:
    - NuclearOperative
    - SyndicateAgent
  - type: AccessReader
    access: [["SyndicateAgent"], ["NuclearOperative"]]
  - type: SiliconLawProvider
    laws: SyndicateStatic
    subverted: true
  - type: IntrinsicRadioTransmitter
    channels:
    - Binary
    - Syndicate
  - type: ActiveRadio
    channels:
    - Syndicate
  - type: ShowSyndicateIcons
  - type: MovementAlwaysTouching
  - type: Speech
    speechSounds: SyndieBorg
    allowedEmotes:
    - Laugh
  - type: Vocal
    sounds:
      Unsexed: UnisexSiliconSyndicate
  - type: PointLight
    color: "#dd200b"

- type: entity
  id: BaseBorgChassisCustomQuadrupedDerelict
  parent: BaseBorgChassisCustomQuadruped
  abstract: true
  components:
  - type: NpcFactionMember
    factions:
    - NanoTrasen #The seemingly best fit. It was a regular NT cyborg once, after all.
  - type: Access
    enabled: false
    groups:
    - AllAccess #Randomized access would be fun. AllAccess is the best i can think of right now that does make it too hard for it to enter the station or navigate it..
  - type: AccessReader
    access: [["Command"], ["Research"]]
  - type: StartIonStormed
    ionStormAmount: 3
  - type: IonStormTarget
    chance: 1
  - type: ShowJobIcons