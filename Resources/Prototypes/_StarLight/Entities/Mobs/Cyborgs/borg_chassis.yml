- type: entity
  id: BorgChassisCustomQuadrupedSelectable
  parent: BaseBorgChassisCustomQuadrupedNT
  components:
  - type: TextToSpeech
  - type: Sprite
    layers:
    - state: cybork
      map: ["enum.BorgVisualLayers.Body", "movement"]
    - state: cybork_e_r
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: cybork_l
      shader: unshaded
      map: ["light","enum.BorgVisualLayers.LightStatus"]
      visible: false
  - type: BorgChassis
    # Default borg can take no modules until selected type.
    maxModules: 0
    hasMindState: cybork_e
    noMindState: cybork_e_r
  - type: BorgTransponder
    sprite:
      sprite: _Starlight/Mobs/Silicon/cybork.rsi
      state: cybork
    name: cybork
  - type: InteractionPopup
    interactSuccessString: petting-success-generic-cyborg-doggo
    interactFailureString: petting-failure-generic-cyborg-doggo
  - type: BorgSwitchableType
    inherentRadioChannels:
    - Common
    - Binary
  
- type: entity
  id: BorgChassisSecurityDoggo
  parent: BorgChassisCustomQuadrupedSelectable
  name: security cyborg
  components:
  - type: TextToSpeech
  - type: BorgSwitchableType
    selectedBorgType: security

- type: entity
  id: BorgChassisRescueDoggo
  parent: BorgChassisCustomQuadrupedSelectable
  name: rescue cyborg
  components:
  - type: TextToSpeech
  - type: BorgSwitchableType
    selectedBorgType: rescue