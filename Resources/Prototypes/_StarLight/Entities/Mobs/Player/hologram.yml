- type: entity
  abstract: true
  parent:
  - BaseMob
  - MobCombat
  - StripableInventoryBase
  id: BaseHologramHumanoid
  name: hologram
  components:
  - type: Hologram
  - type: MovementIgnoreGravity
  - type: NoSlip
  - type: Stealth
    lastVisibility: 0.8
  - type: AnimationPlayer
  - type: FloatingVisuals
  - type: ReplacementAccent
    accent: silicon
  - type: Speech
    speechSounds: Robotic
  - type: Input
    context: "human"
  - type: InputMover
  - type: MobMover
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    layers:
        - map: ["enum.HumanoidVisualLayers.Chest"]
        - map: ["enum.HumanoidVisualLayers.Head"]
        - map: ["enum.HumanoidVisualLayers.Snout"]
        - map: ["enum.HumanoidVisualLayers.Eyes"]
        - map: ["enum.HumanoidVisualLayers.RArm"]
        - map: ["enum.HumanoidVisualLayers.LArm"]
        - map: ["enum.HumanoidVisualLayers.RLeg"]
        - map: ["enum.HumanoidVisualLayers.LLeg"]
        - shader: StencilClear
          sprite: Mobs/Species/Human/parts.rsi
          # sprite refactor when
          state: l_leg
        - shader: StencilMask
          map: ["enum.HumanoidVisualLayers.StencilMask"]
          sprite: Mobs/Customization/masking_helpers.rsi
          state: female_full
          visible: false
        - map: ["enum.HumanoidVisualLayers.LFoot"]
        - map: ["enum.HumanoidVisualLayers.RFoot"]
        - map: ["socks"]
        - map: ["underpants"]
        - map: ["undershirt"]
        - map: ["jumpsuit"]
        - map: ["enum.HumanoidVisualLayers.LHand"]
        - map: ["enum.HumanoidVisualLayers.RHand"]
        - map: ["enum.HumanoidVisualLayers.Handcuffs"]
          color: "#ffffff"
          sprite: Objects/Misc/handcuffs.rsi
          state: body-overlay-2
          visible: false
        - map: ["id"]
        - map: ["gloves"]
        - map: ["shoes"]
        - map: ["ears"]
        - map: ["outerClothing"]
        - map: ["eyes"]
        - map: ["belt"]
        - map: ["neck"]
        - map: ["back"]
        - map: ["enum.HumanoidVisualLayers.FacialHair"]
        - map: ["enum.HumanoidVisualLayers.Hair"]
        - map: ["enum.HumanoidVisualLayers.HeadSide"]
        - map: ["enum.HumanoidVisualLayers.HeadTop"]
        - map: ["mask"]
        - map: ["head"]
        - map: ["pocket1"]
        - map: ["pocket2"]
        - map: ["enum.HumanoidVisualLayers.Tail"]
  - type: HumanoidAppearance
    species: Human
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.5
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 25
        mask:
          - MobMask
        layer:
          - MobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed: 5
    baseSprintSpeed: 3.5
  - type: Hands
    showInHands: false
  - type: Inventory
  - type: InventorySlots
  - type: Body
    prototype: Hologram
    requiredLegs: 2
  - type: DoAfter
  - type: Pullable
  - type: Examiner
  - type: Puller
  - type: StandingState
  - type: Crawler
  - type: Alerts
  - type: Tag
    tags:
      - DoorBumpOpener
      - CanPilot
      - FootstepSound
      - SiliconEmotes
  - type: TypingIndicator
    proto: robot
  - type: Emoting
  - type: BodyEmotes
    soundsId: GeneralBodyEmotes
  - type: Grammar
    attributes:
      proper: true
  - type: MindContainer
    showExamineInfo: true
  - type: Actions
  - type: Eye
  - type: Access
  - type: MovementAlwaysTouching
  - type: Identity
  - type: IdExaminable
  - type: Buckle
  - type: CombatMode
    canDisarm: true
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 0
  - type: Cuffable
  - type: Ensnareable
    sprite: Objects/Misc/ensnare.rsi
    state: icon
  - type: Climbing
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-hologram
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-hologram-others
  - type: Stripping
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface
  - type: SiliconLawBound
  - type: SiliconLawProvider
    laws: Drone
  - type: Vocal
    sounds:
      Male: UnisexSiliconRobotic
      Female: UnisexSiliconRobotic
      Unsexed: UnisexSiliconRobotic
    screamId: Scream
    screamAction: ActionScream

# Hardlight hologram 
- type: entity
  name: Urist McLight
  suffix: Hardlight
  parent: BaseHologramHumanoid
  id: MobHologramHardlight
  components:
  - type: Hologram
    IsHardLight: true
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Hardlight
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 6
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 5
  - type: HologramProjected
    gracePeriod: 0.08
    validProjectorWhitelist:
      tags:
      - HoloProjectorServer
      - HoloProjectorCamera
    effectPrototype: EffectHologramProjectionBeam
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 25
        mask:
          - MobMask
        layer:
          - MobLayer
  - type: CombatMode
    disarm: null
  - type: CameraRecoil
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: Stealth
    lastVisibility: 0.90
  - type: PointLight
    radius: 0.8
    softness: 0.4
    color: "#00FFFF"
    energy: 5
