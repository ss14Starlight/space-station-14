#Security Canine
- type: borgType
  id: security

  # Description
  dummyPrototype: BorgChassisSecurityDoggo

  # Functional
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleSyndicate
    - BorgModuleSecurity

  defaultModules:
  - BorgModulePursuit
  - BorgModuleForensics

  radioChannels:
  - Science
  - Security

  addComponents:
  - type: SolutionScanner
  - type: ShowCriminalRecordIcons
  - type: Jump
    action: JumpJetBorg

  # Visual
  inventoryTemplateId: borgShort
  spriteBodyState: cybork
  spriteHasMindState: cybork_e
  spriteNoMindState: cybork_e_r
  spriteToggleLightState: cybork_l

  # Pet
  petSuccessString: petting-success-security-cyborg-doggo
  petFailureString: petting-failure-security-cyborg-doggo

  # Sounds
  footstepCollection:
    collection: FootstepHull

#Medical Canine
- type: borgType
  id: rescue

  # Description
  dummyPrototype: BorgChassisRescueDoggo

  # Functional
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleMedical

  defaultModules:
  - BorgModuleRescue

  radioChannels:
  - Science
  - Medical

  addComponents:
  - type: SolutionScanner
  - type: ShowHealthBars
    damageContainers:
    - Biological
  - type: ShowHealthIcons
    damageContainers:
    - Biological
  - type: Drain
    autoDrain: false
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 10
  - type: InjectableSolution
    solution: drainBuffer

  # Visual
  inventoryTemplateId: borgShort
  spriteBodyState: medcat
  spriteHasMindState: medcat_e
  spriteNoMindState: medcat_e_r
  spriteToggleLightState: cybork_l

  # Pet
  petSuccessString: petting-success-rescue-cyborg-doggo
  petFailureString: petting-failure-rescue-cyborg-doggo

  # Sounds
  footstepCollection:
    collection: FootstepCatwalk