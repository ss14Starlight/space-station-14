#Security Canine
- type: borgType
  id: security

  # Description
  dummyPrototype: BorgChassisSecurityDoggo

  # Functional
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleSyndicate
    - BorgModuleSecurity

  defaultModules:
  - BorgModulePursuit

  radioChannels:
  - Science
  - Security

  addComponents:
  - type: SolutionScanner
  - type: ShowCriminalRecordIcons

  # Visual
  inventoryTemplateId: borgShort
  spriteBodyState: cybork
  spriteHasMindState: cybork_e
  spriteNoMindState: cybork_e_r
  spriteToggleLightState: cybork_l

  # Pet
  petSuccessString: petting-success-security-cyborg-doggo
  petFailureString: petting-failure-security-cyborg-doggo

  # Sounds
  footstepCollection:
    collection: FootstepHull

#Medical Canine
- type: borgType
  id: rescue

  # Description
  dummyPrototype: BorgChassisRescueDoggo

  # Functional
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleMedical

  defaultModules:
  - BorgModuleSearchAndRescue

  radioChannels:
  - Science
  - Medical

  addComponents:
  - type: SolutionScanner
  - type: ShowHealthBars
    damageContainers:
    - Biological
  - type: ShowHealthIcons
    damageContainers:
    - Biological

  # Visual
  inventoryTemplateId: borgShort
  spriteBodyState: cyborkmed
  spriteHasMindState: cyborkmed_e
  spriteNoMindState: cybork_e_r
  spriteToggleLightState: cybork_l

  # Pet
  petSuccessString: petting-success-rescue-cyborg-doggo
  petFailureString: petting-failure-rescue-cyborg-doggo

  # Sounds
  footstepCollection:
    collection: FootstepCatwalk