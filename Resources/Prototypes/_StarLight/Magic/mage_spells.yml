  id: ActionMageSpellInvocation
  name: Invocation
  description: Heals any nearby Undead Servants.
  components:
  - type: Magic
    requiresClothes: false
  - type: Action
    useDelay: 5 # TODO: balance
    itemIconStyle: BigAction
    icon:
      sprite: _Starlight/Objects/Magic/luminous_orb.rsi
      state: icon
  - type: InstantAction
    event: !type:SpawnItemInHandEvent
      spawned: ElfLuminousOrb
      requiresFreeHand: false
  - type: SpeakOnAction
    sentence: action-speech-mage-invocation
    whisper: true

