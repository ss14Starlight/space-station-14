# Mage and Sorcerer spells; see elf_spells.yml for Elf Cantrips, or elsewhere for Wizard spells

- type: entity
  parent: BaseAction
  id: ActionMageSpellFlashCook
  name: Flash Cook
  description: Instantly raises the temperature inside food.
  components:
  - type: Magic
    requiresClothes: false
  - type: Action
    useDelay: 5 # TODO: balance
    itemIconStyle: BigAction
    icon:
      sprite: _Starlight/Objects/Magic/luminous_orb.rsi
      state: icon
  - type: InstantAction
    event: !type:SpawnItemInHandEvent
      spawned: ElfLuminousOrb
      requiresFreeHand: false
  - type: SpeakOnAction
    sentence: action-speech-mage-flash-cook
    whisper: true

