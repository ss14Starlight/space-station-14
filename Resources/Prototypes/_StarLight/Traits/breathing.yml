# Breathing adaptation traits
# Allow species to breathe different atmospheric gases
# These are mutually exclusive via server-side validation

- type: trait
  id: NitrogenBreather
  name: trait-nitrogen-breather-name
  description: trait-nitrogen-breather-desc
  category: PhysiologyTraits
  cost: 1
  components:
  - type: TraitOrganReplacement
    slot: lungs
    organ: OrganNitrogenLungs
    spawnNitrogenTank: true
    equipment:
      mask: ClothingMaskBreath
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1.0
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: Internals
  - type: NitrogenBreather  # Marker component

- type: trait
  id: OxygenBreather
  name: trait-oxygen-breather-name
  description: trait-oxygen-breather-desc
  category: PhysiologyTraits
  cost: 1
  components:
  - type: TraitOrganReplacement
    slot: lungs
    organ: OrganOxygenLungs
    removePoisonRegen: true
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1.0
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: Internals
  - type: OxygenBreather  # Marker component
