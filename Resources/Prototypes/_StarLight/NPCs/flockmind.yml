- type: htnCompound
  id: FlockBitCompound
  branches:
    - task:
      - id: PickUnconvertedFlockTilePrimitive
      - id: ConvertUnconvertedFlockTileCompound
    - task:
      - id: IdleCompound

- type: htnCompound
  id: ConvertUnconvertedFlockTileCompound
  branches:
    - task:
      - !type:HTNPrimitiveTask
        operator: !type:MoveToOperator
          shutdownState: TaskFinished
          pathfindInPlanning: true
          removeKeyOnFinish: false
          targetKey: TargetTile
          pathfindKey: TargetPathfind
          rangeKey: MeleeRange
      - !type:HTNPrimitiveTask
        operator: !type:UseActionOperator
          expectDoAfter: true
          actionID: FlockmindConvertTileFree

- type: htnPrimitive
  id: PickUnconvertedFlockTilePrimitive
  operator: !type:PickRantomTileOperator
    tiles:
    - FloorFeatherzone
    - FloorFeatherzoneBroken
    invert: true # we want all tiles *except* featherzone tiles
