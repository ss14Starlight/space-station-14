- type: htnCompound
  id: FlockBitCompound
  branches:
    - tasks:
      - !type:HTNCompoundTask
        task: ConvertUnconvertedFlockTileCompound
    - tasks:
      - !type:HTNCompoundTask
        task: IdleCompound

- type: htnCompound
  id: ConvertUnconvertedFlockTileCompound
  branches:
    - tasks:
      - !type:HTNPrimitiveTask
        operator: !type:PickRandomTileOperator
          tiles:
          - FloorFeatherzone
          - FloorFeatherzoneBroken
          invert: true # we want all tiles *except* featherzone tiles
      - !type:HTNPrimitiveTask
        operator: !type:MoveToOperator
          shutdownState: TaskFinished
          pathfindInPlanning: true
          removeKeyOnFinish: false
          targetKey: TargetTile
          pathfindKey: TargetPathfind
          rangeKey: MeleeRange
      - !type:HTNPrimitiveTask
        operator: !type:UseActionOperator
          expectDoAfter: false #until we actually implement it
          actionID: ActionFlockmindConvertTileFree
