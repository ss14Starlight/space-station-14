- type: entity
  id: OrganCyber
  parent: BaseItem
  name: "cyber organ"
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
  - type: Organ
  - type: Gibbable
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Iron
        Quantity: 30

- type: entity
  id: CyberEyeNightVision
  name: NightVision cyber eyes
  description: Enables you to see in the dark.
  parent: [OrganCyber, BaseOrganEyes]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/implants.rsi
    state: eyes_night
  - type: FunctionalOrgan
    comps: 
    - type: NightVision
  - type: OrganVisualization
    layer: Eyes
    prototype: CyberEyesNightVision

- type: entity
  id: CyberEyeThermal
  name: ThermalVision cyber eyes
  description: Enables you to see in the dark and detect warm objects through walls. #they're not wallhacks, i swear officer
  parent: [OrganCyber, BaseOrganEyes]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/implants.rsi
    state: eyes_thermal
  - type: FunctionalOrgan
    comps: 
    - type: ThermalVision
  - type: OrganVisualization
    layer: Eyes
    prototype: CyberEyesThermalVision

- type: entity
  id: BudgetCyberEyes
  name: Budget CyberEyes
  description: Cold and soulless. Just as depressing to look out of as to look into.
  parent: [OrganCyber, BaseOrganEyes]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
    layers:
      - state: eyeball-l
      - state: eyeball-r
  - type: FunctionalOrgan
    comps: 
    - type: NoirOverlay
  - type: OrganVisualization
    layer: Eyes
    prototype: MobHumanoidEyes

- type: entity
  id: BudgetCyberTongue
  name: Budget CyberTongue
  description: An artificial tongue with full range of movement. Taste buds not included.
  parent: [OrganCyber, BaseOrganTongue]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
    state: tongue
  - type: FunctionalOrgan
    comps: 
    - type: UnableToTaste

- type: entity
  id: BudgetCyberLiver
  name: Budget CyberLiver
  description: "Design so reliable, it didn't have to be changed for the last 237 years! Warning: This product isn't meant for recreational drinking!"
  parent: [OrganCyber, OrganHumanLiver]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
    state: liver
  - type: Metabolizer # The liver metabolizes certain chemicals only, like alcohol.
    maxReagents: 1
    metabolizerTypes: [BudgetCyber]
    groups:
    - id: Alcohol
      rateModifier: 0.1 # removes alcohol very slowly along with the stomach removing it as a drink

- type: entity
  id: BudgetCyberStomach
  name: Budget CyberStomach
  description: An artifical stomach. Its lack of elasticity is a desired feature for those who want to control their eating habits.
  parent: [OrganCyber, OrganHumanStomach]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
    state: stomach
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 30
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [BudgetCyber]
    groups:
    - id: Food
    - id: Drink

- type: entity
  id: BudgetCyberKidneys
  name: Budget CyberKidneys
  description: A pair of artificial kidneys. Due to cheap materials used, they waste significantly more water than organic ones.
  parent: [OrganCyber, OrganHumanKidneys]
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/budget_cyber_organs.rsi
    layers:
      - state: kidney-l
      - state: kidney-r
  - type: FunctionalOrgan
    comps: 
    - type: ThirstRateMultiplier
      multiplier: 1.25

- type: entity
  id: CyberEyes
  parent: [OrganCyber, BaseOrganEyes]
  name: cyber eyes
  description: All it's missing is the HudJack, then you can watch NanoTube right from your eyes!
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/cyber_organs.rsi
    layers:
      - state: eyeball-l
      - state: eyeball-r
  - type: Item
    size: Small
    heldPrefix: eyeballs
  - type: OrganVisualization
    layer: Eyes
    prototype: MobHumanoidEyes

- type: entity
  id: CyberTongue
  parent: [OrganCyber, BaseOrganTongue]
  name: cyber tongue
  description: A freakishly nimble amalgamation of hydraulics and synthmesh, this thing can do many a party trick! #this is not a freaky reference, im talking about touching your nose, clover tongue, ect
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/cyber_organs.rsi
    state: tongue

- type: entity
  id: CyberLungs
  parent: [OrganCyber, BaseOrganLungs]
  name: cyber lungs
  description: A smoker's best friend, all the nicotine and none of the cancer! You feel like these would allow for very clear breathing.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/cyber_organs.rsi
    layers:
      - state: lung-l
      - state: lung-r
  - type: Item
    size: Small
    heldPrefix: lungs
  - type: Lung
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: "Lung"
    metabolizerTypes: [ Human ]
    groups:
    - id: Gas
      rateModifier: 100.0
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
      Lung:
        maxVol: 175.0
        canReact: false
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5

- type: entity
  id: CyberHeart
  parent: [OrganCyber, BaseOrganHeart]
  name: cyber heart
  description: Why won't you die??
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/cyber_organs.rsi
    state: heart-on
  # The heart 'metabolizes' medicines and poisons that aren't filtered out by other organs.
  # This is done because these chemicals need to have some effect even if they aren't being filtered out of your body.
  # You're technically 'immune to poison' without a heart, but.. uhh, you'll have bigger problems on your hands.
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [Human]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic
  - type: Item
    size: Small
    heldPrefix: heart
  - type: StaminaResistance # do not add these to other equipment or mobs, we don't want to microbalance these everywhere
    damageCoefficient: 0.9

- type: entity
  id: CyberStomach
  parent: [OrganCyber, BaseOrganStomach]
  name: cyber stomach
  description: You will have quite literally, an iron stomach. it can hold many more bites of food for digestion.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/cyber_organs.rsi
    state: stomach
  - type: Item
    size: Small
    heldPrefix: stomach
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 75
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Stomach
  # The stomach metabolizes stuff like foods and drinks.
  # TODO: Have it work off of the ent's solution container, and move this
  # to intestines instead.
  - type: Metabolizer
    # mm yummy
    maxReagents: 3
    metabolizerTypes: [Human]
    groups:
    - id: Food
    - id: Drink

- type: entity
  id: CyberLiver
  parent: [OrganCyber, BaseOrganLiver]
  name: cyber liver
  description: This medical marvel will allow you to drink the alcohol tolerance of FOUR men!
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/cyber_organs.rsi
    state: liver
  - type: Item
    size: Small
    heldPrefix: liver
  - type: Metabolizer # The liver metabolizes certain chemicals only, like alcohol.
    maxReagents: 1
    metabolizerTypes: [Dwarf]
    groups:
    - id: Alcohol
      rateModifier: 0.1 # removes alcohol very slowly along with the stomach removing it as a drink

- type: entity
  id: CyberKidneys
  parent: [OrganCyber, BaseOrganKidneys]
  name: cyber kidneys
  description: Extremely efficient at processing water, you could almost go a whole shift on one bottle of water!
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/cyber_organs.rsi
    layers:
      - state: kidney-l
      - state: kidney-r
  - type: Item
    size: Small
    heldPrefix: kidneys
  # The kidneys just remove anything that doesn't currently have any metabolisms, as a stopgap.
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [Human]
    removeEmpty: true
  - type: FunctionalOrgan
    comps: 
    - type: ThirstRateMultiplier
      multiplier: 0.6
