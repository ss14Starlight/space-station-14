- type: entity
  abstract: true
  categories: [HideSpawnMenu]
  parent: BaseDice
  id: BaseDestinyDie
  name: destiny die
  description: A magically enhanced d10, capable of rolling many many numbers and granting effects based on the roll.
  components:
    - type: Dice
      sides: 10
      multiplier: 1
      offset: 1
      currentValue: 0
    - type: DestinyDice
      noEffectMessage: "Nothing happened..."
      cooldownMessage: "The destiny die is recharging, nothing happens..."
      rollDelay: 0
    - type: Sprite
      sprite: _Starlight/Admeme/neomoth/destinydie.rsi
      layers:
        - state: die
          shader: unshaded
        - state: side_numbers
        - state: l0
        - state: r0
    - type: PointLight
      radius: 0.8
      energy: 1.8
    - type: RgbLightController
      layers: [ 0 ]

- type: entity
  parent: BaseDestinyDie
  id: DebugDestinyDie
  components:
    - type: DestinyDice
      effectGroups:
        0:
          - effects:
              - !type:StationAnnouncementEffect
                message: "meow"
                sender: "Debug"
                color: "#2378f3"

- type: entity
  parent: BaseDestinyDie
  id: DestinyDie
  components:
    - type: Dice
      sides: 99
    - type: DestinyDice
      rollDelay: 2
      effectGroups:
        99:
          - successMessage: "Incredible roll! Something amazing happens..."
            weight: 1
            effects:
              - !type:SpawnPrototypeEffect
                delay: 0.4
                successMessage: "+1 Cappy ID!"
                protos:
                  - CaptainIDCard
          - successMessage: "Incredible roll! Something amazing happens..."
            weight: 1
            effects:
              - !type:SpawnPrototypeEffect
                delay: 0.4
                successMessage: ""