- type: entity
  parent: BaseDice
  id: DestinyDie
  name: destiny die
  description: A magically enhanced d10, capable of rolling many many numbers and granting effects based on the roll.
  components:
    - type: Dice
      sides: 12
      multiplier: 1
      offset: 1
      currentValue: 0
    - type: DestinyDice
      noEffectMessage: "Nothing happened..."
      cooldownMessage: "The destiny die is recharging, nothing happens..."
      rollDelay: 0
      effectGroups:
        0:
          - successMessage: "You got some free stuff!"
            effects:
              - !type:SpawnPrototypeEffect
                protos:
                  - Skub
                  - FoodCheeseSlice
                  - PlushieRainbowLizard
                  - MobMothroach
        1:
          - successMessage: "You got a koni plush!"
            effects:
              - !type:SpawnPrototypeEffect
                spawnOnPlayer: true
                protos:
                  - PlushieKoni
