- type: entity
  id: CrateArmoryLr30
  parent: [ CrateWeaponSecure, BaseRestrictedContraband ]
  name: LR30 crate
  description: Contains two automatic laser rifles, with two additional magazines each. Requires Armory access to open.
  components:
  - type: StorageFill
    contents:
      - id: WeaponLr30
        amount: 2
      - id: MagazineBatteryLr30
        amount: 4

- type: entity
  id: CrateArmoryLr30Magazines
  parent: [ CrateWeaponSecure, BaseRestrictedContraband ]
  name: LR30 magazine crate
  description: Contains six magazines for LR-30 rifles. Requires Armory access to open.
  components:
  - type: StorageFill
    contents:
      - id: MagazineBatteryLr30
        amount: 6

- type: entity
  id: CrateArmoryCombatShotgun
  parent: [ CrateWeaponSecure, BaseRestrictedContraband ]
  name: combat shotgun crate
  description: Contains two semi-automatic combat shotguns, with two additional ammo boxes. Requires Armory access to open.
  components:
  - type: StorageFill
    contents:
      - id: WeaponShotgunCombat
        amount: 2
      - id: BoxLethalshot
        amount: 2

- type: entity
  id: CrateArmoryAdvancedRestraints
  parent: [ CrateWeaponSecure, BaseSecurityContraband ]
  name: advanced restraints crate
  description: For the most annoying prisoners.
  components:
  - type: StorageFill
    contents:
    - id: ClothingOuterStraightjacket
    - id: ClothingOuterStraightjacket
    - id: ClothingMaskBreath
    - id: ClothingMaskBreath
    - id: NitrousOxideTank
    - id: NitrousOxideTank
