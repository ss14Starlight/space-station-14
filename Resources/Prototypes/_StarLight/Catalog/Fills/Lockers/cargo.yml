#Salvage Medic
- type: entityTable
  id: LockerFillSalvageMedic
  table: !type:AllSelector
    children:
      - id: ClothingBeltMedicalFilled
      - id: SurvivalKnife
      - id: HandheldGPSBasic
      - id: RadioHandheldExpedition
      - id: AppraisalTool
      - id: FireExtinguisher
      - id: Flare
        prob: 0.3
        rolls: !type:ConstantNumberSelector
          value: 3
      - id: BoxBodyBag
      - id: EmergencyRollerBedSpawnFolded

- type: entityTable
  id: FillSalvageMedicHardsuitSpatio
  table: !type:AllSelector
    children:
      - id: OxygenTankFilled
      - id: ClothingShoesBootsMag
      - id: ClothingOuterHardsuitSpatioMedic
      - id: ClothingMaskGasExplorer

- type: entity
  id: LockerSalvageMedicFilledHardsuit
  suffix: Filled, Hardsuit
  parent: LockerSalvageMedic
  components:
    - type: EntityTableContainerFill
      containers:
        entity_storage: !type:AllSelector
          children:
            - !type:NestedSelector
              tableId: FillSalvageMedicHardsuitSpatio
            - !type:NestedSelector
              tableId: LockerFillSalvageMedic

- type: entity
  id: LockerSalvageMedicFilled
  suffix: Filled
  parent: LockerSalvageMedic
  components:
    - type: EntityTableContainerFill
      containers:
        entity_storage: !type:AllSelector
          children:
            - !type:NestedSelector
              tableId: LockerFillSalvageMedic

# Salvage Lead/Medic Combo Large Locker
- type: entity
  id: LockerSalvageLeadMedicFilledHardsuit
  suffix: Filled, Hardsuit
  parent: LockerLargeSalvageLeadMedic
  components:
    - type: EntityTableContainerFill
      containers:
        entity_storage: !type:AllSelector
          children:
            - !type:NestedSelector
              tableId: FillSalvageLeadHardsuitSpatio
            - !type:NestedSelector
              tableId: LockerFillSalvageLead
            - !type:NestedSelector
              tableId: LockerFillSalvageSpecialist
            - !type:NestedSelector
              tableId: FillSalvageMedicHardsuitSpatio
            - !type:NestedSelector
              tableId: LockerFillSalvageMedic

- type: entity
  id: LockerSalvageLeadMedicFilled
  suffix: Filled
  parent: LockerLargeSalvageLeadMedic
  components:
    - type: EntityTableContainerFill
      containers:
        entity_storage: !type:AllSelector
          children:
            - !type:NestedSelector
              tableId: LockerFillSalvageLead
            - !type:NestedSelector
              tableId: LockerFillSalvageSpecialist
            - !type:NestedSelector
              tableId: LockerFillSalvageMedic

