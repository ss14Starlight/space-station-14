- type: loadoutEffectGroup
  id: SkilledCorpsman
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobCorpsman
      time: 54000 # 15 hrs

# Senior Time
- type: loadoutEffectGroup
  id: VeteranCorpsman
  effects:
  - !type:JobRequirementLoadoutEffect
