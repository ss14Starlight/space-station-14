# Senior Time
- type: loadoutEffectGroup
  id: SeniorMailTechnician
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobMailTech
      time: 216000 # 60 hrs


# Jumpsuits
- type: loadout
  id: MailTechnicianJumpsuit
  equipment:
    jumpsuit: ClothingUniformJumpsuitMail

- type: loadout
  id: MailTechnicianJumpskirt
  equipment:
    jumpsuit: ClothingUniformJumpskirtMail

- type: loadout
  id: MailTechnicianJumpsuitSenior
  effects:
  - !type:GroupLoadoutEffect
    proto: SeniorMailTechnician
  equipment:
    jumpsuit: ClothingUniformJumpsuitSeniorMail

- type: loadout
  id: MailTechnicianJumpskirtSenior
  effects:
  - !type:GroupLoadoutEffect
    proto: SeniorMailTechnician
  equipment:
    jumpsuit: ClothingUniformJumpskirtSeniorMail

# Head/Eyes (Works for both)
- type: loadout
  id: MailTechnicianHeadVisor
