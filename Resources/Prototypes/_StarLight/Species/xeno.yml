- type: species
  id: Xeno
  name: Xeno
  roundStart: true
  prototype: MobXenoRace
  sprites: MobXenoRaceSprites
  markingLimits: MobXenoRaceMarkingLimits
  dollPrototype: MobXenoRaceDummy
  skinColoration: Hues
  maleFirstNames: names_xeno
  femaleFirstNames: names_xeno
  naming: First
  minHeight: 0.95
  defaultHeight: 1
  maxHeight: 1.05
  standardSize: 170
  standardWeight: 70
  standardDensity: 110
  customName: true
  requirement: RaceReq

- type: speciesBaseSprites
  id: MobXenoRaceSprites
  sprites:
    Head: MobXenoRaceHead
    Chest: MobXenoRaceTorso
    Tail: MobHumanoidAnyMarking
    LArm: MobXenoRaceLArm
    RArm: MobXenoRaceRArm
    LHand: MobXenoRaceLHand
    RHand: MobXenoRaceRHand
    LLeg: MobXenoRaceLLeg
    RLeg: MobXenoRaceRLeg
    LFoot: MobXenoRaceLFoot
    RFoot: MobXenoRaceRFoot

- type: markingPoints
  id: MobXenoRaceMarkingLimits
  onlyWhitelisted: true
  points:
    Tail:
      points: 1
      required: true
      defaultMarkings: [ XenoTailLong ]
    Overlay:
      points: 3
      required: false
    Chest:
      points: 1
      required: true
    Legs:
      points: 0
      required: false
    Arms:
      points: 0
      required: false
    Head:
      points: 1
      required: true
      defaultMarkings: [ XenoHeadLong ]

