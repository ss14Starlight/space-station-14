- type: entity
  id: ActionMechStartPiloting
  name: Pilot Mech
  description: Activate neural hijack routines to directly control the mech. Shed your mortal flesh.
  components:
    - type: Action
      useDelay: 1
      itemIconStyle: NoItem
      icon:
        sprite: _Starlight/Interface/Actions/actions_mecha.rsi
        state: mech_link_off
      iconOn:
        sprite: Interface/Actions/actions_mecha.rsi
        state: mech_night_vision_on
    - type: InstantAction
      event: !type:MechStartPilotingEvent

- type: entity
  id: ActionMechStopPiloting
  name: Stop Piloting
  description: Disengage link and return to your body. Later, meatbag!
  components:
    - type: Action
      useDelay: 1
      itemIconStyle: NoItem
      icon:
        sprite: _Starlight/Interface/Actions/actions_mecha.rsi
        state: mech_link_off
      iconOn:
        sprite: _Starlight/Interface/Actions/actions_mecha.rsi
        state: mech_link_off
    - type: InstantAction
      event: !type:MechStopPilotingEvent
