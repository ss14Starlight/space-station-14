    sprite: _PV/Clothing/Head/Helmets/ussp_admiral_helmet.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
      head-vox:
      - state: equipped-HELMET-vox
      head-resomi:
      - state: equipped-HELMET-resomi
      head-felionoid:
      - state: equipped-HELMET-felionoid
      head-cyclorite:
      - state: equipped-HELMET-cyclorite
      head-vulpkanin:
      - state: equipped-HELMET-vulpkanin
      head-avali:
      - state: equipped-HELMET-avali
  - type: ToggleableVisuals
    clothingVisuals:
      head:
      - state: equipped-HELMET-unshaded
        shader: unshaded
      head-vox:
      - state: equipped-HELMET-unshaded-vox
        shader: unshaded
      head-resomi:
      - state: equipped-HELMET-unshaded-resomi
        shader: unshaded
      head-felionoid:
      - state: equipped-HELMET-unshaded-felionoid
        shader: unshaded
      head-cyclorite:
      - state: equipped-HELMET-unshaded-cyclorite
        shader: unshaded
      head-vulpkanin:
      - state: equipped-HELMET-unshaded-vulpkanin
        shader: unshaded
      head-avali:
      - state: equipped-HELMET-unshaded-avali
        shader: unshaded
