# AEGIS Hardsuit
- type: entity
  parent: [ClothingOuterHardsuitBase, BaseCentcommContraband]
  id: ClothingOuterHardsuitAegis
  name: AEGIS hardsuit
  description: An advanced armored hardsuit for high-risk operations.
  components:
  - type: Sprite
    sprite: _PV/Clothing/OuterClothing/Hardsuits/aegis.rsi
  - type: Clothing
    sprite: _PV/Clothing/OuterClothing/Hardsuits/aegis.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: ExplosionResistance
    damageCoefficient: 0.25
  - type: FireProtection
    reduction: 0.8
  - type: StaminaResistance
    damageCoefficient: 0.0
  - type: Pierceable
    level: Rock
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.30
        Slash: 0.30
        Piercing: 0.25
        Heat: 0.30
        Radiation: 0.30
        Caustic: 0.30
    staminaModifier: 0.0
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 1.0
  - type: HeldSpeedModifier
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHeavy
      params:
        volume: -6
        variation: 0.09
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitAegis
  - type: Tag
    tags:
    - Hardsuit
    - WhitelistChameleon
    - CorgiWearable
    - IPCExternalCooling
  - type: Item
    size: Huge

- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase, BaseCentcommContraband]
  id: ClothingHeadHelmetHardsuitAegis
  categories: [HideSpawnMenu]
  name: AEGIS hardsuit helmet
  description: A matching helmet for the AEGIS hardsuit.
  components:
  - type: Sprite
    sprite: _PV/Clothing/Head/Hardsuits/aegis_helmet.rsi
  - type: Clothing
    sprite: _PV/Clothing/Head/Hardsuits/aegis_helmet.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
  - type: ToggleableVisuals
    clothingVisuals:
      head:
      - state: equipped-HELMET-unshaded
        shader: unshaded
  - type: PointLight
    color: "#00ffee"
    radius: 6
    energy: 5
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.85
  - type: Tag
    tags:
    - WhitelistChameleon
