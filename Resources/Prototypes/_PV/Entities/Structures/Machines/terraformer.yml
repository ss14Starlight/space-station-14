- type: entity
  id: TerraformerMachine
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: terraformer
  description: A machine designed to slowly convert barren terrain into habitable ground.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true

  - type: Sprite
    sprite: Structures/Machines/terraformer.rsi
    noRot: true
    layers:
    - state: icon
    - state: running
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]

  - type: Icon
    sprite: Structures/Machines/terraformer.rsi
    state: icon

  - type: Physics
    bodyType: Static
    canCollide: true

  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer

  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

  - type: ApcPowerReceiver
    powerLoad: 500

  - type: Terraformer
    active: true
    fuel: 0
    maxFuel: 100
    fuelPerSecond: 1
    fuelPerBiomass: 10
    biomassStack: Biomass
    radius: 5
    tileConvertCooldown: 2
    sourceTiles:
    - FloorAsteroidSand
    targetTile: FloorGrass
    atmosCooldown: 0.5
    targetPressure: 101.325
    maxPressure: 110
    gasMolesPerTile: 2
    scrubGases: true
    scrubCooldown: 1
    scrubMolesPerTile: 1
    targetScrubMoles: 0
    scrubbedGases:
    - CarbonDioxide
    - Plasma
    - Tritium
    - NitrousOxide
    createBarriers: true
    barrierPrototype: TerraformerAtmosBarrier
    barrierRadius: 6
    barrierRefreshCooldown: 5

  - type: Appearance

  - type: DeviceNetwork
    deviceNetId: Wired

  - type: DeviceLinkSink
    ports:
    - TerraformerReceiver

  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }

  - type: WiresPanel

  - type: LitOnPowered

  - type: PointLight
    color: "#4aff70"
    radius: 3
    energy: 0.7
    enabled: false
    castShadows: false