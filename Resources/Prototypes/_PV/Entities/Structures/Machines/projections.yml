- type: entity
  id: TerraformerAtmosBarrier
  name: terraforming atmos barrier
  description: An atmospheric containment barrier generated by a terraformer.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true

  - type: Sprite
    sprite: Structures/Holo/holofan.rsi
    state: icon

  - type: Physics
    bodyType: Static
    canCollide: false

  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"

  - type: Airtight
    noAirWhenFullyAirBlocked: false