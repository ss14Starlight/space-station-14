- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseTreePV
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: Overdoors
    offset: 0,0.5
  - type: Occluder
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Log:
            min: 2
            max: 5
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 190
        mask:
        - FullTileMask
        layer:
        - WallLayer

- type: entity
  abstract: true
  parent: BaseTreePV
  id: BaseFloraTreeOakPV
  name: oak tree
  description: A sturdy oak tree grown from a sapling by a terraformer.
  components:
  - type: Sprite
    sprite: _PV/Structures/Flora/Trees/flora_oak_tree.rsi

- type: entity
  parent: BaseFloraTreeOakPV
  id: FloraTreeOakPVTree01
  components:
  - type: Sprite
    state: tree01

- type: entity
  parent: BaseFloraTreeOakPV
  id: FloraTreeOakPVTree02
  components:
  - type: Sprite
    state: tree02

