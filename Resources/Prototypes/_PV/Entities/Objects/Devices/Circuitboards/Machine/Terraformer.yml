- type: entity
  id: TerraformerMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: terraformer machine board
  description: A machine printed circuit board for a terraformer.
  components:
  - type: Sprite
    state: science
  - type: MachineBoard
    prototype: TerraformerMachine
    stackRequirements:
      Manipulator: 2
      Glass: 1
      Cable: 5
    tagRequirements:
      GlassBeaker:
        amount: 1
        defaultPrototype: Beaker
      Igniter:
        amount: 1
        defaultPrototype: Igniter

