- type: gameMap
  id: VerdantElkridge
  mapName: 'Elkridge Depot'
  mapPath: /Maps/_PV/Stations/PVElkridge.yml
  minPlayers: 15
  maxPlayers: 75
  stations:
    VerdantElkridge:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Elkridge Depot {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'DS'

        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_elkridge.yml

        - type: StationCargoShuttle
          path: /Maps/Shuttles/cargo_elkridge.yml
        - type: StationJobs
          availableJobs:
            # command
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]

            # service
            Bartender: [ 2, 2 ]
            Botanist: [ 1, 2 ]
            Chef: [ 2, 2 ]
            Janitor: [ 2, 2 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            Reporter: [ 1, 2 ]
            ServiceWorker: [ 2, 2 ]
            Performer: [ 2, 2 ]

            # engineering
            AtmosphericTechnician: [ 2, 3 ]
            StationEngineer: [ 4, 5 ]
            TechnicalAssistant: [ 2, 2 ]

            # medical
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 4, 5 ]
            MedicalIntern: [ 2, 2 ]
            Paramedic: [ 2, 2 ]
            Surgeon: [ 1, 1 ]
            Psychologist: [ 1, 1 ]

            # science
            Scientist: [ 3, 4 ]
            ResearchAssistant: [ 2, 2 ]
            Roboticist: [ 2, 2 ]

            # security
            Warden: [ 1, 1 ]
            DutyOfficer: [ 1, 1 ]
            SecurityOfficer: [ 5, 6 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 3, 4 ]
            Brigmedic: [ 1, 1 ]

            # supply
            SalvageSpecialist: [ 3, 3 ]
            MiningSpecialist: [ 2, 3 ]
            CargoTechnician: [ 2, 3 ]
            MailTech: [ 1, 2 ]
            SalvageLead: [ 1, 1 ]

            # civilian
            Assistant: [ -1, -1 ]
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]

            # silicon
            StationAi: [ 1, 1 ]
            Borg: [ 2, 3 ]

            # law
            Magistrate: [ 1, 1 ]
            IAA: [ 2, 2 ]

            # representatives
            BlueShield: [ 1, 1 ]
            NanoTrasenRepresentative: [ 1, 1 ]
            NanotrasenCareerTrainer: [ 1, 2 ]
