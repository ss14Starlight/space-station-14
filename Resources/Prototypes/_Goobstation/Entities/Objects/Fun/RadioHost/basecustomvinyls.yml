# For Vinyls with custom Vinyl sprites. All other Vinyls should use layering to achieve their appearance. See base.yml file for directions.
- type: entity
  parent: BaseVinylDisc
  abstract: true
  id: BaseVinylAI
  components:
  - type: Sprite
    state: ai-vinyl-disc

- type: entity
  parent: BaseVinylDisc
  abstract: true
  id: BaseVinylDevil
  components:
  - type: Sprite
    state: devil-vinyl-disc

- type: entity
  parent: BaseVinylDisc
  abstract: true
  id: BaseVinylFloaty
  components:
  - type: Sprite
    state: floaty-vinyl-disc

- type: entity
  parent: BaseVinylDisc
  abstract: true
  id: BaseVinylForgotten
  components:
  - type: Sprite
    state: forgotten-vinyl-disc

- type: entity
  parent: BaseVinylDisc
  abstract: true
  id: BaseVinylTTD
  components:
  - type: Sprite
    state: ttd-vinyl-disc

