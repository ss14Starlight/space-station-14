- type: entity
  name: M27A1
  parent: [BaseTSFContraband, BaseWeaponRifle]
  id: WeaponRifleAnnie
  description: A heavy automatic rifle chambered in .45 Magnum for suppression and hard-target interdiction. Originally fielded by TSF expeditionary units, the M27A1 later became a common sight in corporate armories supporting hazardous frontier and terraforming operations.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Rifles/annie.rsi # Mono
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item # Mono
    sprite: _Mono/Objects/Weapons/Guns/Rifles/annie_inhands_32x.rsi
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Rifles/annie_inhands_32x.rsi
  - type: Gun
    availableModes:
    - FullAuto
    - Burst
    burstFireRate: 12
    burstCooldown: 0.8
    shotsPerBurst: 4
    fireRate: 6.5
    projectileSpeed: 42.5 # Mono
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/m90.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/batrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineMagnumRifleSP
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineMagnumSubMachineGun
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeMagnumSP
        priority: 1
        whitelist:
          tags:
            - CartridgeMagnum
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance


- type: entity
  name: CS WSPR-45
  parent: [BaseSyndicateContraband, BaseWeaponRifle]
  id: WeaponRifleWSPR
  description: A suppressed .45 Magnum battle rifle developed by Cybersun for covert interdiction teams and deniable security operations. The WSPR-45 combines an integrated barrel suppressor with a compact burst-fire action, making it a favorite wherever discretion and overkill are both mission requirements.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Rifles/wspr.rsi # Mono
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item # Mono
    sprite: _Mono/Objects/Weapons/Guns/Rifles/wspr_inhands_32x.rsi
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Rifles/wspr_inhands_32x.rsi 
  - type: GunWieldBonus
    minAngle: -14
    maxAngle: -41
  - type: Gun
    availableModes:
    - Burst
    selectedMode: Burst
    burstFireRate: 14
    burstCooldown: 0.4 
    projectileSpeed: 45 
    fireRate: 7.5 
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/1suppres.ogg 
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineMagnumRifleSP
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineMagnumSubMachineGun
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeMagnumSP
        priority: 1
        whitelist:
          tags:
            - CartridgeMagnum
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

