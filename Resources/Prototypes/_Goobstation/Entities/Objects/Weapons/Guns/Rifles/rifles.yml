- type: entity
  name: TCA M27 Annie 
  parent: [BaseTSFContraband, BaseWeaponRifle] 
  id: WeaponRifleAnnie
  description: A beast designed to shoulder the weight of impossible missions. Uses .45 magnum ammo.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Rifles/annie.rsi # Mono
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item # Mono
    sprite: _Mono/Objects/Weapons/Guns/Rifles/annie_inhands_32x.rsi
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Rifles/annie_inhands_32x.rsi
  - type: Gun
    availableModes:
    - FullAuto
    - Burst
    burstFireRate: 12
    burstCooldown: 0.8
    shotsPerBurst: 4
    fireRate: 6.5
    projectileSpeed: 42.5 # Mono
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/m90.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/batrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineMagnumRifleSP
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineMagnumSubMachineGun
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeMagnumSP
        priority: 1
        whitelist:
          tags:
            - CartridgeMagnum
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance


- type: entity
  name: CS KMP-WSPR 
  parent: [BaseSyndicateContraband, BaseWeaponRifle] # Mono - C3
  id: WeaponRifleWSPR
  description: A cutting-edge rifle from Cybersun with an integrated barrel suppressor. Versatile, reliable, Syndicate-approved. Uses .45 magnum ammo.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Rifles/wspr.rsi # Mono
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item # Mono
    sprite: _Mono/Objects/Weapons/Guns/Rifles/wspr_inhands_32x.rsi
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/Rifles/wspr_inhands_32x.rsi # Mono
  - type: GunWieldBonus
    minAngle: -14
    maxAngle: -41
  - type: Gun
    availableModes:
    - Burst
    selectedMode: Burst
    burstFireRate: 20 # Mono
    burstCooldown: 0.4 # Mono
    projectileSpeed: 45 # Mono
    fireRate: 7.5 # Mono, does nothing because its burst only but it makes it clear it can fire at this rate.
    soundGunshot:
      path: /Audio/_Starlight/Weapons/Guns/Gunshots/1suppres.ogg # Mono change - Changed audio path
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineMagnumRifleSP
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineMagnumSubMachineGun
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeMagnumSP
        priority: 1
        whitelist:
          tags:
            - CartridgeMagnum
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

