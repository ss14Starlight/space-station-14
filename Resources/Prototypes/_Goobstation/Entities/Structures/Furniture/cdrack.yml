- type: entity
  id: CdRack
  parent: BaseStructure
  name: CD rack
  description: Mostly filled with CDs.
  components:
  - type: Sprite
    sprite: _Starlight/Structures/Furniture/cdrack.rsi
    snapCardinals: true
    layers:
      - state: base
      - state: spine0
        map: [ "spine0" ]
        visible: false
      - state: spine1
        map: [ "spine1" ]
        visible: false
      - state: spine2
        map: [ "spine2" ]
        visible: false
      - state: spine3
        map: [ "spine3" ]
        visible: false
      - state: spine4
        map: [ "spine4" ]
        visible: false
      - state: spine5
        map: [ "spine5" ]
        visible: false
      - state: spine6
        map: [ "spine6" ]
        visible: false
      - state: spine7
        map: [ "spine7" ]
        visible: false
      - state: spine8
        map: [ "spine8" ]
        visible: false
      - state: spine9
        map: [ "spine9" ]
        visible: false
  - type: Appearance
  - type: DiscSpines # Starlight - each spine in the colour of its CD case
    container: storagebase
    count: 10
    bareColor: "#ccd6e3"
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 2
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Tag
    tags:
    - Structure
    - Wooden
  - type: Transform
    anchored: true
    noRot: true
  - type: Anchorable
  - type: Storage
    grid:
    - 0,0,0,9
    whitelist:
      tags:
        - CD
        - CDCase # Starlight
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: InteractionOutline
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Construction
    graph: CdRackGraph
    node: CdRackNode
