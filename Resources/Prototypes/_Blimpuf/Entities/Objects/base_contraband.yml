# Additional tier and authorization mixins. Upstream bases are customized by Starlight partials.

- type: entity
  id: BaseContrabandTier4
  abstract: true
  components:
  - type: ScanDetectable
  - type: Contraband
    tier: Tier4

- type: entity
  id: BaseContrabandTier2
  abstract: true
  components:
  - type: Contraband
    tier: Tier2

- type: entity
  id: BaseContrabandTier3
  abstract: true
  components:
  - type: ScanDetectable
  - type: Contraband
    tier: Tier3

- type: entity
  id: BaseSiliconContraband
