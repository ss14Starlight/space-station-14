- type: entity
  id: BaseBartenderContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedJobs:
    - Bartender


- type: entity
  id: BaseWardenContraband
  parent: BaseRestrictedContraband
  abstract: true
  components:
  - type: Contraband
    allowedJobs:
    - Warden

- type: entity
  id: BaseDetectiveContraband
