- type: entity
  parent: WeaponNinjaChainSickle
  id: WeaponGrapplingGunSyndie
  name: grappler gun
  description: There's a heft to this grappling gun... you wonder what could possibly be inside.
  components:
  - type: GrapplingGun
    reelMassCoefficient: 200 # You can pull everyone.
    reelForce: 5000 # 1/4 as strong as Ninja Chain Sickle's reel-in, shouldn't be as strong as theirs.
    reelRate: 3 # 1/2ish as fast to reel in as the Ninja Chain Sickle
    ropeBreakPoint: 150000
    cycleSound: /Audio/Weapons/Guns/Empty/empty.ogg # Starlight, we don't have the Moffstation sound
    ropeSprite:
      sprite: Objects/Weapons/Guns/Launchers/grappling_gun.rsi
      state: rope
  - type: Ensnaring
    freeTime: 2.0
    breakoutTime: 6 # 1/5th as long as ninja chain breakout
    walkSpeed: 0.8
    sprintSpeed: 0.9
    staminaDamage: 100
    canThrowTrigger: true
    canMoveBreakout: true
    maxEnsnares: 1
  - type: Gun
    soundGunshot: /Audio/Weapons/Guns/Gunshots/harpoon.ogg
    fireRate: 0.5
    clumsyProof: true
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/grappling_gun.rsi
    layers:
    - state: base
    - state: base-unshaded
      map: ["unshaded"]
      visible: true
  - type: BasicEntityAmmoProvider
    proto: GrapplerHook
    capacity: 1
  - type: UseDelay
    delay: 1.5
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TetherVisualsStatus.Key:
        unshaded:
          True: {state: base-unshaded}
          False: {state: base-unshaded-off}
