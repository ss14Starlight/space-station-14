- type: entity
  name: stun baton
  parent: BaseItem
  id: BaseStunbaton
  abstract: true
  description: A stun baton for incapacitating people with. Actively harming with this is considered bad tone.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/stunbaton.rsi
  #Starlight Start
    layers:
    - state: stunbaton_on
      visible: true
      map: [ "enum.StunbatonVisualLayers.Stunbaton_on" ]
    - state: stunbaton_off
      visible: false
      map: [ "enum.StunbatonVisualLayers.Stunbaton_off" ]
    - state: stunbaton_nocell
      visible: false
      map: [ "enum.StunbatonVisualLayers.Stunbaton_nocell" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StunbatonVisuals.Stunbaton_on:
        enum.StunbatonVisualLayers.Stunbaton_on:
          True: { visible: true }
          False: { visible: false }
      enum.StunbatonVisuals.Stunbaton_off:
        enum.StunbatonVisualLayers.Stunbaton_off:
          True: { visible: true }
          False: { visible: false }
      enum.StunbatonVisuals.Stunbaton_nocell:
        enum.StunbatonVisualLayers.Stunbaton_nocell:
          True: { visible: true }
          False: { visible: false }
  - type: Stunbaton
    energyPerUse: 36 # from 50 to account for medium power cells. (720 charge with 36 per use = 20 hits)
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        #Starlight Start
        blacklist:
          tags:
          - MechReactor
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: PowerCellDraw
    drawRate: 1.5
  - type: ToggleCellDraw
  #Starlight End
  - type: ItemToggle
    predictable: false
  # ES START
#    soundActivate:
#      collection: sparks
#      params:
#        variation: 0.250
  # ES END
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
  - type: ItemTogglePrefix
    prefixOn: on
    prefixOff: off
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Blunt: 0
    deactivatedSoundOnHit: #starlight
      collection: GenericHit #starlight
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 7
    bluntStaminaDamageFactor: 2.0
    angle: 60
    animation: WeaponArcThrust
    soundHit: #starlight
      collection: GenericHit #starlight
  # ES START
  - type: ESSparkOnItemToggle
    count: 1
    sparkPrototype: SLEffectSparksBaton # Starlight, smaller sparks
  # ES END
  - type: StaminaDamageOnHit
    damage: 35
    sound: /Audio/Weapons/egloves.ogg
  - type: StaminaDamageOnCollide
    damage: 35
    sound: /Audio/Weapons/egloves.ogg
  - type: LandAtCursor # it deals stamina damage when thrown
  # - type: Battery
  #   maxCharge: 1000
  #   startingCharge: 1000
  - type: UseDelay
  - type: Item
    heldPrefix: off
    size: Normal
  - type: Clothing
    sprite: Objects/Weapons/Melee/stunbaton.rsi
    quickEquip: false
    slots:
    - Belt
  - type: DisarmMalus
    malus: 0.225
  - type: StaticPrice
    price: 80
  - type: Riggable
  - type: SolutionManager
    solutions:
    - SolutionRiggable
  - type: InjectableSolution
    solution: battery
  - type: DrawableSolution
    solution: battery
  - type: Explosive
    explosionType: Default
    intensitySlope: 1.5
    maxIntensity: 200
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Plastic: 100
  - type: GuideHelp
    guides:
    - Security
    - Antagonists
