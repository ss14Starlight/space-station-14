- type: entity
  parent: BaseWall
  id: WallBrass
  name: brass wall
  components:
    - type: Sprite
      sprite: _Blimpuf/Structures/Walls/brass.rsi
    - type: WallReplacementMarker
    - type: Construction
      graph: Girder
      node: wall
    - type: Icon
      sprite: _Blimpuf/Structures/Walls/brass.rsi
    - type: RCDDeconstructable
      cost: 6
      delay: 8
      fx: EffectRCDDeconstruct8
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 400
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalSlam
        - trigger:
            !type:DamageTrigger
            damage: 200
          behaviors:
            - !type:PlaySoundBehavior
              sound:
                collection: MetalSlam
            - !type:ChangeConstructionNodeBehavior
              node: girder
            - !type:DoActsBehavior
              acts: ["Destruction"]
    - type: IconSmooth
      key: walls
      base: solid

- type: entity
  parent: WallDiagonalBase
  id: WallBrassDiagonal
  name: brass wall
  components:
    - type: Sprite
      drawdepth: Walls
      sprite: _Blimpuf/Structures/Walls/brass_diagonal.rsi
      state: state0
    - type: Icon
      sprite: _Blimpuf/Structures/Walls/brass_diagonal.rsi
      state: state0
    - type: Ricochetable
      chance: 0.4
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 400
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalSlam
        - trigger:
            !type:DamageTrigger
            damage: 200
          behaviors:
            - !type:ChangeConstructionNodeBehavior
              node: girder
            - !type:PlaySoundBehavior
              sound:
                collection: MetalSlam
            - !type:DoActsBehavior
              acts: ["Destruction"]


- type: entity
  parent: BaseWall
  id: WallReinforcedBrass
  name: reinforced brass wall
  components:
  - type: Pierceable
    level: HardenedMetal
  - type: Ricochetable
    chance: 0.75
  - type: Sprite
    sprite: _Blimpuf/Structures/Walls/brass.rsi
  - type: Icon
    sprite: _Blimpuf/Structures/Walls/brass.rsi
    state: rgeneric
  - type: Construction
    graph: Girder
    node: reinforcedWall
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: walls
    base: reinf_over
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ReinforcedWallVisuals.DeconstructionStage:
        ReinforcedWallVisualLayers.Deconstruction:
          -1: { visible: false }
          0: { state: reinf_construct-0, visible: true}
          1: { state: reinf_construct-1, visible: true}
          2: { state: reinf_construct-2, visible: true}
          3: { state: reinf_construct-3, visible: true}
          4: { state: reinf_construct-4, visible: true}
          5: { state: reinf_construct-5, visible: true}
  - type: ReinforcedWallReplacementMarker
  - type: StaticPrice
    price: 250
  - type: RadiationBlocker
    resistance: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 2000

