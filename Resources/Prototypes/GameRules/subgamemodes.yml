- type: entity
  parent: BaseGameRule
  id: Thief
  components:
  - type: GameRule # Starlight start
    minPlayers: 5 # Starlight
    delay:
      min: 240 # Delay their start so there can be some calm at the start.
      max: 420 # Starlight end
  - type: ThiefRule
#  - type: AntagObjectives # Starlight start
#    objectives: # We won't be using this, we'll be taking it from GroupOuter instead so we can roll for Master Thief
#    - EscapeThiefShuttleObjective # Starlight end
  - type: AntagRandomObjectives
    sets:
#    - groups: ThiefBigObjectiveGroups # Starlight start
#      prob: 0.7
#      maxPicks: 1
    - groups: ThiefObjectiveGroupOuter # Replaced with outer group, so we can *finally* roll the escape objective more reliably.
      maxPicks: 10
    maxDifficulty: 3 # Starlight end. Ultrapop + ton of new targets means some objectives become really easy in the chaos.
  - type: AntagSelection
    agentName: thief-round-end-agent-name
    selectionTime: PrePlayerSpawn
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Thief
      playerRatio: 26 # Starlight
      range:
        min: 1
        max: 6 # Starlight
  - type: DynamicRuleCost
    cost: 75

# Needs testing
- type: entity
  parent: BaseWizardRule
  id: SubWizard
  components:
  - type: GameRule
    cancelPresetOnTooFewPlayers: false
  - type: AntagSelection # Starlight start
    agentName: wizard-round-end-name
    antags:
    - !type:LinearAntagCount
      proto: Wizard
      playerRatio: 55
      range:
        min: 1
        max: 4 # Starlight end

- type: entity
  parent: BaseGameRule
  id: SubXenoborgs
  components:
  - type: XenoborgsRule
  - type: RuleGrids
  - type: GameRule
    minPlayers: 20 # Starlight
    cancelPresetOnTooFewPlayers: false
  - type: DynamicRuleCost # Starlight
    cost: 150 # Starlight
