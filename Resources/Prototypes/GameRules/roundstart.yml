- type: entity
  id: BaseGameRule
  abstract: true
  components:
  - type: GameRule

- type: entity
  parent: BaseGameRule
  id: BaseRoundstartAntagRule
  abstract: true
  components:
  - type: AntagSelection
    selectionTime: PrePlayerSpawn

- type: entity
  parent: BaseGameRule
  id: RespawnDeadRule
  components:
  - type: RespawnDeadRule
    alwaysRespawnDead: true
  - type: RespawnTracker
    respawnDelay: 10
    deleteBody: false

- type: entity
  parent: BaseGameRule
  id: SubGamemodesRule
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.4 #SL 0.5 -> 0.4 to account for more subgamemodes existing
    - id: SLChangeling #Starlight lings
      prob: 0.20 #0.4 -> 0.25 to account for more subgamemodes existing now
    - id: VampireLess # Starlight reworked
      prob: 0.20 # Starlight
    - id: SubWizard
      prob: 0.05 # Starlight. We can go back down to 0.05, since they scale now.
    #- id: SubXenoborgs # Starlight, subgamemode replaced with SubXenoborgs
    #  prob: 0.05 # Starlight start, Equalizing subgamemodes
    #- id: SubBrighteye # Brighteye is disabled until more work is put in.
    #  prob: 0.05
    - id: SiliconLiberation
      prob: 0.20 #Starlight end

- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleNoWizard
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.42 # Starlight start, 0.5 -> 0.4 to account for more subgamemodes existing
    - id: SLChangeling # StarlightLings
      prob: 0.20 #0.4 -> 0.25 to account for more subgamemodes existing now
    - id: VampireLess # Reworked
      prob: 0.20
    #- id: SubXenoborgs # Starlight, subgamemode replaced with SubXenoborgs
    #  prob: 0.05
    #- id: SubBrighteye
    #  prob: 0.05
    - id: SiliconLiberation
      prob: 0.20 #Starlight end

- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleNoXenoborg
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.62 # Starlight. Its a tamer mode, high thief chance.
    - id: SLChangeling # Starlight Lings
      prob: 0.20 # Starlight, Xenoborgs need a little bit of a distraction
    - id: VampireLess # Starlight reworked
      prob: 0.20 # Starlight, Xenoborgs need a little bit of a distraction
    - id: SubWizard
      prob: 0.05 # Starlight Space is dangerous, yo.
    #- id: SubBrighteye # Starlight
    #  prob: 0.05
    - id: SiliconLiberation #Starlight
      prob: 0.20 #Starlight

- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleNoWizardNoXenoborg
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.70 # Starlight start. Most likely
    - id: SLChangeling # Lings
      prob: 0.15
    - id: VampireLess # Reworked
      prob: 0.15
    #- id: SubBrighteye
    #  prob: 0.05
    - id: SiliconLiberation
      prob: 0.2 #Starlight end

- type: entity
  parent: BaseGameRule
  id: DummyNonAntagChance
  components:
  - type: SubGamemodes
    rules:
    - id: DummyNonAntag
      prob: 0.3

- type: entity
  id: DeathMatch31
  parent: BaseGameRule
  components:
  - type: DeathMatchRule
    rewardSpawns: !type:AllSelector
      children:
      - id: HealingToolbox
      - !type:GroupSelector
        children:
        - id: ClothingOuterArmorBasicSlim
        - id: ClothingHeadHelmetBasic
#        - id: SoapNT # Starlight, the soap sucks
        - id: Bola
        - id: Spear
        - id: ClothingShoesGaloshes
        - id: FoodPieBananaCream
        - id: Stimpack
  - type: KillCalloutRule
  - type: PointManager
  - type: RespawnDeadRule
  - type: RespawnTracker
    respawnDelay: 5

- type: entity
  id: InactivityTimeRestart
  parent: BaseGameRule
  components:
  - type: InactivityRule
    inactivityMaxTime: 600
    roundEndDelay: 10

- type: entity
  id: MaxTimeRestart
  parent: BaseGameRule
  components:
  - type: MaxTimeRestartRule
    roundMaxTime: 300
    roundEndDelay: 10

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseNukeopsRule
  components:
  - type: RandomMetadata #this generates the random operation name cuz it's cool.
    nameSegments:
    - NamesOperationPrefix
    - NamesOperationSuffix
    nameFormat: name-format-nuclear-operation
  - type: NukeopsRule
  - type: RuleGrids
  - type: AntagSelection
  - type: AntagLoadProfileRule
    speciesOverride: Human
    speciesOverrideBlacklist:
    #Species that do not work with nukies should be included in this list.
    #Once the issues are fixed the species should be removed from this list to be enabled.
    #Balance concerns are not a valid reason to disable a species, except for high-impact Nukie-specific exploits.
    #- Vox

- type: entity
  parent: [ BaseNukeopsRule, BaseRoundstartAntagRule ]
  id: Nukeops
  components:
  - type: GameRule
    minPlayers: 20
    # Starlight Start
    denyGameRules:
    - AbductorsSpawn
  - type: SubRule
    table: !type:GroupSelector
      children:
      - id: NukiePlanetSpawn
      - id: NukiePlanetSpawnWestern
      - id: NukiePlanetSpawnGeiger
  # Starlight end
  # Starlight - removing the LoadMapRule from here to instead handle it in the dynamic rules above
  #- type: LoadMapRule
  #  mapPath: /Maps/_Starlight/nukieplanet.yml
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: NukeopsCommander
    - !type:FixedAntagCount
      proto: NukeopsMedic
    - !type:LinearAntagCount
      proto: NukeopsOperative
      range:
        min: 1
        max: 4 # Starlight
  - type: DynamicRuleCost
    cost: 200

# Starlight start
# Such a small entry, not worth putting in its own file
- type: entity
  parent: Nukeops
  id: NukeopsLate
  components:
  - type: DynamicRuleCost
    cost: 300
# Starlight end

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseTraitorRule
  components:
  - type: TraitorRule
  # TODO: codewords in yml
  # TODO: uplink in yml
  - type: AntagRandomObjectives
    sets:
    - groups: TraitorObjectiveGroups
    maxDifficulty: 6 # Starlight. Ultrapop + ton of new targets means some objectives become really easy in the chaos.
  - type: AntagSelection
    agentName: traitor-round-end-agent-name
  - type: DynamicRuleCost
    cost: 125 # Starlight

- type: entity
  parent: [ BaseTraitorRule, BaseRoundstartAntagRule ]
  id: Traitor
  components:
  - type: GameRule
    minPlayers: 5
    delay:
      min: 240
      max: 420
  - type: AntagSelection
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Traitor
      playerRatio: 14.5 # Starlight
      range:
        min: 1
        max: 24 # Starlight

- type: entity
  id: TraitorReinforcement # This shouldn't be in here but I'm not sure where to put it :(
  parent: BaseTraitorRule
  components:
  - type: TraitorRule
    giveUplink: false
    giveBriefing: false
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: TraitorReinforcement

- type: entity
  id: Changeling
  parent: [BaseGameRule, BaseRoundstartAntagRule]
  components:
  - type: GameRule
    minPlayers: 25 # Starlight start
    delay: # It doesn't really make lore sense that you can "remember" you're a Changeling, but it should give everyone some calm at the start.
      min: 240
      max: 420 # Starlight end
  - type: AntagSelection
    lateJoinAdditional: true # Starlight
    agentName: changeling-round-end-agent-name
    antags:
    - !type:LinearAntagCount
      proto: Changeling
      playerRatio: 31.2 # Starlight
      range:
        min: 1
        max: 6 # Starlight
  - type: AntagObjectives
    objectives:
    - ChangelingSurviveObjective
  - type: DynamicRuleCost # Starlight
    cost: 150 # Starlight

- type: entity
  id: Revolutionary
  parent: [BaseGameRule, BaseRoundstartAntagRule]
  components:
  - type: GameRule
    minPlayers: 15
    delay: # Starlight start
      min: 240 # Delay it so people can have some calm at the start.
      max: 420 # Starlight end
  - type: RevolutionaryRule
  - type: SpecialLobbyContent
    music: "/Audio/_Starlight/Lobby/Liberation.ogg"
    background: RevClown
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    lateJoinAdditional: true # Starlight
    antags:
    - !type:LinearAntagCount
      proto: HeadRev
      playerRatio: 18 # Starlight
      range:
        min: 2 # Starlight
        max: 3
  - type: DynamicRuleCost
    cost: 200

- type: entity
  id: Sandbox
  parent: BaseGameRule
  components:
  - type: SandboxRule

- type: entity
  id: Secret
  parent: BaseGameRule
  components:
  - type: SecretRule

- type: entity
  abstract: true
  parent: BaseRoundstartAntagRule # Starlight
  id: BaseWizardRule
  components:
  - type: AntagObjectives
    objectives:
    - WizardSurviveObjective
    - WizardDemonstrateObjective
  - type: LoadMapRule
    mapPath: /Maps/_Starlight/WizardShuttle.yml #Starlight. wizard deserves their shuttle. and it had to be re-saved as a map to get it to work.
  - type: RuleGrids
  - type: AntagSelection
    agentName: wizard-round-end-name
    antags:
    - !type:FixedAntagCount
      proto: Wizard
  - type: AntagLoadProfileRule
    speciesOverride: Human
  - type: DynamicRuleCost # Starlight
    cost: 150 # Starlight

- type: entity
  parent: [ BaseWizardRule, BaseRoundstartAntagRule ]
  id: Wizard
  components:
  - type: GameRule
    minPlayers: 40 # Starlight
  - type: DynamicRuleCost
    cost: 150

- type: entity
  id: Zombie
  parent: [ BaseGameRule, BaseRoundstartAntagRule]
  components:
  - type: GameRule
    minPlayers: 20
    delay:
      min: 600
      max: 900
  - type: ZombieRule
  - type: AntagSelection
    lateJoinAdditional: true # Starlight
    antags:
    - !type:LinearAntagCount
      proto: InitialInfected
      playerRatio: 18 # Starlight
      range:
        min: 1
        max: 6
  - type: DynamicRuleCost
    cost: 200

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseXenoborgsRule
  components:
  - type: XenoborgsRule
  - type: RuleGrids
  - type: LoadMapRule
    gridPath: /Maps/Shuttles/mothership.yml
  - type: AntagMultipleRoleSpawner
    antagRoleToPrototypes:
      MothershipCore: [ MothershipCore ]
      Xenoborg: [ XenoborgEngi, XenoborgHeavy, XenoborgScout, XenoborgStealth ]
    pickAndTake: true
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    antags:
    - !type:FixedAntagCount
      proto: MothershipCore
    - !type:FixedAntagCount
      proto: Xenoborg
      count: 4
  - type: DynamicRuleCost
    cost: 200

- type: entity
  parent: [ BaseXenoborgsRule, BaseRoundstartAntagRule]
  id: Xenoborgs
  components:
  - type: GameRule
    minPlayers: 30

# This rule makes the chosen players unable to get other antag rules, as a way to prevent metagaming job rolls.
# Put this before antags assigned to station jobs, but after non-job antags (NukeOps/Wiz).
- type: entity
  id: DummyNonAntag
  parent: BaseGameRule
  components:
  - type: GameRule
    minPlayers: 5
  - type: AntagSelection
    selectionTime: PrePlayerSpawn # Pre-selection before jobs; assignment doesn't really matter though, we only care about the pre-selection to block other antags.
    removeUponFailedSpawn: false
    antags:
    - !type:LinearAntagCount
      proto: DummyAntag
      playerRatio: 30
      range:
        min: 1
        max: 2

- type: antagSpecifier
  parent: RestrictedAntag
  id: DummyAntag
  prefRoles: # Only Station bound roles.
  - InitialInfected
  - Traitor
  - Thief
  - HeadRev
  - Changeling # Starlight start
  - CosmicAntagCultist
  - Devil
  - SELFAgent
  - Vampire # Starlight end

# event schedulers

- type: entityTable
  id: BasicGameRulesTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
      - !type:NestedSelector
        tableId: BasicCalmEventsTable
      - !type:NestedSelector
        tableId: BasicAntagEventsTable
      - !type:NestedSelector
        tableId: ModerateAntagEventsTable
      - !type:NestedSelector
        tableId: CargoGiftsTable
      - !type:NestedSelector
        tableId: CalmPestEventsTable
      - !type:NestedSelector
        tableId: SpicyPestEventsTable

- type: entityTable
  id: DynamicGameRulesTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - !type:NestedSelector
      tableId: BasicCalmEventsTable
    - !type:NestedSelector
      tableId: BasicAntagEventsTable
    - !type:NestedSelector
      tableId: CargoGiftsTable
    - !type:NestedSelector
      tableId: CalmPestEventsTable
    - !type:NestedSelector
      tableId: SpicyPestEventsTable

- type: entity
  id: BasicStationEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: BasicGameRulesTable

- type: entity
  id: DynamicStationEventScheduler # this isn't the dynamic mode, but rather the station event scheduler used for dynamic
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: DynamicGameRulesTable

- type: entity
  id: RampingStationEventScheduler
  parent: BaseGameRule
  components:
  - type: RampingStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: BasicGameRulesTable

- type: entity
  id: SpaceTrafficControlEventScheduler # iff we make a selector for EntityTables that can respect StationEventComp restrictions, or somehow impliment them otherwise in said tables,
  parent: BaseGameRule                  # we can remerge this with the other schedulers, but it will silently fail due to that limitation without a separate scheduler to balance atm.
  components:
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 2700 # 45 mins #shows up like half way through shift.
    minMaxEventTiming:
      min: 1200 # 20 mins
      max: 7200 # 120 mins # you probably arent getting a second visitor shuttle in one round, but it is possible.
    scheduledGameRules: !type:NestedSelector
      tableId: SpaceTrafficControlTable

- type: entity
  id: SpaceTrafficControlFriendlyEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 1200 # 20 mins
    minMaxEventTiming:
      min: 600 # 10 mins
      max: 1800 # 30 mins
    scheduledGameRules: !type:NestedSelector
      tableId: UnknownShuttlesFriendlyTable

# variation passes
- type: entity
  id: BasicRoundstartVariation
  parent: BaseGameRule
  components:
  - type: RoundstartStationVariationRule
    rules:
    - id: BasicPoweredLightVariationPass
    - id: BasicTrashVariationPass
    - id: SolidWallRustingVariationPass
    - id: ReinforcedWallRustingVariationPass
    - id: CutWireVariationPass
    - id: BasicPuddleMessVariationPass
      prob: 0.99
      orGroup: puddleMess
    - id: BloodbathPuddleMessVariationPass
      prob: 0.01
      orGroup: puddleMess
    - id: SmugglerStashVariationPass
      prob: 0.90
    - id: SolarPanelDamageVariationPass
    - id: SolarPanelEmptyVariationPass
    - id: BasicDecalDirtVariationPass
    - id: BasicDecalGraffitiVariationPass
    - id: BasicDecalBurnsVariationPass
      prob: 0.50
      orGroup: monospaceDecals
    - id: BasicDecalDirtMonospaceVariationPass
      prob: 0.50
      orGroup: monospaceDecals
    # Starlight start
    - id: MaintenanceMonstersVariationPass
      prob: 0.2
    # Starlight end
