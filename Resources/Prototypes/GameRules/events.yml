    - id: BluespaceArtifact
    - id: BluespaceLocker
    - id: BreakerFlip
    - id: BureaucraticError
    - id: ClericalError
    - id: CockroachMigration
    - id: GasLeak
    - id: DoorLaggingVirus
    - id: IonStorm # its calm like 90% of the time smh
    - id: KudzuGrowth
    - id: MassHallucinations
    - id: MimicVendorRule
    - id: MouseMigration
    - id: PowerGridCheck
    - id: RandomSentience
    - id: SlimesSpawn
    - id: SolarFlare
    - id: SnakeSpawn
    - id: SpiderClownSpawn
    - id: SpiderSpawn
    - id: VentClog
    # Starlight Start
    - id: PsychicScreach
    - id: SecurityDrill
    - id: DoorRuntime
    - id: RadStorm
    - id: AuroraCaelus
    - id: SpaceWhale
    - id: CommunicationBlackout
    - id: NightShift
    - id: SyndicateDeadDrop
    - id: NanoChatSpamTiny
    - id: NanoChatSpamLowPop
    - id: NanoChatSpamMidPop
    - id: NanoChatSpamHighPop
    - id: NanoChatSpamUltraPop
    # Starlight End
    - id: MalignRiftSpawn # Funky

- type: entityTable
  id: BasicAntagEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: ClosetSkeleton
    - id: KingRatMigration
    - id: RevenantSpawn
    - id: RailroadingTerminator # Starlight
    - !type:NestedSelector
      tableId: DerelictBorgEventTable

- type: entityTable
  id: ModerateAntagEventsTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
    - id: DragonSpawn
    - id: NinjaSpawn
    - id: ParadoxCloneSpawn
    - id: ParadoxCrisisSpawn # Starlight
    - id: SleeperAgents
 #   - id: ZombieOutbreak starlight - no more midround zeds
    - id: LoneOpsSpawn
    - id: WizardSpawn
    - id: AbductorsSpawn # Starlight start
    #- id: SubXenoborgs
    #- id: BrighteyeSpawn
    #- id: TerrorSpidersSpawn
    - id: RailroadingTerminator
    - id: ColossusSpawn # Starlight end
    - id: EeepEvent # imp
    - !type:NestedSelector
      tableId: DerelictBorgEventTable

- type: entityTable
  id: DerelictBorgEventTable #For Derelict Borg spawns
  table: !type:GroupSelector
    children:
    - !type:GroupSelector # Standard NT Borgs
      weight: 80 # Starlight
      children:
        - id: DerelictEngineerCyborgSpawn
        - id: DerelictGenericCyborgSpawn
        - id: DerelictJanitorCyborgSpawn
        - id: DerelictMedicalCyborgSpawn
        - id: DerelictMiningCyborgSpawn
        - id: DerelictPurrfusCyborgSpawn # Starlight
    - !type:GroupSelector # Other Borgs
      weight: 15
      children:
        - id: DerelictBorgiSpawn # Starlight start
    - !type:GroupSelector # Derelict Xenoborgs
      weight: 5
      children:
        - id: DerelictHeavyXenoborgSpawn
        - id: DerelictEngiXenoborgSpawn
        - id: DerelictScoutXenoborgSpawn
        - id: DerelictStealthXenoborgSpawn
        - id: DerelictXenoBorgiSpawn
   #     - id: DerelictSyndicateAssaultCyborgSpawn # Starlight end - no more derelict Syndicate borgs

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseAntagGhostRoleRule
  components:
  - type: AntagSelection
    selectionTime: Never

- type: entity
  id: BaseStationEvent
  parent: BaseGameRule
  abstract: true
  components:
  - type: GameRule
    delay:
      min:  10
      max:  20

- type: entity
  id: BaseStationEventShortDelay
  parent: BaseGameRule
  abstract: true
  components:
  - type: GameRule
    delay:
      min:  10
      max:  20

- type: entity
  id: BaseStationEventLongDelay
  parent: BaseGameRule
  abstract: true
  components:
  - type: GameRule
    delay:
      min:  40
      max:  60

- type: entity
  id: AnomalySpawn
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    globalAnnouncement: false # Starlight
    startAnnouncementColor: "#18abf5"
    startAudio:
      path: /Audio/Announcements/announce.ogg
    weight: 8
    duration: 35
  - type: AnomalySpawnRule

- type: entity
  id: BluespaceArtifact
  parent: BaseStationEventShortDelay
  components:
  - type: GameRule
    delay:
      min:  30
      max:  30
  - type: StationEvent
    globalAnnouncement: false # Starlight
    startAnnouncementColor: "#18abf5"
    startAudio:
      path: /Audio/Announcements/announce.ogg
    weight: 8
    duration: 35
  - type: BluespaceArtifactRule

