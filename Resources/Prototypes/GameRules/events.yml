- type: entity
  id: ZombieOutbreak
  parent: BaseGameRule
  components:
  - type: StationEvent
    earliestStart: 90
    minimumPlayers: 40
    weight: 1 # Zombies was happening basically every single survival round, so now it's super rare
    duration: 1
    occursDuringRoundEnd: false
  - type: ZombieRule
  - type: AntagSelection
    antags:
    - !type:LinearAntagCount
      proto: InitialInfected
      range:
        min: 1
        max: 3
  - type: DynamicRuleCost
    cost: 200

- type: entity
  parent: [ BaseAntagGhostRoleRule, BaseNukeopsRule ]
  id: LoneOpsSpawn
  components:
  - type: StationEvent
    earliestStart: 55 # 🌟Starlight🌟 Casualization
    weight: 3 # 🌟Starlight🌟 Casualization
    minimumPlayers: 35 # 🌟Starlight🌟 Casualization
    duration: null # LoneOpsSpawn needs an infinite duration so that it inherits the NukeOpsRule things of an actually appropriate end scrreen (not always "Neutral outcome!") and... ending the game if the station is nuked.
  - type: RuleGrids
  - type: LoadMapRule
    gridPath: /Maps/Shuttles/ShuttleEvent/striker.yml
  - type: NukeopsRule
    roundEndBehavior: Nothing
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: LoneOp
  - type: DynamicRuleCost
    cost: 100 # Starlight

- type: entity
  parent: BaseTraitorRule
  id: SleeperAgents
  components:
  - type: StationEvent
    globalAnnouncement: false # Starlight
    earliestStart: 40 # 🌟Starlight🌟 Casualization
    weight: 6 # 🌟Starlight🌟 Casualization
    minimumPlayers: 15
    maxOccurrences: 1 # can only happen once per round
    startAnnouncement: station-event-communication-interception
    startAudio:
      path: /Audio/_Starlight/Announcements/attention.ogg
    duration: null # the rule has to last the whole round not 1 second
    occursDuringRoundEnd: false
  - type: AlertLevelInterceptionRule
  - type: AntagSelection
    antags:
    - !type:LinearAntagCount
      proto: TraitorSleeper
      playerRatio: 32 # Starlight
      range:
        min: 1
        max: 10 # Starlight

