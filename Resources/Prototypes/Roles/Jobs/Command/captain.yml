- type: job
  id: Captain
  name: job-name-captain
  description: job-description-captain
  playTimeTracker: JobCaptain
  whitelisted: true # Inferus
  requirements:
    - !type:DepartmentTimeRequirement
      department: Engineering
      time: 10h # Inferus
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 10h # Inferus
    - !type:DepartmentTimeRequirement
      department: Security
      time: 10h # Inferus
    # Inferus edit start - It's usually wise that caps should have at least BASIC knowledge of EVERY department!
    - !type:DepartmentTimeRequirement
      department: Science
      time: 10h
    - !type:DepartmentTimeRequirement
      department: Civilian
      time: 10h
    - !type:DepartmentTimeRequirement
      department: Cargo
      time: 10h
    # Inferus edit end
    - !type:DepartmentTimeRequirement
      department: Command
      time: 20h # Inferus
    - !type:TraitsRequirement # Starlight
      traits:
        - Muted
      inverted: true
  weight: 20
  startingGear: CaptainGear
  icon: "JobIconCaptain"
  joinNotifyCrew: true
  supervisors: job-supervisors-centcom
  accessGroups:
  - AllAccess
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: startingGear
  id: CaptainGear
  equipment:
    #shoes: ClothingShoesBootsLaceup #Starlight
    #eyes: ClothingEyesGlassesCommand #Starlight
    # gloves: ClothingHandsGlovesCaptain # Starlight
    id: CaptainPDA
    ears: ClothingHeadsetAltCommand
  storage:
    back:
    - Flash
    # - StationCharter

- type: chameleonOutfit
  id: CaptainChameleonOutfit
  job: Captain
  hasMindShield: true
  equipment:
    head: ClothingHeadHatCapcap
    eyes: ClothingEyesGlassesCommand
    mask: ClothingMaskGasCaptain
    neck: ClothingNeckCloakCap
