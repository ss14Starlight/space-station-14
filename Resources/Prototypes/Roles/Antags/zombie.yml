- type: antag
  id: InitialInfected
  name: roles-antag-initial-infected-name
  antagonist: true
  setPreference: true
  objective: roles-antag-initial-infected-objective
  guides: [ Zombies ]
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 24h # Starlight start. It's like legal raiding.
  - !type:DepartmentTimeRequirement # Mainly to know that you can treat yourself. Also teaches you what your primary target as an II is.
    department: Medical
    time: 4h
  - !type:SpeciesRequirement
    species:
    - IPC
    inverted: true
  playTimeTracker: AntagInitialInfected # Starlight end

- type: antagSpecifier
  parent: RestrictedAntag
  id: InitialInfected
  prefRoles: [ InitialInfected ]
  blacklist:
    components:
    - ZombieImmune
    - AntagImmune
  briefing:
    text: zombie-patientzero-role-greeting
    color: Plum
    sound: "/Audio/Ambience/Antag/zombie_start.ogg"
  allowNonHumans: true # Starlight
  components:
  - type: PendingZombie #less time to prepare than normal
    minInitialInfectedGrace: 300
    maxInitialInfectedGrace: 450
  - type: ZombifyOnDeath
  - type: IncurableZombie
  - type: InitialInfected
  mindRoles:
  - MindRoleInitialInfected

# TODO: Make it so creating new zombies uses antag prototypes! This saves a *lot* of boilerplate for conversion antags.

- type: antag
  id: Zombie
  name: roles-antag-zombie-name
  antagonist: true
  setPreference: false
  objective: roles-antag-zombie-objective
  guides: [ Zombies ]
  playTimeTracker: AntagZombie # Starlight
