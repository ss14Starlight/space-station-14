# Clandestine bioterror laboratory machines and flatpacks.

- type: entity
  id: SolClandestineSampleAnalyzer
  parent: [ BaseMachinePowered, BaseMajorContraband ]
  name: clandestine sample analyzer
  description: A portable analyzer for environmental microbial scrapings. Definitely not medical issue.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Sol/Structures/Machines/sample_analyzer.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.ClandestineLabVisualLayers.Base"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ClandestineLabVisuals.State:
        enum.ClandestineLabVisualLayers.Base:
          Off: { state: icon }
          On: { state: on }
          Running: { state: running }
          Open: { state: on }
  - type: ClandestineSampleAnalyzer
  - type: ContainerContainer
    containers:
      chamber: !type:Container
  - type: AccessReader
    access: [["SyndicateAgent"], ["Virology"]]
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 50
  - type: RefillableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: SolClandestineCultureIncubator
  parent: [ BaseMachinePowered, BaseMajorContraband ]
  name: clandestine culture incubator
  description: Warms nutrient media and environmental isolates into viable cultures.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Sol/Structures/Machines/culture_incubator.rsi
    snapCardinals: true
    layers:
    - state: off
      map: ["enum.ClandestineLabVisualLayers.Base"]
    - state: door_open
      map: ["enum.ClandestineLabVisualLayers.Door"]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ClandestineLabVisuals.State:
        enum.ClandestineLabVisualLayers.Base:
          Off: { state: off }
          On: { state: on }
          Running: { state: running }
          Open: { state: open }
        enum.ClandestineLabVisualLayers.Door:
          Off: { visible: false }
          On: { visible: false }
          Running: { visible: false }
          Open: { visible: true }
  - type: ClandestineCultureIncubator
  - type: ActivatableUI
    key: enum.CultureIncubatorUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.CultureIncubatorUiKey.Key:
        type: CultureIncubatorBoundUserInterface
  - type: ContainerContainer
    containers:
      chamber: !type:Container
  - type: AccessReader
    access: [["SyndicateAgent"], ["Virology"]]
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 80
  - type: RefillableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: SolClandestinePathogenSynthesizer
  parent: [ BaseMachinePowered, BaseMajorContraband ]
  name: clandestine pathogen synthesizer
  description: Assembles cultured chassis and trait isolates into a bounded custom strain.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Sol/Structures/Machines/pathogen_synthesizer.rsi
    snapCardinals: true
    layers:
    - state: off
      map: ["enum.ClandestineLabVisualLayers.Base"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ClandestineLabVisuals.State:
        enum.ClandestineLabVisualLayers.Base:
          Off: { state: off }
          On: { state: on }
          Running: { state: running }
          Open: { state: on }
  - type: ClandestinePathogenSynthesizer
  - type: ActivatableUI
    key: enum.PathogenSynthesizerUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.PathogenSynthesizerUiKey.Key:
        type: PathogenSynthesizerBoundUserInterface
  - type: ContainerContainer
    containers:
      substrateSlot: !type:ContainerSlot
      geneStorage: !type:Container
  - type: ItemSlots
    slots:
      substrateSlot:
        name: sol-pathogen-synth-ui-substrate-slot
        whitelist:
          components:
          - PathogenCulture
        swap: true
  - type: AccessReader
    access: [["SyndicateAgent"], ["Virology"]]
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 80
  - type: RefillableSolution
    solution: tank
  - type: ExaminableSolution
    solution: tank
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: [ BaseFlatpack, BaseMajorContraband ]
  id: SolClandestineSampleAnalyzerFlatpack
  name: sample analyzer flatpack
  description: A flatpack containing a clandestine environmental sample analyzer.
  components:
  - type: Flatpack
    entity: SolClandestineSampleAnalyzer

- type: entity
  parent: [ BaseFlatpack, BaseMajorContraband ]
  id: SolClandestineCultureIncubatorFlatpack
  name: culture incubator flatpack
  description: A flatpack containing a clandestine culture incubator.
  components:
  - type: Flatpack
    entity: SolClandestineCultureIncubator

- type: entity
  parent: [ BaseFlatpack, BaseMajorContraband ]
  id: SolClandestinePathogenSynthesizerFlatpack
  name: pathogen synthesizer flatpack
  description: A flatpack containing a clandestine pathogen synthesizer.
  components:
  - type: Flatpack
    entity: SolClandestinePathogenSynthesizer

- type: entity
  parent: [ BaseItem, BaseMajorContraband ]
  id: SolEnvironmentalScraper
  name: sterile environmental scraper
  description: A sterile scraper for collecting environmental microbial samples from grime, vents, and waste.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/mouth_swab.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: EnvironmentalScraper
    sterile: true

- type: entity
  parent: [ BaseAmmoProvider, BaseMajorContraband ]
  id: SolEnvironmentalScraperBox
  name: environmental scraper dispenser
  description: Dispenses sterile environmental scrapers for collecting microbial samples.
  components:
  - type: Sprite
    layers:
    - state: boxwide
    - state: swab
  - type: BallisticAmmoProvider
    whitelist:
      components:
      - EnvironmentalScraper
    proto: SolEnvironmentalScraper
    capacity: 30
  - type: Item
    size: Small

- type: entity
  parent: [ BaseItem, BaseMajorContraband ]
  id: SolMicrobialSample
  name: microbial sample
  description: An environmental microbial scraping awaiting analysis.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/mouth_swab.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: MicrobialSample

- type: entity
  parent: [ BaseItem, BaseMajorContraband ]
  id: SolPathogenCultureVial
  name: pathogen culture vial
  description: A cultured isolate ready for synthesis.
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/vial.rsi
    state: vial
  - type: Item
    size: Tiny
  - type: PathogenCulture

- type: entity
  parent: [ BaseItem, BaseMajorContraband ]
  id: SolPathogenCultureAmpoule
  name: pathogen culture ampoule
  description: A sealed culture dose suitable for food or surface contamination.
  components:
  - type: Sprite
    sprite: Objects/Specific/Chemistry/vial.rsi
    state: vial
  - type: Item
    size: Tiny
  - type: PathogenPayload
    kind: Food
    concentration: 5

- type: entity
  parent: [ BaseItem, BaseMajorContraband ]
  id: SolPathogenSurfaceApplicator
  name: surface culture applicator
  description: Applies a cultured strain to surfaces for contact transmission.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/mouth_swab.rsi
    state: icon
  - type: Item
    size: Small
  - type: PathogenPayload
    kind: Surface
    concentration: 4

- type: entity
  parent: [ BaseItem, BaseMajorContraband ]
  id: SolPathogenAerosolCanister
  name: aerosol culture canister
  description: Releases a cultured airborne pathogen load into the local tile atmosphere.
  components:
  - type: Sprite
    sprite: Objects/Tanks/generic.rsi
    state: icon
  - type: Item
    size: Small
  - type: PathogenPayload
    kind: Aerosol
    concentration: 6

- type: entity
  parent: [ BaseChemistryEmptyBottle, BaseMajorContraband ]
  id: SolCultureNutrientBottle
  name: culture nutrient bottle
  description: Nutrient medium for clandestine incubators.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: SolCultureNutrient
          Quantity: 30

- type: entity
  parent: [ BaseChemistryEmptyBottle, BaseMajorContraband ]
  id: SolCultureStabilizerBottle
  name: culture stabilizer bottle
  description: Stabilizer reagent required for pathogen synthesis.
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: SolCultureStabilizer
          Quantity: 30

- type: entity
  parent: BaseChemistryEmptyBottle
  id: SolSterilizineBottle
  name: sterilizine bottle
  components:
  - type: Label
    currentLabel: reagent-name-sol-sterilizine
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: SolSterilizine
          Quantity: 30

- type: entity
  parent: [ ClothingBackpackDuffel, BaseMajorContraband ]
  id: ClothingBackpackDuffelBioterrorLab
  name: bioterror deployment duffel
  description: Contains flatpacked clandestine lab equipment and limited reagents.
  components:
  - type: StorageFill
    contents:
    - id: SolClandestineSampleAnalyzerFlatpack
    - id: SolClandestineCultureIncubatorFlatpack
    - id: SolClandestinePathogenSynthesizerFlatpack
    - id: Multitool
    - id: SolEnvironmentalScraperBox
    - id: SolCultureNutrientBottle
      amount: 2
    - id: SolCultureStabilizerBottle
    - id: SolSterilizineBottle
      amount: 1
