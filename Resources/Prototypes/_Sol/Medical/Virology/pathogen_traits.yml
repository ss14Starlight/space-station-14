# Transmission / environmental genes
- type: pathogenTrait
  id: SolTraitContact
  name: sol-pathogen-trait-contact-name
  description: sol-pathogen-trait-contact-desc
  budgetCost: 1
  addTransmission: Contact

- type: pathogenTrait
  id: SolTraitAirborne
  name: sol-pathogen-trait-airborne-name
  description: sol-pathogen-trait-airborne-desc
  budgetCost: 2
  addTransmission: Airborne
  incompatibleWith:
  - SolTraitSterilantResist

- type: pathogenTrait
  id: SolTraitIngestion
  name: sol-pathogen-trait-ingestion-name
  description: sol-pathogen-trait-ingestion-desc
  budgetCost: 1
  addTransmission: Ingestion

- type: pathogenTrait
  id: SolTraitAerosolStable
  name: sol-pathogen-trait-aerosol-name
  description: sol-pathogen-trait-aerosol-desc
  budgetCost: 2
  environmentalPersistenceMultiplier: 1.75
  infectiveDoseMultiplier: 0.85

- type: pathogenTrait
  id: SolTraitEnvironmentalGrowth
  name: sol-pathogen-trait-growth-name
  description: sol-pathogen-trait-growth-desc
  budgetCost: 1
  environmentalPersistenceMultiplier: 1.4

- type: pathogenTrait
  id: SolTraitPersistent
  name: sol-pathogen-trait-persistent-name
  description: sol-pathogen-trait-persistent-desc
  budgetCost: 2
  environmentalPersistenceMultiplier: 2.0
  sterilantSusceptibilityMultiplier: 0.7

- type: pathogenTrait
  id: SolTraitSterilantResist
  name: sol-pathogen-trait-sterilant-name
  description: sol-pathogen-trait-sterilant-desc
  budgetCost: 2
  sterilantSusceptibilityMultiplier: 0.45
  incompatibleWith:
  - SolTraitAirborne

# Timing / virulence genes
- type: pathogenTrait
  id: SolTraitCultureYield
  name: sol-pathogen-trait-yield-name
  description: sol-pathogen-trait-yield-desc
  budgetCost: 1
  incubationMultiplier: 0.8

- type: pathogenTrait
  id: SolTraitIncubationSlow
  name: sol-pathogen-trait-slow-name
  description: sol-pathogen-trait-slow-desc
  budgetCost: 1
  incubationMultiplier: 1.5
  infectionChanceBonus: -0.05
  incompatibleWith:
  - SolTraitVirulent

- type: pathogenTrait
  id: SolTraitVirulent
  name: sol-pathogen-trait-virulent-name
  description: sol-pathogen-trait-virulent-desc
  budgetCost: 2
  lethalityBonus: 0.25
  infectionChanceBonus: 0.1
  incompatibleWith:
  - SolTraitIncubationSlow

# Symptom / expression genes
- type: pathogenTrait
  id: SolTraitCoughShed
  name: sol-pathogen-trait-cough-name
  description: sol-pathogen-trait-cough-desc
  budgetCost: 1
  coughChanceBonus: 0.08
  incompatibleWith:
  - SolTraitSneezeShed

- type: pathogenTrait
  id: SolTraitSneezeShed
  name: sol-pathogen-trait-sneeze-name
  description: sol-pathogen-trait-sneeze-desc
  budgetCost: 1
  sneezeChanceBonus: 0.08
  incompatibleWith:
  - SolTraitCoughShed

- type: pathogenTrait
  id: SolTraitDyspnea
  name: sol-pathogen-trait-dyspnea-name
  description: sol-pathogen-trait-dyspnea-desc
  budgetCost: 2
  symptomDamageBonus:
    types:
      Asphyxiation: 0.35
  incompatibleWith:
  - SolTraitHemorrhage

- type: pathogenTrait
  id: SolTraitHemorrhage
  name: sol-pathogen-trait-hemorrhage-name
  description: sol-pathogen-trait-hemorrhage-desc
  budgetCost: 2
  symptomDamageBonus:
    types:
      Bloodloss: 0.25
      Poison: 0.15
  incompatibleWith:
  - SolTraitDyspnea

# Organ tropism genes (mutually exclusive)
- type: pathogenTrait
  id: SolTraitOrganLiver
  name: sol-pathogen-trait-liver-name
  description: sol-pathogen-trait-liver-desc
  budgetCost: 1
  addTargetOrgans:
  - liver
  organDamageBonus: 0.05
  incompatibleWith:
  - SolTraitOrganLungs
  - SolTraitOrganHeart

- type: pathogenTrait
  id: SolTraitOrganLungs
  name: sol-pathogen-trait-lungs-name
  description: sol-pathogen-trait-lungs-desc
  budgetCost: 2
  addTargetOrgans:
  - lungs
  organDamageBonus: 0.06
  symptomDamageBonus:
    types:
      Asphyxiation: 0.2
  incompatibleWith:
  - SolTraitOrganLiver
  - SolTraitOrganHeart

- type: pathogenTrait
  id: SolTraitOrganHeart
  name: sol-pathogen-trait-heart-name
  description: sol-pathogen-trait-heart-desc
  budgetCost: 2
  addTargetOrgans:
  - heart
  organDamageBonus: 0.07
  symptomDamageBonus:
    types:
      Poison: 0.2
  incompatibleWith:
  - SolTraitOrganLiver
  - SolTraitOrganLungs

# Treatment vulnerability genes — without these, custom strains have no medical treatments.
- type: pathogenTrait
  id: SolTraitTreatAntiviral
  name: sol-pathogen-trait-treat-antiviral-name
  description: sol-pathogen-trait-treat-antiviral-desc
  budgetCost: 1
  addTreatments:
  - SolAntiviral
  incompatibleWith:
  - SolTraitTreatRibavirin

- type: pathogenTrait
  id: SolTraitTreatRibavirin
  name: sol-pathogen-trait-treat-ribavirin-name
  description: sol-pathogen-trait-treat-ribavirin-desc
  budgetCost: 2
  addTreatments:
  - SolRibavirin
  incompatibleWith:
  - SolTraitTreatAntiviral

- type: pathogenTrait
  id: SolTraitTreatCeftriaxone
  name: sol-pathogen-trait-treat-ceftriaxone-name
  description: sol-pathogen-trait-treat-ceftriaxone-desc
  budgetCost: 1
  addTreatments:
  - SolCeftriaxone
  incompatibleWith:
  - SolTraitTreatAmoxla

- type: pathogenTrait
  id: SolTraitTreatAmoxla
  name: sol-pathogen-trait-treat-amoxla-name
  description: sol-pathogen-trait-treat-amoxla-desc
  budgetCost: 1
  addTreatments:
  - Amoxla
  incompatibleWith:
  - SolTraitTreatCeftriaxone
