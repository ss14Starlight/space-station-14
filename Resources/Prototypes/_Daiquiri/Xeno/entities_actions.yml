#Отложить яйцо
- type: entity
  id: ActionAlienLayEgg
  name: Отложить яйцо
  description: Дети такие милые, когда убивают людей за вас.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: _Daiquiri/Xeno/Mobs/Aliens/AlienActionIcons.rsi
      state: Egg
    useDelay: 120
  - type: InstantAction
    event: !type:EggLayInstantActionEvent

#Строительство слизи
- type: entity
  id: ActionAlienWeb
  name: Пустить слизь
  description: Слизь - ваш друг и союзнить, распространяйте её чтобы замедлить ваших врагов, а ходьба по ней усиливает вашу регенерацию.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: _Daiquiri/Xeno/Mobs/Aliens/AlienActionIcons.rsi
      state: Web
    useDelay: 25
  - type: InstantAction
    event: !type:SpiderWebActionEvent

#Строительство стены
- type: entity
  id: ActionSpawnAlianWall
  name: Построить стену улья
  description: Возведите стену для защиты улья.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 20
    itemIconStyle: BigAction
    icon:
      sprite: _Daiquiri/Xeno/Mobs/Aliens/AlienActionIcons.rsi
      state: Wall
  - type: TargetAction
    range: 1.5
  - type: WorldTargetAction
    event: !type:WorldSpawnSpellEvent
      prototypes:
      - id: AlianWallSpawn
        amount: 1

#Строительство двери улья
- type: entity
  id: ActionSpawnAlienDoor
  name: Построить проход улья
  description: Органическая дверь, с доступом только у взрослых ксеноморфов.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    icon:
      sprite: _Daiquiri/Xeno/Mobs/Aliens/AlienActionIcons.rsi
      state: Door
  - type: TargetAction
    range: 1.5
  - type: WorldTargetAction
    event: !type:WorldSpawnSpellEvent
      prototypes:
      - id: AlienDoorSpawn
        amount: 1

#Строительство мембраны улья
- type: entity
  id: ActionSpawnAlienMembran
  name: Построить мембрану улья
  description: Тонкая мембрана, наносящая кислотные повреждения всем кто через неё ходит, но вам это не грозит.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 40
    itemIconStyle: BigAction
    icon:
      sprite: _Daiquiri/Xeno/Mobs/Aliens/AlienActionIcons.rsi
      state: Membran
  - type: TargetAction
    range: 1.5
  - type: WorldTargetAction
    event: !type:WorldSpawnSpellEvent
      prototypes:
      - id: AlianMembran
        amount: 1

#Орать(респрайт)
- type: entity
  id: ActionAlienScream
  name: Кричать
  description: Выпустите эмоции наружу.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    icon:
      sprite: _Daiquiri/Xeno/Mobs/Aliens/AlienActionIcons.rsi
      state: Scream
    checkCanInteract: false
  - type: InstantAction
    event: !type:ScreamActionEvent

#Драться(респрайт)
- type: entity
  id: ActionAlienCombatModeToggle
  name: "[color=red]Боевой режим[/color]"
  description: УБИВАТЬ УБИВАТЬ УБИВАТЬ УБИВАТЬ!
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    checkConsciousness: false
    icon: { sprite: _Daiquiri/Xeno/Mobs/Aliens/AlienActionIcons.rsi, state: NOcombat }
    iconOn: { sprite: _Daiquiri/Xeno/Mobs/Aliens/AlienActionIcons.rsi, state: combat }
    priority: -100
  - type: InstantAction
    event: !type:ToggleCombatActionEvent

- type: entity
  id: ActionAlienCombatModeToggleOff
  parent: ActionAlienCombatModeToggle
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    enabled: false
    autoPopulate: false
    priority: -100

#Ночное зрение
- type: entity
  id: ActionToggleLightingAlienNightVision
  name: Ночное зрение
  description: Переключите своё зрение в режим ночного зрения, чтобы видеть всё!
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: { sprite: _Daiquiri/Xeno/Mobs/Aliens/AlienActionIcons.rsi, state: NONightVision }
    iconOn: { sprite: _Daiquiri/Xeno/Mobs/Aliens/AlienActionIcons.rsi, state: NightVision }
    clientExclusive: true
    checkCanInteract: false
  - type: InstantAction
    event: !type:ToggleLightingActionEvent

