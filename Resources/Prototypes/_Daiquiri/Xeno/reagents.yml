#Кровь ксено
- type: reagent
  id: XenoBloodAcid
  parent: SulfuricAcid
  name: xeno-reagent-xeno-blood-acid-name
  group: Toxins
  desc: xeno-reagent-xeno-blood-acid-desc
  physicalDesc: xeno-reagent-xeno-blood-acid-physical-desc
  flavor: acid
  color: "#d9f500"

- type: reagent
  id: XenoNeuroAcid
  parent: SulfuricAcid
  name: xeno-reagent-xeno-neuro-acid-name
  group: Toxins
  desc: xeno-reagent-xeno-neuro-acid-desc
  physicalDesc: xeno-reagent-xeno-neuro-acid-physical-desc
  flavor: acid
  color: "#afdf1b"
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Caustic: 0.1
      - !type:Emote
        emote: Scream
        probability: 0.1
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          groups:
            Airloss: -15
            Brute: -15
            Toxin: -15
            Genetic: -15
          types:
            Caustic: 2
            Heat: -15
            Shock: -15
            Cold: -15
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "generic-reagent-effect-burning-insides" ]
        probability: 0.33
      - !type:Emote
        emote: Scream
        probability: 0.2

- type: reagent
  id: XenoNeuroAcidClean
  name: xeno-reagent-xeno-neuro-acid-clean-name
