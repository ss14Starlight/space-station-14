  color: "#1bdf7c"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          groups:
            Airloss: -12.5
            Burn: -12.5
            Brute: -12.5
            Toxin: -12.5
            Genetic: -12.5
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "Вы чувствуете как ваше тело восстанавливается" ]
        probability: 0.33
      - !type:GenericStatusEffect
        key: Stutter
        component: StutteringAccent
      - !type:Jitter
