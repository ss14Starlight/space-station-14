- type: entity
  id: XenoArtifactEffectJunkSpawn
  parent: BaseXenoArtifactEffect
  description: Spontaneous inorganic creation #Funky Edit add more mystery to sci
  components:
  - type: XAEApplyComponents
    applyIfAlreadyHave: true
    refreshOnReactivate: true
    components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:GroupSelector
        rolls: !type:RangeNumberSelector
          range: 1, 4
        children:
        - !type:NestedSelector
          tableId: GenericTrashItems
          weight: 35
        - !type:NestedSelector
          tableId: AllPlushiesTable
          weight: 1

