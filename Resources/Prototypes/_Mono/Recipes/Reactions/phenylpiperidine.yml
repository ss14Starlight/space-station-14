- type: reaction # this reaction is to prevent people from mixing fent and dylo for combat meds, and to serve as something to prevent mass crystallization
  id: PhenylpiperidineIncompatibility
  impact: High
  reactants:
    Phenylpiperidine:
      amount: 1
    Dylovene:
      amount: 1
  effects:
  - !type:Explosion
    explosionType: Default
    maxIntensity: 8 # Starlight, christ this was a death mix before
    intensityPerUnit: 0.35 # It's pretty much just slightly stronger than potassium and water now.
    intensitySlope: 4 # Starlight end
    maxTotalIntensity: 100

- type: reaction
  id: PhenylpiperidineSolidification
