- type: entity
  name: LWC Vector-35
  parent: [BaseWeaponSubMachineGun, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponSubMachineGunVector9x19mm
  description: A high-performance submachine gun chambered in .35 Auto, produced for security forces requiring compact automatic fire in confined environments. Its burst-control system and high cyclic rate make it effective in corridors, facilities, and other places where missing is expensive.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/SMGs/vector.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: GunWieldBonus
    minAngle: -5
    maxAngle: -5
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/SMGs/vector.rsi
  - type: Gun
    fireRate: 9
    selectedMode: Burst
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/atreides.ogg
    availableModes:
    - Burst
    - SemiAuto
    - FullAuto
    burstCooldown: 0.5
    burstFireRate: 14
    shotsPerBurst: 3
  - type: ItemSlots
    slots:
      gun_magazine:
         name: Magazine
         startingItem: MagazinePistolSubMachineGunSP
         insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
         ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
         priority: 2
         whitelist:
           tags:
            - MagazinePistolSubMachineGunSP
         whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
         name: Chamber
         priority: 1
         whitelist:
           tags:
            - CartridgePistol
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

