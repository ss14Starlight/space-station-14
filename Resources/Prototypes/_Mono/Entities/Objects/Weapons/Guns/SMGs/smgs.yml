- type: entity
  name: SKR-WS MLA-73
  parent: [BaseWeaponSubMachineGun, BaseGunWieldable,BaseSecurityContraband] 
  id: WeaponSubMachineGunMla73
  description: A lightweight, reliable submachine gun designed for close-quarters combat.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/SMGs/mla73.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Guns/SMGs/mla73.rsi
  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -34
  - type: Gun
    minAngle: 21
    maxAngle: 38
    angleIncrease: 5
    angleDecay: 20
    fireRate: 9.5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/atreides.ogg
  - type: ChamberMagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
         name: Magazine
         startingItem: MagazinePistolSubMachineGunSP
         insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
         ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
         priority: 2
         whitelist:
           tags:
            - MagazinePistolSubMachineGunSP
         whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
         name: Chamber
         priority: 1
         whitelist:
           tags:
            - CartridgePistol
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

