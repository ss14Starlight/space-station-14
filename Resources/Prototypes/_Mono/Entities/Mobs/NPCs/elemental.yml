# Phenylpiperidine slime - Removed cus it test fails and I don't really care enough to figure out why the linter hates it

- type: entity
  id: ReagentSlimePhenylpiperidine
  parent: ReagentSlime
  suffix: Phenylpiperidine
  components:
  - type: Bloodstream
    bloodReferenceSolution: # Starlight, no nubody
      reagents:
      - ReagentId: Phenylpiperidine
        Quantity: 200 # Starlight, double bloodstream capacity
  - type: PointLight
    color: "#b4dae0"
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/elemental.rsi
    layers:
      - map: [ "enum.DamageStateVisualLayers.Base" ]
        state: alive
        color: "#b4dae0"

