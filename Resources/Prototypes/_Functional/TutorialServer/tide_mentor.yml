- type: startingGear
  id: TutorialTideGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorGrey
    shoes: ClothingShoesColorBlack
    back: ClothingBackpackSatchel
    ears: ClothingHeadsetGrey
    mask: ClothingMaskGas
    id: PassengerPDA
    gloves: ClothingHandsGlovesColorYellow
    belt: ClothingBeltUtilityFilled

- type: entity
  parent: TutorialMentor
  id: TutorialTideMentor
  name: passenger
  suffix: Tutorial, Mentor, Tide
  categories: [ HideSpawnMenu ]
  components:
  - type: TutorialAppearance
    hair: HumanHairMessy
    facialHair: HumanFacialHairChin
    hairColor: "#4A3B2E"
  - type: Loadout
    prototypes: [TutorialTideGear]
  - type: Access
    tags:
    - Maintenance
  - type: Tag
    tags:
    - TutorialPracticeMob
    - TutorialTideTider
    - DoorBumpOpener
  - type: HTN
    rootTask:
      task: TutorialFollowCompound
    blackboard:
      FollowCloseRange: !type:Single
        0.5
      FollowRange: !type:Single
        1.0
      NavInteract: !type:Bool
        true
      NavDoors: !type:Bool
        true
      MinimumIdleTime: !type:Single
        0.5
      MaximumIdleTime: !type:Single
        1.5
  - type: TutorialMentor
    facing:
    - subGoalId: refused
      tag: TutorialTideHoP
    - subGoalId: security
      tag: TutorialTideSecOfficer
  - type: TutorialTrainer
    speakRange: 5
    startDelay: 0
    sessionStartDelay: 4
    minLineDelay: 3
    maxLineDelay: 5
    secondsPerCharacter: 0.075
    interjectionCooldown: 8
    silentSubGoals:
    - farewell
