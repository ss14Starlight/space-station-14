- type: entity
  parent: BaseStructure
  id: TutorialHolopad
  name: training holopad
  description: A floor-mounted projector. The facility's training intelligence uses it to be in two places at once.
  suffix: Tutorial
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        mask:
        - Impassable
  - type: TutorialHoloPoint
  - type: Sprite
    sprite: Structures/Machines/holopad.rsi
    drawdepth: HighFloorObjects
    snapCardinals: true
    layers:
    - state: base
    - map: [ "lights" ]
      state: blank
      shader: unshaded
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TutorialHoloPointVisuals.Active:
        lights:
          True: { state: lights_in_call }
          False: { state: blank }
  - type: PointLight
    radius: 2.0
    energy: 2.0
    color: "#afe1fe"
    enabled: false
  - type: AmbientSound
    enabled: false
    volume: -8
    range: 4
    sound:
      path: /Audio/Ambience/Objects/buzzing.ogg

- type: entity
  id: TutorialHoloMentor
  name: N.A.N.C.I.
  description: A holographic training intelligence. She is projected from the nearest holopad, and is very pleased you asked.
  suffix: Tutorial, Mentor
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Sprite # Layers are applied by Client.HolopadSystem from HolopadHologram below.
  - type: Appearance
  # No Clickable: holograms upstream are not clickable either, and there is nothing left to click
  # her for. Narration beats advance on a timer, the control overlay carries the keybind, and every
  # line she has already said is still sitting in the chat window.
  - type: HolopadHologram
    rsiPath: Mobs/Silicon/holograms.rsi
    rsiState: ai_face
    shaderName: Hologram
    color1: "#65b8e2"
    color2: "#3a6981"
    alpha: 0.9
    intensity: 2
    scrollRate: 0.125
    offset: 0, 0.45
  - type: TutorialMentor
  - type: TutorialTrainer
    speakRange: 3
    startDelay: 0
    sessionStartDelay: 4
    minLineDelay: 3
    maxLineDelay: 5
    secondsPerCharacter: 0.075
    lines:
    - subGoalId: welcome
      dialogue: tutorial-basics-nanci-welcome-1
    - subGoalId: welcome
      dialogue: tutorial-basics-nanci-welcome-2
    - subGoalId: welcome
      dialogue: tutorial-basics-nanci-welcome-3
    - subGoalId: welcome
      dialogue: tutorial-basics-nanci-welcome-4
    - subGoalId: move-any
      dialogue: tutorial-basics-nanci-move-any-1
    - subGoalId: move-any
      dialogue: tutorial-basics-nanci-move-any-2
      # "Please attempt to move."
      showControlHint: true
    - subGoalId: move-any
      dialogue: tutorial-basics-nanci-move-any-3
    - subGoalId: move-any
      dialogue: tutorial-basics-nanci-move-any-4
