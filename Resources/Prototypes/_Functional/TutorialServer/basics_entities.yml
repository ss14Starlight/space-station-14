# ReachMarker targets.
#
# Deliberately not parented to TutorialStepMarker: that one is a glowing pink cross meant to be
# seen, which suits the practice-room tutorials that stamp it down as a "stand here" pad. This
# curriculum tells the player where to go in N.A.N.C.I.'s own words and marks the destinations with
# floor decals, so the markers are pure geometry. MarkerBase gets that for free — Content.Client's
# MarkerSystem hides every Marker sprite unless `showmarkers` is on, which `mapping` turns on, so
# they stay visible in the editor and invisible in game. No PointLight, since the marker system only
# hides the sprite and a disembodied purple glow is worse than the cross was.
- type: entity
  abstract: true
  parent: MarkerBase
  id: TutorialBasicsMarker
  suffix: Tutorial, Basics
  components:
  - type: TutorialStepMarker
  - type: Sprite
    drawdepth: Overlays
    sprite: Markers/cross.rsi
    layers:
    - state: pink
      shader: unshaded

- type: entity
  parent: TutorialBasicsMarker
  id: TutorialMarkerBasicsPad1
  name: tutorial marker (basics-pad-1)
  description: Walk here to complete a tutorial objective. This one is the room 0 exit pad.
  suffix: Tutorial, Basics
  components:
  - type: TutorialStepMarker
    markerId: basics-pad-1

- type: entity
  parent: TutorialBasicsMarker
  id: TutorialMarkerBasicsPad2Entry
  name: tutorial marker (basics-pad-2-entry)
  description: Walk here to complete a tutorial objective. This one is the room 1 entry pad.
  suffix: Tutorial, Basics
