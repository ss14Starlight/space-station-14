- type: entity
  parent: MobHuman
  id: TutorialPracticeMob
  name: practice dummy
  description: A mindless training dummy for tutorial drills.
  suffix: Tutorial
  components:
  - type: TutorialPracticeMob
  # DoorBumpOpener comes from species_base and a child's Tag list replaces the parent's, so every
  # tutorial mob silently lost the ability to open a door by walking into it. Nothing complains:
  # the door simply never opens, and a walking coach paces in front of it until a player opens it
  # for him. Re-add it in any child that redeclares Tag, too.
  - type: Tag
    tags:
    - TutorialPracticeMob
    - DoorBumpOpener
  - type: NpcFactionMember
    factions: []
  # Mindless NPCs must not show the SSD ZZZ icon or fall asleep mid-tutorial.
  - type: SSDIndicator
    isSSD: false

- type: entity
  parent: TutorialPracticeMob
  id: TutorialPracticeMobDamaged
  suffix: Tutorial, Damaged
  components:
  - type: TutorialPracticeMob
    spawnDamage:
      types:
        Blunt: 30
        Slash: 10
        Heat: 20
  # Tag replaces parent list — keep TutorialPracticeMob.
  - type: Tag
    tags:
    - TutorialPracticeMob
    - TutorialPracticePatient

- type: entity
  parent: TutorialPracticeMob
