# Soft-following coach for single-grid tutorials (spawned by TutorialServerRuleSystem).
- type: entity
  parent: TutorialPracticeMob
  id: TutorialMentor
  name: Urist McMentor
  description: A friendly practice mentor who follows you and talks you through each step. Empty-hand click them to hurry them along.
  suffix: Tutorial, Mentor
  components:
  - type: Loadout
    prototypes: [VisitorLibrarian]
  - type: TutorialMentor
  - type: TutorialTrainer
  # No TypingIndicator here: the component reserves a sprite layer the moment it appears, and in a
  # prototype that is before the humanoid sprite has been built, which leaves the indicator sitting
  # at the wrong offset. Added after the body is dressed instead, in GiveTutorialMentor, which is
  # what the engine does for players (OnPlayerAttached).
  - type: InputMover
  - type: MobMover
  # No NavDoors here on purpose. A following coach works chamber maps, where a sealed gate really
  # does mean the player is unreachable and the follow system is right to give up and teleport.
  # Telling the pathfinder to route through it would leave him walking at a door that cannot open
  # instead. NavDoors belongs on coaches that lead, which work open station maps: see
  # TutorialTideMentor.
  - type: HTN
    rootTask:
      task: TutorialFollowCompound
    blackboard:
      FollowCloseRange: !type:Single
        2.0
      FollowRange: !type:Single
        3.0
      NavInteract: !type:Bool
        true
      MinimumIdleTime: !type:Single
        0.5
      MaximumIdleTime: !type:Single
        1.5

