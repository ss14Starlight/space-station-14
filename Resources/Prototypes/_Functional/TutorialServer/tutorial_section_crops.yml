# Hand-tuned AABB crops for TutorialServer section templates.
# origin = bottom-left tile on the source station grid; size = width,height in tiles.

# --- Saltern ---

- type: tutorialSectionCrop
  id: CropMedbay
  sourceMap: /Maps/saltern.yml
  output: /Maps/_Functional/TutorialServer/Sections/Medbay.yml
