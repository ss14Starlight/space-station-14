# Station-section room templates for TutorialServer.
# Source priority: Saltern/Packed crop → other station/salvage crop → fallbackRoom procedural.
# At runtime each template is stamped into N identical copies (one per curriculum goal).

- type: tutorialRoomTemplate
  id: TutorialSectionMedbay
  map: /Maps/_Functional/TutorialServer/Sections/Medbay.yml
  fallbackRoom: TutorialRoomMedical
  sourceNote: "Saltern medbay AABB crop"
  gateDoor: AirlockMedical
  # Natural public exit is south; east mid-edge lands through CMO / eng locks.
  stampDirection: South

