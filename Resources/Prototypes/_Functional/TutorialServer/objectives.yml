  name: Escape to CentComm alive and unrestrained
  description: Placeholder escape objective for practice.
  components:
  - type: Objective
    difficulty: 1
    issuer: TutorialSyndicate
    unique: false
    icon:
      sprite: Structures/Furniture/chairs.rsi
      state: shuttle
