- type: entity
  parent: BaseObjective
  id: TutorialTraitorKillPlaceholder
  name: Assassinate John Doe
  description: Placeholder traitor kill objective for practice. No real target exists.
  components:
  - type: Objective
    difficulty: 1
    issuer: TutorialSyndicate
    unique: false
    icon:
      sprite: Objects/Weapons/Guns/Pistols/viper.rsi
      state: icon
  - type: TutorialPlaceholderCondition

- type: entity
  parent: BaseObjective
  id: TutorialTraitorStealPlaceholder
  name: Steal the captain's antique laser gun
  description: Placeholder steal objective for practice. No real item is required.
  components:
  - type: Objective
    difficulty: 1
    issuer: TutorialSyndicate
    unique: false
    icon:
      sprite: Objects/Weapons/Guns/Battery/antiquelasergun.rsi
      state: base
  - type: TutorialPlaceholderCondition

- type: entity
  parent: BaseObjective
