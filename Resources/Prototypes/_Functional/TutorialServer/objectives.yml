# Live curriculum goals — one instance per goal, indexed via TutorialGoalCondition.GoalIndex
- type: entity
  parent: BaseObjective
  id: TutorialCurriculumGoal
  name: Tutorial objective
  description: Complete this tutorial goal.
  components:
  - type: Objective
    difficulty: 1
    issuer: TutorialCurriculum
    unique: false
    icon:
      sprite: Objects/Misc/books.rsi
      state: book_icon
  - type: TutorialGoalCondition
