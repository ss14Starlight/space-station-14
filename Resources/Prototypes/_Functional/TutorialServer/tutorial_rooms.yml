# Multi-chamber department practice suites.
# Chamber count is driven by each role's goal count at build time.
# Inter-chamber doors unlock when the next goal starts.

- type: tutorialRoom
  id: TutorialRoomCivilian
  chamberWidth: 7
  chamberHeight: 7
  floorTile: FloorSteel
  altFloorTile: FloorSteelCheckerLight
  wall: WallSolid
  light: AlwaysPoweredWallLight
  lightSpacing: 5
  windows: true
  doorSide: East
  door: TutorialAirlockMaint
  gateDoor: Airlock
  furniture:
  - room: 0
    id: TableWood
    offset: -1.5, 1
  - room: 0
    id: ChairWood
    offset: -1.5, 0
  - room: 0
    id: ChairWood
    offset: -0.5, 0
  - room: 1
    id: BenchComfy
    offset: 0, 1.5
  - room: 2
    id: TableCounterMetal
    offset: 0, 1.5
  - room: 4
    id: TableWood
    offset: 0, 1.5
  - room: 5
    id: TableCounterMetal
    offset: -1.5, 1.5

