# Mapper markers: the entities a hand-authored tutorial map is wired together with.
#
# Everything here is meant to be placed by hand in the editor, so nothing here carries
# HideSpawnMenu. A prototype the mapper cannot find in the spawn list is a prototype the mapper
# cannot use, and the per-instance fields these carry (room index, marker id) have no other way in
# short of editing map YAML by hand.

- type: entity
  parent: MarkerBase
  id: TutorialZoneOrigin
  name: tutorial zone origin
  description: Marks the practice-spawn chamber center on a tutorial room template.
  suffix: Tutorial, Marker
  components:
  - type: TutorialZoneOrigin
  - type: Sprite
    state: green

- type: entity
  parent: SpawnPointLatejoin
  id: TutorialRoomSpawnPoint
  name: tutorial room spawn
  suffix: Tutorial, Marker
  components:
  - type: TutorialSpawnPoint

# --- Walking coaches ----------------------------------------------------------
#
# Where a mentor with mentorMode: Lead walks to and waits in each section, and, because he is the
# thing the player is following, that section's reach marker as well: "go there" and "go to him"
# are one place, so one entity serves both.
#
# Deliberately not tied to any one curriculum. The numbered children below bake in the two fields
# that would otherwise have to be typed into every copy by hand, and their marker ids are generic
# for the same reason: a beat that says "catch up with the coach in section 3" is the same beat in
# every tutorial that has a coach who walks.
#
# Marker ids only have to be unique within one curriculum's map, so walk-0 .. walk-11 never collide.
- type: entity
  parent: MarkerBase
  id: TutorialWalkPoint
  name: tutorial walk point
  description: Where a leading mentor walks to. Set the room index and marker id, or place one of the numbered variants.
  suffix: Tutorial, Marker
  components:
  - type: TutorialWalkPoint
  - type: TutorialStepMarker
  - type: Sprite
    drawdepth: Overlays
    sprite: Markers/cross.rsi
    layers:
    - state: pink
      shader: unshaded

- type: entity
  parent: TutorialWalkPoint
  id: TutorialWalkPoint0
  suffix: Tutorial, Marker, Section 0
  components:
  - type: TutorialWalkPoint
    room: 0
  - type: TutorialStepMarker
    markerId: walk-0

- type: entity
