# Command crop zone origin sits in Cap quarters; HoP kit uses Saltern HoP-office offsets.
- type: tutorialRole
  id: TutorialHeadOfPersonnel
  mentorName: Urist McClipboard
  job: HeadOfPersonnel
  stub: false
  simplifiedEnvironment: true
  category: Command
  map: /Maps/_Functional/TutorialServer/Roles/HeadOfPersonnel.yml
  roomTemplate: TutorialSectionCommand
  guidebook: Command
  # Spawn on Saltern HoP spawn tile (inside office) — desk/windoor is not a walk-in door.
  spawnOffset: 1, -6
  practiceSpawns:
  # Locker already exists on the crop at ~(+2,-5); restock a filled one on that tile.
  - id: LockerHeadOfPersonnelFilled
    room: 0
    offset: 2, -5
  # Desk stamps live on the HoP tables (~y 1.5 crop-local).
  - id: RubberStampHop
    room: 0
    offset: 0.2, -7
  # Saltern ComputerId was at crop (9.5, 3.5) → offset (0, -5) from zone origin.
  - id: TutorialComputerId
    room: 0
    offset: 0, -5
  # HoP line west of the windoor — deskDropOffset on visitors targets TableGlass (7.5, 3.5).
  - id: TutorialHoPVisitorBotany
    room: 0
    offset: -4, -6
  - id: TutorialHoPVisitorChef
    room: 0
    offset: -4, -6.5
  - id: TutorialHoPVisitorJanitor
    room: 0
    offset: -4, -7
  - id: TutorialStepMarker
    room: 0
    offset: 1, -6
    marker: hop-pass
  goals:
  - id: welcome
    title: tutorial-job-head-of-personnel-goal-welcome
    subGoals:
    - id: intro
      text: tutorial-job-head-of-personnel-sg-intro
      complete: Acknowledge
  - id: office
    title: tutorial-job-head-of-personnel-goal-office
    subGoals:
    - id: hold-stamp
      text: tutorial-job-head-of-personnel-sg-stamp
      complete: HoldItem
      entity: RubberStampHop
  - id: ids
    title: tutorial-job-head-of-personnel-goal-ids
    subGoals:
    - id: id-console
      text: tutorial-job-head-of-personnel-sg-id-console
      complete: InteractTargetTag
      tag: TutorialIdConsole
    - id: write-tip
      text: tutorial-job-head-of-personnel-sg-write-tip
      complete: Acknowledge
    - id: hold-id-botany
      text: tutorial-job-head-of-personnel-sg-hold-id-botany
      complete: HoldItem
      entity: PassengerIDCard
    - id: write-botany
      text: tutorial-job-head-of-personnel-sg-write-botany
      complete: IdCardHasJob
      job: Botanist
    - id: write-chef
      text: tutorial-job-head-of-personnel-sg-write-chef
      complete: IdCardHasJob
      job: Chef
    - id: write-janitor
      text: tutorial-job-head-of-personnel-sg-write-janitor
      complete: IdCardHasJob
      job: Janitor
    - id: stamp-tip
      text: tutorial-job-head-of-personnel-sg-stamp-tip
      complete: Acknowledge
    - id: walk
      text: tutorial-job-head-of-personnel-sg-walk
      complete: ReachMarker
      marker: hop-pass
  - id: finish
    title: tutorial-job-head-of-personnel-goal-finish
    subGoals:
    - id: done
      text: tutorial-job-head-of-personnel-sg-done
      complete: Acknowledge
