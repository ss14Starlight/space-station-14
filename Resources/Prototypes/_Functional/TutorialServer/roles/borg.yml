    - id: chassis-tip
      text: tutorial-job-borg-sg-chassis-tip
      complete: Acknowledge
    - id: select-chassis
      text: tutorial-job-borg-sg-select-chassis
      hint: tutorial-job-borg-sg-select-chassis-hint
      complete: BorgTypeSelected
      marker: generic
  - id: modules
    title: tutorial-job-borg-goal-modules
    subGoals:
    - id: modules-tip
      text: tutorial-job-borg-sg-modules-tip
      complete: Acknowledge
    - id: select-tool-module
      text: tutorial-job-borg-sg-select-tool-module
