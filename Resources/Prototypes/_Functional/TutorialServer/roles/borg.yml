      complete: PlayerWiresPanelOpen
    - id: emagged
      text: tutorial-job-borg-sg-emagged
      complete: SiliconSubverted
    - id: new-laws
      text: tutorial-job-borg-sg-new-laws
      complete: Acknowledge
    - id: walk
      text: tutorial-job-borg-sg-walk
      complete: ReachMarker
      marker: borg-pass
  - id: finish
    title: tutorial-job-borg-goal-finish
    subGoals:
