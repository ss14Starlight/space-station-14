# Tutorial thief gear: ThiefGear storage (beacon + SatchelThief) plus clothes so pockets/back work.
- type: startingGear
  id: TutorialThiefGear
  parent: ThiefGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitColorGrey
    shoes: ClothingShoesColorBlack
    back: ClothingBackpack

- type: tutorialRole
  id: TutorialAntagThief
  mentorName: Urist McSticky
  job: Passenger
  antag: Thief
  stub: false
  simplifiedEnvironment: true
  category: Wizden antagonists
  name: tutorial-antag-thief-name
  startingGear: TutorialThiefGear
  roleLoadout: RoleSurvivalExtendedAntag
  roomTemplate: TutorialSectionBar
  guidebook: Thieves
  practiceSpawns:
  - id: LockerBoozeFilled
    room: 0
    offset: -2, 1
  - id: TutorialPracticeMobPickpocket
    room: 0
    offset: 0, -1
  # Secret door build kit (steel + rods + cable + cell + screwdriver)
  - id: SheetSteel10
    room: 0
    offset: 0.5, 0
  - id: PartRodMetal10
    room: 0
    offset: 0.8, 0
  - id: CableApcStack10
    room: 0
    offset: -0.5, 0
  - id: PowerCellSmall
    room: 0
    offset: -0.8, 0
  - id: Screwdriver
    room: 0
    offset: 0, -0.5
  - id: TutorialStepMarker
    room: 0
    offset: 0, -1.5
    marker: thief-pass
  goals:
  - id: welcome
    title: tutorial-antag-thief-goal-welcome
    subGoals:
    - id: intro
      text: tutorial-antag-thief-sg-intro
      complete: Acknowledge
  - id: kits
    title: tutorial-antag-thief-goal-kits
    subGoals:
    - id: kit-tip
      text: tutorial-antag-thief-sg-kit-tip
      hint: tutorial-antag-thief-sg-kit-hint
      stuckHint: tutorial-antag-thief-sg-kit-stuck
      complete: Acknowledge
    - id: get-kit-bag
      text: tutorial-antag-thief-sg-get-kit-bag
      hint: tutorial-antag-thief-sg-kit-hint
      stuckHint: tutorial-antag-thief-sg-kit-stuck
      complete: ObtainItem
      entity: ClothingBackpackSatchelSmugglerUnanchored
  - id: pickpocket
    title: tutorial-antag-thief-goal-pickpocket
    subGoals:
    - id: strip-tip
      text: tutorial-antag-thief-sg-strip-tip
      hint: tutorial-antag-thief-sg-strip-hint
      stuckHint: tutorial-antag-thief-sg-strip-stuck
      complete: Acknowledge
    - id: steal-pen
      text: tutorial-antag-thief-sg-steal-pen
      hint: tutorial-antag-thief-sg-strip-hint
      stuckHint: tutorial-antag-thief-sg-strip-stuck
      complete: ObtainItem
      entity: Pen
  - id: beacon
    title: tutorial-antag-thief-goal-beacon
    subGoals:
    - id: hold-beacon
      text: tutorial-antag-thief-sg-hold-beacon
      hint: tutorial-antag-thief-sg-beacon-hint
      stuckHint: tutorial-antag-thief-sg-beacon-stuck
      complete: HoldItem
      entity: ThiefBeacon
    - id: beacon-tip
      text: tutorial-antag-thief-sg-beacon-tip
      hint: tutorial-antag-thief-sg-beacon-hint
      stuckHint: tutorial-antag-thief-sg-beacon-stuck
      complete: Acknowledge
    - id: link-beacon
      text: tutorial-antag-thief-sg-link-beacon
      hint: tutorial-antag-thief-sg-beacon-hint
      stuckHint: tutorial-antag-thief-sg-beacon-stuck
      complete: ThiefBeaconLinked
  - id: secret-door
    title: tutorial-antag-thief-goal-secret-door
    subGoals:
    - id: door-tip
      text: tutorial-antag-thief-sg-door-tip
      hint: tutorial-antag-thief-sg-door-hint
      stuckHint: tutorial-antag-thief-sg-door-stuck
      complete: Acknowledge
    - id: hold-steel
      text: tutorial-antag-thief-sg-hold-steel
      complete: HoldItem
      entity: SheetSteel10
    - id: hold-rods
      text: tutorial-antag-thief-sg-hold-rods
      complete: HoldItem
      entity: PartRodMetal10
    - id: hold-screwdriver
      text: tutorial-antag-thief-sg-hold-screwdriver
      complete: HoldItem
      entity: Screwdriver
    - id: build-door
      text: tutorial-antag-thief-sg-build-door
      hint: tutorial-antag-thief-sg-door-hint
      stuckHint: tutorial-antag-thief-sg-door-stuck
      complete: MapHasEntity
      entity: SolidSecretDoor
    - id: walk
      text: tutorial-antag-thief-sg-walk
      complete: ReachMarker
      marker: thief-pass
  - id: finish
    title: tutorial-antag-thief-goal-finish
    subGoals:
    - id: done
      text: tutorial-antag-thief-sg-done
      complete: Acknowledge
