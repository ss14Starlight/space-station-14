# Engineering progression step 3/4 — distro, TEG, waste filtering.
- type: tutorialRole
  id: TutorialAtmosphericTechnician
  mentorName: Urist McPlasma
  job: AtmosphericTechnician
  stub: false
  category: Engineering
  map: /Maps/_Functional/TutorialServer/Roles/AtmosphericTechnician.yml
  roomTemplate: TutorialSectionAtmos
  guidebook: Engineering
  practiceSpawns:
  # FilledHardsuit includes ClothingOuterHardsuitAtmos (plain Filled does not).
  # Offset clear of the crop AtmosDrobe at chamber-relative (~-2,1).
  - id: LockerAtmosphericsFilledHardsuit
    room: 0
    offset: 2, -1
  - id: ClothingShoesBootsMag
    room: 0
    offset: 0.8, 0
  - id: GasAnalyzer
    room: 0
    offset: -0.5, 0
  - id: Wrench
    room: 0
    offset: -0.2, 0
  - id: SheetSteel10
    room: 0
    offset: 0.2, -0.5
  - id: TutorialGasCanisterOxygen
    room: 0
    offset: 1.5, -0.5
  - id: TutorialGasVentPump
    room: 1
    offset: -1.5, 0
  - id: TutorialGasVentScrubber
    room: 1
    offset: -0.5, 0
  - id: TutorialGasFilter
    room: 1
    offset: 1, 0
  - id: GasPressurePump
    room: 1
    offset: 1.5, -1
  - id: TutorialTegCenter
    room: 2
    offset: 0, 0
  - id: TutorialTegCirculator
    room: 2
    offset: -1, 0
  - id: TutorialTegCirculator
    room: 2
    offset: 1, 0
  - id: Multitool
    room: 2
    offset: 0.5, -1
  - id: TutorialStepMarker
    room: 2
    offset: 0, -1.5
    marker: atmos-pass
  goals:
  - id: welcome
    title: tutorial-job-atmospheric-technician-goal-welcome
    subGoals:
    - id: intro
      text: tutorial-job-atmospheric-technician-sg-intro
      complete: Acknowledge
  - id: kit
    title: tutorial-job-atmospheric-technician-goal-kit
    subGoals:
    - id: hold-suit
      text: tutorial-job-atmospheric-technician-sg-suit
      # ObtainItem: Z/Use quick-equips clothing without staying in-hand.
      complete: ObtainItem
      entity: ClothingOuterHardsuitAtmos
    - id: hold-magboots
      text: tutorial-job-atmospheric-technician-sg-magboots
      complete: ObtainItem
      entity: ClothingShoesBootsMag
    - id: use-magboots
      text: tutorial-job-atmospheric-technician-sg-use-magboots
      # Z/Use quick-equips clothing (boot swap); toggle is the item action.
      complete: ActionUsed
      entity: ActionToggleMagboots
    - id: hold-analyzer
      text: tutorial-job-atmospheric-technician-sg-analyzer
      complete: HoldItem
      entity: GasAnalyzer
    - id: scan-canister
      text: tutorial-job-atmospheric-technician-sg-scan
      complete: InteractTargetTag
      tag: TutorialGasCanister
  - id: distro
    enterRoom: 1
    title: tutorial-job-atmospheric-technician-goal-distro
    subGoals:
    - id: vent
      text: tutorial-job-atmospheric-technician-sg-vent
      complete: InteractTargetTag
      tag: TutorialDistroVent
    - id: scrubber
      text: tutorial-job-atmospheric-technician-sg-scrubber
      complete: InteractTargetTag
      tag: TutorialWasteScrubber
    - id: distro-tip
      text: tutorial-job-atmospheric-technician-sg-distro-tip
      complete: Acknowledge
  - id: waste
    title: tutorial-job-atmospheric-technician-goal-waste
    subGoals:
    - id: hold-wrench
      text: tutorial-job-atmospheric-technician-sg-wrench
      complete: HoldItem
      entity: Wrench
    - id: hold-steel
      text: tutorial-job-atmospheric-technician-sg-steel
      complete: HoldItem
      entity: SheetSteel10
    - id: place-pipes
      text: tutorial-job-atmospheric-technician-sg-place-pipes
      complete: MapHasEntity
      entity: GasPipeStraight
      minCount: 2
    - id: filter
      text: tutorial-job-atmospheric-technician-sg-filter
      complete: InteractTargetTag
      tag: TutorialGasFilter
    - id: filter-tip
      text: tutorial-job-atmospheric-technician-sg-filter-tip
      complete: Acknowledge
  - id: teg
    enterRoom: 2
    title: tutorial-job-atmospheric-technician-goal-teg
    subGoals:
    - id: hold-wrench-teg
      text: tutorial-job-atmospheric-technician-sg-wrench-teg
      complete: HoldItem
      entity: Wrench
    - id: circulator
      text: tutorial-job-atmospheric-technician-sg-circulator
      complete: InteractTargetTag
      tag: TutorialTegCirculator
    - id: teg
      text: tutorial-job-atmospheric-technician-sg-teg
      complete: InteractTargetTag
      tag: TutorialTeg
    - id: teg-power
      text: tutorial-job-atmospheric-technician-sg-teg-power
      complete: TegProducingPower
    - id: teg-tip
      text: tutorial-job-atmospheric-technician-sg-teg-tip
      complete: Acknowledge
    - id: walk
      text: tutorial-job-atmospheric-technician-sg-walk
      complete: ReachMarker
      marker: atmos-pass
  - id: finish
    title: tutorial-job-atmospheric-technician-goal-finish
    subGoals:
    - id: done
      text: tutorial-job-atmospheric-technician-sg-done
      complete: Acknowledge